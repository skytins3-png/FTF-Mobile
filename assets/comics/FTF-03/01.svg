<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07121a"/><stop offset="1" stop-color="#1e3442"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#060a0f"/><rect width="1080" height="1280" fill="url(#bg)"/><path d="M120 270 H960 V1180 H120Z" fill="#111d26" stroke="#607687" stroke-width="12"/><path d="M245 340 H835 V1180 H245Z" fill="#182a35" stroke="#8da0ad" stroke-width="8"/><circle cx="540" cy="560" r="210" fill="#153a52" stroke="#5ca5c7" stroke-width="12"/><path d="M360 550 Q470 430 590 470 T720 545 Q640 630 565 610 T430 675 Q380 640 360 550Z" fill="#4d8665"/><g transform="translate(120 920)"><circle cx="120" cy="80" r="58" fill="#e9c19f"/><path d="M65 77 Q75 18 124 20 Q175 23 178 90 Q146 62 115 62 Q86 62 65 77" fill="#22252a"/><path d="M58 155 Q120 120 182 155 L215 360 Q120 400 25 360Z" fill="#263f59"/><circle cx="360" cy="70" r="55" fill="#e7bea0"/><path d="M309 68 Q320 15 365 18 Q412 20 414 80 Q385 55 355 55 Q330 55 309 68" fill="#40302b"/><path d="M305 145 Q360 112 415 145 L440 345 Q360 382 280 345Z" fill="#394c62"/><circle cx="605" cy="90" r="56" fill="#e8c2a2"/><path d="M550 88 Q560 25 610 27 Q660 29 664 98 Q630 70 602 70 Q575 70 550 88" fill="#2c2a2a"/><path d="M548 165 Q605 128 662 165 L690 370 Q605 404 520 370Z" fill="#425d70"/></g><g filter="url(#s)"><path d="M60 70 Q60 35 120 35 H760 Q830 35 830 105 V305 Q830 370 760 370 H220 L145 435 L165 370 H120 Q60 370 60 305Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="110" y="130" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">회의실 문이 닫히면 기록은 외부로 나가지 않습니다.</text><text x="110" y="198" font-family="Arial" font-size="34">会议室大门关闭后，记录不得外传。</text><text x="110" y="265" font-family="Arial" font-size="31">Once the doors close, nothing leaves this room.</text></g><text x="690" y="760" font-family="Impact,Arial Black" font-size="90" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-6 690 760)">LOCK</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">재난 뒤, 약 200명의 과학자와 전문가가 지하 회의장에 모인다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">灾难之后，约两百名科学家与专家进入地下会议室。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">After the disaster, nearly 200 experts gather underground.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-03 · EARTH SURVIVAL PLAN · SCENE 01 / 26</text></svg>