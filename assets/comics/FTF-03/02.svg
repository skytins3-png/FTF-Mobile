<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#1d3342"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#060a0f"/><rect width="1080" height="1280" fill="url(#bg)"/><rect x="120" y="320" width="840" height="680" rx="28" fill="#10222d" stroke="#627a8b" stroke-width="10"/><rect x="190" y="390" width="700" height="300" rx="18" fill="#14394e" stroke="#4c95b4" stroke-width="7"/><path d="M285 545 Q385 430 500 480 T705 535 Q635 615 550 600 T390 650 Q315 625 285 545Z" fill="#548669"/><g fill="none" stroke="#8ed5ef" stroke-width="6"><path d="M230 760 H840"/><path d="M260 820 Q360 760 460 820 T660 820 T840 780"/></g><g transform="translate(130 910)"><circle cx="105" cy="70" r="55" fill="#e8bf9e"/><path d="M52 72 Q64 18 110 20 Q160 22 165 85 Q135 58 105 58 Q80 58 52 72" fill="#24262c"/><path d="M48 145 Q105 112 162 145 L190 360 Q105 395 20 360Z" fill="#2f495d"/><circle cx="340" cy="75" r="54" fill="#e2b895"/><path d="M288 74 Q302 20 345 22 Q390 24 395 84 Q366 58 338 58 Q315 58 288 74" fill="#48372f"/><path d="M285 148 Q340 115 395 148 L425 355 Q340 390 255 355Z" fill="#43596a"/><circle cx="615" cy="74" r="54" fill="#e7bea0"/><path d="M562 73 Q575 18 620 20 Q665 23 670 85 Q640 58 612 58 Q588 58 562 73" fill="#2b2c2f"/><path d="M560 148 Q615 115 670 148 L700 360 Q615 395 530 360Z" fill="#394f62"/></g><g filter="url(#s)"><path d="M55 55 Q55 25 115 25 H790 Q850 25 850 95 V300 Q850 365 775 365 H250 L165 430 L188 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">모든 피해 자료를 한 지도에 겹쳐 보죠. 공통 패턴이 있을 겁니다.</text><text x="105" y="192" font-family="Arial" font-size="33">把所有灾害数据叠加到同一张地图上，一定有共同模式。</text><text x="105" y="257" font-family="Arial" font-size="30">Overlay every disaster record. There must be a common pattern.</text></g><text x="720" y="740" font-family="Impact,Arial Black" font-size="85" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 720 740)">BEEP</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">비밀 회의실 대형 화면에 세계 재난 기록과 기후 모델이 하나씩 겹쳐진다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">秘密会议室的大屏幕上，全球灾害记录与气候模型逐层叠加。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">Global disaster records and climate models stack across the secure wall display.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-03 · EARTH SURVIVAL PLAN · SCENE 02 / 26</text></svg>