"182" font-family="Arial" font-size="31">我们需要的不是五十年后的计划，而是从今天开始执行。</text><text x="92" y="245" font-family="Arial" font-size="29">We don't need a plan for fifty years from now. We need one that starts today.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#73c9ff" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#73c9ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">전문가들은 지하 회의실의 홀로그램 지구 위에 식량·물·대피 거점을 겹쳐 표시한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">专家在全息地球上叠加粮食、水源与避难节点。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">Experts layer food, water and evacuation hubs across the holographic Earth.</text></g><text x="740" y="690" font-family="Impact,Arial Black" font-size="82" fill="#86ddff" stroke="#111" stroke-width="8" transform="rotate(-5 740 690)">BZZZT</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-03 · EARTH SURVIVAL PLAN · SCENE 04 / 26</text></svg>