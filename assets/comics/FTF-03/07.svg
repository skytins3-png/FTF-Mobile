<ellipse cx="250" cy="486" rx="34" ry="42" class="skin"/><path d="M215 475q6-63 72-39q17 6 18 42q-26-31-81-12z" class="hair"/><circle cx="238" cy="485" r="4" class="eye"/><circle cx="264" cy="485" r="4" class="eye"/><path d="M241 505q12 8 24 0" class="line"/><path d="M184 545q67-55 133 0v16H184z" class="coat"/>
<ellipse cx="812" cy="488" rx="34" ry="42" class="skin"/><path d="M775 468q13-58 78-25q14 8 9 42q-34-29-78-9z" class="hair"/><circle cx="801" cy="487" r="4" class="eye"/><circle cx="824" cy="487" r="4" class="eye"/><path d="M803 505q11 7 22-1" class="line"/><path d="M747 545q65-54 130 0v16H747z" class="coat"/>
<text x="850" y="390" class="fx" transform="rotate(-8 850 390)">BEEP! LINK!</text>

