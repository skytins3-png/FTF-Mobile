<ellipse cx="280" cy="1220" rx="30" ry="37" class="skin"/><path d="M250 1205q14-49 59-21q11 8 8 33q-29-18-62-5z" class="hair"/><circle cx="272" cy="1221" r="3" class="eye"/><circle cx="291" cy="1221" r="3" class="eye"/><path d="M234 1264q47-45 94 0v86h-94z" fill="#5b79ad" stroke="#17202b" stroke-width="4"/>
<ellipse cx="380" cy="1250" rx="23" ry="29" class="skin"/><path d="M356 1239q10-38 48-18l3 24q-25-12-48 1z" class="hair"/><circle cx="373" cy="1252" r="3" class="eye"/><circle cx="388" cy="1252" r="3" class="eye"/><path d="M345 1283q36-36 72 0v67h-72z" fill="#f0b05a" stroke="#17202b" stroke-width="4"/>
