<text x="92" y="307" class="small">WATER · POWER · SHELTER</text>
<rect x="520" y="278" width="480" height="205" rx="12" fill="#102034" stroke="#78d4ff" stroke-width="5"/>
<path d="M545 450h430M565 310v140M680 310v140M795 310v140M910 310v140" stroke="#34546c" stroke-width="3"/>
