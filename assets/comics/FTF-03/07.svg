<rect x="610" y="678" width="120" height="62" class="screen"/><text x="625" y="713" class="dark" style="font:900 18px Arial">SAFE WATER</text>
<circle cx="640" cy="805" r="45" fill="#242b34"/><circle cx="855" cy="805" r="45" fill="#242b34"/>
<path d="M925 720q58 3 72 61" stroke="#5aa9e6" stroke-width="14" fill="none"/>
