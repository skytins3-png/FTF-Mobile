<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17233b"/><stop offset="1" stop-color="#ef8a55"/></linearGradient>
 <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b42"/><stop offset="1" stop-color="#315d70"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4fa5c9"/><stop offset="1" stop-color="#9de5e5"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
 <style>
 .panel{stroke:#0b0e13;stroke-width:18}.cap{fill:#f8f2df;stroke:#111827;stroke-width:5}.bubble{fill:white;stroke:#151922;stroke-width:5}.ko{font:700 26px 'Noto Sans KR','Arial';fill:#10151e}.zh{font:600 21px 'Noto Sans SC','Arial';fill:#263448}.en{font:600 18px Arial;fill:#435266}.fx{font:900 italic 42px Impact,Arial;fill:#ffd95a;stroke:#10131a;stroke-width:3;paint-order:stroke}.small{font:700 16px Arial;fill:#d7ecff}.screen{fill:#9ce8ef;stroke:#122033;stroke-width:4}.skin{fill:#efc19f;stroke:#1a202b;stroke-width:4}.hair{fill:#19202a;stroke:#11151c;stroke-width:4}.coat{fill:#e8eef3;stroke:#17202b;stroke-width:4}.vest{fill:#f2a12c;stroke:#17202b;stroke-width:4}.line{stroke:#16202c;stroke-width:4;fill:none;stroke-linecap:round}.eye{fill:#151a22}.white{fill:#fff}.dark{fill:#142031}.red{fill:#e65454}.green{fill:#5cc98b}
 </style>
</defs>
<rect width="1080" height="1920" fill="#090d14"/>
<!-- title strip -->
<rect x="28" y="24" width="1024" height="112" rx="26" fill="#111a29" stroke="#82c8e8" stroke-width="4"/>
<text x="56" y="68" class="small" style="font-size:22px">FTF-03 · EARTH SURVIVAL PLAN · SCENE 07</text>
<text x="56" y="111" class="white" style="font:900 34px 'Noto Sans KR',Arial">현장 검증 — 생존망은 사람에게 닿아야 한다</text>

<!-- PANEL 1 command center -->
<rect class="panel" x="28" y="154" width="1024" height="392" rx="24" fill="url(#lab)"/>
<rect x="55" y="178" width="970" height="76" rx="18" class="cap"/>
<text x="78" y="211" class="ko">계획은 종이 위에서 끝나면 안 돼. 오늘 실제 도시에서 검증한다.</text>
<text x="78" y="237" class="zh">计划不能停在纸上。今天必须在真实城市里验证。</text>
