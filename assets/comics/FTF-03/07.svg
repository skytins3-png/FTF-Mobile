<rect x="315" y="1715" width="185" height="120" rx="12" fill="#172838" stroke="#8ce0f1" stroke-width="5" transform="rotate(-6 407 1775)"/>
<path d="M340 1795l35-30 28 12 38-47 35 20" stroke="#70ffbd" stroke-width="6" fill="none"/>
<rect x="560" y="1478" width="430" height="132" rx="22" class="cap" filter="url(#shadow)"/>
<text x="584" y="1515" class="ko">첫 현장 시험 통과. 이제 5년 장기 관찰 계획으로 간다.</text>
<text x="584" y="1547" class="zh">首次实地测试通过。下一步进入五年长期观察计划。</text>
<text x="584" y="1577" class="en">FIELD TEST PASSED. NEXT: FIVE-YEAR OBSERVATION.</text>
<text x="610" y="1800" class="fx">DAWN… RECORD… GO!</text>
