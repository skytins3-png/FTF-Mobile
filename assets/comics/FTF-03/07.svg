<ellipse cx="180" cy="800" rx="35" ry="43" class="skin"/><path d="M145 784q12-55 68-24l5 31q-32-17-67 3z" class="hair"/><circle cx="170" cy="799" r="4" class="eye"/><circle cx="193" cy="799" r="4" class="eye"/><path d="M128 854q53-57 108 0v87H128z" class="vest"/><path d="M136 870l92 0" stroke="#fff4a8" stroke-width="10"/>
<path d="M230 870q70 5 120-18" class="line" stroke-width="8"/>
<rect x="600" y="586" width="398" height="75" rx="20" class="bubble"/>
<text x="622" y="616" class="ko">식수 72시간 확보. 전력망도 안정화 중!</text><text x="622" y="643" class="en">72 HOURS OF WATER. GRID STABILIZING.</text>
<text x="760" y="900" class="fx">FLOW! CHARGE!</text>

<!-- PANEL 3 shelter drill -->
<rect class="panel" x="28" y="1018" width="1024" height="396" rx="24" fill="#263448"/>
<rect x="48" y="1038" width="984" height="356" rx="18" fill="#dfe7e4"/>
