<ellipse cx="790" cy="1210" rx="31" ry="39" class="skin"/><path d="M758 1196q8-48 57-25q14 8 10 35q-29-17-61-4z" class="hair"/><circle cx="780" cy="1211" r="3" class="eye"/><circle cx="801" cy="1211" r="3" class="eye"/><path d="M744 1253q49-45 99 0v98h-99z" class="coat"/><rect x="783" y="1275" width="20" height="52" class="red"/><rect x="767" y="1291" width="52" height="20" class="red"/>
<path d="M750 1280q-95 25-180 12" class="line" stroke-width="7"/>
<rect x="78" y="1048" width="650" height="82" rx="18" class="bubble"/>
<text x="99" y="1080" class="ko">대피는 명령이 아니라 선택을 돕는 시스템이어야 합니다.</text>
<text x="99" y="1107" class="zh">避难系统应该帮助人们做选择，而不是强迫。</text>
<text x="650" y="1370" class="fx" transform="rotate(-5 650 1370)">STEP! CHECK!</text>

