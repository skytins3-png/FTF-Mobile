<ellipse cx="255" cy="1670" rx="38" ry="46" class="skin"/><path d="M216 1652q14-62 75-28q14 9 10 43q-38-25-75-7z" class="hair"/><circle cx="244" cy="1671" r="4" class="eye"/><circle cx="270" cy="1671" r="4" class="eye"/><path d="M191 1730q64-62 128 0v140H191z" class="coat"/>
