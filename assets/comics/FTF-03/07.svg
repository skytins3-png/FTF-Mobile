<rect x="70" y="278" width="430" height="205" rx="12" fill="#0e1928" stroke="#78d4ff" stroke-width="5"/>
<path d="M95 420 L145 390 L205 408 L260 335 L320 350 L382 304 L465 330" stroke="#70ffbd" stroke-width="7" fill="none"/>
