<g fill="#ffe39a"><rect x="132" y="1622" width="24" height="28"/><rect x="180" y="1622" width="24" height="28"/><rect x="132" y="1680" width="24" height="28"/><rect x="180" y="1680" width="24" height="28"/><rect x="291" y="1570" width="26" height="30"/><rect x="352" y="1570" width="26" height="30"/><rect x="291" y="1631" width="26" height="30"/><rect x="352" y="1631" width="26" height="30"/></g>
<rect class="screen" x="58" y="1464" width="514" height="114" rx="18"/>
<text x="86" y="1505" fill="#dff8ff" font-size="21" font-weight="900">DAY 30 · LONG-DURATION TEST COMPLETE</text>
<text x="86" y="1543" fill="#8ff0b1" font-size="24" font-weight="900">WATER 61% · POWER 55% · MEDICAL 74% · COMMUNITY STABLE</text>
<!-- two leads at dawn -->
<ellipse class="skin" cx="713" cy="1711" rx="38" ry="44"/><path class="hair" d="M678 1698q12-55 68-27q16 8 9 39q-34-19-68-6z"/><path class="jacket" d="M647 1771q66-59 132 0v99H647z"/><ellipse class="skin2" cx="891" cy="1716" rx="37" ry="43"/><path class="hair" d="M856 1704q12-53 66-26q16 8 9 37q-33-18-65-6z"/><path class="vest" d="M827 1774q64-57 128 0v96H827z"/>
<rect class="bubble" x="594" y="1450" width="429" height="192" rx="18" filter="url(#shadow)"/>
<text class="ko" x="620" y="1489">30일. 아무도 구조를 기다리기만 하지 않았다.</text>
<text class="ko" x="620" y="1522">도시는 스스로 물을 만들고, 고치고, 돌봤다.</text>
<text class="zh" x="620" y="1555">30天。城市靠自己供水、修复、照护，没有只等救援。</text>
<text class="en" x="620" y="1588">THIRTY DAYS. THE CITY MADE WATER, REPAIRED ITSELF, AND CARED FOR PEOPLE.</text>
<text x="607" y="1842" fill="#fff3d0" font-size="22" font-weight="900">NEXT: CAN THIS NETWORK SURVIVE WHEN THE WEATHER ITSELF TURNS HOSTILE?</text>
<text class="fx" x="65" y="1854">DAY 30! STILL STANDING!</text>
</svg>