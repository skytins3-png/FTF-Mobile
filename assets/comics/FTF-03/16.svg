<rect x="510" y="718" width="185" height="205" rx="20" fill="#cbdde0" stroke="#1b2a31" stroke-width="7"/><circle cx="603" cy="780" r="48" fill="#79c9df" stroke="#274955" stroke-width="6"/><path d="M603 740q45 55 0 91q-45-36 0-91z" fill="#d7f7ff"/><path d="M695 822h118v32H695" fill="none" stroke="#86e1f2" stroke-width="16"/>
<!-- farmer character -->
<ellipse class="skin2" cx="790" cy="875" rx="34" ry="39"/><path class="hair" d="M758 864q10-49 59-24q15 7 8 34q-30-17-59-6z"/><path class="work" d="M732 928q58-52 116 0v39H732z"/><path d="M740 925l-45-54M839 924l44-66" stroke="#17212b" stroke-width="11" stroke-linecap="round"/>
<rect class="note" x="58" y="604" width="926" height="112" rx="18"/>
<text class="ko" x="84" y="640">식량은 온실에서, 물은 회수·정수해서 다시 순환한다.</text>
<text class="zh" x="84" y="674">食物来自温室，水经过回收与净化再次循环。</text>
<text class="en" x="84" y="706">FOOD COMES FROM THE GREENHOUSE; WATER IS RECOVERED, PURIFIED AND CYCLED.</text>
<rect class="bubble" x="690" y="730" width="313" height="126" rx="18"/>
<text class="ko" x="714" y="766">오늘 수확량 104%.</text><text class="ko" x="714" y="798">배급을 줄이지 않아도 돼!</text>
<text class="zh" x="714" y="829">今天产量104%，不用减配给！</text>
<text class="en" x="714" y="851">HARVEST 104%. NO RATION CUT.</text>
<text class="fx" x="430" y="957">FLOW! GROW! RECYCLE!</text>

<!-- PANEL 3: clinic + repair + child, human resilience -->
<rect class="panel" x="28" y="1005" width="1024" height="405" rx="24" fill="url(#shelter)"/>
<rect x="62" y="1090" width="325" height="242" rx="18" fill="#f2f5f3" stroke="#25323a" stroke-width="7"/>
<path d="M214 1120v90M169 1165h90" stroke="#d94f56" stroke-width="14"/>
<rect x="470" y="1122" width="250" height="176" rx="18" fill="#526470" stroke="#17212b" stroke-width="7"/><circle cx="535" cy="1210" r="43" fill="#28343c" stroke="#101820" stroke-width="7"/><circle cx="650" cy="1210" r="43" fill="#28343c" stroke="#101820" stroke-width="7"/><path d="M535 1167v86M492 1210h86M650 1167v86M607 1210h86" stroke="#8b9ca5" stroke-width="8"/>
<!-- medic -->
<ellipse class="skin" cx="262" cy="1303" rx="32" ry="37"/><path class="hair" d="M232 1292q10-46 56-23q14 7 8 32q-28-16-56-5z"/><path class="med" d="M208 1356q54-48 108 0v37H208z"/>
<!-- mechanic -->
<ellipse class="skin2" cx="592" cy="1320" rx="32" ry="37"/><path class="hair" d="M562 1309q10-46 56-23q14 7 8 32q-28-16-56-5z"/><path class="jacket" d="M538 1372q54-48 108 0v21H538z"/>
<path d="M645 1342l70-67" stroke="#26333a" stroke-width="13" stroke-linecap="round"/><circle cx="720" cy="1270" r="17" fill="none" stroke="#26333a" stroke-width="9"/>
<!-- child with drawing -->
<ellipse class="skin" cx="874" cy="1280" rx="30" ry="34"/><path class="hair" d="M846 1270q8-42 50-21q13 6 7 29q-25-14-50-4z"/><path d="M825 1330q49-43 98 0v63H825z" fill="#f1c86f" stroke="#17212b" stroke-width="4"/>
<rect x="815" y="1162" width="145" height="86" fill="#fff7dc" stroke="#493a2b" stroke-width="5" transform="rotate(4 887 1205)"/><path d="M836 1224l26-31 23 22 25-34 31 43" fill="none" stroke="#52a268" stroke-width="5"/><circle cx="925" cy="1187" r="10" fill="#f2be54"/>
<rect class="bubble" x="58" y="1028" width="555" height="144" rx="18"/>
<text class="ko" x="84" y="1065">병원도 수리팀도 멈추지 않는다. 아이들의 일상도 지킨다.</text>
<text class="zh" x="84" y="1099">医疗与维修不停摆，也要守住孩子们的日常生活。</text>
<text class="en" x="84" y="1133">CLINICS AND REPAIR CREWS KEEP MOVING — SO CHILDREN KEEP A NORMAL DAY.</text>
<rect class="note" x="684" y="1028" width="320" height="124" rx="18"/>
<text class="ko" x="710" y="1064">생존은 숫자만이 아니다.</text><text class="ko" x="710" y="1097">사람답게 버티는 것까지 포함한다.</text>
<text class="zh" x="710" y="1129">生存也意味着保持人的生活。</text>
<text class="fx" x="405" y="1381">FIX! CARE! LIVE!</text>

<!-- PANEL 4: day 30 dawn, resilient district -->
<rect class="panel" x="28" y="1430" width="1024" height="460" rx="24" fill="url(#dawn)"/>
<circle cx="902" cy="1530" r="83" fill="#ffd38b" opacity=".94"/>
<path d="M28 1780l115-93 98 58 105-126 116 102 104-83 118 93 103-68 165 117v110H28z" fill="#344f61" stroke="#1e303c" stroke-width="7"/>
