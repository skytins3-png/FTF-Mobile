<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="FTF-03 scene 16 thirty-day long-duration survival test">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#243748"/><stop offset="1" stop-color="#53606b"/></linearGradient>
 <linearGradient id="shelter" x2="1" y2="1"><stop stop-color="#e6edf0"/><stop offset="1" stop-color="#91aab2"/></linearGradient>
 <linearGradient id="greenhouse" x2="0" y2="1"><stop stop-color="#b8e6d0"/><stop offset="1" stop-color="#356f5e"/></linearGradient>
 <linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#1a334a"/><stop offset=".6" stop-color="#87a9b5"/><stop offset="1" stop-color="#f7c582"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".42"/></filter>
 <style>
 .panel{stroke:#050b12;stroke-width:16}.bubble{fill:#fff;stroke:#17212b;stroke-width:5}.note{fill:#f6ecd3;stroke:#493a2b;stroke-width:5}.ko{font:700 25px Arial,sans-serif;fill:#111a21}.zh{font:600 19px Arial,sans-serif;fill:#2b3942}.en{font:600 16px Arial,sans-serif;fill:#4d5b64}.fx{font:900 italic 40px Impact,Arial,sans-serif;fill:#ffd65b;stroke:#101820;stroke-width:3;paint-order:stroke}.skin{fill:#e5ad84;stroke:#18222b;stroke-width:4}.skin2{fill:#c98d68;stroke:#18222b;stroke-width:4}.hair{fill:#17212b;stroke:#0c1218;stroke-width:4}.jacket{fill:#375970;stroke:#17212b;stroke-width:4}.vest{fill:#e66b49;stroke:#17212b;stroke-width:4}.med{fill:#e8f1ef;stroke:#17212b;stroke-width:4}.work{fill:#687b48;stroke:#17212b;stroke-width:4}.screen{fill:#071e2b;stroke:#70d9ef;stroke-width:4}.green{fill:#81dfa3}.amber{fill:#ffd169}.red{fill:#ff756c}
 </style>
</defs>
<rect width="1080" height="1920" fill="#050a10"/>
<rect x="28" y="24" width="1024" height="112" rx="24" fill="#0c1926" stroke="#69d4ed" stroke-width="4"/>
<text x="56" y="66" fill="#ccefff" font-size="21" font-weight="700">FTF-03 · EARTH SURVIVAL PLAN · SCENE 16</text>
<text x="56" y="108" fill="white" font-size="34" font-weight="900">재난 30일 — 지치지 않는 생존망</text>

<!-- PANEL 1: day 17, command center fatigue -->
<rect class="panel" x="28" y="154" width="1024" height="405" rx="24" fill="url(#night)"/>
<rect class="screen" x="56" y="188" width="555" height="252" rx="18"/>
<path d="M92 245h480M92 300h480M92 355h480" stroke="#24566a" stroke-width="3"/>
<polyline points="105,345 175,315 240,332 310,270 390,300 455,245 555,266" fill="none" stroke="#84e0a1" stroke-width="8"/>
<text x="92" y="223" fill="#a8efff" font-size="19" font-weight="900">DAY 17 · WATER 63% · POWER 58% · MEDICAL 71%</text>
<rect x="88" y="385" width="135" height="24" rx="12" class="green"/><rect x="245" y="385" width="118" height="24" rx="12" class="amber"/><rect x="385" y="385" width="153" height="24" rx="12" class="green"/>
<!-- tired analyst -->
<ellipse class="skin" cx="738" cy="412" rx="40" ry="46"/><path class="hair" d="M701 399q13-58 72-29q17 9 10 41q-37-21-73-7z"/><path class="jacket" d="M668 477q70-62 140 0v66H668z"/><circle cx="724" cy="414" r="5"/><circle cx="752" cy="414" r="5"/><path d="M724 441q14 5 29 0" fill="none" stroke="#804b3a" stroke-width="5"/>
<!-- field leader -->
<ellipse class="skin2" cx="908" cy="422" rx="38" ry="44"/><path class="hair" d="M873 409q12-55 68-27q16 8 9 39q-34-19-68-6z"/><path class="vest" d="M842 483q66-59 132 0v60H842z"/>
<rect class="bubble" x="606" y="174" width="418" height="166" rx="20" filter="url(#shadow)"/>
<text class="ko" x="632" y="211">17일째. 장비보다 먼저 사람이 지친다.</text><text class="ko" x="632" y="244">교대조를 줄이면 생존망도 같이 무너져.</text>
<text class="zh" x="632" y="278">第17天。人比设备先疲惫，必须守住轮班制度。</text>
<text class="en" x="632" y="313">DAY 17. PEOPLE TIRE BEFORE MACHINES. PROTECT THE SHIFT ROTATION.</text>
<text class="fx" x="78" y="523">BEEP… DAY 17… HOLD!</text>

<!-- PANEL 2: food and water cycle -->
<rect class="panel" x="28" y="580" width="1024" height="405" rx="24" fill="url(#greenhouse)"/>
<path d="M58 842Q260 610 462 842V942H58z" fill="#d8f1e7" fill-opacity=".55" stroke="#d8fbf2" stroke-width="8"/>
