<rect class="bubble" x="594" y="178" width="424" height="172" rx="20" filter="url(#shadow)"/>
<text class="ko" x="618" y="216">42일째. 남은 양보다 중요한 건</text><text class="ko" x="618" y="249">‘매일 다시 만들어내는 능력’이야.</text>
<text class="zh" x="618" y="282">第42天。关键不是库存，而是每天持续再生。</text>
<text class="en" x="618" y="316">DAY 42. SURVIVAL NOW DEPENDS ON DAILY REGENERATION, NOT STOCKPILES.</text>
<text class="fx" x="70" y="526">COUNT! PLAN! HOLD!</text>

