<rect class="bubble" x="58" y="1029" width="580" height="118" rx="18"/>
<text class="ko" x="84" y="1065">정수 손실 8% 이하. 한 방울도 그냥 버리지 않는다.</text>
<text class="zh" x="84" y="1098">净水损耗控制在8%以下，一滴都不白白浪费。</text>
<text class="en" x="84" y="1130">PURIFICATION LOSS BELOW 8%. NOT A DROP IS WASTED.</text>
<rect class="bubble" x="655" y="1029" width="350" height="118" rx="18"/>
<text class="ko" x="679" y="1065">백신·인슐린 냉장 유지!</text><text class="zh" x="679" y="1098">疫苗与胰岛素冷链稳定！</text><text class="en" x="679" y="1130">VACCINE &amp; INSULIN COLD CHAIN: STABLE!</text>
<text class="fx" x="375" y="1386">FILTER! CHILL! PROTECT!</text>

<!-- PANEL 4: day 60 dawn and handoff -->
<rect class="panel" x="28" y="1430" width="1024" height="460" rx="24" fill="url(#sky)"/>
<circle cx="886" cy="1530" r="82" fill="#ffd18c" opacity=".95"/>
