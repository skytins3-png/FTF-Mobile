<ellipse class="skin" cx="960" cy="1762" rx="27" ry="32"/><path class="hair" d="M935 1752q8-39 46-20q12 6 7 27q-23-13-46-4z"/><path d="M916 1805q44-39 88 0v60H916z" fill="#d7a45d" stroke="#17212b" stroke-width="4"/>
<rect class="note" x="58" y="1456" width="930" height="165" rx="20" filter="url(#shadow)"/>
<text class="ko" x="84" y="1495">60일째. 식량·물·의약품은 바닥나지 않았다.</text><text class="ko" x="84" y="1529">도시는 ‘비축’이 아니라 ‘순환’으로 살아남는 법을 배웠다.</text>
<text class="zh" x="84" y="1562">第60天。粮食、水和药品没有耗尽，城市学会了靠循环生存。</text>
<text class="en" x="84" y="1596">DAY 60. FOOD, WATER AND MEDICINE HELD. THE CITY LEARNED TO SURVIVE BY CIRCULATION.</text>
<rect class="bubble" x="620" y="1635" width="380" height="105" rx="18"/>
<text class="ko" x="646" y="1672">다음 시험: 도시 간 자원 공유.</text><text class="zh" x="646" y="1703">下一关：城市之间共享资源。</text><text class="en" x="646" y="1732">NEXT: INTERCITY RESOURCE SHARING.</text>
<text class="fx" x="74" y="1850">DAY 60! CYCLE! SURVIVE!</text>
