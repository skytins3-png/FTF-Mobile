<ellipse class="skin" cx="915" cy="873" rx="29" ry="34"/><path class="hair" d="M889 862q8-41 49-21q13 7 7 29q-25-14-49-4z"/><path d="M869 918q47-43 94 0v49H869z" fill="#d5a45f" stroke="#17212b" stroke-width="4"/>
<rect class="note" x="58" y="604" width="945" height="112" rx="18"/>
<text class="ko" x="84" y="640">버리는 잎은 퇴비로, 남은 물은 다시 뿌리로. 온실은 하루도 멈추지 않는다.</text>
<text class="zh" x="84" y="673">废叶变成堆肥，余水回到根系；温室一天也不停。</text>
<text class="en" x="84" y="704">LEAVES BECOME COMPOST; WATER RETURNS TO THE ROOTS. THE GREENHOUSE NEVER STOPS.</text>
<text class="fx" x="420" y="956">GROW! SHARE! REPEAT!</text>

<!-- PANEL 3: water plant + clinic cold chain -->
<rect class="panel" x="28" y="1005" width="1024" height="405" rx="24" fill="url(#water)"/>
