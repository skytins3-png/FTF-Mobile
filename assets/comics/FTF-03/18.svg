<rect width="1080" height="1920" fill="#050a10"/>
<rect x="28" y="24" width="1024" height="112" rx="24" fill="#0c1926" stroke="#69d4ed" stroke-width="4"/>
<text x="56" y="66" fill="#ccefff" font-size="21" font-weight="700">FTF-03 · EARTH SURVIVAL PLAN · SCENE 18</text>
<text x="56" y="108" fill="white" font-size="33" font-weight="900">60일 기후 스트레스 — 식량·물·의약품을 끝까지 지켜라</text>

<!-- PANEL 1: day 42 resource command center -->
<rect class="panel" x="28" y="154" width="1024" height="405" rx="24" fill="url(#sky)"/>
<rect class="screen" x="60" y="182" width="525" height="218" rx="18"/>
<text x="84" y="220" fill="#ffd169" font-size="22" font-weight="900">DAY 42 / 60 · RESOURCE STRESS</text>
<text x="84" y="258" fill="#d8f4ff" font-size="18" font-weight="700">FOOD 61% · WATER 54% · MEDICINE 47%</text>
<text x="84" y="294" fill="#82e3a5" font-size="18" font-weight="700">GREENHOUSE OUTPUT +18% · RECYCLE LOOP 92%</text>
<text x="84" y="330" fill="#ff9a82" font-size="18" font-weight="700">COLD-CHAIN RESERVE: 18 DAYS</text>
<path d="M92 368h115l62-42 78 25 61-70 78 21 76-48" fill="none" stroke="#7fe8ff" stroke-width="7"/>
