<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#182a48"/><stop offset="1" stop-color="#f29a61"/></linearGradient><style>.p{stroke:#0a1018;stroke-width:16}.b{fill:#fff;stroke:#17202b;stroke-width:5}.n{fill:#f6eedb;stroke:#17202b;stroke-width:5}.ko{font:700 25px Arial;fill:#111827}.zh{font:600 20px Arial;fill:#263448}.en{font:600 17px Arial;fill:#435266}.fx{font:900 italic 40px Impact,Arial;fill:#ffd85e;stroke:#111827;stroke-width:3;paint-order:stroke}.skin{fill:#efbd98;stroke:#17202b;stroke-width:4}.hair{fill:#17202b;stroke:#111827;stroke-width:4}.coat{fill:#e9eef2;stroke:#17202b;stroke-width:4}.vest{fill:#ed9d31;stroke:#17202b;stroke-width:4}</style></defs><rect width="1080" height="1920" fill="#080d14"/><rect x="28" y="24" width="1024" height="110" rx="24" fill="#111c2b" stroke="#7fc9eb" stroke-width="4"/><text x="55" y="67" fill="#ccecff" font-size="21" font-weight="700">FTF-03 · EARTH SURVIVAL PLAN · SCENE 08</text><text x="55" y="108" fill="white" font-size="33" font-weight="900">도시 전체가 하나의 생존망이 되다</text><!-- panel1 --><rect class="p" x="28" y="154" width="1024" height="395" rx="24" fill="#1d3147"/><rect class="n" x="55" y="176" width="940" height="83" rx="18"/><text class="ko" x="78" y="208">현장 시험을 통과했다. 이제 구역별 생존망을 하나로 연결한다.</text><text class="zh" x="78" y="237">现场测试通过。现在把各区域生命网络连接起来。</text><g fill="#162435" stroke="#72d5ef" stroke-width="4"><rect x="75" y="290" width="220" height="175" rx="15"/><rect x="330" y="290" width="220" height="175" rx="15"/><rect x="585" y="290" width="220" height="175" rx="15"/><rect x="840" y="290" width="145" height="175" rx="15"/></g><g fill="#9ce8ef"><circle cx="185" cy="375" r="34"/><circle cx="440" cy="375" r="34"/><circle cx="695" cy="375" r="34"/><circle cx="910" cy="375" r="34"/></g><path d="M219 375H406M474 375H661M729 375H876" stroke="#71ffb2" stroke-width="12" stroke-linecap="round"/><text class="fx" x="650" y="520">LINK! LINK!</text><!-- panel2 --><rect class="p" x="28" y="570" width="1024" height="420" rx="24" fill="url(#dawn)"/><g fill="#35485c"><rect x="55" y="735" width="150" height="220"/><rect x="225" y="680" width="175" height="275"/><rect x="420" y="755" width="130" height="200"/><rect x="570" y="700" width="190" height="255"/><rect x="785" y="745" width="220" height="210"/></g><path d="M70 880 C260 820 430 920 610 850 S870 820 1010 860" fill="none" stroke="#4aa9d8" stroke-width="18"/><path d="M80 920 C280 870 460 955 650 895 S875 865 1000 900" fill="none" stroke="#f5cf58" stroke-width="13"/><!-- engineer --><ellipse class="skin" cx="250" cy="715" rx="36" ry="44"/><path class="hair" d="M214 700q10-58 69-28q15 8 10 39q-34-22-71-6z"/><path class="vest" d="M188 770q62-58 125 0v155H188z"/><ellipse class="skin" cx="700" cy="680" rx="36" ry="44"/><path class="hair" d="M663 665q12-58 70-28q15 9 9 40q-35-22-70-6z"/><path class="coat" d="M637 735q63-58 126 0v155H637z"/><rect class="b" x="390" y="595" width="610" height="91" rx="20"/><text class="ko" x="415" y="628">정수·전력·대피소가 동시에 살아 있습니다!</text><text class="en" x="415" y="657">WATER, POWER AND SHELTERS ARE LIVE TOGETHER.</text><text class="fx" x="710" y="950">FLOW! POWER!</text><!-- panel3 --><rect class="p" x="28" y="1010" width="1024" height="405" rx="24" fill="#d8e0dc"/><rect x="60" y="1040" width="960" height="340" rx="18" fill="#b7c5c5"/><path d="M70 1360L300 1080H770L1010 1360Z" fill="#dbe3df" stroke="#263442" stroke-width="5"/><rect x="450" y="1090" width="190" height="105" fill="#33495a"/><text x="480" y="1135" fill="white" font-size="23" font-weight="900">SHELTER B</text><!-- family and medic --><ellipse class="skin" cx="275" cy="1215" rx="31" ry="38"/><path class="hair" d="M244 1202q9-48 57-24q13 8 9 34q-28-17-59-5z"/><path d="M225 1260q50-48 101 0v92H225z" fill="#6582b4" stroke="#17202b" stroke-width="4"/><ellipse class="skin" cx="380" cy="1245" rx="24" ry="30"/><path class="hair" d="M356 1234q8-38 46-19q11 7 7 27q-24-13-48-3z"/><path d="M344 1280q37-37 74 0v72H344z" fill="#efb45f" stroke="#17202b" stroke-width="4"/><ellipse class="skin" cx="790" cy="1205" rx="32" ry="40"/><path class="hair" d="M758 1191q9-50 58-25q13 8 9 35q-30-18-60-5z"/><path class="coat" d="M738 1252q52-48 104 0v100H738z"/><rect class="b" x="85" y="1035" width="760" height="82" rx="18"/><text class="ko" x="108" y="1068">주민 확인 완료. 누구도 뒤에 남겨두지 않는다.</text><text class="zh" x="108" y="1096">居民确认完毕。一个人也不能落下。</text><text class="fx" x="650" y="1380">CHECK! READY!</text><!-- panel4 --><rect class="p" x="28" y="1435" width="1024" height="455" rx="24" fill="url(#dawn)"/><circle cx="860" cy="1545" r="72" fill="#ffd675"/><g fill="#243b4a"><rect x="60" y="1680" width="130" height="190"/><rect x="210" y="1625" width="160" height="245"/><rect x="390" y="1700" width="120" height="170"/><rect x="535" y="1640" width="175" height="230"/><rect x="735" y="1690" width="130" height="180"/><rect x="885" y="1655" width="125" height="215"/></g><ellipse class="skin" cx="260" cy="1660" rx="38" ry="46"/><path class="hair" d="M221 1644q12-61 74-30q16 9 10 43q-37-24-75-7z"/><path class="coat" d="M195 1720q65-61 130 0v150H195z"/><ellipse class="skin" cx="465" cy="1655" rx="38" ry="46"/><path class="hair" d="M426 1639q10-60 71-29q15 9 10 42q-36-23-73-7z"/><path class="coat" d="M400 1715q65-60 130 0v155H400z"/><rect x="315" y="1710" width="210" height="115" rx="12" fill="#15283a" stroke="#8ce0f1" stroke-width="5"/><text x="338" y="1750" fill="#8fffc3" font-size="20" font-weight="900">CITY NETWORK: STABLE</text><text x="338" y="1783" fill="white" font-size="17">5-YEAR OBSERVATION START</text><rect class="n" x="565" y="1465" width="430" height="128" rx="20"/><text class="ko" x="590" y="1500">오늘은 끝이 아니다.</text><text class="ko" x="590" y="1532">5년의 관찰이 지금 시작된다.</text><text class="en" x="590" y="1562">THE FIVE-YEAR WATCH BEGINS NOW.</text><text class="fx" x="680" y="1840">DAWN… GO!</text></svg>