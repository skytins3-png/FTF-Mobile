<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#081018"/><rect x="70" y="260" width="940" height="900" rx="30" fill="#122534" stroke="#6e8ea4" stroke-width="8"/><rect x="150" y="340" width="780" height="300" rx="20" fill="#0d3c54" stroke="#62b5d3" stroke-width="6"/><g fill="#69a579"><path d="M250 500 Q350 390 470 440 T720 490 Q620 600 500 580 T300 610Z"/></g><g stroke="#9bdcf3" stroke-width="5" fill="none"><path d="M190 740 H890"/><path d="M220 820 Q330 745 450 815 T700 800 T860 760"/></g><g transform="translate(140 900)"><circle cx="90" cy="70" r="52" fill="#e0b28d"/><path d="M38 75 Q48 20 94 20 Q140 20 147 82" fill="#25282c"/><path d="M25 140 Q90 110 155 140 L180 330 Q90 365 0 330Z" fill="#36495b"/><circle cx="360" cy="70" r="52" fill="#e5b691"/><path d="M308 75 Q320 22 365 22 Q410 22 418 82" fill="#553b31"/><path d="M295 140 Q360 108 425 140 L450 330 Q360 365 270 330Z" fill="#5c4250"/><circle cx="650" cy="70" r="52" fill="#d9aa87"/><path d="M598 75 Q610 20 655 20 Q700 20 708 82" fill="#2c2d31"/><path d="M585 140 Q650 110 715 140 L740 330 Q650 365 560 330Z" fill="#405467"/></g><path d="M55 45 H930 Q975 45 975 105 V300 Q975 355 915 355 H290 L200 420 L220 355 H115 Q55 355 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="95" y="118" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">생존 계획은 1년이 아니라 50년을 봐야 합니다.</text><text x="95" y="182" font-family="Arial" font-size="31">生存计划不能只看一年，必须看五十年。</text><text x="95" y="242" font-family="Arial" font-size="29">This survival plan must look fifty years ahead, not one.</text><text x="720" y="700" font-family="Impact,Arial Black" font-size="82" fill="#ffd65c" stroke="#111" stroke-width="8">BEEP</text><rect x="55" y="1470" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">회의장은 재난 대응에서 세대 단위 생존 전략으로 논의를 확장한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">会议从灾害应对扩大到跨世代生存战略。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">The council shifts from emergency response to a generational survival strategy.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-03 · EARTH SURVIVAL PLAN · SCENE 03 / 26</text></svg>