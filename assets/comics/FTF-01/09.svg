<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3c536a"/><stop offset=".55" stop-color="#d9774b"/><stop offset="1" stop-color="#1d2b38"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#0a0d11"/><rect width="1080" height="1320" fill="url(#sky)"/><path d="M0 760 Q220 700 430 770 T1080 735 V1320 H0Z" fill="#305d73"/><path d="M0 820 Q180 760 355 830 T760 800 T1080 845" fill="none" stroke="#b8e5ef" stroke-width="18" opacity=".7"/><g fill="#1c2630"><rect x="0" y="940" width="1080" height="380"/><rect x="60" y="650" width="170" height="300"/><rect x="260" y="600" width="130" height="340"/><rect x="420" y="700" width="220" height="240"/><rect x="700" y="620" width="145" height="320"/><rect x="870" y="560" width="150" height="380"/></g><g fill="#ffd65c"><rect x="92" y="690" width="26" height="34"/><rect x="143" y="690" width="26" height="34"/><rect x="296" y="650" width="24" height="34"/><rect x="750" y="670" width="28" height="40"/><rect x="916" y="615" width="30" height="42"/></g><path d="M0 1110 Q220 1020 430 1095 T1080 1080 V1320 H0Z" fill="#3e7185" opacity=".8"/><g transform="translate(110 1000)"><circle cx="120" cy="105" r="72" fill="#e4b48f"/><path d="M52 110 Q68 35 128 36 Q190 38 198 120 Q160 78 118 82 Q85 82 52 110" fill="#24262b"/><path d="M40 205 Q120 155 200 205 L235 470 Q120 520 5 470Z" fill="#36485b"/><rect x="83" y="242" width="75" height="145" rx="8" fill="#f2a93b"/><path d="M185 270 L325 220" stroke="#e4b48f" stroke-width="28" stroke-linecap="round"/><circle cx="360" cy="105" r="70" fill="#dca783"/><path d="M300 110 Q315 38 365 38 Q420 39 430 115 Q395 82 360 83 Q330 83 300 110" fill="#493a35"/><path d="M285 205 Q360 160 435 205 L475 470 Q360 515 245 470Z" fill="#5c3b46"/><path d="M320 300 L210 350" stroke="#dca783" stroke-width="26" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 50 Q55 20 115 20 H875 Q935 20 935 95 V320 Q935 380 860 380 H270 L175 450 L202 380 H115 Q55 380 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="95" y="120" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">해안 도로가 잠기기 전에 높은 곳으로 이동해야 해!</text><text x="95" y="186" font-family="Arial" font-size="31">海岸公路被淹之前，必须立刻转移到高处！</text><text x="95" y="248" font-family="Arial" font-size="29">We have to reach higher ground before the coast road floods!</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="20" fill="#11161b" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">폭풍 뒤 해수면이 도심 해안도로까지 밀려오고 주민들이 긴급 대피한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">风暴过后海水涌上沿海道路，居民开始紧急撤离。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">After the storm, seawater pushes into the coastal district as residents evacuate.</text></g><text x="690" y="880" font-family="Impact,Arial Black" font-size="88" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-7 690 880)">ROOOAR!</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-01 · EARTH'S WARNING · SCENE 09 / 26</text></svg>