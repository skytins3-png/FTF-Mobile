<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 150 separates dirty and clean harbor equipment routes to prevent recontamination after shared-gear decontamination">
