 <rect x="796" y="102" width="500" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1046" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1046">빨간 길은 미세오염 장비만, 초록 길은 검사·세척·봉인 완료 장비만 통과한다.</tspan><tspan x="1046" dy="24" font-size="14">红线只走待处理设备；绿线只允许检测、清洗并封签完成的设备。</tspan><tspan x="1046" dy="22" font-size="13">Red carries dirty gear. Green opens only after test, decon and seal.</tspan></text>
 <text x="812" y="493" font-family="Arial" font-size="25" font-weight="1000" fill="#15323f">SCAN! VERIFY! ONE-WAY FLOW!</text>
</g>

