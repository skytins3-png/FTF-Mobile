<text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="32" font-weight="900">FTF-01  #150  세척만으론 끝이 아니다 — 깨끗한 장비의 길을 따로 만든다</text>
<text x="900" y="49" fill="#c9f8ff" font-family="Arial" font-size="18" font-weight="800">DIRTY GATE → DECON → CLEAN GATE → SEALED STORAGE · 污洁分流</text>

