 <text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">세척 직후 새 봉인을 붙이고, 청결 전용 카트와 잠금 보관함으로 바로 이동한다.</tspan><tspan x="375" dy="24" font-size="14">清洗后立即重新封签，使用洁净专用推车并进入上锁储存区。</tspan><tspan x="375" dy="22" font-size="13">Fresh seal, clean-only cart, locked clean storage—no return through the dirty side.</tspan></text>
 <text x="62" y="967" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c" stroke="#17313a" stroke-width="1">DECON! SEAL! CLEAN CART! LOCK!</text>
</g>

