 <text x="311" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="311">장비를 깨끗이 씻어도, 같은 부두 바닥과 같은 카트로 돌아가면 다시 오염된다.</tspan><tspan x="311" dy="25" font-size="14">即使清洗干净，只要回到同一脏区和同一运输车，就可能再次污染。</tspan><tspan x="311" dy="23" font-size="13">Cleaning is not enough if clean gear returns through the same dirty route.</tspan></text>
 <path d="M585 105h145q18 0 18 18v76q0 18-18 18h-80l-28 25 8-25h-45q-18 0-18-18v-76q0-18 18-18z" fill="#fff1c8" stroke="#111" stroke-width="4"/>
 <text x="658" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="658">동선부터</tspan><tspan x="658" dy="24">갈라!</tspan><tspan x="658" dy="21" font-size="12">先分流！</tspan></text>
 <text x="55" y="496" font-family="Arial" font-size="26" font-weight="1000" fill="#ffe15c" stroke="#111" stroke-width="1">TRACE! SEPARATE! NO CROSSOVER!</text>
</g>

