 <linearGradient id="clean" x2="1" y2="1"><stop stop-color="#e8fff7"/><stop offset="1" stop-color="#8edbc0"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".45"/></filter>
