 <text x="1065" y="576" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1065">30일 감사: 공용장비 18/18 동선 기록, 청결·오염 교차 이동 0, 외래종 eDNA 0.</tspan><tspan x="1065" dy="25" font-size="14">30天审计：18/18设备全程可追踪，污洁交叉为0，外来种eDNA为0。</tspan><tspan x="1065" dy="23" font-size="13">30-day audit: 18/18 tracked, zero dirty-clean crossover, invasive eDNA zero.</tspan><tspan x="1065" dy="25" fill="#147557">토종 치어 지표 +39% — 깨끗한 길 자체가 방역 장비가 됐다.</tspan></text>
 <path d="M1339 552h146q17 0 17 17v89q0 17-17 17h-82l-31 29 9-29h-42q-17 0-17-17v-89q0-17 17-17z" fill="#d8fff0" stroke="#111" stroke-width="4"/>
 <text x="1412" y="583" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1412">이제 깨끗한</tspan><tspan x="1412" dy="23">장비는 깨끗한</tspan><tspan x="1412" dy="23">길만 간다.</tspan><tspan x="1412" dy="20" font-size="12">洁具走洁路</tspan></text>
 <text x="812" y="973" font-family="Arial" font-size="24" font-weight="1000" fill="#ffe15c" stroke="#082633" stroke-width="1">AUDIT! ZERO CROSSOVER! VERIFY! PROTECT!</text>
