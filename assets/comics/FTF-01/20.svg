ff" stroke="#111" stroke-width="8"/><text x="310" y="1148" font-family="Arial" font-size="34" fill="#111" font-weight="700">“아직 늦지 않았어.”</text><text x="310" y="1200" font-family="Arial" font-size="29" fill="#333">现在还不算太晚。</text><text x="310" y="1244" font-family="Arial" font-size="26" fill="#555">It is not too late yet.</text></g><g><rect x="78" y="1490" width="930" height="230" fill="#091018" opacity=".95" stroke="#d4dee9" stroke-width="5"/><text x="112" y="1558" font-family="Arial" font-size="38" fill="#ffe38a" font-weight="700">상황 설명 · 경고 뒤에는 선택이 남는다.</text><text x="112" y="1614" font-family="Arial" font-size="31" fill="#fff">도시는 에너지를 줄이고, 사람들은 대피 계획을 세운다.</text><text x="112" y="1662" font-family="Arial" font-size="28" fill="#c9d9e9">城市开始节能，人们制定新的避难计划。</text></g><text x="76" y="190" font-family="Arial" font-size="54" fill="#fff" font-weight="900">FTF-01 · 20 / 26</text><text x="760" y="260" font-family="Arial" font-size="72" fill="#8ce6ff" font-weight="900" transform="rotate(-5 760 260)">TURN!</text></svg>