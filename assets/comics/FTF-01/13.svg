<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#5a2430"/><stop offset="1" stop-color="#130e13"/></linearGradient><linearGradient id="fire" x2="0" y2="1"><stop stop-color="#fff09a"/><stop offset=".45" stop-color="#ff7b26"/><stop offset="1" stop-color="#9e1d14"/></linearGradient></defs><rect width="1080" height="1920" fill="#0c0e12"/><rect x="28" y="28" width="1024" height="1145" rx="28" fill="url(#sky)" stroke="#f3d4c2" stroke-width="6"/><g fill="#21181c"><path d="M28 750L170 520l90 230 120-290 125 300 120-240 120 230 125-280 182 300v403H28Z"/></g><g fill="url(#fire)"><path d="M90 960q80-230 140 0 40-190 110 5 65-250 130 0 45-190 100 10 80-290 160-5 50-170 100 10 70-230 140 0v190H90z"/></g><g transform="translate(190 670)"><circle cx="95" cy="96" r="42" fill="#c88c66"/><path d="M50 93q42-64 88 0V46q-42-45-88 2z" fill="#241d20"/><path d="M35 158q60-50 120 0l20 220H15z" fill="#d9e8ef"/><path d="M48 205h98l-12 75H60z" fill="#e9573f"/><path d="M18 235l-55 120M160 235l70 105" stroke="#c88c66" stroke-width="24" stroke-linecap="round"/></g><g transform="translate(455 745)"><circle cx="88" cy="78" r="36" fill="#d6a27e"/><path d="M52 78q35-50 72 0V38q-35-35-72 2z" fill="#3a2a25"/><path d="M34 130q50-40 104 0l17 175H18z" fill="#51677c"/></g><g transform="translate(680 705)"><circle cx="92" cy="88" r="40" fill="#b98161"/><path d="M50 87q40-60 82 0V44q-38-40-80 0z" fill="#211b1c"/><path d="M38 148q52-46 108 0l20 195H18z" fill="#f2c752"/><rect x="55" y="185" width="75" height="80" fill="#d74536"/></g><rect x="64" y="70" width="610" height="142" rx="20" fill="#111821e8" stroke="#ffc09b" stroke-width="3"/><text x="95" y="118" fill="#ffc29c" font-family="Arial" font-weight="700" font-size="34">SCENE 13 · FIRELINE</text><text x="95" y="165" fill="#fff" font-family="Arial" font-size="28">산불 대피구역 · 山火疏散区</text><path d="M608 390h385v238H608z" fill="#fff" stroke="#111" stroke-width="6" rx="22"/><path d="M668 628l-52 75 17-92z" fill="#fff" stroke="#111" stroke-width="5"/><text x="638" y="450" font-family="Arial" font-size="31" font-weight="700">“뒤돌아보지 마!”</text><text x="638" y="498" font-family="Arial" font-size="28">别回头，继续走！</text><text x="638" y="546" font-family="Arial" font-size="25">“Don’t look back—move!”</text><text x="730" y="930" fill="#ffe099" font-family="Arial" font-size="66" font-weight="900" transform="rotate(-8 730 930)">FWOOSH!</text><rect x="52" y="1210" width="976" height="265" rx="26" fill="#101925" stroke="#d5e6f6" stroke-width="4"/><text x="88" y="1275" fill="#9ed5ff" font-family="Arial" font-weight="700" font-size="30">상황 설명 · NARRATION</text><text x="88" y="1336" fill="#fff" font-family="Arial" font-size="34">강풍을 탄 불길이 산등성이를 넘어 마을로 내려왔다.</text><text x="88" y="1387" fill="#fff" font-family="Arial" font-size="32">구조대는 마지막 차량까지 대피로로 밀어냈다.</text><text x="88" y="1437" fill="#b8c8d8" font-family="Arial" font-size="26">野火越过山脊。The fire crosses the ridge.</text><rect x="52" y="1510" width="976" height="330" rx="26" fill="#1b1110" stroke="#ff855f" stroke-width="4"/><text x="86" y="1580" fill="#ff9b78" font-family="Arial" font-weight="700" font-size="29">지구의 경고 · EARTH’S WARNING</text><text x="86" y="1643" fill="#fff" font-family="Arial" font-size="35">“바람이 바뀌는 몇 분이, 삶과 죽음을 가른다.”</text><text x="86" y="1700" fill="#ffd5c6" font-family="Arial" font-size="30">“风向改变的几分钟，决定生死。”</text><text x="86" y="1757" fill="#ffd5c6" font-family="Arial" font-size="28">“A few minutes of wind can decide everything.”</text></svg>