<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc"><title id="title">FTF-01 #68 — 회복을 증명하는 바다</title><desc id="desc">Four-panel cinematic manga scene following scene 67: six-month reef survey, divers document stronger coral cover, juvenile fish return to the nursery, and the team renews its protection pledge. Korean Chinese English captions, dialogue bubbles, narration and visual sound effects.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8bdcff"/><stop offset="1" stop-color="#167faf"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#21c1dd"/><stop offset=".55" stop-color="#087a9f"/><stop offset="1" stop-color="#023b58"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffca78"/><stop offset=".6" stop-color="#f47e6d"/><stop offset="1" stop-color="#5b4b7d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter><style>.p{stroke:#071a2a;stroke-width:10}.box{fill:#fff;stroke:#10293e;stroke-width:4;filter:url(#shadow)}.ko{font:800 25px Arial,'Malgun Gothic',sans-serif}.zh{font:700 20px Arial,'Microsoft YaHei',sans-serif}.en{font:650 18px Arial,sans-serif}.fx{font:900 40px Impact,Arial;fill:#ffe85c;stroke:#07314a;stroke-width:8;paint-order:stroke}.line{stroke:#15374a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.tiny{font:700 17px Arial,sans-serif}</style></defs>
<!-- PANEL 1 survey deck --><rect class="p" x="4" y="4" width="760" height="500" fill="url(#sky)"/><path d="M4 325Q150 278 300 324T590 310T764 320V504H4Z" fill="#0a7ca7"/><path d="M430 90h255l-42 190H390Z" fill="#f7fbff" stroke="#173a4d" stroke-width="7"/><path d="M500 45h105v55H500Z" fill="#dceef5" stroke="#173a4d" stroke-width="6"/><text x="445" y="150" font-size="23" font-weight="900" fill="#145475">CLEAN OCEAN • BRIGHTER TOMORROW</text><circle cx="185" cy="305" r="55" fill="#efb48a" stroke="#20333f" stroke-width="5"/><path d="M132 292q18-74 70-44q39 20 39 68" fill="#1b2b37"/><path d="M115 365q72-44 143 0l34 139H82Z" fill="#17425c"/><circle cx="340" cy="315" r="52" fill="#dda37f" stroke="#20333f" stroke-width="5"/><path d="M293 302q15-70 65-42q37 21 37 66" fill="#172732"/><path d="M275 372q70-40 136 0l34 132H242Z" fill="#17384e"/><rect x="465" y="315" width="245" height="135" rx="12" fill="#082e45" stroke="#bff5ff" stroke-width="5"/><path d="M490 410l35-26 28 10 35-54 30 18 42-66" fill="none" stroke="#65ffb1" stroke-width="7"/><text x="485" y="348" class="tiny" fill="#fff">CORAL COVER</text><text x="590" y="400" font-size="38" font-weight="900" fill="#7dff9e">+35%</text><rect class="box" x="18" y="18" width="420" height="145" rx="10"/><text x="38" y="55" class="ko">6개월 후, 복원 산호를 다시 조사합니다.</text><text x="38" y="90" class="zh">六个月后，我们再次调查修复珊瑚。</text><text x="38" y="124" class="en">Six months later, we survey the restored reef again.</text><ellipse class="box" cx="265" cy="225" rx="190" ry="64"/><text x="127" y="215" class="ko">산호 피복률이 35% 늘었어요!</text><text x="148" y="248" class="en">Coral cover is up by 35%!</text><text x="28" y="478" class="fx">DATA SHOWS HOPE!</text>
<!-- PANEL 2 reef health --><rect class="p" x="772" y="4" width="760" height="500" fill="url(#sea)"/><g fill="#f08a71" stroke="#7a4143" stroke-width="4"><path d="M820 480q5-155 48-180q47 33 20 180Z"/><path d="M925 480q-5-170 46-195q55 38 22 195Z"/><path d="M1100 480q0-145 47-175q48 35 22 175Z"/><path d="M1295 480q0-165 51-190q52 42 20 190Z"/></g><g fill="#ffd854" stroke="#634b16" stroke-width="3"><ellipse cx="1030" cy="150" rx="42" ry="20"/><ellipse cx="1150" cy="205" rx="35" ry="17"/><ellipse cx="1390" cy="135" rx="38" ry="18"/></g><path d="M1410 90q70 8 86 60q-48 42-100 8q-25-18 14-68Z" fill="#6fc5a0" stroke="#174b4e" stroke-width="5"/><circle cx="930" cy="310" r="50" fill="#edaf87" stroke="#20333f" stroke-width="5"/><path d="M883 296q18-69 68-41q35 22 35 66" fill="#182834"/><path d="M855 367q75-42 145 0l38 137H820Z" fill="#13374f"/><ellipse cx="930" cy="310" rx="61" ry="38" fill="none" stroke="#c8f1ff" stroke-width="9"/><circle cx="1220" cy="318" r="48" fill="#dda27c" stroke="#20333f" stroke-width="5"/><path d="M1174 305q16-67 65-40q34 21 34 64" fill="#182731"/><path d="M1148 372q69-40 138 0l35 132h-207Z" fill="#143a50"/><ellipse cx="1220" cy="318" rx="58" ry="36" fill="none" stroke="#c8f1ff" stroke-width="9"/><rect class="box" x="790" y="18" width="455" height="140" rx="10"/><text x="810" y="55" class="ko">산호가 두꺼워지고 색도 선명해졌어요.</text><text x="810" y="90" class="zh">珊瑚更健壮，颜色也更鲜明了。</text><text x="810" y="124" class="en">The corals are stronger and more vibrant.</text><ellipse class="box" cx="1240" cy="215" rx="220" ry="62"/><text x="1103" y="202" class="ko">생물 다양성도 눈에 띄게 늘었어요!</text><text x="1115" y="238" class="en">Biodiversity has clearly increased!</text><text x="1030" y="466" class="fx">WOW! MORE LIFE!</text>
<!-- PANEL 3 nursery return --><rect class="p" x="4" y="512" width="760" height="508" fill="url(#sea)"/><g fill="#f08c73"><path d="M65 995q0-140 42-180q43 32 18 180Z"/><path d="M190 995q0-120 40-155q42 29 18 155Z"/><path d="M615 995q0-150 48-190q47 34 20 190Z"/></g><rect x="245" y="790" width="310" height="130" rx="8" fill="none" stroke="#d8f4ff" stroke-width="9"/><path d="M260 835h280M300 790v130M400 790v130M500 790v130" stroke="#d8f4ff" stroke-width="5"/><text x="308" y="950" font-size="22" font-weight="900" fill="#fff">CORAL NURSERY</text><g fill="#ffd852" stroke="#654b11" stroke-width="3"><ellipse cx="180" cy="705" rx="32" ry="15"/><ellipse cx="250" cy="670" rx="27" ry="13"/><ellipse cx="335" cy="700" rx="36" ry="17"/><ellipse cx="470" cy="655" rx="30" ry="14"/><ellipse cx="555" cy="705" rx="34" ry="16"/></g><path d="M80 750q95-50 175 0" fill="none" stroke="#a9ecff" stroke-width="5" stroke-dasharray="12 10"/><rect class="box" x="18" y="530" width="455" height="145" rx="10"/><text x="38" y="568" class="ko">어린 물고기들이 산호 보육장으로 돌아옵니다.</text><text x="38" y="603" class="zh">幼鱼正在回到珊瑚育苗区。</text><text x="38" y="638" class="en">Young fish are returning to the coral nursery.</text><ellipse class="box" cx="555" cy="640" rx="175" ry="60"/><text x="447" y="630" class="ko">이곳이 다시 집이 됐어요!</text><text x="451" y="664" class="en">This is home again!</text><text x="35" y="980" class="fx">SWIM! GROW! RETURN!</text>
<!-- PANEL 4 pledge at sunset --><rect class="p" x="772" y="512" width="760" height="508" fill="url(#sunset)"/><path d="M772 805q185-64 360-6t400-12v233H772Z" fill="#0b6f95"/><circle cx="930" cy="760" r="50" fill="#efb58b" stroke="#213541" stroke-width="5"/><path d="M882 747q17-69 68-41q36 22 36 64" fill="#1b2b36"/><path d="M855 815q72-42 145 0l38 205H820Z" fill="#163f58"/><circle cx="1070" cy="755" r="49" fill="#dda27e" stroke="#213541" stroke-width="5"/><path d="M1023 742q17-68 68-40q36 22 36 64" fill="#172731"/><path d="M995 812q72-40 143 0l35 208H960Z" fill="#17384d"/><circle cx="1215" cy="764" r="48" fill="#efb28a" stroke="#213541" stroke-width="5"/><path d="M1169 751q15-67 65-40q35 20 35 63" fill="#26333b"/><path d="M1142 820q68-38 136 0l34 200h-205Z" fill="#173e58"/><circle cx="1350" cy="770" r="47" fill="#e3a77f" stroke="#213541" stroke-width="5"/><path d="M1305 757q17-65 62-38q34 20 34 61" fill="#182732"/><path d="M1280 824q64-36 126 0l32 196h-190Z" fill="#14374c"/><path d="M930 842l75 55M1070 840l-55 58M1215 846l70 45M1350 850l-65 42" class="line"/><rect class="box" x="790" y="530" width="510" height="150" rx="10"/><text x="810" y="568" class="ko">회복은 끝이 아니라, 지켜야 할 약속의 시작입니다.</text><text x="810" y="603" class="zh">恢复不是终点，而是守护承诺的开始。</text><text x="810" y="638" class="en">Recovery is not the end — it is the start of our promise.</text><ellipse class="box" cx="1190" cy="705" rx="230" ry="62"/><text x="1036" y="694" class="ko">오늘도, 내일도 함께 지켜요!</text><text x="1048" y="728" class="en">Protect it today and tomorrow!</text><text x="900" y="980" class="fx">PROTECT TODAY! BRIGHTER TOMORROW!</text></svg>