<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 86 - 다시 노래하는 바다</title>
<desc id="desc">Four-panel cinematic manga scene. A humpback whale breaches beside the research vessel, a diver witnesses returning turtles rays and fish, researchers verify strong biodiversity recovery, and children promise to protect the living ocean at sunset. Korean Chinese English narration, speech bubbles and visual sound effects.</desc>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78c9f4"/><stop offset="1" stop-color="#e9f8ff"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16a3cf"/><stop offset=".55" stop-color="#0876a7"/><stop offset="1" stop-color="#043b63"/></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28b9d8"/><stop offset=".45" stop-color="#0879aa"/><stop offset="1" stop-color="#032c55"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd86f"/><stop offset=".45" stop-color="#ff9974"/><stop offset="1" stop-color="#6876a4"/></linearGradient><style>.panel{stroke:#071923;stroke-width:8}.box{fill:#fff;stroke:#071923;stroke-width:4}.bub{fill:#fff;stroke:#071923;stroke-width:4}.ko{font:700 21px Arial,sans-serif;fill:#071923}.zh{font:600 16px Arial,sans-serif;fill:#15313f}.en{font:600 15px Arial,sans-serif;fill:#193845}.fx{font:900 34px Impact,Arial,sans-serif;fill:#fff;stroke:#07598c;stroke-width:7;paint-order:stroke;letter-spacing:1px}.line{stroke:#071923;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.skin{fill:#efbd96;stroke:#071923;stroke-width:3}.hair{fill:#2b1b18;stroke:#071923;stroke-width:3}.uniform{fill:#153f59;stroke:#071923;stroke-width:3}.cap{fill:#0f3048;stroke:#071923;stroke-width:3}.eye{fill:#0b1b23}.tiny{font-size:14px}</style></defs>
<g class="panel"><rect x="4" y="4" width="592" height="386" fill="url(#sky)"/><path d="M4 238q120-22 236 12t356-2v142H4Z" fill="url(#sea)"/><path d="M4 214q70-55 142-6 64-47 135 3 52-34 109 7v29H4Z" fill="#6e96a1" opacity=".72"/><path d="M347 196h181l48 40-17 66H322l-14-37 39-69Z" fill="#f7fbfc" stroke="#071923" stroke-width="5"/><rect x="405" y="155" width="105" height="45" fill="#f7fbfc" stroke="#071923" stroke-width="4"/><rect x="417" y="164" width="34" height="22" fill="#9be5fb" stroke="#071923" stroke-width="3"/><rect x="457" y="164" width="34" height="22" fill="#9be5fb" stroke="#071923" stroke-width="3"/><path d="M306 302h261l-25 35H330Z" fill="#154e70" stroke="#071923" stroke-width="5"/><text x="354" y="261" font-family="Arial" font-size="16" font-weight="900" fill="#173d56">FTF OCEAN RESEARCH</text><path d="M106 253q-20-82 44-139 39-34 92-24 50 10 76 54 14 24 16 61-35-18-72-22-12 47-59 67-47 20-97 3Z" fill="#40596d" stroke="#071923" stroke-width="6"/><path d="M165 113q35 4 58 27 14 14 19 35-38-10-77-3-26-17-37-43 15-12 37-16Z" fill="#e6edf0" stroke="#071923" stroke-width="4"/><path d="M119 249q-42 2-72 34 47 17 89 0" fill="#40596d" stroke="#071923" stroke-width="5"/><path d="M286 182q54-33 91-2-35 27-82 30" fill="#40596d" stroke="#071923" stroke-width="5"/><circle cx="235" cy="119" r="5" fill="#0b1b23"/><g fill="none" stroke="#eafcff" stroke-width="9" stroke-linecap="round"><path d="M93 275q-38-30-52-75"/><path d="M142 284q5-54 2-94"/><path d="M204 273q25-40 43-80"/><path d="M260 262q41-25 66-59"/></g><ellipse cx="432" cy="310" rx="27" ry="30" class="skin"/><path d="M406 305q8-39 35-25 21 10 18 33-24-10-53-8Z" class="hair"/><path d="M397 341q35-16 70 0l8 47H390Z" class="uniform"/><ellipse cx="505" cy="309" rx="27" ry="30" class="skin"/><path d="M479 304q8-39 35-25 21 10 18 33-24-10-53-8Z" class="hair"/><path d="M470 340q35-16 70 0l8 48H463Z" class="uniform"/><path d="M449 298l34-7" class="line"/><circle cx="491" cy="289" r="9" fill="#1d2930" stroke="#071923" stroke-width="3"/><rect class="box" x="17" y="17" width="350" height="96" rx="10"/><text x="31" y="47" class="ko">1. 상처 입었던 바다에 다시 노래가 울립니다.</text><text x="31" y="72" class="zh">曾经受伤的海洋，再次响起生命的歌声。</text><text x="31" y="97" class="en">The wounded ocean begins to sing again.</text><path class="bub" d="M349 88h223q15 0 15 15v72q0 15-15 15h-92l-21 20 4-20h-114q-15 0-15-15v-72q0-15 15-15Z"/><text x="365" y="118" class="ko">와! 혹등고래가 돌아왔어요!</text><text x="365" y="142" class="zh tiny">哇！座头鲸回来了！</text><text x="365" y="165" class="en tiny">A humpback whale is back!</text><text x="35" y="356" class="fx" transform="rotate(-6 35 356)">WHOOOSH!</text></g>
<g class="panel"><rect x="604" y="4" width="592" height="386" fill="url(#deep)"/><path d="M604 330q67-34 132-12 58-39 132-8 70-32 132 4 85-36 196 3v73H604Z" fill="#6b594d"/><g stroke="#071923" stroke-width="3"><path d="M665 331q-10-56 16-83 12 29 5 85" fill="#f08e5f"/><path d="M703 332q12-63 41-85-2 37-17 87" fill="#f3c65b"/><path d="M1040 335q-8-62 21-90 13 33 4 91" fill="#e97665"/><path d="M1082 336q17-58 45-75-1 37-20 77" fill="#efc66c"/></g><ellipse cx="962" cy="194" rx="37" ry="41" class="skin"/><path d="M927 187q10-52 46-33 27 13 21 47-29-14-67-14Z" class="hair"/><path d="M911 235q53-26 105 0l32 102H881Z" fill="#111b28" stroke="#071923" stroke-width="5"/><ellipse cx="961" cy="193" rx="30" ry="22" fill="#8dddf4" fill-opacity=".5" stroke="#071923" stroke-width="5"/><circle cx="950" cy="193" r="4" class="eye"/><circle cx="971" cy="193" r="4" class="eye"/><path d="M1005 253q70 12 104 50" fill="none" stroke="#071923" stroke-width="12" stroke-linecap="round"/><path d="M919 257q-43 27-69 72" fill="none" stroke="#071923" stroke-width="11" stroke-linecap="round"/><path d="M1029 245v88" stroke="#6f8791" stroke-width="25" stroke-linecap="round"/><ellipse cx="760" cy="244" rx="63" ry="39" fill="#79a85b" stroke="#071923" stroke-width="5"/><circle cx="823" cy="238" r="22" fill="#8fb66b" stroke="#071923" stroke-width="4"/><path d="M719 220q-45-34-67-16 21 40 64 51M719 263q-46 24-61 54 49 8 76-26" fill="#8fb66b" stroke="#071923" stroke-width="4"/><path d="M779 209q34-31 57-24-4 36-35 55" fill="#8fb66b" stroke="#071923" stroke-width="4"/><g fill="none" stroke="#526f42" stroke-width="3"><path d="M724 226q35 32 72 4"/><path d="M729 257q32-31 68-5"/><path d="M745 211q2 56 34 67"/></g><path d="M676 153q70-40 138 0-30 47-70 49-39-1-68-49Z" fill="#556b7d" stroke="#071923" stroke-width="5"/><path d="M744 198q-5 49 22 67" fill="none" stroke="#071923" stroke-width="5"/><g fill="#f7c64d" stroke="#071923" stroke-width="2"><path d="M857 118q25-15 47 0-22 19-47 0l-14 10 3-20Z"/><path d="M913 104q22-13 42 0-19 17-42 0l-12 8 3-17Z"/><path d="M1090 145q27-16 49 0-22 20-49 0l-14 10 3-20Z"/></g><rect class="box" x="617" y="17" width="368" height="96" rx="10"/><text x="632" y="47" class="ko">2. 물고기와 거북이, 가오리가 다시 모입니다.</text><text x="632" y="72" class="zh">鱼群、海龟和鳐鱼重新聚集。</text><text x="632" y="97" class="en">Fish, turtles and rays gather here again.</text><path class="bub" d="M948 95h231q14 0 14 14v68q0 14-14 14h-97l-21 20 4-20h-117q-14 0-14-14v-68q0-14 14-14Z"/><text x="963" y="124" class="ko">정말 살아 있는 바다네요!</text><text x="963" y="148" class="zh tiny">这才是真正有生命的海洋！</text><text x="963" y="171" class="en tiny">This is truly a living ocean!</text><text x="995" y="355" class="fx" transform="rotate(-5 995 355)">LIFE RETURNS!</text></g>
<g class="panel"><rect x="4" y="398" width="592" height="398" fill="#dcecf2"/><rect x="22" y="414" width="556" height="360" rx="18" fill="#f9fcfd" stroke="#071923" stroke-width="5"/><rect x="210" y="460" width="338" height="219" rx="12" fill="#074f7a" stroke="#071923" stroke-width="5"/><text x="230" y="491" font-family="Arial" font-size="19" font-weight="900" fill="#dff7ff">OCEAN RECOVERY MONITOR</text><rect x="230" y="512" width="294" height="42" rx="8" fill="#0f789c"/><text x="246" y="540" font-family="Arial" font-size="21" font-weight="900" fill="#8df7d0">Marine Biodiversity +68%</text><rect x="230" y="562" width="294" height="42" rx="8" fill="#0f789c"/><text x="246" y="590" font-family="Arial" font-size="21" font-weight="900" fill="#8df7d0">Coral Cover +135%</text><rect x="230" y="612" width="294" height="42" rx="8" fill="#0f789c"/><text x="246" y="640" font-family="Arial" font-size="21" font-weight="900" fill="#8df7d0">Water Quality EXCELLENT</text><ellipse cx="126" cy="574" rx="35" ry="39" class="skin"/><path d="M93 566q10-48 45-30 27 12 22 43-27-14-67-13Z" class="hair"/><path d="M78 615q47-21 92 1l20 126H61Z" class="uniform"/><circle cx="115" cy="576" r="4" class="eye"/><circle cx="138" cy="576" r="4" class="eye"/><path d="M143 622q58-27 111-57" fill="none" class="line"/><g><ellipse cx="260" cy="716" rx="25" ry="28" class="skin"/><path d="M236 711q8-36 33-23 19 9 16 30-21-9-49-7Z" class="hair"/><path d="M228 745q33-15 65 0l7 49h-79Z" fill="#5d88aa" stroke="#071923" stroke-width="3"/><ellipse cx="347" cy="718" rx="25" ry="28" class="skin"/><path d="M323 713q7-36 32-23 19 9 16 30-21-9-48-7Z" class="hair"/><path d="M315 747q33-15 65 0l7 47h-79Z" fill="#6f92b1" stroke="#071923" stroke-width="3"/><ellipse cx="433" cy="717" rx="25" ry="28" class="skin"/><path d="M409 712q7-36 32-23 19 9 16 30-21-9-48-7Z" class="hair"/><path d="M401 746q33-15 65 0l7 48h-79Z" fill="#668bab" stroke="#071923" stroke-width="3"/></g><rect class="box" x="18" y="410" width="365" height="94" rx="10"/><text x="32" y="440" class="ko">3. 회복은 데이터에서도 분명히 보입니다.</text><text x="32" y="465" class="zh">海洋的恢复，也清楚地显示在数据中。</text><text x="32" y="489" class="en">The recovery is clearly visible in the data.</text><path class="bub" d="M352 674h211q14 0 14 14v62q0 14-14 14h-98l-19 18 4-18h-98q-14 0-14-14v-62q0-14 14-14Z"/><text x="366" y="702" class="ko">함께한 노력의 결과예요!</text><text x="366" y="726" class="zh tiny">这是大家共同努力的结果！</text><text x="366" y="749" class="en tiny">This is what our effort achieved!</text><text x="31" y="757" class="fx" transform="rotate(-4 31 757)">REAL DATA · REAL HOPE!</text></g>
<g class="panel"><rect x="604" y="398" width="592" height="398" fill="url(#sunset)"/><circle cx="1045" cy="553" r="46" fill="#fff0aa"/><path d="M604 600q135-28 268 5t324-12v203H604Z" fill="#195f83"/><path d="M604 620q155 28 285 2t307 12" fill="none" stroke="#7fd7e8" stroke-width="5" opacity=".8"/><path d="M604 566q70-57 135-11 54-42 117 6 67-38 136 9v34H604Z" fill="#6d6678" opacity=".74"/><ellipse cx="1087" cy="583" rx="34" ry="37" class="skin"/><path d="M1055 575q9-46 43-29 25 12 20 41-26-13-63-12Z" class="hair"/><path d="M1038 622q46-21 90 0l20 138h-131Z" class="uniform"/><path d="M1059 555q29-14 56 0l-4 19h-53Z" class="cap"/><g><ellipse cx="705" cy="650" rx="29" ry="32" class="skin"/><path d="M677 644q8-42 38-27 22 10 18 36-24-11-56-9Z" class="hair"/><path d="M665 687q39-18 77 0l13 91H652Z" fill="#6f93b2" stroke="#071923" stroke-width="3"/><ellipse cx="789" cy="646" rx="29" ry="32" class="skin"/><path d="M761 640q8-42 38-27 22 10 18 36-24-11-56-9Z" class="hair"/><path d="M749 683q39-18 77 0l13 95H736Z" fill="#789ab8" stroke="#071923" stroke-width="3"/><ellipse cx="874" cy="650" rx="29" ry="32" class="skin"/><path d="M846 644q8-42 38-27 22 10 18 36-24-11-56-9Z" class="hair"/><path d="M834 687q39-18 77 0l13 91H821Z" fill="#668cac" stroke="#071923" stroke-width="3"/><ellipse cx="957" cy="646" rx="29" ry="32" class="skin"/><path d="M929 640q8-42 38-27 22 10 18 36-24-11-56-9Z" class="hair"/><path d="M917 683q39-18 77 0l13 95H904Z" fill="#7195b4" stroke="#071923" stroke-width="3"/></g><rect x="714" y="700" width="253" height="72" rx="8" fill="#f6f3df" stroke="#071923" stroke-width="4" transform="rotate(-2 714 700)"/><text x="744" y="729" font-family="Arial" font-size="18" font-weight="900" fill="#1b5d88">CLEAN OCEAN</text><text x="743" y="753" font-family="Arial" font-size="18" font-weight="900" fill="#1b5d88">BRIGHTER TOMORROW</text><rect class="box" x="618" y="410" width="349" height="95" rx="10"/><text x="632" y="440" class="ko">4. 다시 노래하는 바다를 다음 세대에 잇습니다.</text><text x="632" y="465" class="zh">把再次歌唱的海洋，传递给下一代。</text><text x="632" y="489" class="en">We pass this singing ocean to the next generation.</text><path class="bub" d="M949 492h228q14 0 14 14v75q0 14-14 14h-97l-20 19 4-19h-115q-14 0-14-14v-75q0-14 14-14Z"/><text x="964" y="522" class="ko">앞으로도 바다를 지킬게요!</text><text x="964" y="547" class="zh tiny">我们会继续守护海洋！</text><text x="964" y="571" class="en tiny">We'll keep protecting the ocean!</text><text x="955" y="764" class="fx" transform="rotate(-5 955 764)">BLUER TOMORROW!</text></g></svg>