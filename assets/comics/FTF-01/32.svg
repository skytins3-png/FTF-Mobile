 <text x="731" y="642" text-anchor="middle" fill="#19212a" font-family="Arial" font-size="21" font-weight="900">그늘막 먼저! 수온부터 낮춰!</text>
 <text x="731" y="665" text-anchor="middle" fill="#19212a" font-family="Arial" font-size="15">先遮阴，先降水温！ · Shade first—cool the water!</text>
