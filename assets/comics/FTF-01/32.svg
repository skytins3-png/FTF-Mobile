 <text x="94" y="600" fill="#fff" font-family="Arial" font-size="27" font-weight="900">경고를 들었으면, 바로 움직인다.</text>
 <text x="94" y="627" fill="#fff" font-family="Arial" font-size="20">听见警报，就马上行动。 · Hear the warning. Act now.</text>
