<rect class="card" x="72" y="134" width="520" height="111" rx="12"/><text class="ko" x="92" y="171" font-size="27">쓰지 않는 전기는 바로 끄는 것부터 시작해요.</text><text class="zh" x="92" y="204" font-size="20">节约能源，从关掉不用的电器开始。</text><text class="en" x="92" y="233" font-size="19">Saving energy starts by switching off what we do not use.</text>
