<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 154 stops invasive species before rain reaches the harbor by creating a neighborhood stormwater biosecurity buffer">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#193c63"/><stop offset="1" stop-color="#f5a35c"/></linearGradient>
 <linearGradient id="rain" x2="0" y2="1"><stop stop-color="#5f7885"/><stop offset="1" stop-color="#253740"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#27a6c5"/><stop offset="1" stop-color="#06465c"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#e7fff6"/><stop offset="1" stop-color="#61d1a5"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".42"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#07151d"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#154461"/>
<text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="30" font-weight="900">FTF-01 #154  비가 항만에 닿기 전에 막는다 — 도시 빗물 완충지대를 만든다</text>
<text x="1028" y="49" fill="#c9f8ff" font-family="Arial" font-size="17" font-weight="800">STOP IT UPSTREAM · 在雨水入港前拦截</text>

<!-- PANEL 1: upstream investigation -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#rain)"/>
 <path d="M16 350h746v162H16z" fill="#5b666b"/>
 <path d="M40 370h300v110H40z" fill="#73838a"/>
 <rect x="92" y="392" width="120" height="64" rx="8" fill="#202b31" stroke="#c8d3d8" stroke-width="5"/>
 <path d="M105 406h94M105 423h94M105 440h94" stroke="#76888f" stroke-width="7"/>
 <path d="M212 424c120 6 180 39 285 48" fill="none" stroke="#66d5ee" stroke-width="16" opacity=".8"/><polygon points="502,472 465,450 471,491" fill="#66d5ee"/>
 <g transform="translate(525 344)" filter="url(#shadow)"><ellipse cy="-67" rx="29" ry="35" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-30-77q9-30 30-30q22 4 29 30l-19-8q-19 8-40 8" fill="#2b2726"/><rect x="-42" y="-27" width="84" height="111" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-34-2l-76 39M34-2l72 34" stroke="#f1b842" stroke-width="19" stroke-linecap="round"/><rect x="-15" y="4" width="30" height="45" rx="5" fill="#173f56"/><path d="M-28 84l-24 83M28 84l24 83" stroke="#172a31" stroke-width="20" stroke-linecap="round"/></g>
 <g transform="translate(654 357)" filter="url(#shadow)"><ellipse cy="-65" rx="28" ry="34" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-29-76q10-28 31-27q20 3 27 27l-20-8q-18 8-38 8" fill="#1f2528"/><rect x="-41" y="-25" width="82" height="106" rx="18" fill="#4ea5c8" stroke="#102a35" stroke-width="5"/><path d="M-34-1l-70 34M34-1l63 30" stroke="#4ea5c8" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="38" y="102" width="534" height="125" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="305" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="305">D-7을 막은 뒤에도 원인을 끝까지 거슬러 올라갔다. 오염 신호는 항만 밖 주거·도로 배수망에서 시작됐다.</tspan><tspan x="305" dy="24" font-size="14">封住D-7后继续向上追查，污染信号来自港外社区与道路排水网。</tspan><tspan x="305" dy="23" font-size="13">Tracing upstream reveals the signal begins in neighborhood and roadside runoff.</tspan></text>
 <path d="M579 102h153q16 0 16 16v92q0 16-16 16h-80l-31 28 8-28h-50q-16 0-16-16v-92q0-16 16-16z" fill="#fff3c7" stroke="#111" stroke-width="4"/>
 <text x="655" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="655">항만 밖부터</tspan><tspan x="655" dy="23">막아야 해!</tspan><tspan x="655" dy="20" font-size="12">从源头拦截！</tspan></text>
 <text x="49" y="492" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">TRACE! UPSTREAM! FIND THE FIRST DROP!</text>
</g>

<!-- PANEL 2: bioswale construction -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#sky)"/>
 <rect x="774" y="338" width="746" height="174" fill="#677b65"/>
 <path d="M794 399h706" stroke="#4f5b5f" stroke-width="75"/>
 <path d="M870 392q120-90 240 0t245 0" fill="none" stroke="#8ac06f" stroke-width="60"/>
 <path d="M872 396q118-73 238 0t241 0" fill="none" stroke="#59a85d" stroke-width="22"/>
 <g filter="url(#shadow)"><rect x="1000" y="287" width="260" height="112" rx="16" fill="url(#green)" stroke="#1b7256" stroke-width="6"/><text x="1130" y="322" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="24" font-weight="900" fill="#15523e">BIO-SWALE GATE</text><text x="1130" y="352" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900" fill="#15523e">식생도랑 · 모래 · 바이오차 · 미세망</text><text x="1130" y="378" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#15523e">VEGETATION · SAND · BIOCHAR · MESH</text></g>
 <g transform="translate(900 322)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-27-69q8-27 28-28q20 4 26 28l-17-7q-18 7-37 7" fill="#2b2726"/><rect x="-39" y="-20" width="78" height="98" rx="17" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-31 0l-65 42M31 0l60 34" stroke="#f1b842" stroke-width="18" stroke-linecap="round"/></g>
 <g transform="translate(1390 333)" filter="url(#shadow)"><ellipse cy="-60" rx="27" ry="33" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-28-70q10-28 30-27q20 3 26 27l-19-8q-18 8-37 8" fill="#1f2528"/><rect x="-39" y="-21" width="78" height="98" rx="17" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-31 0l-63 31M31 0l62 28" stroke="#43b994" stroke-width="18" stroke-linecap="round"/></g>
 <circle cx="843" cy="454" r="18" fill="#64b75b"/><circle cx="904" cy="458" r="15" fill="#86c56c"/><circle cx="1302" cy="455" r="20" fill="#6ebd61"/><circle cx="1362" cy="458" r="16" fill="#88c875"/>
 <rect x="796" y="102" width="635" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1113" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1113">도로와 주거지 끝단에 식생도랑·바이오차·미세망을 설치해 빗물이 하수관으로 들어가기 전에 한 번 더 걸렀다.</tspan><tspan x="1113" dy="24" font-size="14">在道路与社区末端设置植被沟、生物炭和微滤网，雨水入管前先净化。</tspan><tspan x="1113" dy="23" font-size="13">Bioswales, biochar and mesh filter runoff before it reaches the storm-drain network.</tspan></text>
 <text x="805" y="492" font-family="Arial" font-size="25" font-weight="1000" fill="#15323f">DIG! PLANT! FILTER! SLOW THE FLOW!</text>
</g>

<!-- PANEL 3: community response -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#17333d"/>
 <rect x="34" y="548" width="710" height="436" rx="12" fill="#c9d9dc"/>
 <rect x="62" y="690" width="265" height="190" rx="16" fill="#eef6f4" stroke="#39555b" stroke-width="5"/>
 <text x="194" y="725" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="22" font-weight="900" fill="#173f56">RAIN READY STATION</text>
 <text x="194" y="756" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900" fill="#173f56">빗물 첫 20분 집중 회수</text>
 <rect x="95" y="785" width="198" height="54" rx="9" fill="#173f56"/><text x="194" y="819" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">FIRST-FLUSH 20 MIN</text>
 <g transform="translate(430 792)" filter="url(#shadow)"><ellipse cy="-70" rx="30" ry="36" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-31-81q10-31 33-30q23 4 29 30l-19-8q-20 8-43 8" fill="#2b2726"/><rect x="-44" y="-30" width="88" height="118" rx="19" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-36-2l-76 38M36-2l76 33" stroke="#43b994" stroke-width="19" stroke-linecap="round"/><rect x="-15" y="6" width="30" height="45" rx="5" fill="#173f56"/><path d="M-29 88l-23 88M29 88l23 88" stroke="#172a31" stroke-width="20" stroke-linecap="round"/></g>
 <g transform="translate(603 806)" filter="url(#shadow)"><ellipse cy="-68" rx="29" ry="35" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-30-79q9-29 31-28q21 3 28 28l-20-8q-18 8-39 8" fill="#1f2528"/><rect x="-42" y="-27" width="84" height="110" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-34-2l-73 32M34-2l68 28" stroke="#f1b842" stroke-width="19" stroke-linecap="round"/></g>
 <g filter="url(#shadow)"><rect x="504" y="650" width="197" height="108" rx="15" fill="#173f56" stroke="#0a212d" stroke-width="5"/><text x="602" y="684" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#d7fff3">RAIN ALERT</text><text x="602" y="712" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#fff">D-7 + B-5 LINKED</text><circle cx="536" cy="735" r="10" fill="#4ee0a5"/><text x="554" y="741" font-family="Arial" font-size="13" font-weight="900" fill="#fff">READY</text></g>
 <rect x="38" y="546" width="674" height="100" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">비 예보가 뜨면 항만팀과 지역 관리팀이 동시에 준비한다. 첫 20분의 빗물을 집중 회수해 가장 오염된 흐름을 바다 밖에서 잡는다.</tspan><tspan x="375" dy="24" font-size="14">降雨预警一到，港口与社区团队同步启动，重点回收最初20分钟雨水。</tspan><tspan x="375" dy="23" font-size="13">Rain alerts trigger a joint response, capturing the dirtiest first flush before it reaches the sea.</tspan></text>
 <text x="59" y="958" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">ALERT! CAPTURE! HOLD THE FIRST FLUSH!</text>
</g>

<!-- PANEL 4: verification -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="url(#sea)"/>
 <path d="M790 808q170-92 330 0t380 0v200H790z" fill="#073e50"/>
 <g opacity=".9"><path d="M1125 866q35-27 70 0q-35 26-70 0m150 40q28-21 58 0q-29 22-58 0m-246 17q30-23 62 0q-31 23-62 0" fill="#e8c85f"/><circle cx="1198" cy="871" r="3" fill="#111"/><circle cx="1334" cy="910" r="3" fill="#111"/></g>
 <g transform="translate(950 835)" filter="url(#shadow)"><ellipse cy="-72" rx="30" ry="36" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-31-83q10-31 33-30q23 4 29 30l-19-8q-20 8-43 8" fill="#2b2726"/><rect x="-44" y="-31" width="88" height="119" rx="19" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-36-3l-74 38M36-3l76 33" stroke="#43b994" stroke-width="19" stroke-linecap="round"/><path d="M-29 88l-23 89M29 88l23 89" stroke="#172a31" stroke-width="20" stroke-linecap="round"/></g>
 <g filter="url(#shadow)"><rect x="1088" y="655" width="355" height="210" rx="18" fill="#eafff8" stroke="#1b7256" stroke-width="6"/><text x="1265" y="691" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="24" font-weight="900" fill="#15523e">30-DAY UPSTREAM VERIFY</text><text x="1120" y="729" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#173f56">✓ D-7 first-flush captured: 100%</text><text x="1120" y="762" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#173f56">✓ B-5 invasive eDNA: 0 / 30</text><text x="1120" y="795" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#173f56">✓ Stormwater bypass events: 0</text><text x="1120" y="828" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#173f56">✓ Native juveniles: +45%</text></g>
 <rect x="796" y="546" width="656" height="99" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1124" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1124">30일 뒤, D-7과 B-5 모두 외래종 eDNA 0. 항만 안쪽만 지키던 방어선이 도시 전체의 빗물 경로까지 넓어졌다.</tspan><tspan x="1124" dy="24" font-size="14">30天后D-7与B-5均为0，防线从港内扩展到整座城市的雨水路径。</tspan><tspan x="1124" dy="23" font-size="13">After 30 days, both D-7 and B-5 stay clear—the biosecurity line now starts upstream.</tspan></text>
 <path d="M826 685h215q15 0 15 15v79q0 15-15 15h-112l-37 31 10-31h-76q-15 0-15-15v-79q0-15 15-15z" fill="#fff3c7" stroke="#111" stroke-width="4"/>
 <text x="934" y="718" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="934">바다를 지키려면</tspan><tspan x="934" dy="24">도시의 첫 빗방울부터!</tspan><tspan x="934" dy="20" font-size="12">从第一滴雨开始守护海洋！</tspan></text>
 <text x="802" y="982" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">VERIFY! ZERO RETURN! PROTECT UPSTREAM!</text>
</g>
</svg>