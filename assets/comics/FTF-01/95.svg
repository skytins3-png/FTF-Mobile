   .panel{stroke:#08131d;stroke-width:8}.cap{font-family:'Noto Sans KR','Noto Sans CJK SC',Arial,sans-serif;font-weight:700}.ko{font-size:22px}.zh{font-size:18px}.en{font-size:17px}.box{fill:#fffdf5;stroke:#14212a;stroke-width:4}.bubble{fill:#fff;stroke:#101820;stroke-width:4}.sfx{font-family:Arial Black,sans-serif;font-weight:900;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.tag{font-family:Arial Black,sans-serif;font-weight:900}.skin{fill:#efc09c}.skin2{fill:#d6a17f}.hair{fill:#1f2329}.hair2{fill:#3c2c27}.ftf{fill:#155680}.vest{fill:#f07d2e}.line{stroke:#101820;stroke-width:4;stroke-linejoin:round}.eye{fill:#17212a}
  </style>
