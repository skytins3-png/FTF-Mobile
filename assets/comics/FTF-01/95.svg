 <g transform="translate(441,155)" filter="url(#shadow)"><path d="M42 88q-21 48-18 121h105q3-74-22-120z" fill="#101a22" class="line"/><circle cx="76" cy="59" r="39" class="skin line"/><path d="M39 61q5-43 38-43 37 2 39 45-19-14-37-24-14 15-39 22z" class="hair line"/><rect x="42" y="47" width="67" height="31" rx="12" fill="#88d9f3" opacity=".65" stroke="#0d1b22" stroke-width="4"/><path d="M27 129l-69 40 13 22 72-29" class="skin line"/><path d="M97 131l71 21-6 25-72-10" class="skin line"/><rect x="106" y="139" width="48" height="16" rx="4" fill="#ef3f36" transform="rotate(18 130 147)"/></g>
 <g transform="translate(585,197)" filter="url(#shadow)"><path d="M33 71q-17 39-15 95h84q2-56-18-94z" fill="#0c1820" class="line"/><circle cx="59" cy="49" r="31" class="skin2 line"/><rect x="31" y="41" width="55" height="24" rx="10" fill="#86d4ea" opacity=".65" stroke="#101820" stroke-width="4"/><path d="M17 107l-49 34 12 18 49-25" class="skin2 line"/></g>
 <rect x="18" y="16" width="352" height="112" rx="8" class="box"/><text x="31" y="44" class="cap ko">폐어망에 걸린 바다거북과 해양생물을 구조합니다.</text><text x="31" y="72" class="cap zh">我们救助被废弃渔网缠住的海龟和海洋生物。</text><text x="31" y="99" class="cap en">Divers free sea turtles and other animals from ghost nets.</text>
 <rect x="407" y="19" width="316" height="109" rx="52" class="bubble"/><text x="565" y="48" text-anchor="middle" class="cap ko">걱정하지 마, 이제 자유로워질 거야!</text><text x="565" y="76" text-anchor="middle" class="cap zh">别怕，你马上就自由了！</text><text x="565" y="102" text-anchor="middle" class="cap en">Don’t worry, you’ll be free soon!</text>
 <text x="511" y="390" class="sfx" font-size="55" fill="#ff8b2e">SNIP!</text>
</g>

<!-- PANEL 3: recycling workshop -->
<g transform="translate(14,518)">
 <rect class="panel" width="748" height="490" rx="8" fill="url(#shop)"/>
 <rect y="325" width="748" height="165" fill="#8d6948" opacity=".55"/>
 <rect x="35" y="45" width="680" height="70" rx="8" fill="#f5efe2" class="line"/><text x="375" y="88" text-anchor="middle" class="tag" font-size="31" fill="#1d6f73">GHOST NETS → NEW LIFE  ♻</text>
 <g transform="translate(65,152)" filter="url(#shadow)"><path d="M56 104Q18 135 21 216h132q4-78-42-111z" fill="#ece8df" class="line"/><circle cx="93" cy="72" r="49" class="skin line"/><path d="M45 74q6-51 49-52 47 2 49 55-25-18-46-31-17 19-49 28z" class="hair line"/><path d="M118 142l103 35-8 27-106-23" class="skin line"/></g>
