  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b92bd"/><stop offset="1" stop-color="#073e65"/></linearGradient>
  <linearGradient id="shop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efe3c7"/><stop offset="1" stop-color="#b98c5b"/></linearGradient>
  <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb35c"/><stop offset=".45" stop-color="#ef7a58"/><stop offset="1" stop-color="#4f4f79"/></linearGradient>
