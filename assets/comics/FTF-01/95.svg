 <g transform="translate(480,137)" filter="url(#shadow)"><rect width="220" height="226" rx="14" fill="#d8e4d8" class="line"/><path d="M33 39h152v53H33z" fill="#305b54"/><text x="109" y="72" text-anchor="middle" class="tag" font-size="19" fill="#fff">RECYCLE · UPCYCLE</text><path d="M41 120q65-35 135 2v58q-73 32-135 0z" fill="#4c8f86" stroke="#183b37" stroke-width="4"/><g stroke="#c1dfd8" stroke-width="3"><path d="M49 130l116 43M44 153l126 35M76 112l-4 80M118 110l5 88"/></g><rect x="54" y="181" width="56" height="27" rx="6" fill="#234d48"/><rect x="122" y="181" width="56" height="27" rx="6" fill="#234d48"/></g>
 <rect x="20" y="373" width="332" height="93" rx="48" class="bubble"/><text x="186" y="404" text-anchor="middle" class="cap ko">버린 게 아니라, 다시 쓰는 거예요!</text><text x="186" y="431" text-anchor="middle" class="cap zh">这不是垃圾，而是新的材料！</text><text x="186" y="456" text-anchor="middle" class="cap en">It’s not waste — it’s a new beginning!</text>
 <rect x="386" y="370" width="335" height="96" rx="8" class="box"/><text x="401" y="399" class="cap ko">수거한 폐어망은 분류·세척 후 새 제품으로 재탄생합니다.</text><text x="401" y="427" class="cap zh">回收的废弃渔网经过分类、清洗后重新利用。</text><text x="401" y="454" class="cap en">Recovered nets are cleaned, sorted and upcycled into new products.</text>
 <text x="500" y="342" class="sfx" font-size="39" fill="#2b8f77">SORT! · WASH! · REUSE!</text>
</g>

