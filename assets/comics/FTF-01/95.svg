 <path d="M501 334l92-86" stroke="#efc09c" stroke-width="13" stroke-linecap="round"/><circle cx="596" cy="244" r="8" fill="#efc09c"/>
 <rect x="18" y="16" width="380" height="112" rx="8" class="box"/><text x="32" y="44" class="cap ko">지금도, 그리고 앞으로도 푸른 바다가 계속되기를.</text><text x="32" y="72" class="cap zh">从现在开始，一直到未来，让蓝色海洋延续。</text><text x="32" y="99" class="cap en">A living ocean — now, and for every tomorrow.</text>
 <rect x="432" y="20" width="292" height="110" rx="50" class="bubble"/><text x="578" y="50" text-anchor="middle" class="cap ko">앞으로도 계속 함께할게요!</text><text x="578" y="78" text-anchor="middle" class="cap zh">今后也会继续一起努力！</text><text x="578" y="103" text-anchor="middle" class="cap en">We’ll keep going together!</text>
 <text x="388" y="457" class="sfx" font-size="44" fill="#b7f3ff">TOGETHER FOR A BLUER TOMORROW!</text>
