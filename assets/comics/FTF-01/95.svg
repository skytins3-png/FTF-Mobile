<rect width="1536" height="1024" fill="#06131e"/>
<rect width="1536" height="66" fill="#0a2f4d"/>
<text x="20" y="44" class="tag" font-size="32" fill="#fff">FTF-01  #95</text>
<text x="250" y="42" class="cap" font-size="28" fill="#fff">버려진 그물을 다시 생명의 바다로 · 让废弃渔网重生 · FROM GHOST NETS TO A LIVING OCEAN</text>
<text x="1512" y="42" text-anchor="end" class="cap" font-size="16" fill="#c8f5ff">버려진 그물 하나를 줄이는 것이 더 많은 생명을 지키는 시작입니다.</text>

<!-- PANEL 1: vessel + ghost net recovery -->
<g transform="translate(14,80)">
 <rect class="panel" width="748" height="424" rx="8" fill="url(#sea)"/>
 <path d="M0 265q75-35 150 0t150 0 150 0 150 0 148 0v159H0z" fill="#0f709a" opacity=".95"/>
 <g fill="#eef5f8" stroke="#20303a" stroke-width="4" filter="url(#shadow)">
  <path d="M38 182h340l55 102H4z"/><rect x="120" y="91" width="180" height="93" rx="8"/><rect x="157" y="48" width="18" height="50"/><path d="M166 48l70 38h-70z" fill="#c7dce6"/>
 </g>
 <g stroke="#324651" stroke-width="6"><path d="M315 115h112l70 105"/><path d="M425 115v103"/></g>
 <g transform="translate(440,204)"><path d="M0 0q72 18 136 4 74-13 123 20l-20 86q-65-12-123-2-74 12-132-12z" fill="#557e77" stroke="#182522" stroke-width="5"/><g stroke="#c8d8c6" stroke-width="3" opacity=".8"><path d="M8 14l218 71M2 39l210 65M17 83l200-51M57 3l58 101M107 5l58 99M157 8l51 86"/></g><g fill="#d9d2bb"><circle cx="49" cy="45" r="8"/><circle cx="92" cy="75" r="7"/><circle cx="177" cy="49" r="7"/></g></g>
 <g transform="translate(100,184)" filter="url(#shadow)"><path d="M54 105Q18 134 20 214h128q5-75-36-108z" class="ftf line"/><circle cx="90" cy="72" r="49" class="skin line"/><path d="M42 74q7-51 49-52 48 2 49 55-24-18-45-31-17 19-50 28z" class="hair2 line"/><path d="M46 43q36-33 89-1l-7-29q-39-24-73 2z" fill="#1d6da0" class="line"/><text x="91" y="29" text-anchor="middle" class="tag" font-size="14" fill="#fff">FTF</text><ellipse cx="74" cy="77" rx="6" ry="8" class="eye"/><ellipse cx="106" cy="77" rx="6" ry="8" class="eye"/><path d="M78 99q14 10 29-1" fill="none" stroke="#9c5049" stroke-width="4"/><path d="M123 141l102 49-12 26-103-37z" class="skin line"/></g>
 <g transform="translate(278,218)" filter="url(#shadow)"><path d="M48 92Q15 119 18 186h112q4-64-32-93z" fill="#273f4d" class="line"/><circle cx="76" cy="60" r="40" class="skin2 line"/><path d="M39 61q5-42 38-43 38 1 40 44-19-13-37-23-15 15-40 22z" class="hair line"/><path d="M102 137l98 35-9 24-101-22z" class="skin2 line"/></g>
 <rect x="18" y="16" width="348" height="116" rx="8" class="box"/><text x="32" y="44" class="cap ko">바다에 버려진 폐어망은 수많은 생명을 위협합니다.</text><text x="32" y="73" class="cap zh">被遗弃在海里的渔网，会长期威胁海洋生命。</text><text x="32" y="101" class="cap en">Abandoned fishing nets can trap marine life for years.</text>
 <rect x="386" y="22" width="338" height="115" rx="54" class="bubble"/><text x="555" y="51" text-anchor="middle" class="cap ko">와… 또 이렇게 큰 폐어망이 있어요!</text><text x="555" y="79" text-anchor="middle" class="cap zh">哇，又发现这么大的废弃渔网！</text><text x="555" y="106" text-anchor="middle" class="cap en">Wow… another huge ghost net!</text>
 <text x="486" y="392" class="sfx" font-size="54" fill="#ffd549">PULL!</text>
</g>

<!-- PANEL 2: divers rescue turtle -->
<g transform="translate(774,80)">
 <rect class="panel" width="748" height="424" rx="8" fill="url(#deep)"/>
 <g opacity=".24" fill="#d8fbff"><circle cx="83" cy="78" r="8"/><circle cx="112" cy="50" r="5"/><circle cx="356" cy="84" r="7"/><circle cx="604" cy="63" r="9"/><circle cx="650" cy="96" r="5"/></g>
 <g transform="translate(90,117)" filter="url(#shadow)"><ellipse cx="170" cy="120" rx="95" ry="62" fill="#6d8b58" class="line"/><path d="M96 117q-55-50-88-7 34 32 84 42M244 115q62-54 94-12-37 35-92 45M152 174q-20 58 15 78 25-34 22-74" fill="#71995f" class="line"/><circle cx="258" cy="111" r="31" fill="#89a86c" class="line"/><circle cx="270" cy="104" r="5" class="eye"/><path d="M104 90q65-38 128 6-18 75-69 77-52 0-59-83z" fill="#7ea36b"/><g stroke="#4d6845" stroke-width="4"><path d="M115 103q48 25 103 5M126 130q38 27 82 7M147 83l-9 72M178 78l-2 87M207 87l-16 70"/></g></g>
