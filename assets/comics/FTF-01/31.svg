<rect x="112" y="865" width="394" height="72" rx="10" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="130" y="893" fill="#111" font-family="Arial" font-size="22" font-weight="900">아이들이 데이터를 읽고 질문한다.</text>
<text x="130" y="919" fill="#333" font-family="Arial" font-size="17">孩子们读数据，也开始提问。 · Children read the data—and ask why.</text>
<path d="M660 588 Q828 567 986 604 L972 717 Q814 729 677 707Z" fill="#fff" stroke="#111" stroke-width="5"/>
<text x="696" y="625" fill="#111" font-family="Arial" font-size="24" font-weight="900">“숫자를 알면 위험을 먼저 볼 수 있어.”</text>
<text x="696" y="658" fill="#333" font-family="Arial" font-size="18">“懂得数字，就能更早看见风险。”</text>
<text x="696" y="684" fill="#555" font-family="Arial" font-size="17">“Read the numbers, see the risk sooner.”</text>
<text x="835" y="900" fill="#fff8b2" font-family="Arial" font-size="36" font-weight="900">CLICK!</text>
</g>

