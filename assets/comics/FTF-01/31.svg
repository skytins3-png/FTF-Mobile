<circle cx="554" cy="357" r="39" fill="#efbc96"/><path d="M516 352 Q553 305 596 349 Q583 315 554 313 Q530 315 514 336Z" fill="#2b2528"/><path d="M508 402 Q554 376 603 404 L618 500 H495Z" fill="#3e6f70"/><path d="M519 424 L468 376 M592 424 L650 379" stroke="#efbc96" stroke-width="17" stroke-linecap="round"/>
