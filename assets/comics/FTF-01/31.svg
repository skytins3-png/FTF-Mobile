<circle cx="720" cy="363" r="38" fill="#d8a27c"/><path d="M684 358 Q720 314 761 357 Q748 324 720 321 Q696 324 682 343Z" fill="#26323a"/><path d="M677 408 Q720 382 768 410 L784 500 H664Z" fill="#455e8a"/>
<path d="M89 146 Q363 126 681 157 L664 268 Q368 285 105 257Z" fill="#fff" stroke="#111" stroke-width="5"/>
<text x="122" y="187" fill="#111" font-family="Arial" font-size="27" font-weight="900">“재건은 끝이 아니야. 이제 매일 지켜봐야 해.”</text>
<text x="122" y="224" fill="#333" font-family="Arial" font-size="20">“重建不是终点，我们要每天守护。”</text>
<text x="122" y="253" fill="#555" font-family="Arial" font-size="18">“Rebuilding wasn’t the end. We watch over it every day.”</text>
<text x="742" y="492" fill="#fff3a3" font-family="Arial" font-size="38" font-weight="900">BEEP · BEEP!</text>
</g>

<!-- PANEL 2: school climate lab -->
<g filter="url(#sh)">
