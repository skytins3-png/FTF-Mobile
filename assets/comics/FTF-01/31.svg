<text x="110" y="1057" fill="#111" font-family="Arial" font-size="25" font-weight="900">“강이 살아나자, 동물들도 돌아오기 시작했다.”</text>
<text x="110" y="1091" fill="#333" font-family="Arial" font-size="19">“河流恢复后，动物们也开始回来了。”</text>
<text x="110" y="1119" fill="#555" font-family="Arial" font-size="18">“As the river healed, wildlife began to return.”</text>
<text x="760" y="1370" fill="#fff7a5" font-family="Arial" font-size="39" font-weight="900">RUSTLE · SPLASH</text>
</g>

