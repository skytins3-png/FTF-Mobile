<text x="126" y="1495" fill="#111" font-family="Arial" font-size="27" font-weight="900">“희망은 준비와 함께 있을 때 더 강해진다.”</text>
<text x="126" y="1531" fill="#333" font-family="Arial" font-size="20">“希望与准备同行时，会变得更强。”</text>
<text x="126" y="1560" fill="#555" font-family="Arial" font-size="18">“Hope grows stronger when preparedness walks beside it.”</text>
<text x="786" y="1795" fill="#ffe082" font-family="Arial" font-size="42" font-weight="900">STEP · STEP</text>
