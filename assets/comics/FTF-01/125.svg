 <g fill="#ffd45f" filter="url(#glow)"><path d="M1140 316l18-20 5 25 23-9-11 26 23 8-27 8 4 25-20-19-18 17 4-27-26-5 26-10z"/></g>
 <rect x="798" y="101" width="500" height="115" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1048" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1048">FTF 팀은 세탁 배출수와 우수관 입구에 미세섬유 포집 필터를 설치했다.</tspan><tspan x="1048" dy="24" font-size="14">FTF团队在洗衣排水与雨水口加装微纤维捕集过滤器。</tspan><tspan x="1048" dy="22" font-size="13">The FTF team installs microfiber capture filters before runoff reaches the estuary.</tspan></text>
 <rect x="1312" y="107" width="184" height="88" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/>
 <text x="1404" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="1404">필터 고정!</tspan><tspan x="1404" dy="22" font-size="14">过滤器锁定！</tspan><tspan x="1404" dy="20" font-size="12">Filter locked!</tspan></text>
 <text x="805" y="485" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">CLICK!  LOCK!  CAPTURE!</text>
</g>

