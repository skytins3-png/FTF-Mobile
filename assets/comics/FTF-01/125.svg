 <text x="560" y="637" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#12455a">MICROFIBER SENSOR</text><text x="560" y="676" text-anchor="middle" font-family="Arial" font-size="32" font-weight="900" fill="#1a9c70">−71%</text>
 <rect x="38" y="542" width="454" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="265" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="265">며칠 뒤, 하구 센서의 미세섬유 신호가 크게 떨어졌다.</tspan><tspan x="265" dy="24" font-size="14">几天后，河口传感器检测到的微纤维大幅下降。</tspan><tspan x="265" dy="22" font-size="13">Days later, microfiber readings at the estuary fall sharply.</tspan></text>
 <rect x="489" y="557" width="230" height="88" rx="22" fill="#eaffd5" stroke="#111" stroke-width="4"/>
 <text x="604" y="587" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="604">물고기가 돌아오고 있어!</tspan><tspan x="604" dy="22" font-size="14">鱼儿正在回来！</tspan><tspan x="604" dy="20" font-size="12">The fish are returning!</tspan></text>
 <text x="42" y="976" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">FLOW CLEANER!  LIFE RETURNS!</text>
</g>

