<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #125  바다로 가기 전에 막아라</text>
<text x="934" y="49" fill="#baf4ff" font-family="Arial" font-size="18" font-weight="800">B-28 SOURCE CONTROL · 源头拦截</text>

