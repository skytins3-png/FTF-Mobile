 <g filter="url(#sh)"><ellipse cx="870" cy="700" rx="43" ry="48" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M831 692q8-36 40-43q35 5 42 47z" fill="#3d3032"/><path d="M827 753q44-27 88 0l38 188H787z" fill="#eef9fb" stroke="#10212b" stroke-width="5"/><text x="871" y="845" text-anchor="middle" fill="#0b698f" font-family="Arial" font-size="22" font-weight="900">FTF</text><path d="M910 778q53-15 96-44" stroke="#eef9fb" stroke-width="25" stroke-linecap="round"/></g>
 <g filter="url(#sh)"><ellipse cx="973" cy="772" rx="36" ry="41" fill="#e6b087" stroke="#10212b" stroke-width="5"/><path d="M940 765q8-31 34-37q30 4 36 40z" fill="#24343e"/><path d="M936 819q38-22 76 0l29 121H907z" fill="#17465d" stroke="#10212b" stroke-width="5"/></g>
 <rect x="797" y="542" width="490" height="113" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1042" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1042">문제를 바다에서 건져내는 것보다, 육지의 원천에서 막는 편이 훨씬 강했다.</tspan><tspan x="1042" dy="24" font-size="14">与其在海里打捞，不如在陆地源头拦截更有效。</tspan><tspan x="1042" dy="22" font-size="13">Stopping pollution at its source is stronger than chasing it in the sea.</tspan></text>
 <rect x="812" y="873" width="650" height="99" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/>
 <text x="1137" y="908" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="22" font-weight="900"><tspan x="1137">작은 섬유 하나도, 바다에 닿기 전에 멈춘다.</tspan><tspan x="1137" dy="27" font-size="16">再小的纤维，也要在入海前拦住。</tspan><tspan x="1137" dy="24" font-size="14">STOP POLLUTION AT THE SOURCE · PROTECT THE SEA</tspan></text>
</g>
</svg>