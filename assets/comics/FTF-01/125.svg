 <!-- fibers and arrow -->
 <g stroke-linecap="round" fill="none" filter="url(#glow)"><path d="M245 391q38 20 74-2" stroke="#ff5f88" stroke-width="5"/><path d="M225 407q42 18 76-6" stroke="#735cff" stroke-width="4"/><path d="M279 417q35 20 68-4" stroke="#ffd35b" stroke-width="4"/></g>
 <path d="M454 364Q500 349 534 323" fill="none" stroke="#ff775f" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#none)"/>
 <rect x="38" y="101" width="478" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="277" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="277">추적 결과, 세탁 과정의 미세섬유가 우수관으로 흘러들고 있었다.</tspan><tspan x="277" dy="24" font-size="14">追踪结果显示，洗衣产生的微纤维正流入雨水管道。</tspan><tspan x="277" dy="22" font-size="13">Tracking shows laundry microfibers entering the storm-drain system.</tspan></text>
 <rect x="514" y="103" width="218" height="94" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/>
 <text x="623" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="623">바다에 닿기 전에 막자!</tspan><tspan x="623" dy="23" font-size="14">在入海前拦住！</tspan><tspan x="623" dy="21" font-size="13">Stop it before the sea!</tspan></text>
 <text x="42" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">TRACE!  FIND!  STOP!</text>
</g>

