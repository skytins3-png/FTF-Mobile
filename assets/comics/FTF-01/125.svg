 <text x="1254" y="622" text-anchor="middle" fill="#d9ffff" font-family="Arial" font-size="24" font-weight="900">FTF B-28 SOURCE CONTROL</text>
 <g font-family="Arial" font-weight="900"><text x="1073" y="677" fill="#fff" font-size="20">Microfiber inflow</text><text x="1427" y="677" text-anchor="end" fill="#57f0ae" font-size="28">−71%</text><text x="1073" y="730" fill="#fff" font-size="20">Filter capture rate</text><text x="1427" y="730" text-anchor="end" fill="#57f0ae" font-size="28">+83%</text><text x="1073" y="783" fill="#fff" font-size="20">Kelp health index</text><text x="1427" y="783" text-anchor="end" fill="#57f0ae" font-size="28">+21%</text><text x="1073" y="836" fill="#fff" font-size="20">Juvenile fish use</text><text x="1427" y="836" text-anchor="end" fill="#57f0ae" font-size="28">+34%</text></g>
