 <g fill="#f6c75f" stroke="#123b49" stroke-width="3"><path d="M1112 802q49-27 94 0q-45 28-94 0l-31 22v-44z"/><path d="M1268 860q43-24 84 0q-41 25-84 0l-28 19v-38z"/><path d="M1090 890q39-22 76 0q-37 23-76 0l-25 18v-36z"/></g>
 <g filter="url(#sh)"><ellipse cx="1378" cy="775" rx="70" ry="45" fill="#5ea56f" stroke="#174d3d" stroke-width="5"/><ellipse cx="1437" cy="773" rx="28" ry="22" fill="#76bb82"/><path d="M1327 757l-51-32 19 53zM1331 798l-50 36 61-12zM1402 744l34-44 8 56zM1405 803l44 34-12-54z" fill="#72b37c" stroke="#174d3d" stroke-width="4"/></g>
 <rect x="1038" y="704" width="365" height="146" rx="18" fill="#102f40" stroke="#78eede" stroke-width="5"/>
 <text x="1220" y="738" text-anchor="middle" fill="#dffff9" font-family="Arial" font-size="18" font-weight="900">B-31 FIELD CHECK · 12 WEEKS</text>
 <text x="1064" y="775" fill="#fff" font-family="Arial" font-size="16" font-weight="800">TEXTILE WASTE TO WATER</text><text x="1373" y="775" text-anchor="end" fill="#7df0af" font-family="Arial" font-size="24" font-weight="900">−71%</text>
 <text x="1064" y="815" fill="#fff" font-family="Arial" font-size="16" font-weight="800">MICROFIBER LOAD</text><text x="1373" y="815" text-anchor="end" fill="#7fdcff" font-family="Arial" font-size="24" font-weight="900">−44%</text>
 <g filter="url(#sh)"><ellipse cx="930" cy="682" rx="35" ry="41" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M899 675q7-31 32-37q30 5 35 38z" fill="#49332d"/><path d="M892 736q38-23 76 0l27 119H865z" fill="#eef9fb" stroke="#10212b" stroke-width="5"/><text x="930" y="814" text-anchor="middle" fill="#0c6887" font-family="Arial" font-size="18" font-weight="900">FTF</text></g>
 <rect x="796" y="542" width="468" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1030" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1030">12주 뒤, 하구로 흘러드는 섬유 폐기물과 미세섬유가 함께 줄었다.</tspan><tspan x="1030" dy="24" font-size="14">十二周后，进入河口的纺织废弃物与微纤维同步下降。</tspan><tspan x="1030" dy="22" font-size="13">Twelve weeks later, both textile waste and microfiber load reaching the estuary fall.</tspan></text>
 <rect x="1280" y="551" width="212" height="95" rx="22" fill="#eaffd8" stroke="#111" stroke-width="4"/>
 <text x="1386" y="581" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1386">옷의 순환이 바다를 지킨다.</tspan><tspan x="1386" dy="22" font-size="13">衣物循环守护海洋。</tspan><tspan x="1386" dy="20" font-size="12">Circular clothing protects the sea.</tspan></text>
 <g fill="#ffe369" filter="url(#glow)"><path d="M1450 692l16-18 4 21 22-7-10 22 22 7-23 7 2 23-17-17-17 15 4-23-23-5 20-9z"/></g>
 <text x="804" y="979" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="33" font-weight="900">CLOSE THE LOOP · KEEP THE OCEAN OPEN!</text>
</g>
</svg>