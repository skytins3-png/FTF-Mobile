<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#ffd9ab"/><stop offset="1" stop-color="#7ec2d3"/></linearGradient>
 <linearGradient id="plant" x2="0" y2="1"><stop stop-color="#d6edf0"/><stop offset="1" stop-color="#6d8f99"/></linearGradient>
 <linearGradient id="atelier" x2="0" y2="1"><stop stop-color="#fff2cf"/><stop offset="1" stop-color="#b6d9d1"/></linearGradient>
 <linearGradient id="estuary" x2="0" y2="1"><stop stop-color="#5fc9dc"/><stop offset="1" stop-color="#073e5e"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#06131e"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#0d2d42"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #128  버려진 옷을 다시 바다의 방패로</text>
<text x="950" y="49" fill="#bdf7ff" font-family="Arial" font-size="18" font-weight="800">B-31 FIBER-TO-FIBER LOOP · 纤维闭环再生</text>

<!-- PANEL 1 : take-back station -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="10" fill="url(#city)"/>
 <rect x="16" y="342" width="746" height="170" fill="#6f8f8f"/>
 <path d="M28 342V199h110v143M155 342V165h126v177M300 342V212h109v130M430 342V182h128v160M580 342V220h148v122" fill="#c7d7d6" stroke="#54757b" stroke-width="4"/>
 <rect x="62" y="260" width="235" height="180" rx="16" fill="#f5f7ef" stroke="#153643" stroke-width="7"/>
 <rect x="90" y="289" width="179" height="86" rx="12" fill="#4cae94"/>
 <text x="180" y="323" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="900">FTF TAKE-BACK</text>
 <text x="180" y="350" text-anchor="middle" fill="#eafff6" font-family="Arial" font-size="14" font-weight="800">WORN CLOTHES → NEW FIBER</text>
 <path d="M111 392h137l-18 32H129z" fill="#2e7180"/>
 <g filter="url(#sh)"><ellipse cx="404" cy="266" rx="38" ry="44" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M370 258q9-34 36-40q31 6 36 41z" fill="#3a2d2f"/><path d="M362 326q43-25 86 0l31 128H331z" fill="#1d5c71" stroke="#10212b" stroke-width="5"/><text x="405" y="399" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="900">FTF</text><path d="M367 344q-45 10-72 31" stroke="#1d5c71" stroke-width="22" stroke-linecap="round"/></g>
 <g filter="url(#sh)"><ellipse cx="586" cy="278" rx="36" ry="42" fill="#e0a77e" stroke="#10212b" stroke-width="5"/><path d="M553 271q8-32 34-38q30 6 34 39z" fill="#2a3438"/><path d="M548 341q39-23 78 0l29 115H521z" fill="#b36d47" stroke="#10212b" stroke-width="5"/><path d="M548 354q-45 10-82 32" stroke="#b36d47" stroke-width="20" stroke-linecap="round"/></g>
 <path d="M463 357q28-18 58 0l-4 54h-50z" fill="#5fd4b2" stroke="#183b40" stroke-width="4"/><text x="492" y="388" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#123">LOW-SHED</text>
 <rect x="35" y="101" width="466" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="268" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="268">저탈락 원단 다음 단계는, 낡은 옷을 쓰레기로 만들지 않는 것이다.</tspan><tspan x="268" dy="24" font-size="14">低脱纤之后，下一步是不让旧衣变成垃圾。</tspan><tspan x="268" dy="22" font-size="13">After low-shed design, the next step is keeping worn clothes out of waste.</tspan></text>
 <rect x="518" y="106" width="216" height="94" rx="22" fill="#fff4c9" stroke="#111" stroke-width="4"/>
 <text x="626" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="626">이 옷, 다시 섬유로!</tspan><tspan x="626" dy="22" font-size="13">旧衣，再变纤维！</tspan><tspan x="626" dy="20" font-size="12">Turn it back into fiber!</tspan></text>
 <text x="43" y="487" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="35" font-weight="900">RETURN!  SORT!  RECOVER!</text>
</g>

<!-- PANEL 2 : fiber recycling plant -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="10" fill="url(#plant)"/>
 <rect x="800" y="255" width="684" height="200" rx="18" fill="#b7c8ca" stroke="#294d58" stroke-width="6"/>
 <rect x="832" y="292" width="180" height="112" rx="16" fill="#284f5d"/><circle cx="878" cy="348" r="30" fill="#7ed9cc"/><circle cx="963" cy="348" r="30" fill="#7ed9cc"/><path d="M862 348h117" stroke="#dffcff" stroke-width="7" stroke-dasharray="13 10"/>
 <path d="M1015 330h190l54 66H1069z" fill="#5f7d84" stroke="#21444f" stroke-width="5"/>
 <g fill="#d8ecdf" stroke="#456a63" stroke-width="3"><path d="M1040 316l28-32 25 36-29 31z"/><path d="M1092 312l31-29 23 37-31 28z"/><path d="M1145 315l27-30 27 36-30 30z"/></g>
 <rect x="1270" y="282" width="170" height="126" rx="18" fill="#102f40" stroke="#7ef2e1" stroke-width="5"/>
 <text x="1355" y="314" text-anchor="middle" fill="#dffff9" font-family="Arial" font-size="17" font-weight="900">FIBER LOOP</text>
 <text x="1293" y="347" fill="#fff" font-family="Arial" font-size="15" font-weight="800">RECOVERY</text><text x="1419" y="347" text-anchor="end" fill="#81f2b0" font-family="Arial" font-size="23" font-weight="900">87%</text>
 <text x="1293" y="382" fill="#fff" font-family="Arial" font-size="15" font-weight="800">WATER USE</text><text x="1419" y="382" text-anchor="end" fill="#7edcff" font-family="Arial" font-size="23" font-weight="900">−62%</text>
 <g filter="url(#sh)"><ellipse cx="956" cy="194" rx="35" ry="41" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M925 187q7-31 32-37q30 5 35 38z" fill="#4b342d"/><path d="M918 248q38-23 76 0l28 123H890z" fill="#eef9fb" stroke="#10212b" stroke-width="5"/><path d="M991 272q49 9 83 28" stroke="#eef9fb" stroke-width="21" stroke-linecap="round"/></g>
 <g filter="url(#sh)"><ellipse cx="1180" cy="195" rx="34" ry="40" fill="#dca174" stroke="#10212b" stroke-width="5"/><path d="M1149 188q8-31 32-36q28 5 34 37z" fill="#28343b"/><path d="M1143 249q37-22 74 0l27 122h-128z" fill="#245b48" stroke="#10212b" stroke-width="5"/></g>
 <rect x="796" y="101" width="462" height="115" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1027" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1027">혼방을 분리하고 다시 뽑은 섬유가 새 실로 이어진다.</tspan><tspan x="1027" dy="24" font-size="14">分离混纺后，再生纤维被重新纺成新纱。</tspan><tspan x="1027" dy="22" font-size="13">Separated blends are recovered and spun back into new yarn.</tspan></text>
 <rect x="1274" y="104" width="218" height="94" rx="22" fill="#e7ffd9" stroke="#111" stroke-width="4"/>
 <text x="1383" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1383">버리는 선을 끊자!</tspan><tspan x="1383" dy="22" font-size="13">切断废弃路线！</tspan><tspan x="1383" dy="20" font-size="12">Break the waste line!</tspan></text>
 <g fill="#ffe167" filter="url(#glow)"><path d="M1214 319l16-18 4 21 22-7-10 22 22 7-23 7 2 23-17-17-17 15 4-23-23-5 20-9z"/></g>
 <text x="804" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">SHRED!  SPIN!  LOOP!</text>
</g>

<!-- PANEL 3 : remade garment and passport -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="10" fill="url(#atelier)"/>
 <rect x="46" y="723" width="668" height="223" rx="18" fill="#d7b98c" stroke="#795d39" stroke-width="5"/>
 <rect x="82" y="751" width="210" height="150" rx="12" fill="#f7fbf6" stroke="#2f5158" stroke-width="5"/>
 <path d="M139 779l49-23 49 23 27 57-38 18-7-28v63H157v-63l-7 28-38-18z" fill="#3f9d96" stroke="#173c45" stroke-width="5"/>
 <text x="188" y="850" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="900">FTF LOOP</text>
 <rect x="340" y="731" width="326" height="186" rx="15" fill="#173b4d" stroke="#6ee8d8" stroke-width="5"/>
 <text x="503" y="763" text-anchor="middle" fill="#dffff9" font-family="Arial" font-size="18" font-weight="900">DIGITAL MATERIAL PASSPORT</text>
 <rect x="365" y="786" width="98" height="98" fill="#fff"/><g fill="#101010"><rect x="374" y="795" width="26" height="26"/><rect x="423" y="795" width="30" height="30"/><rect x="374" y="841" width="30" height="31"/><rect x="418" y="838" width="13" height="13"/><rect x="441" y="853" width="12" height="19"/><rect x="410" y="865" width="17" height="10"/></g>
 <text x="489" y="811" fill="#fff" font-family="Arial" font-size="15" font-weight="800">RECYCLED FIBER 72%</text><text x="489" y="841" fill="#fff" font-family="Arial" font-size="15" font-weight="800">LOW-SHED VERIFIED</text><text x="489" y="871" fill="#fff" font-family="Arial" font-size="15" font-weight="800">TAKE-BACK READY</text>
 <g filter="url(#sh)"><ellipse cx="612" cy="657" rx="37" ry="43" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M579 649q9-33 35-39q31 6 35 40z" fill="#3a2d2f"/><path d="M573 717q40-24 80 0l30 112H544z" fill="#245b70" stroke="#10212b" stroke-width="5"/><path d="M576 735q-45 8-82 31" stroke="#245b70" stroke-width="21" stroke-linecap="round"/></g>
 <rect x="40" y="542" width="472" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="276" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="276">새 옷에는 원료의 출처와 다시 회수될 길까지 기록된다.</tspan><tspan x="276" dy="24" font-size="14">新衣记录原料来源，也记录再次回收的路径。</tspan><tspan x="276" dy="22" font-size="13">Each new garment records its material origin and its route back into the loop.</tspan></text>
 <rect x="527" y="551" width="204" height="95" rx="22" fill="#eaffd8" stroke="#111" stroke-width="4"/>
 <text x="629" y="581" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="629">끝이 아니라, 다음 시작!</tspan><tspan x="629" dy="22" font-size="13">不是终点，是下一次开始！</tspan><tspan x="629" dy="20" font-size="12">Not an end — a restart!</tspan></text>
 <text x="43" y="979" fill="#fff" stroke="#1b6b67" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">TRACE!  WEAR!  RETURN AGAIN!</text>
</g>

