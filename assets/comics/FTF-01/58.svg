 <g transform="translate(245 238)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="45" width="82" height="30" rx="14" fill="#c8f7ff" opacity=".88" stroke="#173949" stroke-width="4"/><path d="M10 101q48-21 95 7l18 128H0Z" fill="#db6177" stroke="#1d303b" stroke-width="4"/></g>
