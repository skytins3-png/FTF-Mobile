 <g transform="translate(115 205)"><path d="M32 96q58-64 126-4q-18 79-90 86q-50-7-36-82Z" fill="#927b5c" stroke="#21363f" stroke-width="4"/><ellipse cx="88" cy="99" rx="8" ry="7" fill="#111"/><path d="M157 111q48-18 76 4q-32 22-69 15Z" fill="#927b5c" stroke="#21363f" stroke-width="4"/></g>
 <rect class="box" x="18" y="18" width="486" height="144" rx="8"/><text x="38" y="53" class="ko">하지만 해수 온도가 빠르게 오르며 어린 산호가 위험해졌어요.</text><text x="38" y="88" class="ko">연구팀은 즉시 열 스트레스 경보를 확인합니다.</text><text x="38" y="119" class="zh">海温快速上升，幼珊瑚正面临热压力。</text><text x="38" y="149" class="en">Rising water temperature puts baby corals at risk.</text>
 <path class="bubble" d="M510 34h220q16 0 16 16v105q0 16-16 16H630l-25 31 4-31H510q-16 0-16-16V50q0-16 16-16Z"/><text x="529" y="74" class="ko">온도 경보! 바로 보호 작업 시작!</text><text x="529" y="108" class="zh">高温警报！马上开始保护！</text><text x="529" y="141" class="en">Heat alert! Protect them now!</text><text x="45" y="467" class="sfx" fill="#ff574f">BEEP! HEAT ALERT!</text>
</g>
