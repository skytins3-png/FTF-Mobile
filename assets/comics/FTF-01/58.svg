 <g transform="translate(372 222)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="45" width="82" height="30" rx="14" fill="#c8f7ff" opacity=".88" stroke="#173949" stroke-width="4"/><path class="suit" d="M10 101q48-21 95 7l18 128H0Z"/></g>
 <rect class="box" x="18" y="18" width="494" height="145" rx="8"/><text x="38" y="53" class="ko">며칠 뒤, 살아남은 어린 산호 곁으로 물고기가 돌아왔어요.</text><text x="38" y="88" class="ko">마을과 연구팀은 매일 같은 암초를 함께 지켜봅니다.</text><text x="38" y="119" class="zh">几天后，鱼群回到幸存的幼珊瑚身边。</text><text x="38" y="149" class="en">Days later, fish return around the surviving young coral.</text>
 <path class="bubble" d="M520 30h214q15 0 15 15v108q0 15-15 15H636l-26 32 5-32H520q-15 0-15-15V45q0-15 15-15Z"/><text x="539" y="70" class="ko">작은 산호가 다시 바다의 숲이 돼요!</text><text x="539" y="104" class="zh">小珊瑚会重新长成海洋森林！</text><text x="539" y="137" class="en">Baby coral becomes tomorrow's reef!</text><text x="45" y="473" class="sfx" fill="#f6e84f">REEF WATCH! LIFE RETURNS!</text>
</g>
