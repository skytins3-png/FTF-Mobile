 <rect class="box" x="18" y="18" width="492" height="139" rx="8"/><text x="38" y="53" class="ko">잠수사들은 차광막과 온도 센서를 설치해 어린 산호를 지켜요.</text><text x="38" y="88" class="ko">작은 생명을 살리기 위한 정밀한 보호 작전입니다.</text><text x="38" y="119" class="zh">潜水员安装遮阳装置和温度传感器保护幼珊瑚。</text><text x="38" y="148" class="en">Divers add shade and sensors to protect juvenile coral.</text>
 <path class="bubble" d="M514 36h218q15 0 15 15v104q0 15-15 15H636l-25 31 4-31H514q-15 0-15-15V51q0-15 15-15Z"/><text x="531" y="76" class="ko">센서 연결 완료! 온도 계속 확인!</text><text x="531" y="110" class="zh">传感器连接完成！持续监测！</text><text x="531" y="143" class="en">Sensors live! Keep watching!</text><text x="48" y="476" class="sfx" fill="#86f4ff">CLICK! SHADE! GUARD!</text>
</g>
