 <g transform="translate(518 315)"><rect x="0" y="0" width="165" height="90" rx="8" fill="#dfe7e5" stroke="#163846" stroke-width="5"/><g class="coralA"><path d="M32 75q5-43 16-4q7-34 18 1q8-30 18 3q-24 8-52 0Z"/></g><g class="coralB"><path d="M93 74q6-40 16-3q7-31 18 2q7-28 17 2q-25 8-51-1Z"/></g></g>
 <rect class="box" x="18" y="18" width="492" height="143" rx="8"/><text x="38" y="53" class="ko">밤의 산란 뒤, 작은 산호들이 정착판에 자리 잡았어요.</text><text x="38" y="88" class="ko">새로운 산호 숲의 첫 페이지가 열립니다.</text><text x="38" y="119" class="zh">大产卵之后，幼小珊瑚开始在基板上安家。</text><text x="38" y="149" class="en">After spawning night, baby corals begin to settle.</text>
 <path class="bubble" d="M501 30h235q16 0 16 16v112q0 16-16 16H632l-28 32 5-32H501q-16 0-16-16V46q0-16 16-16Z"/><text x="520" y="69" class="ko">봐요! 정말 살아남았어요!</text><text x="520" y="103" class="zh">看！它们真的活下来了！</text><text x="520" y="137" class="en">Look! They made it!</text><text x="47" y="465" class="sfx" fill="#6de8ff">TINY LIFE! NEW REEF!</text>
</g>
<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/><g opacity=".22" stroke="#f8ffff" stroke-width="5"><path d="M95 0L30 290M245 0L155 310M405 0L305 295M590 0L470 310M735 0L620 300"/></g><path d="M4 398Q140 360 285 394T525 382T760 390V500H4Z" fill="#987d62"/>
