 .sfx{font:900 44px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}
 .skin{fill:#e8a77d;stroke:#643c2f;stroke-width:2}.hair{fill:#202b37}.suit{fill:#183b51;stroke:#092331;stroke-width:4}
 .coralA{fill:#ff725f;stroke:#6d2f2c;stroke-width:3}.coralB{fill:#f1c24b;stroke:#6f5723;stroke-width:3}.coralC{fill:#a674e8;stroke:#4c3472;stroke-width:3}
 .line{stroke:#183440;stroke-width:4;stroke-linecap:round;fill:none}
</style>
</defs>
<g>
