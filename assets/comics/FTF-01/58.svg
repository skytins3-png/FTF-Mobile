<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #58 — 작은 산호, 내일의 숲</title>
<desc id="d">Four-panel cinematic manga-style scene continuing after coral spawning: juvenile coral settlement is discovered, a heatwave warning threatens the nursery, divers install shading and monitoring equipment, and a community reef watch celebrates new fish returning. Korean, Chinese and English narration and dialogue, visual sound effects, actual illustrated people, divers, research boat, coral nursery, turtles and reef fish.</desc>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#35bfe8"/><stop offset=".48" stop-color="#087ca9"/><stop offset="1" stop-color="#063958"/></linearGradient>
 <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc26b"/><stop offset=".32" stop-color="#70c9e4"/><stop offset="1" stop-color="#0a6688"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c7298"/><stop offset="1" stop-color="#02293f"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff8c8"/><stop offset=".7" stop-color="#ffd16c"/><stop offset="1" stop-color="#ff9b4f"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".38"/></filter>
