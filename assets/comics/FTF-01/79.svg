<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08162f"/><stop offset=".55" stop-color="#0a4b68"/><stop offset="1" stop-color="#07283b"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22bde8"/><stop offset=".45" stop-color="#0877a5"/><stop offset="1" stop-color="#06334e"/></linearGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb86b"/><stop offset=".42" stop-color="#ffe4a6"/><stop offset="1" stop-color="#2b7592"/></linearGradient>
  <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#89cfe7"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".48"/></filter>
  <style>.t{font-family:Arial,'Malgun Gothic','Noto Sans CJK KR',sans-serif}.b{font-weight:900}.panel{stroke:#fff;stroke-width:7}.box{fill:#fffffff2;stroke:#101820;stroke-width:4}.fx{font-weight:1000;font-style:italic;paint-order:stroke;stroke:#032238;stroke-width:6;stroke-linejoin:round}.small{font-size:17px}.mid{font-size:21px}</style>
</defs>
<rect width="1536" height="1024" fill="#04111d"/>
<g class="t">
<rect width="1536" height="72" fill="#07131f"/><text x="24" y="47" font-size="38" class="b" fill="#fff">FTF-01 #79 · 산호의 첫 회복 신호</text><text x="1045" y="31" font-size="19" class="b" fill="#7de9ff">FIRST SIGNS OF RECOVERY</text><text x="1045" y="56" font-size="18" fill="#fff">珊瑚恢复的第一个信号</text>
<!-- PANEL 1: night alert -->
<g transform="translate(8 80)"><rect width="752" height="455" rx="10" fill="url(#night)" class="panel"/>
 <circle cx="640" cy="80" r="42" fill="#dff4ff" opacity=".9"/><g fill="#dff4ff" opacity=".8"><circle cx="565" cy="56" r="3"/><circle cx="690" cy="140" r="3"/><circle cx="534" cy="119" r="2"/></g>
 <rect x="360" y="105" width="345" height="227" rx="17" fill="#06283f" stroke="#5fdfff" stroke-width="5"/><text x="390" y="145" font-size="21" class="b" fill="#bdefff">REEF SENSOR · NIGHT WATCH</text><polyline points="392,245 440,236 480,248 523,228 562,233 600,195 644,202 680,170" fill="none" stroke="#ffda64" stroke-width="8"/><line x1="390" y1="274" x2="681" y2="274" stroke="#6aaac5" stroke-width="3"/><text x="393" y="308" font-size="25" class="b" fill="#ffcc5d">TEMP +1.8°C</text><circle cx="662" cy="302" r="12" fill="#ff5f57"/>
 <g transform="translate(52 161)"><circle cx="94" cy="69" r="39" fill="#efb68d" stroke="#101820" stroke-width="5"/><path d="M56 62 q12-46 47-40 q34 5 37 42" fill="#35231e"/><path d="M40 115 q54-24 109 4 l28 173H18Z" fill="#123c5d" stroke="#07131d" stroke-width="6"/><text x="66" y="174" font-size="31" class="b" fill="#fff">FTF</text><path d="M146 157 L228 122" stroke="#edb48b" stroke-width="20" stroke-linecap="round"/><circle cx="237" cy="118" r="13" fill="#edb48b"/></g>
 <g filter="url(#sh)"><rect x="18" y="18" width="403" height="127" rx="14" class="box"/><text x="36" y="51" font-size="24" class="b">한밤중, 수온 경보가 울립니다!</text><text x="36" y="82" class="small">새로 심은 산호가 다시 위험해질 수 있습니다.</text><text x="36" y="108" class="small">深夜，水温警报响起，新移植的珊瑚面临风险。</text><text x="36" y="134" class="small">A night heat alert threatens the newly planted coral.</text></g><text x="446" y="416" font-size="48" class="fx" fill="#ffd85f">BEEP—BEEP!</text></g>
<!-- PANEL 2: emergency reef protection -->
<g transform="translate(776 80)"><rect width="752" height="455" rx="10" fill="url(#sea)" class="panel"/>
 <g opacity=".95" stroke-linecap="round"><path d="M35 442 q15-121 47-177 q-6 90 27 177" stroke="#ff6e7d" stroke-width="17"/><path d="M101 442 q2-103 35-158 q-3 85 31 158" stroke="#f6a04b" stroke-width="18"/><path d="M648 442 q1-118 38-173 q-5 86 29 173" stroke="#9867d8" stroke-width="18"/></g>
 <path d="M180 112 Q376 46 579 116 L537 172 Q376 125 214 181Z" fill="#d6f2ff" opacity=".75" stroke="#fff" stroke-width="5"/><path d="M190 117 L129 266 M576 119 L650 266" stroke="#dffaff" stroke-width="7"/>
 <g transform="translate(89 185)"><circle cx="88" cy="70" r="38" fill="#eeb58b" stroke="#0b1a24" stroke-width="5"/><rect x="51" y="55" width="77" height="30" rx="10" fill="#6de0ff" stroke="#10394f" stroke-width="5"/><path d="M38 116 q51-22 104 4 l27 165H16Z" fill="#09283e" stroke="#06141d" stroke-width="6"/><text x="61" y="171" font-size="28" class="b" fill="#fff">FTF</text><path d="M140 154 L242 194" stroke="#eab083" stroke-width="21" stroke-linecap="round"/><circle cx="252" cy="198" r="13" fill="#eab083"/></g>
 <g transform="translate(411 235)"><rect width="170" height="104" rx="16" fill="#18364d" stroke="#83edff" stroke-width="5"/><circle cx="45" cy="52" r="29" fill="#78dbff"/><path d="M45 24 V80 M17 52 H73" stroke="#fff" stroke-width="5"/><text x="84" y="46" font-size="18" class="b" fill="#fff">FLOW</text><text x="84" y="72" font-size="18" class="b" fill="#fff">PUMP</text><path d="M170 50 q65-35 115-15" fill="none" stroke="#a6f5ff" stroke-width="11" stroke-linecap="round"/></g>
 <g filter="url(#sh)"><rect x="18" y="18" width="405" height="128" rx="14" class="box"/><text x="36" y="51" font-size="24" class="b">잠수팀이 즉시 산호를 보호합니다</text><text x="36" y="82" class="small">차광막과 순환 펌프로 열 스트레스를 낮춥니다.</text><text x="36" y="109" class="small">潜水队架设遮阳网并启动循环泵降温。</text><text x="36" y="135" class="small">Divers deploy shade cloth and a flow pump to cool the reef.</text></g><text x="377" y="410" font-size="44" class="fx" fill="#83f3ff">COOL THE REEF!</text></g>
<!-- PANEL 3: dawn recovery -->
<g transform="translate(8 543)"><rect width="752" height="473" rx="10" fill="url(#dawn)" class="panel"/><circle cx="634" cy="91" r="54" fill="#fff5b9"/>
 <path d="M0 294 Q170 245 344 294 T752 278 V473 H0Z" fill="#0a6e91"/><path d="M0 329 Q175 282 344 323 T752 309" fill="none" stroke="#ffd989" stroke-width="8" opacity=".8"/>
 <g transform="translate(67 190)"><circle cx="84" cy="61" r="36" fill="#efb68d" stroke="#13212b" stroke-width="5"/><path d="M51 54 q9-39 39-35 q30 4 32 38" fill="#33231e"/><path d="M35 104 q50-22 102 4 l24 148H13Z" fill="#123a59"/><text x="59" y="158" font-size="27" class="b" fill="#fff">FTF</text></g>
 <g transform="translate(289 203)"><rect width="247" height="153" rx="14" fill="#083f5c" stroke="#b0f4ff" stroke-width="5"/><text x="21" y="32" font-size="18" class="b" fill="#c8f6ff">MORNING REEF CAM</text><rect x="18" y="48" width="211" height="82" rx="7" fill="#1184a5"/><g fill="#ff7b6d"><circle cx="55" cy="88" r="14"/><circle cx="92" cy="73" r="12"/><circle cx="126" cy="94" r="15"/><circle cx="169" cy="73" r="13"/></g><g stroke="#ffd8ce" stroke-width="4"><path d="M55 74 v-20 M47 60 l8-7 8 7 M92 61 v-18 M126 79 v-24 M169 60 v-19"/></g></g>
 <g transform="translate(546 188)"><ellipse cx="83" cy="72" rx="67" ry="40" fill="#71a882" stroke="#174537" stroke-width="6"/><ellipse cx="154" cy="65" rx="24" ry="19" fill="#8ec18c" stroke="#174537" stroke-width="5"/><path d="M47 65 q35-27 69 1 q-31 28-69 0 M52 88 q29-21 61 1" fill="none" stroke="#315f48" stroke-width="4"/><path d="M52 89 q-49 42-70 18 q20-36 61-46" fill="#78b487" stroke="#174537" stroke-width="5"/></g>
 <g filter="url(#sh)"><rect x="18" y="18" width="447" height="128" rx="14" class="box"/><text x="36" y="51" font-size="24" class="b">새벽, 산호 폴립이 다시 열렸습니다!</text><text x="36" y="82" class="small">회복 신호가 카메라에 잡히고 바다거북도 돌아옵니다.</text><text x="36" y="109" class="small">清晨，珊瑚虫重新舒展，海龟也再次出现。</text><text x="36" y="135" class="small">At dawn, coral polyps reopen—and the turtle returns.</text></g><text x="316" y="433" font-size="46" class="fx" fill="#fff2a5">LIFE RESPONDS!</text></g>
<!-- PANEL 4: community promise -->
<g transform="translate(776 543)"><rect width="752" height="473" rx="10" fill="url(#lab)" class="panel"/>
 <rect x="464" y="68" width="243" height="254" rx="15" fill="#fff" stroke="#164d6b" stroke-width="6"/><text x="490" y="101" font-size="22" class="b" fill="#164d6b">REEF ADOPTION</text><text x="490" y="129" font-size="19" class="b" fill="#164d6b">산호 지킴이 약속</text><text x="490" y="157" font-size="18" fill="#164d6b">珊瑚守护约定</text><g stroke="#1f607e" stroke-width="3"><line x1="489" y1="189" x2="675" y2="189"/><line x1="489" y1="225" x2="675" y2="225"/><line x1="489" y1="261" x2="675" y2="261"/></g><g fill="#ff7b6d"><path d="M650 285 c14-22 45-3 25 17 l-25 23-25-23c-20-20 11-39 25-17"/></g>
 <g transform="translate(68 147)"><circle cx="85" cy="64" r="36" fill="#efb88f" stroke="#13212b" stroke-width="5"/><path d="M52 56 q9-40 41-35 q29 5 31 38" fill="#34241f"/><path d="M34 106 q51-23 103 4 l25 175H13Z" fill="#123b5b"/><text x="57" y="162" font-size="27" class="b" fill="#fff">FTF</text><circle cx="226" cy="105" r="28" fill="#efbc96" stroke="#13212b" stroke-width="4"/><path d="M200 98 q6-28 31-25 q22 3 24 28" fill="#3b2c25"/><path d="M192 139 q36-17 73 2 l17 115H180Z" fill="#fff6df" stroke="#19354c" stroke-width="4"/><text x="199" y="185" font-size="16" class="b" fill="#176183">OCEAN</text><circle cx="330" cy="108" r="28" fill="#eebb95" stroke="#13212b" stroke-width="4"/><path d="M304 100 q7-29 31-25 q23 4 25 29" fill="#2b201c"/><path d="M296 143 q37-18 75 2 l17 111H284Z" fill="#eef9ff" stroke="#19354c" stroke-width="4"/><text x="305" y="187" font-size="16" class="b" fill="#176183">FTF KIDS</text></g>
 <g filter="url(#sh)"><rect x="18" y="18" width="423" height="128" rx="14" class="box"/><text x="36" y="51" font-size="24" class="b">회복은 하루로 끝나지 않습니다</text><text x="36" y="82" class="small">연구팀과 아이들이 한 구역씩 계속 지키기로 약속합니다.</text><text x="36" y="109" class="small">研究团队和孩子们约定持续守护每一片珊瑚区。</text><text x="36" y="135" class="small">The team and children pledge to protect each reef zone.</text></g>
 <text x="250" y="416" font-size="42" class="fx" fill="#ffef83">WATCH · PROTECT · RECOVER!</text><text x="430" y="452" font-size="20" class="b" fill="#123c59">작은 실천이 만드는 큰 회복 · 小行动带来大恢复</text></g>
</g></svg>