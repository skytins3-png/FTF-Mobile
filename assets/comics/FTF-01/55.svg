<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #55 — 바닷속 초원을 되살리다</title>
<desc id="d">Four-panel cinematic manga-style scene continuing FTF-01 in strict story order: a coastal family learns about seagrass, an injured seafloor shows damage from anchors and trash, divers and residents restore a seagrass nursery, and the recovered meadow shelters fish, a sea turtle and a dugong. Korean, Chinese and English captions, speech bubbles and visual sound effects are integrated into story-specific illustrated environments.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67c9ff"/><stop offset="1" stop-color="#eaf9ff"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#32cbe2"/><stop offset=".5" stop-color="#1187ba"/><stop offset="1" stop-color="#063f6c"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a6e91"/><stop offset="1" stop-color="#06283c"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd676"/><stop offset=".48" stop-color="#76d4e8"/><stop offset="1" stop-color="#0b6d9a"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".32"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .panel{stroke:#101820;stroke-width:10}.box{fill:#fffdf2;stroke:#101820;stroke-width:4}.bubble{fill:#fff;stroke:#111;stroke-width:4}.ko{font:700 27px sans-serif;fill:#111923}.zh{font:600 21px sans-serif;fill:#16415f}.en{font:600 20px sans-serif;fill:#17222c}.sfx{font:900 42px sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.line{stroke:#26333c;stroke-width:5;stroke-linecap:round;fill:none}.face{stroke:#5b3528;stroke-width:2}
 </style>
</defs>
<!-- PANEL 1: discovery at restored coast -->
<g>
 <rect class="panel" x="4" y="4" width="760" height="500" fill="url(#sky)"/>
 <path d="M4 275 Q170 245 350 275 T760 265 V500H4Z" fill="url(#sea)"/>
 <path d="M4 390 Q150 350 320 392 T760 375 V500H4Z" fill="#d7c48f"/>
 <g fill="#f8f1dc" stroke="#6b4b39" stroke-width="3"><rect x="32" y="220" width="145" height="88"/><path d="M18 220 l87-62 88 62Z" fill="#e46f48"/><rect x="88" y="256" width="34" height="52" fill="#78adc2"/></g>
 <g transform="translate(410 135)" filter="url(#shadow)"><ellipse class="face" cx="78" cy="62" rx="45" ry="52" fill="#d89d75"/><path d="M33 58q7-47 49-50q44 2 44 54q-27-21-48-18q-20 1-45 14" fill="#27323d"/><ellipse cx="61" cy="65" rx="5" ry="7"/><ellipse cx="94" cy="65" rx="5" ry="7"/><path d="M60 91q18 13 36 0" class="line" stroke-width="3"/><path d="M28 113q53-22 100 10l20 150H8Z" fill="#ef8b2e" stroke="#26333d" stroke-width="4"/></g>
 <g transform="translate(250 185)" filter="url(#shadow)"><ellipse class="face" cx="65" cy="54" rx="40" ry="46" fill="#efb18d"/><path d="M25 51q5-41 42-44q40 1 41 48q-22-18-42-17q-20 0-41 13" fill="#4d2d28"/><path d="M24 98q45-18 83 9l17 128H7Z" fill="#ef7180" stroke="#26333d" stroke-width="4"/><path d="M106 126q42 21 75 63" stroke="#efb18d" stroke-width="15" fill="none" stroke-linecap="round"/></g>
 <g fill="#1f9e5b" stroke="#176f44" stroke-width="2"><path d="M520 415q-14-80 4-118q17 45 11 119Z"/><path d="M550 420q-10-72 14-110q13 48 0 112Z"/><path d="M580 418q-4-66 25-105q6 47-12 109Z"/><path d="M616 420q-12-70 8-109q16 43 6 111Z"/></g>
 <rect class="box" x="18" y="18" width="393" height="130" rx="8"/><text x="35" y="53" class="ko">맹그로브 다음은 바닷속 초원이에요.</text><text x="35" y="86" class="ko">잘피는 어린 생명의 숨을 곳을 만들어요.</text><text x="35" y="116" class="zh">红树林之后，我们还要守护海草床。</text><text x="35" y="144" class="en">Next, we protect the underwater meadows.</text>
 <path class="bubble" d="M455 22h277q17 0 17 17v108q0 17-17 17H615l-29 33 5-33H455q-17 0-17-17V39q0-17 17-17Z"/><text x="475" y="62" class="ko">잘피가 물고기의 아기방이래!</text><text x="475" y="96" class="zh">海草床是小鱼的育儿室！</text><text x="475" y="129" class="en">Seagrass is a nursery for young fish!</text>
 <text x="70" y="466" class="sfx" fill="#13955c">DISCOVER! PROTECT!</text>
</g>
