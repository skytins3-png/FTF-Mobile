<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/>
 <g opacity=".42" stroke="#b9efff" stroke-width="5"><path d="M60 0L20 250M180 0L100 260M310 0L225 275M440 0L330 280M570 0L450 270M700 0L565 280"/></g>
 <path d="M4 370Q180 330 350 382T760 365V500H4Z" fill="#806e56"/>
 <g fill="none" stroke="#333" stroke-width="8"><path d="M145 350q70-60 145 5t165 0"/><path d="M260 405q90-65 195 5"/></g>
 <g fill="#999"><rect x="95" y="335" width="70" height="28" transform="rotate(12 130 349)"/><rect x="520" y="350" width="55" height="24" transform="rotate(-18 548 362)"/></g>
 <g transform="translate(420 215)" filter="url(#shadow)"><path d="M25 75q60-62 130-4q-17 78-90 84q-48-8-40-80Z" fill="#70634e" stroke="#2b2c28" stroke-width="4"/><ellipse cx="84" cy="79" rx="9" ry="8" fill="#111"/><path d="M152 88q52-18 80 5q-33 20-74 15Z" fill="#756851" stroke="#2b2c28" stroke-width="4"/><path d="M48 128q-5 49-42 74q47 6 78-45" fill="#756851" stroke="#2b2c28" stroke-width="4"/></g>
 <path d="M190 40q20 90 8 170q-22 29-40 92" stroke="#3a3a3a" stroke-width="14" fill="none"/><path d="M142 295l31 39l38-31l-8 69l-70-6Z" fill="#6b6b6b" stroke="#222" stroke-width="4"/>
 <rect class="box" x="20" y="18" width="512" height="132" rx="8"/><text x="38" y="53" class="ko">무거운 닻과 쓰레기가 잘피밭을 긁어 없애요.</text><text x="38" y="87" class="ko">숨을 곳을 잃은 바다 생명도 함께 줄어듭니다.</text><text x="38" y="117" class="zh">船锚和垃圾会破坏海草床，让海洋生物失去家园。</text><text x="38" y="145" class="en">Anchors and trash tear up seagrass habitat.</text>
 <path class="bubble" d="M520 172h210q16 0 16 16v91q0 16-16 16H628l-22 31 3-31H520q-16 0-16-16v-91q0-16 16-16Z"/><text x="541" y="211" class="ko">우리 집이 사라져요!</text><text x="541" y="244" class="zh">我们的家不见了！</text><text x="541" y="276" class="en">Our home is disappearing!</text>
 <text x="75" y="462" class="sfx" fill="#ef3a35">SCRAPE! STOP!</text>
</g>
<!-- PANEL 3: active restoration -->
<g transform="translate(0 512)">
 <rect class="panel" x="4" y="4" width="760" height="508" fill="url(#sea)"/>
 <g opacity=".35" stroke="#d5fbff" stroke-width="5"><path d="M60 0L10 250M190 0L100 260M330 0L225 280M470 0L350 278M620 0L480 278M740 0L590 285"/></g>
 <path d="M4 355Q190 312 375 360T760 350V508H4Z" fill="#b79b6c"/>
