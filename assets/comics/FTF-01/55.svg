 <g transform="translate(330 245)" filter="url(#shadow)"><ellipse cx="105" cy="78" rx="112" ry="58" fill="#a9aca7" stroke="#545c5d" stroke-width="4"/><ellipse cx="22" cy="77" rx="48" ry="39" fill="#b8bbb6" stroke="#545c5d" stroke-width="4"/><ellipse cx="5" cy="70" rx="5" ry="6" fill="#111"/><path d="M210 69q63-42 94 1q-44 17-87 33Z" fill="#a9aca7" stroke="#545c5d" stroke-width="4"/><path d="M115 124q-24 44-62 50q8-38 39-63" fill="#9da29f" stroke="#545c5d" stroke-width="4"/></g>
 <!-- turtle -->
 <g transform="translate(155 255)" filter="url(#shadow)"><ellipse cx="65" cy="56" rx="56" ry="43" fill="#6e8d52" stroke="#32472d" stroke-width="4"/><path d="M21 51q44-34 87 0q-38 39-87 0Z" fill="#94ad68"/><ellipse cx="126" cy="59" rx="24" ry="18" fill="#80945f"/><circle cx="134" cy="55" r="3"/><path d="M39 90q-36 37-58 15q33-9 48-35M80 91q31 35 58 17q-30-12-48-38" fill="#7f9960" stroke="#32472d" stroke-width="3"/></g>
 <g fill="#f2cf43"><path d="M100 220q30-18 60 0q-28 26-60 0Z"/><path d="M600 215q32-18 64 0q-30 25-64 0Z"/></g>
 <g fill="#ee7448"><path d="M565 310q28-15 54 0q-25 22-54 0Z"/><path d="M250 195q24-13 48 0q-22 20-48 0Z"/></g>
 <rect class="box" x="18" y="18" width="505" height="132" rx="8"/><text x="36" y="53" class="ko">잘피 초원이 돌아오자 물고기와 거북이,</text><text x="36" y="87" class="ko">듀공까지 다시 찾아오는 바다가 됩니다.</text><text x="36" y="117" class="zh">海草床恢复后，鱼、海龟和儒艮都回来了。</text><text x="36" y="145" class="en">The restored meadow brings marine life home.</text>
 <path class="bubble" d="M530 25h205q15 0 15 15v89q0 15-15 15H644l-23 30 4-30H530q-15 0-15-15V40q0-15 15-15Z"/><text x="550" y="63" class="ko">바닷속 초원이 돌아왔어요!</text><text x="550" y="97" class="zh">海底草原回来了！</text><text x="550" y="128" class="en">The underwater meadow is back!</text>
 <text x="44" y="472" class="sfx" fill="#18a85c">BLUE CARBON! LIVING OCEAN!</text>
</g>
</svg>