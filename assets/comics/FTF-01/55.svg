 <!-- diver 1 -->
 <g transform="translate(280 155)" filter="url(#shadow)"><ellipse cx="62" cy="54" rx="40" ry="44" fill="#e6aa84" stroke="#59372b" stroke-width="2"/><path d="M20 50q8-41 45-44q40 2 40 47q-25-18-44-16q-19 0-41 13" fill="#272f39"/><rect x="22" y="49" width="82" height="31" rx="14" fill="#bdefff" opacity=".76" stroke="#173949" stroke-width="4"/><path d="M18 101q50-20 92 10l19 118H1Z" fill="#233e59" stroke="#162735" stroke-width="4"/><path d="M98 130q58 34 88 88" stroke="#e6aa84" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M180 212q-8 25-1 55" stroke="#176b43" stroke-width="5"/></g>
 <!-- diver 2 -->
 <g transform="translate(500 165)" filter="url(#shadow)"><ellipse cx="58" cy="50" rx="36" ry="41" fill="#efb18d" stroke="#59372b" stroke-width="2"/><path d="M22 47q6-39 38-41q36 1 38 43q-22-17-39-15q-17 0-37 13" fill="#4d2e28"/><rect x="22" y="44" width="73" height="29" rx="13" fill="#c8f5ff" opacity=".8" stroke="#173949" stroke-width="4"/><path d="M20 94q42-17 78 8l16 110H5Z" fill="#ee6f7f" stroke="#20313d" stroke-width="4"/><path d="M18 120q-45 30-72 76" stroke="#efb18d" stroke-width="15" fill="none" stroke-linecap="round"/></g>
 <g fill="#fff" opacity=".75"><circle cx="410" cy="140" r="8"/><circle cx="426" cy="112" r="6"/><circle cx="618" cy="150" r="7"/><circle cx="635" cy="128" r="5"/></g>
 <rect class="box" x="18" y="18" width="468" height="132" rx="8"/><text x="36" y="53" class="ko">잠수사와 주민이 잘피 모종을 심고</text><text x="36" y="87" class="ko">보호 부표로 닻이 들어오지 않게 지켜요.</text><text x="36" y="117" class="zh">潜水员和居民种下海草，并设置保护浮标。</text><text x="36" y="145" class="en">Divers replant seagrass and mark a no-anchor zone.</text>
 <path class="bubble" d="M500 24h232q16 0 16 16v88q0 16-16 16H625l-23 31 3-31H500q-16 0-16-16V40q0-16 16-16Z"/><text x="520" y="62" class="ko">한 포기씩 바다를 살려요!</text><text x="520" y="96" class="zh">一株一株，让海洋重生！</text><text x="520" y="128" class="en">One shoot at a time!</text>
 <text x="58" y="474" class="sfx" fill="#0b93d2">PLANT! GROW! GUARD!</text>
</g>
