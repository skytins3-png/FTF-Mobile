 </g>
 <!-- male crew -->
 <g filter="url(#shadow)"><ellipse cx="235" cy="329" rx="33" ry="39" fill="#d6a181" stroke="#17212c" stroke-width="4"/><path d="M203 322 Q210 285 240 289 Q265 292 270 324" fill="#20262d"/><path d="M201 366 L267 366 L287 484 L179 484Z" fill="#123d61" stroke="#17212c" stroke-width="4"/><text x="235" y="424" fill="#fff" font-size="22" text-anchor="middle" font-weight="900">FTF</text></g>
 <!-- narration/bubbles -->
 <rect x="34" y="98" width="302" height="127" rx="27" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="185" y="129" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="20" font-weight="900"><tspan x="185">밤새 폭풍이 지나갔어.</tspan><tspan x="185" dy="25">해안으로 쓰레기가 밀려왔어!</tspan><tspan x="185" dy="25" font-size="17">暴风雨一夜之间把垃圾冲上岸。</tspan><tspan x="185" dy="22" font-size="16">The storm washed debris onto the shore.</tspan></text>
 <rect x="477" y="95" width="256" height="115" rx="24" fill="#fff7d9" stroke="#111" stroke-width="4"/>
 <text x="605" y="127" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="19" font-weight="900"><tspan x="605">먼저 생명을 찾고,</tspan><tspan x="605" dy="24">그 다음 해안을 정리하자.</tspan><tspan x="605" dy="23" font-size="16">先救生命，再清理海岸。</tspan><tspan x="605" dy="21" font-size="15">Life first. Cleanup next.</tspan></text>
 <text x="38" y="495" fill="#fff" stroke="#0b4f79" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="42" font-weight="1000" font-style="italic">MOVE! MOVE!</text>
</g>

<!-- PANEL 2: seabird rescue -->
<g clip-path="url(#p2)">
