 <linearGradient id="shore" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0cf91"/><stop offset="1" stop-color="#b9804c"/></linearGradient>
 <linearGradient id="lab" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#194c72"/><stop offset="1" stop-color="#071d32"/></linearGradient>
