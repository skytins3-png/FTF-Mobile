<defs>
 <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffbf7a"/><stop offset=".45" stop-color="#87d5f5"/><stop offset="1" stop-color="#eaf9ff"/></linearGradient>
