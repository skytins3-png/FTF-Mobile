 <rect x="794" y="550" width="358" height="157" rx="28" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="973" y="583" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="20" font-weight="900"><tspan x="973">한 마리의 생명을 살리고,</tspan><tspan x="973" dy="25">한 조각의 쓰레기를 치우는 일이</tspan><tspan x="973" dy="25">결국 바다 전체를 바꿔.</tspan><tspan x="973" dy="24" font-size="16">救一条生命，捡一片垃圾，最终会改变整片海洋。</tspan><tspan x="973" dy="22" font-size="15">Save one life. Remove one piece. Change the whole coast.</tspan></text>
 <rect x="1187" y="729" width="301" height="114" rx="22" fill="#fff7d9" stroke="#111" stroke-width="4"/>
 <text x="1337" y="761" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="19" font-weight="900"><tspan x="1337">다음 폭풍이 와도</tspan><tspan x="1337" dy="24">우리는 더 잘 지킬 수 있어.</tspan><tspan x="1337" dy="23" font-size="16">下一场风暴来时，我们会准备得更好。</tspan><tspan x="1337" dy="21" font-size="15">Next storm, we’ll be ready.</tspan></text>
 <text x="818" y="969" fill="#fff" stroke="#0a527f" stroke-width="8" paint-order="stroke" font-family="Arial" font-size="45" font-weight="1000" font-style="italic">RESCUE · RECORD · RESTORE</text>
</g>

