 <rect x="35" y="551" width="331" height="160" rx="28" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="200" y="583" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="20" font-weight="900"><tspan x="200">이건 그냥 청소가 아니야.</tspan><tspan x="200" dy="25">종류별로 기록해야 다음 폭풍을 대비할 수 있어.</tspan><tspan x="200" dy="25" font-size="16">这不只是清理，还要分类记录数据。</tspan><tspan x="200" dy="22" font-size="15">We sort and log it, so the next storm hurts less.</tspan></text>
 <text x="60" y="972" fill="#fff" stroke="#0e4466" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="44" font-weight="1000" font-style="italic">SORT! SCAN! LOG!</text>
</g>

