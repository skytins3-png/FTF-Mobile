 <rect x="793" y="99" width="336" height="124" rx="27" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="961" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="20" font-weight="900"><tspan x="961">갈매기가 폐낚싯줄에 걸렸어!</tspan><tspan x="961" dy="25">천천히, 날개를 다치지 않게.</tspan><tspan x="961" dy="24" font-size="16">海鸟被废弃鱼线缠住了，小心翅膀！</tspan><tspan x="961" dy="22" font-size="15">Easy—protect the wing while cutting the line.</tspan></text>
 <text x="1162" y="455" fill="#ffe34c" stroke="#112839" stroke-width="8" paint-order="stroke" font-family="Arial" font-size="46" font-weight="1000" transform="rotate(-8 1162 455)">SNIP!</text>
 <rect x="1290" y="105" width="205" height="95" rx="16" fill="#fff7d9" stroke="#111" stroke-width="3"/>
 <text x="1392" y="135" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1392">구조가 먼저다.</tspan><tspan x="1392" dy="22" font-size="15">先救援。</tspan><tspan x="1392" dy="20" font-size="14">Rescue comes first.</tspan></text>
</g>

