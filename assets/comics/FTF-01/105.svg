<rect width="1536" height="1024" fill="#061522"/>
<rect x="14" y="13" width="1508" height="56" rx="12" fill="#07131f"/>
<text x="35" y="51" fill="#fff" font-family="Arial,Malgun Gothic,sans-serif" font-size="34" font-weight="900">FTF-01  #105  폭풍 뒤, 우리가 지키는 해안</text>
<text x="790" y="49" fill="#9cecff" font-family="Arial,sans-serif" font-size="20" font-weight="800">AFTER THE STORM · 暴风雨后，我们守护海岸</text>

<!-- PANEL 1: dawn shoreline after storm -->
<g clip-path="url(#p1)">
