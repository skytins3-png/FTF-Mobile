<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<title>FTF-01 Scene 49 - Clean Water, Brighter Tomorrow</title>
<desc>Four-panel cinematic manga scene about saving water at home, polluted river wildlife, water-treatment recycling, and a restored clean river city. Korean, Chinese and English dialogue, narration and sound effects included.</desc>
<defs>
 <linearGradient id="home" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4d6"/><stop offset="1" stop-color="#d6efff"/></linearGradient>
 <linearGradient id="dirty" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#68717c"/><stop offset="1" stop-color="#26323c"/></linearGradient>
 <linearGradient id="plant" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f2ff"/><stop offset="1" stop-color="#9bd7cf"/></linearGradient>
 <linearGradient id="clean" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83d9ff"/><stop offset=".55" stop-color="#d9f7ff"/><stop offset="1" stop-color="#58b877"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>
 <style>
 .panel{stroke:#111;stroke-width:8}.box{fill:#fff;stroke:#111;stroke-width:3;rx:12}.bubble{fill:#fff;stroke:#111;stroke-width:4}.ko{font:700 25px sans-serif;fill:#111}.zh{font:600 21px sans-serif;fill:#222}.en{font:600 19px sans-serif;fill:#222}.sfx{font:900 48px sans-serif;stroke:#111;stroke-width:5;paint-order:stroke;fill:#28a9ff}.sfx2{font:900 44px sans-serif;stroke:#111;stroke-width:5;paint-order:stroke;fill:#ff3b30}.tiny{font:700 16px sans-serif}.face{fill:#ffd8c2;stroke:#4d2c22;stroke-width:3}.hair{fill:#38251f;stroke:#17100d;stroke-width:3}.shirt{stroke:#15222a;stroke-width:3}.eye{fill:#151515}.water{fill:#45b8e8}.leaf{fill:#42a85b}
 </style>
</defs>
<!-- PANEL 1 HOME WATER SAVING -->
<g transform="translate(0 0)">
 <rect class="panel" width="600" height="400" fill="url(#home)"/>
 <rect x="20" y="18" width="310" height="93" class="box" filter="url(#shadow)"/>
 <text x="38" y="49" class="ko">작은 물 절약이 큰 변화를 만듭니다.</text><text x="38" y="77" class="zh">节约每一滴水，改变我们的未来。</text><text x="38" y="103" class="en">Every drop saved changes our future.</text>
 <!-- bathroom sink -->
 <rect x="55" y="270" width="260" height="80" rx="18" fill="#f9fbff" stroke="#617483" stroke-width="4"/>
 <ellipse cx="185" cy="307" rx="92" ry="30" fill="#d8edf5" stroke="#617483" stroke-width="3"/>
 <path d="M185 282v-44h48q28 0 28 28" fill="none" stroke="#7d8c95" stroke-width="15" stroke-linecap="round"/>
 <path d="M260 266v18" stroke="#48b9e5" stroke-width="8" stroke-linecap="round"/>
 <!-- boy -->
 <circle cx="170" cy="205" r="48" class="face"/><path d="M123 199q8-67 64-55 44 8 34 58-16-24-42-24-32 0-56 21" class="hair"/>
 <circle cx="154" cy="207" r="5" class="eye"/><circle cx="189" cy="207" r="5" class="eye"/><path d="M157 229q18 14 35-2" fill="none" stroke="#b64a4a" stroke-width="4"/>
 <path d="M126 248q46-25 94 0l27 74H102z" fill="#2877c9" class="shirt"/>
 <path d="M139 265q-20 10-41 28" stroke="#ffd8c2" stroke-width="20" stroke-linecap="round"/><path d="M97 293l46-34" stroke="#4d2c22" stroke-width="3"/>
 <circle cx="102" cy="291" r="12" fill="#ffd8c2" stroke="#4d2c22" stroke-width="3"/>
 <!-- mother -->
 <circle cx="425" cy="188" r="50" class="face"/><path d="M372 190q-8-71 57-67 59 8 45 72-18-31-48-32-32 0-54 27" class="hair"/>
 <circle cx="409" cy="192" r="5" class="eye"/><circle cx="442" cy="192" r="5" class="eye"/><path d="M411 215q17 14 34 0" fill="none" stroke="#b64a4a" stroke-width="4"/>
 <path d="M380 235q47-20 92 0l34 104H347z" fill="#f1a08f" class="shirt"/>
 <!-- bubble -->
 <path class="bubble" d="M286 122h256q24 0 24 24v95q0 24-24 24H410l-32 31 8-31H286q-24 0-24-24v-95q0-24 24-24z"/>
 <text x="292" y="155" class="ko">물은 생명이야. 꼭 잠가요!</text><text x="292" y="187" class="zh">水就是生命，记得关好水龙头！</text><text x="292" y="219" class="en">Water is life. Turn the tap off!</text>
 <text x="226" y="332" class="sfx">CLICK!</text>
 <rect x="20" y="344" width="560" height="40" rx="10" fill="#0d4c6c"/><text x="42" y="371" font-family="sans-serif" font-size="19" font-weight="800" fill="white">물이 필요할 때만 사용해요  |  只在需要时用水  |  Use water only when needed</text>
</g>
<!-- PANEL 2 POLLUTED RIVER -->
<g transform="translate(600 0)">
 <rect class="panel" width="600" height="400" fill="url(#dirty)"/>
 <circle cx="500" cy="70" r="36" fill="#e7d9aa" opacity=".5"/>
 <!-- factories -->
 <rect x="330" y="85" width="70" height="145" fill="#39434a"/><rect x="420" y="110" width="82" height="120" fill="#323c43"/><rect x="516" y="78" width="46" height="152" fill="#3e474d"/>
 <rect x="350" y="20" width="22" height="120" fill="#41474c"/><rect x="449" y="35" width="22" height="105" fill="#41474c"/><path d="M361 25q25-45 70-4t64-6q28-29 72 5" fill="none" stroke="#232323" stroke-width="35" stroke-linecap="round" opacity=".86"/>
 <!-- polluted river -->
 <path d="M0 246q142-43 300-5t300-13v172H0z" fill="#415b62"/><path d="M0 280q120 21 216-4t220 9 164-3" fill="none" stroke="#617a78" stroke-width="8"/>
 <!-- trash -->
 <g fill="#d9d9d9" stroke="#222" stroke-width="2"><rect x="66" y="272" width="48" height="18" transform="rotate(14 90 281)"/><rect x="162" y="304" width="38" height="20" transform="rotate(-18 181 314)"/><circle cx="270" cy="274" r="16" fill="#4d8cc7"/><rect x="480" y="292" width="58" height="15" transform="rotate(9 509 300)"/></g>
 <!-- turtle -->
 <ellipse cx="360" cy="312" rx="73" ry="43" fill="#64845d" stroke="#1e3823" stroke-width="5"/><path d="M315 291q45-25 88 9-13 42-51 43-27-7-37-52z" fill="#7a966a" stroke="#334c33" stroke-width="4"/><circle cx="434" cy="305" r="25" fill="#8ca875" stroke="#334c33" stroke-width="4"/><circle cx="443" cy="299" r="4" fill="#111"/><path d="M325 280q33 28 73 37M330 335q24-30 62-49" stroke="#455f42" stroke-width="3"/>
 <path d="M295 270q85 52 158 88M290 344q88-64 171-79" stroke="#d4d8db" stroke-width="7" opacity=".8"/>
 <!-- kids -->
 <circle cx="92" cy="195" r="39" class="face"/><path d="M53 193q4-56 48-53 43 5 36 53-19-20-43-19-24 0-41 19" class="hair"/><path d="M57 227q37-18 72 1l22 78H35z" fill="#2877c9" class="shirt"/><path d="M78 195q6 7 12 0M107 195q6 7 12 0" fill="none" stroke="#111" stroke-width="5"/><path d="M83 214q14-8 27 0" fill="none" stroke="#9a3a3a" stroke-width="4"/>
 <path class="bubble" d="M112 112h205q22 0 22 22v80q0 22-22 22H214l-28 26 7-26h-81q-22 0-22-22v-80q0-22 22-22z"/>
 <text x="127" y="145" class="ko">냄새가 너무 심해요…</text><text x="127" y="174" class="zh">味道太难闻了……</text><text x="127" y="203" class="en">It smells so bad…</text>
 <rect x="18" y="18" width="315" height="80" class="box"/><text x="35" y="48" class="ko">오염된 물은 모두를 아프게 합니다.</text><text x="35" y="77" class="zh">被污染的水会伤害所有生命。</text>
 <text x="371" y="185" class="sfx2">HELP!</text><text x="352" y="238" class="sfx2" font-size="35">STOP POLLUTION!</text>
</g>
<!-- PANEL 3 WATER TREATMENT -->
<g transform="translate(0 400)">
 <rect class="panel" width="600" height="400" fill="url(#plant)"/>
 <!-- tanks and pipes -->
 <ellipse cx="368" cy="224" rx="170" ry="85" fill="#79c9df" stroke="#326b7d" stroke-width="6"/><ellipse cx="368" cy="224" rx="135" ry="57" fill="#bcecff" stroke="#5da6bd" stroke-width="4"/>
 <path d="M48 294h475M500 294v-76h62v-91" fill="none" stroke="#657b86" stroke-width="18"/>
 <rect x="330" y="75" width="180" height="70" rx="8" fill="#eaf6f9" stroke="#2c5a69" stroke-width="4"/><text x="350" y="107" class="ko">물 재생 센터</text><text x="350" y="133" class="en">WATER RECYCLING</text>
 <!-- worker -->
 <circle cx="125" cy="217" r="45" class="face"/><path d="M80 210q7-54 50-53 42 3 42 53" class="hair"/><path d="M84 178q38-35 84 0" fill="#f4f7f8" stroke="#1f5966" stroke-width="4"/><rect x="80" y="172" width="95" height="14" rx="7" fill="#fff" stroke="#1f5966" stroke-width="4"/><circle cx="111" cy="218" r="5" class="eye"/><circle cx="143" cy="218" r="5" class="eye"/><path d="M112 240q15 10 30 0" fill="none" stroke="#b64a4a" stroke-width="4"/><path d="M78 258q47-22 95 0l38 115H41z" fill="#226b7d" class="shirt"/>
 <path class="bubble" d="M35 28h274q23 0 23 23v112q0 23-23 23H177l-29 30 6-30H35q-23 0-23-23V51q0-23 23-23z"/>
 <text x="52" y="62" class="ko">오염된 물을 깨끗하게 정화해요.</text><text x="52" y="94" class="zh">把受污染的水净化后再次使用。</text><text x="52" y="126" class="en">We clean polluted water and use it again.</text><text x="52" y="157" class="ko">물의 순환은 지구의 미래입니다.</text>
 <text x="279" y="356" class="sfx">RECYCLE WATER!</text>
 <g transform="translate(472 182)"><circle r="39" fill="#fff" stroke="#2f7f8f" stroke-width="4"/><path d="M-8-23q27 11 20 35Q7 30-10 28-35 22-30 0-26-17-8-23z" fill="#3fb45d"/><path d="M-7 22Q1 1 20-11" fill="none" stroke="#1e6e39" stroke-width="4"/></g>
</g>
<!-- PANEL 4 RESTORED RIVER CITY -->
<g transform="translate(600 400)">
 <rect class="panel" width="600" height="400" fill="url(#clean)"/>
 <!-- skyline -->
 <g stroke="#32667d" stroke-width="3"><rect x="322" y="95" width="55" height="134" fill="#aee3f4"/><rect x="386" y="57" width="60" height="172" fill="#8fd2ec"/><rect x="456" y="114" width="46" height="115" fill="#b7e8f3"/><rect x="514" y="80" width="55" height="149" fill="#9bdaeb"/></g>
 <g fill="#e8fcff"><rect x="337" y="115" width="10" height="12"/><rect x="354" y="115" width="10" height="12"/><rect x="404" y="83" width="12" height="15"/><rect x="425" y="83" width="12" height="15"/><rect x="530" y="103" width="11" height="14"/></g>
 <!-- clean river -->
 <path d="M0 238q146-61 285-7t315-19v188H0z" fill="#4bb9e5"/><path d="M0 286q104 25 198-7t180 0 222-7" fill="none" stroke="#d8f8ff" stroke-width="7"/>
 <!-- vegetation -->
 <path d="M0 240q95-36 190-8v45Q95 251 0 284z" fill="#55ae66"/><path d="M430 225q85-30 170-12v66q-84-18-170 10z" fill="#56ad63"/>
 <g class="leaf"><ellipse cx="48" cy="216" rx="18" ry="9" transform="rotate(-22 48 216)"/><ellipse cx="76" cy="203" rx="18" ry="9" transform="rotate(22 76 203)"/><ellipse cx="548" cy="196" rx="18" ry="9" transform="rotate(-20 548 196)"/></g>
 <!-- family -->
 <circle cx="100" cy="218" r="42" class="face"/><path d="M58 218q4-58 48-55 43 4 39 55-15-22-42-22-26 0-45 22" class="hair"/><path d="M61 258q40-19 80 0l28 104H33z" fill="#2b6a9b" class="shirt"/>
 <circle cx="205" cy="230" r="39" class="face"/><path d="M167 227q-2-56 44-52 42 5 36 57-18-22-40-22-24 1-40 17" class="hair"/><path d="M169 265q38-18 75 1l28 97H143z" fill="#ee9e8c" class="shirt"/>
 <circle cx="294" cy="261" r="31" class="face"/><path d="M264 259q4-44 36-42 34 4 30 44-15-16-32-16-19 0-34 14" class="hair"/><path d="M266 290q29-15 59 0l20 73h-98z" fill="#f2c55c" class="shirt"/>
 <path d="M126 275q39 22 63 3M236 286q27 20 46 10" fill="none" stroke="#ffd8c2" stroke-width="15" stroke-linecap="round"/>
 <path class="bubble" d="M45 38h299q24 0 24 24v109q0 24-24 24H220l-31 29 8-29H45q-24 0-24-24V62q0-24 24-24z"/>
 <text x="62" y="73" class="ko">깨끗한 물이 만드는 더 밝은 내일!</text><text x="62" y="106" class="zh">干净的水，创造更美好的明天！</text><text x="62" y="139" class="en">Clean water creates a brighter tomorrow!</text><text x="62" y="171" class="ko">함께 지켜요, 푸른 지구.</text>
 <text x="326" y="327" class="sfx" fill="#4bc657">CLEAN WATER!</text><text x="313" y="375" class="sfx" fill="#ffe23b">BRIGHTER TOMORROW!</text>
</g>
<!-- central divider and footer -->
<line x1="600" y1="0" x2="600" y2="800" stroke="#111" stroke-width="8"/><line x1="0" y1="400" x2="1200" y2="400" stroke="#111" stroke-width="8"/>
<rect x="0" y="760" width="1200" height="40" fill="#10151a"/><text x="22" y="787" font-family="sans-serif" font-weight="800" font-size="21" fill="#fff">FTF-01 #49  |  깨끗한 물, 더 밝은 내일  |  清洁的水，更明亮的明天  |  CLEAN WATER, BRIGHTER TOMORROW</text>
</svg>