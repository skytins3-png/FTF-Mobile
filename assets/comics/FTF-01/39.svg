<rect class="card" x="70" y="1460" width="505" height="128" rx="12"/><text class="ko" x="90" y="1497" font-size="26">오늘의 작은 선택이 쓰레기 없는 내일을 만듭니다.</text><text class="zh" x="90" y="1531" font-size="20">今天的小小选择，创造没有垃圾的明天。</text><text class="en" x="90" y="1562" font-size="19">Today's small choices create a zero-waste tomorrow.</text><path class="bubble" d="M638 1472 q165-36 292 25 q43 20 34 63 q-10 43-74 42 h-112 l-47 40 4-40 h-92 q-57 0-64-44 q-6-42 59-86Z"/><text class="ko" x="790" y="1515" text-anchor="middle" font-size="24">함께라면 더 깨끗한 지구를 만들 수 있어!</text><text x="790" y="1546" text-anchor="middle" font-size="18">一起创造更清洁的地球!</text><text x="790" y="1573" text-anchor="middle" font-size="18">Together, we can build a cleaner Earth!</text><text x="730" y="1812" fill="#fff" stroke="#2c6944" stroke-width="8" paint-order="stroke" font-size="52" font-style="italic" font-weight="900" transform="rotate(-5 730 1812)">BETTER TOMORROW!</text></g>
