<path class="bubble" d="M700 150 q145-38 250 18 q40 22 27 61 q-14 39-71 37 h-80 l-40 35 3-35 h-70 q-49 0-57-39 q-7-38 38-77Z"/><text class="ko" x="822" y="190" text-anchor="middle" font-size="24">분리배출이 지구를 지켜요!</text><text x="822" y="220" text-anchor="middle" font-size="18">分类回收守护地球!</text><text x="822" y="246" text-anchor="middle" font-size="18">Sorting waste protects Earth!</text><text x="805" y="495" fill="#fff" stroke="#2b7a45" stroke-width="8" paint-order="stroke" font-size="48" font-style="italic" font-weight="900" transform="rotate(-6 805 495)">CLACK!</text></g>

