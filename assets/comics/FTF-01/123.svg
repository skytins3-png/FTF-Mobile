<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#7dd8e6"/><stop offset="1" stop-color="#0d5674"/></linearGradient><linearGradient id="sun" x2="0" y2="1"><stop stop-color="#ffd89c"/><stop offset=".45" stop-color="#a8dff0"/><stop offset="1" stop-color="#17607d"/></linearGradient><linearGradient id="deck" x2="0" y2="1"><stop stop-color="#24485c"/><stop offset="1" stop-color="#0b1d2a"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".45"/></filter></defs><rect width="1536" height="1024" fill="#06131f"/><rect x="12" y="12" width="1512" height="58" rx="12" fill="#0b2a43"/><text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #123  숲을 지키는 마지막 방어선</text><text x="920" y="49" fill="#baf4ff" font-family="Arial" font-size="18" font-weight="800">B-26 CURRENT BARRIER · 洋流垃圾拦截线</text>
<!-- PANEL 1 --> <g><rect x="16" y="84" width="746" height="428" rx="8" fill="url(#sun)"/><circle cx="655" cy="145" r="52" fill="#ffe8a8"/><path d="M16 365Q180 338 340 362T762 350V512H16Z" fill="#0e6882"/><path d="M16 445Q180 420 350 448T762 430V512H16Z" fill="#0b526e"/><g stroke="#2d6b32" stroke-width="9" fill="#69a84c"><path d="M85 478q0-155 57-250q-17 105 38 181q-43-11-95 69Z"/><path d="M205 479q-2-150 53-244q-15 102 37 177q-40-9-90 67Z"/><path d="M330 478q2-160 58-255q-18 108 39 184q-43-10-97 71Z"/></g><g fill="#ed735a" stroke="#6d2b25" stroke-width="3"><rect x="430" y="353" width="40" height="20" rx="4"/><rect x="515" y="375" width="34" height="17" rx="4"/></g><g fill="#e9edf0" stroke="#243741" stroke-width="3"><path d="M492 330l18-25 14 28z"/><path d="M575 345l16-23 13 25z"/></g><g filter="url(#sh)"><ellipse cx="602" cy="255" rx="42" ry="47" fill="#efbd98" stroke="#11202a" stroke-width="5"/><path d="M562 249q8-37 40-44q36 5 43 47z" fill="#3e2c2b"/><circle cx="590" cy="257" r="4"/><circle cx="615" cy="257" r="4"/><path d="M588 275q15 11 28 0" fill="none" stroke="#9b5a52" stroke-width="4"/><path d="M557 306q45-27 89 0l34 145H526z" fill="#eaf7fa" stroke="#11202a" stroke-width="5"/><text x="602" y="390" text-anchor="middle" fill="#0a668d" font-family="Arial" font-size="23" font-weight="900">FTF</text><path d="M557 331q-44 19-82 48" stroke="#eaf7fa" stroke-width="23" stroke-linecap="round"/><path d="M475 379l-29 11" stroke="#efbd98" stroke-width="16" stroke-linecap="round"/></g><rect x="38" y="101" width="482" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="279" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="279">새벽 조사에서 복원 다시마 숲으로 흘러드는 플라스틱 조각이 포착됐다.</tspan><tspan x="279" dy="24" font-size="14">清晨监测发现塑料碎片正随洋流进入恢复中的海带森林。</tspan><tspan x="279" dy="22" font-size="13">Dawn monitoring spots plastic debris drifting toward the restored kelp forest.</tspan></text><text x="44" y="486" fill="#fff" stroke="#0a5871" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">PING!  TRACK!  INTERCEPT!</text></g>
<!-- PANEL 2 --> <g><rect x="774" y="84" width="746" height="428" rx="8" fill="url(#sea)"/><path d="M774 395Q950 370 1120 397T1520 382V512H774Z" fill="#0e607d"/><path d="M808 368L1245 368" stroke="#ffb52d" stroke-width="20"/><g fill="#ffcb52" stroke="#6d4c00" stroke-width="3"><circle cx="840" cy="368" r="17"/><circle cx="925" cy="368" r="17"/><circle cx="1010" cy="368" r="17"/><circle cx="1095" cy="368" r="17"/><circle cx="1180" cy="368" r="17"/></g><path d="M1250 286h168l52 67H1202z" fill="#e9f5f7" stroke="#102532" stroke-width="6"/><rect x="1300" y="236" width="74" height="52" fill="#d9eef5" stroke="#102532" stroke-width="5"/><text x="1337" y="270" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#0b668c">FTF</text><path d="M1400 250l45-45" stroke="#102532" stroke-width="7"/><circle cx="1448" cy="200" r="8" fill="#ffda55"/><g filter="url(#sh)"><ellipse cx="918" cy="248" rx="40" ry="45" fill="#e8b58d" stroke="#11202a" stroke-width="5"/><path d="M881 242q7-35 38-42q33 5 40 45z" fill="#24323c"/><path d="M876 298q42-25 84 0l32 137H847z" fill="#163e55" stroke="#11202a" stroke-width="5"/><text x="918" y="382" text-anchor="middle" fill="#eaffff" font-family="Arial" font-size="22" font-weight="900">FTF</text><path d="M876 318q-44 10-75 36" stroke="#163e55" stroke-width="23" stroke-linecap="round"/></g><g filter="url(#sh)"><ellipse cx="1085" cy="259" rx="39" ry="44" fill="#f1c09d" stroke="#11202a" stroke-width="5"/><path d="M1049 251q9-33 37-38q33 6 38 43z" fill="#5b3c2d"/><path d="M1046 309q40-25 80 0l31 129h-142z" fill="#eaf7fa" stroke="#11202a" stroke-width="5"/><text x="1086" y="388" text-anchor="middle" fill="#0a668d" font-family="Arial" font-size="21" font-weight="900">FTF</text></g><g fill="#ef6d55" stroke="#6a2722" stroke-width="3"><rect x="980" y="352" width="35" height="18" rx="3"/><rect x="1120" y="349" width="30" height="16" rx="3"/><rect x="1168" y="352" width="39" height="19" rx="3"/></g><rect x="805" y="101" width="468" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1039" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1039">표층팀이 하구 앞에 부유 차단선을 펼쳐 쓰레기 흐름을 한쪽으로 모은다.</tspan><tspan x="1039" dy="24" font-size="14">水面小组在河口布设浮动拦截线，将垃圾导向收集区。</tspan><tspan x="1039" dy="22" font-size="13">The surface team deploys a floating barrier and guides debris into one collection lane.</tspan></text><rect x="1258" y="102" width="232" height="94" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="1374" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1374">숲으로 보내지 마!</tspan><tspan x="1374" dy="24" font-size="14">别让它进森林！</tspan><tspan x="1374" dy="21" font-size="13">Keep it out of the forest!</tspan></text><text x="808" y="486" fill="#fff" stroke="#0a5c71" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="40" font-weight="900">CLACK!  SWISH!  HOLD!</text></g>
<!-- PANEL 3 --> <g><rect x="16" y="524" width="746" height="482" rx="8" fill="url(#deck)"/><rect x="35" y="768" width="708" height="238" fill="#304a55"/><path d="M82 870h300l38 74H44z" fill="#dfe9ec" stroke="#12232c" stroke-width="6"/><path d="M393 656v210M393 660l130 95" stroke="#f0b23c" stroke-width="11"/><path d="M522 756l-37 132" stroke="#f0b23c" stroke-width="7"/><rect x="450" y="830" width="112" height="72" rx="9" fill="#66787e" stroke="#10212a" stroke-width="5"/><g fill="#ef7357"><rect x="476" y="846" width="24" height="15" rx="3"/><rect x="515" y="860" width="28" height="14" rx="3"/><rect x="488" y="880" width="35" height="13" rx="3"/></g><g filter="url(#sh)"><ellipse cx="197" cy="681" rx="41" ry="46" fill="#efbd98" stroke="#101f29" stroke-width="5"/><path d="M159 675q8-35 38-42q34 5 41 45z" fill="#3b2b2c"/><path d="M154 730q43-26 86 0l35 159H118z" fill="#eaf7fa" stroke="#101f29" stroke-width="5"/><text x="197" y="814" text-anchor="middle" fill="#0a668d" font-family="Arial" font-size="22" font-weight="900">FTF</text><path d="M236 754q48 15 89 45" stroke="#eaf7fa" stroke-width="24" stroke-linecap="round"/></g><g filter="url(#sh)"><ellipse cx="638" cy="700" rx="40" ry="45" fill="#e7b489" stroke="#101f29" stroke-width="5"/><path d="M602 691q8-34 37-40q33 5 39 44z" fill="#1f2e38"/><path d="M600 749q40-24 80 0l31 140H569z" fill="#173e54" stroke="#101f29" stroke-width="5"/><text x="640" y="824" text-anchor="middle" fill="#eaffff" font-family="Arial" font-size="22" font-weight="900">FTF</text></g><rect x="42" y="548" width="475" height="111" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="279" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="279">수거팀이 크레인으로 포집망을 들어 올리고 플라스틱을 재활용·폐기물로 분류한다.</tspan><tspan x="279" dy="24" font-size="14">回收组吊起收集网，将塑料分为可回收与废弃物。</tspan><tspan x="279" dy="22" font-size="13">The recovery crew lifts the capture net and sorts plastic for recycling and disposal.</tspan></text><rect x="510" y="558" width="218" height="92" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="619" y="589" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="619">이제 뿌리까지 지킨다!</tspan><tspan x="619" dy="23" font-size="14">连根部也要守住！</tspan><tspan x="619" dy="21" font-size="13">Protect every root!</tspan></text><text x="52" y="976" fill="#fff" stroke="#0b5168" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="41" font-weight="900">WHIRR!  LIFT!  SORT!</text></g>
<!-- PANEL 4 --> <g><rect x="774" y="524" width="746" height="482" rx="8" fill="#dff5f7"/><rect x="800" y="551" width="690" height="286" rx="16" fill="#12364b"/><rect x="824" y="576" width="642" height="236" rx="10" fill="#071e2d"/><polyline points="850,755 920,744 990,716 1060,700 1140,660 1220,642 1305,618 1418,595" fill="none" stroke="#6fffd2" stroke-width="8"/><g fill="#a9f1f3" font-family="Arial" font-size="22" font-weight="800"><text x="850" y="622">Plastic inflow       -64%</text><text x="850" y="662">Microplastic count   -41%</text><text x="850" y="702">Kelp canopy health   +18%</text><text x="850" y="742">Juvenile fish use    +76%</text></g><g filter="url(#sh)"><ellipse cx="1338" cy="886" rx="44" ry="49" fill="#efbd98" stroke="#11202a" stroke-width="5"/><path d="M1298 880q8-37 40-44q35 6 42 48z" fill="#3f2d2d"/><path d="M1295 932q43-26 87 0l42 74h-171z" fill="#eaf7fa" stroke="#11202a" stroke-width="5"/></g><rect x="810" y="851" width="468" height="130" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1044" y="881" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1044">복원은 심는 것에서 끝나지 않는다. 흘러드는 위협까지 막아야 숲이 산다.</tspan><tspan x="1044" dy="25" font-size="15">修复不止是种下生命，还要挡住不断流入的威胁。</tspan><tspan x="1044" dy="23" font-size="14">Restoration is not only planting life—it is stopping the threats that keep flowing in.</tspan><tspan x="1044" dy="25" fill="#0a668d">STOP THE FLOW · SAVE THE FOREST</tspan></text><text x="1285" y="997" fill="#0a668d" font-family="Arial" font-size="27" font-weight="900">BARRIER VERIFIED!</text></g><rect x="12" y="1008" width="1512" height="4" fill="#8aeaf0"/></svg>