<rect width="1080" height="1920" fill="#07131d"/><rect x="20" y="20" width="1040" height="1880" rx="30" fill="#10212b" stroke="#fff" stroke-width="5"/>
<text x="52" y="78" fill="#fff" font-size="38" font-weight="900">FTF-01 · EARTH'S WARNING</text><text x="944" y="78" fill="#62d9ff" font-size="33" font-weight="900">43</text>

<!-- PANEL 1 water saving at home -->
<g filter="url(#sh)"><rect x="48" y="112" width="984" height="405" rx="22" fill="url(#home)" stroke="#fff" stroke-width="6"/>
<rect x="95" y="285" width="410" height="168" rx="18" fill="#eef7fa" class="o"/><rect x="172" y="321" width="200" height="30" rx="14" fill="#a9c6cf" class="o"/><path d="M370 336h72q40 0 40 36v32" fill="none" stroke="#6e8088" stroke-width="20" stroke-linecap="round"/><path d="M480 404q0 35-26 35t-26-35" fill="none" stroke="#57bde6" stroke-width="11" stroke-linecap="round"/>
<!-- mother --> <ellipse class="skin" cx="625" cy="310" rx="49" ry="57"/><path class="hair" d="M581 308q4-58 45-61q44 4 49 61q-26-22-48-20q-23 0-46 20Z"/><path d="M594 322q9-6 18 0M636 322q9-6 18 0" fill="none" stroke="#222" stroke-width="4"/><path d="M611 349q14 9 29 0" fill="none" stroke="#9d514c" stroke-width="4"/><path d="M585 368Q625 392 666 368L693 480H557Z" fill="#f2b8c9" class="o"/>
<!-- boy --> <ellipse class="skin" cx="803" cy="330" rx="42" ry="50"/><path class="hair" d="M765 328q4-51 39-53q38 4 43 53q-23-19-41-18q-21 0-41 18Z"/><path d="M777 341q8-5 17 0M814 341q8-5 17 0" fill="none" stroke="#222" stroke-width="4"/><path d="M790 364q12 8 25 0" fill="none" stroke="#98504a" stroke-width="4"/><path d="M772 380Q803 399 835 380L858 480H748Z" fill="#3f75a2" class="o"/>
<rect class="card" x="72" y="134" width="592" height="111" rx="12"/><text class="ko" x="92" y="171" font-size="27">양치할 때 수도를 잠그는 작은 습관부터 시작해요.</text><text class="zh" x="92" y="204" font-size="20">从刷牙时关掉水龙头的小习惯开始。</text><text class="en" x="92" y="233" font-size="19">Start with one small habit: turn off the tap while brushing.</text>
<path class="bubble" d="M546 250q196-18 381 18q48 10 49 49q1 41-56 46h-94l-36 34 2-34H626q-55-2-61-38q-5-33-19-75Z"/><text class="ko" x="757" y="292" text-anchor="middle" font-size="24">물을 아끼면 지구가 웃어요!</text><text x="757" y="324" text-anchor="middle" font-size="18">节约用水，地球会微笑!</text><text x="757" y="352" text-anchor="middle" font-size="18">Save water, make Earth smile!</text><text x="114" y="486" fill="#fff" stroke="#138cc7" stroke-width="8" paint-order="stroke" font-size="48" font-style="italic" font-weight="900">CLICK!</text></g>

<!-- PANEL 2 drought warning -->
<g filter="url(#sh)"><rect x="48" y="542" width="984" height="414" rx="22" fill="url(#drought)" stroke="#fff" stroke-width="6"/>
<circle cx="900" cy="620" r="68" fill="#ffe58a"/><path d="M48 770Q210 695 389 770T736 748T1032 776V956H48Z" fill="#9b6236"/>
<path d="M62 820l130-42 106 37 122-47 120 46 145-58 160 56 177-42" fill="none" stroke="#5c321f" stroke-width="8"/><path d="M104 850l61-40m-5 46 80-57m28 62 70-49m90 58 72-53m85 58 69-55m76 57 74-50" stroke="#5c321f" stroke-width="6"/>
<!-- kneeling woman --> <ellipse class="skin" cx="505" cy="734" rx="46" ry="54"/><path class="hair" d="M463 734q4-56 43-58q42 3 47 58q-25-21-46-19q-22 0-44 19Z"/><path d="M476 748q8-5 17 0M516 748q8-5 17 0" fill="none" stroke="#222" stroke-width="4"/><path d="M492 776q13 6 27-1" fill="none" stroke="#82493f" stroke-width="4"/><path d="M470 788Q506 808 543 789L593 916H434Z" fill="#7a8792" class="o"/><path d="M457 879q-50 34-84 63M567 872q56 30 86 66" fill="none" stroke="#7a8792" stroke-width="28" stroke-linecap="round"/>
<!-- dead fish & crops --> <path d="M788 836q46-29 82 0q-36 31-82 0Zm80 0 38-26v52Z" fill="#c9b59b" class="o"/><circle cx="814" cy="829" r="5" fill="#222"/><g stroke="#5b3b22" stroke-width="7"><path d="M116 706v118m0-74-28-30m28 47 29-35M195 698v126m0-77-30-34m30 51 34-38"/></g>
<rect class="card" x="72" y="564" width="650" height="118" rx="12"/><text class="ko" x="92" y="601" font-size="26">물이 사라지면 강과 농작물, 생명도 함께 위험해집니다.</text><text class="zh" x="92" y="634" font-size="20">如果水消失，河流、农作物和生命都会陷入危险。</text><text class="en" x="92" y="663" font-size="19">When water disappears, rivers, crops and living things are all at risk.</text>
<path class="bubble" d="M604 697q188-18 352 16q47 10 49 48q2 39-53 44h-82l-32 31 1-31H686q-52-2-58-36q-6-31-24-72Z"/><text class="ko" x="805" y="739" text-anchor="middle" font-size="23">강이 말라가고 있어…</text><text x="805" y="771" text-anchor="middle" font-size="18">河流正在干涸…</text><text x="805" y="799" text-anchor="middle" font-size="18">The river is drying up…</text><text x="109" y="917" fill="#fff" stroke="#c4551f" stroke-width="8" paint-order="stroke" font-size="49" font-style="italic" font-weight="900">DRY…</text></g>

<!-- PANEL 3 reuse plant -->
<g filter="url(#sh)"><rect x="48" y="982" width="984" height="402" rx="22" fill="url(#plant)" stroke="#fff" stroke-width="6"/>
<g fill="#dfe8eb" stroke="#31454e" stroke-width="5"><rect x="100" y="1100" width="170" height="220" rx="16"/><rect x="334" y="1062" width="185" height="258" rx="16"/><rect x="590" y="1122" width="150" height="198" rx="16"/></g><path d="M184 1100V1055h255v-48h244v115" fill="none" stroke="#58818e" stroke-width="20"/><path d="M141 1160h88v94h-88zM376 1118h101v136H376zM622 1168h86v86h-86z" fill="#4fc2ec" stroke="#1b677d" stroke-width="5"/>
<path d="M168 1210q14-33 31 0q-17 22-31 0ZM408 1188q16-39 34 0q-19 26-34 0ZM645 1208q13-32 29 0q-15 22-29 0Z" fill="#d9fbff"/>
<!-- technician --> <ellipse class="skin" cx="830" cy="1190" rx="43" ry="50"/><path d="M790 1187q9-53 41-54q38 2 42 54Z" fill="#f4f6f3" class="o"/><path d="M798 1220Q830 1239 863 1220L887 1349H773Z" fill="#286a88" class="o"/><text x="830" y="1295" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">CLEAN WATER</text><path d="M790 1300q-53-3-94-34" fill="none" stroke="#286a88" stroke-width="25" stroke-linecap="round"/>
<rect class="card" x="72" y="1002" width="670" height="108" rx="12"/><text class="ko" x="92" y="1039" font-size="25">빗물과 생활하수를 깨끗하게 정화해 다시 사용합니다.</text><text class="zh" x="92" y="1072" font-size="19">将雨水和生活污水净化后再次利用。</text><text class="en" x="92" y="1101" font-size="18">Rainwater and household wastewater are cleaned and used again.</text>
<path class="bubble" d="M622 1251q184-18 335 16q45 10 46 47q1 38-52 42h-79l-31 31 1-31H700q-49-2-54-35q-5-31-24-70Z"/><text class="ko" x="812" y="1291" text-anchor="middle" font-size="22">이 물은 다시 쓸 수 있어요!</text><text x="812" y="1322" text-anchor="middle" font-size="17">这些水可以再次使用!</text><text x="812" y="1349" text-anchor="middle" font-size="17">This water can be used again!</text><text x="114" y="1355" fill="#fff" stroke="#168ec3" stroke-width="8" paint-order="stroke" font-size="44" font-style="italic" font-weight="900">PURIFY! REUSE!</text></g>

<!-- PANEL 4 restored green city -->
<g filter="url(#sh)"><rect x="48" y="1410" width="984" height="443" rx="22" fill="url(#city)" stroke="#fff" stroke-width="6"/>
<circle cx="884" cy="1490" r="58" fill="#fff2a4"/><path d="M48 1680Q210 1600 385 1664T719 1649T1032 1672V1853H48Z" fill="#4ca96b"/>
<path d="M50 1740Q220 1695 420 1732T760 1706T1032 1733V1853H50Z" fill="#4ab9e7"/><path d="M90 1782q220-59 438-8t450-12" fill="none" stroke="#d8fbff" stroke-width="10" opacity=".8"/>
<g fill="#e6f2f0" stroke="#35505a" stroke-width="4"><rect x="126" y="1520" width="108" height="200"/><rect x="267" y="1482" width="124" height="238"/><rect x="433" y="1510" width="120" height="210"/><rect x="596" y="1464" width="134" height="256"/></g><g fill="#65b96f"><rect x="139" y="1549" width="83" height="19"/><rect x="280" y="1511" width="97" height="20"/><rect x="447" y="1539" width="92" height="19"/><rect x="611" y="1493" width="104" height="21"/></g>
<!-- mother and boy foreground --> <ellipse class="skin" cx="748" cy="1688" rx="44" ry="51"/><path class="hair" d="M708 1686q5-52 41-54q39 3 44 54q-23-19-43-18q-20 0-42 18Z"/><path d="M717 1716Q748 1733 780 1716L805 1828H690Z" fill="#f0b8c8" class="o"/><ellipse class="skin" cx="890" cy="1716" rx="38" ry="45"/><path class="hair" d="M855 1714q4-46 36-48q35 3 39 48q-20-17-38-16q-18 0-37 16Z"/><path d="M862 1740Q890 1756 918 1740L940 1828H840Z" fill="#3d75a4" class="o"/>
<rect class="card" x="72" y="1432" width="676" height="110" rx="12"/><text class="ko" x="92" y="1469" font-size="26">물을 지키는 도시가 더 건강하고 밝은 미래를 만듭니다.</text><text class="zh" x="92" y="1502" font-size="19">守护水资源的城市，会创造更健康、更光明的未来。</text><text class="en" x="92" y="1531" font-size="18">A city that protects water creates a healthier, brighter future.</text>
<path class="bubble" d="M600 1561q192-18 359 16q46 10 48 48q2 39-54 44h-83l-33 31 1-31H680q-53-2-59-36q-6-31-21-72Z"/><text class="ko" x="808" y="1603" text-anchor="middle" font-size="23">와! 강이 다시 살아났어요!</text><text x="808" y="1635" text-anchor="middle" font-size="18">哇! 河流恢复生机了!</text><text x="808" y="1663" text-anchor="middle" font-size="18">Wow! The river is alive again!</text><text x="112" y="1821" fill="#fff" stroke="#1188bd" stroke-width="9" paint-order="stroke" font-size="46" font-style="italic" font-weight="900">CLEAN WATER!</text><text x="580" y="1821" fill="#fff" stroke="#278a59" stroke-width="9" paint-order="stroke" font-size="41" font-style="italic" font-weight="900">BRIGHTER TOMORROW!</text></g>
</svg>