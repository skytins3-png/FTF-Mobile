 <linearGradient id="home" x2="0" y2="1"><stop stop-color="#f7e9c8"/><stop offset="1" stop-color="#bfe6f2"/></linearGradient>
 <linearGradient id="drought" x2="0" y2="1"><stop stop-color="#f3b95d"/><stop offset="1" stop-color="#8a4d2d"/></linearGradient>
 <linearGradient id="plant" x2="0" y2="1"><stop stop-color="#d9eef6"/><stop offset="1" stop-color="#7db8c9"/></linearGradient>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#7fd5f5"/><stop offset="1" stop-color="#76c879"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity=".32"/></filter>
 <style>text{font-family:Arial,'Malgun Gothic','Noto Sans KR',sans-serif}.o{stroke:#17242b;stroke-width:5}.skin{fill:#e9b790;stroke:#17242b;stroke-width:5}.hair{fill:#29242a;stroke:#17242b;stroke-width:5}.bubble{fill:#fff;stroke:#17242b;stroke-width:5}.card{fill:#fffffff3;stroke:#17242b;stroke-width:4}.ko{font-weight:900}.zh,.en{font-weight:700}</style>
