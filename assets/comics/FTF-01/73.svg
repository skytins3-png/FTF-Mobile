<rect x="790" y="530" width="458" height="170" class="box"/><text x="810" y="565" class="h">4. 다음 세대를 위한 약속</text><text x="810" y="600" class="t">오늘의 작은 변화가 내일의 더 푸른 바다를 만듭니다.</text><text x="810" y="633" class="z">今天的努力，创造明天更蔚蓝的海洋。</text><text x="810" y="667" class="e">A promise for the next generation.</text><ellipse cx="1374" cy="616" rx="131" ry="72" class="bubble"/><text x="1374" y="602" class="btxt">지금도, 앞으로도!</text><text x="1374" y="632" class="btxt">함께 지켜요, 푸른 바다!</text><text x="1220" y="912" class="sfx" font-size="35" transform="rotate(-7 1220 912)">TOGETHER FOR A</text><text x="1250" y="956" class="sfx" font-size="35" transform="rotate(-7 1250 956)">BRIGHTER TOMORROW!</text></g>
