<rect x="24" y="20" width="330" height="178" class="box"/><text x="42" y="55" class="h">1. 다시, 바다로</text><text x="42" y="88" class="t">복원 구역 정기 모니터링을 위해</text><text x="42" y="115" class="t">연구팀이 다시 바다로 나섭니다.</text><text x="42" y="145" class="z">再次，向大海出发</text><text x="42" y="174" class="e">Back to the Ocean</text>
