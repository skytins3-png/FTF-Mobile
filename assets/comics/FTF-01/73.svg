<rect x="790" y="20" width="424" height="150" class="box"/><text x="810" y="55" class="h">2. 되살아나는 산호초</text><text x="810" y="90" class="t">복원된 산호초에는 다시 생명이 가득합니다.</text><text x="810" y="120" class="z">复苏的珊瑚礁，再次充满生命。</text><text x="810" y="150" class="e">A Reviving Reef — life returns.</text><ellipse cx="1085" cy="225" rx="138" ry="55" class="bubble"/><text x="1085" y="218" class="btxt">와! 물고기가 정말</text><text x="1085" y="246" class="btxt">많아졌어요!</text><text x="1218" y="404" class="sfx" transform="rotate(-8 1218 404)">LIFE RETURNS!</text></g>
