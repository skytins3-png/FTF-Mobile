 <style>.panel{stroke:#091827;stroke-width:10}.box{fill:#fff;stroke:#111;stroke-width:4;rx:12;filter:url(#shadow)}.h{font:900 30px Arial,'Malgun Gothic',sans-serif;fill:#101820}.t{font:700 21px Arial,'Malgun Gothic',sans-serif;fill:#18212b}.z{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#24303c}.e{font:700 19px Arial,sans-serif;fill:#24303c}.bubble{fill:#fff;stroke:#111;stroke-width:4}.btxt{font:800 22px Arial,'Malgun Gothic',sans-serif;fill:#111;text-anchor:middle}.sfx{font:italic 1000 44px Arial,sans-serif;fill:#fff;stroke:#046bb2;stroke-width:3;paint-order:stroke;filter:url(#shadow)}.small{font:800 18px Arial,sans-serif;fill:#fff}.shirt{fill:#102d48;stroke:#06131e;stroke-width:4}.skin{fill:#f2bd91;stroke:#412b24;stroke-width:3}.hair{fill:#1b1617;stroke:#090708;stroke-width:3}.glass{fill:#82d9f7;fill-opacity:.68;stroke:#061b2e;stroke-width:5}.coral1{fill:#ff785e;stroke:#8f2d31;stroke-width:3}.coral2{fill:#ffb53a;stroke:#a55a12;stroke-width:3}.coral3{fill:#b37cff;stroke:#5d3890;stroke-width:3}</style>
