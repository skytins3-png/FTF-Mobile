<rect class="card" x="72" y="1445" width="630" height="120" rx="12"/><text class="ko" x="92" y="1482" font-size="26">버리는 도시에서, 다시 만드는 도시로.</text><text class="zh" x="92" y="1516" font-size="20">从丢弃的城市，走向循环再生的城市。</text><text class="en" x="92" y="1546" font-size="19">From a throwaway city to a city that makes things again.</text>
