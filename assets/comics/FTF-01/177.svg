<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 177 closes the last human cross-zone contamination route by replacing shared PPE hooks with sealed zone-specific lockers">
<defs><linearGradient id="night" x2="0" y2="1"><stop stop-color="#06131d"/><stop offset="1" stop-color="#496776"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b7c6c9"/><stop offset="1" stop-color="#506773"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".45"/></filter><style>.t{font-family:Arial,'Malgun Gothic',sans-serif}.cap{font-size:17px;font-weight:900;fill:#10232b}.box{fill:#fff;stroke:#17323d;stroke-width:4}.bub{fill:#fff;stroke:#10242d;stroke-width:4}.sfx{font-family:Arial,'Malgun Gothic',sans-serif;font-size:22px;font-weight:1000;fill:#fff26d;stroke:#081820;stroke-width:2;paint-order:stroke}.tiny{font-family:Arial,'Malgun Gothic',sans-serif;font-size:13px;font-weight:900}</style></defs>
<rect width="1536" height="1024" fill="#061019"/><rect x="12" y="12" width="1512" height="60" rx="12" fill="#173f59"/><text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #177  마지막 사람 동선 — 공용 PPE 걸이 H-4</text><text x="1010" y="49" class="t" fill="#d7f5ff" font-size="16" font-weight="800">PPE TRACE · HOOK LOCK · SEALED ZONE LOCKERS</text>
<!-- P1 --> <g><rect x="16" y="84" width="746" height="428" rx="12" fill="url(#night)"/><rect x="16" y="355" width="746" height="157" fill="url(#floor)"/><rect x="40" y="103" width="664" height="111" rx="18" class="box"/><text x="372" y="132" text-anchor="middle" class="t cap"><tspan x="372">06:32. 생체 출입으로 바뀐 뒤, 교대자가 공용 PPE 걸이 H-4에서 방수 재킷을 집는다.</tspan><tspan x="372" dy="25" font-size="14">06:32，门禁改为生物识别后，换班人员从共用PPE挂钩H-4取下防水外套。</tspan><tspan x="372" dy="22" font-size="13">06:32 — after biometric access, a relief worker reaches for a rain jacket on shared PPE hook H-4.</tspan></text><g transform="translate(550 345)" filter="url(#sh)"><rect x="-105" y="-90" width="210" height="180" rx="12" fill="#dce5e7" stroke="#17323d" stroke-width="6"/><text x="0" y="-62" text-anchor="middle" class="tiny">SHARED PPE · H-4</text><path d="M-70-30h140" stroke="#324a55" stroke-width="10"/><path d="M-55-30v30q0 18 18 18T-19 0" fill="none" stroke="#324a55" stroke-width="8"/><path d="M20-30v30q0 18 18 18T56 0" fill="none" stroke="#324a55" stroke-width="8"/><path d="M-73 18q35-25 70 0l18 94h-106z" fill="#e79032" stroke="#142a33" stroke-width="5"/></g><g transform="translate(250 414)" filter="url(#sh)"><ellipse cy="-98" rx="31" ry="38" fill="#d8a27d" stroke="#102631" stroke-width="4"/><path d="M-30-110q9-27 31-30q24 2 31 26" fill="#292d31"/><rect x="-52" y="-55" width="104" height="130" rx="22" fill="#2d8791" stroke="#102631" stroke-width="4"/><path d="M43-22l130-20" stroke="#2d8791" stroke-width="20" stroke-linecap="round"/><path d="M-27 74l-8 74M27 74l9 74" stroke="#263b43" stroke-width="23"/></g><path d="M55 237h300q14 0 14 14v58q0 14-14 14H220l-25 24 6-24H55q-14 0-14-14v-58q0-14 14-14z" class="bub"/><text x="205" y="263" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="205">카드는 없어졌지만… 이 재킷은 같이 쓰잖아.</tspan><tspan x="205" dy="20" font-size="12">卡没了，可这件外套还在共用。 / The card is gone, but this jacket is still shared.</tspan></text><text x="42" y="490" class="sfx">SHIFT!  REACH H-4!  SHARED PPE!</text></g>
<!-- P2 --> <g><rect x="774" y="84" width="746" height="428" rx="12" fill="#9db1b7"/><rect x="774" y="355" width="746" height="157" fill="url(#floor)"/><rect x="798" y="103" width="666" height="111" rx="18" class="box"/><text x="1131" y="132" text-anchor="middle" class="t cap"><tspan x="1131">경계검사에서 재킷 소매는 음성. 하지만 H-4 금속 고리와 목깃 안쪽에서 TRACE+가 나온다.</tspan><tspan x="1131" dy="25" font-size="14">边界检测显示袖口阴性，但H-4金属挂钩与衣领内侧检测出TRACE+。</tspan><tspan x="1131" dy="22" font-size="13">Boundary swabs show sleeve NEG, but the H-4 metal hook and inner collar are TRACE+.</tspan></text><g transform="translate(970 395)" filter="url(#sh)"><ellipse cy="-84" rx="29" ry="35" fill="#dfad89" stroke="#102631" stroke-width="4"/><rect x="-48" y="-40" width="96" height="112" rx="19" fill="#2f8d83" stroke="#102631" stroke-width="4"/><path d="M36-12l118-25" stroke="#2f8d83" stroke-width="18" stroke-linecap="round"/></g><g transform="translate(1170 342)" filter="url(#sh)"><path d="M-65-55q65-35 130 0l25 150H-90z" fill="#e79032" stroke="#263b43" stroke-width="6"/><path d="M-30-47q30 38 60 0" fill="none" stroke="#ff7169" stroke-width="12"/><path d="M-118-90q0 55 38 55t38-55" fill="none" stroke="#344b55" stroke-width="12"/><circle cx="-80" cy="-35" r="11" fill="#ff7169"/></g><g transform="translate(1380 354)" filter="url(#sh)"><rect x="-90" y="-80" width="180" height="160" rx="13" fill="#edf3f4" stroke="#263b43" stroke-width="5"/><text x="0" y="-55" text-anchor="middle" class="tiny">PPE SWAB</text><text x="-68" y="-15" class="tiny">SLEEVE</text><text x="70" y="-15" text-anchor="end" class="tiny" fill="#18765b">NEG</text><text x="-68" y="20" class="tiny">HOOK H-4</text><text x="70" y="20" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text><text x="-68" y="55" class="tiny">COLLAR</text><text x="70" y="55" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text></g><path d="M800 236h295q14 0 14 14v61q0 14-14 14H975l-28 23 7-23H800q-14 0-14-14v-61q0-14 14-14z" class="bub"/><text x="947" y="261" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="947">사람이 아니라 ‘공용 접촉면’이 경계를 넘기고 있었어.</tspan><tspan x="947" dy="20" font-size="12">跨区的是共用接触面。 / The shared touchpoint was crossing the boundary.</tspan></text><text x="800" y="490" class="sfx">SWAB!  H-4 TRACE+!  COLLAR TRACE+!</text></g>
<!-- P3 --> <g><rect x="16" y="524" width="746" height="484" rx="12" fill="#a9bbc0"/><rect x="16" y="823" width="746" height="185" fill="url(#floor)"/><rect x="40" y="544" width="665" height="111" rx="18" class="box"/><text x="372" y="573" text-anchor="middle" class="t cap"><tspan x="372">H-4를 폐쇄한다. A/B 구역에 밀폐형 개인 PPE 사물함을 설치하고 세척 완료 태그 없이는 열리지 않게 한다.</tspan><tspan x="372" dy="25" font-size="14">封闭H-4，在A/B区安装密闭个人PPE柜；无清洁完成标签不得开启。</tspan><tspan x="372" dy="22" font-size="13">H-4 is retired. Sealed personal PPE lockers are installed per zone and require a CLEAN tag to open.</tspan></text><g transform="translate(230 807)" filter="url(#sh)"><rect x="-120" y="-125" width="240" height="250" rx="18" fill="#dce8ea" stroke="#244956" stroke-width="7"/><rect x="-94" y="-94" width="188" height="58" rx="8" fill="#123747"/><text x="0" y="-69" text-anchor="middle" class="tiny" fill="#b8f6ff">A-ZONE · PERSONAL PPE</text><text x="0" y="-48" text-anchor="middle" class="tiny" fill="#7df0b5">CLEAN · SEALED</text><path d="M-62-5h124M0-5v92" stroke="#63818c" stroke-width="5"/><circle cx="78" cy="43" r="15" fill="#43c991"/></g><g transform="translate(548 807)" filter="url(#sh)"><rect x="-120" y="-125" width="240" height="250" rx="18" fill="#dce8ea" stroke="#244956" stroke-width="7"/><rect x="-94" y="-94" width="188" height="58" rx="8" fill="#123747"/><text x="0" y="-69" text-anchor="middle" class="tiny" fill="#b8f6ff">B-ZONE · PERSONAL PPE</text><text x="0" y="-48" text-anchor="middle" class="tiny" fill="#7df0b5">CLEAN · SEALED</text><path d="M-62-5h124M0-5v92" stroke="#63818c" stroke-width="5"/><circle cx="78" cy="43" r="15" fill="#43c991"/></g><rect x="270" y="940" width="230" height="48" rx="12" fill="#d9534f" stroke="#452020" stroke-width="4"/><text x="385" y="970" text-anchor="middle" class="tiny" fill="#fff">H-4 CLOSED · NO SHARED PPE</text><text x="42" y="990" class="sfx">SEAL!  CLEAN TAG!  ZERO SHARED PPE!</text></g>
<!-- P4 --> <g><rect x="774" y="524" width="746" height="484" rx="12" fill="#173f59"/><rect x="798" y="544" width="666" height="111" rx="18" class="box"/><text x="1131" y="573" text-anchor="middle" class="t cap"><tspan x="1131">24시간·8회 교대 검증: 공용 PPE 0, 구역간 의복 이동 0, 사물함·목깃·장갑 접촉면 42/42 음성.</tspan><tspan x="1131" dy="25" font-size="14">24小时8次换班验证：共用PPE 0，跨区衣物移动0，柜体/衣领/手套接触面42/42阴性。</tspan><tspan x="1131" dy="22" font-size="13">24 h / 8 shifts: shared PPE 0, cross-zone garments 0, locker/collar/glove surfaces 42/42 NEG.</tspan></text><g transform="translate(1145 808)" filter="url(#sh)"><rect x="-285" y="-112" width="570" height="224" rx="20" fill="#071d2a" stroke="#7cd8e8" stroke-width="6"/><text x="0" y="-72" text-anchor="middle" class="t" fill="#fff" font-size="25" font-weight="900">CLOSED-LOOP HUMAN CONTACT AUDIT</text><text x="-235" y="-23" class="t" fill="#b9f5ff" font-size="20" font-weight="900">SHARED PPE</text><text x="235" y="-23" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">0</text><text x="-235" y="22" class="t" fill="#b9f5ff" font-size="20" font-weight="900">CROSS-ZONE GARMENTS</text><text x="235" y="22" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">0</text><text x="-235" y="67" class="t" fill="#b9f5ff" font-size="20" font-weight="900">CONTACT SWABS</text><text x="235" y="67" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">42 / 42 NEG</text></g><g transform="translate(900 925)" filter="url(#sh)"><ellipse cy="-55" rx="28" ry="34" fill="#d9a37f" stroke="#102631" stroke-width="4"/><rect x="-46" y="-17" width="92" height="86" rx="18" fill="#e38b35" stroke="#102631" stroke-width="4"/></g><path d="M1210 900h250q13 0 13 13v52q0 13-13 13h-120l-25 20 6-20h-111q-13 0-13-13v-52q0-13 13-13z" class="bub"/><text x="1335" y="927" text-anchor="middle" class="t" font-size="14" font-weight="900"><tspan x="1335">이제 사람도, 장비도, 옷도 경계를 넘지 않아.</tspan><tspan x="1335" dy="19" font-size="11">人、设备、衣物都不再跨区。 / Nothing shared crosses now.</tspan></text><text x="800" y="990" class="sfx">8/8 PASS!  42/42 NEG!  LOOP CLOSED!</text></g></svg>