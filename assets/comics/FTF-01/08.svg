<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12243a"/><stop offset=".65" stop-color="#3f7288"/><stop offset="1" stop-color="#f08b57"/></linearGradient><filter id="ds"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#071018"/><rect width="1080" height="1280" fill="url(#sky)"/><path d="M0 780 Q180 710 355 760 T720 745 T1080 720 V1280 H0Z" fill="#123e56"/><path d="M0 900 Q180 830 380 910 T740 880 T1080 860 V1280 H0Z" fill="#0b2d41"/><g opacity=".95"><path d="M110 775 Q220 600 330 780Z" fill="#95b7c3"/><path d="M250 805 Q420 500 590 805Z" fill="#d6e7ec"/><path d="M470 790 Q660 525 850 790Z" fill="#a9c7d0"/></g><path d="M560 585 Q600 545 635 585 Q610 630 580 655Z" fill="#f2fbff" stroke="#6fa4b5" stroke-width="8"/><path d="M635 585 Q700 615 720 700" fill="none" stroke="#dff6ff" stroke-width="18"/><g transform="translate(115 915)"><circle cx="115" cy="70" r="58" fill="#eac39e"/><path d="M58 75 Q70 15 120 18 Q174 20 178 88 Q145 58 113 60 Q84 60 58 75" fill="#20252c"/><path d="M52 150 Q115 112 178 150 L220 395 Q115 438 10 395Z" fill="#e5eef2" stroke="#17384b" stroke-width="8"/><rect x="73" y="203" width="90" height="85" rx="10" fill="#263c48"/><path d="M205 210 Q285 165 360 120" fill="none" stroke="#eac39e" stroke-width="32" stroke-linecap="round"/><circle cx="378" cy="108" r="25" fill="#eac39e"/></g><g transform="translate(660 935)"><circle cx="110" cy="70" r="56" fill="#e4ba95"/><path d="M55 72 Q65 18 115 20 Q165 24 170 88 Q140 58 108 60 Q82 60 55 72" fill="#47372f"/><path d="M50 145 Q110 110 170 145 L205 380 Q110 420 15 380Z" fill="#243d52" stroke="#102a3a" stroke-width="8"/><rect x="73" y="205" width="84" height="70" rx="8" fill="#a7dae8"/><path d="M30 245 Q-45 215 -95 165" fill="none" stroke="#e4ba95" stroke-width="30" stroke-linecap="round"/></g><g filter="url(#ds)"><path d="M55 55 Q55 25 115 25 H805 Q865 25 865 95 V300 Q865 365 790 365 H255 L165 435 L190 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">해수 온도가 또 올랐어요. 이건 단순한 계절 변화가 아닙니다.</text><text x="105" y="192" font-family="Arial" font-size="33">海水温度又升高了，这不是普通的季节变化。</text><text x="105" y="257" font-family="Arial" font-size="30">Sea temperature rose again. This is not a normal seasonal shift.</text></g><text x="735" y="690" font-family="Impact,Arial Black" font-size="86" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-7 735 690)">WHOOSH</text><g filter="url(#ds)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">연구선 위에서 과학자들이 뜨거워진 바다와 멀리 무너지는 빙하를 동시에 관측한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">科研船上，科学家同时观测升温海洋与远处崩裂的冰川。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">Scientists watch a warming sea and a collapsing glacier from the research vessel.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-01 · EARTH'S WARNING · SCENE 08 / 26</text></svg>