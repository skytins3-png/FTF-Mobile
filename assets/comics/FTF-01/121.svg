<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic,sans-serif" font-size="34" font-weight="900">FTF-01  #121  다시 자라는 바닷속 숲</text>
<text x="845" y="49" fill="#a8efff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="800">B-24 KELP FOREST · 海带森林修复 · UNDERWATER FOREST</text>

<!-- PANEL 1: survey barren rocky reef -->
<g clip-path="url(#p1)">
