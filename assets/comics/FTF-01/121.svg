 <rect x="658" y="285" width="75" height="108" rx="8" fill="#142d40" stroke="#07131d" stroke-width="5"/><rect x="669" y="300" width="53" height="69" fill="#9deef1"/><path d="M675 355q15-41 41-15" fill="none" stroke="#ef635d" stroke-width="6"/>
 <rect x="31" y="101" width="420" height="118" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="241" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="241">B-24 암반해역. 폭염 뒤 다시마 숲이 비어 어린 물고기 숨을 곳이 없다.</tspan><tspan x="241" dy="24" font-size="14">B-24岩礁区，热浪后海带林消失，幼鱼失去庇护。</tspan><tspan x="241" dy="21" font-size="13">B-24 rocky reef: heatwaves erased the kelp canopy and shelter.</tspan></text>
 <rect x="470" y="101" width="263" height="111" rx="24" fill="#fff4d7" stroke="#111" stroke-width="4"/><text x="602" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="602">토종 다시마 숲을</tspan><tspan x="602" dy="23">다시 세우자!</tspan><tspan x="602" dy="20" font-size="14">重建本地海带森林！</tspan><tspan x="602" dy="20" font-size="13">Bring back the native kelp!</tspan></text>
 <text x="42" y="482" fill="#fff" stroke="#0b5874" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="40" font-weight="900" font-style="italic">PING!  SCAN!  MARK!</text>
</g>

