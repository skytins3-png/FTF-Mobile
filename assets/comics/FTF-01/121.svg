 <g fill="#c8f7ff" opacity=".85"><circle cx="1025" cy="194" r="8"/><circle cx="1038" cy="171" r="6"/><circle cx="1333" cy="205" r="8"/><circle cx="1347" cy="182" r="6"/></g>
 <rect x="793" y="101" width="430" height="104" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><text x="1008" y="128" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1008">잠수팀이 수온에 강한 토종 다시마 유묘를 암반 고정줄에 하나씩 묶는다.</tspan><tspan x="1008" dy="23" font-size="14">潜水队把耐热的本地海带幼苗逐株固定在岩礁绳上。</tspan><tspan x="1008" dy="21" font-size="13">Divers fasten heat-tolerant native kelp seedlings to reef lines.</tspan></text>
 <rect x="1238" y="100" width="264" height="114" rx="25" fill="#fff" stroke="#111" stroke-width="4"/><text x="1370" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1370">간격 50cm!</tspan><tspan x="1370" dy="23">빛길을 남겨!</tspan><tspan x="1370" dy="20" font-size="14">保持50厘米间距！</tspan><tspan x="1370" dy="20" font-size="13">Leave space for light!</tspan></text>
 <text x="824" y="482" fill="#fff" stroke="#0b6072" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="42" font-weight="900" font-style="italic">CLIP!  TIE!  GROW!</text>
</g>

