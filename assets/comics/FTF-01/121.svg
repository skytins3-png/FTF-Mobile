 <rect x="828" y="871" width="444" height="108" rx="22" fill="#fff4d7" stroke="#111" stroke-width="4"/><text x="1050" y="899" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1050">바닷속 숲이 돌아오면 해안의 생명도 다시 이어진다.</tspan><tspan x="1050" dy="24" font-size="15">海底森林归来，海岸生命重新连接。</tspan><tspan x="1050" dy="22" font-size="14">WHEN THE UNDERWATER FOREST RETURNS, THE COAST LIVES AGAIN.</tspan></text>
