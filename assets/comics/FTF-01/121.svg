 <rect x="34" y="546" width="430" height="106" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><text x="249" y="574" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="249">몇 달 뒤, 다시마 잎이 빛을 잡고 숲이 된다. 어린 물고기와 거북이 돌아온다.</tspan><tspan x="249" dy="23" font-size="14">数月后，海带长成森林，幼鱼和海龟重新归来。</tspan><tspan x="249" dy="21" font-size="13">Months later, the kelp canopy returns—and so does marine life.</tspan></text>
 <text x="66" y="976" fill="#fff" stroke="#184f39" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="44" font-weight="900" font-style="italic">SWISH!  LIFE RETURNS!</text>
</g>

