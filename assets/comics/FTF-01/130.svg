<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #130  검은 먼지의 길을 끊어라</text>
<text x="930" y="49" fill="#bdf7ff" font-family="Arial" font-size="18" font-weight="800">B-33 TIRE-WEAR RUNOFF INTERCEPT · 轮胎磨损颗粒拦截</text>

<!-- PANEL 1: road source tracking -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="10" fill="url(#storm)"/>
