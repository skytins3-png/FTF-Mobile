 <g filter="url(#shadow)"><ellipse cx="1444" cy="178" rx="34" ry="40" fill="#d79d70" stroke="#10212b" stroke-width="5"/><path d="M1414 171q8-31 32-37q28 5 34 37z" fill="#32323a"/><path d="M1407 233q38-23 75 0l25 118h-126z" fill="#225d49" stroke="#10212b" stroke-width="5"/></g>
 <rect x="796" y="103" width="452" height="115" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1022" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1022">배수구 1차 필터 뒤에 광물층·바이오차 포집대를 추가한다.</tspan><tspan x="1022" dy="24" font-size="14">在雨水口滤网后加装矿物层与生物炭捕集带。</tspan><tspan x="1022" dy="22" font-size="13">A mineral-and-biochar trap captures tire particles after the drain screen.</tspan></text>
 <rect x="1260" y="106" width="231" height="94" rx="22" fill="#e7ffd9" stroke="#111" stroke-width="4"/>
 <text x="1375" y="135" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1375">두 단계로 잡아!</tspan><tspan x="1375" dy="22" font-size="13">两级拦截！</tspan><tspan x="1375" dy="20" font-size="12">Catch it in two stages!</tspan></text>
 <text x="802" y="486" fill="#fff" stroke="#145944" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">FILTER!  TRAP!  HOLD!</text>
</g>

<!-- PANEL 3: field verification -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="10" fill="#bed6d2"/>
 <path d="M16 838Q172 793 315 839T762 817V1006H16z" fill="#6a8d82"/>
 <path d="M44 720h682v213H44z" fill="#8fa9a5" stroke="#46645f" stroke-width="5"/>
 <g transform="translate(72 739)"><rect width="286" height="166" rx="14" fill="#123a4c" stroke="#79ead0" stroke-width="5"/><text x="143" y="30" text-anchor="middle" fill="#dffff9" font-family="Arial" font-size="16" font-weight="900">RUNOFF SAMPLE · 14 DAYS</text><text x="22" y="72" fill="#fff" font-family="Arial" font-size="14" font-weight="800">TIRE PARTICLES</text><text x="260" y="72" text-anchor="end" fill="#83f0b0" font-family="Arial" font-size="26" font-weight="900">−69%</text><text x="22" y="108" fill="#fff" font-family="Arial" font-size="14" font-weight="800">ZINC LOAD</text><text x="260" y="108" text-anchor="end" fill="#7edcff" font-family="Arial" font-size="26" font-weight="900">−47%</text><text x="22" y="143" fill="#fff" font-family="Arial" font-size="14" font-weight="800">CAPTURE SERVICE</text><text x="260" y="143" text-anchor="end" fill="#ffe477" font-family="Arial" font-size="18" font-weight="900">21 DAYS</text></g>
 <g transform="translate(390 744)"><rect width="292" height="158" rx="14" fill="#ecfbfb" stroke="#346b71" stroke-width="5"/><circle cx="84" cy="83" r="53" fill="#fff" stroke="#527f86" stroke-width="5"/><g fill="#1b1b1b"><circle cx="58" cy="66" r="7"/><circle cx="92" cy="52" r="6"/><circle cx="110" cy="85" r="8"/><circle cx="72" cy="102" r="5"/><circle cx="121" cy="116" r="6"/></g><text x="174" y="55" fill="#1b4f58" font-family="Arial" font-size="15" font-weight="900">MICROSCOPE</text><text x="174" y="85" fill="#1c7d69" font-family="Arial" font-size="23" font-weight="900">BEFORE → AFTER</text><text x="174" y="116" fill="#253f45" font-family="Arial" font-size="15" font-weight="800">particle count drops</text></g>
 <g filter="url(#shadow)"><ellipse cx="626" cy="646" rx="37" ry="43" fill="#edb58e" stroke="#10212b" stroke-width="5"/><path d="M593 639q8-33 35-39q30 6 34 40z" fill="#363239"/><path d="M586 705q41-24 81 0l29 112H557z" fill="#eef8f9" stroke="#10212b" stroke-width="5"/><path d="M590 726q-50 9-91 34" stroke="#eef8f9" stroke-width="21" stroke-linecap="round"/></g>
 <rect x="39" y="543" width="470" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="274" y="573" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="274">두 번의 폭우 뒤에도 타이어 입자와 아연 유출이 크게 줄었다.</tspan><tspan x="274" dy="24" font-size="14">两场暴雨后，轮胎颗粒与锌的外排仍显著下降。</tspan><tspan x="274" dy="22" font-size="13">After two storms, tire-particle and zinc runoff remain sharply lower.</tspan></text>
 <rect x="522" y="549" width="207" height="95" rx="22" fill="#eafff5" stroke="#111" stroke-width="4"/>
 <text x="625" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="625">검은 먼지가 줄었어!</tspan><tspan x="625" dy="22" font-size="13">黑色颗粒减少了！</tspan><tspan x="625" dy="20" font-size="12">The black dust is down!</tspan></text>
 <text x="43" y="978" fill="#fff" stroke="#225d5a" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="33" font-weight="900">SAMPLE!  COUNT!  VERIFY!</text>
</g>

