 <g fill="#141414" filter="url(#glow)"><circle cx="270" cy="382" r="8"/><circle cx="294" cy="390" r="5"/><circle cx="323" cy="395" r="7"/><circle cx="348" cy="401" r="4"/><circle cx="385" cy="407" r="6"/><circle cx="418" cy="410" r="5"/><circle cx="452" cy="416" r="7"/></g>
 <path d="M265 380Q385 420 523 452" fill="none" stroke="#77dcff" stroke-width="15" opacity=".75"/><path d="M275 382Q390 419 516 447" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 12"/>
 <g filter="url(#shadow)"><ellipse cx="574" cy="282" rx="38" ry="44" fill="#edb58e" stroke="#10212b" stroke-width="5"/><path d="M540 275q9-34 36-40q31 6 36 40z" fill="#2b343b"/><path d="M530 344q45-27 90 0l32 133H497z" fill="#146678" stroke="#10212b" stroke-width="5"/><path d="M536 362q-53 10-100 43" stroke="#146678" stroke-width="22" stroke-linecap="round"/><text x="575" y="426" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="900">FTF</text></g>
 <g filter="url(#shadow)"><ellipse cx="686" cy="307" rx="34" ry="40" fill="#dca073" stroke="#10212b" stroke-width="5"/><path d="M656 300q8-31 32-37q29 6 34 38z" fill="#40302e"/><path d="M650 360q38-22 76 0l26 118H624z" fill="#e0a044" stroke="#10212b" stroke-width="5"/></g>
 <rect x="34" y="103" width="488" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="278" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="278">빗속 도로의 검은 가루는 단순한 흙이 아니다. 타이어 마모 입자다.</tspan><tspan x="278" dy="24" font-size="14">雨天路面的黑色粉末并非普通尘土，而是轮胎磨损颗粒。</tspan><tspan x="278" dy="22" font-size="13">The black dust on wet roads is tire-wear debris, not ordinary dirt.</tspan></text>
 <rect x="520" y="104" width="214" height="96" rx="22" fill="#fff3c9" stroke="#111" stroke-width="4"/>
 <text x="627" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="627">배수구까지 추적해!</tspan><tspan x="627" dy="22" font-size="13">追到排水口！</tspan><tspan x="627" dy="20" font-size="12">Trace it to the drain!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#0a5169" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">SKRRR!  RAIN!  TRACE!</text>
</g>

<!-- PANEL 2: capture system -->
<g>
