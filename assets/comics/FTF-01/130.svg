 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="rain" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M8 0L0 20M25 0L14 30M38 3L28 28" stroke="#d7f4ff" stroke-width="3" opacity=".34"/></pattern>
</defs>
