 <g filter="url(#shadow)"><ellipse cx="965" cy="679" rx="38" ry="44" fill="#efb991" stroke="#10212b" stroke-width="5"/><path d="M931 672q9-34 36-40q31 6 36 40z" fill="#2d3540"/><path d="M921 739q45-27 90 0l32 132H888z" fill="#146678" stroke="#10212b" stroke-width="5"/><text x="966" y="817" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="900">FTF</text></g>
 <g filter="url(#shadow)"><ellipse cx="1088" cy="696" rx="34" ry="40" fill="#d9a274" stroke="#10212b" stroke-width="5"/><path d="M1058 689q8-31 32-37q29 6 34 38z" fill="#44322e"/><path d="M1052 749q38-22 76 0l26 119h-128z" fill="#d89a42" stroke="#10212b" stroke-width="5"/></g>
 <rect x="796" y="544" width="460" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1026" y="574" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1026">도로에서 막은 작은 입자 하나가 하구와 바다의 생명을 지킨다.</tspan><tspan x="1026" dy="24" font-size="14">在道路上拦下的一颗小颗粒，也能守护河口与海洋生命。</tspan><tspan x="1026" dy="22" font-size="13">Every particle stopped on the road protects life downstream.</tspan></text>
 <rect x="1271" y="551" width="218" height="96" rx="22" fill="#e6fff0" stroke="#111" stroke-width="4"/>
 <text x="1380" y="581" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1380">바다까지 보내지 마!</tspan><tspan x="1380" dy="22" font-size="13">别让它流进大海！</tspan><tspan x="1380" dy="20" font-size="12">Keep it out of the sea!</tspan></text>
 <rect x="1132" y="694" width="347" height="143" rx="18" fill="#082b3b" stroke="#77ead7" stroke-width="5" opacity=".96"/>
 <text x="1305" y="724" text-anchor="middle" fill="#dffff8" font-family="Arial" font-size="16" font-weight="900">B-33 FIELD RESULT</text><text x="1155" y="761" fill="#fff" font-family="Arial" font-size="14" font-weight="800">TIRE PARTICLE OUTFALL</text><text x="1454" y="761" text-anchor="end" fill="#82f0b3" font-family="Arial" font-size="24" font-weight="900">−69%</text><text x="1155" y="799" fill="#fff" font-family="Arial" font-size="14" font-weight="800">ESTUARY TURBIDITY</text><text x="1454" y="799" text-anchor="end" fill="#7edcff" font-family="Arial" font-size="24" font-weight="900">−31%</text>
 <text x="802" y="978" fill="#fff" stroke="#0b5667" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="32" font-weight="900">STOP AT SOURCE · PROTECT DOWNSTREAM!</text>
