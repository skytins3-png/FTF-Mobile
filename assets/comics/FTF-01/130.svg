 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#4b555d"/><stop offset="1" stop-color="#20272d"/></linearGradient>
 <linearGradient id="bio" x2="0" y2="1"><stop stop-color="#a8d4b5"/><stop offset="1" stop-color="#376d58"/></linearGradient>
 <linearGradient id="river" x2="0" y2="1"><stop stop-color="#6ed6e3"/><stop offset="1" stop-color="#0b5574"/></linearGradient>
