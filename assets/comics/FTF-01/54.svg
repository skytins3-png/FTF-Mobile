<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #54 — 맹그로브가 지키는 바다</title>
<desc id="d">Four-panel cinematic manga-style scene continuing the FTF-01 ocean story: a fishing family learns why coastal habitat matters, a storm hits an exposed shore, residents plant mangroves and restore a tidal nursery, and the recovered coast fills with fish, crabs and birds. Korean, Chinese and English narration, speech bubbles and visual sound effects are integrated into story-specific illustrated environments.</desc>
<defs>
 <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62c8ff"/><stop offset="1" stop-color="#e7f8ff"/></linearGradient>
 <linearGradient id="seaDay" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#37c7df"/><stop offset="1" stop-color="#0876a8"/></linearGradient>
 <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#324a63"/><stop offset=".55" stop-color="#1a3046"/><stop offset="1" stop-color="#0c2337"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd27c"/><stop offset=".5" stop-color="#ff9c70"/><stop offset="1" stop-color="#58bddd"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".3"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .panel{stroke:#111820;stroke-width:10}.box{fill:#fffef6;stroke:#111820;stroke-width:4}.bubble{fill:#fff;stroke:#111;stroke-width:4}.ko{font:700 28px sans-serif;fill:#101820}.zh{font:600 22px sans-serif;fill:#163c58}.en{font:600 21px sans-serif;fill:#17212b}.sfx{font:900 44px sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.line{stroke:#1c2a33;stroke-width:5;stroke-linecap:round;fill:none}.face{stroke:#5b3528;stroke-width:2}
 </style>
</defs>
<!-- PANEL 1: coastal lesson -->
<g>
 <rect class="panel" x="4" y="4" width="760" height="500" rx="4" fill="url(#skyDay)"/>
 <path d="M5 310 Q180 278 360 315 T760 305 V500 H5Z" fill="url(#seaDay)"/>
 <path d="M5 395 Q170 355 350 400 T760 380 V500 H5Z" fill="#d7c89b"/>
 <g fill="#fff7de" stroke="#6c4f3c" stroke-width="3"><rect x="40" y="210" width="170" height="105"/><path d="M25 210 l105-72 105 72Z" fill="#db6b42"/><rect x="100" y="246" width="42" height="69" fill="#5e97b2"/></g>
 <g fill="#2f8b55"><circle cx="620" cy="330" r="42"/><circle cx="675" cy="322" r="36"/><path d="M635 330 q-10 70-12 160 M683 327 q-5 75-8 150" stroke="#6b4d2f" stroke-width="14"/></g>
 <!-- father -->
 <g transform="translate(430 125)" filter="url(#shadow)"><ellipse class="face" cx="90" cy="78" rx="52" ry="60" fill="#d79a70"/><path d="M40 70 Q48 18 97 20 Q145 23 148 74 Q112 48 80 51 Q58 53 40 70" fill="#252d38"/><ellipse cx="72" cy="80" rx="5" ry="7"/><ellipse cx="109" cy="80" rx="5" ry="7"/><path d="M71 108 q22 16 45 0" class="line" stroke-width="3"/><path d="M43 138 q48-22 102 5 l24 182H16Z" fill="#ef8b2d" stroke="#24343d" stroke-width="4"/><path d="M59 140 v165 M126 142 v160" stroke="#24323a" stroke-width="9"/></g>
 <!-- daughter -->
 <g transform="translate(280 180)" filter="url(#shadow)"><ellipse class="face" cx="70" cy="64" rx="45" ry="50" fill="#efb18e"/><path d="M25 60 q5-49 48-52 q46 2 46 55 q-26-22-49-21 q-22 0-45 18" fill="#4a2c26"/><ellipse cx="54" cy="67" rx="5" ry="7"/><ellipse cx="86" cy="67" rx="5" ry="7"/><path d="M54 92 q17 12 34 0" class="line" stroke-width="3"/><path d="M25 113 q49-22 92 4 l18 150H6Z" fill="#ef6f78" stroke="#24343d" stroke-width="4"/></g>
 <rect class="box" x="18" y="20" width="388" height="132" rx="8"/><text x="36" y="57" class="ko">깨끗한 바다 다음은,</text><text x="36" y="91" class="ko">생명의 집을 되살리는 일이에요.</text><text x="36" y="120" class="zh">清洁海洋之后，要恢复生命的家园。</text><text x="36" y="147" class="en">Next, we restore the coast where life begins.</text>
 <path class="bubble" d="M438 25 h286 q18 0 18 18v118q0 18-18 18H586l-31 36 6-36H438q-18 0-18-18V43q0-18 18-18Z"/><text x="458" y="67" class="ko">맹그로브는 어린 물고기의 집이야!</text><text x="458" y="102" class="zh">红树林是幼鱼的家！</text><text x="458" y="136" class="en">Mangroves are nurseries for young fish!</text>
 <text x="55" y="463" class="sfx" fill="#169857">PROTECT THE NURSERY!</text>
</g>
<!-- PANEL 2: storm damage -->
<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" rx="4" fill="url(#storm)"/>
 <path d="M4 330 Q130 255 260 330 T520 315 T764 305 V500H4Z" fill="#0a6889"/>
 <g stroke="#d4f6ff" stroke-width="5" opacity=".8"><path d="M20 360 q130-70 260 0t260 0t224-10"/><path d="M0 405 q160-75 320-4t300 0"/></g>
 <g stroke="#b9d9e8" stroke-width="4" opacity=".8"><path d="M40 40 l-80 120 M120 25 L20 180 M220 30 L110 200 M340 25 L230 200 M470 25 L350 190 M590 30 L470 205 M710 25 L590 200"/></g>
 <path d="M70 390 q110-100 205-14 q76 65 145 8 q85-70 175-10 q66 44 165 8V500H50Z" fill="#beaa79"/>
 <path d="M180 365 q-40 75-16 125 M290 350 q-70 88-42 140" stroke="#755337" stroke-width="14"/>
 <g transform="translate(470 195)" filter="url(#shadow)"><ellipse class="face" cx="62" cy="58" rx="40" ry="46" fill="#d49a74"/><path d="M22 54 q8-45 45-47 q42 1 42 51 q-26-22-48-18 q-19 3-39 14" fill="#242f3b"/><path d="M24 103 q48-20 84 7 l16 130H5Z" fill="#ef8b2d" stroke="#1e2d36" stroke-width="4"/><path d="M92 130 q57 37 87 82" stroke="#d49a74" stroke-width="17" fill="none" stroke-linecap="round"/></g>
 <rect class="box" x="20" y="20" width="490" height="130" rx="8"/><text x="38" y="56" class="ko">숲이 사라진 해안은 폭풍과 파도에 약해져요.</text><text x="38" y="91" class="zh">失去红树林的海岸更容易受到风暴和巨浪冲击。</text><text x="38" y="125" class="en">Without coastal forests, storms strike homes and habitat harder.</text>
 <path class="bubble" d="M520 170 h202q18 0 18 18v98q0 18-18 18H623l-22 34 3-34H520q-18 0-18-18v-98q0-18 18-18Z"/><text x="540" y="211" class="ko">파도가 너무 커요!</text><text x="540" y="246" class="zh">浪太大了！</text><text x="540" y="278" class="en">The waves are too strong!</text>
 <text x="365" y="465" class="sfx" fill="#ef3c33">CRASH! WHOOSH!</text>
</g>
<!-- PANEL 3: restoration work -->
<g transform="translate(0 512)">
 <rect class="panel" x="4" y="4" width="760" height="508" rx="4" fill="url(#skyDay)"/>
 <path d="M4 260 Q180 230 370 265 T760 250 V508H4Z" fill="#61c8d0"/>
 <path d="M4 330 Q190 300 380 335 T760 325 V508H4Z" fill="#8d6842"/>
 <!-- rows of seedlings -->
 <g stroke="#805431" stroke-width="6" fill="#2a9c58"><path d="M90 350 q0 85 0 130"/><path d="M210 330 q0 100 0 155"/><path d="M335 350 q0 85 0 130"/><path d="M610 340 q0 95 0 145"/><g><ellipse cx="75" cy="365" rx="25" ry="11"/><ellipse cx="105" cy="360" rx="25" ry="11"/><ellipse cx="195" cy="348" rx="25" ry="11"/><ellipse cx="225" cy="343" rx="25" ry="11"/><ellipse cx="320" cy="367" rx="25" ry="11"/><ellipse cx="350" cy="360" rx="25" ry="11"/><ellipse cx="595" cy="356" rx="25" ry="11"/><ellipse cx="625" cy="350" rx="25" ry="11"/></g></g>
 <!-- volunteers actual illustrated -->
 <g transform="translate(390 160)" filter="url(#shadow)"><ellipse class="face" cx="65" cy="56" rx="39" ry="45" fill="#efb18c"/><path d="M25 52 q8-43 43-46 q40 2 41 50 q-24-18-43-16 q-20 0-41 12" fill="#4c2d25"/><path d="M25 100 q48-19 83 10 l18 145H8Z" fill="#ef6f78" stroke="#25333d" stroke-width="4"/><path d="M108 126 q43 35 68 92" stroke="#efb18c" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(515 145)" filter="url(#shadow)"><ellipse class="face" cx="68" cy="60" rx="42" ry="48" fill="#d59a72"/><path d="M24 56 q8-48 48-50 q44 2 44 55 q-26-20-47-18 q-20 1-45 13" fill="#29323b"/><path d="M25 108 q55-22 92 12 l20 150H5Z" fill="#345d4d" stroke="#25333d" stroke-width="4"/></g>
 <g transform="translate(245 210)"><ellipse class="face" cx="55" cy="48" rx="34" ry="40" fill="#e6a880"/><path d="M22 45 q5-38 35-40 q34 1 36 42 q-20-17-38-15 q-16 1-33 13" fill="#292f38"/><path d="M21 91 q42-16 70 8 l12 100H8Z" fill="#f09a32" stroke="#25333d" stroke-width="3"/></g>
 <rect class="box" x="18" y="20" width="455" height="130" rx="8"/><text x="36" y="56" class="ko">주민과 어민이 함께 맹그로브를 심고</text><text x="36" y="90" class="ko">갯벌과 어린 생명의 터전을 되살려요.</text><text x="36" y="119" class="zh">居民和渔民一起种下红树林，恢复潮间带生态。</text><text x="36" y="146" class="en">Together we restore mangroves and the tidal nursery.</text>
 <path class="bubble" d="M500 26 h235q16 0 16 16v86q0 16-16 16H625l-24 32 4-32H500q-16 0-16-16V42q0-16 16-16Z"/><text x="519" y="64" class="ko">한 그루씩 다시 시작해요!</text><text x="519" y="96" class="zh">一棵一棵重新开始！</text><text x="519" y="126" class="en">One tree at a time!</text>
 <text x="60" y="470" class="sfx" fill="#168e4c">PLANT! ROOT! RESTORE!</text>
</g>
<!-- PANEL 4: thriving restored coast -->
<g transform="translate(768 512)">
 <rect class="panel" x="4" y="4" width="764" height="508" rx="4" fill="url(#sunset)"/>
 <path d="M4 260 Q180 220 350 260 T760 240 V508H4Z" fill="url(#seaDay)"/>
 <path d="M0 360 q105-85 205-22 q95 58 185 6 q90-53 180 5 q75 49 194 0V508H0Z" fill="#7c6641"/>
 <!-- mature mangrove forest -->
 <g fill="#21844b" stroke="#61462e" stroke-width="10"><path d="M70 250 q-5 150 0 235 M150 230 q-8 170 4 255 M610 225 q-4 175 2 260 M685 245 q-5 155 0 240"/><g stroke="none"><circle cx="70" cy="220" r="70"/><circle cx="145" cy="205" r="74"/><circle cx="612" cy="198" r="78"/><circle cx="685" cy="215" r="70"/></g><path d="M70 390 l-45 90 M70 390 l42 90 M150 375 l-40 110 M150 375 l50 105 M610 370 l-48 112 M610 370 l52 112 M685 392 l-43 90 M685 392 l50 86" fill="none" stroke="#61462e" stroke-width="10"/></g>
 <!-- fish, crab, birds -->
 <g fill="#ffcf4f" stroke="#164b62" stroke-width="3"><path d="M300 390 q35-25 70 0 q-35 25-70 0 l-30 18v-36Z"/><path d="M405 430 q30-22 62 0 q-30 22-62 0 l-26 15v-30Z"/><path d="M470 350 q26-20 55 0 q-27 20-55 0 l-22 14v-28Z"/></g>
 <g stroke="#263746" stroke-width="4" fill="none"><path d="M280 145 q22-25 44 0 q22-25 44 0"/><path d="M420 115 q20-23 40 0 q20-23 40 0"/></g>
 <g transform="translate(525 365)" fill="#d85b4c" stroke="#6f2924" stroke-width="3"><ellipse cx="35" cy="25" rx="28" ry="18"/><circle cx="17" cy="6" r="5"/><circle cx="51" cy="6" r="5"/><path d="M10 27 l-28 18 M60 27 l28 18 M8 34 l-30 0 M62 34 l30 0"/></g>
 <!-- family lookout -->
 <g transform="translate(225 255)" filter="url(#shadow)"><ellipse class="face" cx="60" cy="55" rx="38" ry="43" fill="#efb18b"/><path d="M22 51 q6-40 40-43 q38 1 39 47 q-24-18-41-16 q-19 1-38 12" fill="#4b2b25"/><path d="M24 98 q47-18 76 8 l16 128H8Z" fill="#ee6d78" stroke="#25333d" stroke-width="4"/></g>
 <g transform="translate(330 245)" filter="url(#shadow)"><ellipse class="face" cx="64" cy="57" rx="40" ry="46" fill="#d69a72"/><path d="M24 53 q7-44 43-47 q41 1 42 50 q-23-19-44-17 q-18 1-41 14" fill="#262f39"/><path d="M25 104 q49-20 85 9 l18 137H6Z" fill="#ef8a2d" stroke="#25333d" stroke-width="4"/></g>
 <rect class="box" x="18" y="20" width="500" height="128" rx="8"/><text x="36" y="55" class="ko">뿌리가 파도를 막고, 숲이 생명을 품습니다.</text><text x="36" y="89" class="ko">바다와 마을이 함께 살아나는 미래예요.</text><text x="36" y="118" class="zh">根系挡住海浪，森林孕育生命，海洋与村庄一起复苏。</text><text x="36" y="145" class="en">Roots soften the waves; a living coast protects us all.</text>
 <path class="bubble" d="M500 160 h232q16 0 16 16v86q0 16-16 16H625l-24 32 4-32H500q-16 0-16-16v-86q0-16 16-16Z"/><text x="519" y="198" class="ko">물고기와 새가 돌아왔어요!</text><text x="519" y="230" class="zh">鱼和鸟都回来了！</text><text x="519" y="261" class="en">The fish and birds are back!</text>
 <text x="255" y="474" class="sfx" fill="#1c9a59">LIVING COAST! BRIGHTER FUTURE!</text>
</g>
<rect x="6" y="970" width="168" height="47" rx="8" fill="#102c43"/><text x="22" y="1004" font-family="sans-serif" font-size="31" font-weight="900" fill="#fff">FTF-01 #54</text>
</svg>