<style>
.p{stroke:#071722;stroke-width:8}.b{fill:#fffdf8;stroke:#11232e;stroke-width:4}.sp{fill:#fff;stroke:#11232e;stroke-width:4}.txt{font-family:'Noto Sans KR','Noto Sans CJK SC',Arial,sans-serif;font-weight:700}.ko{font-size:22px}.zh{font-size:18px}.en{font-size:17px}.line{stroke:#101820;stroke-width:4;stroke-linejoin:round}.skin{fill:#efbd9c}.skin2{fill:#d7a17d}.hair{fill:#18232c}.hair2{fill:#493028}.ftf{fill:#155f92}.vest{fill:#102a3d}.sfx{font-family:Arial Black,sans-serif;font-weight:900;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.tag{font-family:Arial Black,sans-serif;font-weight:900}
</style>
</defs>
<rect width="1536" height="1024" fill="#07151e"/><rect width="1536" height="66" fill="#0a385e"/>
<text x="20" y="45" class="tag" font-size="34" fill="#fff">FTF-01  #101</text>
<text x="275" y="42" class="txt" font-size="28" fill="#fff">데이터가 가리킨 곳으로 · 跟随数据回到海洋 · FOLLOW THE DATA BACK TO THE SEA</text>
<text x="1510" y="42" text-anchor="end" class="txt" font-size="16" fill="#d7f7ff">기록은 행동이 되고, 행동은 바다를 바꿉니다.</text>

<!-- PANEL 1: targeted mission briefing -->
<g transform="translate(14,80)">
<rect class="p" width="748" height="424" rx="8" fill="url(#sky)"/><path d="M0 270q100-28 200 0t200 0 180 0 168 0v154H0z" fill="#1593bd"/><path d="M0 296q95-18 190 0t190 0 190 0 178 0" fill="none" stroke="#c9f7ff" stroke-width="7"/>
<path d="M521 125l44 63H480z" fill="#647d85"/><path d="M538 103l18 25h-35z" fill="#f2f6f7"/>
<g transform="translate(61,188)" filter="url(#sh)"><path d="M45 102Q18 138 20 216h126q2-78-40-113z" class="ftf line"/><circle cx="84" cy="68" r="43" class="skin line"/><path d="M43 69q5-46 41-48 40 2 45 49-21-14-40-27-16 16-45 26z" class="hair2 line"/><path d="M49 34q31-22 73-2l-7-22q-31-19-59 0z" fill="#155f92" class="line"/><text x="84" y="26" text-anchor="middle" class="tag" font-size="13" fill="#fff">FTF</text><ellipse cx="69" cy="73" rx="6" ry="8"/><ellipse cx="99" cy="73" rx="6" ry="8"/><path d="M74 94q12 8 27-1" fill="none" stroke="#9c5148" stroke-width="4"/><path d="M109 144l145-52 10 27-140 71" class="skin line"/></g>
<g transform="translate(318,196)" filter="url(#sh)"><circle cx="62" cy="59" r="38" class="skin2 line"/><path d="M27 59q5-40 35-42 35 2 38 42-18-12-34-22-13 14-38 22z" class="hair line"/><path d="M36 91q-22 35-18 101h95q2-63-26-100z" class="vest line"/><rect x="87" y="113" width="98" height="70" rx="7" fill="#243844" class="line"/><rect x="98" y="124" width="76" height="46" fill="#76cfe5"/><circle cx="136" cy="147" r="8" fill="#ff6b5f"/></g>
<rect x="18" y="16" width="370" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">지도에서 오염 집중 지점 B-04가 확인됐습니다.</text><text x="31" y="73" class="txt zh">地图确认了污染热点 B-04。</text><text x="31" y="100" class="txt en">The map confirms pollution hotspot B-04.</text>
<rect x="410" y="18" width="312" height="112" rx="54" class="sp"/><text x="566" y="48" text-anchor="middle" class="txt ko">오늘은 그 지점을 정확히 정리해요!</text><text x="566" y="77" text-anchor="middle" class="txt zh">今天就精准清理那个区域！</text><text x="566" y="104" text-anchor="middle" class="txt en">Today we clean that exact site!</text><text x="505" y="395" class="sfx" font-size="48" fill="#22bde8">TARGET!</text>
</g>

<!-- PANEL 2: underwater targeted cleanup -->
<g transform="translate(774,80)">
<rect class="p" width="748" height="424" rx="8" fill="url(#sea)"/><path d="M0 335q120-44 230-18t190-5 328 16v96H0z" fill="#214f5c"/>
