<rect x="390" y="200" width="300" height="186" rx="16" fill="#f5fbfd" class="line"/><text x="412" y="233" class="tag" font-size="22" fill="#0a385e">FTF OCEAN MAP · B-04</text><text x="412" y="267" class="txt" font-size="17">Plastic fragments  ↓ 42%</text><text x="412" y="296" class="txt" font-size="17">Water clarity      ↑ 27%</text><text x="412" y="325" class="txt" font-size="17">Turtle sightings   0 → 3</text><path d="M416 359l54-24 50 8 55-50 68 14" fill="none" stroke="#1699bc" stroke-width="7"/><circle cx="575" cy="293" r="8" fill="#1699bc"/>
<rect x="18" y="16" width="394" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">수치가 좋아졌지만, 기록과 보호는 계속됩니다.</text><text x="31" y="73" class="txt zh">数据改善了，但记录和保护仍会继续。</text><text x="31" y="100" class="txt en">The numbers improve, but monitoring and protection continue.</text>
<rect x="427" y="18" width="295" height="112" rx="54" class="sp"/><text x="575" y="48" text-anchor="middle" class="txt ko">다음 지점도 데이터로 찾아가자!</text><text x="575" y="77" text-anchor="middle" class="txt zh">下一站也跟着数据走！</text><text x="575" y="104" text-anchor="middle" class="txt en">Let the data guide our next mission!</text><text x="412" y="452" class="sfx" font-size="43" fill="#fff">MEASURE · ACT · PROTECT!</text>
</g>
</svg>