<g transform="translate(307,300)"><path d="M0 0q44-38 98-7 32 18 70 2" fill="none" stroke="#6e5b46" stroke-width="8"/><path d="M44-15l22 18-13 23-25-8z" fill="#c9d1d2" class="line"/><path d="M92-19l26 9-6 28-27-2z" fill="#5ba8cf" class="line"/><path d="M144-13l31 13-10 28-30-5z" fill="#e4e9ec" class="line"/></g>
<rect x="18" y="16" width="385" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">폐낚싯줄과 플라스틱 조각을 산호에서 분리합니다.</text><text x="31" y="73" class="txt zh">我们把废弃钓线和塑料碎片从珊瑚上清除。</text><text x="31" y="100" class="txt en">We free the reef from fishing line and plastic fragments.</text>
<rect x="421" y="18" width="300" height="112" rx="54" class="sp"/><text x="571" y="48" text-anchor="middle" class="txt ko">산호는 건드리지 말고, 한 조각씩!</text><text x="571" y="77" text-anchor="middle" class="txt zh">别碰珊瑚，一片一片来！</text><text x="571" y="104" text-anchor="middle" class="txt en">Protect the coral—one piece at a time!</text><text x="480" y="394" class="sfx" font-size="48" fill="#65ecff">SNIP!  LIFT!</text>
</g>

