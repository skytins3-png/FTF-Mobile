<rect x="515" y="298" width="58" height="112" rx="8" fill="#d9f3f8" class="line"/><circle cx="544" cy="326" r="11" fill="#2d8fba"/><rect x="529" y="350" width="30" height="45" fill="#6fd2e6"/><path d="M544 410v52" stroke="#d9f3f8" stroke-width="9"/>
<rect x="18" y="16" width="390" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">정화 뒤 센서를 다시 설치하고 생태 회복을 확인합니다.</text><text x="31" y="73" class="txt zh">清理后重新安装传感器，确认生态恢复。</text><text x="31" y="100" class="txt en">After cleanup, sensors confirm the ecosystem is recovering.</text>
<rect x="426" y="18" width="295" height="112" rx="54" class="sp"/><text x="573" y="48" text-anchor="middle" class="txt ko">봐! 바다거북이 다시 돌아왔어!</text><text x="573" y="77" text-anchor="middle" class="txt zh">看！海龟回来了！</text><text x="573" y="104" text-anchor="middle" class="txt en">Look—the sea turtle is back!</text><text x="466" y="461" class="sfx" font-size="46" fill="#69e4ff">LIFE RETURNS!</text>
</g>

