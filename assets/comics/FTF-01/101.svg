<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8edcff"/><stop offset="1" stop-color="#eaf9ff"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1cb4d7"/><stop offset="1" stop-color="#05496f"/></linearGradient>
<linearGradient id="reef" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d6f91"/><stop offset="1" stop-color="#04394f"/></linearGradient>
<linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd879"/><stop offset=".48" stop-color="#f08e67"/><stop offset="1" stop-color="#404f6b"/></linearGradient>
