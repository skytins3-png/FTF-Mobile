000" transform="rotate(-10 620 610)">CRACK!</text><rect x="122" y="250" width="320" height="132" rx="18" fill="#08131ccf" stroke="#d8f7ff" stroke-width="3"/><text x="146" y="295" fill="#f8ffff" font-size="24" font-weight="900">SATELLITE ALERT</text><text x="146" y="336" fill="#a7d9e8" font-size="21">GLACIER FRACTURE +38%</text><rect x="70" y="1112" width="940" height="386" rx="28" fill="#161f27" stroke="#526f81" stroke-width="4"/><path d="M182 1450 q-64-176 20-286 q68-92 194-40 q120 50 96 326z" fill="#314958"/><ellipse cx="326" cy="1244" rx="94" ry="110" fill="#d2a27d" stroke="#151515" stroke-width="5"/><path d="M236 1220 q40-126 176-88 q-12-105-120-94 q-102 14-118 134z" fill="#20272c"/><rect x="252" y="1232" width="62" height="30" rx="12" fill="none" stroke="#171d22" stroke-width="6"/><rect x="342" y="1232" width="62" height="30" rx="12" fill="none" stroke="#171d22" stroke-width="6"/><line x1="314" y1="1247" x2="342" y2="1247" stroke="#171d22" stroke-width="6"/><path d="M312 1316 q38 20 78-2" fill="none" stroke="#744f43" stroke-width="6"/><path d="M204 1438 q114-104 248 0" fill="#f1b84b"/><rect x="454" y="1150" width="486" height="146" rx="58" fill="#fff" filter="url(#shadow)"/><path d="M512 1286 l-34 68 76-54" fill="#fff"/><text x="492" y="1196" fill="#1d2b34" font-size="25" font-weight="900">“균열 속도가 너무 빨라.”</text><text x="492" y="1236" fill="#425866" font-size="22">“裂缝扩大的速度太快了。”</text><text x="492" y="1272" fill="#718794" font-size="18">“The fracture is accelerating.”</text><rect x="70" y="1532" width="940" height="250" rx="26" fill="#091219" stroke="#f0c35a" stroke-width="4"/><text x="104" y="1584" fill="#f0c35a" font-size="25" font-weight="900">상황 설명 · CAPTION</text><text x="104" y="1634" fill="#ffffff" font-size="31" font-weight="900">수천 년 된 빙하가 거대한 소리와 함께 갈라진다.</text><text x="104" y="1684" fill="#d8e7ef" font-size="28">存在数千年的冰川正伴随巨响崩裂。</text><text x="104" y="1730" fill="#9fb8c7" font-size="22">Ancient ice breaks apart faster than predicted.</text><text x="78"