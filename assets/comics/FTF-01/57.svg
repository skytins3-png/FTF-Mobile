<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #57 — 산호의 밤, 새 생명이 태어나다</title>
<desc id="d">Four-panel cinematic manga scene continuing FTF-01 after coral restoration: a coastal family and marine biologists prepare for coral spawning night, protect the reef from anchors and bright lights, witness a mass coral spawning event, and monitor new juvenile coral settlement. Korean, Chinese and English narration, speech bubbles, visual sound effects, actual illustrated characters, boats, reef, turtles, fish and underwater research equipment.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06162d"/><stop offset=".55" stop-color="#073e63"/><stop offset="1" stop-color="#0b7c91"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#062d52"/><stop offset="1" stop-color="#021827"/></linearGradient>
 <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5b36b"/><stop offset=".28" stop-color="#4da7c7"/><stop offset="1" stop-color="#0a5272"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff7c7" stop-opacity=".95"/><stop offset="1" stop-color="#d5f6ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <style>.panel{stroke:#0b1720;stroke-width:10}.box{fill:#fffdf1;stroke:#0b1720;stroke-width:4}.bub{fill:#fff;stroke:#111;stroke-width:4}.ko{font:700 26px 'Noto Sans KR',sans-serif;fill:#101820}.zh{font:600 20px sans-serif;fill:#18445d}.en{font:600 19px sans-serif;fill:#15222d}.sfx{font:900 42px Impact,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.thin{stroke:#243a45;stroke-width:4;stroke-linecap:round;fill:none}.face{fill:#e7a67c;stroke:#5b3528;stroke-width:2}.hair{fill:#222d38}.suit{fill:#19384d;stroke:#0c202b;stroke-width:4}.coral1{fill:#ff765f;stroke:#6f332d;stroke-width:3}.coral2{fill:#f5c84f;stroke:#6b5422;stroke-width:3}.coral3{fill:#a875e6;stroke:#49306e;stroke-width:3}</style>
</defs>
<!-- PANEL 1: PREPARATION -->
<g><rect class="panel" x="4" y="4" width="760" height="500" fill="url(#night)"/>
 <circle cx="665" cy="74" r="44" fill="#fff8cf"/><g fill="#fff" opacity=".9"><circle cx="92" cy="58" r="2"/><circle cx="162" cy="104" r="2"/><circle cx="305" cy="62" r="3"/><circle cx="540" cy="110" r="2"/><circle cx="708" cy="142" r="2"/></g>
 <path d="M4 370Q120 338 240 366T470 350T760 365V500H4Z" fill="#0a6e87" opacity=".9"/>
 <g transform="translate(390 230)" filter="url(#shadow)"><path d="M-90 115h300l-28 62H-55Z" fill="#e9edf0" stroke="#152932" stroke-width="5"/><path d="M15 32h105v85H15Z" fill="#f6f1dd" stroke="#1b2d35" stroke-width="4"/><path d="M120 58l64 29-64 3Z" fill="#e84d44"/><rect x="-55" y="135" width="92" height="16" fill="#ebbb36"/></g>
 <g transform="translate(110 205)" filter="url(#shadow)"><ellipse class="face" cx="58" cy="53" rx="38" ry="43"/><path class="hair" d="M18 50q8-43 42-46q39 2 39 48q-20-16-41-15q-20 0-40 13"/><path d="M13 102q48-22 92 7l18 121H0Z" fill="#df6074" stroke="#1c2e39" stroke-width="4"/><path d="M35 52h48" stroke="#112b3c" stroke-width="6"/><circle cx="45" cy="55" r="12" fill="#c8f4ff" stroke="#112b3c" stroke-width="3"/><circle cx="78" cy="55" r="12" fill="#c8f4ff" stroke="#112b3c" stroke-width="3"/></g>
 <g transform="translate(255 200)" filter="url(#shadow)"><ellipse class="face" cx="58" cy="53" rx="38" ry="43"/><path class="hair" d="M18 50q8-43 42-46q39 2 39 48q-20-16-41-15q-20 0-40 13"/><path class="suit" d="M13 102q48-22 92 7l18 121H0Z"/><path d="M40 44q20-14 39 0" stroke="#111" stroke-width="4" fill="none"/></g>
 <rect class="box" x="18" y="18" width="462" height="142" rx="8"/><text x="38" y="53" class="ko">오늘 밤, 복원된 산호초가 새 생명을 준비합니다.</text><text x="38" y="88" class="ko">연구팀과 마을 가족이 산호 산란을 기다려요.</text><text x="38" y="119" class="zh">今晚，复育的珊瑚礁将迎来新生命。</text><text x="38" y="149" class="en">Tonight, the restored reef prepares for new life.</text>
 <path class="bub" d="M500 24h236q16 0 16 16v120q0 16-16 16H634l-30 34 5-34H500q-16 0-16-16V40q0-16 16-16Z"/><text x="519" y="61" class="ko">불빛을 낮추고 조용히 기다려요!</text><text x="519" y="95" class="zh">把灯调暗，安静等待！</text><text x="519" y="129" class="en">Dim the lights. Wait quietly!</text><text x="52" y="463" class="sfx" fill="#70d7ff">READY… REEF NIGHT!</text></g>
<!-- PANEL 2: PROTECTION -->
<g transform="translate(768 0)"><rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/>
 <path d="M4 402Q170 365 330 397T760 375V500H4Z" fill="#978868"/>
 <g class="coral1"><path d="M85 455q15-92 36-8q14-72 31 2q18-68 38 5q-45 18-105 1Z"/><path d="M600 460q17-100 39-9q17-78 37 1q19-71 41 5q-51 17-117 3Z"/></g>
 <g transform="translate(92 190)"><path d="M35 100q60-68 133-4q-18 82-94 90q-53-9-39-86Z" fill="#81725a" stroke="#26333a" stroke-width="4"/><ellipse cx="95" cy="100" rx="8" ry="7" fill="#111"/><path d="M168 114q54-19 82 5q-35 23-75 16Z" fill="#81725a" stroke="#26333a" stroke-width="4"/></g>
 <g transform="translate(395 175)"><circle cx="58" cy="55" r="40" fill="#d99a72"/><rect x="18" y="47" width="82" height="31" rx="14" fill="#bfefff" opacity=".85" stroke="#173949" stroke-width="4"/><path class="suit" d="M12 102q50-21 94 7l18 134H0Z"/><path d="M98 128q65 20 115 72" stroke="#d99a72" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M213 200l38-72" stroke="#f2d755" stroke-width="10"/></g>
 <g transform="translate(560 165)"><path d="M50 0v180" stroke="#e5e9ec" stroke-width="10"/><circle cx="50" cy="22" r="28" fill="#e65a4e" stroke="#fff" stroke-width="7"/><path d="M8 76h84v54H8Z" fill="#fff9e7" stroke="#192a33" stroke-width="4"/><text x="20" y="110" font-size="24" font-weight="900" fill="#173a54">NO ANCHOR</text></g>
 <rect class="box" x="18" y="18" width="492" height="142" rx="8"/><text x="38" y="53" class="ko">산란의 밤에는 닻, 강한 조명, 소음을 멈춥니다.</text><text x="38" y="88" class="ko">작은 방해도 산호의 번식을 망칠 수 있어요.</text><text x="38" y="119" class="zh">产卵之夜，停止抛锚、强光和噪音。</text><text x="38" y="149" class="en">No anchors, harsh lights or noise on spawning night.</text>
 <path class="bub" d="M510 34h220q16 0 16 16v102q0 16-16 16H630l-24 32 4-32H510q-16 0-16-16V50q0-16 16-16Z"/><text x="531" y="74" class="ko">여기는 산호 보호구역!</text><text x="531" y="108" class="zh">这里是珊瑚保护区！</text><text x="531" y="140" class="en">Reef protection zone!</text><text x="55" y="466" class="sfx" fill="#ff5050">STOP! LIGHTS DOWN!</text></g>
<!-- PANEL 3: MASS SPAWNING -->
<g transform="translate(0 512)"><rect class="panel" x="4" y="4" width="760" height="508" fill="url(#deep)"/>
 <g opacity=".9" fill="#ff98c7"><circle cx="95" cy="100" r="5"/><circle cx="140" cy="140" r="7"/><circle cx="180" cy="90" r="6"/><circle cx="228" cy="160" r="5"/><circle cx="270" cy="120" r="8"/><circle cx="315" cy="75" r="6"/><circle cx="355" cy="145" r="7"/><circle cx="402" cy="105" r="6"/><circle cx="445" cy="165" r="8"/><circle cx="485" cy="88" r="5"/><circle cx="530" cy="128" r="7"/><circle cx="580" cy="72" r="6"/><circle cx="625" cy="145" r="8"/><circle cx="680" cy="98" r="6"/></g>
 <g opacity=".7" fill="#ffd3e3"><circle cx="115" cy="210" r="4"/><circle cx="210" cy="235" r="5"/><circle cx="340" cy="220" r="4"/><circle cx="475" cy="250" r="5"/><circle cx="610" cy="220" r="4"/></g>
 <path d="M4 385Q190 340 370 382T760 356V508H4Z" fill="#b29a6b"/>
 <g class="coral3"><path d="M70 455q13-105 38-8q17-82 39 2q20-76 43 5q-50 18-120 1Z"/><path d="M520 460q16-110 42-9q17-86 40 2q23-77 42 5q-53 18-124 2Z"/></g>
 <g transform="translate(260 240)"><circle cx="58" cy="52" r="38" class="face"/><rect x="18" y="46" width="82" height="30" rx="14" fill="#c5f5ff" opacity=".86" stroke="#173949" stroke-width="4"/><path class="suit" d="M12 100q48-20 92 8l18 120H0Z"/></g>
 <g transform="translate(410 245)"><circle cx="58" cy="52" r="38" class="face"/><rect x="18" y="46" width="82" height="30" rx="14" fill="#c5f5ff" opacity=".86" stroke="#173949" stroke-width="4"/><path d="M12 100q48-20 92 8l18 120H0Z" fill="#df6175" stroke="#1c2e39" stroke-width="4"/></g>
 <rect class="box" x="18" y="18" width="472" height="136" rx="8"/><text x="36" y="53" class="ko">자정이 지나자 산호가 수백만 개의 생명 씨앗을 놓아요.</text><text x="36" y="87" class="ko">바다가 별빛처럼 반짝이기 시작합니다.</text><text x="36" y="118" class="zh">午夜过后，珊瑚释放数百万颗生命种子。</text><text x="36" y="148" class="en">After midnight, millions of coral seeds rise like stars.</text>
 <path class="bub" d="M500 24h232q16 0 16 16v95q0 16-16 16H635l-23 31 4-31H500q-16 0-16-16V40q0-16 16-16Z"/><text x="522" y="63" class="ko">와… 바닷속 은하수 같아요!</text><text x="522" y="97" class="zh">哇……像海里的银河！</text><text x="522" y="129" class="en">Wow… an underwater galaxy!</text><text x="44" y="475" class="sfx" fill="#ff8dca">WHOOSH! BLOOM! SPARKLE!</text></g>
<!-- PANEL 4: NEW GENERATION -->
<g transform="translate(768 512)"><rect class="panel" x="4" y="4" width="764" height="508" fill="url(#dawn)"/>
 <g opacity=".35" stroke="#e9ffff" stroke-width="5"><path d="M90 0L25 285M220 0L135 295M380 0L270 310M540 0L415 300M700 0L575 310"/></g>
 <path d="M4 392Q170 342 355 389T760 366V508H4Z" fill="#c5ae7d"/>
 <g class="coral1"><path d="M90 462q13-100 38-7q16-78 37 2q20-72 41 5q-48 18-116 0Z"/></g><g class="coral2"><path d="M500 455q14-92 37-6q15-72 35 2q18-65 39 5q-46 17-111-1Z"/></g>
 <g transform="translate(250 175)"><rect x="0" y="85" width="190" height="110" rx="12" fill="#d9e6e9" stroke="#1b313b" stroke-width="5"/><g fill="#e77b60"><circle cx="35" cy="120" r="7"/><circle cx="72" cy="145" r="8"/><circle cx="110" cy="118" r="6"/><circle cx="150" cy="152" r="8"/></g><text x="24" y="182" font-size="22" font-weight="800" fill="#164c66">SETTLEMENT TILE</text></g>
 <g transform="translate(470 208)"><path d="M22 73q58-59 128-4q-19 75-88 81q-47-8-40-77Z" fill="#7c7058" stroke="#27333b" stroke-width="4"/><ellipse cx="80" cy="77" rx="8" ry="7" fill="#111"/><path d="M148 89q50-17 77 5q-32 20-70 14Z" fill="#7c7058" stroke="#27333b" stroke-width="4"/></g>
 <g fill="#ffd65f" stroke="#563d1d" stroke-width="2"><ellipse cx="130" cy="255" rx="34" ry="15"/><path d="M97 255l-31-20v40Z"/><ellipse cx="610" cy="330" rx="31" ry="14"/><path d="M580 330l-29-18v36Z"/></g>
 <rect class="box" x="18" y="18" width="510" height="138" rx="8"/><text x="36" y="53" class="ko">며칠 뒤, 어린 산호가 정착판과 바위에 자리를 잡습니다.</text><text x="36" y="87" class="ko">복원된 산호초가 이제 스스로 다음 세대를 만들어요.</text><text x="36" y="118" class="zh">几天后，幼珊瑚在礁石上安家，新的世代开始了。</text><text x="36" y="148" class="en">Days later, baby corals settle. A new generation begins.</text>
 <path class="bub" d="M535 25h198q16 0 16 16v105q0 16-16 16H645l-23 31 4-31H535q-16 0-16-16V41q0-16 16-16Z"/><text x="553" y="65" class="ko">새 산호가 붙었어요!</text><text x="553" y="99" class="zh">新珊瑚安家了！</text><text x="553" y="131" class="en">New coral has settled!</text><text x="42" y="470" class="sfx" fill="#ffe55f">NEW LIFE! REEF FUTURE!</text></g>
</svg>