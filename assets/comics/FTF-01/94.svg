<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fd6ff"/><stop offset="1" stop-color="#effaff"/></linearGradient>
 <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#607f98"/><stop offset="1" stop-color="#bed4df"/></linearGradient>
 <linearGradient id="lab" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff8fb"/><stop offset="1" stop-color="#c8e0e9"/></linearGradient>
 <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#42c6d9"/><stop offset="1" stop-color="#116b9b"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <style>
  .p{stroke:#07131f;stroke-width:8}.cap{font-family:'Noto Sans KR','Noto Sans CJK SC',Arial,sans-serif;font-weight:700}.ko{font-size:22px}.zh{font-size:18px}.en{font-size:17px}.box{fill:#fffdf5;stroke:#15212a;stroke-width:4}.bubble{fill:#fff;stroke:#111a22;stroke-width:4}.sfx{font-family:Arial Black,sans-serif;font-weight:900;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}.tag{font-family:Arial Black,sans-serif;font-weight:900}.skin{fill:#f0c29f}.skin2{fill:#dcae8c}.hair{fill:#24252c}.hair2{fill:#3b2b27}.ftf{fill:#164f79}.vest{fill:#f37c34}.white{fill:#f5f7fa}.line{stroke:#111a22;stroke-width:4;stroke-linejoin:round}.eye{fill:#16202a}
 </style>
</defs>
<rect width="1536" height="1024" fill="#07131f"/>
<rect width="1536" height="64" fill="#0a2942"/>
<text x="22" y="43" class="tag" font-size="31" fill="#fff">FTF-01  #94</text>
<text x="250" y="41" class="cap" font-size="29" fill="#fff">바다에 닿기 전에 막는다 · 在抵达大海之前拦住 · STOP IT BEFORE IT REACHES THE SEA</text>
<text x="1510" y="42" text-anchor="end" class="cap" font-size="16" fill="#bfefff">보이지 않는 오염은, 보이는 곳에서부터 줄입니다.</text>

<!-- PANEL 1: storm drain retrofit -->
<g transform="translate(14,78)">
 <rect class="p" width="748" height="422" rx="6" fill="url(#storm)"/>
 <rect y="270" width="748" height="152" fill="#58666d"/>
 <path d="M0 283h748M0 346h748" stroke="#d9e0e3" stroke-width="5" stroke-dasharray="34 25"/>
 <g fill="#8b9ba3"><rect x="0" y="134" width="748" height="32"/><rect x="60" y="68" width="106" height="66"/><rect x="185" y="84" width="78" height="50"/><rect x="562" y="58" width="132" height="76"/></g>
 <g opacity=".45" stroke="#d8f2ff" stroke-width="4"><path d="M30 22l-14 36M85 5L67 54M154 20l-15 39M242 7l-18 48M330 18l-17 39M430 2l-19 55M538 17l-16 39M655 8l-19 52"/></g>
 <g transform="translate(392,245)" filter="url(#shadow)"><rect width="270" height="120" rx="10" fill="#1e2f38" class="line"/><rect x="21" y="17" width="228" height="38" rx="4" fill="#0b151b"/><path d="M30 74h210" stroke="#91a7af" stroke-width="13"/><path d="M30 100h210" stroke="#91a7af" stroke-width="13"/><g fill="#ffca5a"><circle cx="66" cy="87" r="8"/><circle cx="128" cy="75" r="7"/><circle cx="185" cy="93" r="8"/></g><text x="135" y="146" text-anchor="middle" class="tag" font-size="16" fill="#fff">MICRO-FILTER DRAIN</text></g>
 <g transform="translate(70,170)" filter="url(#shadow)"><path d="M55 107Q20 139 24 222h128q5-78-37-112z" class="ftf line"/><circle cx="90" cy="73" r="49" class="skin line"/><path d="M42 75q6-51 49-52 47 2 49 55-25-18-46-31-17 19-49 28z" class="hair line"/><path d="M47 43q36-34 89-1l-7-29q-40-25-74 1z" fill="#f7fafc" class="line"/><text x="91" y="29" text-anchor="middle" class="cap" font-size="14" fill="#164f79">FTF</text><ellipse cx="74" cy="77" rx="6" ry="8" class="eye"/><ellipse cx="105" cy="77" rx="6" ry="8" class="eye"/><path d="M76 99q14 9 28-1" fill="none" stroke="#984c48" stroke-width="4"/><path d="M33 145l-52 54 17 18 61-47z" class="skin line"/><path d="M122 146l80 35-10 24-79-23z" class="skin line"/></g>
 <g transform="translate(245,217)" filter="url(#shadow)"><path d="M50 94Q18 119 20 184h110q3-62-31-90z" class="vest line"/><circle cx="77" cy="61" r="40" class="skin2 line"/><path d="M39 60q5-42 39-43 39 1 41 45-20-13-38-24-15 15-40 22z" class="hair2 line"/><path d="M48 31q30-24 61-1l-5-18q-29-19-52 0z" fill="#fff" class="line"/></g>
 <rect x="18" y="16" width="344" height="112" rx="8" class="box"/><text x="32" y="44" class="cap ko">비가 오면 도로의 미세플라스틱도 하천으로 흐릅니다.</text><text x="32" y="72" class="cap zh">下雨时，道路上的微塑料也会流入河流。</text><text x="32" y="99" class="cap en">Rain can wash road microplastics straight into the river.</text>
 <rect x="398" y="20" width="326" height="112" rx="52" class="bubble"/><text x="561" y="50" text-anchor="middle" class="cap ko">배수구에서 먼저 걸러내요!</text><text x="561" y="78" text-anchor="middle" class="cap zh">先在排水口把它们拦住！</text><text x="561" y="104" text-anchor="middle" class="cap en">We catch them at the drain first!</text>
 <text x="394" y="404" class="sfx" font-size="43" fill="#ffd34f">CLANK! · FILTER ON!</text>
</g>

<!-- PANEL 2: laundry microfiber trap -->
<g transform="translate(774,78)">
 <rect class="p" width="748" height="422" rx="6" fill="#e8f1f3"/>
 <rect y="292" width="748" height="130" fill="#c4d2d7"/>
 <g transform="translate(380,80)" filter="url(#shadow)"><rect width="300" height="255" rx="20" fill="#f7fafb" class="line"/><circle cx="95" cy="120" r="72" fill="#94cfe2" class="line"/><circle cx="95" cy="120" r="49" fill="#387c9d"/><path d="M48 115q35-32 91 2t-8 40q-54 18-83-42z" fill="#d8f3fa" opacity=".7"/><rect x="202" y="34" width="65" height="96" rx="10" fill="#1d4355" class="line"/><rect x="213" y="47" width="43" height="48" rx="4" fill="#b8f4ff"/><path d="M232 130v50q0 35-52 35" fill="none" stroke="#29a4c3" stroke-width="12"/><rect x="152" y="192" width="74" height="48" rx="9" fill="#fff" class="line"/><g fill="#ff6b5f"><circle cx="170" cy="208" r="5"/><circle cx="190" cy="220" r="4"/><circle cx="207" cy="207" r="5"/></g><text x="189" y="262" text-anchor="middle" class="tag" font-size="14">MICROFIBER TRAP</text></g>
 <g transform="translate(70,135)" filter="url(#shadow)"><path d="M58 109Q20 141 24 229h132q5-82-39-116z" fill="#f2f5f7" class="line"/><circle cx="94" cy="75" r="51" class="skin line"/><path d="M45 76q6-53 50-54 49 2 50 56-25-19-47-32-17 20-50 30z" class="hair2 line"/><ellipse cx="77" cy="79" rx="6" ry="8" class="eye"/><ellipse cx="109" cy="79" rx="6" ry="8" class="eye"/><path d="M81 99q14 9 28-2" fill="none" stroke="#95504c" stroke-width="4"/><path d="M128 149l97 20-5 25-101-7z" class="skin line"/></g>
 <rect x="18" y="16" width="344" height="112" rx="8" class="box"/><text x="31" y="44" class="cap ko">세탁할 때 빠져나오는 미세섬유도 바다로 향합니다.</text><text x="31" y="72" class="cap zh">洗衣时脱落的微纤维也会流向大海。</text><text x="31" y="99" class="cap en">Laundry microfibers can travel all the way to the sea.</text>
 <rect x="36" y="286" width="316" height="110" rx="52" class="bubble"/><text x="194" y="316" text-anchor="middle" class="cap ko">세탁기에도 작은 필터를 달아요.</text><text x="194" y="344" text-anchor="middle" class="cap zh">洗衣机也装上微纤维过滤器。</text><text x="194" y="370" text-anchor="middle" class="cap en">A small filter can stop thousands of fibers.</text>
 <text x="451" y="403" class="sfx" font-size="44" fill="#27b6d0">WHIRR! · CATCH!</text>
</g>

<!-- PANEL 3: before/after sampling -->
<g transform="translate(14,514)">
 <rect class="p" width="748" height="488" rx="6" fill="url(#lab)"/>
 <g transform="translate(34,52)"><rect width="302" height="235" rx="12" fill="#0d2531" stroke="#35cfe8" stroke-width="4"/><text x="151" y="29" text-anchor="middle" class="tag" font-size="18" fill="#fff">BEFORE · 설치 전</text><g fill="#ff655c"><circle cx="65" cy="79" r="10"/><path d="M112 61l22 9-11 21-22-7z"/><circle cx="201" cy="96" r="12"/><path d="M245 60l20 17-14 20-24-14z"/></g><g fill="#ffd65b"><circle cx="95" cy="145" r="9"/><circle cx="166" cy="126" r="8"/><path d="M235 143l18 11-10 18-21-9z"/></g><g fill="#5fe1ef"><circle cx="62" cy="186" r="8"/><path d="M147 174l18 16-11 18-20-15z"/><circle cx="252" cy="199" r="8"/></g><text x="151" y="223" text-anchor="middle" class="cap" font-size="18" fill="#ff9c8f">MICROPLASTICS 100%</text></g>
 <g transform="translate(412,52)"><rect width="302" height="235" rx="12" fill="#0d2531" stroke="#35cfe8" stroke-width="4"/><text x="151" y="29" text-anchor="middle" class="tag" font-size="18" fill="#fff">AFTER 30 DAYS · 30일 후</text><g fill="#ff655c"><circle cx="95" cy="91" r="8"/><path d="M212 71l18 9-10 17-18-6z"/></g><g fill="#ffd65b"><circle cx="160" cy="152" r="7"/></g><text x="151" y="191" text-anchor="middle" class="tag" font-size="32" fill="#64f2b0">↓ 57%</text><text x="151" y="223" text-anchor="middle" class="cap" font-size="18" fill="#b8ffe0">LESS MICROPLASTICS</text></g>
 <g transform="translate(238,315)" filter="url(#shadow)"><path d="M52 92Q18 120 20 185h112q3-63-31-92z" class="ftf line"/><circle cx="79" cy="60" r="41" class="skin line"/><path d="M40 60q5-43 40-44 39 1 41 46-21-14-39-24-15 15-40 22z" class="hair line"/><path d="M43 35q33-26 69-1l-5-20q-31-18-58 0z" fill="#fff" class="line"/><text x="80" y="28" text-anchor="middle" class="cap" font-size="12" fill="#164f79">FTF</text></g>
 <g transform="translate(360,314)" filter="url(#shadow)"><path d="M52 93Q18 121 20 187h114q3-64-32-93z" fill="#eef4f7" class="line"/><circle cx="80" cy="61" r="41" class="skin2 line"/><path d="M41 61q5-44 40-45 40 1 42 47-21-14-39-25-15 16-41 23z" class="hair2 line"/><rect x="46" y="52" width="30" height="20" rx="8" fill="none" stroke="#314b5b" stroke-width="3"/><rect x="87" y="52" width="30" height="20" rx="8" fill="none" stroke="#314b5b" stroke-width="3"/><line x1="76" y1="61" x2="87" y2="61" stroke="#314b5b" stroke-width="3"/></g>
 <rect x="20" y="304" width="205" height="154" rx="8" class="box"/><text x="34" y="333" class="cap ko">같은 지점에서 다시 측정합니다.</text><text x="34" y="362" class="cap zh">在同一地点再次采样。</text><text x="34" y="390" class="cap en">We sample the same place again.</text><text x="34" y="430" class="cap ko" fill="#0b7899">“줄었어요!”</text><text x="34" y="456" class="cap en" fill="#0b7899">“It’s going down!”</text>
 <text x="520" y="454" class="sfx" font-size="46" fill="#28c58f">DATA CHECK!</text>
</g>

