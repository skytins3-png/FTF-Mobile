 <g fill="#f8d35f" stroke="#17445a" stroke-width="4"><path d="M456 307q28-24 59 0-29 24-59 0zm59 0 24-17v34z"/><path d="M566 354q23-20 50 0-24 21-50 0zm50 0 20-15v30z"/><path d="M647 281q20-18 42 0-20 18-42 0zm42 0 17-13v26z"/></g>
 <g transform="translate(72,225)" filter="url(#shadow)"><path d="M57 108Q20 140 24 226h132q4-81-39-114z" class="ftf line"/><circle cx="93" cy="74" r="50" class="skin line"/><path d="M45 75q6-52 49-53 48 2 49 55-25-18-46-31-17 19-49 29z" class="hair line"/><ellipse cx="77" cy="78" rx="6" ry="8" class="eye"/><ellipse cx="108" cy="78" rx="6" ry="8" class="eye"/><path d="M79 99q14 10 29-1" fill="none" stroke="#984c48" stroke-width="4"/><path d="M124 151l106-43 10 25-104 55z" class="skin line"/></g>
 <g transform="translate(240,287)" filter="url(#shadow)"><path d="M46 82Q17 108 19 164h100q3-54-28-80z" fill="#f3f6f7" class="line"/><circle cx="70" cy="54" r="36" class="skin line"/><path d="M35 54q5-37 36-38 35 1 37 39-18-11-34-21-13 13-37 20z" class="hair2 line"/></g>
 <rect x="20" y="18" width="354" height="124" rx="8" class="box"/><text x="34" y="47" class="cap ko">오염을 바다에서 건지는 것보다, 육지에서 막는 게 먼저입니다.</text><text x="34" y="77" class="cap zh">与其到海里打捞，不如先在陆地阻断污染。</text><text x="34" y="106" class="cap en">The best ocean cleanup starts before pollution reaches the sea.</text>
 <rect x="394" y="28" width="323" height="116" rx="54" class="bubble"/><text x="555" y="58" text-anchor="middle" class="cap ko">물고기가 다시 보여요!</text><text x="555" y="86" text-anchor="middle" class="cap zh">鱼又回来了！</text><text x="555" y="112" text-anchor="middle" class="cap en">The fish are coming back!</text>
 <text x="397" y="458" class="sfx" font-size="46" fill="#20b7d8">FLOW CLEAN! · LIFE RETURNS!</text>
</g>
