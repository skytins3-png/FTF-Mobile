<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a1220"/><stop offset=".48" stop-color="#24344a"/><stop offset="1" stop-color="#080d14"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1920" fill="#05070a"/><rect x="34" y="34" width="1012" height="1852" rx="34" fill="url(#bg)" stroke="#eaf0f7" stroke-width="5"/><g><path d="M80 470 H1000 V1040 H80Z" fill="#111923" stroke="#5f7893" stroke-width="7"/><path d="M120 980 L240 780 340 865 460 620 575 770 690 535 820 725 960 590" fill="none" stroke="#73e0ff" stroke-width="14" filter="url(#gl)"/><g fill="#ffcf68"><circle cx="240" cy="780" r="18"/><circle cx="460" cy="620" r="18"/><circle cx="690" cy="535" r="18"/><circle cx="960" cy="590" r="18"/></g><text x="130" y="545" font-family="Arial" font-size="34" fill="#c5d8eb">EXTREME WEATHER FREQUENCY</text></g><g transform="translate(100 1080)"><circle cx="120" cy="100" r="68" fill="#d3a07a"/><path d="M55 92 Q120 15 185 92 L172 38 Q112 3 65 42Z" fill="#20242d"/><path d="M55 180 Q120 140 190 180 L240 500 H15Z" fill="#2c3a48"/><circle cx="95" cy="102" r="7"/><circle cx="145" cy="102" r="7"/><path d="M95 135 Q120 125 148 137" fill="none" stroke="#61392e" stroke-width="5"/></g><g transform="translate(725 1080)"><circle cx="120" cy="100" r="68" fill="#c38a68"/><path d="M55 86 Q120 20 185 86 L173 35 Q115 5 65 42Z" fill="#171a21"/><path d="M55 180 Q120 140 190 180 L240 500 H15Z" fill="#3c4a59"/><circle cx="95" cy="102" r="7"/><circle cx="145" cy="102" r="7"/></g><g><path d="M250 1120 Q500 1025 760 1115 L720 1315 Q500 1370 290 1285Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="315" y="1186" font-family="Arial" font-size="34" fill="#111" font-weight="700">“한 번의 재난이 아니야.”</text><text x="315" y="1238" font-family="Arial" font-size="29" fill="#333">这不是一次性的灾害。</text><text x="315" y="1282" font-family="Arial" font-size="26" fill="#555">This is a repeating pattern.</text></g><g><rect x="78" y="1500" width="930" height="220" fill="#0b1118" opacity=".95" stroke="#d7e0eb" stroke-width="5"/><text x="112" y="1567" font-family="Arial" font-size="38" fill="#ffe48c" font-weight="700">상황 설명 · 재난 데이터가 하나의 곡선을 만든다.</text><text x="112" y="1622" font-family="Arial" font-size="31" fill="#fff">폭풍, 산불, 홍수의 간격이 점점 짧아진다.</text><text x="112" y="1670" font-family="Arial" font-size="28" fill="#c9d9e9">风暴、山火和洪水之间的间隔越来越短。</text></g><text x="76" y="190" font-family="Arial" font-size="54" fill="#fff" font-weight="900">FTF-01 · 19 / 26</text><text x="730" y="320" font-family="Arial" font-size="72" fill="#ff6575" font-weight="900" transform="rotate(-6 730 320)">BEEP! BEEP!</text></svg>