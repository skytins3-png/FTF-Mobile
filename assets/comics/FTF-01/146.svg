<text x="920" y="49" fill="#c8f7ff" font-family="Arial" font-size="18" font-weight="800">CLEAR → WATCH → VERIFY · 放行后持续监测</text>

<!-- PANEL 1: vessel cleared after reinspection, digital passport renewed -->
<g>
