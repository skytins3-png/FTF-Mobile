 <rect x="38" y="102" width="515" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="296" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="296">재검사 음성 확인 뒤 새 생물보안 여권을 발급한다. 하지만 감시는 여기서 끝나지 않는다.</tspan><tspan x="296" dy="24" font-size="14">复检阴性后签发新生物安全通行证，但监测并未结束。</tspan><tspan x="296" dy="22" font-size="13">A new biosecurity pass is issued after a negative recheck—but surveillance continues.</tspan></text>
 <path d="M568 104h165q18 0 18 18v76q0 18-18 18h-100l-29 28 8-28h-44q-18 0-18-18v-76q0-18 18-18z" fill="#dffff0" stroke="#111" stroke-width="4"/>
 <text x="650" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="650">입항 허가. 감시는 계속!</tspan><tspan x="650" dy="21">准入，但继续监测！</tspan><tspan x="650" dy="19" font-size="12">Cleared. Keep watching!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#285d45" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">CLEAR!  REISSUE!  KEEP WATCH!</text>
</g>

