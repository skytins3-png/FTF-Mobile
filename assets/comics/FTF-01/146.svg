 <text x="298" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">B-2에서 아주 작은 상승 신호가 잡히자 항만 전체가 아니라 해당 지점만 즉시 다시 확인한다.</tspan><tspan x="298" dy="24" font-size="14">B-2出现微弱上升信号后，只对该点立即复核，不扰动整个港区。</tspan><tspan x="298" dy="22" font-size="13">A tiny B-2 signal triggers an immediate targeted recheck instead of disrupting the whole harbor.</tspan></text>
 <path d="M578 546h154q18 0 18 18v76q0 18-18 18h-91l-29 27 8-27h-42q-18 0-18-18v-76q0-18 18-18z" fill="#fff0bd" stroke="#111" stroke-width="4"/>
 <text x="655" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="655">B-2만 다시 본다!</tspan><tspan x="655" dy="21">只复查B-2！</tspan><tspan x="655" dy="19" font-size="12">Recheck B-2 only!</tspan></text>
 <text x="42" y="980" fill="#fff" stroke="#775f19" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">PING!  FLAG!  TARGET!  RECHECK!</text>
