 <rect x="812" y="543" width="525" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1074" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1074">30일 동안 반복 확인해 침입 신호가 사라진 것을 검증하고, K-17 항로의 위험 모델도 새 기록으로 갱신한다.</tspan><tspan x="1074" dy="24" font-size="14">连续30天复核确认入侵信号消失，并用新记录更新K-17航线风险模型。</tspan><tspan x="1074" dy="22" font-size="13">Thirty days of clean checks close the alert and update the K-17 route risk model.</tspan></text>
