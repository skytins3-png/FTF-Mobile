 <text x="1141" y="275" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="900">SMART eDNA WATCH GRID</text><text x="1141" y="304" text-anchor="middle" fill="#8dffad" font-family="Arial" font-size="18" font-weight="900">B-2  ·  C-4  ·  ENTRY GATE</text>
 <rect x="798" y="102" width="520" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">B-2·C-4·입구의 스마트 부이가 물을 자동 채취해 eDNA 변화를 밤낮없이 비교한다.</tspan><tspan x="1058" dy="24" font-size="14">B-2、C-4与港口入口的智能浮标昼夜自动采水，比对eDNA变化。</tspan><tspan x="1058" dy="22" font-size="13">Smart buoys at B-2, C-4 and the entry gate continuously sample water and compare eDNA.</tspan></text>
 <path d="M1336 105h151q18 0 18 18v74q0 18-18 18h-88l-29 27 8-27h-42q-18 0-18-18v-74q0-18 18-18z" fill="#dffbff" stroke="#111" stroke-width="4"/>
 <text x="1411" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1411">24시간 자동 감시!</tspan><tspan x="1411" dy="21">24小时自动监测！</tspan><tspan x="1411" dy="19" font-size="12">24/7 watch!</tspan></text>
 <text x="802" y="487" fill="#fff" stroke="#176378" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">SAMPLE!  COMPARE!  WATCH!</text>
</g>

