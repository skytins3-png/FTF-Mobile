<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><defs><linearGradient id="o" x2="0" y2="1"><stop stop-color="#38c7d9"/><stop offset="1" stop-color="#07324e"/></linearGradient><linearGradient id="n" x2="0" y2="1"><stop stop-color="#16304d"/><stop offset="1" stop-color="#030b18"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".45"/></filter></defs><rect width="1536" height="1024" fill="#06131f"/><rect x="12" y="12" width="1512" height="58" rx="12" fill="#0b2a43"/><text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #122  다시마 숲의 밤, 생명이 돌아오다</text><text x="905" y="49" fill="#a8efff" font-family="Arial" font-size="18" font-weight="800">B-25 NIGHT REEF CHECK · 海带森林夜间监测</text>
<!-- p1 --> <g><rect x="16" y="84" width="746" height="428" rx="8" fill="url(#o)"/><path d="M16 430Q190 390 360 430T762 410V512H16Z" fill="#6c6557"/><g stroke="#315f28" stroke-width="10" fill="#66a94c"><path d="M80 455q-5-145 48-245q-15 100 38 178q-35-10-86 67Z"/><path d="M195 455q8-170 62-265q-22 115 37 194q-42-9-99 71Z"/><path d="M332 455q-2-165 56-270q-18 112 38 197q-44-10-94 73Z"/><path d="M472 455q3-150 52-244q-13 101 37 181q-37-8-89 63Z"/></g><g filter="url(#s)"><ellipse cx="603" cy="244" rx="44" ry="49" fill="#efbd98" stroke="#11202a" stroke-width="5"/><path d="M561 241q9-39 42-45q37 6 44 50z" fill="#4d342e"/><circle cx="590" cy="250" r="4"/><circle cx="616" cy="250" r="4"/><path d="M590 269q14 12 28 0" fill="none" stroke="#9a5a50" stroke-width="4"/><path d="M560 301q44-27 87 0l35 150H525z" fill="#eaf7fa" stroke="#11202a" stroke-width="5"/><text x="603" y="384" text-anchor="middle" fill="#0a668d" font-family="Arial" font-size="24" font-weight="900">FTF</text></g><rect x="42" y="101" width="460" height="108" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="272" y="129" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="272">B-25. 복원 한 달 후, 다시마 숲은 밤에도 어린 물고기를 품고 있다.</tspan><tspan x="272" dy="23" font-size="14">修复一个月后，夜间海带森林也开始庇护幼鱼。</tspan><tspan x="272" dy="21" font-size="13">One month later, the restored kelp forest shelters juvenile fish at night.</tspan></text><text x="45" y="486" fill="#fff" stroke="#07516c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">SCAN!  COUNT!  RECORD!</text></g>
<!-- p2 --> <g><rect x="774" y="84" width="746" height="428" rx="8" fill="url(#n)"/><path d="M774 441Q960 402 1140 440T1520 422V512H774Z" fill="#665f53"/><g stroke="#2d5e29" stroke-width="9" fill="#5e9c43"><path d="M828 465q-4-165 58-270q-20 115 40 196q-45-12-98 74Z"/><path d="M1020 466q3-175 66-287q-19 120 42 207q-48-11-108 80Z"/><path d="M1230 466q-5-155 55-251q-18 105 39 182q-43-10-94 69Z"/><path d="M1412 466q2-160 56-254q-15 105 37 182q-40-8-93 72Z"/></g><g filter="url(#s)"><ellipse cx="985" cy="260" rx="42" ry="47" fill="#e8b58d" stroke="#06121d" stroke-width="5"/><rect x="964" y="242" width="44" height="25" rx="7" fill="#9cefff" stroke="#06121d" stroke-width="5"/><path d="M945 311q42-27 84 0l35 139H910z" fill="#103b55" stroke="#06121d" stroke-width="5"/><path d="M944 334q-45 20-82 61" stroke="#103b55" stroke-width="24" stroke-linecap="round"/><text x="986" y="391" text-anchor="middle" fill="#eaffff" font-family="Arial" font-size="23" font-weight="900">FTF</text></g><g fill="#ffd65c" stroke="#293946" stroke-width="3"><path d="M1140 240q38-28 77 0q-39 28-77 0l-24-19v38z"/><path d="M1270 300q32-24 66 0q-34 24-66 0l-21-16v32z"/><path d="M1360 223q31-23 63 0q-32 23-63 0l-20-16v32z"/></g><rect x="805" y="101" width="430" height="100" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1020" y="129" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1020">야간 잠수팀이 생물 이동과 수온을 센서로 기록한다.</tspan><tspan x="1020" dy="23" font-size="14">夜潜队记录鱼群移动与水温。</tspan><tspan x="1020" dy="21" font-size="13">Night divers log fish movement and temperature.</tspan></text><rect x="1248" y="112" width="240" height="108" rx="24" fill="#fff5ce" stroke="#111" stroke-width="4"/><text x="1368" y="146" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1368">숲 안쪽까지 들어온다!</tspan><tspan x="1368" dy="23" font-size="14">鱼群进入森林深处！</tspan><tspan x="1368" dy="21" font-size="13">They're moving deeper in!</tspan></text><text x="825" y="487" fill="#fff" stroke="#0b6072" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="40" font-weight="900">BLIP!  SWISH!  BEEP!</text></g>
<!-- p3 --> <g><rect x="16" y="524" width="746" height="482" rx="8" fill="url(#o)"/><path d="M16 917Q190 870 380 910T762 890V1006H16Z" fill="#6d6556"/><g stroke="#2c612b" stroke-width="10" fill="#69a84c"><path d="M70 940q0-205 74-334q-24 135 48 232q-55-17-122 102Z"/><path d="M225 940q-3-195 66-313q-19 127 48 222q-51-16-114 91Z"/><path d="M397 940q3-210 77-342q-23 140 50 237q-54-18-127 105Z"/><path d="M590 940q0-190 68-309q-20 128 47 219q-49-13-115 90Z"/></g><g transform="translate(540 700)" fill="#65a26b" stroke="#214b3a" stroke-width="5"><ellipse rx="58" ry="41"/><ellipse cx="64" cy="-4" rx="22" ry="17"/><path d="M-28-28l-45-40q-12 25 12 57zM-25 28l-43 38q-10-26 13-53z"/></g><g fill="#f4c65c" stroke="#263a45" stroke-width="3"><path d="M170 700q36-27 73 0q-37 27-73 0l-23-18v36z"/><path d="M300 760q34-25 69 0q-35 25-69 0l-22-17v34z"/></g><rect x="42" y="548" width="444" height="110" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="264" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="264">새벽, 바다거북과 치어 떼가 복원 숲을 가로지른다.</tspan><tspan x="264" dy="23" font-size="14">黎明时，海龟与幼鱼群穿过恢复的海带森林。</tspan><tspan x="264" dy="21" font-size="13">At dawn, turtles and juvenile fish cross the restored forest.</tspan></text><text x="53" y="974" fill="#fff" stroke="#0d5f77" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="42" font-weight="900">LIFE RETURNS!  SWISH—</text></g>
<!-- p4 --> <g><rect x="774" y="524" width="746" height="482" rx="8" fill="#dff5f7"/><rect x="800" y="555" width="690" height="287" rx="16" fill="#12364b"/><rect x="824" y="580" width="642" height="238" rx="10" fill="#071e2d"/><polyline points="855,760 930,735 1000,742 1080,690 1150,673 1230,640 1310,620 1418,596" fill="none" stroke="#6fffd2" stroke-width="8"/><g fill="#9deef1" font-family="Arial" font-size="22" font-weight="800"><text x="850" y="625">Juvenile fish use  +72%</text><text x="850" y="665">Kelp survival      89%</text><text x="850" y="705">Night habitat use  +58%</text><text x="850" y="745">Temp refuge        -1.8°C</text></g><g filter="url(#s)"><ellipse cx="1335" cy="885" rx="45" ry="50" fill="#efbd98" stroke="#11202a" stroke-width="5"/><path d="M1293 880q8-38 42-45q36 6 44 49z" fill="#4d342e"/><path d="M1290 930q45-26 90 0l45 76h-179z" fill="#eaf7fa" stroke="#11202a" stroke-width="5"/></g><rect x="810" y="855" width="470" height="124" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1045" y="885" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1045">숲이 돌아오자 밤의 피난처도 돌아왔다.</tspan><tspan x="1045" dy="25" font-size="15">海带森林回来后，夜间庇护所也回来了。</tspan><tspan x="1045" dy="23" font-size="14">As the kelp returned, the night refuge returned with it.</tspan><tspan x="1045" dy="24" fill="#0a668d">RESTORE THE FOREST · RESTORE THE FUTURE</tspan></text><text x="1275" y="995" fill="#0a668d" font-family="Arial" font-size="28" font-weight="900">DATA CONFIRMED!</text></g><rect x="12" y="1008" width="1512" height="4" fill="#8aeaf0"/></svg>