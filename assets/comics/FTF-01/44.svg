<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="FTF-01 scene 44 water conservation cinematic manga comic">
<defs>
 <linearGradient id="p1" x2="0" y2="1"><stop stop-color="#f9f1dc"/><stop offset="1" stop-color="#bfe6f6"/></linearGradient>
 <linearGradient id="p2" x2="0" y2="1"><stop stop-color="#f6b45a"/><stop offset="1" stop-color="#7b3d2b"/></linearGradient>
 <linearGradient id="p3" x2="0" y2="1"><stop stop-color="#dff3f7"/><stop offset="1" stop-color="#79bbca"/></linearGradient>
 <linearGradient id="p4" x2="0" y2="1"><stop stop-color="#7fd7f7"/><stop offset="1" stop-color="#6ecb78"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".28"/></filter>
 <style>text{font-family:Arial,'Malgun Gothic','Noto Sans KR',sans-serif}.o{stroke:#18262d;stroke-width:5}.skin{fill:#efbf9c;stroke:#18262d;stroke-width:5}.hair{fill:#2b2428;stroke:#18262d;stroke-width:5}.b{fill:#fff;stroke:#17232a;stroke-width:5}.c{fill:#fffffff2;stroke:#17232a;stroke-width:4}.ko{font-weight:900}.zh,.en{font-weight:700}</style>
</defs>
<rect width="1080" height="1920" fill="#08141d"/><text x="34" y="54" fill="#fff" font-size="28" font-weight="900">FTF-01 #44 · WATER FOR TOMORROW</text>

<!-- 1 HOME WATER SAVING -->
<g filter="url(#sh)"><rect x="24" y="76" width="1032" height="430" rx="24" fill="url(#p1)" stroke="#fff" stroke-width="6"/>
<rect x="54" y="100" width="500" height="116" rx="14" class="c"/><text class="ko" x="74" y="139" font-size="27">작은 물 절약이 큰 변화를 만듭니다.</text><text class="zh" x="74" y="174" font-size="20">小小的节水行动，也能带来巨大的改变。</text><text class="en" x="74" y="205" font-size="19">Small water-saving actions can create big change.</text>
<rect x="74" y="292" width="360" height="160" rx="20" fill="#edf7fb" class="o"/><path d="M150 330h190q55 0 55 48v42" fill="none" stroke="#7b8b92" stroke-width="22" stroke-linecap="round"/><path d="M396 420q0 34-25 34t-25-34" fill="none" stroke="#53bee7" stroke-width="10"/>
<!-- mother --> <ellipse class="skin" cx="640" cy="300" rx="50" ry="58"/><path class="hair" d="M594 299q6-60 47-62q44 3 49 62q-25-22-49-21q-22 1-47 21Z"/><path d="M607 312q10-6 20 0M649 312q10-6 20 0" fill="none" stroke="#222" stroke-width="4"/><path d="M624 340q15 10 31 0" fill="none" stroke="#9b4e4b" stroke-width="4"/><path d="M597 360Q640 384 683 360L714 478H566Z" fill="#f3b9c8" class="o"/>
<!-- boy --> <ellipse class="skin" cx="822" cy="324" rx="42" ry="49"/><path class="hair" d="M785 323q4-51 38-53q37 2 42 53q-21-18-40-18t-40 18Z"/><path d="M796 337q8-5 16 0M833 337q8-5 16 0" fill="none" stroke="#222" stroke-width="4"/><path d="M809 360q13 8 27 0" fill="none" stroke="#964d48" stroke-width="4"/><path d="M791 375Q822 395 854 375L882 478H763Z" fill="#427eb4" class="o"/>
<path class="b" d="M700 112q156-13 293 18q38 10 40 43q2 35-46 40h-68l-30 28v-28H756q-45-2-50-33q-4-28-6-68Z"/><text class="ko" x="866" y="151" text-anchor="middle" font-size="23">짧게 쓰고 꼭 잠가요!</text><text x="866" y="181" text-anchor="middle" font-size="17">用完马上关好！</text><text x="866" y="208" text-anchor="middle" font-size="17">Use less. Turn it off!</text>
<text x="462" y="456" fill="#fff" stroke="#087fbe" stroke-width="8" paint-order="stroke" font-size="52" font-weight="900" font-style="italic">CLICK!</text></g>

<!-- 2 DROUGHT -->
<g filter="url(#sh)"><rect x="24" y="526" width="1032" height="430" rx="24" fill="url(#p2)" stroke="#fff" stroke-width="6"/>
<rect x="54" y="548" width="560" height="112" rx="14" class="c"/><text class="ko" x="74" y="587" font-size="27">물이 사라지면 생명도 위험해집니다.</text><text class="zh" x="74" y="622" font-size="20">如果水消失，生命也会面临危险。</text><text class="en" x="74" y="652" font-size="19">When water disappears, life is in danger.</text>
<circle cx="920" cy="604" r="64" fill="#ffe28c"/><path d="M24 805Q180 740 340 804T670 788T1056 808V956H24Z" fill="#945431"/><g stroke="#5b3322" stroke-width="7"><path d="M76 844l90-42 84 41 88-50 90 49 88-46 90 48 92-48 98 46 102-42"/><path d="M150 812l-40 56m128-42-48 64m140-50-42 63m132-54-38 63m130-51-40 61m132-52-35 58m132-47-36 57"/></g>
<!-- girl kneeling --> <ellipse class="skin" cx="508" cy="744" rx="46" ry="54"/><path class="hair" d="M466 743q4-56 43-58q42 3 47 58q-24-20-46-19q-22 1-44 19Z"/><path d="M480 758q9-5 17 0M521 758q9-5 17 0" fill="none" stroke="#222" stroke-width="4"/><path d="M495 785q13 6 27-1" fill="none" stroke="#8c4a45" stroke-width="4"/><path d="M474 798Q508 817 545 798L592 916H434Z" fill="#7d8996" class="o"/><path d="M458 885q-48 27-80 47M565 883q50 26 84 47" fill="none" stroke="#7d8996" stroke-width="26" stroke-linecap="round"/>
<!-- dead fish, dry crop --> <path d="M772 844q50-31 88 0q-38 31-88 0Zm87 0 42-28v56Z" fill="#c5b39b" class="o"/><circle cx="800" cy="837" r="5" fill="#222"/><g stroke="#5b3b22" stroke-width="7"><path d="M112 700v126m0-76-31-36m31 49 32-38M204 696v130m0-79-32-36m32 50 34-40"/></g>
<path class="b" d="M627 677q170-14 322 16q45 10 47 47q1 37-51 42h-77l-31 29 1-29H701q-49-2-55-34q-5-30-19-71Z"/><text class="ko" x="810" y="718" text-anchor="middle" font-size="23">강이 말라가고 있어요…</text><text x="810" y="750" text-anchor="middle" font-size="17">河流正在干涸…</text><text x="810" y="778" text-anchor="middle" font-size="17">The river is drying up…</text><text x="88" y="919" fill="#fff" stroke="#c24e1e" stroke-width="8" paint-order="stroke" font-size="54" font-style="italic" font-weight="900">DRY…</text></g>

<!-- 3 PURIFY & REUSE -->
<g filter="url(#sh)"><rect x="24" y="976" width="1032" height="430" rx="24" fill="url(#p3)" stroke="#fff" stroke-width="6"/>
<rect x="54" y="998" width="660" height="112" rx="14" class="c"/><text class="ko" x="74" y="1037" font-size="26">빗물과 생활하수를 정화해 다시 사용합니다.</text><text class="zh" x="74" y="1072" font-size="20">把雨水和生活污水净化后再次利用。</text><text class="en" x="74" y="1102" font-size="19">Rainwater and household wastewater are purified and reused.</text>
<g fill="#e4edf0" stroke="#31464e" stroke-width="5"><rect x="82" y="1140" width="170" height="218" rx="18"/><rect x="320" y="1108" width="188" height="250" rx="18"/><rect x="578" y="1150" width="160" height="208" rx="18"/></g><path d="M168 1140v-48h247v-44h250v102" fill="none" stroke="#5a8693" stroke-width="20"/><g fill="#4dc5ee" stroke="#1b6d84" stroke-width="4"><rect x="120" y="1200" width="92" height="112"/><rect x="365" y="1164" width="98" height="148"/><rect x="615" y="1203" width="88" height="109"/></g>
<!-- technician --> <ellipse class="skin" cx="844" cy="1198" rx="44" ry="51"/><path d="M803 1196q8-54 42-55q39 2 44 55Z" fill="#f4f6f3" class="o"/><path d="M811 1228Q844 1247 878 1228L905 1367H782Z" fill="#28718d" class="o"/><text x="844" y="1312" text-anchor="middle" fill="#fff" font-size="21" font-weight="900">WATER REUSE</text><path d="M804 1313q-53-3-94-34" fill="none" stroke="#28718d" stroke-width="25" stroke-linecap="round"/>
<path class="b" d="M665 1098q181-16 326 17q43 10 45 45q1 37-49 41h-73l-30 29v-29H742q-47-2-53-34q-5-29-24-69Z"/><text class="ko" x="846" y="1139" text-anchor="middle" font-size="22">정화된 물은 다시 쓸 수 있어요!</text><text x="846" y="1170" text-anchor="middle" font-size="17">净化后的水可以再利用！</text><text x="846" y="1197" text-anchor="middle" font-size="17">Cleaned water can be used again!</text><text x="96" y="1372" fill="#fff" stroke="#168bbd" stroke-width="8" paint-order="stroke" font-size="46" font-weight="900" font-style="italic">PURIFY! REUSE!</text></g>

<!-- 4 RESTORED CITY -->
<g filter="url(#sh)"><rect x="24" y="1426" width="1032" height="466" rx="24" fill="url(#p4)" stroke="#fff" stroke-width="6"/>
<rect x="54" y="1448" width="688" height="110" rx="14" class="c"/><text class="ko" x="74" y="1487" font-size="26">깨끗한 물이 돌아오면 지구는 다시 푸르게 빛납니다.</text><text class="zh" x="74" y="1522" font-size="20">当清洁的水回归，地球将再次焕发绿色光芒。</text><text class="en" x="74" y="1552" font-size="19">When clean water returns, Earth shines green again.</text>
<circle cx="916" cy="1490" r="56" fill="#fff1a5"/><g fill="#e9f1ef" stroke="#35515a" stroke-width="4"><rect x="110" y="1580" width="110" height="190"/><rect x="255" y="1548" width="126" height="222"/><rect x="424" y="1570" width="118" height="200"/><rect x="588" y="1534" width="136" height="236"/></g><g fill="#60b66c"><rect x="124" y="1608" width="82" height="20"/><rect x="270" y="1576" width="96" height="20"/><rect x="438" y="1597" width="90" height="20"/><rect x="603" y="1563" width="106" height="20"/></g>
<path d="M24 1742Q210 1682 390 1725T745 1708T1056 1730V1892H24Z" fill="#4ab9e8"/><path d="M55 1777q196-42 392-7t405-10" fill="none" stroke="#dafbff" stroke-width="10" opacity=".85"/>
<!-- birds --> <g fill="none" stroke="#273b42" stroke-width="4"><path d="M192 1680q16-18 32 0q16-18 32 0M312 1650q14-15 28 0q14-15 28 0"/></g>
<!-- family foreground --> <ellipse class="skin" cx="760" cy="1712" rx="43" ry="50"/><path class="hair" d="M721 1711q5-51 40-53q39 2 44 53q-22-18-42-18t-42 18Z"/><path d="M730 1740Q760 1758 791 1740L816 1870H699Z" fill="#efb7c6" class="o"/><ellipse class="skin" cx="900" cy="1732" rx="38" ry="45"/><path class="hair" d="M865 1730q4-46 36-48q35 2 39 48q-20-16-38-16t-37 16Z"/><path d="M873 1757Q900 1773 928 1757L950 1870H849Z" fill="#437fb2" class="o"/>
<path d="M895 1800l-118-58" fill="none" stroke="#437fb2" stroke-width="18" stroke-linecap="round"/><circle cx="762" cy="1742" r="8" fill="#fff"/><circle cx="900" cy="1760" r="8" fill="#fff"/>
<path class="b" d="M665 1585q180-16 322 17q43 10 45 45q2 36-49 41h-74l-29 29v-29H741q-47-2-52-34q-5-29-24-69Z"/><text class="ko" x="846" y="1626" text-anchor="middle" font-size="22">와! 강이 다시 살아났어요!</text><text x="846" y="1657" text-anchor="middle" font-size="17">哇！河流又恢复生机了！</text><text x="846" y="1684" text-anchor="middle" font-size="17">Wow! The river is alive again!</text>
<text x="78" y="1854" fill="#fff" stroke="#0a7f9f" stroke-width="8" paint-order="stroke" font-size="44" font-weight="900" font-style="italic">CLEAN WATER! BRIGHTER TOMORROW!</text></g>
</svg>