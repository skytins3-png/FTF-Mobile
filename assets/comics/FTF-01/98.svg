<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#80d6ff"/><stop offset="1" stop-color="#e8f9ff"/></linearGradient>
 <linearGradient id="seaA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17a8d0"/><stop offset="1" stop-color="#04547f"/></linearGradient>
 <linearGradient id="deepA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#148ab5"/><stop offset="1" stop-color="#022f56"/></linearGradient>
 <linearGradient id="sunA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd26c"/><stop offset=".5" stop-color="#f38a64"/><stop offset="1" stop-color="#55436f"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <style>
 .panel{stroke:#071722;stroke-width:8}.cap{font-family:'Noto Sans KR','Noto Sans CJK SC',Arial,sans-serif;font-weight:700}.ko{font-size:22px}.zh{font-size:18px}.en{font-size:17px}.box{fill:#fffdf7;stroke:#12212c;stroke-width:4}.bubble{fill:#fff;stroke:#101820;stroke-width:4}.line{stroke:#101820;stroke-width:4;stroke-linejoin:round}.skin{fill:#efbd9c}.skin2{fill:#d5a07d}.hair{fill:#1d242b}.hair2{fill:#493229}.ftf{fill:#155f92}.sfx{font-family:Arial Black,sans-serif;font-weight:900;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.tag{font-family:Arial Black,sans-serif;font-weight:900}.reef{stroke:#cb6e5c;stroke-width:7;stroke-linecap:round;fill:none}.reef2{stroke:#f0a24a;stroke-width:6;stroke-linecap:round;fill:none}
 </style>
</defs>
<rect width="1536" height="1024" fill="#06131c"/>
<rect width="1536" height="66" fill="#0b3659"/>
<text x="20" y="44" class="tag" font-size="32" fill="#fff">FTF-01  #98</text>
<text x="250" y="42" class="cap" font-size="28" fill="#fff">함께 지키는 바다, 더 멀리까지 · 一起守护海洋，走向更远 · A CLEANER OCEAN, FURTHER TOGETHER</text>
<text x="1510" y="42" text-anchor="end" class="cap" font-size="16" fill="#d8f7ff">지금의 작은 행동이 더 먼 바다까지 이어집니다.</text>

<!-- PANEL 1: research vessel reaches a new restoration zone -->
<g transform="translate(14,80)">
 <rect class="panel" width="748" height="424" rx="8" fill="url(#skyA)"/>
 <path d="M0 270q90-35 180 0t180 0 180 0 208 0v154H0z" fill="#188cb6"/>
 <path d="M0 280q90-22 180 0t180 0 180 0 208 0" fill="none" stroke="#b6f3ff" stroke-width="7" opacity=".85"/>
 <path d="M515 90l60 78H455z" fill="#577481"/><path d="M551 68l20 25h-39z" fill="#f3f6f7"/>
 <path d="M25 210h450l60 118H0z" fill="#eef4f6" class="line"/>
 <rect x="78" y="126" width="230" height="84" rx="8" fill="#dce8ed" class="line"/><rect x="108" y="146" width="63" height="39" fill="#75c9df" class="line"/><rect x="188" y="146" width="63" height="39" fill="#75c9df" class="line"/>
 <g transform="translate(70,195)" filter="url(#shadow)"><path d="M50 100Q20 132 22 210h124q3-76-38-109z" class="ftf line"/><circle cx="86" cy="69" r="46" class="skin line"/><path d="M43 70q5-48 44-50 44 2 47 52-23-16-43-28-16 17-46 26z" class="hair2 line"/><path d="M48 36q33-25 78-2l-7-24q-35-20-65 0z" fill="#195f8e" class="line"/><text x="87" y="27" text-anchor="middle" class="tag" font-size="13" fill="#fff">FTF</text><ellipse cx="72" cy="73" rx="6" ry="8" fill="#17212a"/><ellipse cx="103" cy="73" rx="6" ry="8" fill="#17212a"/><path d="M76 94q13 9 27-1" fill="none" stroke="#9b514a" stroke-width="4"/><path d="M112 142l130-50 10 26-124 68" class="skin line"/></g>
 <g transform="translate(265,190)" filter="url(#shadow)"><path d="M45 93Q16 120 19 190h112q3-67-34-96z" fill="#152532" class="line"/><circle cx="77" cy="61" r="41" class="skin2 line"/><path d="M38 62q5-43 39-44 39 2 41 45-21-14-38-25-15 16-41 24z" class="hair line"/><path d="M55 126l120 25-7 27-121-13" class="skin2 line"/><rect x="122" y="126" width="55" height="39" rx="6" fill="#253947" class="line"/><circle cx="150" cy="145" r="11" fill="#81d4ef"/></g>
 <g transform="translate(430,202)" filter="url(#shadow)"><path d="M47 88Q18 114 21 182h108q3-66-33-93z" fill="#e8eef1" class="line"/><circle cx="78" cy="58" r="39" class="skin line"/><path d="M40 59q5-41 38-42 37 2 39 43-19-13-36-23-14 15-40 22z" class="hair2 line"/><path d="M49 29q31-21 62 0l-4-18q-29-17-54 0z" fill="#f0f4f6" class="line"/><text x="80" y="24" text-anchor="middle" class="tag" font-size="11" fill="#155f92">FTF</text><rect x="104" y="115" width="86" height="56" rx="7" fill="#222f38" class="line"/><rect x="113" y="124" width="68" height="38" fill="#78cbdd"/></g>
 <rect x="18" y="16" width="350" height="112" rx="8" class="box"/><text x="31" y="44" class="cap ko">복원된 바다는 끝이 아니라, 다음 바다의 시작입니다.</text><text x="31" y="72" class="cap zh">修复的海洋不是终点，而是下一片海的起点。</text><text x="31" y="99" class="cap en">A restored sea is the beginning of the next one.</text>
 <rect x="395" y="18" width="327" height="109" rx="52" class="bubble"/><text x="559" y="48" text-anchor="middle" class="cap ko">저기 봐요! 새 복원 구역이에요!</text><text x="559" y="76" text-anchor="middle" class="cap zh">看！新的修复海域到了！</text><text x="559" y="102" text-anchor="middle" class="cap en">Look! We reached the next restoration zone!</text>
 <text x="488" y="395" class="sfx" font-size="46" fill="#42c7ff">FURTHER!</text>
</g>

<!-- PANEL 2: divers maintain coral nursery and sensors -->
<g transform="translate(774,80)">
 <rect class="panel" width="748" height="424" rx="8" fill="url(#deepA)"/>
 <g opacity=".28" fill="#d7faff"><circle cx="80" cy="60" r="8"/><circle cx="115" cy="42" r="5"/><circle cx="357" cy="74" r="7"/><circle cx="613" cy="56" r="9"/><circle cx="666" cy="96" r="5"/></g>
 <path d="M0 350q100-62 210-21t195-5 343 12v88H0z" fill="#244c55"/>
