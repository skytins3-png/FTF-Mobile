<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #60 — 바다를 묶은 폐그물을 끊다</title>
<desc id="d">Four-panel cinematic manga-style scene: a marine research team maps a ghost-net hotspot, divers find a sea turtle trapped in abandoned fishing gear, carefully free the turtle and remove plastic waste, and the restored reef fills again with fish and life. Korean, Chinese and English narration, speech bubbles and visual sound effects.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#88d9f4"/><stop offset=".62" stop-color="#d7f1f6"/><stop offset="1" stop-color="#ffc46b"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#19aed5"/><stop offset=".5" stop-color="#08779f"/><stop offset="1" stop-color="#033950"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08769d"/><stop offset="1" stop-color="#021f31"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffce5"/><stop offset=".7" stop-color="#ffd570"/><stop offset="1" stop-color="#ef9a4f"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".42"/></filter>
 <style>.panel{stroke:#0a1720;stroke-width:10}.box{fill:#fffdf5;stroke:#10212a;stroke-width:4}.bubble{fill:#fff;stroke:#10212a;stroke-width:4}.ko{font:700 25px 'Noto Sans KR',Arial,sans-serif;fill:#101820}.zh{font:600 19px Arial,sans-serif;fill:#17435d}.en{font:600 18px Arial,sans-serif;fill:#132935}.sfx{font:900 44px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.skin{fill:#e4a17a;stroke:#60372c;stroke-width:2}.hair{fill:#18242d}.suit{fill:#123e58;stroke:#082536;stroke-width:4}.reefA{fill:#ef6d63;stroke:#762f31;stroke-width:3}.reefB{fill:#f0c24e;stroke:#715820;stroke-width:3}.reefC{fill:#a37ae7;stroke:#4b3972;stroke-width:3}.reefD{fill:#5bc391;stroke:#24674b;stroke-width:3}.net{stroke:#8aa4ac;stroke-width:5;fill:none}.rope{stroke:#a7885c;stroke-width:8;fill:none;stroke-linecap:round}</style>
</defs>
<!-- 1. HOTSPOT MAPPING -->
<g><rect class="panel" x="4" y="4" width="760" height="500" fill="url(#sky)"/><circle cx="690" cy="76" r="50" fill="url(#sun)"/><path d="M4 335Q150 300 300 342T760 333V500H4Z" fill="#087ca3"/><path d="M4 390Q170 354 342 391T760 373V500H4Z" fill="#075c7d" opacity=".75"/>
<g transform="translate(405 254)" filter="url(#shadow)"><path d="M-120 94h330l-35 67H-82Z" fill="#eef5f5" stroke="#173744" stroke-width="5"/><path d="M16 7h120v90H16Z" fill="#fff4d7" stroke="#173744" stroke-width="4"/><path d="M136 48h58l28 48h-86Z" fill="#c7eaf2" stroke="#173744" stroke-width="4"/><rect x="-60" y="115" width="120" height="16" fill="#f1bd38"/></g>
<g transform="translate(90 212)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 48Q24 3 59 2q42 2 42 53q-25-18-44-14q-21 2-39 7"/><path d="M6 104q51-24 102 7l18 132H-5Z" fill="#d8677c" stroke="#17313b" stroke-width="4"/><path d="M99 132q78 6 129 45" stroke="#e4a17a" stroke-width="16" fill="none" stroke-linecap="round"/></g>
<g transform="translate(244 218)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 48Q25 4 59 2q40 2 41 52q-24-17-43-14q-21 1-39 8"/><path class="suit" d="M7 104q50-23 100 6l19 133H-4Z"/><rect x="17" y="132" width="107" height="74" rx="8" fill="#d9edf3" stroke="#163846" stroke-width="4"/><path d="M29 186l22-21 18 10 22-29 18 13" fill="none" stroke="#d84b47" stroke-width="5"/></g>
<g transform="translate(470 334)"><rect width="216" height="108" rx="9" fill="#eaf1e2" stroke="#173846" stroke-width="5"/><path d="M22 76q38-44 66-3q28-40 52-2q28-39 50-2" fill="none" stroke="#4a9f6d" stroke-width="12"/><ellipse cx="116" cy="53" rx="53" ry="23" fill="none" stroke="#e34d4a" stroke-width="7"/><text x="88" y="31" font-size="17" font-weight="800" fill="#d83f3e">DEBRIS</text></g>
<rect class="box" x="18" y="18" width="500" height="142" rx="8"/><text x="38" y="52" class="ko">수중 카메라에 폐그물과 플라스틱이 몰린 위험 구역이 잡혔어요.</text><text x="38" y="86" class="ko">연구팀은 좌표를 표시하고 즉시 구조 계획을 세웁니다.</text><text x="38" y="117" class="zh">水下监测发现废弃渔网和塑料聚集的危险区域。</text><text x="38" y="147" class="en">The team maps a dangerous ghost-net and plastic hotspot.</text>
<path class="bubble" d="M508 43h226q16 0 16 16v105q0 16-16 16H628l-29 33 6-33H508q-16 0-16-16V59q0-16 16-16Z"/><text x="527" y="81" class="ko">좌표 확인! 거북이가 있는지 먼저 살펴봐요.</text><text x="527" y="115" class="zh">坐标确认！先检查有没有海龟。</text><text x="527" y="149" class="en">Coordinates set—check for turtles first!</text><text x="43" y="472" class="sfx" fill="#43e2ff">FIND! MAP! RESPOND!</text></g>
<!-- 2. TURTLE TRAPPED -->
<g transform="translate(768 0)"><rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/><g opacity=".22" stroke="#eaffff" stroke-width="5"><path d="M95 0L15 290M245 0L150 306M405 0L290 304M580 0L450 300M738 0L620 300"/></g><path d="M4 402Q130 350 280 386T760 360V500H4Z" fill="#8a785f"/>
<g transform="translate(325 210)" filter="url(#shadow)"><ellipse cx="110" cy="92" rx="86" ry="59" fill="#8eb270" stroke="#354f35" stroke-width="6"/><path d="M52 74q58-55 117 2q-18 60-58 70q-45-12-59-72" fill="#a8c987" stroke="#3d583c" stroke-width="4"/><circle cx="204" cy="83" r="35" fill="#a8c987" stroke="#3d583c" stroke-width="5"/><circle cx="214" cy="75" r="5" fill="#101820"/><path d="M44 96l-63 35 55 18M141 140l40 49 26-53" fill="#9cc07c" stroke="#3d583c" stroke-width="5"/></g>
<g class="net" opacity=".92"><path d="M260 183l274 241M303 150l270 236M230 235l286 217M245 156l-36 302M300 136l-30 338M365 130l-24 350M432 142l-20 330M500 168l-12 286M210 210l370 15M215 265l360 14M218 320l352 13M222 376l337 12"/></g><path class="rope" d="M220 183Q382 120 574 195Q663 230 728 187"/><path d="M535 340q55 30 95 90" stroke="#e8e9dd" stroke-width="10" fill="none" opacity=".8"/>
<rect class="box" x="18" y="18" width="492" height="138" rx="8"/><text x="38" y="52" class="ko">버려진 그물이 산호를 덮고, 어린 거북이의 지느러미까지 감았습니다.</text><text x="38" y="86" class="ko">조금만 더 조이면 숨쉬기도, 헤엄치기도 어려워집니다.</text><text x="38" y="116" class="zh">废弃渔网缠住珊瑚，也勒住了小海龟的鳍。</text><text x="38" y="146" class="en">A ghost net traps the reef—and a young sea turtle.</text>
<path class="bubble" d="M530 44h205q16 0 16 16v104q0 16-16 16H636l-27 31 5-31H530q-16 0-16-16V60q0-16 16-16Z"/><text x="548" y="82" class="ko">도와줘… 그물에 걸렸어!</text><text x="548" y="116" class="zh">救救我……我被网缠住了！</text><text x="548" y="149" class="en">Help… I'm trapped!</text><text x="427" y="468" class="sfx" fill="#ff4b48">STOP! GHOST NET!</text></g>
<!-- 3. RESCUE AND CLEANUP -->
<g transform="translate(0 512)"><rect class="panel" x="4" y="4" width="760" height="508" fill="url(#deep)"/><path d="M4 405Q150 355 300 391T760 365V508H4Z" fill="#8b765d"/>
<g transform="translate(92 215)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="44" width="82" height="31" rx="14" fill="#c9f5ff" opacity=".9" stroke="#163949" stroke-width="4"/><path d="M10 101q48-22 95 7l18 130H0Z" fill="#d65e76" stroke="#17313b" stroke-width="4"/><path d="M101 130q77 0 132 48" stroke="#e4a17a" stroke-width="16" fill="none" stroke-linecap="round"/></g>
<g transform="translate(305 205)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="44" width="82" height="31" rx="14" fill="#c9f5ff" opacity=".9" stroke="#163949" stroke-width="4"/><path class="suit" d="M10 101q48-22 95 7l18 130H0Z"/><path d="M9 135q-72 6-119 49" stroke="#e4a17a" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M98 132q67 12 115 55" stroke="#e4a17a" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M201 171l27-28M204 172l36 7" stroke="#d9e7e8" stroke-width="7"/></g>
<g transform="translate(470 250)"><ellipse cx="95" cy="78" rx="70" ry="48" fill="#8fb471" stroke="#355038" stroke-width="5"/><circle cx="166" cy="72" r="28" fill="#a9c987" stroke="#3b583c" stroke-width="4"/><circle cx="175" cy="66" r="4" fill="#101820"/><path d="M41 84l-51 29 45 13M119 119l33 39 22-43" fill="#9bc07d" stroke="#3d583c" stroke-width="4"/></g><path class="net" d="M432 244Q535 205 662 250M452 218l156 171M417 274l214 108M459 204l-19 216M518 203l-15 224M578 220l-11 204" opacity=".7"/><path d="M430 300q60 20 115 60" stroke="#efefea" stroke-width="9" fill="none"/><path d="M555 374q45 12 92 4" stroke="#efefea" stroke-width="9" fill="none"/>
<rect class="box" x="18" y="18" width="500" height="138" rx="8"/><text x="38" y="52" class="ko">잠수사들이 거북이 몸에서 그물을 천천히 잘라내고 폐기물을 회수합니다.</text><text x="38" y="86" class="ko">산호를 건드리지 않도록 한 조각씩 안전하게 꺼냅니다.</text><text x="38" y="116" class="zh">潜水员小心剪开渔网，并逐块清除海洋垃圾。</text><text x="38" y="146" class="en">Divers cut the net carefully and remove debris piece by piece.</text><path class="bubble" d="M516 41h220q16 0 16 16v103q0 16-16 16H628l-28 31 5-31H516q-16 0-16-16V57q0-16 16-16Z"/><text x="535" y="80" class="ko">천천히… 좋아! 이제 자유야.</text><text x="535" y="114" class="zh">慢一点……好了！你自由了。</text><text x="535" y="147" class="en">Easy… good! You're free now.</text><text x="44" y="474" class="sfx" fill="#ffe35a">CUT! CLEAN! RESCUE!</text></g>
<!-- 4. LIFE RETURNS -->
<g transform="translate(768 512)"><rect class="panel" x="4" y="4" width="764" height="508" fill="#0879a1"/><g opacity=".28" stroke="#f2ffff" stroke-width="5"><path d="M100 0L20 310M250 0L150 318M420 0L300 315M590 0L470 305M750 0L640 300"/></g><path d="M4 402Q150 340 302 387T760 355V508H4Z" fill="#b09973"/>
<g class="reefA"><path d="M28 474q10-90 30-7q14-70 32 3q16-62 33 5q-46 14-95-1Z"/></g><g class="reefB"><path d="M155 475q10-82 28-6q13-62 29 3q14-57 30 4q-42 13-87-1Z"/></g><g class="reefC"><path d="M606 473q10-85 29-6q13-64 31 3q15-59 31 4q-43 14-91-1Z"/></g><g class="reefD"><path d="M485 475q9-80 27-6q12-60 28 2q14-54 29 4q-40 12-84 0Z"/></g>
<g transform="translate(285 214)" filter="url(#shadow)"><ellipse cx="100" cy="76" rx="78" ry="52" fill="#93b875" stroke="#355038" stroke-width="5"/><circle cx="181" cy="70" r="31" fill="#abc98b" stroke="#3b583c" stroke-width="4"/><circle cx="191" cy="64" r="4" fill="#101820"/><path d="M44 85l-60 32 51 16M124 119l38 47 25-47" fill="#9fc383" stroke="#3d583c" stroke-width="4"/></g>
<g fill="#ffd34f" stroke="#8b6f1e" stroke-width="2"><path d="M130 246q25-18 48 0q-24 20-48 0"/><path d="M185 315q27-19 52 0q-26 21-52 0"/><path d="M510 245q25-18 49 0q-25 20-49 0"/><path d="M575 316q28-18 53 0q-26 22-53 0"/></g><g fill="#5bd3de" stroke="#1c6976" stroke-width="2"><path d="M110 350q24-16 46 0q-23 18-46 0"/><path d="M530 373q25-17 48 0q-24 19-48 0"/><path d="M655 225q25-17 48 0q-24 19-48 0"/></g>
<g transform="translate(510 300)" filter="url(#shadow)"><path d="M-40 60h210l-25 50H-20Z" fill="#eef5f5" stroke="#173744" stroke-width="5"/><path d="M28 2h80v60H28Z" fill="#fff4d7" stroke="#173744" stroke-width="4"/></g>
<rect class="box" x="18" y="18" width="500" height="139" rx="8"/><text x="38" y="52" class="ko">폐그물이 사라진 자리로 거북이와 물고기가 다시 돌아옵니다.</text><text x="38" y="86" class="ko">작은 구조 한 번이 산호초 전체의 숨길을 다시 열었습니다.</text><text x="38" y="116" class="zh">废弃渔网被清除后，海龟和鱼群重新回到珊瑚礁。</text><text x="38" y="146" class="en">With the ghost net gone, turtles and fish return to the reef.</text><path class="bubble" d="M522 42h214q16 0 16 16v104q0 16-16 16H632l-28 32 5-32H522q-16 0-16-16V58q0-16 16-16Z"/><text x="541" y="81" class="ko">다시 헤엄친다! 우리가 지킨 길이야.</text><text x="541" y="115" class="zh">它又游起来了！这是我们守住的路。</text><text x="541" y="148" class="en">It's swimming again—we kept this path alive!</text><text x="52" y="475" class="sfx" fill="#76f5ff">LIFE RETURNS! CLEAN OCEAN!</text></g>
</svg>