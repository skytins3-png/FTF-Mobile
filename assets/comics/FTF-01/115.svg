<rect x="448" y="548" width="275" height="119" rx="28" fill="#fff" stroke="#111" stroke-width="4"/><text x="586" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="586">보여? 여기가 다시 아기 물고기들의 집이야!</tspan><tspan x="586" dy="24" font-size="14">看！这里又成了幼鱼的家！</tspan><tspan x="586" dy="21" font-size="13">Look! The nursery is alive again!</tspan></text><text x="52" y="962" fill="#fff" stroke="#07516c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="54" font-weight="900" font-style="italic">LIFE RETURNS!</text><text x="425" y="957" fill="#8dffb0" stroke="#073d35" stroke-width="5" paint-order="stroke" font-family="Arial" font-size="35" font-weight="900">ROOTS = SHELTER</text></g>

