<rect x="796" y="850" width="492" height="116" rx="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="1042" y="881" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1042">맹그로브는 파도를 막고, 탄소를 품고, 생명의 길을 만든다.</tspan><tspan x="1042" dy="26" font-size="14">红树林挡浪、储碳，也为生命打开通道。</tspan><tspan x="1042" dy="22" font-size="14">Mangroves buffer waves, store carbon, and reconnect life.</tspan></text>
<rect x="1267" y="551" width="236" height="118" rx="28" fill="#fff5d8" stroke="#111" stroke-width="4"/><text x="1385" y="582" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1385">다음 구역도 이어 가자!</tspan><tspan x="1385" dy="24" font-size="14">继续连接下一片海岸！</tspan><tspan x="1385" dy="21" font-size="13">On to the next shoreline!</tspan></text><text x="1262" y="951" fill="#fff" stroke="#07516c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900" font-style="italic">ROOT TODAY · PROTECT TOMORROW</text></g>

