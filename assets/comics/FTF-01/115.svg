<rect x="32" y="104" width="428" height="126" rx="22" fill="#fff" stroke="#111" stroke-width="4"/><text x="246" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="19" font-weight="900"><tspan x="246">B-18 해안 도착! 맹그로브가 끊겨 있어.</tspan><tspan x="246" dy="25">파도가 흙을 깎고 어린 물고기 길도 사라졌어.</tspan><tspan x="246" dy="22" font-size="14">抵达 B-18！红树林带出现缺口。</tspan><tspan x="246" dy="20" font-size="14">B-18: the mangrove belt is broken and eroding.</tspan></text>
<rect x="467" y="104" width="270" height="105" rx="22" fill="#fff5d8" stroke="#111" stroke-width="4"/><text x="602" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="602">이번엔 바다와 육지를 함께 지킨다!</tspan><tspan x="602" dy="24" font-size="14">一起守护海洋与陆地！</tspan><tspan x="602" dy="21" font-size="13">Protect sea and shore together!</tspan></text><text x="45" y="482" fill="#fff" stroke="#084461" stroke-width="5" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900" font-style="italic">SURVEY!  PLAN!  RESTORE!</text></g>

