<text x="900" y="49" fill="#a8efff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="800">B-18 MANGROVE SHIELD · 红树林蓝碳防线 · MANGROVE BLUE-CARBON SHIELD</text>

