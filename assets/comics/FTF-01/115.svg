<rect x="792" y="102" width="422" height="91" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><text x="1003" y="128" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1003">토종 맹그로브 묘목을 조류 방향에 맞춰 심는다.</tspan><tspan x="1003" dy="23" font-size="14">顺着潮流方向种下本地红树林幼苗。</tspan><tspan x="1003" dy="21" font-size="14">Native seedlings are planted with the tidal flow.</tspan></text>
<rect x="1221" y="102" width="275" height="117" rx="27" fill="#fff" stroke="#111" stroke-width="4"/><text x="1358" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1358">뿌리를 단단히! 보호링도 고정!</tspan><tspan x="1358" dy="24" font-size="14">固定根系和保护环！</tspan><tspan x="1358" dy="21" font-size="13">Roots secure. Guards locked!</tspan></text><text x="977" y="477" fill="#fff" stroke="#0b6071" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="48" font-weight="900" font-style="italic">PRESS!  SPLASH!  ROOT!</text></g>

