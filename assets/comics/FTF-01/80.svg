<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07152f"/><stop offset=".55" stop-color="#123f63"/><stop offset="1" stop-color="#0a2438"/></linearGradient>
  <linearGradient id="reef" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c88ad"/><stop offset=".55" stop-color="#075678"/><stop offset="1" stop-color="#052d45"/></linearGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb067"/><stop offset=".42" stop-color="#ffdba0"/><stop offset="1" stop-color="#28718c"/></linearGradient>
  <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eafaff"/><stop offset="1" stop-color="#8dd0e8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".45"/></filter>
  <style>.t{font-family:Arial,'Malgun Gothic','Noto Sans CJK KR',sans-serif}.b{font-weight:900}.panel{stroke:#fff;stroke-width:7}.box{fill:#fffffff4;stroke:#101820;stroke-width:4}.fx{font-weight:1000;font-style:italic;paint-order:stroke;stroke:#032238;stroke-width:6;stroke-linejoin:round}.small{font-size:17px}</style>
</defs>
<rect width="1536" height="1024" fill="#03111c"/>
<g class="t">
<rect width="1536" height="72" fill="#06121f"/>
<text x="24" y="47" font-size="38" class="b" fill="#fff">FTF-01 #80 · 산호가 별처럼 피어난 밤</text>
<text x="1034" y="31" font-size="19" class="b" fill="#7feaff">THE NIGHT THE REEF BLOOMED</text>
<text x="1034" y="56" font-size="18" fill="#fff">珊瑚如星光绽放的夜晚</text>

<!-- PANEL 1: night watch -->
<g transform="translate(8 80)">
 <rect width="752" height="455" rx="10" fill="url(#sky)" class="panel"/>
 <circle cx="640" cy="72" r="42" fill="#eef7ff"/><g fill="#dff5ff"><circle cx="563" cy="47" r="3"/><circle cx="687" cy="121" r="3"/><circle cx="525" cy="103" r="2"/></g>
 <path d="M0 332 Q170 297 365 329 T752 313 V455 H0Z" fill="#08627e"/><path d="M0 350 Q175 317 364 346 T752 331" fill="none" stroke="#8ce9f6" stroke-width="5" opacity=".55"/>
