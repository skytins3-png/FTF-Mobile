<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #56 — 산호초를 다시 숨 쉬게 하다</title>
<desc id="d">Four-panel cinematic manga scene continuing FTF-01: a coastal family discovers a living coral reef, warming water and pollution bleach the reef, divers raise coral fragments in a nursery and transplant them, and the restored reef shelters turtles and fish. Korean, Chinese and English captions, speech bubbles and sound effects are integrated into illustrated characters and environments.</desc>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38d7ee"/><stop offset=".45" stop-color="#078ab5"/><stop offset="1" stop-color="#043b67"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42bace"/><stop offset=".6" stop-color="#176e8e"/><stop offset="1" stop-color="#3b4a5b"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7c76a"/><stop offset=".45" stop-color="#38b8d4"/><stop offset="1" stop-color="#07527b"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".32"/></filter>
 <style>.p{stroke:#101820;stroke-width:10}.box{fill:#fffdf2;stroke:#101820;stroke-width:4}.bub{fill:#fff;stroke:#111;stroke-width:4}.ko{font:700 26px sans-serif;fill:#111923}.zh{font:600 20px sans-serif;fill:#12415e}.en{font:600 19px sans-serif;fill:#17222c}.sfx{font:900 40px sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.ln{stroke:#26333c;stroke-width:5;stroke-linecap:round;fill:none}</style>
</defs>
<!-- 1 DISCOVERY -->
<g><rect class="p" x="4" y="4" width="760" height="500" fill="url(#sea)"/>
<g opacity=".3" stroke="#d9fbff" stroke-width="5"><path d="M80 0L20 300M220 0L120 310M390 0L260 320M560 0L410 315M730 0L565 315"/></g>
<path d="M4 405Q190 350 365 402T760 382V500H4Z" fill="#c7ad78"/>
<g fill="#ff7f66" stroke="#6e3730" stroke-width="3"><path d="M90 430q14-95 42-8q16-78 35 1q20-70 38 5q-45 18-115 2Z"/><path d="M570 445q18-105 38-6q20-75 39 5q19-72 40 3q-54 19-117-2Z"/></g>
<g fill="#ffd45c" stroke="#563d1d" stroke-width="2"><ellipse cx="250" cy="390" rx="35" ry="16"/><path d="M216 390l-34-22v44Z"/><ellipse cx="470" cy="410" rx="30" ry="14"/><path d="M441 410l-30-18v36Z"/></g>
<g transform="translate(300 180)" filter="url(#shadow)"><ellipse cx="62" cy="50" rx="38" ry="43" fill="#efb18d" stroke="#5b3528" stroke-width="2"/><path d="M23 46q8-39 42-42q37 2 39 44q-22-16-40-15q-18 0-41 13" fill="#432c29"/><rect x="21" y="45" width="82" height="30" rx="14" fill="#c6f5ff" opacity=".82" stroke="#173949" stroke-width="4"/><path d="M18 94q45-18 84 7l18 115H4Z" fill="#ef6f7d" stroke="#22333e" stroke-width="4"/></g>
<g transform="translate(475 170)" filter="url(#shadow)"><ellipse cx="62" cy="54" rx="40" ry="45" fill="#dda07a" stroke="#5b3528" stroke-width="2"/><path d="M21 51q9-42 44-45q40 2 40 48q-24-18-42-16q-19 0-42 13" fill="#26313c"/><rect x="21" y="48" width="84" height="31" rx="14" fill="#c9f5ff" opacity=".82" stroke="#173949" stroke-width="4"/><path d="M18 101q49-20 91 8l17 120H1Z" fill="#24445f" stroke="#1d2f3b" stroke-width="4"/></g>
<rect class="box" x="18" y="18" width="430" height="132" rx="8"/><text x="36" y="53" class="ko">잘피 초원 너머에는 산호 도시가 있어요.</text><text x="36" y="87" class="ko">수많은 바다 생물이 여기서 살아갑니다.</text><text x="36" y="117" class="zh">海草床之外，还有一座珊瑚城市。</text><text x="36" y="145" class="en">Beyond the seagrass lies a living coral city.</text>
<path class="bub" d="M470 22h265q16 0 16 16v110q0 16-16 16H620l-28 32 4-32H470q-16 0-16-16V38q0-16 16-16Z"/><text x="491" y="61" class="ko">와! 산호가 진짜 살아 있어!</text><text x="491" y="95" class="zh">哇！珊瑚真的活着！</text><text x="491" y="129" class="en">Wow! The reef is alive!</text><text x="65" y="468" class="sfx" fill="#f2c233">DISCOVER! REEF LIFE!</text></g>
<!-- 2 BLEACHING -->
<g transform="translate(768 0)"><rect class="p" x="4" y="4" width="764" height="500" fill="url(#warm)"/>
<g opacity=".18" fill="#ff6a42"><circle cx="120" cy="90" r="70"/><circle cx="330" cy="70" r="55"/><circle cx="620" cy="110" r="80"/></g>
<path d="M4 405Q180 365 360 402T760 380V500H4Z" fill="#91856d"/>
<g fill="#e8e5dc" stroke="#777" stroke-width="3"><path d="M95 444q12-95 37-8q17-78 36 1q18-71 39 5q-49 19-112 2Z"/><path d="M405 455q13-100 37-10q20-80 39 3q19-70 37 6q-48 18-113 1Z"/></g>
<g fill="#777" opacity=".7"><rect x="260" y="350" width="65" height="24" transform="rotate(18 292 362)"/><rect x="540" y="325" width="52" height="20" transform="rotate(-15 566 335)"/></g>
<g transform="translate(470 240)"><path d="M25 75q60-62 130-4q-18 78-90 84q-48-8-40-80Z" fill="#81745e" stroke="#2b2c28" stroke-width="4"/><ellipse cx="84" cy="79" rx="9" ry="8" fill="#111"/><path d="M153 87q52-18 80 5q-33 20-74 15Z" fill="#81745e" stroke="#2b2c28" stroke-width="4"/></g>
<rect class="box" x="20" y="18" width="520" height="142" rx="8"/><text x="38" y="53" class="ko">하지만 뜨거워진 바다와 오염이 산호를 하얗게 만듭니다.</text><text x="38" y="88" class="ko">집을 잃은 물고기들도 떠나기 시작해요.</text><text x="38" y="119" class="zh">海水升温和污染让珊瑚白化，鱼儿失去家园。</text><text x="38" y="149" class="en">Heat and pollution bleach coral and empty the reef.</text>
<path class="bub" d="M505 175h228q16 0 16 16v92q0 16-16 16H630l-24 31 4-31H505q-16 0-16-16v-92q0-16 16-16Z"/><text x="527" y="214" class="ko">산호가 아파요!</text><text x="527" y="247" class="zh">珊瑚生病了！</text><text x="527" y="279" class="en">The reef is hurting!</text><text x="68" y="470" class="sfx" fill="#ef3a35">HEAT! BLEACH! STOP!</text></g>
<!-- 3 NURSERY + TRANSPLANT -->
<g transform="translate(0 512)"><rect class="p" x="4" y="4" width="760" height="508" fill="url(#sea)"/>
<g opacity=".32" stroke="#d7fbff" stroke-width="5"><path d="M80 0L25 290M220 0L130 300M390 0L270 310M560 0L420 305M730 0L575 310"/></g><path d="M4 365Q190 320 370 368T760 350V508H4Z" fill="#bca274"/>
<g stroke="#41545e" stroke-width="5" fill="none"><path d="M90 270h220v120H90Z"/><path d="M120 270v-65M170 270v-65M220 270v-65M270 270v-65"/></g>
<g fill="#ff806f"><circle cx="120" cy="205" r="18"/><circle cx="170" cy="205" r="17"/><circle cx="220" cy="205" r="19"/><circle cx="270" cy="205" r="16"/></g>
<g transform="translate(350 155)" filter="url(#shadow)"><ellipse cx="60" cy="52" rx="38" ry="43" fill="#e8aa83"/><path d="M20 48q8-39 43-42q37 2 38 44q-23-17-41-15q-18 0-40 13" fill="#26313c"/><rect x="19" y="46" width="82" height="30" rx="14" fill="#c8f5ff" opacity=".82" stroke="#173949" stroke-width="4"/><path d="M17 98q46-18 85 8l19 120H2Z" fill="#274b68" stroke="#1c2e39" stroke-width="4"/><path d="M98 125q70 38 105 95" stroke="#e8aa83" stroke-width="16" fill="none" stroke-linecap="round"/></g>
<g transform="translate(560 170)" filter="url(#shadow)"><ellipse cx="54" cy="48" rx="34" ry="39" fill="#efb18d"/><path d="M20 44q6-36 37-39q34 2 36 41q-20-15-36-14q-16 0-37 12" fill="#4d2d28"/><rect x="19" y="42" width="74" height="28" rx="13" fill="#c8f5ff" opacity=".82" stroke="#173949" stroke-width="4"/><path d="M18 90q39-16 74 7l15 104H5Z" fill="#ef7180" stroke="#20313d" stroke-width="4"/></g>
<rect class="box" x="18" y="18" width="500" height="136" rx="8"/><text x="36" y="53" class="ko">건강한 산호 조각을 바닷속 Nursery에서 키운 뒤</text><text x="36" y="87" class="ko">상처 난 암초에 하나씩 옮겨 심습니다.</text><text x="36" y="118" class="zh">潜水员培育健康珊瑚，再移植回受损礁区。</text><text x="36" y="148" class="en">Divers grow coral fragments, then transplant them.</text>
<path class="bub" d="M520 24h215q16 0 16 16v90q0 16-16 16H636l-22 30 3-30H520q-16 0-16-16V40q0-16 16-16Z"/><text x="541" y="62" class="ko">한 조각씩 되살려요!</text><text x="541" y="96" class="zh">一株一株种回去！</text><text x="541" y="128" class="en">One coral at a time!</text><text x="54" y="476" class="sfx" fill="#0b93d2">GROW! PLANT! RESTORE!</text></g>
<!-- 4 RESTORED REEF -->
<g transform="translate(768 512)"><rect class="p" x="4" y="4" width="764" height="508" fill="url(#sunset)"/>
<g opacity=".28" stroke="#e5ffff" stroke-width="5"><path d="M100 0L30 290M240 0L145 305M390 0L275 315M555 0L420 305M720 0L580 315"/></g><path d="M4 390Q180 340 370 390T760 365V508H4Z" fill="#cbb07a"/>
<g fill="#ff705e" stroke="#6b332e" stroke-width="3"><path d="M70 450q12-100 38-7q16-82 37 2q20-76 41 5q-48 17-116 0Z"/><path d="M250 458q14-108 42-8q18-84 40 3q22-76 41 5q-52 18-123 0Z"/><path d="M560 445q13-100 39-5q17-82 39 2q20-72 39 7q-50 18-117-4Z"/></g>
<g fill="#ffd65f" stroke="#563d1d" stroke-width="2"><ellipse cx="180" cy="310" rx="35" ry="16"/><path d="M146 310l-32-22v44Z"/><ellipse cx="410" cy="330" rx="31" ry="14"/><path d="M380 330l-30-18v36Z"/><ellipse cx="625" cy="290" rx="34" ry="15"/><path d="M592 290l-32-20v40Z"/></g>
<g transform="translate(360 210)"><path d="M25 75q60-62 130-4q-18 78-90 84q-48-8-40-80Z" fill="#7d715a" stroke="#2b2c28" stroke-width="4"/><ellipse cx="84" cy="79" rx="9" ry="8" fill="#111"/><path d="M153 87q52-18 80 5q-33 20-74 15Z" fill="#7d715a" stroke="#2b2c28" stroke-width="4"/><path d="M48 128q-5 49-42 74q47 6 78-45" fill="#7d715a" stroke="#2b2c28" stroke-width="4"/></g>
<rect class="box" x="18" y="18" width="510" height="136" rx="8"/><text x="36" y="53" class="ko">색을 되찾은 산호초에 물고기와 거북이가 돌아옵니다.</text><text x="36" y="87" class="ko">바다의 집을 지키는 일이 우리의 미래를 지켜요.</text><text x="36" y="118" class="zh">珊瑚恢复色彩，鱼群和海龟重新回家。</text><text x="36" y="148" class="en">A restored reef brings marine life home again.</text>
<path class="bub" d="M530 170h210q15 0 15 15v92q0 15-15 15H643l-22 31 3-31H530q-15 0-15-15v-92q0-15 15-15Z"/><text x="551" y="209" class="ko">바다가 다시 숨 쉬어요!</text><text x="551" y="242" class="zh">大海又能呼吸了！</text><text x="551" y="274" class="en">The ocean breathes again!</text><text x="48" y="473" class="sfx" fill="#28b85c">REEF ALIVE! BRIGHTER FUTURE!</text></g>
</svg>