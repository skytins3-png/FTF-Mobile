 <text x="274" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="274">새 원단이 매장에 들어가자, 선택 하나가 하구와 바다까지 이어졌다.</tspan><tspan x="274" dy="24" font-size="14">新面料进入市场后，一次选择一路影响到河口与海洋。</tspan><tspan x="274" dy="22" font-size="13">When the new fabric reaches stores, one choice travels all the way to the sea.</tspan></text>
 <rect x="517" y="551" width="214" height="92" rx="22" fill="#eaffd5" stroke="#111" stroke-width="4"/>
 <text x="624" y="581" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="624">입기 전부터 바다를 지켜.</tspan><tspan x="624" dy="22" font-size="13">穿上之前就保护海洋。</tspan><tspan x="624" dy="20" font-size="12">Protect the sea before you wear it.</tspan></text>
 <text x="42" y="977" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">CHOOSE BETTER!  SHED LESS!  OCEAN WINS!</text>
