 <text x="631" y="138" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="631">덜 빠지는 원단으로!</tspan><tspan x="631" dy="22" font-size="13">改用低脱纤面料！</tspan><tspan x="631" dy="20" font-size="12">Choose low-shed fabric!</tspan></text>
 <text x="42" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="37" font-weight="900">DESIGN!  CHOOSE!  PREVENT!</text>
