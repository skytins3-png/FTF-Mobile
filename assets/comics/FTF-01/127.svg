 <text x="276" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="276">공장 배출을 줄인 다음, FTF는 제품 설계 단계로 올라갔다.</tspan><tspan x="276" dy="24" font-size="14">减少工厂排放后，FTF把行动推进到产品设计阶段。</tspan><tspan x="276" dy="22" font-size="13">After cutting factory discharge, FTF moves upstream into product design.</tspan></text>
