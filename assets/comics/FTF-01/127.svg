 <text x="1034" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1034">마찰·세탁 시험에서 저탈락 원단은 미세섬유 방출을 69% 줄였다.</tspan><tspan x="1034" dy="24" font-size="14">耐磨与洗涤测试显示，低脱纤面料使微纤维释放减少69%。</tspan><tspan x="1034" dy="22" font-size="13">Abrasion and wash tests show 69% less microfiber shedding.</tspan></text>
 <rect x="1287" y="104" width="205" height="94" rx="22" fill="#eaffd8" stroke="#111" stroke-width="4"/>
 <text x="1389" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1389">수치는 거짓말 안 해!</tspan><tspan x="1389" dy="22" font-size="13">数据不会说谎！</tspan><tspan x="1389" dy="20" font-size="12">The numbers don't lie!</tspan></text>
 <text x="804" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="36" font-weight="900">SPIN!  WASH!  MEASURE!</text>
</g>

