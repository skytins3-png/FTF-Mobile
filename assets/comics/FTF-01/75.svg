 <text x="35" y="105" font-size="24" font-weight="900">다시 출항합니다!</text><text x="35" y="135" font-size="20">더 푸른 바다를 향해.</text><text x="35" y="166" font-size="18">我们再次出发，驶向更蓝的海洋。</text><text x="35" y="196" font-size="18">We set sail again for a bluer ocean.</text></g>
