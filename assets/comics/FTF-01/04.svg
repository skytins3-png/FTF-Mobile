nt-size="39" fill="#22130e">강풍을 탄 산불이 산등성이를 넘어 대피선까지 접근한다.</text><text x="90" y="216" font-size="28" fill="#5c2a1c">山火借着强风越过山脊，逼近疏散区域。 · Wildfire crosses the ridge.</text><path d="M95 1010q0-95 105-95h360q105 0 105 95v120q0 95-105 95H350l-85 85 18-85H200q-105 0-105-95z" fill="#fff" stroke="#111" stroke-width="9"/><text x="145" y="985" font-size="40" fill="#111">불길이 도로 쪽으로 번져!</text><text x="145" y="1040" font-size="31" fill="#333">火势正往公路蔓延！</text><text x="145" y="1092" font-size="29" fill="#555">The fire is moving toward the road!</text><path d="M590 1070q0-85 95-85h285q75 0 75 85v105q0 85-75 85H845l-35 70-20-70H685q-95 0-95-85z" fill="#f6fbff" stroke="#111" stroke-width="9"/><text x="630" y="1050" font-size="35" fill="#111">대피로를 바꿔요!</text><text x="630" y="1100" font-size="29" fill="#333">马上改变疏散路线！</text><text x="630" y="1147" font-size="26" fill="#555">Change the evacuation route!</text><text x="690" y="760" font-size="98" font-style="italic" fill="#ffd94d" stroke="#411" stroke-width="5" transform="rotate(-8 690 760)">FWOOSH!</text><rect x="70" y="1745" width="940" height="115" rx="18" fill="#161616dd" stroke="#ffcf4d" stroke-width="5"/><text x="105" y="1792" font-size="32" fill="#fff">FTF-01 · 지구의 경고 · SCENE 04/26</text><text x="105" y="1833" font-size="25" fill="#ffd86a">산불 확산 / 山火蔓延 / Wildfire escalation</text></g></svg>