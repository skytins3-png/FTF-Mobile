 <path d="M62 404h355l49 34H35z" fill="#eef3f4" stroke="#213a46" stroke-width="6"/><rect x="100" y="329" width="150" height="72" rx="8" fill="#f8fbfc" stroke="#213a46" stroke-width="5"/><text x="300" y="420" class="t" font-size="24" font-weight="1000" fill="#183847">K-51</text>
 <rect x="492" y="270" width="182" height="94" rx="12" fill="#e5eef0" stroke="#263c46" stroke-width="5"/><text x="583" y="300" text-anchor="middle" class="t" font-size="15" font-weight="1000">GROUND GEAR BAY</text><rect x="514" y="317" width="52" height="28" fill="#f0b33a"/><rect x="586" y="317" width="62" height="28" fill="#43a88f"/>
 <g transform="translate(469 448)" filter="url(#shadow)"><ellipse cy="-66" rx="27" ry="33" fill="#c98e6e" stroke="#102631" stroke-width="4"/><path d="M-26-77q9-25 29-27q23 4 27 25l-18-7q-20 4-38 9" fill="#292929"/><rect x="-43" y="-27" width="86" height="105" rx="17" fill="#f1b33a" stroke="#102631" stroke-width="4"/><path d="M-34-6l-58 25M34-6l62-10" stroke="#f1b33a" stroke-width="17" stroke-linecap="round"/></g>
 <g transform="translate(690 450)" filter="url(#shadow)"><ellipse cy="-65" rx="26" ry="32" fill="#d6a17d" stroke="#102631" stroke-width="4"/><path d="M-25-75q9-24 27-25q20 3 25 23l-17-6q-18 5-35 8" fill="#563a31"/><rect x="-40" y="-26" width="80" height="101" rx="16" fill="#3da58b" stroke="#102631" stroke-width="4"/><path d="M-31-5l-45-25M31-5l44 27" stroke="#3da58b" stroke-width="16" stroke-linecap="round"/></g>
 <rect x="38" y="103" width="672" height="108" rx="18" class="box"/>
 <text x="374" y="134" text-anchor="middle" class="t cap"><tspan x="374">C-4 고임목 흔적 이후, 팀은 호스만 보지 않는다. 지게차·카트·고임목·공구함 전부를 추적한다.</tspan><tspan x="374" dy="25" font-size="14">发现C-4旧生物膜后，所有叉车、推车、止轮器和工具箱都纳入追踪。</tspan><tspan x="374" dy="22" font-size="13">After the C-4 trace, every forklift, cart, chock and toolbox enters the trace chain.</tspan></text>
 <path d="M430 220h282q15 0 15 15v60q0 15-15 15H556l-31 26 8-26H430q-15 0-15-15v-60q0-15 15-15z" class="bub"/>
 <text x="571" y="250" text-anchor="middle" class="t" font-size="17" font-weight="900"><tspan x="571">움직인 장비 전부, 마지막 24시간 동선을 열어!</tspan><tspan x="571" dy="22" font-size="13">调出全部移动设备24小时轨迹！</tspan></text>
 <text x="47" y="492" class="sfx">TAG! SCAN! TRACE THE WHEELS!</text>
</g>

<!-- PANEL 2 -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#yard)"/>
 <rect x="802" y="232" width="690" height="245" rx="18" fill="#183847"/>
 <path d="M850 416C930 330 1007 388 1080 298S1262 268 1438 354" fill="none" stroke="#5bd3e9" stroke-width="9" stroke-dasharray="17 11" filter="url(#glow)"/>
 <circle cx="900" cy="365" r="16" fill="#ffd55d"/><circle cx="1080" cy="298" r="16" fill="#ff765d"/><circle cx="1295" cy="295" r="16" fill="#ffd55d"/><circle cx="1438" cy="354" r="16" fill="#62e2a2"/>
 <text x="900" y="397" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">C-4</text><text x="1080" y="330" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">FORKLIFT F-3</text><text x="1295" y="326" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">CART T-8</text><text x="1438" y="386" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">ZONE B</text>
 <rect x="831" y="252" width="196" height="72" rx="11" fill="#fff6cf" stroke="#b78324" stroke-width="5"/><text x="929" y="277" text-anchor="middle" class="t" font-size="13" font-weight="900">24h ROUTE REPLAY</text><text x="929" y="306" text-anchor="middle" class="t" font-size="20" font-weight="1000" fill="#a35318">4 CONTACTS</text>
 <g transform="translate(875 458)" filter="url(#shadow)"><ellipse cy="-59" rx="25" ry="30" fill="#c99170" stroke="#102b35" stroke-width="4"/><rect x="-38" y="-22" width="76" height="92" rx="15" fill="#f0b33a" stroke="#102b35" stroke-width="4"/><path d="M-30-5l-45-36M30-5l51-29" stroke="#f0b33a" stroke-width="16" stroke-linecap="round"/></g>
 <rect x="798" y="103" width="666" height="108" rx="18" class="box"/>
 <text x="1131" y="134" text-anchor="middle" class="t cap"><tspan x="1131">RFID 기록을 되감자 C-4는 F-3 지게차, T-8 카트, B구역 바닥과 연속 접촉했다.</tspan><tspan x="1131" dy="25" font-size="14">回放RFID轨迹：C-4先后接触F-3叉车、T-8推车和B区地面。</tspan><tspan x="1131" dy="22" font-size="13">RFID replay shows C-4 touched forklift F-3, cart T-8 and Zone B in sequence.</tspan></text>
 <path d="M1102 392h350q14 0 14 14v59q0 14-14 14h-180l-28 22 6-22h-148q-14 0-14-14v-59q0-14 14-14z" class="bub"/>
 <text x="1277" y="424" text-anchor="middle" class="t" font-size="17" font-weight="900"><tspan x="1277">접촉망 4개! 사용 정지부터!</tspan><tspan x="1277" dy="22" font-size="13">四个接触点，先全部停用！</tspan></text>
 <text x="812" y="492" class="sfx">REPLAY! CONNECT! HOLD!</text>
</g>

<!-- PANEL 3 -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#c8dce3"/>
 <rect x="42" y="707" width="692" height="255" rx="18" fill="#15384b"/>
 <rect x="69" y="746" width="190" height="170" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="164" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">FORKLIFT F-3</text><circle cx="164" cy="830" r="34" fill="#ffd1b5" stroke="#cc6c35" stroke-width="5"/><text x="164" y="838" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#a84422">TRACE</text><text x="164" y="883" text-anchor="middle" class="t" font-size="12" font-weight="900">LEFT REAR TIRE</text>
 <rect x="286" y="746" width="190" height="170" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="381" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">CART T-8</text><circle cx="381" cy="830" r="34" fill="#c8f1d9" stroke="#35966a" stroke-width="5"/><text x="381" y="838" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#237450">NEG</text><text x="381" y="883" text-anchor="middle" class="t" font-size="12" font-weight="900">HANDLE / WHEEL</text>
 <rect x="503" y="746" width="190" height="170" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="598" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">ZONE B FLOOR</text><circle cx="598" cy="830" r="34" fill="#ffd1b5" stroke="#cc6c35" stroke-width="5"/><text x="598" y="838" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#a84422">TRACE</text><text x="598" y="883" text-anchor="middle" class="t" font-size="12" font-weight="900">TIRE PATH</text>
 <g transform="translate(365 703)" filter="url(#shadow)"><ellipse cy="-58" rx="26" ry="31" fill="#d2a17c" stroke="#102a35" stroke-width="4"/><path d="M-25-69q8-24 27-25q19 3 25 24l-16-7q-18 5-36 8" fill="#5a3d32"/><rect x="-40" y="-23" width="80" height="95" rx="16" fill="#43a88f" stroke="#102a35" stroke-width="4"/><path d="M-31-4l-52 34M31-4l52 28" stroke="#43a88f" stroke-width="16" stroke-linecap="round"/></g>
 <rect x="39" y="548" width="670" height="119" rx="18" class="box"/>
 <text x="374" y="579" text-anchor="middle" class="t cap"><tspan x="374">면봉검사 결과 F-3 왼쪽 뒤 타이어와 B구역 이동선에서 같은 미세 흔적. T-8은 음성이다.</tspan><tspan x="374" dy="25" font-size="14">拭子结果：F-3左后轮和B区行驶路径出现同一微量痕迹，T-8为阴性。</tspan><tspan x="374" dy="22" font-size="13">Swabs find the same trace on F-3's left rear tire and Zone B route; T-8 is negative.</tspan></text>
 <path d="M60 673h286q15 0 15 15v54q0 15-15 15H196l-27 22 6-22H60q-15 0-15-15v-54q0-15 15-15z" class="bub"/>
 <text x="203" y="704" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="203">F-3 즉시 격리! B구역 통행도 막아!</tspan><tspan x="203" dy="21" font-size="12">隔离F-3，封锁B区通道！</tspan></text>
 <text x="51" y="988" class="sfx">SWAB! TRACE! ISOLATE THE ROUTE!</text>
</g>

<!-- PANEL 4 -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="#b9d0d8"/>
 <rect x="800" y="708" width="694" height="256" rx="18" fill="#173f52"/>
 <rect x="828" y="744" width="202" height="174" rx="14" fill="#eefcf6" stroke="#399a74" stroke-width="5"/><text x="929" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">F-3 AFTER CLEAN</text><text x="929" y="826" text-anchor="middle" class="t" font-size="30" font-weight="1000" fill="#25805f">NEG</text><text x="929" y="865" text-anchor="middle" class="t" font-size="12" font-weight="900">TIRE · FORK · CAB</text>
 <rect x="1054" y="744" width="202" height="174" rx="14" fill="#eefcf6" stroke="#399a74" stroke-width="5"/><text x="1155" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">ZONE B RE-SWAB</text><text x="1155" y="826" text-anchor="middle" class="t" font-size="30" font-weight="1000" fill="#25805f">6/6 NEG</text><text x="1155" y="865" text-anchor="middle" class="t" font-size="12" font-weight="900">48h VERIFICATION</text>
 <rect x="1280" y="744" width="185" height="174" rx="14" fill="#fff6cf" stroke="#b78324" stroke-width="5"/><text x="1372" y="775" text-anchor="middle" class="t" font-size="14" font-weight="900">NEW RULE</text><text x="1372" y="817" text-anchor="middle" class="t" font-size="16" font-weight="1000" fill="#9c611c">COLOR TAG</text><text x="1372" y="845" text-anchor="middle" class="t" font-size="13" font-weight="900">ONE ZONE ONLY</text><text x="1372" y="876" text-anchor="middle" class="t" font-size="12" font-weight="900">SCAN BEFORE MOVE</text>
 <g transform="translate(1000 703)" filter="url(#shadow)"><ellipse cy="-58" rx="26" ry="31" fill="#c98e6e" stroke="#102a35" stroke-width="4"/><rect x="-40" y="-23" width="80" height="95" rx="16" fill="#f0b33a" stroke="#102a35" stroke-width="4"/><path d="M-31-4l-49 29M31-4l49 29" stroke="#f0b33a" stroke-width="16" stroke-linecap="round"/></g>
 <g transform="translate(1415 703)" filter="url(#shadow)"><ellipse cy="-58" rx="25" ry="30" fill="#d6a17d" stroke="#102a35" stroke-width="4"/><rect x="-38" y="-22" width="76" height="92" rx="15" fill="#43a88f" stroke="#102a35" stroke-width="4"/><path d="M-29-4l-42 30M29-4l42 30" stroke="#43a88f" stroke-width="15" stroke-linecap="round"/></g>
 <rect x="798" y="548" width="666" height="119" rx="18" class="box"/>
 <text x="1131" y="579" text-anchor="middle" class="t cap"><tspan x="1131">F-3를 분해세척하고 B구역을 소독한 뒤 48시간 6/6 음성. 이동장비는 구역별 색상태그제로 바뀐다.</tspan><tspan x="1131" dy="25" font-size="14">F-3拆洗、B区消毒后48小时6/6阴性；移动设备改为分区颜色标签。</tspan><tspan x="1131" dy="22" font-size="13">After deep-cleaning F-3 and Zone B: 6/6 negative at 48h; ground gear becomes zone-tagged.</tspan></text>
 <path d="M1070 674h380q15 0 15 15v54q0 15-15 15h-196l-28 22 7-22h-163q-15 0-15-15v-54q0-15 15-15z" class="bub"/>
 <text x="1260" y="705" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="1260">이제 바퀴 하나도 구역을 넘기 전 스캔한다.</tspan><tspan x="1260" dy="21" font-size="12">从现在起，任何车轮跨区前都必须扫描。</tspan></text>
 <text x="812" y="988" class="sfx">DEEP CLEAN! 6/6 NEGATIVE! ZONE LOCK!</text>
</g>
</svg>