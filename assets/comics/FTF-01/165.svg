<rect width="1536" height="1024" fill="#06121b"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#173f58"/>
<text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #165  움직이는 장비까지 추적하라 — 오염은 ‘바퀴’를 타고 이동한다</text>
<text x="1102" y="49" class="t" fill="#d9f5ff" font-size="16" font-weight="800">GROUND ROUTE · TAG · TRACE · 地面设备追踪</text>

<!-- PANEL 1 -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#dawn)"/>
 <rect x="16" y="342" width="746" height="170" fill="#6c797d"/>
