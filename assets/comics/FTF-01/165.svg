 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#52bad0"/><stop offset="1" stop-color="#0c4f69"/></linearGradient>
 <linearGradient id="yard" x2="1" y2="1"><stop stop-color="#d9e1e3"/><stop offset="1" stop-color="#76858a"/></linearGradient>
