<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 156 extends regional port biosecurity into a pre-departure corridor, screening vessels before they leave and sharing risk certificates with the next port">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0a2946"/><stop offset="1" stop-color="#e8794b"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1da7c4"/><stop offset="1" stop-color="#06384f"/></linearGradient>
 <linearGradient id="room" x2="1" y2="1"><stop stop-color="#eaf4f6"/><stop offset="1" stop-color="#93abb3"/></linearGradient>
 <linearGradient id="safe" x2="1" y2="1"><stop stop-color="#dffff1"/><stop offset="1" stop-color="#4ec491"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".42"/></filter>
</defs>
<rect width="1536" height="1024" fill="#05141d"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#154965"/>
<text x="28" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="30" font-weight="900">FTF-01 #156  들어온 뒤 잡지 않는다 — 출항 전에 위험을 끊는다</text>
<text x="980" y="49" fill="#c9f8ff" font-family="Arial" font-size="17" font-weight="800">PRE-DEPARTURE BIOSECURITY CORRIDOR · 离港前生物安全走廊</text>

<!-- PANEL 1: outbound screening -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/>
 <rect x="16" y="337" width="746" height="175" fill="url(#sea)"/>
 <path d="M36 359h690v40H36z" fill="#6c777b"/><path d="M76 399v93M210 399v93M594 399v93M700 399v93" stroke="#33454a" stroke-width="17"/>
 <g filter="url(#shadow)"><path d="M86 409h320l-47 78H130z" fill="#e8eef0" stroke="#17333f" stroke-width="6"/><rect x="179" y="330" width="147" height="82" rx="9" fill="#bad6df" stroke="#17333f" stroke-width="5"/><rect x="202" y="351" width="39" height="27" fill="#28718a"/><rect x="251" y="351" width="39" height="27" fill="#28718a"/><text x="252" y="462" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#17333f">K-27</text></g>
 <g transform="translate(530 326)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#c89572" stroke="#102a35" stroke-width="5"/><path d="M-28-68q9-28 29-28q21 3 28 28l-19-7q-18 8-38 7" fill="#292625"/><rect x="-40" y="-20" width="80" height="105" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-31 2l-63 34M31 2l58 28" stroke="#f1b842" stroke-width="18" stroke-linecap="round"/><rect x="-15" y="8" width="30" height="43" rx="4" fill="#173f56"/></g>
 <g transform="translate(640 347)" filter="url(#shadow)"><rect x="-85" y="-58" width="170" height="116" rx="14" fill="#173f56" stroke="#07151c" stroke-width="5"/><rect x="-67" y="-40" width="134" height="72" rx="7" fill="#dffff2"/><text y="-13" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#16563f">OUTBOUND GATE</text><text y="12" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#16563f">HULL SWAB  ✓</text><circle cx="-48" cy="45" r="8" fill="#44dfa4"/><text x="-33" y="50" font-family="Arial" font-size="12" font-weight="900" fill="#fff">READY</text></g>
 <rect x="38" y="102" width="540" height="122" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="308" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="308">이제 검사는 입항 때만 하지 않는다. K-27은 출항 전에 선체·밸러스트·공용장비를 먼저 검사한다.</tspan><tspan x="308" dy="24" font-size="14">现在不只在进港时检查，K-27离港前先检查船体、压载水与共用设备。</tspan><tspan x="308" dy="23" font-size="13">Inspection moves upstream: hull, ballast and shared gear are checked before departure.</tspan></text>
 <path d="M590 103h142q16 0 16 16v92q0 16-16 16h-76l-28 26 7-26h-45q-16 0-16-16v-92q0-16 16-16z" fill="#fff2c2" stroke="#111" stroke-width="4"/>
 <text x="661" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="661">출항 전에</tspan><tspan x="661" dy="23">끊어!</tspan><tspan x="661" dy="20" font-size="12">离港前阻断！</tspan></text>
 <text x="48" y="493" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">CHECK! SWAB! CLEAR BEFORE SAIL!</text>
</g>

<!-- PANEL 2: risk passport -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#room)"/>
 <rect x="807" y="244" width="680" height="202" rx="18" fill="#153f56" stroke="#082631" stroke-width="6"/>
 <g filter="url(#shadow)"><rect x="843" y="276" width="287" height="136" rx="14" fill="#e5fff6" stroke="#2e8c69" stroke-width="5"/><text x="986" y="304" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#16563f">VESSEL BIOSECURITY PASS</text><text x="986" y="334" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#16563f">K-27 · ROUTE A → B → C</text><text x="986" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#16563f">HULL ✓  BALLAST ✓  GEAR ✓</text><text x="986" y="386" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#16563f">eDNA NEGATIVE · SEALED 10:42</text></g>
 <path d="M1132 344h93" stroke="#79e7ff" stroke-width="9"/><polygon points="1234,344 1200,323 1200,365" fill="#79e7ff"/>
 <g filter="url(#shadow)"><rect x="1240" y="278" width="205" height="132" rx="14" fill="#fff1c7" stroke="#6b5419" stroke-width="5"/><text x="1342" y="308" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#684f16">NEXT PORT</text><text x="1342" y="338" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#684f16">PORT B RECEIVED</text><text x="1342" y="365" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#684f16">ETA 14:20</text><text x="1342" y="390" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#684f16">GATE PRE-CLEARED</text></g>
 <g transform="translate(900 473)" filter="url(#shadow)"><ellipse cy="-61" rx="28" ry="34" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-29-72q10-29 30-29q22 4 28 29l-18-8q-19 8-40 8" fill="#1f2528"/><rect x="-41" y="-23" width="82" height="95" rx="18" fill="#4ea5c8" stroke="#102a35" stroke-width="5"/><path d="M-33-1l-58-32M33-1l62-29" stroke="#4ea5c8" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="796" y="102" width="650" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">검사 결과는 ‘생물안전 패스’가 되어 다음 항만으로 먼저 전송된다. 다음 항만은 배가 오기 전부터 위험도를 안다.</tspan><tspan x="1121" dy="24" font-size="14">检查结果生成“生物安全通行证”，提前发送到下一港口。</tspan><tspan x="1121" dy="23" font-size="13">A digital biosecurity pass reaches the next port before the vessel does.</tspan></text>
 <text x="812" y="492" font-family="Arial" font-size="25" font-weight="1000" fill="#153642">SCAN! CERTIFY! SHARE AHEAD!</text>
</g>

<!-- PANEL 3: interception at origin -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#0b2c3e"/>
 <rect x="16" y="744" width="746" height="264" fill="url(#sea)"/>
 <path d="M76 814h345l-51 92H120z" fill="#e7edef" stroke="#102f3b" stroke-width="7"/>
 <rect x="170" y="710" width="151" height="107" rx="9" fill="#c3dbe2" stroke="#102f3b" stroke-width="6"/><text x="247" y="793" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#17333f">K-31</text>
 <circle cx="442" cy="785" r="36" fill="#ef565a" stroke="#fff" stroke-width="6"/><path d="M423 766l38 38M461 766l-38 38" stroke="#fff" stroke-width="9"/>
 <g filter="url(#shadow)"><rect x="486" y="675" width="220" height="121" rx="14" fill="#ffd8d8" stroke="#7a2828" stroke-width="5"/><text x="596" y="706" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#782828">POSITIVE TRACE</text><text x="596" y="737" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#782828">BALLAST SAMPLE B-4</text><text x="596" y="765" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#782828">DEPARTURE BLOCKED</text></g>
 <g transform="translate(594 881)" filter="url(#shadow)"><ellipse cy="-68" rx="29" ry="35" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-30-78q8-30 30-30q22 4 29 30l-19-8q-19 8-40 8" fill="#2a2625"/><rect x="-43" y="-28" width="86" height="116" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-35-2l-76 35M35-2l77 30" stroke="#f1b842" stroke-width="19" stroke-linecap="round"/></g>
 <rect x="38" y="546" width="674" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">K-31의 밸러스트 B-4에서 미세 양성 신호가 잡혔다. 배는 출항하지 않고 원래 항만에서 즉시 격리·처리됐다.</tspan><tspan x="375" dy="24" font-size="14">K-31压载水B-4出现微弱阳性信号，船舶未离港即在原港隔离处理。</tspan><tspan x="375" dy="23" font-size="13">A weak positive is caught at origin; K-31 never carries the risk down the coast.</tspan></text>
 <path d="M476 850h227q15 0 15 15v72q0 15-15 15h-118l-33 31 9-31h-85q-15 0-15-15v-72q0-15 15-15z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="590" y="882" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="590">여기서 멈춘다!</tspan><tspan x="590" dy="24" font-size="13">风险止于出发港！</tspan></text>
 <text x="49" y="986" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">ALERT! HOLD! TREAT AT ORIGIN!</text>
</g>

<!-- PANEL 4: verified corridor -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="url(#safe)"/>
 <rect x="794" y="792" width="706" height="196" rx="14" fill="url(#sea)"/>
 <path d="M838 853h202l-31 58H872z" fill="#f2f6f7" stroke="#17414e" stroke-width="5"/><path d="M1215 847h187l-28 57h-129z" fill="#f2f6f7" stroke="#17414e" stroke-width="5"/>
 <path d="M1023 760C1100 713 1180 713 1262 760" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="18 11"/>
 <g filter="url(#shadow)"><rect x="820" y="666" width="635" height="112" rx="18" fill="#123f54"/><text x="1137" y="696" text-anchor="middle" font-family="Arial" font-size="21" font-weight="900" fill="#fff">30-DAY CORRIDOR AUDIT</text><text x="1137" y="727" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#bffff0">PRE-DEPARTURE CHECKS  63/63  ·  MISSED RISK TRANSFERS  0</text><text x="1137" y="753" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#bffff0">BIOSECURITY PASS DELIVERY  100%  ·  SECONDARY eDNA  0</text></g>
 <g transform="translate(1380 926)" filter="url(#shadow)"><ellipse cy="-68" rx="29" ry="35" fill="#c08d6c" stroke="#102a35" stroke-width="5"/><path d="M-30-79q8-29 29-29q23 4 29 29l-19-8q-19 8-39 8" fill="#25282b"/><rect x="-43" y="-28" width="86" height="116" rx="18" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-35-2l-73-32M35-2l70-34" stroke="#43b994" stroke-width="19" stroke-linecap="round"/></g>
 <rect x="796" y="546" width="650" height="104" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">30일 동안 63척을 출항 전에 검사했다. 위험을 실은 채 다음 항만으로 넘어간 선박은 0척이었다.</tspan><tspan x="1121" dy="24" font-size="14">30天内63艘船在离港前完成检查，带风险驶向下一港的船舶为0。</tspan><tspan x="1121" dy="23" font-size="13">The chain is broken before departure—not after the next harbor is exposed.</tspan></text>
 <text x="813" y="986" font-family="Arial" font-size="25" font-weight="1000" fill="#fff">VERIFY! ZERO TRANSFER! STOP IT BEFORE SAIL!</text>
</g>
</svg>