 <g transform="translate(230 219)" filter="url(#shadow)"><ellipse class="skin" cx="56" cy="47" rx="37" ry="41"/><path class="hair" d="M18 45Q22 6 56 4q38 2 41 44q-22-13-42-10q-19 1-37 7"/><path class="navy" d="M7 98q48-22 98 5l17 130H-3Z"/><path d="M28 16h58l17 17H15Z" fill="#173e56"/><text x="19" y="151" font-size="16" font-weight="900" fill="#e2f8ff">REEF WATCH</text></g>
 <g transform="translate(392 224)" filter="url(#shadow)"><ellipse class="skin" cx="54" cy="47" rx="36" ry="40"/><path class="hair" d="M17 43Q19 4 55 4q39 3 40 43q-20-12-39-10q-19 2-39 6"/><path d="M6 96q47-20 95 5l16 129H-3Z" fill="#df8d3b" stroke="#6c431e" stroke-width="4"/><path d="M19 18h72l12 17H8Z" fill="#e6c763" stroke="#604c24" stroke-width="3"/></g>
 <g transform="translate(520 292)" filter="url(#shadow)"><rect x="0" y="0" width="210" height="132" rx="8" fill="#edf8e8" stroke="#173846" stroke-width="5"/><path d="M19 84q43-48 90-16q40-35 85-2" fill="none" stroke="#4a9d6a" stroke-width="11"/><circle cx="56" cy="52" r="8" fill="#ef4343"/><circle cx="126" cy="70" r="8" fill="#f3c133"/><circle cx="172" cy="47" r="8" fill="#3a9be2"/><text x="39" y="29" font-size="20" font-weight="900" fill="#17455a">COMMUNITY WATCH</text></g>
 <rect class="box" x="18" y="18" width="492" height="136" rx="8"/><text x="38" y="50" class="ko">계류부표를 설치한 뒤, 지역 주민과 연구팀이 감시조를 만듭니다.</text><text x="38" y="82" class="ko">매일 같은 산호를 기록해 작은 변화도 놓치지 않습니다.</text><text x="38" y="112" class="zh">居民与研究团队共同建立珊瑚礁监测队，每天记录变化。</text><text x="38" y="142" class="en">Fishers, researchers and volunteers build a shared reef watch.</text>
 <path class="bubble" d="M522 38h220q14 0 14 15v112q0 15-14 15H627l-27 30 6-30h-84q-14 0-14-15V53q0-15 14-15Z"/><text x="540" y="76" class="ko">우리 바다는 우리가 먼저 지켜요!</text><text x="540" y="110" class="zh">我们的海，我们一起守护！</text><text x="540" y="144" class="en">We watch our ocean together!</text>
 <text x="28" y="468" class="sfx" fill="#ffd83e">WATCH! RECORD! PROTECT!</text>
</g>
<!-- PANEL 2: SENSOR ALERT -->
<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/>
 <g opacity=".25" stroke="#eaffff" stroke-width="5"><path d="M100 0L30 250M280 0L170 270M520 0L370 300M730 0L590 290"/></g>
 <path d="M4 390Q150 342 320 390T760 365V500H4Z" fill="#7b6b55"/>
 <g transform="translate(70 195)" filter="url(#shadow)"><ellipse class="skin" cx="56" cy="48" rx="36" ry="40"/><rect x="18" y="40" width="77" height="30" rx="13" fill="#c9f6ff" stroke="#153a4a" stroke-width="4"/><path class="navy" d="M7 94q47-21 94 6l17 125H-3Z"/><path d="M97 127q74 7 137 41" stroke="#e6aa82" stroke-width="15" fill="none" stroke-linecap="round"/></g>
