 <!-- underwater window vignette -->
 <g transform="translate(470 235)" filter="url(#shadow)"><rect x="0" y="0" width="260" height="206" rx="18" fill="#086a87" stroke="#d9f8ff" stroke-width="6"/><path d="M0 137q64-39 121-7q61-36 139-5v81H0Z" fill="#6f6a54"/><path class="reef1" d="M22 178q-7-34 15-52q-1 27 14 22q5-31 24-40q-4 33 9 35q12-24 27-28q-6 31 0 59Z"/><path class="reef2" d="M102 183q-5-31 15-48q0 26 14 21q5-29 21-38q-3 31 9 32q11-22 24-25q-5 29 0 54Z"/><ellipse cx="172" cy="83" rx="44" ry="25" fill="#8dbf9c" stroke="#234e43" stroke-width="4"/><circle cx="203" cy="78" r="13" fill="#8dbf9c" stroke="#234e43" stroke-width="4"/><path d="M149 78q-24-24-35-9q12 16 34 19M185 95q17 24 29 7q-7-14-26-19" fill="#8dbf9c" stroke="#234e43" stroke-width="4"/><g fill="#f2c348" stroke="#6d5914" stroke-width="2"><ellipse cx="66" cy="75" rx="17" ry="9"/><ellipse cx="93" cy="101" rx="14" ry="8"/><ellipse cx="224" cy="118" rx="15" ry="8"/></g></g>
 <rect class="box" x="18" y="18" width="488" height="138" rx="8"/><text x="38" y="50" class="ko">며칠 뒤 수온이 안정되고, 어린 산호의 색이 돌아옵니다.</text><text x="38" y="82" class="ko">기록과 협력이 산호초를 지키는 가장 빠른 경보가 됩니다.</text><text x="38" y="112" class="zh">几天后海温恢复稳定，幼珊瑚重新显色，鱼和海龟也回来了。</text><text x="38" y="142" class="en">Days later, the reef stabilizes—and life returns.</text>
 <path class="bubble" d="M520 39h221q14 0 14 15v112q0 15-14 15H629l-27 29 6-29h-88q-14 0-14-15V54q0-15 14-15Z"/><text x="538" y="77" class="ko">기록했어요! 산호가 회복되고 있어요!</text><text x="538" y="111" class="zh">记录到了！珊瑚正在恢复！</text><text x="538" y="145" class="en">We recorded it—the reef is recovering!</text>
 <text x="27" y="477" class="sfx" fill="#ffe64d">LIFE RETURNS! TOGETHER!</text>
</g>
</svg>