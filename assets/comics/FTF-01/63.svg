 <g transform="translate(545 214)" filter="url(#shadow)"><rect x="0" y="0" width="126" height="170" rx="12" fill="#d9edf0" stroke="#173c48" stroke-width="6"/><circle cx="63" cy="46" r="22" fill="#65c8df" stroke="#173c48" stroke-width="5"/><path d="M63 68v48M32 132h62" stroke="#173c48" stroke-width="7"/><text x="18" y="156" font-size="17" font-weight="900" fill="#17445b">TEMP SENSOR</text><path d="M63 0V-85" stroke="#f2cb40" stroke-width="7"/><circle cx="63" cy="-96" r="18" fill="#f2cb40" stroke="#6d5914" stroke-width="5"/></g>
 <g transform="translate(480 370)"><path class="reef1" d="M20 106q-9-45 20-69q-3 37 17 30q7-44 32-57q-6 48 11 50q17-35 36-40q-10 47 2 83Z"/><path class="reef2" d="M128 108q-8-44 22-68q0 37 19 29q7-42 29-55q-4 45 12 47q17-32 36-37q-10 43-1 78Z"/></g>
 <rect class="box" x="18" y="18" width="488" height="138" rx="8"/><text x="38" y="50" class="ko">수중 센서가 갑작스러운 수온 상승을 감지합니다.</text><text x="38" y="82" class="ko">눈으로 보이기 전에 데이터가 먼저 위험을 알려줍니다.</text><text x="38" y="112" class="zh">水下传感器发现海温突然升高，数据提前发出警报。</text><text x="38" y="142" class="en">Underwater sensors detect a heat spike before damage is visible.</text>
 <path class="bubble" d="M518 42h224q14 0 14 15v108q0 15-14 15H630l-27 28 5-28h-90q-14 0-14-15V57q0-15 14-15Z"/><text x="536" y="80" class="ko">경보! 보육 산호 구역부터 확인해요!</text><text x="536" y="114" class="zh">警报！先检查珊瑚育苗区！</text><text x="536" y="148" class="en">ALERT! Check the nursery reef first!</text>
 <text x="370" y="468" class="sfx" fill="#ff5648">BEEP! HEAT ALERT!</text>
</g>
<!-- PANEL 3: RAPID RESPONSE -->
<g transform="translate(0 512)">
 <rect class="panel" x="4" y="4" width="760" height="508" fill="url(#sea)"/>
 <path d="M4 362Q150 326 310 370T760 346V508H4Z" fill="#7f6e59"/>
 <g transform="translate(28 204)" filter="url(#shadow)"><path d="M0 76h272l-33 76H30Z" fill="#f7f6ef" stroke="#173744" stroke-width="5"/><path d="M66 18h106v60H66Z" fill="#d9eff4" stroke="#173744" stroke-width="4"/><path d="M118 18V-38M118-38l58 26" stroke="#173744" stroke-width="5"/><rect x="31" y="98" width="163" height="14" fill="#2ca7c9"/><text x="76" y="130" font-size="19" font-weight="900" fill="#123c53">REEF RESPONSE</text></g>
 <g transform="translate(340 220)" filter="url(#shadow)"><ellipse class="skin" cx="55" cy="47" rx="36" ry="40"/><path class="hair" d="M17 43Q20 5 55 4q38 2 40 43q-21-12-39-10q-19 1-39 6"/><path class="navy" d="M6 95q47-21 95 5l16 126H-3Z"/><path d="M26 16h57l18 17H13Z" fill="#173e56"/><path d="M98 127q78 11 145 58" stroke="#e6aa82" stroke-width="15" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(580 272)" filter="url(#shadow)"><path d="M0 0h112v90H0Z" fill="#f0f3f1" stroke="#1a3a46" stroke-width="5"/><path d="M15 68q32-45 78-20" fill="none" stroke="#47a96d" stroke-width="10"/><text x="22" y="28" font-size="19" font-weight="900" fill="#17445b">NURSERY</text></g>
 <g transform="translate(500 380)"><path class="reef3" d="M20 103q-8-43 18-66q0 34 18 28q7-40 29-52q-5 42 12 44q15-30 34-34q-8 40-1 73Z"/><path class="reef4" d="M122 106q-7-41 20-63q0 34 18 27q7-39 28-50q-4 41 11 43q15-29 33-34q-8 39-1 71Z"/></g>
 <rect class="box" x="18" y="18" width="500" height="138" rx="8"/><text x="38" y="50" class="ko">연구팀과 순찰대가 즉시 보육 산호 구역으로 이동합니다.</text><text x="38" y="82" class="ko">차광막과 추가 온도계를 설치하고 선박 접근도 줄입니다.</text><text x="38" y="112" class="zh">研究员和巡护队立即赶到育苗礁，设置遮阳与额外温度计。</text><text x="38" y="142" class="en">The response team shields the nursery reef and limits disturbance.</text>
 <path class="bubble" d="M528 38h212q14 0 14 15v111q0 15-14 15H629l-27 29 6-29h-80q-14 0-14-15V53q0-15 14-15Z"/><text x="545" y="77" class="ko">빠르게, 하지만 산호는 건드리지 마세요!</text><text x="545" y="111" class="zh">快一点，但不要碰珊瑚！</text><text x="545" y="145" class="en">Move fast—don't touch the coral!</text>
 <text x="28" y="474" class="sfx" fill="#ffd83e">GO! CHECK! GUARD!</text>
</g>
