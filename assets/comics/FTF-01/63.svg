<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #63 — 바다를 함께 지키는 눈</title>
<desc id="d">Four-panel cinematic manga-style continuation of FTF-01. After reef-safe moorings are installed, researchers, local fishers and young volunteers establish a shared monitoring watch, underwater sensors detect a heat spike, rangers respond to protect a vulnerable nursery reef, and the community confirms coral recovery with returning turtles and fish. Korean Chinese English narration, speech bubbles, visual sound effects, illustrated people, boats, reef, sensors and wildlife.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55c5ee"/><stop offset=".58" stop-color="#dff8ff"/><stop offset="1" stop-color="#ffd68e"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#19bde1"/><stop offset=".48" stop-color="#087ea5"/><stop offset="1" stop-color="#06394f"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b9ac0"/><stop offset=".55" stop-color="#07546f"/><stop offset="1" stop-color="#02283a"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7a85a"/><stop offset=".52" stop-color="#ffd695"/><stop offset="1" stop-color="#5488a1"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <style>.panel{stroke:#071722;stroke-width:10}.box{fill:#fffdf5;stroke:#112734;stroke-width:4}.bubble{fill:#fff;stroke:#112734;stroke-width:4}.ko{font:700 22px 'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#111a20}.zh{font:600 18px 'Noto Sans SC','Microsoft YaHei',Arial,sans-serif;fill:#17445a}.en{font:600 17px Arial,sans-serif;fill:#132935}.sfx{font:900 42px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.skin{fill:#e6aa82;stroke:#6d4332;stroke-width:2}.hair{fill:#17232d}.navy{fill:#113f5c;stroke:#06293b;stroke-width:4}.reef1{fill:#ef7664;stroke:#782f31;stroke-width:3}.reef2{fill:#f0c84f;stroke:#76601f;stroke-width:3}.reef3{fill:#9b7ce5;stroke:#4c3b78;stroke-width:3}.reef4{fill:#59c69a;stroke:#256c52;stroke-width:3}</style>
</defs>
<!-- PANEL 1: COMMUNITY WATCH -->
<g>
