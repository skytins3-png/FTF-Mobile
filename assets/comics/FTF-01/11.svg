<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#ff8a42"/><stop offset="1" stop-color="#6d2430"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#4b3b3b"/><stop offset="1" stop-color="#17191d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1080" height="1920" fill="#11151d"/><rect x="28" y="28" width="1024" height="1150" rx="28" fill="url(#sky)" stroke="#f4e4d1" stroke-width="6"/><circle cx="850" cy="190" r="104" fill="#ffd36b" filter="url(#glow)" opacity=".8"/><circle cx="850" cy="190" r="72" fill="#ffe59f"/><g fill="#44313a"><rect x="80" y="390" width="180" height="520"/><rect x="300" y="300" width="210" height="610"/><rect x="560" y="420" width="190" height="490"/><rect x="790" y="340" width="180" height="570"/></g><g fill="#ffb46a" opacity=".75"><rect x="110" y="430" width="35" height="70"/><rect x="170" y="430" width="35" height="70"/><rect x="340" y="350" width="42" height="82"/><rect x="420" y="350" width="42" height="82"/><rect x="610" y="470" width="40" height="78"/><rect x="835" y="390" width="40" height="78"/></g><path d="M28 870H1052V1178H28Z" fill="url(#road)"/><path d="M110 1030H970" stroke="#f7c46a" stroke-width="12" stroke-dasharray="55 42"/><g transform="translate(155 700)"><circle cx="95" cy="110" r="48" fill="#d59a78"/><path d="M55 104q42-62 82 0v-55q-40-48-80 0z" fill="#241e25"/><path d="M45 170q52-55 105 0l28 214H20z" fill="#eef2f7"/><rect x="55" y="220" width="70" height="104" rx="10" fill="#dbe8f2"/><path d="M45 250L5 360M150 250l46 100" stroke="#d59a78" stroke-width="24" stroke-linecap="round"/></g><g transform="translate(390 735)"><circle cx="90" cy="100" r="43" fill="#b77a58"/><path d="M48 100q40-66 86 0V48q-43-48-85 5z" fill="#1e1a1f"/><path d="M36 160q55-50 110 0l25 205H12z" fill="#385b74"/><path d="M70 195l38 0 15 74H57z" fill="#9bcbe1"/></g><g transform="translate(650 760)"><circle cx="88" cy="94" r="38" fill="#d7a07f"/><path d="M48 93q38-58 78 0V48q-38-40-78 2z" fill="#45312d"/><path d="M35 145q50-42 100 0l18 180H18z" fill="#f0c75a"/></g><rect x="68" y="70" width="548" height="140" rx="20" fill="#111827e8" stroke="#ffcf89" stroke-width="3"/><text x="96" y="118" fill="#ffd08b" font-family="Arial" font-weight="700" font-size="34">SCENE 11 · HEAT DOME</text><text x="96" y="164" fill="#fff" font-family="Arial" font-size="28">도시의 체감온도 48°C · 城市体感温度48°C</text><path d="M620 520h370v220H620z" fill="#fff" stroke="#121212" stroke-width="6" rx="22"/><path d="M690 740l-55 70 18-92z" fill="#fff" stroke="#121212" stroke-width="5"/><text x="655" y="575" font-family="Arial" font-size="32" font-weight="700">“물이 부족해요.”</text><text x="655" y="620" font-family="Arial" font-size="28">水不够了。</text><text x="655" y="665" font-family="Arial" font-size="25">“We’re running out of water.”</text><text x="725" y="910" fill="#ffe6b6" font-family="Arial" font-size="64" font-weight="900" transform="rotate(-8 725 910)">HSSSS—</text><rect x="52" y="1215" width="976" height="260" rx="26" fill="#0d1725" stroke="#d6e8ff" stroke-width="4"/><text x="88" y="1280" fill="#9ed7ff" font-family="Arial" font-weight="700" font-size="30">상황 설명 · NARRATION</text><text x="88" y="1340" fill="#fff" font-family="Arial" font-size="34">열돔이 도시를 덮었다. 응급실은 가득 찼고,</text><text x="88" y="1390" fill="#fff" font-family="Arial" font-size="34">도로의 아스팔트조차 열기로 일렁였다.</text><text x="88" y="1440" fill="#b8c8d8" font-family="Arial" font-size="27">热穹顶笼罩城市。The city is trapped beneath a heat dome.</text><rect x="52" y="1510" width="976" height="330" rx="26" fill="#17110f" stroke="#ff9b67" stroke-width="4"/><text x="86" y="1580" fill="#ffb27b" font-family="Arial" font-weight="700" font-size="29">지구의 경고 · EARTH’S WARNING</text><text x="86" y="1640" fill="#fff" font-family="Arial" font-size="35">“이건 기록적인 더위가 아니라, 새로운 일상이다.”</text><text x="86" y="1698" fill="#ffd7c5" font-family="Arial" font-size="30">“这不是纪录高温，而是新的日常。”</text><text x="86" y="1755" fill="#ffd7c5" font-family="Arial" font-size="28">“This isn’t a record. It’s the new normal.”</text></svg>