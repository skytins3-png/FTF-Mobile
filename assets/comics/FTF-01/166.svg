<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 166 traces contamination transfer through worker boots and establishes clean-zone change protocol">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#173a57"/><stop offset=".55" stop-color="#557f98"/><stop offset="1" stop-color="#d6a66f"/></linearGradient>
 <linearGradient id="dock" x2="1" y2="1"><stop stop-color="#cfd8dc"/><stop offset="1" stop-color="#69777d"/></linearGradient>
 <linearGradient id="lab" x2="0" y2="1"><stop stop-color="#eaf5f7"/><stop offset="1" stop-color="#9fbfc8"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".34"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.t{font-family:Arial,'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#102631;stroke-width:4}.bub{fill:#fff;stroke:#111;stroke-width:4}.cap{font-size:17px;font-weight:900;fill:#10202a}.sfx{font-family:Arial,'Malgun Gothic',sans-serif;font-size:22px;font-weight:1000;fill:#fff36b;stroke:#10202a;stroke-width:1.3;paint-order:stroke}</style>
</defs>
<rect width="1536" height="1024" fill="#06121b"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#173f58"/>
<text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #166  장비 다음은 사람의 발 — 구역을 넘는 마지막 이동경로를 끊어라</text>
<text x="1110" y="49" class="t" fill="#d9f5ff" font-size="16" font-weight="800">BOOT TRACE · CLEAN ZONE · 人员动线</text>

<!-- PANEL 1 -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/>
 <rect x="16" y="330" width="746" height="182" fill="url(#dock)"/>
 <path d="M42 455h690" stroke="#f0d54d" stroke-width="10" stroke-dasharray="28 18"/>
 <text x="88" y="446" class="t" font-size="16" font-weight="1000" fill="#17384a">ZONE A</text><text x="628" y="446" class="t" font-size="16" font-weight="1000" fill="#17384a">ZONE B</text>
 <g transform="translate(238 404)" filter="url(#shadow)"><ellipse cy="-76" rx="28" ry="34" fill="#cf9673" stroke="#102631" stroke-width="4"/><path d="M-26-88q10-26 29-27q22 4 27 25l-18-7q-20 4-38 9" fill="#272727"/><rect x="-45" y="-34" width="90" height="115" rx="18" fill="#f0b33a" stroke="#102631" stroke-width="4"/><path d="M-36-5l-58 26M36-5l60-18" stroke="#f0b33a" stroke-width="17" stroke-linecap="round"/><path d="M-20 77v63M20 77v63" stroke="#27363c" stroke-width="18"/><path d="M-32 140h28M8 140h28" stroke="#111" stroke-width="15" stroke-linecap="round"/></g>
 <g transform="translate(528 408)" filter="url(#shadow)"><ellipse cy="-76" rx="28" ry="34" fill="#d8a17c" stroke="#102631" stroke-width="4"/><path d="M-27-87q8-25 27-27q23 3 28 24l-17-6q-19 5-38 9" fill="#4e382f"/><rect x="-45" y="-34" width="90" height="115" rx="18" fill="#3fa98c" stroke="#102631" stroke-width="4"/><path d="M-36-4l-52-22M36-4l58 28" stroke="#3fa98c" stroke-width="17" stroke-linecap="round"/><path d="M-20 77v63M20 77v63" stroke="#27363c" stroke-width="18"/><path d="M-32 140h28M8 140h28" stroke="#111" stroke-width="15" stroke-linecap="round"/></g>
 <rect x="38" y="103" width="672" height="109" rx="18" class="box"/>
 <text x="374" y="134" text-anchor="middle" class="t cap"><tspan x="374">F-3 지게차 경로를 막은 뒤에도 B구역 바닥에 새 미세 흔적이 하나 더 나타난다.</tspan><tspan x="374" dy="25" font-size="14">封锁F-3路线后，B区地面仍出现一条新的微量痕迹。</tspan><tspan x="374" dy="22" font-size="13">Even after F-3 is isolated, a fresh trace appears on the Zone B floor.</tspan></text>
 <path d="M371 221h330q15 0 15 15v62q0 15-15 15H548l-32 25 8-25H371q-15 0-15-15v-62q0-15 15-15z" class="bub"/>
 <text x="536" y="253" text-anchor="middle" class="t" font-size="17" font-weight="900"><tspan x="536">장비는 멈췄는데 흔적이 움직였다. 사람 동선까지 열어!</tspan><tspan x="536" dy="22" font-size="13">设备停了，痕迹还在动——查人员动线！</tspan></text>
 <text x="47" y="491" class="sfx">STOP THE GEAR! TRACE THE BOOTS!</text>
</g>

<!-- PANEL 2 -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#lab)"/>
 <rect x="810" y="236" width="672" height="239" rx="18" fill="#183847"/>
 <path d="M856 405C926 348 1006 393 1069 316S1235 283 1431 355" fill="none" stroke="#5bd3e9" stroke-width="9" stroke-dasharray="17 11" filter="url(#glow)"/>
 <circle cx="903" cy="370" r="16" fill="#ff765d"/><circle cx="1069" cy="316" r="16" fill="#ffd55d"/><circle cx="1240" cy="295" r="16" fill="#ffd55d"/><circle cx="1431" cy="355" r="16" fill="#62e2a2"/>
 <text x="903" y="402" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">BOOT B-12</text><text x="1069" y="348" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">ZONE A</text><text x="1240" y="327" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">LOCKER</text><text x="1431" y="387" text-anchor="middle" class="t" fill="#fff" font-size="13" font-weight="900">ZONE B</text>
 <rect x="842" y="258" width="213" height="78" rx="12" fill="#fff6cf" stroke="#b78324" stroke-width="5"/><text x="949" y="284" text-anchor="middle" class="t" font-size="13" font-weight="900">ACCESS LOG REPLAY</text><text x="949" y="315" text-anchor="middle" class="t" font-size="20" font-weight="1000" fill="#a35318">1 CROSS-ZONE</text>
 <rect x="798" y="103" width="666" height="109" rx="18" class="box"/>
 <text x="1131" y="134" text-anchor="middle" class="t cap"><tspan x="1131">출입기록을 되감자 작업자 B-12가 장화 교체 없이 A→탈의실→B구역을 이동했다.</tspan><tspan x="1131" dy="25" font-size="14">回放门禁记录：B-12未更换靴子，从A区经更衣室进入B区。</tspan><tspan x="1131" dy="22" font-size="13">Access logs show worker B-12 crossed A → locker → B without changing boots.</tspan></text>
 <path d="M1095 389h359q14 0 14 14v62q0 14-14 14h-187l-28 22 6-22h-150q-14 0-14-14v-62q0-14 14-14z" class="bub"/>
 <text x="1274" y="421" text-anchor="middle" class="t" font-size="17" font-weight="900"><tspan x="1274">B-12 동선 고정! 장화 바닥부터 채취!</tspan><tspan x="1274" dy="22" font-size="13">锁定B-12，先采靴底！</tspan></text>
 <text x="812" y="492" class="sfx">REPLAY! CROSS-ZONE! SWAB NOW!</text>
</g>

<!-- PANEL 3 -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#c8dce3"/>
 <rect x="42" y="708" width="692" height="253" rx="18" fill="#15384b"/>
 <rect x="65" y="742" width="204" height="172" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="167" y="771" text-anchor="middle" class="t" font-size="14" font-weight="900">BOOT B-12 SOLE</text><circle cx="167" cy="828" r="36" fill="#ffd1b5" stroke="#cc6c35" stroke-width="5"/><text x="167" y="836" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#a84422">TRACE+</text><text x="167" y="884" text-anchor="middle" class="t" font-size="12" font-weight="900">MATCHES ZONE B</text>
 <rect x="286" y="742" width="204" height="172" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="388" y="771" text-anchor="middle" class="t" font-size="14" font-weight="900">GLOVE B-12</text><circle cx="388" cy="828" r="36" fill="#c8f1d9" stroke="#35966a" stroke-width="5"/><text x="388" y="836" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#237450">NEG</text><text x="388" y="884" text-anchor="middle" class="t" font-size="12" font-weight="900">NO TRANSFER</text>
 <rect x="507" y="742" width="204" height="172" rx="14" fill="#fff" stroke="#3c8faa" stroke-width="5"/><text x="609" y="771" text-anchor="middle" class="t" font-size="14" font-weight="900">LOCKER FLOOR</text><circle cx="609" cy="828" r="36" fill="#ffd1b5" stroke="#cc6c35" stroke-width="5"/><text x="609" y="836" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#a84422">TRACE+</text><text x="609" y="884" text-anchor="middle" class="t" font-size="12" font-weight="900">BOOT PATH</text>
 <rect x="39" y="548" width="670" height="119" rx="18" class="box"/>
 <text x="374" y="579" text-anchor="middle" class="t cap"><tspan x="374">장화 밑창과 탈의실 바닥에서 같은 흔적. 장갑은 음성—전파 경로는 ‘발’로 확정된다.</tspan><tspan x="374" dy="25" font-size="14">靴底与更衣室地面出现同一痕迹，手套阴性——传播路径锁定为鞋底。</tspan><tspan x="374" dy="22" font-size="13">The boot sole and locker floor match; gloves are negative. The transfer route is the feet.</tspan></text>
 <path d="M60 674h316q15 0 15 15v56q0 15-15 15H211l-28 22 6-22H60q-15 0-15-15v-56q0-15 15-15z" class="bub"/>
 <text x="218" y="706" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="218">B구역 잠깐 폐쇄! 장화 교체선을 다시 만든다!</tspan><tspan x="218" dy="21" font-size="12">暂时关闭B区，重建换靴线！</tspan></text>
 <text x="51" y="988" class="sfx">MATCH! ISOLATE! BREAK THE FOOTPATH!</text>
</g>

<!-- PANEL 4 -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="#b8d5cd"/>
 <rect x="802" y="706" width="690" height="252" rx="18" fill="#f1f6f4" stroke="#2c6760" stroke-width="5"/>
 <rect x="831" y="744" width="175" height="160" rx="16" fill="#d7edf7" stroke="#28799d" stroke-width="5"/><text x="918" y="774" text-anchor="middle" class="t" font-size="15" font-weight="1000">DIRTY SIDE</text><path d="M866 812h104" stroke="#28799d" stroke-width="9"/><text x="918" y="851" text-anchor="middle" class="t" font-size="13" font-weight="900">REMOVE BOOTS</text><text x="918" y="878" text-anchor="middle" class="t" font-size="12">脱靴 / 장화 벗기</text>
 <rect x="1030" y="744" width="202" height="160" rx="16" fill="#fff6cf" stroke="#b78324" stroke-width="5"/><text x="1131" y="774" text-anchor="middle" class="t" font-size="15" font-weight="1000">CHANGE GATE</text><rect x="1061" y="802" width="140" height="48" rx="10" fill="#173f58"/><text x="1131" y="833" text-anchor="middle" class="t" fill="#fff" font-size="16" font-weight="1000">SCAN + CHANGE</text><text x="1131" y="880" text-anchor="middle" class="t" font-size="12">扫描后换靴 / 스캔 후 교체</text>
 <rect x="1256" y="744" width="205" height="160" rx="16" fill="#d9f1df" stroke="#35966a" stroke-width="5"/><text x="1358" y="774" text-anchor="middle" class="t" font-size="15" font-weight="1000">CLEAN SIDE</text><path d="M1300 812h116" stroke="#35966a" stroke-width="9"/><text x="1358" y="851" text-anchor="middle" class="t" font-size="13" font-weight="900">ZONE BOOTS ONLY</text><text x="1358" y="878" text-anchor="middle" class="t" font-size="12">专区靴 / 구역 전용</text>
 <rect x="798" y="548" width="666" height="119" rx="18" class="box"/>
 <text x="1131" y="579" text-anchor="middle" class="t cap"><tspan x="1131">구역별 전용 장화·일방향 교체 게이트·입장 스캔을 즉시 적용. 48시간 9/9 음성.</tspan><tspan x="1131" dy="25" font-size="14">立即实施分区专用靴、单向换靴闸机与入区扫描；48小时9/9阴性。</tspan><tspan x="1131" dy="22" font-size="13">Dedicated zone boots, one-way change gates and entry scans go live; 9/9 negative at 48h.</tspan></text>
 <path d="M820 674h358q15 0 15 15v57q0 15-15 15H992l-29 23 7-23H820q-15 0-15-15v-57q0-15 15-15z" class="bub"/>
 <text x="999" y="706" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="999">사람도 구역을 넘을 땐 ‘장화부터’ 바꾼다.</tspan><tspan x="999" dy="21" font-size="12">跨区先换靴。</tspan></text>
 <text x="815" y="988" class="sfx">CHANGE! SCAN! 9/9 NEGATIVE! ZERO CROSS-ZONE!</text>
</g>
</svg>