 <rect x="31" y="101" width="430" height="135" rx="22" fill="#fff" stroke="#111" stroke-width="4"/><text x="246" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="246">B-20 하구는 파도와 탁수에 계속 깎이고 있다.</tspan><tspan x="246" dy="25" font-size="14">B-20 河口仍受波浪和浑水侵蚀。</tspan><tspan x="246" dy="21" font-size="14">B-20 estuary is still being eroded by waves and turbid water.</tspan></text>
 <rect x="472" y="101" width="266" height="118" rx="24" fill="#fff5d8" stroke="#111" stroke-width="4"/><text x="605" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="605">이번엔 굴초가</tspan><tspan x="605" dy="23">파도를 받아 줄 거야!</tspan><tspan x="605" dy="21" font-size="14">让牡蛎礁来挡浪！</tspan><tspan x="605" dy="20" font-size="13">Let the oyster reef take the waves!</tspan></text>
 <text x="45" y="482" fill="#fff" stroke="#084461" stroke-width="5" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900" font-style="italic">SCAN!  MAP!  DEPLOY!</text>
</g>

