<text x="867" y="49" fill="#a8efff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="800">B-20 OYSTER REEF · 牡蛎礁生态防波堤 · LIVING BREAKWATER</text>

