 <text x="57" y="971" fill="#fff" stroke="#0b6071" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="49" font-weight="900" font-style="italic">FILTER!  SHELTER!  LIFE RETURNS!</text>
