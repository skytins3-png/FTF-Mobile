<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="FTF-01 scene 29 storm evacuation and recovery">
<defs>
  <linearGradient id="storm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset=".55" stop-color="#344a61"/><stop offset="1" stop-color="#73879a"/></linearGradient>
  <linearGradient id="rescue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#49697f"/><stop offset="1" stop-color="#153447"/></linearGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6bd71"/><stop offset=".55" stop-color="#9cc5ba"/><stop offset="1" stop-color="#496f58"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-opacity=".48"/></filter>
</defs>
<rect width="1080" height="1920" fill="#05090d"/>
<rect x="32" y="32" width="1016" height="1856" rx="26" fill="#0c1118" stroke="#f0f4f8" stroke-width="5"/>
<text x="60" y="88" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="900">FTF-01 · EARTH'S WARNING</text>
<text x="922" y="88" fill="#ffd56f" font-family="Arial,sans-serif" font-size="32" font-weight="900">29</text>

<!-- PANEL 1: emergency operations center during extreme rain -->
<g filter="url(#sh)">
  <rect x="56" y="122" width="968" height="470" rx="20" fill="url(#storm)" stroke="#fff" stroke-width="6"/>
  <path d="M56 430 L160 346 247 395 345 320 442 394 560 296 675 389 790 326 912 390 1024 342 1024 592 56 592Z" fill="#1d2a37"/>
  <path d="M90 210 l120 70 M180 160 l145 95 M305 175 l125 78 M460 145 l170 115 M620 165 l150 95 M770 150 l165 110" stroke="#b6d6eb" stroke-width="6" opacity=".65"/>
  <rect x="84" y="342" width="370" height="198" rx="10" fill="#111b24" stroke="#6f8ea4" stroke-width="4"/>
  <rect x="104" y="366" width="150" height="72" rx="8" fill="#26394b"/><path d="M116 418 C155 382 196 420 240 382" stroke="#ff8e65" stroke-width="8" fill="none"/>
  <rect x="274" y="366" width="154" height="72" rx="8" fill="#23384a"/><path d="M287 420 l30-32 25 18 31-42 35 36" stroke="#ffd35c" stroke-width="8" fill="none"/>
  <text x="108" y="478" fill="#ff7f73" font-size="22" font-family="Arial" font-weight="900">LANDSLIDE RISK ↑</text>
  <text x="108" y="510" fill="#c9deed" font-size="18" font-family="Arial">산사태 위험 · 山体滑坡风险</text>
  <circle cx="612" cy="392" r="48" fill="#d7a17d"/><path d="M568 386 Q611 331 660 385 Q642 346 610 340 Q581 344 566 367Z" fill="#222a32"/>
  <path d="M548 454 Q611 420 676 456 L701 566 H525Z" fill="#365f78"/><path d="M575 470 L611 495 651 469" fill="#e8f1f5"/>
  <circle cx="768" cy="413" r="42" fill="#e6b28d"/><path d="M729 408 Q768 360 811 407 Q796 372 767 367 Q741 370 727 391Z" fill="#593c2e"/>
  <path d="M718 466 Q768 439 820 469 L843 566 H699Z" fill="#9b5b45"/>
  <path d="M520 170 Q735 138 991 183 L970 300 Q736 327 541 286Z" fill="#fff" stroke="#10151b" stroke-width="6"/>
  <text x="550" y="214" fill="#111" font-size="25" font-family="Arial" font-weight="900">“산악마을 전원 대피. 지금 바로!”</text>
  <text x="550" y="252" fill="#333" font-size="20" font-family="Arial">“山区村庄全部撤离，立刻！”</text>
  <text x="550" y="282" fill="#4b4b4b" font-size="18" font-family="Arial">“Evacuate the mountain village—now!”</text>
  <text x="79" y="174" fill="#ffe5aa" font-size="23" font-family="Arial" font-weight="800">상황 · 기록적 폭우가 산사태 경보를 울린다.</text>
  <text x="79" y="203" fill="#d8e8f2" font-size="18" font-family="Arial">旁白 · 创纪录暴雨触发山体滑坡警报。 · Record rain triggers a landslide alert.</text>
  <text x="805" y="544" fill="#ffd45f" font-size="44" font-family="Arial" font-weight="900">BEEP! BEEP!</text>
</g>

<!-- PANEL 2: mountain village evacuation -->
<g filter="url(#sh)">
  <rect x="56" y="622" width="968" height="548" rx="20" fill="url(#rescue)" stroke="#fff" stroke-width="6"/>
