  <path d="M426 1587 Q474 1561 524 1589 L542 1748 H410Z" fill="#d79a55"/>
  <circle cx="646" cy="1519" r="43" fill="#d79f79"/><path d="M606 1514 Q646 1464 691 1512 Q676 1476 645 1472 Q619 1475 604 1497Z" fill="#202931"/>
  <path d="M594 1571 Q646 1542 700 1574 L721 1747 H576Z" fill="#496d4c"/>
  <path d="M344 1642 L411 1595 M505 1636 L558 1590 M681 1637 L743 1592" stroke="#7c5a38" stroke-width="14" stroke-linecap="round"/>
  <path d="M335 1653 q24-56 50 0 M497 1649 q23-50 47 0 M674 1650 q23-50 48 0" stroke="#2f7a49" stroke-width="9" fill="none"/>
  <path d="M99 1237 Q346 1208 682 1250 L661 1370 Q350 1399 119 1356Z" fill="#fff" stroke="#111" stroke-width="6"/>
  <text x="132" y="1282" fill="#111" font-size="26" font-family="Arial" font-weight="900">“끝난 게 아니야. 이제 복구하고, 더 강하게 대비한다.”</text>
  <text x="132" y="1320" fill="#333" font-size="20" font-family="Arial">“还没结束。现在修复，并为下一次做更强准备。”</text>
  <text x="132" y="1350" fill="#555" font-size="18" font-family="Arial">“It isn’t over. We rebuild—and prepare better for the next one.”</text>
  <rect x="90" y="1756" width="900" height="52" rx="9" fill="#07120e" opacity=".88"/>
  <text x="112" y="1791" fill="#fff2c7" font-size="23" font-family="Arial" font-weight="900">내레이션 · 경고를 기억하는 사회가 미래를 지킨다.</text>
  <text x="112" y="1821" fill="#dcefe4" font-size="17" font-family="Arial">记住警告的社会守护未来。 · A society that remembers the warning protects the future.</text>
  <text x="824" y="1712" fill="#fff0a5" font-size="46" font-family="Arial" font-weight="900">THUMP · SPLASH</text>
</g>
<text x="62" y="1876" fill="#8da7b7" font-family="Arial" font-size="20">FTF-01 · SCENE 29 · 폭우 경보, 대피, 복구</text>
</svg>