  <circle cx="230" cy="934" r="34" fill="#e5b18a"/><path d="M198 930 Q230 889 266 929 Q252 899 229 895 Q208 899 196 916Z" fill="#2b2a2b"/>
  <path d="M186 975 Q229 951 275 977 L291 1099 H169Z" fill="#e3c35b"/>
  <circle cx="322" cy="951" r="28" fill="#d69d76"/><path d="M296 947 Q322 913 352 946 Q342 921 321 919 Q303 922 294 935Z" fill="#46352d"/>
  <path d="M284 986 Q322 965 362 988 L377 1098 H269Z" fill="#58758a"/>
  <circle cx="706" cy="947" r="34" fill="#d8a17b"/><path d="M674 943 Q706 901 743 942 Q730 911 705 907 Q683 910 672 929Z" fill="#252c34"/>
  <path d="M661 990 Q706 965 752 992 L769 1104 H643Z" fill="#3d6b83"/>
  <circle cx="818" cy="959" r="26" fill="#f0bd98"/><path d="M794 955 Q819 923 848 954 Q838 931 818 928 Q801 930 792 944Z" fill="#6a4331"/>
  <path d="M784 991 Q818 973 854 993 L868 1084 H770Z" fill="#b95e4c"/>
  <path d="M632 706 Q825 676 987 718 L971 824 Q820 844 649 810Z" fill="#fff" stroke="#111" stroke-width="6"/>
  <text x="660" y="747" fill="#111" font-size="23" font-family="Arial" font-weight="900">“아이부터 차량에 태워요!”</text>
  <text x="660" y="781" fill="#333" font-size="18" font-family="Arial">“先让孩子上车！” · “Children first!”</text>
  <text x="84" y="666" fill="#eaf6ff" font-size="22" font-family="Arial" font-weight="800">상황 · 경보는 행동이 될 때 사람을 살린다.</text>
  <text x="84" y="697" fill="#d3e5ef" font-size="18" font-family="Arial">旁白 · 警报只有化为行动，才能救人。 · A warning saves lives only when it becomes action.</text>
  <text x="815" y="1131" fill="#ffea82" font-size="42" font-family="Arial" font-weight="900">RUMBLE—!</text>
</g>

<!-- PANEL 3: recovery at sunrise -->
<g filter="url(#sh)">
  <rect x="56" y="1200" width="968" height="636" rx="20" fill="url(#dawn)" stroke="#fff" stroke-width="6"/>
  <circle cx="865" cy="1342" r="82" fill="#ffe6a0" opacity=".95"/>
  <path d="M56 1542 Q190 1460 318 1530 T578 1510 T831 1522 T1024 1480 V1836 H56Z" fill="#3f735a"/>
