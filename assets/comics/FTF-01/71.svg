 <g transform="translate(390 285) scale(.9)"><circle r="34" fill="#efbd99" stroke="#152735" stroke-width="4"/><path d="M-34-6Q0-46 34-6V-30Q0-57-34-27Z" fill="#352720"/><rect x="-38" y="36" width="76" height="116" rx="24" fill="#153d59"/><rect x="-42" y="-11" width="84" height="39" rx="18" fill="#84e2f4" opacity=".55" stroke="#071722" stroke-width="5"/></g>
 <!-- turtle --> <g transform="translate(620 120) scale(.75)"><ellipse rx="70" ry="45" fill="#6f9d79" stroke="#173d45" stroke-width="5"/><ellipse cx="67" cy="-3" rx="28" ry="23" fill="#86b38b" stroke="#173d45" stroke-width="5"/><path d="M-35-27l-58-35 22 60zM-35 24l-55 40 25-58zM26-27l40-54 7 66zM25 24l45 46 3-63z" fill="#7bab85" stroke="#173d45" stroke-width="5"/></g>
 <rect class="narr" x="24" y="20" width="448" height="108" rx="8"/><text x="42" y="53" class="cap med">2. 산호초에 생명이 다시 모입니다</text><text x="42" y="82" class="body small">生命重新汇聚到珊瑚礁</text><text x="42" y="110" class="body small">Life is gathering around the reef again</text>
 <path class="bubble" d="M300 133h360q18 0 18 18v87q0 18-18 18H520l-28 32 5-32H300q-18 0-18-18v-87q0-18 18-18Z"/><text x="318" y="165" class="body small">어종 수가 지난 조사보다 크게 늘었어요!</text><text x="318" y="194" class="body small">鱼类种数比上次调查明显增加了！</text><text x="318" y="223" class="body small">Fish diversity is clearly increasing!</text>
 <text x="498" y="445" class="sfx big" fill="#87ffaf">MORE LIFE!</text>
</g>
<!-- PANEL 3 : nursery check -->
<g transform="translate(0 510)">
 <rect class="panel" x="4" y="4" width="758" height="510" rx="8" fill="url(#water)"/>
