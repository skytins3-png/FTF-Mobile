<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 #71 — 돌아오는 생명, 이어지는 미래</title>
<desc id="desc">Four-panel cinematic manga-style continuation after FTF-01 scene 70. A real illustrated ocean-research team confirms returning sea turtles and fish, checks young corals in the nursery, records the reef recovery, and commits to expanding the protected restoration zone. Korean, Chinese and English narration, speech bubbles and visual sound effects.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75d8ff"/><stop offset=".55" stop-color="#dff7ff"/><stop offset="1" stop-color="#fff3d0"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#13b6dc"/><stop offset=".45" stop-color="#087eb0"/><stop offset="1" stop-color="#06385f"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb64a"/><stop offset=".45" stop-color="#ff715e"/><stop offset="1" stop-color="#283c6f"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>
 <style>
 .panel{stroke:#07131e;stroke-width:8}.narr{fill:#fffdf4;stroke:#142739;stroke-width:4}.bubble{fill:#fff;stroke:#142739;stroke-width:4}.cap{font-family:Arial,'Noto Sans KR',sans-serif;font-weight:900;fill:#10243a}.body{font-family:Arial,'Noto Sans KR',sans-serif;font-weight:700;fill:#10243a}.sfx{font-family:Arial,'Noto Sans KR',sans-serif;font-weight:1000;font-style:italic;paint-order:stroke;stroke:#08131f;stroke-width:8;stroke-linejoin:round}.white{fill:#fff}.small{font-size:20px}.med{font-size:28px}.big{font-size:48px}.huge{font-size:58px}
 </style>
</defs>
<!-- PANEL 1 : survey boat / returning wildlife -->
<g>
