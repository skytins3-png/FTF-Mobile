 <g transform="translate(500 330)"><circle r="32" fill="#efbf9b"/><rect x="-38" y="35" width="76" height="137" rx="18" fill="#f2f5f6"/><path d="M-32-7Q0-45 32-7V-29Q0-57-32-27Z" fill="#30231f"/></g>
 <path d="M200 386Q270 430 346 386Q420 433 496 386" stroke="#efbf9b" stroke-width="15" fill="none" stroke-linecap="round" opacity=".9"/>
 <rect class="narr" x="22" y="20" width="465" height="120" rx="8"/><text x="40" y="53" class="cap med">4. 복원 구역을 더 넓게 이어갑니다</text><text x="40" y="82" class="body small">让恢复区域延伸得更远</text><text x="40" y="110" class="body small">Expanding the restoration zone together</text>
 <path class="bubble" d="M250 145h430q18 0 18 18v95q0 18-18 18H510l-28 33 3-33H250q-18 0-18-18v-95q0-18 18-18Z"/><text x="269" y="178" class="body small">오늘 돌아온 생명이 내일의 바다를 만듭니다.</text><text x="269" y="207" class="body small">今天回归的生命，创造明天的海洋。</text><text x="269" y="236" class="body small">Life returning today builds tomorrow’s ocean.</text>
 <text x="334" y="467" class="sfx huge" fill="#91f7ff">TOGETHER, BRIGHTER TOMORROW!</text>
</g>
