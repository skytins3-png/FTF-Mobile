 <rect class="narr" x="22" y="20" width="448" height="108" rx="8"/><text x="40" y="53" class="cap med">3. 어린 산호의 성장도 기록합니다</text><text x="40" y="82" class="body small">记录幼小珊瑚的成长</text><text x="40" y="110" class="body small">Recording the growth of young corals</text>
 <path class="bubble" d="M112 132h414q18 0 18 18v88q0 18-18 18H346l-28 31 4-31H112q-18 0-18-18v-88q0-18 18-18Z"/><text x="129" y="164" class="body small">정착률이 좋아요. 이제 더 넓은 구역으로 옮길 수 있어요.</text><text x="129" y="193" class="body small">附着率很好，可以扩大恢复区域了。</text><text x="129" y="222" class="body small">Settlement is strong—we can expand restoration.</text>
 <text x="485" y="463" class="sfx big" fill="#ffea76">GROW! RECORD!</text>
</g>
