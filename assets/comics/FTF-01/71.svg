 <path d="M0 268Q118 236 232 268T470 262T762 254V504H0Z" fill="#1594c3"/>
 <path d="M0 320Q135 285 265 322T520 314T762 304V504H0Z" fill="#086a9b" opacity=".9"/>
 <!-- island --> <path d="M8 272Q76 190 140 225Q190 168 255 244L290 275Z" fill="#446f5e"/><path d="M30 250Q84 201 125 226Q164 190 208 248Z" fill="#6ca66e"/>
 <!-- research vessel -->
 <g filter="url(#shadow)"><path d="M402 164h285l-42 65H432Z" fill="#f2f6f8" stroke="#162b3a" stroke-width="5"/><rect x="482" y="105" width="126" height="63" rx="6" fill="#e9f8ff" stroke="#162b3a" stroke-width="5"/><rect x="515" y="75" width="8" height="30" fill="#1b3546"/><path d="M523 76l66 20h-66z" fill="#168db5"/><text x="454" y="205" class="cap small">FTF OCEAN RESEARCH</text></g>
 <!-- researchers -->
 <g transform="translate(180 302)"><circle cx="0" cy="0" r="38" fill="#efc09d" stroke="#152735" stroke-width="4"/><path d="M-38-8Q0-54 38-8V-30Q3-65-38-28Z" fill="#2b211f"/><path d="M-46 48Q0 26 47 48L58 160H-58Z" fill="#eaf3f7" stroke="#152735" stroke-width="4"/><path d="M-10 46h20v92h-20z" fill="#153f5d"/><path d="M45 75Q90 67 124 29" stroke="#efc09d" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="126" cy="27" r="10" fill="#efc09d"/></g>
 <g transform="translate(318 316)"><circle cx="0" cy="0" r="36" fill="#d8a27f" stroke="#152735" stroke-width="4"/><path d="M-36-5Q0-46 36-5V-28Q0-58-36-27Z" fill="#171d24"/><rect x="-44" y="42" width="88" height="126" rx="18" fill="#193b56" stroke="#152735" stroke-width="4"/><rect x="-22" y="73" width="44" height="25" rx="4" fill="#0e2233"/><circle cx="-9" cy="85" r="7" fill="#77d9f0"/><circle cx="10" cy="85" r="7" fill="#77d9f0"/><path d="M32 68l58-25" stroke="#d8a27f" stroke-width="13" stroke-linecap="round"/><circle cx="91" cy="42" r="9" fill="#d8a27f"/></g>
 <!-- turtle surface -->
 <g transform="translate(625 332) scale(.72)"><ellipse cx="0" cy="0" rx="70" ry="45" fill="#5a8e75" stroke="#193a42" stroke-width="5"/><ellipse cx="67" cy="-3" rx="28" ry="23" fill="#79ad87" stroke="#193a42" stroke-width="5"/><path d="M-35-27l-55-38 20 60zM-35 24l-55 40 23-58zM26-27l38-55 8 68zM25 24l43 48 4-64z" fill="#78a984" stroke="#193a42" stroke-width="5"/></g>
 <rect class="narr" x="22" y="20" width="414" height="108" rx="8"/><text x="40" y="53" class="cap med">1. 돌아온 친구들이 보입니다</text><text x="40" y="82" class="body small">回来的朋友们出现了</text><text x="40" y="110" class="body small">Our returning friends are in sight</text>
 <path class="bubble" d="M100 136h335q18 0 18 18v91q0 18-18 18H272l-25 31 3-31H100q-18 0-18-18v-91q0-18 18-18Z"/><text x="117" y="169" class="body small">저기 봐요! 거북이가 다시 왔어요!</text><text x="117" y="198" class="body small">快看！海龟又回来了！</text><text x="117" y="227" class="body small">Look! The turtle is back!</text>
 <text x="500" y="448" class="sfx big" fill="#ffe96e">WELCOME BACK!</text>
</g>
