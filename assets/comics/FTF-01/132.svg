 <rect x="38" y="544" width="500" height="114" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="288" y="574" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="288">비 예보 전에는 진공 청소차가 남은 검은 입자를 먼저 회수한다.</tspan><tspan x="288" dy="24" font-size="14">降雨前，真空清扫车先回收残留的黑色道路颗粒。</tspan><tspan x="288" dy="22" font-size="13">Before rain, vacuum sweepers collect residual road particles first.</tspan></text>
 <rect x="553" y="545" width="181" height="94" rx="22" fill="#dff7ff" stroke="#111" stroke-width="4"/>
 <text x="643" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="643">빗물보다 먼저!</tspan><tspan x="643" dy="21" font-size="13">抢在雨水之前！</tspan><tspan x="643" dy="19" font-size="12">Beat the rain!</tspan></text>
 <text x="41" y="980" fill="#fff" stroke="#9b5e08" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">VRRROOOM!  SUCK!  CAPTURE!</text>
</g>

