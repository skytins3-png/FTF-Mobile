<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #132  도시의 모든 바퀴를 바꾸다</text>
<text x="895" y="49" fill="#c9fbff" font-family="Arial" font-size="18" font-weight="800">B-35 CITY FLEET SCALE-UP · 城市车队源头减排</text>

<!-- PANEL 1: fleet depot audit -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="10" fill="url(#depot)"/>
 <rect x="36" y="265" width="706" height="221" fill="#c6d1d6" stroke="#526770" stroke-width="5"/>
