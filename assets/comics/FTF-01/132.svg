 <rect x="1197" y="545" width="300" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1347" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="1347">배수구에서 막고, 바퀴에서 줄이고, 비 오기 전에 회수했다.</tspan><tspan x="1347" dy="23" font-size="13">在排水口拦截、从轮胎减量、在降雨前回收。</tspan><tspan x="1347" dy="21" font-size="12">Trap it, reduce it at the wheel, collect it before rain.</tspan></text>
 <rect x="824" y="798" width="326" height="93" rx="20" fill="#eaffdb" stroke="#111" stroke-width="4"/>
 <text x="987" y="828" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="987">한 지점의 실험이 도시의 기준이 됐다.</tspan><tspan x="987" dy="21" font-size="13">一个试点，变成整座城市的标准。</tspan><tspan x="987" dy="19" font-size="12">One pilot became a city standard.</tspan></text>
 <text x="808" y="980" fill="#fff" stroke="#075064" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">VERIFY!  SCALE!  PROTECT THE BAY!</text>
</g>
