 <g filter="url(#shadow)"><ellipse cx="603" cy="282" rx="37" ry="43" fill="#efbb94" stroke="#10212b" stroke-width="5"/><path d="M570 274q9-33 35-39q30 7 35 39z" fill="#31383d"/><path d="M563 345q42-25 83 0l27 103H535z" fill="#edf7f8" stroke="#10212b" stroke-width="5"/><path d="M569 361q-54 10-104 35" stroke="#edf7f8" stroke-width="22" stroke-linecap="round"/></g>
 <g filter="url(#shadow)"><ellipse cx="691" cy="307" rx="33" ry="39" fill="#d89c70" stroke="#10212b" stroke-width="5"/><path d="M661 300q8-30 31-36q28 6 34 36z" fill="#48362f"/><path d="M655 363q37-22 75 0l24 86H631z" fill="#176777" stroke="#10212b" stroke-width="5"/></g>
 <g transform="translate(421 386)"><rect width="272" height="79" rx="12" fill="#122f3e" stroke="#7fe8ee" stroke-width="4"/><text x="18" y="29" fill="#d6fbff" font-family="Arial" font-size="14" font-weight="900">FLEET TIRE AUDIT</text><text x="18" y="58" fill="#80f0b6" font-family="Arial" font-size="24" font-weight="900">68 VEHICLES → LOW-WEAR</text></g>
 <rect x="38" y="103" width="496" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="286" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="286">시험이 끝났다면 이제 도시 차량 전체로 확대한다.</tspan><tspan x="286" dy="24" font-size="14">试验结束后，把低磨耗方案扩展到整支城市车队。</tspan><tspan x="286" dy="22" font-size="13">The pilot worked. Now scale low-wear tires across the city fleet.</tspan></text>
 <rect x="547" y="104" width="185" height="94" rx="22" fill="#fff1bd" stroke="#111" stroke-width="4"/>
 <text x="639" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="639">버스부터 바꾼다!</tspan><tspan x="639" dy="21" font-size="13">先从公交开始！</tspan><tspan x="639" dy="19" font-size="12">Start with the fleet!</tspan></text>
 <text x="40" y="486" fill="#fff" stroke="#0c6179" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="32" font-weight="900">CHECK!  TAG!  SWAP!</text>
</g>

<!-- PANEL 2: operating controls -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="10" fill="url(#sky)"/>
