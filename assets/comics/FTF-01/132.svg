 <g filter="url(#shadow)"><ellipse cx="1421" cy="231" rx="35" ry="41" fill="#efb88f" stroke="#10212b" stroke-width="5"/><path d="M1389 224q9-31 33-37q29 6 34 37z" fill="#2f393f"/><path d="M1383 292q39-24 78 0l26 96h-130z" fill="#f0f7f8" stroke="#10212b" stroke-width="5"/><path d="M1388 309q-49 9-95 35" stroke="#f0f7f8" stroke-width="21" stroke-linecap="round"/></g>
 <rect x="795" y="103" width="482" height="114" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1036" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1036">적정 공기압과 완만한 가감속까지 함께 관리해 마모를 더 줄인다.</tspan><tspan x="1036" dy="24" font-size="14">同时管理胎压与平稳加减速，进一步减少磨耗。</tspan><tspan x="1036" dy="22" font-size="13">Correct pressure and smoother driving cut wear even further.</tspan></text>
 <rect x="1288" y="103" width="208" height="94" rx="22" fill="#eaffdb" stroke="#111" stroke-width="4"/>
 <text x="1392" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1392">운전도 방어선이다!</tspan><tspan x="1392" dy="21" font-size="13">驾驶也是防线！</tspan><tspan x="1392" dy="19" font-size="12">Driving is a barrier too!</tspan></text>
 <text x="800" y="486" fill="#fff" stroke="#4d641a" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="32" font-weight="900">ROLL SMOOTH!  WEAR LESS!</text>
</g>

