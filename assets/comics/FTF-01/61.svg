<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #61 — 해양보호구역, 생명이 돌아오는 경계선</title>
<desc id="d">Four-panel cinematic manga-style scene continuing FTF-01: researchers plan a marine protected area after the ghost-net cleanup, divers install boundary buoys and reef-safe markers, the reef is monitored over time, and fish, rays and a sea turtle return. Includes illustrated people, research vessel, divers, coral reef, speech bubbles, narration in Korean Chinese English, and visual sound effects.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65c6ef"/><stop offset=".52" stop-color="#d7f4ff"/><stop offset="1" stop-color="#ffd37e"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#13aee0"/><stop offset=".55" stop-color="#08759f"/><stop offset="1" stop-color="#05364f"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1589b3"/><stop offset=".5" stop-color="#075f84"/><stop offset="1" stop-color="#02283c"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb45e"/><stop offset=".42" stop-color="#ffc77b"/><stop offset="1" stop-color="#5f8ea8"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffce2"/><stop offset=".62" stop-color="#ffd56b"/><stop offset="1" stop-color="#f39c45"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".42"/></filter>
 <style>.panel{stroke:#071722;stroke-width:10}.box{fill:#fffdf3;stroke:#10232f;stroke-width:4}.bubble{fill:#fff;stroke:#10232f;stroke-width:4}.ko{font:700 24px 'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#101820}.zh{font:600 19px 'Noto Sans SC','Microsoft YaHei',Arial,sans-serif;fill:#15435c}.en{font:600 18px Arial,sans-serif;fill:#132935}.sfx{font:900 45px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.skin{fill:#e7aa83;stroke:#683f32;stroke-width:2}.hair{fill:#18242d}.suit{fill:#103e5b;stroke:#062638;stroke-width:4}.reefA{fill:#ef7662;stroke:#762e30;stroke-width:3}.reefB{fill:#f1c44f;stroke:#74591f;stroke-width:3}.reefC{fill:#9d79e2;stroke:#4b3971;stroke-width:3}.reefD{fill:#57c095;stroke:#24684e;stroke-width:3}.label{font:800 18px Arial,sans-serif;fill:#0d3852}</style>
</defs>
<!-- PANEL 1: MPA PLAN -->
<g>
 <rect class="panel" x="4" y="4" width="760" height="500" fill="url(#sky)"/>
 <circle cx="691" cy="76" r="50" fill="url(#sun)"/>
 <path d="M4 338Q130 295 276 333T760 322V500H4Z" fill="#0b82aa"/><path d="M4 390Q150 350 315 391T760 370V500H4Z" fill="#075d7e" opacity=".78"/>
 <path d="M470 295q42-70 92-55q45 11 72 57q40-49 88-8v45H470Z" fill="#4c8f65" opacity=".95"/>
 <!-- research vessel -->
 <g transform="translate(430 230)" filter="url(#shadow)"><path d="M-105 90h290l-32 65H-72Z" fill="#f4f5f0" stroke="#183744" stroke-width="5"/><path d="M2 10h110v83H2Z" fill="#fff0d6" stroke="#183744" stroke-width="4"/><path d="M111 48h52l26 45h-78Z" fill="#c9ecf4" stroke="#183744" stroke-width="4"/><path d="M46 9V-55M46-55l55 30" stroke="#183744" stroke-width="5"/><rect x="-50" y="112" width="112" height="14" fill="#36a8cc"/></g>
 <!-- female scientist -->
 <g transform="translate(70 214)" filter="url(#shadow)"><ellipse class="skin" cx="62" cy="52" rx="40" ry="45"/><path class="hair" d="M20 52Q20 5 61 2q46 3 46 57q-28-20-49-16q-22 2-38 9"/><path d="M12 105q50-26 102 4l16 133H-4Z" fill="#d8677f" stroke="#18313c" stroke-width="4"/><path d="M110 137q77-6 140 34" stroke="#e7aa83" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <!-- male ranger -->
 <g transform="translate(230 220)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="51" rx="38" ry="43"/><path class="hair" d="M18 47Q24 4 58 2q39 2 42 49q-24-15-43-12q-20 2-39 8"/><path class="suit" d="M7 102q50-22 100 6l18 133H-4Z"/><path d="M37 21h49l16 20H20Z" fill="#173e56"/><text x="20" y="150" fill="#d8f2ff" font-size="16" font-weight="800">OCEAN TEAM</text></g>
 <!-- child -->
 <g transform="translate(340 264)" filter="url(#shadow)"><ellipse class="skin" cx="42" cy="38" rx="29" ry="32"/><path class="hair" d="M13 36Q15 5 42 4q31 2 31 36q-17-13-30-10q-16 0-30 6"/><path d="M8 73q34-17 69 4l10 94H-3Z" fill="#f0a833" stroke="#744d1c" stroke-width="3"/></g>
 <!-- map table -->
 <g transform="translate(225 365)" filter="url(#shadow)"><path d="M0 0h330l34 108H-25Z" fill="#eef4df" stroke="#173846" stroke-width="5"/><path d="M25 17q62-38 110 7q58-32 112 9q38-24 72 8" fill="none" stroke="#4a9f6d" stroke-width="13"/><ellipse cx="197" cy="62" rx="70" ry="31" fill="none" stroke="#e34c49" stroke-width="6" stroke-dasharray="12 8"/><text x="151" y="68" font-size="20" font-weight="900" fill="#d53a39">MPA ZONE</text></g>
 <rect class="box" x="18" y="18" width="500" height="142" rx="8"/><text x="38" y="51" class="ko">폐그물을 걷어낸 뒤, 연구팀은 산호초의 다음 위험을 지도에 표시합니다.</text><text x="38" y="84" class="ko">이제 이곳을 ‘해양보호구역(MPA)’으로 지킬 차례입니다.</text><text x="38" y="115" class="zh">清除废弃渔网后，研究团队把新的风险标在地图上。</text><text x="38" y="146" class="en">After the cleanup, the team plans a Marine Protected Area.</text>
 <path class="bubble" d="M517 41h221q16 0 16 16v108q0 16-16 16H633l-30 32 7-32h-93q-16 0-16-16V57q0-16 16-16Z"/><text x="535" y="80" class="ko">산호가 쉴 수 있는 안전한 경계를 만들어요!</text><text x="535" y="115" class="zh">给珊瑚留下一片安全的海域！</text><text x="535" y="149" class="en">Let's give the reef a safe boundary!</text>
 <text x="34" y="472" class="sfx" fill="#37d7ff">PLAN! PROTECT! TOGETHER!</text>
</g>
<!-- PANEL 2: INSTALL BOUNDARY -->
<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" fill="url(#deep)"/>
 <g opacity=".25" stroke="#eaffff" stroke-width="5"><path d="M80 0L15 292M240 0L150 302M410 0L300 305M590 0L458 300M744 0L625 292"/></g>
 <path d="M4 405Q140 355 310 394T760 371V500H4Z" fill="#876f56"/>
 <!-- buoy -->
 <g transform="translate(372 80)" filter="url(#shadow)"><ellipse cx="70" cy="55" rx="58" ry="67" fill="#f3c529" stroke="#664f12" stroke-width="6"/><rect x="58" y="-40" width="24" height="42" rx="8" fill="#d4473f"/><rect x="28" y="114" width="84" height="36" rx="10" fill="#f0be23" stroke="#664f12" stroke-width="5"/><text x="33" y="52" font-size="28" font-weight="900" fill="#113950">MPA</text><text x="22" y="80" font-size="14" font-weight="800" fill="#113950">보호구역 / 保护区</text><path d="M69 149v94" stroke="#d6be79" stroke-width="10"/><path d="M69 243q-22 43-50 67M69 243q25 43 57 68" stroke="#8f7a4f" stroke-width="8"/></g>
 <!-- two divers -->
 <g transform="translate(90 225)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="43" width="82" height="32" rx="14" fill="#c9f6ff" stroke="#163949" stroke-width="4"/><path d="M10 100q49-23 96 7l18 129H0Z" fill="#d75e78" stroke="#17313b" stroke-width="4"/><path d="M98 133q70 2 116 40" stroke="#e7aa83" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(552 226)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="43" width="82" height="32" rx="14" fill="#c9f6ff" stroke="#163949" stroke-width="4"/><path class="suit" d="M10 100q49-23 96 7l18 129H0Z"/><path d="M10 134q-69-1-112 36" stroke="#e7aa83" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <!-- reef -->
 <g transform="translate(20 383)"><path class="reefA" d="M20 110q-13-38 15-67q-4 34 15 34q9-45 36-63q-10 48 7 51q16-36 37-47q-12 55 10 84Z"/><path class="reefB" d="M116 112q-7-46 20-68q0 34 18 29q7-45 31-55q-7 44 9 49q18-36 37-37q-15 51-2 76Z"/><path class="reefC" d="M585 110q-8-42 20-68q0 38 18 31q8-42 31-55q-6 46 11 48q15-33 37-36q-12 48-3 77Z"/></g>
 <rect class="box" x="18" y="18" width="500" height="136" rx="8"/><text x="38" y="51" class="ko">잠수사들은 산호를 건드리지 않는 지점에 부표와 경계표식을 고정합니다.</text><text x="38" y="84" class="ko">낚시·투묘 금지 구역이 한눈에 보이도록 표시합니다.</text><text x="38" y="114" class="zh">潜水员把浮标和边界标志固定在不伤害珊瑚的位置。</text><text x="38" y="144" class="en">Divers mark the reef-safe MPA boundary without touching coral.</text>
 <path class="bubble" d="M532 39h208q16 0 16 16v105q0 16-16 16H637l-27 31 5-31h-83q-16 0-16-16V55q0-16 16-16Z"/><text x="548" y="80" class="ko">경계 확인! 산호에서 충분히 떨어졌어요.</text><text x="548" y="115" class="zh">边界确认！离珊瑚足够远。</text><text x="548" y="147" class="en">Boundary clear—safe distance from coral!</text>
 <text x="454" y="466" class="sfx" fill="#ffd63b">MARK! SAFE! MPA!</text>
</g>
<!-- PANEL 3: MONITORING / RETURN -->
<g transform="translate(0 512)">
 <rect class="panel" x="4" y="4" width="760" height="508" fill="url(#deep)"/>
 <path d="M4 402Q145 350 305 389T760 361V508H4Z" fill="#89745d"/>
 <!-- before-after divider -->
 <path d="M360 10l-55 486" stroke="#bff7ff" stroke-width="7" opacity=".9"/>
 <g opacity=".42"><path d="M18 420q40-82 98-75q45 4 82 65q42-53 93-26v112H18Z" fill="#554f48"/><path d="M55 365q-12-59 18-83q6 52 24 41q5-48 32-70q-9 61 11 59q18-47 45-55q-14 65 11 101" fill="none" stroke="#9aa4a5" stroke-width="12"/></g>
 <!-- healthy reef -->
 <g transform="translate(360 318)"><path class="reefA" d="M10 172q-15-65 20-106q0 55 22 43q11-68 42-91q-9 70 12 67q22-57 48-65q-11 77 8 137Z"/><path class="reefB" d="M105 174q-8-62 25-97q2 53 22 42q8-64 39-91q-5 68 15 66q22-53 50-61q-14 75 2 127Z"/><path class="reefC" d="M218 173q-8-58 24-95q0 52 20 41q10-64 40-86q-9 68 13 65q20-52 46-61q-11 70 3 122Z"/><path class="reefD" d="M325 170q-10-56 21-91q3 47 21 38q9-58 36-79q-7 62 12 60q18-45 42-55q-8 63 2 110Z"/></g>
 <!-- turtle -->
 <g transform="translate(490 180)" filter="url(#shadow)"><ellipse cx="93" cy="72" rx="70" ry="48" fill="#8fb574" stroke="#36513a" stroke-width="5"/><path d="M44 58q47-40 98 3q-17 46-50 53q-35-10-48-56" fill="#a8ca88" stroke="#3d583c" stroke-width="4"/><circle cx="165" cy="67" r="28" fill="#aacb89" stroke="#3d583c" stroke-width="4"/><circle cx="174" cy="62" r="4" fill="#101820"/><path d="M40 79l-50 28 42 15M113 111l34 39 22-42" fill="#9dc17f" stroke="#3d583c" stroke-width="4"/></g>
 <!-- fish -->
 <g fill="#f5b52a" stroke="#6c4b17" stroke-width="3"><path d="M442 236q35-23 65 0q-29 25-65 0l-22 15 4-30Z"/><path d="M625 284q28-20 54 0q-26 21-54 0l-18 12 3-24Z"/><path d="M538 330q31-20 58 0q-26 23-58 0l-20 13 3-25Z"/></g>
 <rect class="box" x="18" y="18" width="498" height="137" rx="8"/><text x="38" y="51" class="ko">시간이 지나자 경계 안쪽의 부서진 산호 가지에서 새싹이 자랍니다.</text><text x="38" y="84" class="ko">물고기와 거북이도 조용한 산호초로 다시 돌아옵니다.</text><text x="38" y="114" class="zh">随着时间推移，珊瑚重新生长，鱼群和海龟也回来了。</text><text x="38" y="144" class="en">Over time, coral regrows and marine life returns inside the MPA.</text>
 <text x="70" y="200" class="label">보호 전 / 保护前 / BEFORE</text><text x="472" y="200" class="label" fill="#d7fbff">보호 후 / 保护后 / AFTER</text>
 <text x="405" y="468" class="sfx" fill="#77f3b3">LIFE RETURNS!</text>
</g>
<!-- PANEL 4: BRIGHTER TOMORROW -->
<g transform="translate(768 512)">
 <rect class="panel" x="4" y="4" width="764" height="508" fill="url(#sunset)"/>
 <circle cx="646" cy="118" r="52" fill="url(#sun)"/>
 <path d="M4 282Q120 235 248 276T760 264V508H4Z" fill="#0c82a7"/><path d="M4 351Q145 315 312 353T760 332V508H4Z" fill="#075c7b" opacity=".85"/>
 <path d="M495 239q45-76 101-57q35 10 62 47q45-39 92 2v50H495Z" fill="#4a8960"/>
 <!-- team on deck -->
 <g transform="translate(58 250)" filter="url(#shadow)"><ellipse class="skin" cx="61" cy="49" rx="39" ry="44"/><path class="hair" d="M20 47Q20 5 60 2q45 3 46 55q-27-18-48-15q-22 2-38 5"/><path d="M10 100q50-23 99 6l18 144H-3Z" fill="#d8677f" stroke="#17313b" stroke-width="4"/><path d="M105 135q62-33 122-17" stroke="#e7aa83" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(220 262)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="51" rx="38" ry="43"/><path class="hair" d="M18 47Q24 4 58 2q39 2 42 49q-24-15-43-12q-20 2-39 8"/><path class="suit" d="M7 102q50-22 100 6l18 140H-4Z"/><path d="M90 125q48-42 84-65" stroke="#e7aa83" stroke-width="15" fill="none" stroke-linecap="round"/><circle cx="179" cy="57" r="8" fill="#e7aa83"/></g>
 <g transform="translate(350 287)" filter="url(#shadow)"><ellipse class="skin" cx="42" cy="38" rx="29" ry="32"/><path class="hair" d="M13 36Q15 5 42 4q31 2 31 36q-17-13-30-10q-16 0-30 6"/><path d="M8 73q34-17 69 4l10 112H-3Z" fill="#f0a833" stroke="#744d1c" stroke-width="3"/><path d="M70 94q44-39 76-56" stroke="#e7aa83" stroke-width="13" fill="none" stroke-linecap="round"/></g>
 <!-- distant rays and turtle silhouettes are animals, allowed as environmental background -->
 <path d="M430 205q36-27 78 0q-18 28-38 30q-22-2-40-30M548 176q28-22 61 0q-16 23-30 25q-17-3-31-25" fill="#174f62" opacity=".7"/>
 <g transform="translate(548 325)"><ellipse cx="76" cy="52" rx="57" ry="38" fill="#91b574" stroke="#36513a" stroke-width="4"/><circle cx="135" cy="49" r="22" fill="#aacb89" stroke="#3d583c" stroke-width="4"/><path d="M35 59l-42 22 36 12M94 84l28 31 18-31" fill="#9dc17f" stroke="#3d583c" stroke-width="4"/></g>
 <rect class="box" x="18" y="18" width="500" height="137" rx="8"/><text x="38" y="51" class="ko">보호구역은 금지선이 아니라, 바다가 스스로 회복할 시간을 주는 약속입니다.</text><text x="38" y="84" class="ko">오늘 지킨 산호초가 내일 더 많은 생명을 품습니다.</text><text x="38" y="114" class="zh">保护区不是一道禁线，而是给海洋恢复时间的约定。</text><text x="38" y="144" class="en">An MPA gives the ocean time to heal—and life room to return.</text>
 <path class="bubble" d="M525 37h218q16 0 16 16v108q0 16-16 16H641l-28 31 5-31h-93q-16 0-16-16V53q0-16 16-16Z"/><text x="543" y="77" class="ko">지켜낸 바다, 함께 만드는 더 밝은 내일!</text><text x="543" y="112" class="zh">守护海洋，一起创造更明亮的未来！</text><text x="543" y="147" class="en">Protected ocean, brighter tomorrow—together!</text>
 <text x="356" y="472" class="sfx" fill="#ffe04d">HEALTHY OCEAN! BRIGHTER TOMORROW!</text>
</g>
</svg>