 <text x="1333" y="581" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="1333">붙은 뒤 독하게 벗기는 대신,</tspan><tspan x="1333" dy="22">붙기 전에 부드럽게 관리한다.</tspan><tspan x="1333" dy="20" font-size="13">与其重度清除，不如提前轻柔维护。</tspan><tspan x="1333" dy="18" font-size="12">Prevent early, clean gently.</tspan></text>
 <text x="808" y="971" fill="#fff" stroke="#0c6179" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">VERIFY!  PREVENT!  PROTECT THE BAY!</text>
