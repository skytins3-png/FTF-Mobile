 <text x="326" y="282" text-anchor="middle" fill="#18323b" font-family="Arial" font-size="21" font-weight="900">FTF HARBOR SERVICE 07</text>
 <g opacity=".96"><circle cx="181" cy="407" r="8" fill="#704f37"/><circle cx="219" cy="390" r="7" fill="#5f8d51"/><circle cx="267" cy="420" r="9" fill="#77513a"/><circle cx="308" cy="398" r="6" fill="#5f8d51"/><circle cx="351" cy="427" r="8" fill="#6e533c"/></g>
