 <g fill="#d8f6ff" stroke="#176987" stroke-width="4"><path d="M141 907q38-24 70 0q-36 28-70 0z"/><path d="M267 946q34-22 64 0q-33 25-64 0z"/><path d="M392 894q32-20 60 0q-30 23-60 0z"/></g>
 <rect x="38" y="543" width="492" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="284" y="573" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="284">닦아낸 생물 조각은 그대로 바다에 버리지 않고 회수 필터로 모아 육상 처리한다.</tspan><tspan x="284" dy="24" font-size="14">清除下来的生物碎屑不直接排入海里，而是过滤回收后送上岸处理。</tspan><tspan x="284" dy="22" font-size="13">Removed biofouling is captured by filters and taken ashore instead of released at sea.</tspan></text>
 <rect x="548" y="543" width="188" height="94" rx="22" fill="#dffcff" stroke="#111" stroke-width="4"/>
 <text x="642" y="573" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="642">닦은 것도 회수해!</tspan><tspan x="642" dy="21" font-size="13">清下来的也要回收！</tspan><tspan x="642" dy="19" font-size="12">Capture what you clean!</tspan></text>
 <text x="42" y="979" fill="#fff" stroke="#0c6179" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">VAC!  FILTER!  CONTAIN!</text>
</g>

