 <g transform="translate(439 422)"><rect width="271" height="64" rx="12" fill="#102f3d" stroke="#78e4ec" stroke-width="4"/><text x="18" y="26" fill="#d8fbff" font-family="Arial" font-size="13" font-weight="900">48-HOUR HULL SCAN</text><text x="18" y="51" fill="#f6d078" font-family="Arial" font-size="19" font-weight="900">EARLY BIOFILM DETECTED</text></g>
 <rect x="38" y="103" width="491" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="283" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="283">새 도료가 좋아도 얇은 생물막은 다시 시작된다. 두껍게 붙기 전에 찾아낸다.</tspan><tspan x="283" dy="24" font-size="14">即使换了低脱落涂层，薄薄的生物膜仍会重新出现，要在变厚前发现。</tspan><tspan x="283" dy="22" font-size="13">Even with clean coating, a thin biofilm returns. Detect it before heavy fouling begins.</tspan></text>
 <rect x="548" y="103" width="188" height="94" rx="22" fill="#fff1bd" stroke="#111" stroke-width="4"/>
 <text x="642" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="642">초기에 잡아!</tspan><tspan x="642" dy="21" font-size="13">趁早发现！</tspan><tspan x="642" dy="19" font-size="12">Catch it early!</tspan></text>
 <text x="42" y="486" fill="#fff" stroke="#0f657b" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">SCAN!  FIND!  ACT!</text>
</g>

<!-- PANEL 2: underwater grooming robot -->
<g>
