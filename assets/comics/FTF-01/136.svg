<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9fd5e8"/><stop offset="1" stop-color="#f7d6a1"/></linearGradient>
  <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#39bfd2"/><stop offset="1" stop-color="#063e63"/></linearGradient>
  <linearGradient id="dock" x2="0" y2="1"><stop stop-color="#5e727d"/><stop offset="1" stop-color="#202d34"/></linearGradient>
  <linearGradient id="lab" x2="0" y2="1"><stop stop-color="#edf8fb"/><stop offset="1" stop-color="#a6c0ca"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".38"/></filter>
