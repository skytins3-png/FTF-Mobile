</defs>
<rect width="1536" height="1024" fill="#06131b"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#123748"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #136  붙기 전에 관리하라</text>
<text x="895" y="49" fill="#c8fbff" font-family="Arial" font-size="18" font-weight="800">B-39 PROACTIVE HULL GROOMING · 船体早期生物附着管理</text>

<!-- PANEL 1: inspection after low-release coating -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="10" fill="url(#sky)"/>
 <path d="M16 278h746v234H16z" fill="url(#sea)"/>
