 <path d="M1152 441q96 16 175-13" fill="none" stroke="#e6f8f9" stroke-width="7" stroke-dasharray="13 11"/>
 <g fill="#d7f4ff" stroke="#155e79" stroke-width="4"><path d="M1330 362q35-23 66 0q-34 26-66 0z"/><path d="M1375 421q31-20 59 0q-30 23-59 0z"/><path d="M1271 458q29-19 55 0q-28 21-55 0z"/></g>
 <g filter="url(#shadow)"><ellipse cx="1442" cy="315" rx="34" ry="40" fill="#e8ad83" stroke="#12212a" stroke-width="5"/><path d="M1411 307q8-29 32-34q27 5 31 34z" fill="#342f2b"/><path d="M1404 379q39-24 78 0l25 91h-128z" fill="#1e7f8d" stroke="#12212a" stroke-width="5"/></g>
 <rect x="795" y="103" width="495" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1042" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1042">잠수 없이 부드러운 브러시 로봇이 얇은 생물막만 걷어내고 도막은 손상시키지 않는다.</tspan><tspan x="1042" dy="24" font-size="14">软刷机器人无需潜水作业，只清除早期生物膜，不损伤船体涂层。</tspan><tspan x="1042" dy="22" font-size="13">A soft grooming robot removes early biofilm without damaging the clean hull coating.</tspan></text>
 <rect x="1308" y="103" width="187" height="94" rx="22" fill="#dbffe8" stroke="#111" stroke-width="4"/>
 <text x="1401" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1401">독성 없이 깨끗하게!</tspan><tspan x="1401" dy="21" font-size="13">无毒保持清洁！</tspan><tspan x="1401" dy="19" font-size="12">Clean without toxins!</tspan></text>
 <text x="802" y="486" fill="#fff" stroke="#125c6e" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">WHIRR!  BRUSH!  RELEASE!</text>
</g>

