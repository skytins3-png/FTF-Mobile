<rect x="76" y="1450" width="652" height="94" rx="14" fill="#151b22" fill-opacity=".9" stroke="#fff" stroke-width="3"/><text x="98" y="1487" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="27" font-weight="900">작은 발전소들이 연결되면, 도시 전체가 더 강해진다.</text><text x="98" y="1518" fill="#dff7ff" font-family="Arial" font-size="17">小小的清洁能源连接起来，整座城市更坚强。 · Connected clean energy makes the whole city stronger.</text><path d="M603 1586 q195-38 385 12 v72 q-182 38-385-1Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="795" y="1620" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="20" font-weight="900">우리가 지키는 전기가, 우리가 사는 내일을 지켜.</text><text x="795" y="1649" text-anchor="middle" font-family="Arial" font-size="14">我们守护的能源，也守护我们的明天。 · The energy we protect safeguards our tomorrow.</text><text x="84" y="1810" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="24" font-weight="900">내일을 밝히는 힘은 오늘의 선택에서 시작된다.</text><text x="84" y="1835" fill="#f5f5f5" font-family="Arial" font-size="15">照亮明天的力量始于今天的选择。 · A brighter tomorrow begins with today's choices.</text></g></svg>