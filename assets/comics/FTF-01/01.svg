#5c351f" stroke-width="8"/><path d="M840 1307 q42-54 70-4" fill="none" stroke="#c58b48" stroke-width="28"/><rect x="643" y="1012" width="286" height="102" rx="45" fill="#fff" filter="url(#shadow)"/><path d="M718 1110 l-24 48 58-39" fill="#fff"/><text x="675" y="1054" fill="#17202a" font-size="25" font-weight="800">“이건 경고야.”</text><text x="665" y="1087" fill="#37495a" font-size="20">“这是警告。”</text><rect x="72" y="1558" width="936" height="214" rx="26" fill="#0e1218" stroke="#f0c35a" stroke-width="4"/><text x="104" y="1610" fill="#f0c35a" font-size="25" font-weight="900">상황 설명 · CAPTION</text><text x="104" y="1660" fill="#f7f8fa" font-size="31" font-weight="800">계절의 리듬이 무너지기 시작한다.</text><text x="104" y="1710" fill="#d2dde7" font-size="28">季节的节奏正在崩塌。</text><text x="104" y="1755" fill="#9fb4ca" font-size="22">The familiar rhythm of the seasons is breaking apart.</text><text x="784" y="894" fill="#ffd85b" font-size="54" font-weight="1000" transform="rotate(-8 784 894)">BEEP…</text><text x="80" y="1840" fill="#9fb4ca" font-size="22">FTF comic scene 01 / 26</text></svg>