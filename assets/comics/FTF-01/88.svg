<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 88 - 푸른 바다 지킴이의 첫 기록</title>
<desc id="desc">Four-panel cinematic manga scene continuing the recovered-ocean story: children and marine researchers begin a citizen-science shoreline watch, collect water and microplastic samples, record returning shore life, and upload the first community ocean-health report. Korean Chinese English text, speech bubbles, narration boxes, and visual sound effects.</desc>
<defs>
 <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7dcfff"/><stop offset=".55" stop-color="#dff5ff"/><stop offset="1" stop-color="#ffd29a"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1cb6d9"/><stop offset="1" stop-color="#075d8a"/></linearGradient>
 <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf6f8"/><stop offset="1" stop-color="#cfe8ee"/></linearGradient>
 <style>.p{stroke:#071d2a;stroke-width:7}.box,.bub{fill:white;stroke:#071d2a;stroke-width:4}.ko{font:700 20px Arial,sans-serif;fill:#071d2a}.zh{font:600 15px Arial,sans-serif;fill:#173947}.en{font:600 15px Arial,sans-serif;fill:#274957}.fx{font:900 34px Impact,Arial,sans-serif;fill:white;stroke:#087bbb;stroke-width:7;paint-order:stroke}.skin{fill:#efbd98;stroke:#071d2a;stroke-width:3}.hair{fill:#2b1f1d;stroke:#071d2a;stroke-width:3}.ftf{fill:#184a67;stroke:#071d2a;stroke-width:3}.line{fill:none;stroke:#071d2a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.eye{fill:#071d2a}.tiny{font-size:13px}</style>
</defs>
<!-- PANEL 1: dawn shoreline briefing -->
<g class="p"><rect x="4" y="4" width="1192" height="250" fill="url(#dawn)"/><path d="M4 168q150-25 300 4t300 0q180-31 592 6v76H4Z" fill="url(#water)"/><path d="M4 214q120-29 236-10 88 15 172 50H4Z" fill="#d5ba88"/><path d="M760 182h245l50 36-28 31H738l-18-21 40-46Z" fill="#f7fbfc" stroke="#071d2a" stroke-width="5"/><text x="815" y="217" font-family="Arial" font-size="17" font-weight="900" fill="#174b66">FTF OCEAN RESEARCH</text>
<!-- female researcher --> <ellipse cx="225" cy="156" rx="29" ry="32" class="skin"/><path d="M198 150q7-45 38-28 23 13 20 39-28-11-58-11Z" class="hair"/><path d="M179 194q48-25 93 0l13 60H165Z" class="ftf"/><circle cx="216" cy="156" r="4" class="eye"/><circle cx="236" cy="156" r="4" class="eye"/><path d="M211 171q13 8 27 0" class="line"/><path d="M258 202q62-12 111-45" class="line"/><rect x="353" y="125" width="95" height="62" rx="6" fill="#fff" stroke="#071d2a" stroke-width="4"/><path d="M367 142h64M367 158h52M367 174h40" class="line"/>
<!-- kids --> <g><ellipse cx="91" cy="196" rx="22" ry="24" class="skin"/><path d="M70 193q8-32 28-19 16 10 14 28-19-9-42-9Z" class="hair"/><path d="M61 221q30-15 59 0l5 33H56Z" fill="#f39255" stroke="#071d2a" stroke-width="3"/><ellipse cx="143" cy="198" rx="22" ry="24" class="skin"/><path d="M122 194q7-31 29-19 16 9 14 28-20-9-43-9Z" class="hair"/><path d="M113 223q30-14 59 0l5 31h-69Z" fill="#ffb257" stroke="#071d2a" stroke-width="3"/></g>
<rect class="box" x="20" y="20" width="430" height="84" rx="9"/><text x="35" y="47" class="ko">약속은 행동이 됩니다. 오늘부터 우리가 직접 바다를 기록합니다.</text><text x="35" y="70" class="zh">约定化为行动。今天起，我们亲手记录海洋。</text><text x="35" y="93" class="en">A promise becomes action. Today, we begin recording the ocean ourselves.</text>
<path class="bub" d="M474 23h276q14 0 14 14v64q0 14-14 14H632l-21 18 4-18H474q-14 0-14-14V37q0-14 14-14Z"/><text x="490" y="51" class="ko">첫 해안 조사, 준비됐지?</text><text x="490" y="74" class="zh tiny">第一次海岸调查，准备好了吗？</text><text x="490" y="96" class="en tiny">First shoreline survey—ready?</text><text x="995" y="74" class="fx" transform="rotate(-6 995 74)">GO!</text></g>
<!-- PANEL 2: sampling -->
<g class="p"><rect x="4" y="263" width="584" height="260" fill="#c9f2fb"/><path d="M4 392q110-39 220-4t364-6v141H4Z" fill="url(#water)"/><path d="M4 468q145-48 287-20 87 17 297 59v16H4Z" fill="#caae7a"/>
