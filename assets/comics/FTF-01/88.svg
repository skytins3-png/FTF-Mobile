<!-- child with sample bottle --> <ellipse cx="167" cy="383" rx="25" ry="28" class="skin"/><path d="M143 378q8-37 33-23 19 10 17 31-23-9-50-8Z" class="hair"/><path d="M125 416q42-19 82 0l12 75h-105Z" fill="#f0a153" stroke="#071d2a" stroke-width="4"/><path d="M196 430q37 0 68 24" class="line"/><rect x="247" y="432" width="21" height="42" rx="7" fill="#e6fbff" stroke="#071d2a" stroke-width="3"/>
<!-- sieve/microplastic tray --> <rect x="34" y="432" width="92" height="45" rx="8" fill="#f7f5e9" stroke="#071d2a" stroke-width="4"/><g fill="#e35b55"><circle cx="51" cy="447" r="4"/><circle cx="82" cy="458" r="4"/></g><g fill="#2e89c5"><circle cx="66" cy="463" r="4"/><circle cx="105" cy="447" r="4"/></g>
<rect class="box" x="18" y="279" width="340" height="84" rx="9"/><text x="33" y="306" class="ko">물 샘플과 미세플라스틱을 같은 지점에서 반복 측정합니다.</text><text x="33" y="329" class="zh">在同一地点重复测量水样和微塑料。</text><text x="33" y="352" class="en">We repeat water and microplastic sampling at the same sites.</text>
<path class="bub" d="M321 286h247q12 0 12 12v67q0 12-12 12h-85l-20 18 4-18H321q-12 0-12-12v-67q0-12 12-12Z"/><text x="336" y="315" class="ko">색, 냄새, 탁도까지 전부 기록해요!</text><text x="336" y="338" class="zh tiny">颜色、气味、浑浊度都要记录！</text><text x="336" y="360" class="en tiny">Record color, smell, and turbidity too!</text><text x="391" y="503" class="fx" transform="rotate(-4 391 503)">SPLASH · SAMPLE!</text></g>
<!-- PANEL 3: shore life transect -->
<g class="p"><rect x="596" y="263" width="600" height="260" fill="#dff4ff"/><path d="M596 408q125-31 250-8t350 2v121H596Z" fill="#188ab0"/><path d="M596 463q145-51 280-28 95 16 320 56v32H596Z" fill="#b99769"/>
<!-- rocky tidepool --> <g fill="#6d665f" stroke="#071d2a" stroke-width="4"><ellipse cx="742" cy="452" rx="73" ry="27"/><ellipse cx="1043" cy="462" rx="82" ry="31"/></g><g fill="#58a867" stroke="#071d2a" stroke-width="3"><path d="M706 454q-11-43 9-60 14 25 8 61Z"/><path d="M1013 465q-8-39 12-58 13 26 4 60Z"/></g><g fill="#f3a14f" stroke="#071d2a" stroke-width="2"><path d="M763 438l9 15 17 4-14 11 2 17-14-10-15 10 3-17-14-11 17-3Z"/><path d="M1066 446q18-15 35 0-17 18-35 0l-10 7 3-15Z"/></g>
<!-- boy crouching --> <ellipse cx="906" cy="374" rx="25" ry="28" class="skin"/><path d="M882 369q8-37 33-23 20 10 17 32-22-10-50-9Z" class="hair"/><path d="M867 407q42-20 81 0l13 76H855Z" fill="#f2a45a" stroke="#071d2a" stroke-width="4"/><path d="M875 429q-48 4-78 32" class="line"/><rect x="774" y="443" width="39" height="30" rx="5" fill="#f7fbfc" stroke="#071d2a" stroke-width="3"/><text x="783" y="464" font-family="Arial" font-size="12" font-weight="900">12</text>
<!-- girl with tablet --> <ellipse cx="1122" cy="372" rx="25" ry="28" class="skin"/><path d="M1098 368q7-37 33-23 19 10 17 31-23-9-50-8Z" class="hair"/><path d="M1082 406q42-19 81 0l11 78h-103Z" fill="#ef8a66" stroke="#071d2a" stroke-width="4"/><rect x="1034" y="415" width="58" height="43" rx="6" fill="#d9f1fa" stroke="#071d2a" stroke-width="4"/>
<rect class="box" x="610" y="278" width="339" height="84" rx="9"/><text x="625" y="305" class="ko">갯바위 생물의 숫자와 종류도 같은 선을 따라 조사합니다.</text><text x="625" y="328" class="zh">沿着同一条样线记录潮间带生物的数量与种类。</text><text x="625" y="351" class="en">We count shore species along the same transect line.</text>
<path class="bub" d="M946 286h234q12 0 12 12v68q0 12-12 12h-79l-20 18 4-18H946q-12 0-12-12v-68q0-12 12-12Z"/><text x="960" y="315" class="ko">불가사리 12마리! 작년보다 늘었어요!</text><text x="960" y="338" class="zh tiny">海星12只！比去年更多了！</text><text x="960" y="360" class="en tiny">Twelve starfish—more than last year!</text><text x="991" y="506" class="fx" transform="rotate(-5 991 506)">COUNT · CHECK!</text></g>
<!-- PANEL 4: upload and sunset promise -->
<g class="p"><rect x="4" y="532" width="1192" height="264" fill="url(#lab)"/><rect x="36" y="560" width="500" height="186" rx="16" fill="#f9fcfd" stroke="#071d2a" stroke-width="4"/><rect x="67" y="592" width="438" height="116" rx="9" fill="#064d76" stroke="#071d2a" stroke-width="4"/><text x="89" y="620" font-family="Arial" font-size="20" font-weight="900" fill="#e8fbff">COMMUNITY OCEAN WATCH · DAY 1</text><text x="89" y="653" font-family="Arial" font-size="19" font-weight="800" fill="#8df0cf">Water clarity  ↑ 18%</text><text x="89" y="682" font-family="Arial" font-size="19" font-weight="800" fill="#8df0cf">Shore species   ↑ 11%</text><text x="319" y="653" font-family="Arial" font-size="19" font-weight="800" fill="#ffd27d">Microplastic   ↓ 23%</text><text x="319" y="682" font-family="Arial" font-size="19" font-weight="800" fill="#8df0cf">Report uploaded ✓</text>
