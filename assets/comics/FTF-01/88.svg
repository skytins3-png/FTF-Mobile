<!-- window sunset --> <rect x="891" y="559" width="277" height="187" rx="12" fill="#ffbd7d" stroke="#071d2a" stroke-width="4"/><circle cx="1056" cy="624" r="31" fill="#fff1a1"/><path d="M891 668q83-28 149 1t128-4v81H891Z" fill="#176f95"/>
<rect class="box" x="574" y="548" width="305" height="86" rx="9"/><text x="590" y="575" class="ko">오늘의 기록이 내일의 기준이 됩니다.</text><text x="590" y="598" class="zh">今天的记录，将成为明天的基准。</text><text x="590" y="621" class="en">Today's record becomes tomorrow's baseline.</text>
<path class="bub" d="M864 544h316q12 0 12 12v82q0 12-12 12h-126l-23 18 5-18H864q-12 0-12-12v-82q0-12 12-12Z"/><text x="881" y="573" class="ko">우리가 직접 보고, 재고, 계속 지켜갈 거예요!</text><text x="881" y="596" class="zh tiny">我们会亲眼看、亲手测，并一直守护下去！</text><text x="881" y="619" class="en tiny">We'll observe, measure, and keep protecting it ourselves!</text><text x="713" y="775" class="fx">UPLOAD! · FIRST RECORD!</text></g>
<rect x="4" y="4" width="1192" height="792" fill="none" stroke="#071d2a" stroke-width="8"/>
