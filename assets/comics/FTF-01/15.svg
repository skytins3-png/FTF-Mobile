<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="room" x2="0" y2="1"><stop stop-color="#0c1b2a"/><stop offset="1" stop-color="#071018"/></linearGradient><radialGradient id="earth"><stop stop-color="#7fd6ff"/><stop offset=".55" stop-color="#2b7cac"/><stop offset="1" stop-color="#0d2d49"/></radialGradient></defs><rect width="1080" height="1920" fill="#060b11"/><rect x="28" y="28" width="1024" height="1145" rx="28" fill="url(#room)" stroke="#d0e7f5" stroke-width="6"/><rect x="105" y="260" width="870" height="430" rx="24" fill="#0b2740" stroke="#46789a" stroke-width="5"/><circle cx="540" cy="475" r="150" fill="url(#earth)"/><path d="M465 360q70 35 82 95t65 85q-30 75-105 92-85-60-90-145 10-78 48-127z" fill="#65a968" opacity=".9"/><path d="M586 355q95 55 90 150-42-8-76-45t-66-38q20-48 52-67z" fill="#72b36f" opacity=".85"/><g fill="#ff7065"><circle cx="360" cy="390" r="10"/><circle cx="705" cy="430" r="10"/><circle cx="610" cy="575" r="10"/><circle cx="465" cy="560" r="10"/></g><g stroke="#ff7065" stroke-width="5"><path d="M360 390l-90-70"/><path d="M705 430l92-65"/><path d="M610 575l80 76"/></g><g transform="translate(160 690)"><circle cx="100" cy="95" r="42" fill="#c88b66"/><path d="M55 95q42-62 88 0V49q-42-42-88 2z" fill="#262026"/><path d="M42 158q55-47 112 0l20 200H20z" fill="#e7edf2"/><rect x="68" y="205" width="62" height="92" fill="#9cc3d8"/></g><g transform="translate(430 730)"><circle cx="92" cy="86" r="38" fill="#d4a07e"/><path d="M52 86q37-55 76 0V44q-37-37-76 0z" fill="#2e2527"/><path d="M38 145q52-44 106 0l18 180H18z" fill="#425a72"/></g><g transform="translate(690 700)"><circle cx="94" cy="92" r="40" fill="#b87b5c"/><path d="M52 92q40-58 82 0V47q-40-40-82 0z" fill="#1f1c1e"/><path d="M39 150q53-45 108 0l18 190H20z" fill="#6d4b72"/></g><rect x="64" y="70" width="640" height="142" rx="20" fill="#101821e8" stroke="#b9dcf0" stroke-width="3"/><text x="95" y="118" fill="#bfe6fb" font-family="Arial" font-weight="700" font-size="34">SCENE 15 · GLOBAL ALERT</text><text x="95" y="165" fill="#fff" font-family="Arial" font-size="28">지구 기후 비상회의 · 全球气候紧急会议</text><path d="M610 760h385v238H610z" fill="#fff" stroke="#111" stroke-width="6" rx="22"/><path d="M667 998l-48 73 15-91z" fill="#fff" stroke="#111" stroke-width="5"/><text x="642" y="820" font-family="Arial" font-size="31" font-weight="700">“이건 날씨가 아닙니다.”</text><text x="642" y="868" font-family="Arial" font-size="28">这已经不是天气问题。</text><text x="642" y="916" font-family="Arial" font-size="25">“This is no longer weather.”</text><text x="730" y="1110" fill="#ff8b82" font-family="Arial" font-size="58" font-weight="900" transform="rotate(-7 730 1110)">ALERT—</text><rect x="52" y="1215" width="976" height="265" rx="26" fill="#101925" stroke="#d5e6f6" stroke-width="4"/><text x="88" y="1280" fill="#9ed5ff" font-family="Arial" font-weight="700" font-size="30">상황 설명 · NARRATION</text><text x="88" y="1341" fill="#fff" font-family="Arial" font-size="34">폭염, 가뭄, 산불, 홍수의 기록이 하나의 화면에 겹쳤다.</text><text x="88" y="1392" fill="#fff" font-family="Arial" font-size="32">과학자들은 서로 다른 재난이 같은 원인을 가리킨다고 결론냈다.</text><text x="88" y="1442" fill="#b8c8d8" font-family="Arial" font-size="26">所有灾难指向同一个警告。Every disaster points to one warning.</text><rect x="52" y="1515" width="976" height="325" rx="26" fill="#151116" stroke="#ff6d65" stroke-width="4"/><text x="86" y="1585" fill="#ff9189" font-family="Arial" font-weight="700" font-size="29">지구의 경고 · EARTH’S WARNING</text><text x="86" y="1648" fill="#fff" font-family="Arial" font-size="35">“지구는 더 이상 속삭이지 않는다. 경고하고 있다.”</text><text x="86" y="1705" fill="#ffd6d2" font-family="Arial" font-size="30">“地球不再低语，它正在发出警告。”</text><text x="86" y="1762" fill="#ffd6d2" font-family="Arial" font-size="28">“The Earth is no longer whispering. It is warning us.”</text></svg>