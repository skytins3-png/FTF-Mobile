 <g transform="translate(118 942)" filter="url(#sh)"><ellipse cy="-53" rx="24" ry="29" fill="#c98f6e" stroke="#102a35" stroke-width="4"/><rect x="-36" y="-20" width="72" height="88" rx="14" fill="#efb43b" stroke="#102a35" stroke-width="4"/></g>
 <g transform="translate(366 942)" filter="url(#sh)"><ellipse cy="-53" rx="24" ry="29" fill="#d4a17d" stroke="#102a35" stroke-width="4"/><rect x="-36" y="-20" width="72" height="88" rx="14" fill="#49ad92" stroke="#102a35" stroke-width="4"/></g>
 <g transform="translate(614 942)" filter="url(#sh)"><ellipse cy="-53" rx="24" ry="29" fill="#b98266" stroke="#102a35" stroke-width="4"/><rect x="-36" y="-20" width="72" height="88" rx="14" fill="#3d88b0" stroke="#102a35" stroke-width="4"/></g>
 <rect x="39" y="548" width="665" height="128" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="371" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="371">세 선박의 출항을 잠시 멈추고 F-7·밸러스트 라인·공용 정비도구를 동시에 검사한다. 현장에서 사람이 직접 봉인 번호를 맞춘다.</tspan><tspan x="371" dy="25" font-size="14">三艘船暂停出航，同时检查F-7、压载水管线和共用维修工具，并现场核对封签编号。</tspan><tspan x="371" dy="23" font-size="13">K-41, K-44 and K-47 are held for synchronized filter, ballast and tool checks.</tspan></text>
 <path d="M394 680h310q16 0 16 16v70q0 16-16 16H585l-30 27 7-27H394q-16 0-16-16v-70q0-16 16-16z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="557" y="712" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="557">출항 보류! 같은 F-7 전부 열어 확인!</tspan><tspan x="557" dy="24" font-size="13">暂停出航！同批F-7全部检查！</tspan></text>
 <text x="54" y="988" font-family="Arial" font-size="24" font-weight="1000" fill="#ffe36d">HOLD! OPEN! SWAB! VERIFY!</text>
</g>

<!-- PANEL 4: prevention -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="url(#clean)"/>
 <rect x="802" y="715" width="690" height="242" rx="18" fill="#cbe9d8"/>
 <path d="M812 857q120-66 240 0t240 0t175 0" fill="none" stroke="#3293a2" stroke-width="16"/>
 <g filter="url(#sh)"><rect x="835" y="742" width="292" height="177" rx="16" fill="#fff" stroke="#2d8b61" stroke-width="5"/><text x="981" y="776" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#1e6849">FLEET CHECK RESULT</text><text x="981" y="815" text-anchor="middle" font-family="Arial" font-size="27" font-weight="1000" fill="#1e6849">3 / 3 CAUGHT EARLY</text><text x="981" y="850" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#1e6849">K-44 F-7 TRACE POSITIVE</text><text x="981" y="881" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#1e6849">0 SECONDARY DISCHARGE</text></g>
 <g filter="url(#sh)"><rect x="1152" y="742" width="305" height="177" rx="16" fill="#f6fffa" stroke="#2d8b61" stroke-width="5"/><text x="1304" y="776" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#1e6849">NEW RULE</text><text x="1304" y="815" text-anchor="middle" font-family="Arial" font-size="19" font-weight="1000" fill="#1e6849">F-7 LOT AUTO ALERT</text><text x="1304" y="850" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#1e6849">PRE-SAIL CHECK REQUIRED</text><text x="1304" y="881" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#1e6849">SHARED TOOL TRACEABILITY</text></g>
 <rect x="797" y="548" width="665" height="130" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1129" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1129">K-44에서도 같은 F-7 미세 양성을 출항 전에 잡았다. 오염수는 바다로 한 방울도 나가지 않았고, 같은 부품은 자동 경보 대상으로 바뀐다.</tspan><tspan x="1129" dy="25" font-size="14">K-44同批F-7也在出航前检出微弱阳性，污染水未排入海中，同批部件纳入自动预警。</tspan><tspan x="1129" dy="23" font-size="13">A matching trace is caught on K-44 before sailing: zero secondary discharge, fleet rule upgraded.</tspan></text>
 <g transform="translate(1405 957)" filter="url(#sh)"><ellipse cy="-63" rx="29" ry="35" fill="#d09a75" stroke="#102a35" stroke-width="5"/><path d="M-29-74q10-28 30-29q23 5 29 29l-20-9q-19 8-39 9" fill="#2f2b29"/><rect x="-43" y="-25" width="86" height="106" rx="18" fill="#f0b43b" stroke="#102a35" stroke-width="5"/><path d="M-35-3l-88-37" stroke="#f0b43b" stroke-width="19" stroke-linecap="round"/></g>
 <path d="M1104 920h250q14 0 14 14v52H1082v-52q0-14 14-14z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1225" y="947" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1225">한 척의 경보가 함대 전체를 지켰다.</tspan><tspan x="1225" dy="22" font-size="12">一次警报守住整个船队。</tspan></text>
 <text x="795" y="991" font-family="Arial" font-size="24" font-weight="1000" fill="#176344">CATCH IT BEFORE SAILING — ZERO SECONDARY DISCHARGE!</text>
</g>
</svg>