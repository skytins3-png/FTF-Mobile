<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 161 expands the K-42 response into fleet-wide prevention">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#82c9e8"/><stop offset="1" stop-color="#eef7fb"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#2e8da7"/><stop offset="1" stop-color="#0a425c"/></linearGradient>
 <linearGradient id="dock" x2="1" y2="1"><stop stop-color="#d6dde1"/><stop offset="1" stop-color="#7c8c93"/></linearGradient>
 <linearGradient id="clean" x2="1" y2="1"><stop stop-color="#effff4"/><stop offset="1" stop-color="#8edbb1"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".38"/></filter>
</defs>
<rect width="1536" height="1024" fill="#07131b"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#153f59"/>
<text x="28" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="30" font-weight="900">FTF-01 #161  한 척에서 끝내지 않는다 — 같은 위험을 가진 선박 전체를 먼저 막는다</text>
<text x="1095" y="49" fill="#d7f5ff" font-family="Arial" font-size="17" font-weight="800">TRACE · CLEAN · FLEET CHECK · 全船队预防</text>

<!-- PANEL 1: containment -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/>
 <rect x="16" y="336" width="746" height="176" fill="url(#sea)"/>
 <path d="M35 382h680v37H35z" fill="url(#dock)"/><path d="M92 418v72M232 418v72M628 418v72" stroke="#3d5058" stroke-width="15"/>
 <g filter="url(#sh)"><path d="M72 430h322l-47 57H119z" fill="#f5f7f8" stroke="#173744" stroke-width="6"/><rect x="173" y="356" width="145" height="77" rx="7" fill="#b9d9df" stroke="#173744" stroke-width="5"/><text x="232" y="475" font-family="Arial" font-size="18" font-weight="900" fill="#173744">K-42</text></g>
 <g filter="url(#sh)"><rect x="407" y="264" width="310" height="107" rx="16" fill="#fff2d7" stroke="#a46f20" stroke-width="5"/><text x="562" y="296" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#744c13">F-7 FILTER REMOVED</text><text x="562" y="329" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#744c13">SEALED BIOFILM · CHAIN OF CUSTODY</text><text x="562" y="356" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#744c13">K-42 OUTFLOW STILL LOCKED</text></g>
 <g transform="translate(500 433)" filter="url(#sh)"><ellipse cy="-65" rx="29" ry="35" fill="#c98f6e" stroke="#102a35" stroke-width="5"/><path d="M-29-75q10-28 30-29q23 5 29 29l-20-9q-19 8-39 9" fill="#2c2b2b"/><rect x="-44" y="-27" width="88" height="111" rx="18" fill="#f0b43b" stroke="#102a35" stroke-width="5"/><path d="M-35-3l-82 30M35-3l82 29" stroke="#f0b43b" stroke-width="20" stroke-linecap="round"/></g>
 <g transform="translate(640 433)" filter="url(#sh)"><ellipse cy="-65" rx="29" ry="35" fill="#d3a17d" stroke="#102a35" stroke-width="5"/><path d="M-29-75q10-28 30-29q23 5 29 29l-20-9q-19 8-39 9" fill="#4d3328"/><rect x="-44" y="-27" width="88" height="111" rx="18" fill="#48aa91" stroke="#102a35" stroke-width="5"/></g>
 <rect x="38" y="104" width="650" height="126" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="363" y="135" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="363">K-42의 F-7 필터를 봉인 제거하고 배출 밸브는 계속 잠근다. 이제 문제는 “왜 여기서 생겼는가”다.</tspan><tspan x="363" dy="25" font-size="14">封存拆除K-42的F-7过滤器，排放阀继续锁闭。下一步追查污染为何发生。</tspan><tspan x="363" dy="23" font-size="13">F-7 is removed under seal while K-42 remains locked down. Now the team traces the cause.</tspan></text>
 <text x="49" y="494" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe568">SEAL! REMOVE! KEEP THE VALVE LOCKED!</text>
</g>

<!-- PANEL 2: forensic trace -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="#d9edf4"/>
 <rect x="801" y="248" width="692" height="224" rx="18" fill="#173f53"/>
 <g filter="url(#sh)"><rect x="826" y="274" width="204" height="166" rx="14" fill="#fff" stroke="#347da0" stroke-width="5"/><text x="928" y="306" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#205b79">F-7 FORENSICS</text><text x="928" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#205b79">BIOFILM AGE: 18–24 DAYS</text><text x="928" y="376" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#205b79">SOURCE: SERVICE LOOP</text><text x="928" y="410" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#205b79">MATCH 97.8%</text></g>
 <g filter="url(#sh)"><rect x="1052" y="274" width="205" height="166" rx="14" fill="#fff4d6" stroke="#a97822" stroke-width="5"/><text x="1155" y="306" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#745114">MAINTENANCE LOG</text><text x="1155" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#745114">SAME F-7 LOT</text><text x="1155" y="376" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#745114">K-41 · K-44 · K-47</text><text x="1155" y="410" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#745114">SHARED SERVICE WINDOW</text></g>
 <g filter="url(#sh)"><rect x="1279" y="274" width="186" height="166" rx="14" fill="#ffe3df" stroke="#b43b3c" stroke-width="5"/><text x="1372" y="306" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#8b2929">RISK LIST</text><text x="1372" y="347" text-anchor="middle" font-family="Arial" font-size="30" font-weight="1000" fill="#a42b2b">3 SHIPS</text><text x="1372" y="383" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#8b2929">CHECK BEFORE SAIL</text><text x="1372" y="412" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#8b2929">NO EXCEPTIONS</text></g>
 <rect x="796" y="103" width="665" height="122" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1128" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1128">정비 기록과 생물막 나이를 겹치자 같은 F-7 부품을 쓴 K-41·K-44·K-47이 즉시 위험 목록에 오른다.</tspan><tspan x="1128" dy="25" font-size="14">比对维护记录与生物膜年龄后，使用同批F-7的K-41、K-44、K-47立即列入风险名单。</tspan><tspan x="1128" dy="23" font-size="13">Forensics links the same F-7 service lot to three more vessels before they sail.</tspan></text>
 <text x="811" y="493" font-family="Arial" font-size="24" font-weight="1000" fill="#173b4f">TRACE! MATCH! BUILD THE RISK LIST!</text>
</g>

<!-- PANEL 3: fleet inspection -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#24475b"/>
 <rect x="36" y="709" width="706" height="255" rx="18" fill="#7d8e95"/>
 <g filter="url(#sh)"><path d="M62 825h184l-30 51H86z" fill="#eef4f5" stroke="#173744" stroke-width="5"/><rect x="112" y="770" width="94" height="57" fill="#b6d5dc" stroke="#173744" stroke-width="4"/><text x="151" y="861" font-family="Arial" font-size="14" font-weight="900">K-41</text></g>
