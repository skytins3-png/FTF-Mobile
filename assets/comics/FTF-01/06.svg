="rotate(-7 80 60)"/><rect x="154" y="12" width="105" height="64" fill="#7ca2b0" transform="rotate(-7 205 45)"/><circle cx="72" cy="145" r="35" fill="#0b0d10"/><circle cx="275" cy="120" r="35" fill="#0b0d10"/></g><g transform="translate(575 800)"><ellipse cx="190" cy="565" rx="245" ry="58" fill="#000" opacity=".3"/><circle cx="145" cy="125" r="72" fill="#edc6a5"/><path d="M75 120 Q92 35 155 40 Q220 42 226 138 Q187 104 145 104 Q105 104 75 120" fill="#242328"/><path d="M70 215 Q145 165 220 215 L270 470 Q145 520 22 470Z" fill="#d9a13f"/><rect x="78" y="285" width="145" height="34" fill="#f4e273"/><path d="M45 458 L88 735 L145 735 L140 480Z" fill="#20272e"/><path d="M255 458 L215 735 L158 735 L163 480Z" fill="#20272e"/><circle cx="370" cy="190" r="58" fill="#e9c2a1"/><path d="M310 185 Q325 118 378 120 Q430 122 436 198 Q400 169 368 169 Q340 169 310 185" fill="#2f2521"/><path d="M312 260 Q370 225 428 260 L455 455 Q370 492 286 455Z" fill="#31526a"/><path d="M300 448 L330 665 L370 665 L364 465Z" fill="#20272e"/><path d="M446 448 L418 665 L378 665 L383 465Z" fill="#20272e"/><path d="M218 330 Q292 350 325 315" fill="none" stroke="#edc6a5" stroke-width="30" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M60 145 Q60 75 145 75 H690 Q770 75 770 150 V355 Q770 430 690 430 H220 L150 490 L168 430 H145 Q60 430 60 355Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="115" y="170" font-family="Arial,'Malgun Gothic',sans-serif" font-size="39" font-weight="800" fill="#111">지하차도 쪽은 이미 잠겼어!</text><text x="115" y="235" font-family="Arial,sans-serif" font-size="34" fill="#333">地下通道已经被淹没了！</text><text x="115" y="298" font-family="Arial,sans-serif" font-size="31" fill="#555">The underpass is already flooded!</text></g><g filter="url(#sh)"><path d="M555 1190 Q570 1115 650 1115 H980 Q1030 1115 1030 1190 V1340 Q1030 1415 950 1415 H735 L670 1470 L688 1415 Q555 1412 555 1340Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="610" y="1218" font-family="Arial,'Malgun Gothic',sans-serif" font-size="38" font-weight="800" fill="#111">높은 길로 돌아가자!</text><text x="610" y="1278" font-family="Arial,sans-serif" font-size="34" fill="#333">我们绕到高处去！</text><text x="610" y="1338" font-family="Arial,sans-serif" font-size="31" fill="#555">Take the higher road!</text></g><g filter="url(#sh)"><rect x="55" y="1515" width="970" height="275" rx="18" fill="#101318" stroke="#ffd65c" stroke-width="7"/><text x="92" y="1585" font-family="Arial,'Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="92" y="1648" font-family="Arial,'Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#fff">갑작스러운 폭우가 도로와 지하차도를 빠르게 집어삼킨다.</text><text x="92" y="1707" font-family="Arial,sans-serif" font-size="31" fill="#d8e4e9">突如其来的暴雨迅速吞没道路和地下通道。</text><text x="92" y="1765" font-family="Arial,sans-serif" font-size="29" fill="#b9c9d0">A sudden downpour swallows roads and underpasses within minutes.</text></g><text x="710" y="620" font-family="Impact,Arial Black,sans-serif" font-size="102" font-style="italic" fill="#ffd65c" stroke="#111" stroke-width="10" transform="rotate(-8 710 620)">DRRRR…</text><text x="55" y="1870" font-family="Arial,sans-serif" font-size="25" fill="#96a9b5">FTF-01 · EARTH'S WARNING · SCENE 06 / 26</text></svg>