 <rect x="18" y="18" width="432" height="104" class="box"/><text x="40" y="55" class="ko">2. 되살아나는 산호초, 돌아온 생명</text><text x="40" y="86" class="zh">重生的珊瑚礁，回归的海洋生命。</text><text x="40" y="114" class="en">Reviving coral reefs, returning marine life.</text>
