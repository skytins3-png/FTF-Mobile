 <rect x="18" y="18" width="420" height="110" class="box"/><text x="40" y="56" class="ko">4. 다음 세대를 위한 약속</text><text x="40" y="89" class="zh">为了下一代的约定。</text><text x="40" y="119" class="en">A promise for the next generation.</text>
 <path d="M470 28 Q610 8 770 38 Q800 85 760 128 L500 132 Q455 90 470 28" class="bubble"/><text x="510" y="70" class="ko" font-size="23">그래, 우리가 함께라면</text><text x="518" y="103" class="ko" font-size="23">더 푸른 바다를 만들 수 있어.</text><text x="530" y="128" class="en small">Together, we can create a bluer ocean.</text>
 <text x="610" y="360" class="fx" font-size="52">TOGETHER FOR TOMORROW!</text>
