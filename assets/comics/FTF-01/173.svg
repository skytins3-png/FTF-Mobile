<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 173 hardens the fixed-tablet system during a storm power dip by stopping a shared emergency charger from crossing zones and replacing it with sealed zone-dedicated backup power">
<defs>
 <linearGradient id="storm" x2="0" y2="1"><stop stop-color="#081522"/><stop offset=".48" stop-color="#28485b"/><stop offset="1" stop-color="#8aa0a8"/></linearGradient>
 <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#c4cfd1"/><stop offset="1" stop-color="#768b91"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#0b3447"/><stop offset="1" stop-color="#04141d"/></linearGradient>
 <linearGradient id="warn" x2="1" y2="1"><stop stop-color="#ffbe47"/><stop offset="1" stop-color="#e76046"/></linearGradient>
 <linearGradient id="clean" x2="1" y2="1"><stop stop-color="#0a6674"/><stop offset="1" stop-color="#18a77f"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".45"/></filter>
 <filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="rain"><feTurbulence baseFrequency=".9" numOctaves="1" seed="7" result="n"/><feColorMatrix in="n" values="1 0 0 0 .65  0 1 0 0 .78  0 0 1 0 .9  0 0 0 .18 0"/></filter>
 <style>
 .t{font-family:Arial,'Malgun Gothic',sans-serif}.cap{font-size:17px;font-weight:900;fill:#10202a}.tiny{font-family:Arial,'Malgun Gothic',sans-serif;font-size:12px;font-weight:900}.bub{fill:#fff;stroke:#10202a;stroke-width:4}.box{fill:#fff;stroke:#102733;stroke-width:4}.sfx{font-family:Arial,'Malgun Gothic',sans-serif;font-size:22px;font-weight:1000;fill:#fff16f;stroke:#0b1a22;stroke-width:2;paint-order:stroke}.mono{font-family:Consolas,monospace;font-weight:900}
 </style>
</defs>
<rect width="1536" height="1024" fill="#051018"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#173e58"/>
<text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #173  전원도 경계를 넘지 않는다 — 폭풍 속 공용 충전기 차단</text>
<text x="1015" y="49" class="t" fill="#d5f4ff" font-size="16" font-weight="800">STORM POWER DIP · SHARED CHARGER · ZONE-LOCKED BACKUP</text>

<!-- PANEL 1: storm and power dip -->
