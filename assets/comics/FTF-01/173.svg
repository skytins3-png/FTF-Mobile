 <path d="M62 390h650v122H62z" fill="url(#deck)"/>
 <path d="M400 352v160" stroke="#f6d64b" stroke-width="9" stroke-dasharray="20 12"/><text x="414" y="496" class="tiny" fill="#22343a">BIOSECURITY LINE</text>
 <!-- harbor cranes -->
 <path d="M88 345V208h16v137M104 219l112 43M104 244l82-22" stroke="#172630" stroke-width="10" fill="none"/><path d="M654 344V225h14v119M668 234l-92 38" stroke="#172630" stroke-width="9" fill="none"/>
 <path d="M260 118l-38 69 42-10-20 62 80-98-43 12 24-35z" fill="#fff6a3" filter="url(#gl)"/>
 <g opacity=".55" stroke="#d3ecf7" stroke-width="3"><path d="M40 102l-70 130M93 94L20 234M150 91L72 235M515 91l-70 139M570 91l-76 143M705 95l-70 137"/></g>
 <!-- fixed stations -->
 <g transform="translate(132 286)" filter="url(#sh)"><rect x="-46" y="-70" width="126" height="119" rx="12" fill="#e5ecee" stroke="#274854" stroke-width="5"/><rect x="-28" y="-51" width="90" height="58" rx="6" fill="url(#screen)"/><text x="17" y="-25" text-anchor="middle" class="tiny" fill="#a4edff">A-ZONE</text><text x="17" y="-5" text-anchor="middle" class="tiny" fill="#ff8a78">UPS 18%</text><rect x="-5" y="18" width="44" height="14" rx="7" fill="#e9684f"/></g>
 <g transform="translate(570 286)" filter="url(#sh)"><rect x="-46" y="-70" width="126" height="119" rx="12" fill="#e5ecee" stroke="#274854" stroke-width="5"/><rect x="-28" y="-51" width="90" height="58" rx="6" fill="url(#screen)"/><text x="17" y="-25" text-anchor="middle" class="tiny" fill="#a4edff">B-ZONE</text><text x="17" y="-5" text-anchor="middle" class="tiny" fill="#ff8a78">UPS 21%</text><rect x="-5" y="18" width="44" height="14" rx="7" fill="#e9684f"/></g>
 <!-- technician realistic figure -->
 <g transform="translate(342 402)" filter="url(#sh)">
  <ellipse cy="-101" rx="31" ry="38" fill="#d6a17d" stroke="#102631" stroke-width="4"/><path d="M-30-111q8-29 31-31q24 2 31 27l-17-6q-22 1-45 10" fill="#252a2d"/><path d="M-18-97q18 9 36 0" stroke="#805240" stroke-width="3" fill="none"/><circle cx="-11" cy="-103" r="3"/><circle cx="12" cy="-103" r="3"/>
  <rect x="-54" y="-57" width="108" height="132" rx="22" fill="#e28a35" stroke="#102631" stroke-width="4"/><path d="M-42-18h84" stroke="#f8d36d" stroke-width="12"/><rect x="-22" y="1" width="44" height="34" rx="5" fill="#dfe7e8" stroke="#18303a" stroke-width="3"/><text x="0" y="22" text-anchor="middle" class="tiny" fill="#25363d">PWR</text>
  <path d="M-45-30l-79 41" stroke="#e28a35" stroke-width="20" stroke-linecap="round"/><path d="M44-31l80 37" stroke="#e28a35" stroke-width="20" stroke-linecap="round"/><path d="M-27 73l-8 77M27 73l9 77" stroke="#263942" stroke-width="23" stroke-linecap="round"/><path d="M-48 149h35M14 149h39" stroke="#101b20" stroke-width="15" stroke-linecap="round"/>
 </g>
 <g transform="translate(248 405)" filter="url(#sh)"><rect x="-55" y="-33" width="110" height="66" rx="11" fill="#202c34" stroke="#0b1317" stroke-width="5"/><rect x="-41" y="-20" width="61" height="40" rx="5" fill="#5b8494"/><text x="-10" y="5" text-anchor="middle" class="tiny" fill="#fff">P-6</text><circle cx="37" cy="0" r="9" fill="#e95a4c"/><path d="M55 0q34 0 44-23" stroke="#151d22" stroke-width="8" fill="none"/></g>
 <rect x="40" y="103" width="665" height="111" rx="18" class="box"/><text x="372" y="132" text-anchor="middle" class="t cap"><tspan x="372">04:42 폭풍으로 순간 전압이 떨어진다. A·B 고정 태블릿의 UPS가 동시에 경고를 띄우자 전원 담당자가 공용 비상배터리 P-6을 들고 뛰어온다.</tspan><tspan x="372" dy="25" font-size="14">04:42，暴风导致电压瞬降。A、B区固定平板同时报警，电力人员带着共用应急电源P-6赶来。</tspan><tspan x="372" dy="22" font-size="13">04:42 — a storm power dip hits both fixed tablets; a technician rushes in with shared emergency pack P-6.</tspan></text>
 <path d="M88 229h323q14 0 14 14v62q0 14-14 14H275l-25 22 5-22H88q-14 0-14-14v-62q0-14 14-14z" class="bub"/><text x="250" y="257" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="250">배터리 하나면 두 구역 다 살릴 수 있어!</tspan><tspan x="250" dy="21" font-size="12">一个电源就能救两个区！ / One pack can save both zones!</tspan></text>
 <text x="44" y="490" class="sfx">KRAK!  POWER DIP!  UPS 18%!</text>
</g>

<!-- PANEL 2: crossing blocked and trace found -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="#bdcbd0"/>
 <rect x="774" y="350" width="746" height="162" fill="url(#deck)"/>
 <path d="M1138 216v296" stroke="#f4d74f" stroke-width="10" stroke-dasharray="22 12"/>
 <!-- smart gate -->
 <rect x="1049" y="236" width="176" height="160" rx="16" fill="#e8eff0" stroke="#264a56" stroke-width="6" filter="url(#sh)"/><rect x="1072" y="259" width="130" height="67" rx="7" fill="url(#screen)"/><text x="1137" y="281" text-anchor="middle" class="tiny" fill="#a9edff">BOUNDARY SCAN</text><text x="1137" y="307" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#ff695f">P-6 BLOCKED</text><circle cx="1137" cy="355" r="18" fill="#ef5148" filter="url(#gl)"/>
 <!-- power pack closeup -->
 <g transform="translate(1323 344)" filter="url(#sh)"><rect x="-82" y="-58" width="164" height="116" rx="16" fill="#1c2931" stroke="#0b1317" stroke-width="6"/><rect x="-62" y="-35" width="82" height="52" rx="6" fill="#446c7c"/><text x="-21" y="-8" text-anchor="middle" class="tiny" fill="#fff">P-6</text><circle cx="53" cy="-10" r="13" fill="#e95850"/><path d="M82 0q52 1 62-35" stroke="#1b2429" stroke-width="10" fill="none"/><circle cx="144" cy="-38" r="13" fill="#ff594c" filter="url(#gl)"/><text x="47" y="42" text-anchor="middle" class="tiny" fill="#ff948b">USB-C TRACE+</text></g>
 <!-- inspector -->
 <g transform="translate(905 420)" filter="url(#sh)"><ellipse cy="-90" rx="29" ry="35" fill="#dfad88" stroke="#102631" stroke-width="4"/><path d="M-29-102q8-25 29-27q22 1 29 24l-15-5q-20 2-43 8" fill="#372b28"/><rect x="-49" y="-44" width="98" height="116" rx="19" fill="#318a81" stroke="#102631" stroke-width="4"/><path d="M37-11l107-28" stroke="#318a81" stroke-width="18" stroke-linecap="round"/><path d="M-24 70v65M24 70v65" stroke="#253942" stroke-width="21"/></g>
 <g transform="translate(1020 360) rotate(-12)"><rect x="-36" y="-8" width="72" height="16" rx="8" fill="#e9f0f2" stroke="#26383f" stroke-width="3"/><circle cx="35" cy="0" r="7" fill="#ff665c"/></g>
 <rect x="798" y="103" width="666" height="111" rx="18" class="box"/><text x="1131" y="132" text-anchor="middle" class="t cap"><tspan x="1131">P-6은 A구역 충전 직후 B구역으로 이동하려다 경계 게이트에서 차단된다. USB-C 커넥터 면봉검사에서 TRACE+가 검출된다.</tspan><tspan x="1131" dy="25" font-size="14">P-6给A区充电后准备进入B区，被边界门拦下；USB-C接头拭子检测为TRACE+。</tspan><tspan x="1131" dy="22" font-size="13">After charging A-zone, P-6 is stopped before B-zone; its USB-C connector tests TRACE+.</tspan></text>
 <path d="M835 231h364q14 0 14 14v63q0 14-14 14H1046l-31 25 8-25H835q-14 0-14-14v-63q0-14 14-14z" class="bub"/><text x="1016" y="259" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="1016">멈춰! 데이터만이 아니라 전원 케이블도 접촉 경로야.</tspan><tspan x="1016" dy="20" font-size="12">停！电源线也是接触路径。 / Power cables are contact paths too.</tspan></text>
 <text x="803" y="490" class="sfx">BEEP!  GATE LOCK!  SWAB → TRACE+!</text>
</g>

