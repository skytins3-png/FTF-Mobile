 <rect x="42" y="699" width="694" height="270" rx="18" fill="#dbe6e8" stroke="#365b64" stroke-width="5"/>
 <path d="M376 689v280" stroke="#f4d74f" stroke-width="9" stroke-dasharray="20 12"/>
