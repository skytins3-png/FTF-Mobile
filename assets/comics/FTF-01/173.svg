 <g transform="translate(177 813)" filter="url(#sh)"><rect x="-104" y="-95" width="208" height="191" rx="15" fill="#e9eff0" stroke="#31515d" stroke-width="6"/><rect x="-80" y="-70" width="160" height="66" rx="8" fill="url(#screen)"/><text x="0" y="-45" text-anchor="middle" class="tiny" fill="#a6edff">A-ZONE POWER A-UPS</text><text x="0" y="-18" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#6ff2ad">SEALED · LOCAL ONLY</text><rect x="-68" y="18" width="136" height="48" rx="8" fill="#28434d"/><path d="M-45 42h90" stroke="#62df8e" stroke-width="9"/><circle cx="74" cy="72" r="9" fill="#5fd991"/></g>
 <!-- B backup locker -->
 <g transform="translate(573 813)" filter="url(#sh)"><rect x="-104" y="-95" width="208" height="191" rx="15" fill="#e9eff0" stroke="#31515d" stroke-width="6"/><rect x="-80" y="-70" width="160" height="66" rx="8" fill="url(#screen)"/><text x="0" y="-45" text-anchor="middle" class="tiny" fill="#a6edff">B-ZONE POWER B-UPS</text><text x="0" y="-18" text-anchor="middle" class="t" font-size="18" font-weight="1000" fill="#6ff2ad">SEALED · LOCAL ONLY</text><rect x="-68" y="18" width="136" height="48" rx="8" fill="#28434d"/><path d="M-45 42h90" stroke="#62df8e" stroke-width="9"/><circle cx="74" cy="72" r="9" fill="#5fd991"/></g>
 <!-- no-cross icon -->
 <circle cx="376" cy="817" r="61" fill="#fff" stroke="#b33434" stroke-width="8"/><path d="M335 776l82 82M417 776l-82 82" stroke="#d13d3d" stroke-width="12"/><path d="M326 817h100" stroke="#263d47" stroke-width="12"/><text x="376" y="900" text-anchor="middle" class="tiny" fill="#9f2727">NO SHARED POWER</text>
 <!-- route evidence monitor -->
 <rect x="72" y="545" width="620" height="123" rx="15" fill="#102a39" stroke="#4a6e7c" stroke-width="5" filter="url(#sh)"/><text x="382" y="570" text-anchor="middle" class="tiny" fill="#a2e8ff">CONTACT REPLAY · P-6</text><circle cx="148" cy="613" r="11" fill="#53c084"/><circle cx="283" cy="613" r="11" fill="#f4bd48"/><circle cx="430" cy="613" r="11" fill="#ef5e54" filter="url(#gl)"/><circle cx="584" cy="613" r="11" fill="#ef5e54" filter="url(#gl)"/><path d="M159 613h113M294 613h125M441 613h132" stroke="#ffd35b" stroke-width="7" stroke-dasharray="12 8"/><text x="148" y="642" text-anchor="middle" class="tiny" fill="#d9f4ff">A LOCKER</text><text x="283" y="642" text-anchor="middle" class="tiny" fill="#ffe7a1">P-6</text><text x="430" y="642" text-anchor="middle" class="tiny" fill="#ff9a92">CABLE</text><text x="584" y="642" text-anchor="middle" class="tiny" fill="#ff9a92">B ATTEMPT</text>
 <path d="M88 672h589q14 0 14 14v57H73v-57q0-14 15-14z" class="bub"/><text x="382" y="699" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="382">해결은 ‘소독해서 함께 쓰기’가 아니라, 전원 자체를 구역에 묶는 것이다.</tspan><tspan x="382" dy="20" font-size="12">不是“消毒后共用”，而是让电源永远留在各自区域。 / Lock the power source to its zone.</tspan></text>
 <text x="60" y="988" class="sfx">ISOLATE!  SPLIT POWER!  NO CROSS-CABLE!</text>
</g>

