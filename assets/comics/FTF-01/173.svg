 <g transform="translate(890 870)" filter="url(#sh)"><ellipse cy="-100" rx="30" ry="37" fill="#d9a47e" stroke="#102631" stroke-width="4"/><path d="M-30-112q8-27 30-30q24 2 31 26l-17-6q-21 2-44 10" fill="#242a2d"/><rect x="-52" y="-55" width="104" height="125" rx="20" fill="#346d91" stroke="#102631" stroke-width="4"/><rect x="-35" y="-15" width="70" height="23" rx="5" fill="#8fc9e3"/><path d="M-25 69v68M25 69v68" stroke="#243941" stroke-width="22"/></g>
 <g transform="translate(1005 870)" filter="url(#sh)"><ellipse cy="-100" rx="30" ry="37" fill="#e4b38e" stroke="#102631" stroke-width="4"/><path d="M-30-112q7-28 30-30q24 2 31 26l-16-6q-22 2-45 10" fill="#392b28"/><rect x="-52" y="-55" width="104" height="125" rx="20" fill="#3a947f" stroke="#102631" stroke-width="4"/><path d="M-25 69v68M25 69v68" stroke="#243941" stroke-width="22"/></g>
 <!-- validation dashboard -->
 <rect x="1076" y="700" width="362" height="217" rx="16" fill="#102a39" stroke="#78a6b7" stroke-width="6" filter="url(#sh)"/><text x="1257" y="729" text-anchor="middle" class="tiny" fill="#a4edff">24H STORM FAILOVER VALIDATION</text><text x="1110" y="768" class="t" font-size="17" font-weight="900" fill="#d9eff7">POWER EVENTS</text><text x="1392" y="768" text-anchor="end" class="mono" font-size="18" fill="#79f0aa">6 / 6 PASS</text><text x="1110" y="803" class="t" font-size="17" font-weight="900" fill="#d9eff7">CROSS-ZONE DEVICES</text><text x="1392" y="803" text-anchor="end" class="mono" font-size="18" fill="#79f0aa">0</text><text x="1110" y="838" class="t" font-size="17" font-weight="900" fill="#d9eff7">CONNECTOR SWABS</text><text x="1392" y="838" text-anchor="end" class="mono" font-size="18" fill="#79f0aa">24 / 24 NEG</text><text x="1110" y="873" class="t" font-size="17" font-weight="900" fill="#d9eff7">A/B UPTIME</text><text x="1392" y="873" text-anchor="end" class="mono" font-size="18" fill="#79f0aa">100%</text><rect x="1108" y="887" width="286" height="13" rx="6" fill="#24535d"/><rect x="1108" y="887" width="286" height="13" rx="6" fill="#54d58e"/>
 <!-- separate power paths -->
 <g transform="translate(892 635)"><rect x="-66" y="-45" width="132" height="90" rx="11" fill="#eef2f3" stroke="#294b57" stroke-width="5"/><rect x="-48" y="-27" width="96" height="42" rx="5" fill="url(#screen)"/><text x="0" y="-3" text-anchor="middle" class="tiny" fill="#80efad">A-UPS 100%</text><circle cx="0" cy="30" r="8" fill="#58d28e"/></g>
 <g transform="translate(1038 635)"><rect x="-66" y="-45" width="132" height="90" rx="11" fill="#eef2f3" stroke="#294b57" stroke-width="5"/><rect x="-48" y="-27" width="96" height="42" rx="5" fill="url(#screen)"/><text x="0" y="-3" text-anchor="middle" class="tiny" fill="#80efad">B-UPS 100%</text><circle cx="0" cy="30" r="8" fill="#58d28e"/></g>
 <path d="M892 681v20M1038 681v20" stroke="#8df0b0" stroke-width="8"/>
 <rect x="798" y="545" width="666" height="114" rx="18" class="box"/><text x="1131" y="574" text-anchor="middle" class="t cap"><tspan x="1131">A/B 전용 비상전원을 봉인 설치한 뒤 24시간 동안 여섯 차례 전원전환을 반복한다. 교차 장비 0, 커넥터 24/24 음성, 가동률 100%.</tspan><tspan x="1131" dy="25" font-size="14">安装A/B区专用密封备用电源后，24小时内反复切换6次：跨区设备0，接头24/24阴性，在线率100%。</tspan><tspan x="1131" dy="22" font-size="13">With sealed zone-dedicated backup power, six failovers pass: zero crossings, 24/24 connector swabs negative, 100% uptime.</tspan></text>
 <path d="M825 667h552q15 0 15 15v55q0 15-15 15H1127l-31 25 8-25H825q-15 0-15-15v-55q0-15 15-15z" class="bub"/><text x="1100" y="695" text-anchor="middle" class="t" font-size="16" font-weight="900"><tspan x="1100">이제 정전이 와도 사람·기기·케이블 어느 것도 경계를 넘지 않는다.</tspan><tspan x="1100" dy="21" font-size="12">即使停电，人、设备、线缆也不再越界。 / Even a blackout cannot reopen the crossing.</tspan></text>
 <text x="816" y="985" class="sfx">6/6 PASS!  24/24 NEG!  ZERO CROSSING!</text>
</g>
</svg>