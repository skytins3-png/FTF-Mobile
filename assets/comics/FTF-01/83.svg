<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 83 - 밤의 해초숲, 돌아온 어린 생명</title>
<desc id="desc">Polished four-panel cinematic manga scene continuing the seagrass restoration story: researchers launch a night watch, divers inspect a thriving seagrass meadow, juvenile rays and cuttlefish return, and the team records the recovery at sunrise. Korean, Chinese, and English narration, speech bubbles and visual sound effects are integrated.</desc>
<defs>
 <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143a68"/><stop offset=".55" stop-color="#6d5b9f"/><stop offset="1" stop-color="#ffae78"/></linearGradient>
 <linearGradient id="nightSea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#075f86"/><stop offset=".55" stop-color="#043f63"/><stop offset="1" stop-color="#01243f"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07577d"/><stop offset="1" stop-color="#011d35"/></linearGradient>
 <linearGradient id="sunrise" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8d28c"/><stop offset=".48" stop-color="#ff9f7a"/><stop offset="1" stop-color="#70b6da"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff8bd" stop-opacity=".95"/><stop offset="1" stop-color="#fff8bd" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
 <style>
 .panel{stroke:#071827;stroke-width:8}.box{fill:#fff;stroke:#071827;stroke-width:4;rx:14}.bubble{fill:#fff;stroke:#071827;stroke-width:4}.ko{font:700 24px 'Noto Sans KR',sans-serif;fill:#08151f}.zh{font:600 19px 'Noto Sans SC',sans-serif;fill:#172a36}.en{font:600 18px Arial,sans-serif;fill:#173342}.small{font-size:16px}.fx{font:900 39px Impact,Arial,sans-serif;fill:#fff;stroke:#074e76;stroke-width:8;paint-order:stroke;letter-spacing:1px}.line{stroke:#071827;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.skin{fill:#f3c3a0;stroke:#071827;stroke-width:3}.hair{fill:#261919;stroke:#071827;stroke-width:3}.suit{fill:#123b5a;stroke:#071827;stroke-width:3}.vest{fill:#0d2941;stroke:#071827;stroke-width:3}.eye{fill:#10212d}.seaweed{stroke:#3fbe6b;stroke-width:8;stroke-linecap:round;fill:none}.shine{fill:#a8ecff;opacity:.45}
 </style>
</defs>
<!-- PANEL 1: night-watch launch -->
<g class="panel"><rect x="4" y="4" width="592" height="386" fill="url(#dusk)"/>
 <circle cx="520" cy="70" r="28" fill="#fff2ca" opacity=".95"/><g fill="#fff" opacity=".8"><circle cx="473" cy="55" r="2"/><circle cx="420" cy="41" r="2"/><circle cx="550" cy="119" r="2"/><circle cx="365" cy="67" r="2"/></g>
 <path d="M4 250 Q160 220 320 253 T596 240V390H4Z" fill="#075d84"/><path d="M350 121h145l42 45v94H311v-80l39-59Z" fill="#f4f7f8" stroke="#071827" stroke-width="5"/><rect x="380" y="135" width="56" height="35" fill="#8bdcf5" stroke="#071827" stroke-width="4"/><rect x="445" y="135" width="49" height="35" fill="#8bdcf5" stroke="#071827" stroke-width="4"/><path d="M310 260h245l-31 48H344Z" fill="#184e70" stroke="#071827" stroke-width="5"/><text x="363" y="210" font-family="Arial" font-weight="900" font-size="19" fill="#143c5c">FTF OCEAN WATCH</text><line x1="425" y1="121" x2="425" y2="73" class="line"/><path d="M427 75l45 14-45 17Z" fill="#ffe36f" stroke="#071827" stroke-width="3"/>
 <!-- lead researcher --> <ellipse cx="154" cy="220" rx="44" ry="49" class="skin"/><path d="M108 208q14-72 74-48 41 17 27 72-11-31-31-39-45 18-70 15Z" class="hair"/><circle cx="143" cy="221" r="5" class="eye"/><circle cx="175" cy="218" r="5" class="eye"/><path d="M147 242q17 11 32-2" fill="none" class="line"/><path d="M102 268q53-26 107 2l25 99H75Z" class="vest"/><rect x="123" y="278" width="67" height="22" fill="#e6f8ff"/><text x="136" y="295" font-family="Arial" font-weight="900" font-size="14" fill="#12384e">FTF</text>
 <!-- equipment cases and crew --> <rect x="251" y="303" width="108" height="48" rx="7" fill="#ad7b43" stroke="#071827" stroke-width="4"/><text x="265" y="333" font-family="Arial" font-size="14" font-weight="800" fill="#fff">NIGHT CAM</text><circle cx="293" cy="241" r="25" class="skin"/><path d="M267 235q9-36 38-26 25 8 22 34-27-10-60-8Z" class="hair"/><path d="M261 265q33-18 65 2l10 42h-86Z" class="suit"/>
 <rect class="box" x="18" y="18" width="334" height="98"/><text x="32" y="49" class="ko">1. 해초숲의 밤을 기록하러 출항합니다.</text><text x="32" y="76" class="zh">我们出航，记录海草床的夜晚。</text><text x="32" y="102" class="en">We launch a night watch over the restored meadow.</text>
 <path class="bubble" d="M198 142h189q18 0 18 18v60q0 18-18 18h-96l-30 27 8-27h-71q-18 0-18-18v-60q0-18 18-18Z"/><text x="214" y="173" class="ko" font-size="19">“오늘은 누가 돌아왔을까요?”</text><text x="214" y="197" class="zh small">今晚会有谁回来呢？</text><text x="214" y="219" class="en small">Who came home tonight?</text>
 <text x="347" y="354" class="fx" transform="rotate(-4 347 354)">NIGHT WATCH!</text>
</g>
<!-- PANEL 2: illuminated meadow -->
<g class="panel"><rect x="604" y="4" width="592" height="386" fill="url(#deep)"/>
 <path d="M604 318q145-40 300 4t292-6v74H604Z" fill="#aa8a5e"/><g class="seaweed"><path d="M635 370q-28-94 3-175M664 373q30-101 7-183M703 370q-10-92 35-170M775 371q-21-106 9-181M815 370q29-96 7-176M1040 370q-22-104 11-176M1082 370q26-92 6-166M1140 369q-15-86 18-153"/></g>
 <ellipse cx="870" cy="196" rx="150" ry="120" fill="url(#lamp)"/><path d="M828 94L735 390" stroke="#fff6bd" stroke-width="42" opacity=".13"/>
 <!-- diver 1 --> <ellipse cx="792" cy="178" rx="40" ry="43" class="skin"/><path d="M750 169q14-58 66-31 21 16 11 53-26-20-77-22Z" class="hair"/><rect x="753" y="168" width="73" height="28" rx="12" fill="#b7efff" stroke="#071827" stroke-width="4"/><circle cx="776" cy="182" r="5" class="eye"/><circle cx="805" cy="182" r="5" class="eye"/><path d="M748 220q46-24 90 2l27 100-130-1Z" class="suit"/><rect x="714" y="225" width="22" height="91" rx="10" fill="#b8c8cf" stroke="#071827" stroke-width="4"/><path d="M757 254q-45 33-73 78" fill="none" class="line"/><path d="M838 254q49 18 81 40" fill="none" class="line"/><circle cx="682" cy="333" r="14" fill="#f3c3a0" stroke="#071827" stroke-width="3"/><rect x="900" y="276" width="54" height="34" rx="7" fill="#172d3d" stroke="#071827" stroke-width="4"/><circle cx="928" cy="293" r="9" fill="#75e7ff"/>
 <!-- juvenile ray --> <path d="M1010 154q52-42 108 4-34 16-54 50-16-33-54-54Z" fill="#8ccbd9" stroke="#071827" stroke-width="4"/><path d="M1064 205q14 55 4 97" fill="none" stroke="#071827" stroke-width="4"/><circle cx="1048" cy="166" r="4" class="eye"/><circle cx="1080" cy="166" r="4" class="eye"/>
 <!-- cuttlefish --> <ellipse cx="1003" cy="252" rx="42" ry="25" fill="#d9a05c" stroke="#071827" stroke-width="4"/><path d="M967 246q-27-17-35 4 15 14 35 8M1038 246q26-17 35 4-15 14-35 8" fill="#d9a05c" stroke="#071827" stroke-width="4"/><circle cx="988" cy="247" r="4" class="eye"/><circle cx="1016" cy="247" r="4" class="eye"/><path d="M980 270l-7 18M992 272l-2 19M1005 273l2 18M1018 271l8 17" class="line"/>
 <rect class="box" x="620" y="18" width="389" height="96"/><text x="635" y="48" class="ko">2. 조명 아래 해초숲이 살아 움직입니다.</text><text x="635" y="75" class="zh">灯光下，海草森林正在苏醒。</text><text x="635" y="101" class="en">Under the lamps, the seagrass meadow comes alive.</text>
 <path class="bubble" d="M916 113h244q18 0 18 18v58q0 18-18 18h-129l-28 24 6-24h-93q-18 0-18-18v-58q0-18 18-18Z"/><text x="932" y="145" class="ko" font-size="19">“어린 가오리예요! 갑오징어도 있어요!”</text><text x="932" y="169" class="zh small">小鳐鱼！还有乌贼！</text><text x="932" y="191" class="en small">A young ray—and a cuttlefish!</text>
 <text x="931" y="350" class="fx" transform="rotate(-6 931 350)">WHOOSH · GLOW!</text>
</g>
<!-- PANEL 3: evidence of recovery -->
<g class="panel"><rect x="4" y="398" width="592" height="398" fill="url(#nightSea)"/>
 <path d="M4 699q155-47 302-3t290-2v102H4Z" fill="#a78558"/><g class="seaweed"><path d="M51 760q-17-104 15-187M93 765q28-103 4-185M137 760q-7-91 37-173M446 763q-24-98 4-178M489 763q27-101 3-184M548 762q-12-91 24-165"/></g>
 <!-- monitoring frame --> <rect x="216" y="530" width="188" height="126" fill="none" stroke="#e1ecf1" stroke-width="7"/><line x1="216" y1="592" x2="404" y2="592" stroke="#e1ecf1" stroke-width="3"/><line x1="309" y1="530" x2="309" y2="656" stroke="#e1ecf1" stroke-width="3"/>
 <!-- diver scientist --> <ellipse cx="132" cy="552" rx="38" ry="40" class="skin"/><path d="M94 545q12-53 59-27 18 13 10 42-24-18-69-15Z" class="hair"/><rect x="99" y="544" width="65" height="25" rx="11" fill="#b8edff" stroke="#071827" stroke-width="4"/><path d="M91 590q41-21 82 2l20 82H76Z" class="suit"/><path d="M169 610q35-18 61-14" fill="none" class="line"/>
 <!-- fish nursery inside frame --> <g fill="#ffd15c" stroke="#071827" stroke-width="3"><path d="M252 565q24-16 48 0-24 17-48 0l-16 11 3-22Z"/><path d="M329 618q22-15 44 0-22 16-44 0l-15 10 3-20Z"/><path d="M349 551q20-13 40 0-20 14-40 0l-13 9 2-18Z"/></g>
 <!-- data HUD --> <rect x="414" y="516" width="158" height="151" rx="14" fill="#082d48" stroke="#77dcff" stroke-width="4"/><text x="430" y="544" font-family="Arial" font-weight="800" font-size="17" fill="#d9f7ff">NURSERY INDEX</text><text x="430" y="575" font-family="Arial" font-weight="900" font-size="29" fill="#78ffad">+74%</text><text x="430" y="605" font-family="Arial" font-weight="800" font-size="15" fill="#d9f7ff">JUVENILE COUNT</text><text x="430" y="636" font-family="Arial" font-weight="900" font-size="29" fill="#ffe172">+63%</text>
 <rect class="box" x="18" y="412" width="404" height="96"/><text x="33" y="442" class="ko">3. 숫자와 생명 모두 회복을 증명합니다.</text><text x="33" y="469" class="zh">数据和生命一起证明恢复正在发生。</text><text x="33" y="495" class="en">The data and new life confirm the recovery.</text>
 <path class="bubble" d="M170 680h314q18 0 18 18v52q0 18-18 18H329l-27 22 6-22H170q-18 0-18-18v-52q0-18 18-18Z"/><text x="187" y="710" class="ko" font-size="19">“이곳이 진짜 어린 생명의 보육원이 됐어요.”</text><text x="187" y="733" class="zh small">这里真的成了幼小生命的育儿所。</text><text x="187" y="755" class="en small">The meadow has become a real nursery.</text>
 <text x="350" y="690" class="fx" transform="rotate(-4 350 690)">REAL LIFE!</text>
</g>
<!-- PANEL 4: sunrise log + promise -->
<g class="panel"><rect x="604" y="398" width="592" height="398" fill="url(#sunrise)"/>
 <circle cx="1018" cy="492" r="49" fill="#fff4bd" opacity=".92"/><path d="M604 605q116-36 230 1t220-4t142 6v188H604Z" fill="#09658d"/><path d="M604 627q113-25 226 7t219-4t147 9" fill="none" stroke="#c0efff" stroke-width="5" opacity=".7"/>
 <!-- table + tablet --> <rect x="827" y="648" width="243" height="32" rx="10" fill="#784d31" stroke="#071827" stroke-width="4"/><rect x="887" y="588" width="112" height="70" rx="7" fill="#173a54" stroke="#071827" stroke-width="4"/><polyline points="900,640 925,618 946,627 970,600 988,609" fill="none" stroke="#77ffa8" stroke-width="5"/>
 <!-- researcher --> <ellipse cx="759" cy="558" rx="43" ry="47" class="skin"/><path d="M714 547q15-68 70-43 37 17 23 65-15-28-31-33-40 16-62 11Z" class="hair"/><circle cx="746" cy="559" r="5" class="eye"/><circle cx="776" cy="557" r="5" class="eye"/><path d="M748 580q18 12 34-3" fill="none" class="line"/><path d="M707 605q53-25 104 4l22 117H680Z" class="vest"/><rect x="729" y="615" width="62" height="21" fill="#e8f8ff"/><text x="741" y="631" font-family="Arial" font-weight="900" font-size="13" fill="#14364c">FTF</text>
 <!-- two children --> <ellipse cx="1060" cy="602" rx="34" ry="37" class="skin"/><path d="M1027 595q10-49 46-29 26 14 20 42-25-18-66-13Z" class="hair"/><path d="M1018 636q41-19 81 2l17 89h-112Z" fill="#e8f7ff" stroke="#071827" stroke-width="3"/><ellipse cx="1134" cy="615" rx="32" ry="35" class="skin"/><path d="M1103 608q9-47 43-27 24 13 18 39-21-16-61-12Z" class="hair"/><path d="M1096 647q38-18 75 2l14 78h-103Z" fill="#fff3c8" stroke="#071827" stroke-width="3"/>
 <rect class="box" x="620" y="412" width="423" height="98"/><text x="635" y="442" class="ko">4. 새벽 기록에는 '다음 세대'라는 이름을 붙입니다.</text><text x="635" y="469" class="zh">黎明的记录，被命名为“下一代”。</text><text x="635" y="495" class="en">At dawn, we name this recovery: “the next generation.”</text>
 <path class="bubble" d="M840 512h317q18 0 18 18v59q0 18-18 18H1016l-28 26 6-26H840q-18 0-18-18v-59q0-18 18-18Z"/><text x="856" y="543" class="ko" font-size="19">“오늘 돌아온 작은 생명이 내일의 큰 바다가 돼요.”</text><text x="856" y="567" class="zh small">今天回来的小生命，会成为明天的大海。</text><text x="856" y="589" class="en small">Small lives today become tomorrow’s ocean.</text>
 <text x="884" y="756" class="fx" transform="rotate(-4 884 756)">NEXT GENERATION!</text>
</g>
<rect x="4" y="4" width="1192" height="792" fill="none" stroke="#071827" stroke-width="8"/>
<text x="16" y="790" font-family="Arial" font-weight="800" font-size="16" fill="#091a25">FTF-01  #83  |  밤의 해초숲, 돌아온 어린 생명  |  夜晚的海草床，归来的幼小生命  |  Night Meadow, Returning Young Life</text>
</svg>