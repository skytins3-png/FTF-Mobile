<g transform="translate(297,294)"><path d="M0 0q42-36 100-9 39 18 74-4" fill="none" stroke="#6f604b" stroke-width="8"/><path d="M31-17l25 17-10 26-29-7z" fill="#cbd1d3" class="line"/><path d="M82-20l28 8-4 30-29-1z" fill="#5ba8cf" class="line"/><path d="M137-14l33 13-8 29-33-4z" fill="#e4e9ec" class="line"/></g>
<rect x="18" y="16" width="385" height="112" rx="8" class="box"/><text x="31" y="44" class="txt ko">산호를 덮은 폐그물과 플라스틱을 정밀 제거합니다.</text><text x="31" y="73" class="txt zh">我们精准清除覆盖珊瑚的废弃渔网和塑料。</text><text x="31" y="100" class="txt en">We carefully remove ghost nets and plastic from the reef.</text>
<rect x="421" y="18" width="300" height="112" rx="54" class="bubble"/><text x="571" y="48" text-anchor="middle" class="txt ko">조심히 잘라! 산호가 다시 살아날 수 있어!</text><text x="571" y="77" text-anchor="middle" class="txt zh">小心剪开！珊瑚还能恢复！</text><text x="571" y="104" text-anchor="middle" class="txt en">Cut carefully—the coral can recover!</text><text x="446" y="397" class="sfx" font-size="48" fill="#58ddff">SNIP!  LIFT!</text>
</g>

