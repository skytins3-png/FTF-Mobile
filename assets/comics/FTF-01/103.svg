<g transform="translate(311,197)" filter="url(#sh)"><circle cx="62" cy="58" r="39" class="skin2 line"/><path d="M27 58q6-40 35-42 35 2 39 42-18-12-34-22-14 14-39 22z" class="hair line"/><path d="M36 92q-22 36-18 103h98q2-64-27-102z" class="vest line"/><path d="M96 136l96-30 9 27-98 47" class="skin2 line"/></g>
<rect x="18" y="16" width="362" height="112" rx="8" class="box"/><text x="31" y="44" class="txt ko">데이터가 가리킨 다음 해역으로 다시 출항합니다.</text><text x="31" y="73" class="txt zh">我们再次驶向数据标出的下一个海域。</text><text x="31" y="100" class="txt en">We head back out to the next site marked by the data.</text>
<rect x="403" y="18" width="320" height="112" rx="55" class="bubble"/><text x="563" y="48" text-anchor="middle" class="txt ko">이번에도 더 푸른 바다를 만들러 가요!</text><text x="563" y="77" text-anchor="middle" class="txt zh">这次也去创造更蓝的海洋吧！</text><text x="563" y="104" text-anchor="middle" class="txt en">Let’s make an even bluer ocean!</text><text x="30" y="395" class="sfx" font-size="45" fill="#1d85d2">TO THE NEXT SITE!</text>
</g>

<!-- PANEL 2: precise ghost-net removal -->
<g transform="translate(774,80)">
