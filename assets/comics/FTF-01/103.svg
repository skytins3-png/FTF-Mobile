<rect x="18" y="16" width="380" height="112" rx="8" class="box"/><text x="31" y="44" class="txt ko">이번 조사에서 오염 수치가 62% 감소한 것을 확인했습니다.</text><text x="31" y="73" class="txt zh">本次调查确认污染指标下降了62%。</text><text x="31" y="100" class="txt en">This survey confirms pollution levels are down by 62%.</text>
<rect x="420" y="18" width="302" height="112" rx="54" class="bubble"/><text x="571" y="48" text-anchor="middle" class="txt ko">우리가 함께하면 바다는 반드시 회복할 수 있어!</text><text x="571" y="77" text-anchor="middle" class="txt zh">只要一起努力，海洋一定能恢复！</text><text x="571" y="104" text-anchor="middle" class="txt en">Together, we can restore the ocean!</text>
<text x="391" y="457" class="sfx" font-size="42" fill="#66dbff">CLEANER OCEAN · BRIGHTER TOMORROW!</text>
</g>
