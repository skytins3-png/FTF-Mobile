<g fill="#4bc2d1" stroke="#20323b" stroke-width="3"><path d="M178 244q32-21 69 0-37 23-69 0z"/><path d="M496 237q30-20 65 0-35 22-65 0z"/></g>
<rect x="18" y="16" width="390" height="112" rx="8" class="box"/><text x="31" y="44" class="txt ko">정화된 산호초에 물고기와 바다거북이 다시 돌아옵니다.</text><text x="31" y="73" class="txt zh">清理后的珊瑚礁迎回了鱼群和海龟。</text><text x="31" y="100" class="txt en">Fish and sea turtles return to the restored reef.</text>
<rect x="429" y="18" width="292" height="112" rx="54" class="bubble"/><text x="575" y="48" text-anchor="middle" class="txt ko">봐! 정말 다시 살아나고 있어!</text><text x="575" y="77" text-anchor="middle" class="txt zh">看！真的又活起来了！</text><text x="575" y="104" text-anchor="middle" class="txt en">Look—it’s truly coming back to life!</text><text x="30" y="458" class="sfx" font-size="52" fill="#ffe74e">LIFE RETURNS!</text>
</g>

<!-- PANEL 4: data proof and next commitment -->
<g transform="translate(774,518)">
<rect class="p" width="748" height="490" rx="8" fill="url(#sunset)"/><circle cx="618" cy="103" r="51" fill="#fff0ad"/><path d="M0 282q105-35 210 0t205 0 180 0 153 0v208H0z" fill="#285e77" opacity=".96"/>
