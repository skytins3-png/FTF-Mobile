<rect width="1536" height="1024" fill="#07151e"/><rect width="1536" height="66" fill="#0a385e"/>
<text x="20" y="45" class="tag" font-size="34" fill="#fff">FTF-01  #103</text>
<text x="275" y="42" class="txt" font-size="28" fill="#fff">다시, 더 푸른 바다를 위해 · 再次为了更蓝的海洋 · FOR A BLUER OCEAN, AGAIN</text>
<text x="1510" y="42" text-anchor="end" class="txt" font-size="16" fill="#d7f7ff">작은 행동이 만드는 큰 바다의 변화</text>

<!-- PANEL 1: depart to next data target -->
<g transform="translate(14,80)">
<rect class="p" width="748" height="424" rx="8" fill="url(#sky)"/><path d="M0 270q110-28 215 0t205 0 190 0 138 0v154H0z" fill="#1595bd"/><path d="M0 298q95-18 190 0t190 0 190 0 178 0" fill="none" stroke="#c9f7ff" stroke-width="7"/>
<g transform="translate(438,101)" filter="url(#sh)"><path d="M0 153h246l-32 92H35z" fill="#f5f7f7" class="line"/><rect x="70" y="61" width="122" height="94" fill="#eef3f4" class="line"/><rect x="95" y="78" width="30" height="24" fill="#8fd3e7" class="line"/><rect x="138" y="78" width="30" height="24" fill="#8fd3e7" class="line"/><path d="M128 61V14" stroke="#263d49" stroke-width="8"/><path d="M128 14l42 25h-42z" fill="#155f92"/><text x="128" y="133" text-anchor="middle" class="tag" font-size="23" fill="#155f92">FTF</text><text x="128" y="151" text-anchor="middle" class="txt" font-size="12" fill="#31566f">FOR THE FUTURE</text></g>
