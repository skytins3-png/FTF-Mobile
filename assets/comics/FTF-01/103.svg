<g transform="translate(423,171)" filter="url(#sh)"><circle cx="73" cy="63" r="42" class="skin line"/><path d="M34 64q5-45 39-47 39 2 43 47-20-14-38-25-15 15-44 25z" class="hair line"/><path d="M42 99q-25 42-20 120h112q3-75-33-118z" class="ftf line"/><path d="M103 147l104-35 12 28-110 58" class="skin line"/><circle cx="202" cy="126" r="12" fill="#fff" class="line"/></g>
