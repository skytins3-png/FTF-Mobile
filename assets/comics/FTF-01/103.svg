<linearGradient id="reef" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a7593"/><stop offset="1" stop-color="#063647"/></linearGradient>
<linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd56d"/><stop offset=".5" stop-color="#ef8f70"/><stop offset="1" stop-color="#465873"/></linearGradient>
