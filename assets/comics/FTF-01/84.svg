<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 84 - 유령그물 없는 바다로</title>
<desc id="desc">Four-panel cinematic manga scene in the approved FTF direction: the ocean team spots a ghost net at sea, divers carefully free a trapped sea turtle, recovered nets and marine debris are lifted aboard, and researchers with children promise to protect an ocean free from ghost nets. Korean, Chinese and English narration, speech bubbles and visual sound effects are integrated.</desc>
<defs>
 <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb56e"/><stop offset=".42" stop-color="#6ea7d9"/><stop offset="1" stop-color="#174c72"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#128ec1"/><stop offset="1" stop-color="#02365e"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b77a8"/><stop offset="1" stop-color="#01233d"/></linearGradient>
 <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd584"/><stop offset=".55" stop-color="#ff9a70"/><stop offset="1" stop-color="#4c79a5"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
 <style>
 .panel{stroke:#081923;stroke-width:8}.box{fill:#fff;stroke:#081923;stroke-width:4}.bubble{fill:#fff;stroke:#081923;stroke-width:4}.ko{font:700 23px 'Noto Sans KR',sans-serif;fill:#081923}.zh{font:600 18px 'Noto Sans SC',sans-serif;fill:#1a2e38}.en{font:600 17px Arial,sans-serif;fill:#193644}.small{font-size:15px}.fx{font:900 39px Impact,Arial,sans-serif;fill:#fff;stroke:#064f84;stroke-width:8;paint-order:stroke;letter-spacing:1px}.line{stroke:#081923;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.skin{fill:#f1c19c;stroke:#081923;stroke-width:3}.hair{fill:#2a1a18;stroke:#081923;stroke-width:3}.suit{fill:#123a57;stroke:#081923;stroke-width:3}.vest{fill:#0c2a42;stroke:#081923;stroke-width:3}.eye{fill:#10212b}.net{fill:none;stroke:#8ca3ad;stroke-width:3;opacity:.95}
 </style>
</defs>
<!-- PANEL 1: ghost net sighting -->
<g class="panel"><rect x="4" y="4" width="592" height="386" fill="url(#sunset)"/>
 <circle cx="530" cy="69" r="34" fill="#ffd686"/><path d="M4 244q150-25 302 8t290-10v148H4Z" fill="url(#sea)"/>
 <!-- vessel --> <path d="M320 144h157l53 48v70H286v-67l34-51Z" fill="#f7f8f7" stroke="#081923" stroke-width="5"/><rect x="355" y="155" width="56" height="34" fill="#9de5ff" stroke="#081923" stroke-width="4"/><rect x="420" y="155" width="48" height="34" fill="#9de5ff" stroke="#081923" stroke-width="4"/><path d="M286 260h269l-31 50H321Z" fill="#174d6c" stroke="#081923" stroke-width="5"/><text x="351" y="223" font-family="Arial" font-size="19" font-weight="900" fill="#13405c">FTF OCEAN TEAM</text><line x1="404" y1="144" x2="404" y2="95" class="line"/><path d="M406 98l47 16-47 18Z" fill="#ffe16a" stroke="#081923" stroke-width="3"/>
 <!-- lead researcher with binoculars --> <ellipse cx="151" cy="211" rx="42" ry="47" class="skin"/><path d="M108 199q12-66 69-45 41 17 26 70-10-31-31-38-39 17-64 13Z" class="hair"/><path d="M105 258q52-27 103 2l23 102H78Z" class="vest"/><rect x="126" y="271" width="67" height="22" fill="#e6f8ff"/><text x="139" y="288" font-family="Arial" font-weight="900" font-size="14" fill="#14384e">FTF</text><circle cx="131" cy="207" r="21" fill="#13232f" stroke="#081923" stroke-width="4"/><circle cx="174" cy="207" r="21" fill="#13232f" stroke="#081923" stroke-width="4"/><rect x="148" y="199" width="9" height="15" fill="#081923"/><path d="M105 215q-27 20-38 38M196 215q24 14 36 34" class="line" fill="none"/>
 <!-- deck spotter --> <ellipse cx="265" cy="252" rx="31" ry="34" class="skin"/><path d="M234 247q9-43 43-27 24 11 18 37-23-13-61-10Z" class="hair"/><path d="M227 286q37-18 75 1l12 72h-101Z" class="suit"/><path d="M292 288q34-17 61-44" class="line" fill="none"/>
 <!-- floating net debris --> <g class="net"><path d="M497 308q21-24 43-2t31-4M507 299l32 31M521 291l36 42M541 294l24 33"/></g><circle cx="553" cy="321" r="7" fill="#f77"/><path d="M525 336q20-7 41 2" fill="none" stroke="#fff" stroke-width="3"/>
 <rect class="box" x="17" y="17" width="337" height="94" rx="12"/><text x="31" y="47" class="ko">1. 수평선 너머 유령그물 흔적을 발견합니다.</text><text x="31" y="72" class="zh">我们在海面发现幽灵渔网的痕迹。</text><text x="31" y="97" class="en">We spot signs of a ghost net beyond the waves.</text>
 <path class="bubble" d="M205 118h269q18 0 18 18v64q0 18-18 18H354l-31 28 7-28H205q-18 0-18-18v-64q0-18 18-18Z"/><text x="221" y="150" class="ko">저기다! 그물 조각이 보여요!</text><text x="221" y="176" class="zh small">在那里！我看到渔网碎片！</text><text x="221" y="199" class="en small">There it is—I can see pieces of a ghost net!</text>
 <text x="35" y="347" class="fx" transform="rotate(-4 35 347)">FIND AND REMOVE!</text>
</g>
<!-- PANEL 2: underwater rescue -->
<g class="panel"><rect x="604" y="4" width="592" height="386" fill="url(#deep)"/>
 <g opacity=".42" fill="#9ceaff"><circle cx="676" cy="54" r="8"/><circle cx="706" cy="96" r="5"/><circle cx="1100" cy="70" r="7"/><circle cx="1126" cy="122" r="5"/></g>
 <!-- coral and seabed --> <path d="M604 330q140-40 290-3t302-7v70H604Z" fill="#9b7f5f"/><g fill="#e38d65" stroke="#081923" stroke-width="3"><path d="M650 350q-13-48 9-83 8 26 19 44 9-31 26-50 3 42-2 89Z"/><path d="M1061 351q-16-44 7-79 10 20 18 40 12-25 27-47 0 48-7 86Z"/></g>
 <!-- turtle --> <ellipse cx="1009" cy="224" rx="68" ry="50" fill="#87ae73" stroke="#081923" stroke-width="4"/><ellipse cx="1075" cy="211" rx="27" ry="22" fill="#9fc584" stroke="#081923" stroke-width="4"/><path d="M958 221q-52-23-64 8 25 26 67 20M1016 175q-17-46 19-50 24 19 10 58M1026 268q6 42 39 35 17-28-7-52" fill="#8fba7a" stroke="#081923" stroke-width="4"/><circle cx="1081" cy="207" r="4" class="eye"/>
 <!-- ghost net around turtle --> <g class="net"><path d="M934 165q77 48 158 98M922 193q86 37 159 84M946 148q22 93 102 151M979 143q15 94 82 145M918 242q102-23 184-7"/></g>
 <!-- diver foreground --> <ellipse cx="793" cy="193" rx="40" ry="42" class="skin"/><path d="M754 183q13-56 61-32 22 14 15 47-24-18-76-15Z" class="hair"/><rect x="756" y="184" width="73" height="28" rx="12" fill="#b6efff" stroke="#081923" stroke-width="4"/><circle cx="781" cy="197" r="5" class="eye"/><circle cx="808" cy="197" r="5" class="eye"/><path d="M748 235q46-23 91 2l31 117H725Z" class="suit"/><rect x="709" y="239" width="22" height="94" rx="10" fill="#bccbd1" stroke="#081923" stroke-width="4"/><path d="M839 261q40 4 74 18" class="line" fill="none"/><path d="M910 270l49 8" stroke="#081923" stroke-width="6"/><path d="M952 262l28 23M952 286l28-23" stroke="#d9e6ea" stroke-width="7" stroke-linecap="round"/>
 <!-- second diver --> <ellipse cx="683" cy="143" rx="26" ry="28" class="skin"/><rect x="660" y="138" width="48" height="20" rx="9" fill="#b6efff" stroke="#081923" stroke-width="3"/><path d="M650 172q34-16 66 1l17 70h-91Z" class="suit"/><rect x="630" y="177" width="15" height="59" rx="8" fill="#bccbd1" stroke="#081923" stroke-width="3"/>
 <rect class="box" x="620" y="18" width="398" height="93" rx="12"/><text x="635" y="48" class="ko">2. 잠수팀이 얽힌 그물을 천천히 제거합니다.</text><text x="635" y="74" class="zh">潜水队小心拆除缠绕海龟的幽灵渔网。</text><text x="635" y="99" class="en">Divers carefully cut the ghost net away from the turtle.</text>
 <path class="bubble" d="M837 117h326q18 0 18 18v58q0 18-18 18h-173l-30 26 7-26H837q-18 0-18-18v-58q0-18 18-18Z"/><text x="853" y="148" class="ko">조심해… 거북이가 놀라지 않게.</text><text x="853" y="171" class="zh small">慢一点…别惊到海龟。</text><text x="853" y="194" class="en small">Easy… don’t frighten the turtle.</text>
 <text x="990" y="350" class="fx" transform="rotate(-8 990 350)">SNIP! SNAP!</text>
</g>
<!-- PANEL 3: recovered debris aboard -->
<g class="panel"><rect x="4" y="398" width="592" height="398" fill="#9fd7ee"/>
 <path d="M4 666q128-23 276 6t316-8v132H4Z" fill="#12658d"/>
 <rect x="14" y="510" width="568" height="220" rx="18" fill="#d8e6ea" stroke="#081923" stroke-width="5"/>
 <!-- crane --> <rect x="418" y="485" width="20" height="172" fill="#f1c34f" stroke="#081923" stroke-width="4"/><path d="M428 496q83 2 110 54" fill="none" stroke="#081923" stroke-width="7"/><line x1="536" y1="550" x2="536" y2="622" class="line"/><path d="M526 622q10 22 20 0" fill="none" class="line"/>
 <!-- huge recovered net --> <path d="M44 627q63-60 142-24 80-40 154 20 42 43 92 11l27 79H55Z" fill="#7b8d94" stroke="#081923" stroke-width="4"/><g class="net"><path d="M75 620q91 89 200 7t138 62M89 664q92-65 182 29t123-45M120 595q-7 88 59 115M178 588q9 88 73 121M249 589q19 79 87 120M317 604q6 69 66 104"/></g><g fill="#e56c4e"><circle cx="113" cy="666" r="13"/><circle cx="221" cy="631" r="10"/><circle cx="341" cy="676" r="12"/></g><rect x="382" y="669" width="64" height="39" fill="#3f7db0" stroke="#081923" stroke-width="4"/>
 <!-- researchers --> <ellipse cx="115" cy="518" rx="33" ry="36" class="skin"/><path d="M82 512q8-46 41-31 27 10 24 41-28-12-65-10Z" class="hair"/><path d="M71 554q44-20 87 0l15 75H56Z" class="suit"/><ellipse cx="222" cy="523" rx="31" ry="34" class="skin"/><path d="M192 516q10-44 42-28 22 11 18 37-24-12-60-9Z" class="hair"/><path d="M181 558q40-19 82 0l15 67H165Z" class="suit"/>
 <rect class="box" x="18" y="412" width="406" height="95" rx="12"/><text x="33" y="442" class="ko">3. 회수된 유령그물과 해양 쓰레기를 인양합니다.</text><text x="33" y="468" class="zh">我们把幽灵渔网和海洋垃圾吊上甲板。</text><text x="33" y="493" class="en">Recovered ghost nets and marine debris are lifted aboard.</text>
 <path class="bubble" d="M248 514h318q17 0 17 17v62q0 17-17 17H446l-29 26 7-26H248q-17 0-17-17v-62q0-17 17-17Z"/><text x="264" y="546" class="ko">이만큼이나… 아직도 많은 그물이 남았어요.</text><text x="264" y="571" class="zh small">竟然有这么多…海里还有很多。</text><text x="264" y="594" class="en small">This much… and there are still more out there.</text>
 <text x="54" y="760" class="fx" transform="rotate(-4 54 760)">CLEAN OCEAN · HEALTHY LIFE!</text>
</g>
<!-- PANEL 4: promise for the future -->
<g class="panel"><rect x="604" y="398" width="592" height="398" fill="url(#dawn)"/>
 <circle cx="1090" cy="500" r="37" fill="#ffe29b"/><path d="M604 665q140-34 282 5t310-9v135H604Z" fill="#17678d"/>
 <!-- researcher --> <ellipse cx="918" cy="531" rx="42" ry="46" class="skin"/><path d="M875 520q11-63 65-42 37 14 27 61-15-24-37-31-27 15-55 12Z" class="hair"/><path d="M862 577q56-27 108 3l21 111H836Z" class="vest"/><rect x="886" y="591" width="67" height="22" fill="#e7f8ff"/><text x="899" y="608" font-family="Arial" font-size="14" font-weight="900" fill="#14384e">FTF</text>
 <!-- children --> <g><ellipse cx="700" cy="592" rx="31" ry="34" class="skin"/><path d="M669 586q9-45 42-28 22 12 18 37-24-12-60-9Z" class="hair"/><path d="M661 626q39-18 79 0l14 64h-106Z" fill="#f07d70" stroke="#081923" stroke-width="3"/><ellipse cx="781" cy="585" rx="31" ry="34" class="skin"/><path d="M750 578q10-45 43-28 21 11 17 36-24-12-60-8Z" class="hair"/><path d="M741 619q40-18 80 1l14 70H728Z" fill="#5d91ca" stroke="#081923" stroke-width="3"/></g>
 <!-- banner --> <rect x="655" y="671" width="470" height="87" rx="10" fill="#fff" stroke="#081923" stroke-width="4"/><text x="727" y="706" font-family="Arial" font-size="30" font-weight="900" fill="#155d92">NO GHOST NETS · MORE LIFE</text><text x="744" y="734" class="ko" font-size="18">유령그물 없는 바다, 더 많은 생명</text><text x="795" y="755" class="zh small">没有幽灵渔网的海洋，更多生命</text>
 <rect class="box" x="620" y="412" width="455" height="100" rx="12"/><text x="635" y="442" class="ko">4. 유령그물 없는 바다를 위해 행동을 이어갑니다.</text><text x="635" y="469" class="zh">为了没有幽灵渔网的海洋，我们继续行动。</text><text x="635" y="495" class="en">We keep taking action for an ocean free from ghost nets.</text>
 <path class="bubble" d="M921 517h249q17 0 17 17v64q0 17-17 17h-112l-26 25 5-25h-116q-17 0-17-17v-64q0-17 17-17Z"/><text x="936" y="549" class="ko">우리의 작은 노력이 더 많은 생명을 지킬 거야!</text><text x="936" y="574" class="zh small">我们的努力会守护更多生命！</text><text x="936" y="598" class="en small">Our small efforts will protect more lives!</text>
 <text x="866" y="783" class="fx" transform="rotate(-5 866 783)">TOGETHER FOR TOMORROW!</text>
</g>
</svg>