<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 148 converts the W-3 finding into a harbor-wide workboat biosecurity gate">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10263d"/><stop offset="1" stop-color="#efab68"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#168ca3"/><stop offset="1" stop-color="#063e50"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity=".4"/></filter><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1536" height="1024" fill="#06141d"/><rect x="12" y="12" width="1512" height="58" rx="12" fill="#173f56"/><text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="32" font-weight="900">FTF-01  #148  작업선 전체에 생물보안 게이트를 세운다</text><text x="930" y="49" fill="#c9f8ff" font-family="Arial" font-size="18" font-weight="800">TRACE → SCREEN → CLEAN → RELEASE · 港内作业船生物安全闸门</text>
<!-- P1 harbor command -->
<g><rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/><rect x="16" y="330" width="746" height="182" fill="url(#sea)"/>
<g filter="url(#s)"><rect x="60" y="260" width="260" height="165" rx="12" fill="#dce9ee" stroke="#102b38" stroke-width="6"/><rect x="85" y="285" width="210" height="90" rx="8" fill="#082d3e"/><path d="M105 350L150 320 195 338 238 300 278 326" fill="none" stroke="#61f0ff" stroke-width="5"/><circle cx="150" cy="320" r="8" fill="#ffd957"/><circle cx="238" cy="300" r="8" fill="#ff5964"/><text x="190" y="402" text-anchor="middle" fill="#173541" font-family="Arial" font-size="16" font-weight="900">HARBOR MOVEMENT MAP · 7 WORKBOATS</text></g>
<g transform="translate(400 360)" filter="url(#s)"><ellipse cx="0" cy="-66" rx="31" ry="37" fill="#d4a078" stroke="#122934" stroke-width="5"/><path d="M-28-72q8-31 29-32q25 3 31 31l-17-8q-19 8-43 9" fill="#332b2a"/><rect x="-43" y="-23" width="86" height="117" rx="20" fill="#f0f4f5" stroke="#122934" stroke-width="5"/><path d="M-35 3l-78 37M35 1l76 34" stroke="#f0f4f5" stroke-width="20" stroke-linecap="round"/></g>
<g transform="translate(600 390)" filter="url(#s)"><path d="M-125 34h238l-34 60H-96z" fill="#e4ecef" stroke="#18333e" stroke-width="5"/><rect x="-52" y="-17" width="88" height="53" rx="5" fill="#bad4db" stroke="#18333e" stroke-width="4"/><text y="77" text-anchor="middle" fill="#17333d" font-family="Arial" font-size="14" font-weight="900">W-1 · W-2 · W-3 · W-4...</text></g>
<rect x="38" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="298" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">W-3 한 척만 씻어서는 끝나지 않는다. 같은 부두를 오간 작업선 7척의 접촉 경로를 전부 겹쳐 본다.</tspan><tspan x="298" dy="24" font-size="14">只清洗W-3还不够。把往返同一泊位的7艘作业船接触路线全部叠加。</tspan><tspan x="298" dy="22" font-size="13">Cleaning W-3 alone is not enough. Overlay every contact route of seven harbor workboats.</tspan></text>
<path d="M574 104h158q18 0 18 18v76q0 18-18 18h-91l-30 27 9-27h-46q-18 0-18-18v-76q0-18 18-18z" fill="#fff3cb" stroke="#111" stroke-width="4"/><text x="653" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="653">모든 이동 고리를 확인해!</tspan><tspan x="653" dy="21">检查全部传播链！</tspan><tspan x="653" dy="19" font-size="12">Trace every transfer link!</tspan></text><text x="42" y="487" fill="#fff" stroke="#254d62" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">MAP!  LINK!  SCREEN THE FLEET!</text></g>
<!-- P2 gate -->
<g><rect x="774" y="84" width="746" height="428" rx="12" fill="#153b4c"/><rect x="774" y="330" width="746" height="182" fill="#086276"/><rect x="930" y="250" width="410" height="165" rx="15" fill="#dbe8ec" stroke="#102a35" stroke-width="7"/><text x="1135" y="282" text-anchor="middle" fill="#163743" font-family="Arial" font-size="18" font-weight="900">BIOSECURITY GATE · 이동 전 검사 / 移动前检查</text><rect x="965" y="302" width="115" height="75" rx="8" fill="#082f40"/><text x="1022" y="330" text-anchor="middle" fill="#b9f8ff" font-size="13" font-family="Arial" font-weight="900">eDNA SWAB</text><path d="M985 351h75" stroke="#65efff" stroke-width="5"/><rect x="1100" y="302" width="105" height="75" rx="8" fill="#0b3b31"/><text x="1152" y="330" text-anchor="middle" fill="#bfffd8" font-size="13" font-family="Arial" font-weight="900">LINE CHECK</text><path d="M1121 351l18 14 42-43" fill="none" stroke="#65ff9a" stroke-width="7"/><rect x="1225" y="302" width="82" height="75" rx="8" fill="#513624"/><text x="1266" y="330" text-anchor="middle" fill="#ffe0b6" font-size="12" font-family="Arial" font-weight="900">FENDER</text><circle cx="1266" cy="352" r="15" fill="none" stroke="#ffd26e" stroke-width="5"/>
<g transform="translate(860 410)" filter="url(#s)"><ellipse cx="0" cy="-48" rx="29" ry="34" fill="#c9946e" stroke="#102732" stroke-width="5"/><rect x="-38" y="-10" width="76" height="95" rx="17" fill="#efb63e" stroke="#102732" stroke-width="5"/><path d="M-28 14l-48 32M28 14l50 24" stroke="#efb63e" stroke-width="18" stroke-linecap="round"/></g><g transform="translate(1410 400)" filter="url(#s)"><path d="M-120 40h220l-32 61H-92z" fill="#edf1f2" stroke="#132f3a" stroke-width="5"/><rect x="-55" y="-15" width="92" height="57" rx="6" fill="#bfd9df" stroke="#132f3a" stroke-width="4"/><text x="-7" y="85" text-anchor="middle" fill="#17343f" font-size="14" font-family="Arial" font-weight="900">W-5 · HOLD</text></g>
<rect x="798" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1058" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">이제 작업선은 부두를 옮기기 전 eDNA 면봉검사·계류줄·방현재·흡입구 검사를 통과해야 한다.</tspan><tspan x="1058" dy="24" font-size="14">从现在起，作业船换泊前必须通过eDNA拭子、缆绳、护舷与进水口检查。</tspan><tspan x="1058" dy="22" font-size="13">Before changing berths, every workboat must pass eDNA, line, fender and intake screening.</tspan></text><path d="M1338 104h149q18 0 18 18v75q0 18-18 18h-87l-29 28 8-28h-41q-18 0-18-18v-75q0-18 18-18z" fill="#ffe6e6" stroke="#111" stroke-width="4"/><text x="1412" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">통과 전엔 이동 금지!</tspan><tspan x="1412" dy="21">未通过不得移动！</tspan><tspan x="1412" dy="19" font-size="12">No move before PASS!</tspan></text><text x="800" y="487" fill="#fff" stroke="#663438" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">HOLD!  SWAB!  INSPECT!  PASS!</text></g>
<!-- P3 decon -->
<g><rect x="16" y="524" width="746" height="482" rx="12" fill="#173b48"/><rect x="16" y="740" width="746" height="266" fill="#08677a"/><g transform="translate(400 825)" filter="url(#s)"><path d="M-180 40h340l-50 88H-136z" fill="#e8eef0" stroke="#112c37" stroke-width="6"/><rect x="-78" y="-26" width="126" height="69" rx="7" fill="#bdd6dc" stroke="#112c37" stroke-width="5"/><text x="-12" y="105" text-anchor="middle" fill="#173640" font-size="16" font-family="Arial" font-weight="900">W-5 · CLOSED-LOOP CLEAN</text></g><path d="M205 770q35-95 91-5M545 770q-35-95-91-5" fill="none" stroke="#7eefff" stroke-width="12" opacity=".8"/><rect x="96" y="797" width="105" height="115" rx="12" fill="#d9e6ea" stroke="#15333e" stroke-width="5"/><text x="149" y="832" text-anchor="middle" fill="#17343e" font-family="Arial" font-size="12" font-weight="900">CAPTURE</text><rect x="577" y="797" width="105" height="115" rx="12" fill="#d9e6ea" stroke="#15333e" stroke-width="5"/><text x="630" y="832" text-anchor="middle" fill="#17343e" font-family="Arial" font-size="12" font-weight="900">FILTER</text><circle cx="630" cy="868" r="28" fill="none" stroke="#49ccd9" stroke-width="7"/><g transform="translate(108 945)"><circle cx="0" cy="0" r="9" fill="#ff5863" filter="url(#g)"/><circle cx="30" cy="-12" r="6" fill="#ff5863" filter="url(#g)"/></g>
<rect x="38" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="298" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">양성 흔적이 나오면 바다로 씻어내지 않는다. 밀폐 순환세척으로 회수하고 폐수는 여과·처리한다.</tspan><tspan x="298" dy="24" font-size="14">发现阳性痕迹时绝不冲入海里，采用封闭循环清洗回收并处理废水。</tspan><tspan x="298" dy="22" font-size="13">A positive trace is never washed into the sea: closed-loop cleaning captures it and treats the wastewater.</tspan></text><path d="M575 546h157q18 0 18 18v74q0 18-18 18h-92l-30 28 9-28h-44q-18 0-18-18v-74q0-18 18-18z" fill="#e6fbff" stroke="#111" stroke-width="4"/><text x="654" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="654">바다에 버리지 말고 회수!</tspan><tspan x="654" dy="21">不要排海，全部回收！</tspan><tspan x="654" dy="19" font-size="12">Capture it—never flush!</tspan></text><text x="42" y="981" fill="#fff" stroke="#305d68" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">SEAL!  CLEAN!  CAPTURE!  TREAT!</text></g>
<!-- P4 verified -->
<g><rect x="774" y="524" width="746" height="482" rx="12" fill="#174653"/><rect x="774" y="742" width="746" height="264" fill="#0a7180"/><g filter="url(#s)"><rect x="840" y="700" width="310" height="205" rx="16" fill="#e5f0f2" stroke="#12313b" stroke-width="6"/><text x="995" y="735" text-anchor="middle" fill="#173640" font-family="Arial" font-size="19" font-weight="900">30-DAY HARBOR CHECK</text><text x="875" y="775" fill="#173640" font-family="Arial" font-size="17" font-weight="800">Workboats screened</text><text x="1110" y="775" text-anchor="end" fill="#0b7b4c" font-family="Arial" font-size="22" font-weight="900">7 / 7</text><text x="875" y="815" fill="#173640" font-family="Arial" font-size="17" font-weight="800">Secondary eDNA spread</text><text x="1110" y="815" text-anchor="end" fill="#0b7b4c" font-family="Arial" font-size="22" font-weight="900">0</text><text x="875" y="855" fill="#173640" font-family="Arial" font-size="17" font-weight="800">Native juvenile index</text><text x="1110" y="855" text-anchor="end" fill="#0b7b4c" font-family="Arial" font-size="22" font-weight="900">+34%</text></g>
<g transform="translate(1295 815)" filter="url(#s)"><ellipse cx="0" cy="-62" rx="31" ry="37" fill="#d6a17a" stroke="#102934" stroke-width="5"/><path d="M-29-68q7-31 29-33q27 4 32 31l-15-8q-21 8-46 10" fill="#342b29"/><rect x="-45" y="-20" width="90" height="118" rx="20" fill="#edf3f4" stroke="#102934" stroke-width="5"/><path d="M-35 7l-69 38M35 7l65 33" stroke="#edf3f4" stroke-width="20" stroke-linecap="round"/></g><path d="M1180 929q45-32 90 0t90 0t100 0" fill="none" stroke="#baf9ff" stroke-width="5"/><path d="M1195 908q25-22 50 0q-25 22-50 0m83 18q30-24 60 0q-30 24-60 0m92-32q25-20 50 0q-25 20-50 0" fill="#8ff2d2" stroke="#173f48" stroke-width="3"/>
<rect x="798" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1058" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">30일 뒤 7척 모두 검사 완료, 2차 eDNA 확산 0. 이제 작은 작업선도 항만 방역망 밖으로 빠져나가지 않는다.</tspan><tspan x="1058" dy="24" font-size="14">30天后7艘全部完成筛查，二次eDNA扩散为0；小型作业船也纳入港口防疫网。</tspan><tspan x="1058" dy="22" font-size="13">After 30 days: 7/7 screened, zero secondary eDNA spread. Small workboats are now inside the harbor defense network.</tspan></text><path d="M1338 546h149q18 0 18 18v74q0 18-18 18h-88l-28 28 8-28h-41q-18 0-18-18v-74q0-18 18-18z" fill="#e5ffed" stroke="#111" stroke-width="4"/><text x="1412" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">작은 배까지 지켜야 항구가 산다.</tspan><tspan x="1412" dy="21">守住小船，才能守住港湾。</tspan><tspan x="1412" dy="19" font-size="12">Protect every boat, protect the bay.</tspan></text><text x="800" y="981" fill="#fff" stroke="#256558" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">VERIFY!  ZERO SPREAD!  PROTECT THE BAY!</text></g></svg>