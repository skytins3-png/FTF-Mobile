<rect x="38" y="546" width="674" height="102" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">D-7을 즉시 격리하고 미세망·UV·활성탄 여과 장치를 설치해 첫 빗물을 전량 회수했다.</tspan><tspan x="375" dy="24" font-size="14">立即隔离D-7，安装微滤、UV和活性炭系统并回收初期雨水。</tspan><tspan x="375" dy="23" font-size="13">D-7 is isolated; first-flush runoff is captured through mesh, UV and carbon treatment.</tspan></text>
