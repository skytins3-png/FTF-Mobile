<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 153 traces an invasive eDNA alarm to a harbor storm drain and blocks the land-to-sea pathway">
