<text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="31" font-weight="900">FTF-01 #153  바다의 경보를 육지까지 거슬러 올라간다 — 빗물 배수로를 막아라</text>
<text x="1050" y="49" fill="#c9f8ff" font-family="Arial" font-size="17" font-weight="800">TRACE THE LAND-TO-SEA ROUTE · 追查陆海通道</text>
