 <text x="278" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="278">세탁 필터 다음 추적점은 염색 공장의 배출수였다.</tspan><tspan x="278" dy="24" font-size="14">继洗衣过滤之后，追踪点来到染整工厂排水口。</tspan><tspan x="278" dy="22" font-size="13">After laundry filters, the trail leads to a textile-dyeing outfall.</tspan></text>
 <rect x="523" y="102" width="214" height="96" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/>
 <text x="630" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="630">여기서부터 바꾸자!</tspan><tspan x="630" dy="22" font-size="14">从这里开始改变！</tspan><tspan x="630" dy="20" font-size="12">Change it at the source!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="38" font-weight="900">TRACE!  SAMPLE!  SOURCE!</text>
</g>

