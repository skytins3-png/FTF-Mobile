 <text x="1042" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1042">FTF 팀은 염료 회수·미세섬유 포집·폐수 재순환 설비를 한 줄로 연결했다.</tspan><tspan x="1042" dy="24" font-size="14">FTF把染料回收、微纤维捕集与废水回用系统连成一线。</tspan><tspan x="1042" dy="22" font-size="13">FTF links dye recovery, microfiber capture and closed-loop water reuse.</tspan></text>
 <rect x="1300" y="108" width="196" height="92" rx="22" fill="#eaffd8" stroke="#111" stroke-width="4"/>
 <text x="1398" y="138" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1398">배출 전에 회수!</tspan><tspan x="1398" dy="22" font-size="13">排放前回收！</tspan><tspan x="1398" dy="20" font-size="12">Recover before release!</tspan></text>
 <text x="804" y="487" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="36" font-weight="900">CAPTURE!  REUSE!  CLOSE THE LOOP!</text>
</g>

