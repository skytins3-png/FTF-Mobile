 <rect x="38" y="542" width="450" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="263" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="263">2주 뒤, 하구의 색도와 미세섬유 부하가 동시에 떨어졌다.</tspan><tspan x="263" dy="24" font-size="14">两周后，河口色度与微纤维负荷同步下降。</tspan><tspan x="263" dy="22" font-size="13">Two weeks later, both dye load and microfiber levels fall sharply.</tspan></text>
 <rect x="502" y="553" width="220" height="91" rx="22" fill="#eaffd5" stroke="#111" stroke-width="4"/>
 <text x="612" y="583" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="612">바다가 먼저 대답했어.</tspan><tspan x="612" dy="22" font-size="13">大海先给出了答案。</tspan><tspan x="612" dy="20" font-size="12">The sea answered first.</tspan></text>
 <text x="42" y="977" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="36" font-weight="900">CLEARER WATER!  STRONGER LIFE!</text>
