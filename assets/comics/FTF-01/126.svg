 <text x="1098" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1098">“청소만으로는 늦다. 오염이 만들어지는 자리에서 흐름을 바꾼다.”</tspan><tspan x="1098" dy="24" font-size="14">“只清理已经太迟，要在污染产生的地方改变流向。”</tspan><tspan x="1098" dy="22" font-size="13">“Cleanup alone is too late. Change the flow where pollution begins.”</tspan></text>
 <rect x="1050" y="888" width="398" height="84" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/>
 <text x="1249" y="921" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="1249">SOURCE CHANGE · SEA CHANGE</tspan><tspan x="1249" dy="24" font-size="14">원천을 바꾸면 바다가 바뀐다 · 改变源头，改变海洋</tspan></text>
 <text x="804" y="974" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">VERIFY!  SCALE!  PROTECT!</text>
