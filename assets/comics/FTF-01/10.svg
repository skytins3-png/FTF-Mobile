178 Q482 106 535 105 Q591 108 603 185 Q566 146 529 147 Q498 148 469 178" fill="#4a3730"/><path d="M452 285 Q530 232 610 285 L645 560 Q535 612 420 560Z" fill="#495b72"/><path d="M492 338 L385 287" stroke="#dba27c" stroke-width="28" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 48 Q55 20 120 20 H870 Q935 20 935 92 V320 Q935 378 860 378 H660 L605 445 L612 378 H120 Q55 378 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">방송 들려요? 아이들부터 대피 차량에 태워요!</text><text x="92" y="182" font-family="Arial" font-size="31">听到广播了吗？先让孩子们上疏散车！</text><text x="92" y="245" font-family="Arial" font-size="29">Can you hear the alert? Get the children into the evacuation van first!</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#11161b" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">해안 침수선이 주택가로 번지자 주민들이 마지막 대피 차량으로 몰린다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">海水逼近住宅区，居民赶向最后一辆疏散车。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">As seawater reaches the neighborhood, residents rush toward the final evacuation vehicle.</text></g><text x="735" y="805" font-family="Impact,Arial Black" font-size="86" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-8 735 805)">WEE-OO!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-01 · EARTH'S WARNING · SCENE 10 / 26</text></svg>