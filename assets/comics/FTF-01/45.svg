<!-- PANEL 1: FAMILY SORTING -->
<g filter="url(#shadow)"><rect x="24" y="76" width="1032" height="430" rx="22" fill="url(#home)" class="frame"/>
<rect x="48" y="96" width="562" height="116" rx="14" class="box"/><text x="68" y="136" font-size="27" class="ko">분리수거는 지구를 지키는 첫걸음입니다.</text><text x="68" y="171" font-size="20" class="zh">垃圾分类，是守护地球的第一步。</text><text x="68" y="202" font-size="19" class="en">Sorting waste is the first step to protect Earth.</text>
