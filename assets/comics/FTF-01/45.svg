<path class="bubble" d="M754 101q176-10 269 27q29 12 28 43q-2 33-44 38h-49l-31 27v-27H800q-43-2-48-31q-4-27 2-77Z"/><text x="900" y="143" text-anchor="middle" font-size="22" class="ko">종류별로 나눠요!</text><text x="900" y="175" text-anchor="middle" font-size="17">分类投放！ / Sort it right!</text><text x="455" y="338" fill="#fff" stroke="#168bca" stroke-width="8" paint-order="stroke" font-size="52" font-weight="900" font-style="italic">SORT!</text></g>

<!-- PANEL 2: WASTE DAMAGE -->
<g filter="url(#shadow)"><rect x="24" y="526" width="1032" height="430" rx="22" fill="url(#waste)" class="frame"/>
<rect x="48" y="548" width="700" height="112" rx="14" class="box"/><text x="68" y="587" font-size="26" class="ko">버려진 쓰레기는 땅과 바다를 오염시키고 생명을 위협합니다.</text><text x="68" y="622" font-size="20" class="zh">被丢弃的垃圾会污染土地和海洋，威胁生命。</text><text x="68" y="652" font-size="19" class="en">Discarded waste pollutes land and oceans and threatens life.</text>
