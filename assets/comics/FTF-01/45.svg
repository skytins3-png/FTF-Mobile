<text x="805" y="744" fill="#fff" stroke="#d9452d" stroke-width="9" paint-order="stroke" font-size="70" font-weight="900" font-style="italic">STOP!</text><rect x="65" y="690" width="310" height="116" rx="15" class="box"/><text x="84" y="728" font-size="23" class="ko">지금도 지구는 고통받고 있어요.</text><text x="84" y="761" font-size="18">现在地球仍在承受痛苦。</text><text x="84" y="790" font-size="18">Our Earth is suffering right now.</text></g>

<!-- PANEL 3: RECYCLING FACTORY -->
<g filter="url(#shadow)"><rect x="24" y="976" width="1032" height="430" rx="22" fill="url(#factory)" class="frame"/>
<rect x="48" y="998" width="662" height="112" rx="14" class="box"/><text x="68" y="1037" font-size="26" class="ko">버려진 자원도 다시 쓰면 새로운 가치를 만듭니다.</text><text x="68" y="1072" font-size="20" class="zh">废弃资源再次利用，就能创造新的价值。</text><text x="68" y="1102" font-size="19" class="en">Discarded resources can become valuable again.</text>
