 <text x="610" y="642" font-family="Arial" font-size="21" font-weight="800">“하천이 살아야 도시도 숨 쉰다.”</text>
 <text x="610" y="670" font-family="Arial" font-size="16">河流活着，城市才能呼吸。 · A living river lets the city breathe.</text>
 <text x="882" y="1062" fill="#e8ffff" font-family="Arial" font-size="34" font-weight="900">SPLASH!</text>
</g>

