 <text x="790" y="328" font-family="Arial" font-size="24" font-weight="800" fill="#111">“체감 46°C… 대피소를 열어!”</text>
 <text x="790" y="358" font-family="Arial" font-size="19" fill="#333">体感46°C…立刻开放避暑点！</text>
 <text x="790" y="383" font-family="Arial" font-size="18" fill="#333">“46°C heat index—open shelters!”</text>
 <text x="82" y="190" fill="#ffdf8a" font-family="Arial" font-size="24" font-weight="800">도시는 경고를 몸으로 느끼기 시작했다.</text>
 <text x="82" y="220" fill="#ffe9bd" font-family="Arial" font-size="19">城市开始亲身感受到警告。 · The city began to feel the warning.</text>
 <text x="865" y="495" fill="#ffd65a" font-family="Arial" font-size="42" font-weight="900">WOOO—!</text>
</g>

<!-- PANEL 2: cooling response team -->
<g filter="url(#shadow)">
