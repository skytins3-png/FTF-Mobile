 <text x="150" y="1227" font-family="Arial" font-size="27" fill="#111" font-weight="900">“우리가 바꾼 오늘이, 네 내일이 된다.”</text>
 <text x="150" y="1263" font-family="Arial" font-size="20" fill="#333">我们改变的今天，会成为你的明天。</text>
 <text x="150" y="1291" font-family="Arial" font-size="19" fill="#333">“What we change today becomes your tomorrow.”</text>
 <path d="M590 1341 Q780 1310 971 1353 L951 1450 Q778 1477 612 1436Z" fill="#fff" stroke="#101820" stroke-width="6"/>
 <text x="625" y="1382" font-family="Arial" font-size="24" fill="#111" font-weight="900">“그럼 나도 이어갈게.”</text>
 <text x="625" y="1414" font-family="Arial" font-size="18" fill="#333">那我也会继续。 · “Then I’ll carry it on.”</text>
 <rect x="86" y="1762" width="905" height="48" rx="8" fill="#07100d" opacity=".88"/>
 <text x="108" y="1796" font-family="Arial" font-size="24" fill="#f6f1c8" font-weight="800">내레이션 · 预警不是结局，而是选择的开始。 · A warning is not the end—it is the start of a choice.</text>
 <text x="825" y="1736" font-family="Arial" font-size="43" fill="#ffe377" font-weight="900">THUMP</text>
</g>
