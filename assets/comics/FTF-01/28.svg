 <path d="M95 735 Q245 705 407 743 L392 817 Q252 839 111 808Z" fill="#fff" stroke="#111" stroke-width="5"/>
 <text x="120" y="773" font-family="Arial" font-size="22" font-weight="800">“경고를 행동으로 바꾸자.”</text>
 <text x="120" y="801" font-family="Arial" font-size="17">把警告变成行动。 · Turn warning into action.</text>
 <text x="93" y="1072" fill="#d9ffff" font-family="Arial" font-size="31" font-weight="900">PSHHH— 냉각 미스트</text>
</g>

