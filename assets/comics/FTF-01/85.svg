 <!-- students --> <g><ellipse cx="112" cy="718" rx="27" ry="30" class="skin"/><path d="M86 714q7-39 34-25 20 9 17 33-23-10-51-8Z" class="hair"/><path d="M78 748q34-16 69 0l8 47H70Z" fill="#5b84aa" stroke="#071923" stroke-width="3"/><ellipse cx="205" cy="722" rx="26" ry="29" class="skin"/><path d="M180 717q8-37 34-24 19 9 16 32-21-9-50-8Z" class="hair"/><path d="M173 749q33-15 66 0l8 46h-82Z" fill="#8ca9c2" stroke="#071923" stroke-width="3"/><ellipse cx="295" cy="722" rx="26" ry="29" class="skin"/><path d="M270 717q8-37 34-24 19 9 16 32-21-9-50-8Z" class="hair"/><path d="M263 749q33-15 66 0l8 46h-82Z" fill="#7f9f8a" stroke="#071923" stroke-width="3"/></g>
 <rect class="box" x="18" y="412" width="530" height="82" rx="10"/><text x="32" y="441" class="ko">3. 수거 기록은 더 깨끗한 바다를 위한 데이터가 됩니다.</text><text x="32" y="466" class="zh">收集记录变成推动更清洁海洋的数据。</text><text x="32" y="489" class="en">Cleanup records become data for a cleaner ocean.</text>
 <path class="bub" d="M342 711h224q14 0 14 14v46q0 14-14 14H461l-23 11 4-11H342q-14 0-14-14v-46q0-14 14-14Z"/><text x="354" y="738" class="ko tiny">이 데이터가 더 깨끗한 바다를 만들어요!</text><text x="354" y="760" class="zh tiny">这些数据会帮助创造更清洁的海洋！</text><text x="354" y="780" class="en tiny">This data helps create a cleaner ocean!</text>
</g>
<!-- PANEL 4: sunset promise -->
<g class="p"><rect x="604" y="398" width="592" height="398" fill="url(#sunset)"/><circle cx="1024" cy="516" r="44" fill="#fff3b0"/><path d="M604 627q142-31 300 6t292-11v174H604Z" fill="#155f8c"/><path d="M604 650q160 29 305-2t287 6" fill="none" stroke="#ffd99e" stroke-width="7" opacity=".55"/>
 <!-- group at railing --> <path d="M629 690h532" stroke="#d7e7ea" stroke-width="9"/><g>
 <ellipse cx="742" cy="611" rx="32" ry="35" class="skin"/><path d="M711 604q9-45 42-28 24 11 20 39-25-12-62-11Z" class="hair"/><path d="M702 647q41-19 80 0l15 105H687Z" class="uniform"/><ellipse cx="829" cy="632" rx="26" ry="29" class="skin"/><path d="M804 627q7-37 33-24 20 9 17 32-21-9-50-8Z" class="hair"/><path d="M797 659q33-15 66 0l12 91H786Z" fill="#769ab4" stroke="#071923" stroke-width="3"/><ellipse cx="902" cy="634" rx="26" ry="29" class="skin"/><path d="M877 629q7-37 33-24 20 9 17 32-21-9-50-8Z" class="hair"/><path d="M870 661q33-15 66 0l12 89H859Z" fill="#89a997" stroke="#071923" stroke-width="3"/><ellipse cx="976" cy="631" rx="26" ry="29" class="skin"/><path d="M951 626q7-37 33-24 20 9 17 32-21-9-50-8Z" class="hair"/><path d="M944 658q33-15 66 0l12 92H933Z" fill="#9e8fb5" stroke="#071923" stroke-width="3"/>
 </g>
 <path d="M759 649q47 19 69 1M846 659q31 20 57 2M919 659q31 19 55-2" fill="none" class="line"/>
 <rect class="box" x="620" y="412" width="489" height="102" rx="10"/><text x="634" y="442" class="ko">4. 쓰레기 없는 바다는 더 많은 생명을 품습니다.</text><text x="634" y="468" class="zh">没有垃圾的海洋，能容纳更多生命。</text><text x="634" y="494" class="en">A trash-free ocean holds more life and a brighter future.</text>
 <path class="bub" d="M775 529h392q16 0 16 16v68q0 16-16 16H1030l-30 25 7-25H775q-16 0-16-16v-68q0-16 16-16Z"/><text x="792" y="560" class="ko">우리의 작은 실천이 더 많은 생명을 지킵니다!</text><text x="792" y="585" class="zh">我们的每一个小行动都在守护更多生命！</text><text x="792" y="610" class="en">Our small actions protect more life!</text>
 <text x="818" y="762" class="fx" transform="rotate(-4 818 762)">TOGETHER FOR A LIVING OCEAN!</text>
</g>
</svg>