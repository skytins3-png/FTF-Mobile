<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 85 - 깨끗한 바다, 밝은 내일</title>
<desc id="desc">Four-panel cinematic manga scene in the approved FTF direction. The ocean team hoists marine debris aboard, sorts plastic, fishing nets, metal and glass for recycling, records the cleanup data with students, and closes at sunset with a promise to protect a living ocean. Korean, Chinese and English narration, speech bubbles and visual sound effects are integrated.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#72c8f4"/><stop offset="1" stop-color="#dff4ff"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1597c8"/><stop offset="1" stop-color="#044c74"/></linearGradient>
 <linearGradient id="work" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8eef0"/><stop offset="1" stop-color="#a8bac1"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd67a"/><stop offset=".55" stop-color="#ff9a70"/><stop offset="1" stop-color="#607fa8"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".32"/></filter>
 <style>
 .p{stroke:#071923;stroke-width:8}.box{fill:#fff;stroke:#071923;stroke-width:4}.bub{fill:#fff;stroke:#071923;stroke-width:4}.ko{font:700 22px 'Noto Sans KR',sans-serif;fill:#071923}.zh{font:600 17px 'Noto Sans SC',sans-serif;fill:#15313f}.en{font:600 16px Arial,sans-serif;fill:#193845}.fx{font:900 34px Impact,Arial,sans-serif;fill:#fff;stroke:#07598c;stroke-width:7;paint-order:stroke;letter-spacing:1px}.line{stroke:#071923;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.skin{fill:#efbd96;stroke:#071923;stroke-width:3}.hair{fill:#2b1b18;stroke:#071923;stroke-width:3}.uniform{fill:#153f59;stroke:#071923;stroke-width:3}.cap{fill:#0f3048;stroke:#071923;stroke-width:3}.eye{fill:#0b1b23}.net{fill:none;stroke:#657982;stroke-width:3}.label{font:800 17px Arial,sans-serif;fill:#10344a}.tiny{font-size:14px}
 </style>
</defs>
<!-- PANEL 1: marine debris hoist -->
<g class="p"><rect x="4" y="4" width="592" height="386" fill="url(#sky)"/><path d="M4 266q145-28 288 8t304-11v127H4Z" fill="url(#sea)"/>
 <path d="M50 196h206l51 41v70H28v-66l22-45Z" fill="#f8fbfc" stroke="#071923" stroke-width="5"/><rect x="91" y="207" width="55" height="32" fill="#9feaff" stroke="#071923" stroke-width="4"/><rect x="153" y="207" width="55" height="32" fill="#9feaff" stroke="#071923" stroke-width="4"/><text x="76" y="270" font-family="Arial" font-size="18" font-weight="900" fill="#12415e">FTF OCEAN GUARDIANS</text><path d="M26 306h310l-32 49H57Z" fill="#184f70" stroke="#071923" stroke-width="5"/>
 <!-- crane and net bundle --> <rect x="315" y="114" width="22" height="173" fill="#f1bd45" stroke="#071923" stroke-width="4"/><path d="M326 126q83-3 139 46" fill="none" stroke="#071923" stroke-width="8"/><line x1="458" y1="169" x2="458" y2="232" class="line"/><path d="M392 226q70-50 135 5 36 40 4 96-69 41-142-3-35-50 3-98Z" fill="#6f838b" stroke="#071923" stroke-width="4"/><g class="net"><path d="M398 236q57 78 126 9M391 263q67 61 137 9M409 218q2 94 90 105M448 210q2 96 67 108M386 294q90-18 153 12"/></g><g fill="#e8694f" stroke="#071923" stroke-width="2"><circle cx="423" cy="248" r="12"/><circle cx="487" cy="286" r="10"/></g><rect x="455" y="236" width="44" height="27" fill="#2e79ae" stroke="#071923" stroke-width="3"/>
 <!-- female deck lead --> <ellipse cx="103" cy="137" rx="35" ry="38" class="skin"/><path d="M69 129q13-49 51-29 24 13 18 42-29-13-69-13Z" class="hair"/><path d="M60 173q45-20 87 1l16 90H45Z" class="uniform"/><path d="M69 112q31-18 61 0l-4 20H68Z" class="cap"/><text x="84" y="127" font-family="Arial" font-weight="900" font-size="13" fill="#fff">FTF</text><circle cx="91" cy="139" r="4" class="eye"/><circle cx="114" cy="139" r="4" class="eye"/><path d="M95 156q12 8 23 0" fill="none" class="line"/>
 <!-- crew --> <ellipse cx="234" cy="149" rx="28" ry="31" class="skin"/><path d="M207 144q7-40 34-25 21 10 20 35-25-10-54-10Z" class="hair"/><path d="M198 180q36-17 72 0l12 73h-96Z" class="uniform"/>
 <rect class="box" x="16" y="17" width="358" height="94" rx="10"/><text x="30" y="47" class="ko">1. 오늘도 바다의 쓰레기를 직접 수거합니다.</text><text x="30" y="72" class="zh">今天我们继续打捞海洋垃圾。</text><text x="30" y="96" class="en">Today we keep collecting marine debris.</text>
 <path class="bub" d="M176 113h196q16 0 16 16v62q0 16-16 16H260l-25 22 5-22h-64q-16 0-16-16v-62q0-16 16-16Z"/><text x="190" y="143" class="ko">와! 정말 많이 올라왔어요!</text><text x="190" y="166" class="zh tiny">哇！打捞了这么多垃圾！</text><text x="190" y="188" class="en tiny">Wow! We pulled up so much trash!</text>
 <text x="327" y="360" class="fx" transform="rotate(-4 327 360)">CLEAN OCEAN!</text>
</g>
<!-- PANEL 2: sorting and recycling -->
<g class="p"><rect x="604" y="4" width="592" height="386" fill="url(#work)"/>
 <rect x="619" y="117" width="560" height="254" rx="18" fill="#f9fbfc" stroke="#071923" stroke-width="5"/><rect x="642" y="136" width="116" height="74" rx="10" fill="#e2f4dd" stroke="#071923" stroke-width="3"/><rect x="775" y="136" width="116" height="74" rx="10" fill="#ddeffa" stroke="#071923" stroke-width="3"/><rect x="908" y="136" width="116" height="74" rx="10" fill="#f7ead7" stroke="#071923" stroke-width="3"/><rect x="1041" y="136" width="116" height="74" rx="10" fill="#def3f5" stroke="#071923" stroke-width="3"/><text x="672" y="165" class="label">PLASTIC</text><text x="807" y="165" class="label">NETS</text><text x="943" y="165" class="label">METAL</text><text x="1080" y="165" class="label">GLASS</text><text x="659" y="191" class="zh">塑料</text><text x="803" y="191" class="zh">渔网</text><text x="944" y="191" class="zh">金属</text><text x="1080" y="191" class="zh">玻璃</text>
 <!-- sorting table --> <path d="M637 291h501l-22 64H656Z" fill="#b7c7cd" stroke="#071923" stroke-width="4"/><g stroke="#071923" stroke-width="3"><rect x="697" y="267" width="24" height="47" rx="8" fill="#66b8df"/><path d="M710 252l10 18h-21Z" fill="#66b8df"/><path d="M804 281q44-25 76 9" fill="none" stroke="#6e7d83" stroke-width="6"/><circle cx="967" cy="284" r="15" fill="#a7a9ad"/><rect x="1061" y="265" width="21" height="48" rx="5" fill="#8ed0db"/></g>
 <!-- workers, actual faces/hands --> <ellipse cx="690" cy="240" rx="31" ry="34" class="skin"/><path d="M660 234q8-43 42-28 24 11 19 38-26-12-61-10Z" class="hair"/><path d="M650 274q41-18 81 0l15 73H636Z" class="uniform"/><path d="M663 215q26-13 53 0l-4 18h-50Z" class="cap"/><text x="676" y="228" font-family="Arial" font-size="12" font-weight="900" fill="#fff">FTF</text><circle cx="681" cy="242" r="4" class="eye"/><circle cx="702" cy="242" r="4" class="eye"/>
 <ellipse cx="835" cy="244" rx="30" ry="33" class="skin"/><path d="M806 239q8-42 39-27 23 10 19 37-24-12-58-10Z" class="hair"/><path d="M798 277q39-18 77 0l14 70h-104Z" class="uniform"/><ellipse cx="982" cy="244" rx="30" ry="33" class="skin"/><path d="M953 239q8-42 38-27 23 10 19 37-23-12-57-10Z" class="hair"/><path d="M945 277q39-18 77 0l14 70H932Z" class="uniform"/>
 <rect class="box" x="620" y="17" width="429" height="94" rx="10"/><text x="634" y="47" class="ko">2. 플라스틱·어망·금속·유리를 분리합니다.</text><text x="634" y="72" class="zh">我们把垃圾按塑料、渔网、金属和玻璃分类。</text><text x="634" y="96" class="en">We sort the debris by type for recycling.</text>
 <path class="bub" d="M857 221h313q15 0 15 15v55q0 15-15 15h-145l-25 22 5-22H857q-15 0-15-15v-55q0-15 15-15Z"/><text x="873" y="249" class="ko">작은 분리가 큰 변화를 만들어요!</text><text x="873" y="271" class="zh tiny">小小的分类，带来巨大的改变！</text><text x="873" y="292" class="en tiny">Small sorting makes a big change!</text>
 <text x="820" y="356" class="fx" transform="rotate(-3 820 356)">SORT · RECYCLE!</text>
</g>
<!-- PANEL 3: data and students -->
<g class="p"><rect x="4" y="398" width="592" height="398" fill="#d8edf6"/>
 <rect x="28" y="420" width="539" height="341" rx="18" fill="#f9fcfd" stroke="#071923" stroke-width="5"/><rect x="190" y="507" width="353" height="192" rx="10" fill="#0c5f8f" stroke="#071923" stroke-width="4"/><text x="214" y="538" font-family="Arial" font-size="24" font-weight="900" fill="#fff">CLEAN OCEAN DATA</text><text x="215" y="572" font-family="Arial" font-size="17" font-weight="700" fill="#e5f6ff">Collected 3,250 kg</text><g fill="#61d0ef"><rect x="220" y="648" width="28" height="30"/><rect x="258" y="625" width="28" height="53"/><rect x="296" y="600" width="28" height="78"/><rect x="334" y="572" width="28" height="106"/></g><circle cx="455" cy="614" r="53" fill="#e5f3f8"/><path d="M455 614V561a53 53 0 0 1 45 81Z" fill="#69bf78"/><path d="M455 614l45 28a53 53 0 0 1-76 15Z" fill="#f6cf59"/><path d="M455 614l-31 43a53 53 0 0 1 31-96Z" fill="#55a6d7"/><text x="404" y="688" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Plastic 48% · Nets 28% · Metal 12% · Glass 8%</text>
