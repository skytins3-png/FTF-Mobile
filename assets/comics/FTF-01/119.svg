 <rect x="472" y="101" width="260" height="110" rx="24" fill="#fff4d7" stroke="#111" stroke-width="4"/><text x="602" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="602">물길부터 다시 열자!</tspan><tspan x="602" dy="24" font-size="14">先让潮水重新流动！</tspan><tspan x="602" dy="22" font-size="13">Open the tidal flow first!</tspan></text>
 <text x="42" y="482" fill="#fff" stroke="#84583e" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="41" font-weight="900" font-style="italic">SCAN!  TRACE!  MARK!</text>
</g>

