<g class="p"><rect x="596" y="264" width="600" height="258" fill="#e3eff4"/><rect x="612" y="281" width="568" height="225" rx="17" fill="#f9fcfd" stroke="#061a28" stroke-width="4"/><rect x="805" y="318" width="345" height="151" rx="10" fill="#064f7b" stroke="#061a28" stroke-width="4"/><text x="825" y="346" font-family="Arial" font-size="18" font-weight="900" fill="#e2f8ff">OCEAN RECOVERY MONITORING</text><rect x="825" y="359" width="305" height="28" rx="6" fill="#0d779c"/><text x="840" y="380" font-family="Arial" font-size="19" font-weight="900" fill="#8df7d0">Fish Biodiversity +68%</text><rect x="825" y="394" width="305" height="28" rx="6" fill="#0d779c"/><text x="840" y="415" font-family="Arial" font-size="19" font-weight="900" fill="#8df7d0">Coral Cover +135%</text><rect x="825" y="429" width="305" height="28" rx="6" fill="#0d779c"/><text x="840" y="450" font-family="Arial" font-size="19" font-weight="900" fill="#8df7d0">Water Quality +42%</text>
