<rect class="box" x="17" y="278" width="310" height="83" rx="9"/><text x="31" y="305" class="ko">깨끗해진 바다에 친구들이 돌아옵니다.</text><text x="31" y="328" class="zh">海水变清，海洋伙伴们回来了。</text><text x="31" y="351" class="en">As the sea clears, marine life returns.</text><path class="bub" d="M305 286h265q14 0 14 14v67q0 14-14 14h-96l-19 18 3-18H305q-14 0-14-14v-67q0-14 14-14Z"/><text x="320" y="314" class="ko">바다거북도 잘 지내고 있어요!</text><text x="320" y="337" class="zh tiny">海龟也健康地回来了！</text><text x="320" y="359" class="en tiny">The sea turtles are doing well!</text><text x="359" y="506" class="fx" transform="rotate(-5 359 506)">LIFE RETURNS!</text></g>
