<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 87 - 함께 지키는 푸른 약속</title>
<desc id="desc">Four-panel cinematic manga scene continuing the recovered-ocean story: researchers and children witness a humpback whale breach, a diver meets a returning sea turtle and fish, recovery data confirms biodiversity gains, and the group makes a sunset promise to protect the ocean. Korean Chinese English text and visual sound effects.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62c9ff"/><stop offset="1" stop-color="#e8f8ff"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1fb7e3"/><stop offset=".55" stop-color="#0879aa"/><stop offset="1" stop-color="#043b63"/></linearGradient>
<linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2bc9e2"/><stop offset=".48" stop-color="#087dad"/><stop offset="1" stop-color="#032b53"/></linearGradient>
<linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd665"/><stop offset=".42" stop-color="#ff9f72"/><stop offset="1" stop-color="#6e77a4"/></linearGradient>
<style>.p{stroke:#061a28;stroke-width:7}.box,.bub{fill:#fff;stroke:#061a28;stroke-width:4}.ko{font:700 20px Arial,sans-serif;fill:#061a28}.zh{font:600 15px Arial,sans-serif;fill:#163747}.en{font:600 15px Arial,sans-serif;fill:#23404c}.fx{font:900 36px Impact,Arial,sans-serif;fill:#fff;stroke:#0872b4;stroke-width:7;paint-order:stroke;letter-spacing:1px}.skin{fill:#efbc95;stroke:#061a28;stroke-width:3}.hair{fill:#2a1b19;stroke:#061a28;stroke-width:3}.uni{fill:#17455f;stroke:#061a28;stroke-width:3}.line{fill:none;stroke:#061a28;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.eye{fill:#071b24}.tiny{font-size:13px}</style>
</defs>
