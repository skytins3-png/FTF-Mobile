<path class="bub" d="M82 552h338q15 0 15 15v74q0 15-15 15H282l-24 21 5-21H82q-15 0-15-15v-74q0-15 15-15Z"/><text x="100" y="583" class="ko">우리가 지키는 바다, 다음 세대에 더 푸르게!</text><text x="100" y="608" class="zh tiny">我们守护海洋，为下一代留下更蓝的未来！</text><text x="100" y="632" class="en tiny">We protect the ocean for a bluer next generation!</text><text x="667" y="624" class="fx" transform="rotate(-4 667 624)">TOGETHER FOR A BLUER TOMORROW!</text><rect x="19" y="757" width="730" height="27" rx="7" fill="#06263b" opacity=".9"/><text x="34" y="777" font-family="Arial" font-size="15" font-weight="700" fill="#fff">오늘의 작은 행동이 내일의 푸른 바다를 만듭니다.  ·  今天的小行动，都会创造明天的蓝色海洋。  ·  Small actions create tomorrow's blue ocean.</text></g>
