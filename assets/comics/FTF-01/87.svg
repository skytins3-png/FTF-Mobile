<rect class="box" x="18" y="17" width="418" height="87" rx="9"/><text x="32" y="44" class="ko">다시 노래하는 바다. 생명이 돌아온 이곳에서 더 큰 약속을 합니다.</text><text x="32" y="67" class="zh">重新歌唱的海洋。生命归来，我们许下更大的约定。</text><text x="32" y="90" class="en">A sea that sings again. Here, we make a greater promise.</text>
<path class="bub" d="M103 108h285q15 0 15 15v58q0 15-15 15h-110l-18 18 3-18H103q-15 0-15-15v-58q0-15 15-15Z"/><text x="119" y="136" class="ko">저기 봐요! 혹등고래예요!</text><text x="119" y="158" class="zh tiny">看！是座头鲸！</text><text x="119" y="178" class="en tiny">Look there! A humpback whale!</text><text x="766" y="228" class="fx" transform="rotate(-5 766 228)">BREACH!</text></g>
