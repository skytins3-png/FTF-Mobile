<rect class="card" x="75" y="1000" width="485" height="107" rx="12"/><text class="ko" x="95" y="1036" font-size="25">동네가 함께 만들면 변화는 더 커집니다.</text><text class="zh" x="95" y="1069" font-size="19">社区一起行动，改变会更大。</text><text class="en" x="95" y="1098" font-size="18">Change grows when the community acts together.</text><path class="bubble" d="M655 1008q153-22 297 14q44 12 43 53q-1 39-55 42h-72l-30 31 1-31h-120q-53-1-58-38q-5-34-6-71Z"/><text class="ko" x="825" y="1047" text-anchor="middle" font-size="23">같이 설치하니 더 든든해요!</text><text x="825" y="1078" text-anchor="middle" font-size="18">一起安装，更安心!</text><text x="825" y="1105" text-anchor="middle" font-size="18">Together feels stronger!</text><text x="640" y="1344" fill="#fff" stroke="#267396" stroke-width="8" paint-order="stroke" font-size="48" font-style="italic" font-weight="900">CLACK!</text></g>

