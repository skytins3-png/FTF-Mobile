<rect class="card" x="79" y="566" width="555" height="118" rx="12"/><text class="ko" x="99" y="603" font-size="26">화석연료는 지구를 더 뜨겁게 만듭니다.</text><text class="zh" x="99" y="636" font-size="20">化石燃料让地球变得更热。</text><text class="en" x="99" y="665" font-size="19">Fossil fuels make our planet hotter.</text>
<rect class="card" x="566" y="759" width="420" height="120" rx="12"/><text class="ko" x="586" y="796" font-size="25">바람과 태양은 깨끗한 선택입니다.</text><text class="zh" x="586" y="829" font-size="19">风和太阳是更清洁的选择。</text><text class="en" x="586" y="858" font-size="18">Wind and sun are the cleaner choice.</text><text x="145" y="918" fill="#fff" stroke="#a3312d" stroke-width="8" paint-order="stroke" font-size="45" font-style="italic" font-weight="900">CO₂... COUGH!</text><text x="720" y="921" fill="#fff" stroke="#2c8c69" stroke-width="8" paint-order="stroke" font-size="48" font-style="italic" font-weight="900">WHOOSH!</text></g>

