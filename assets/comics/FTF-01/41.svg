<rect class="card" x="72" y="1432" width="566" height="112" rx="12"/><text class="ko" x="92" y="1469" font-size="26">깨끗한 에너지가 더 밝은 내일을 만듭니다.</text><text class="zh" x="92" y="1502" font-size="20">清洁能源创造更明亮的明天。</text><text class="en" x="92" y="1531" font-size="19">Clean energy creates a brighter tomorrow.</text>
