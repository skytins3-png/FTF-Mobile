<rect class="card" x="72" y="134" width="448" height="109" rx="12"/><text class="ko" x="92" y="170" font-size="27">햇빛이 우리 집의 전기가 됩니다.</text><text class="zh" x="92" y="203" font-size="20">阳光正在变成我们家的电。</text><text class="en" x="92" y="232" font-size="19">Sunlight becomes electricity for our home.</text>
