<rect width="1536" height="1024" fill="#06141d"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#173f56"/>
<text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="32" font-weight="900">FTF-01  #149  배만 막아도 장비가 옮기면 다시 퍼진다</text>
<text x="915" y="49" fill="#c9f8ff" font-family="Arial" font-size="18" font-weight="800">TRACE GEAR → QUARANTINE → DECON → VERIFY · 共用设备传播链切断</text>

<!-- PANEL 1: hidden equipment route -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#skyA)"/>
 <rect x="16" y="326" width="746" height="186" fill="url(#water)"/>
