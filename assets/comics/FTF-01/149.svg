 <g transform="translate(1250 940)"><path d="M-50 0q50-45 100 0q-50 45-100 0z" fill="#63cfb3" opacity=".85"/><circle cx="-16" cy="-6" r="4" fill="#0b3940"/><path d="M50 0l38-24v48z" fill="#63cfb3"/></g>
 <g transform="translate(1440 955)"><path d="M-38 0q38-34 76 0q-38 34-76 0z" fill="#78d7bd" opacity=".85"/><circle cx="-12" cy="-5" r="4" fill="#0b3940"/><path d="M38 0l30-20v40z" fill="#78d7bd"/></g>
 <rect x="798" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">30일 뒤 공용장비 18개 전부 추적, 무기록 이동 0건, 2차 eDNA 검출 0건. 숨은 전파 고리가 끊겼다.</tspan><tspan x="1058" dy="24" font-size="14">30天后18件共用设备全部可追踪，未登记转移0次，二次eDNA检出0次。</tspan><tspan x="1058" dy="22" font-size="13">After 30 days: 18/18 shared assets traced, zero unlogged transfers, zero secondary eDNA hits.</tspan></text>
 <path d="M1339 546h146q20 0 20 20v70q0 20-20 20h-82l-31 28 9-28h-42q-20 0-20-20v-70q0-20 20-20z" fill="#ddffe9" stroke="#111" stroke-width="4"/>
 <text x="1412" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">이제 배와 장비가 같은 방어망 안에 있다.</tspan><tspan x="1412" dy="21">船与设备纳入同一防线。</tspan><tspan x="1412" dy="19" font-size="12">Vessels and gear share one shield.</tspan></text>
 <text x="800" y="981" fill="#fff" stroke="#285b58" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">VERIFY!  ZERO TRANSFER!  BREAK THE CHAIN!</text>
</g>
</svg>