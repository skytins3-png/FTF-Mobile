 </g>
 <g transform="translate(392 438)" filter="url(#shadow)">
  <path d="M-85 0q85-65 170 0" fill="none" stroke="#202c31" stroke-width="18" stroke-linecap="round"/>
  <circle cx="-82" r="15" fill="#ff5d64"/><circle cx="82" r="15" fill="#ff5d64"/>
 </g>
 <g transform="translate(585 300)" filter="url(#shadow)"><ellipse cy="-48" rx="29" ry="34" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-27-55q8-28 29-29q22 4 28 29l-18-7q-18 7-39 7" fill="#2a2625"/><rect x="-38" y="-9" width="76" height="92" rx="17" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-29 13l-68 35M29 13l54 19" stroke="#f1b842" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="38" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="298" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">작업선 7척은 깨끗했다. 그런데 공용 호스·펌프·계류장비가 배 사이를 계속 오갔다.</tspan><tspan x="298" dy="24" font-size="14">7艘作业船都合格，但共用软管、泵和系泊设备仍在船间流转。</tspan><tspan x="298" dy="22" font-size="13">All seven workboats passed—yet shared hoses, pumps and mooring gear still moved between them.</tspan></text>
 <path d="M575 105h153q20 0 20 20v70q0 20-20 20h-86l-31 28 9-28h-45q-20 0-20-20v-70q0-20 20-20z" fill="#fff1c8" stroke="#111" stroke-width="4"/>
 <text x="651" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="651">배만 보지 마. 장비 이동도 추적해!</tspan><tspan x="651" dy="21">别只看船，追踪设备！</tspan><tspan x="651" dy="19" font-size="12">Trace the gear too!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#4d3525" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">TRACE!  LINK!  FIND THE HIDDEN ROUTE!</text>
</g>

<!-- PANEL 2: quarantine gear -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="#173b4b"/>
 <rect x="774" y="334" width="746" height="178" fill="#096476"/>
 <g filter="url(#shadow)">
  <rect x="995" y="240" width="345" height="190" rx="18" fill="#dfe9ec" stroke="#112f3a" stroke-width="6"/>
  <text x="1167" y="274" text-anchor="middle" fill="#173640" font-family="Arial" font-size="18" font-weight="900">GEAR QUARANTINE · 장비 격리 / 设备隔离</text>
  <rect x="1027" y="298" width="115" height="84" rx="10" fill="#54302f"/><text x="1084" y="326" text-anchor="middle" fill="#ffd8d8" font-family="Arial" font-size="13" font-weight="900">RED TAG</text><text x="1084" y="355" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="900">HOLD</text>
  <rect x="1162" y="298" width="145" height="84" rx="10" fill="#123f4e"/><text x="1234" y="326" text-anchor="middle" fill="#c8f7ff" font-family="Arial" font-size="13" font-weight="900">SWAB + eDNA</text><path d="M1185 355h95" stroke="#63efff" stroke-width="6"/>
 </g>
 <g transform="translate(887 401)" filter="url(#shadow)"><ellipse cy="-52" rx="30" ry="35" fill="#c68f68" stroke="#102732" stroke-width="5"/><rect x="-40" y="-12" width="80" height="99" rx="18" fill="#efb63e" stroke="#102732" stroke-width="5"/><path d="M-29 13l-50 32M29 13l60 15" stroke="#efb63e" stroke-width="19" stroke-linecap="round"/></g>
 <g transform="translate(1418 390)" filter="url(#shadow)"><ellipse cy="-52" rx="29" ry="35" fill="#d2a07a" stroke="#102732" stroke-width="5"/><rect x="-39" y="-12" width="78" height="98" rx="18" fill="#f3f5f6" stroke="#102732" stroke-width="5"/><path d="M-29 13l-53 36M29 13l49 30" stroke="#f3f5f6" stroke-width="18" stroke-linecap="round"/></g>
 <path d="M850 420q70-90 130-10" fill="none" stroke="#252f34" stroke-width="18"/>
 <circle cx="854" cy="422" r="15" fill="#ff5964" filter="url(#glow)"/>
 <rect x="798" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">공용 장비는 선박과 별도로 ID를 붙인다. 이동 전마다 면봉검사하고 결과가 나올 때까지 격리한다.</tspan><tspan x="1058" dy="24" font-size="14">共用设备单独编号，每次转移前做拭子检测，结果出来前保持隔离。</tspan><tspan x="1058" dy="22" font-size="13">Shared gear gets its own ID, is swabbed before every transfer, and stays quarantined until cleared.</tspan></text>
 <path d="M1341 105h145q20 0 20 20v70q0 20-20 20h-80l-30 28 8-28h-43q-20 0-20-20v-70q0-20 20-20z" fill="#ffe4e4" stroke="#111" stroke-width="4"/>
 <text x="1413" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1413">검사 전엔 다른 배로 못 간다!</tspan><tspan x="1413" dy="21">检测前禁止转船！</tspan><tspan x="1413" dy="19" font-size="12">No transfer before CLEAR!</tspan></text>
 <text x="800" y="487" fill="#fff" stroke="#68353b" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">TAG!  SWAB!  QUARANTINE!  HOLD!</text>
</g>

<!-- PANEL 3: equipment decon tunnel -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="12" fill="#173a47"/>
 <rect x="16" y="748" width="746" height="258" fill="#086879"/>
