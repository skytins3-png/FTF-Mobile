 <g transform="translate(660 894)" filter="url(#shadow)"><ellipse cy="-53" rx="29" ry="35" fill="#d1a17d" stroke="#102732" stroke-width="5"/><rect x="-39" y="-12" width="78" height="100" rx="18" fill="#f1f5f5" stroke="#102732" stroke-width="5"/><path d="M-29 13l-62-35" stroke="#f1f5f5" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="38" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="298" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">양성 흔적 장비는 밀폐 터널로 보낸다. 온수·UV·여과 회수로 세척수까지 밖으로 못 나가게 처리한다.</tspan><tspan x="298" dy="24" font-size="14">阳性设备进入封闭消毒通道，用热水、UV和过滤回收，清洗水也不外排。</tspan><tspan x="298" dy="22" font-size="13">Positive gear enters a sealed tunnel: hot water, UV and filtration capture even the wash water.</tspan></text>
 <path d="M575 546h155q20 0 20 20v70q0 20-20 20h-88l-30 28 8-28h-45q-20 0-20-20v-70q0-20 20-20z" fill="#e4fbff" stroke="#111" stroke-width="4"/>
 <text x="652" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="652">장비도 하나의 '선박'처럼 관리해!</tspan><tspan x="652" dy="21">设备也按“船舶”级管理！</tspan><tspan x="652" dy="19" font-size="12">Treat gear like a vessel!</tspan></text>
 <text x="42" y="981" fill="#fff" stroke="#315b66" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">SEAL!  HEAT!  UV!  FILTER!  RECOVER!</text>
</g>

