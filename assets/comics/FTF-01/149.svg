  <text x="860" y="807" fill="#173640" font-family="Arial" font-size="17" font-weight="800">Untracked transfers</text><text x="1120" y="807" text-anchor="end" fill="#0a7a4b" font-family="Arial" font-size="22" font-weight="900">0</text>
