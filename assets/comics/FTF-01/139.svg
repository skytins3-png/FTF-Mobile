<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 139 ballast sediment biosecurity">
<defs>
 <linearGradient id="port" x2="0" y2="1"><stop stop-color="#13233c"/><stop offset=".55" stop-color="#355b72"/><stop offset="1" stop-color="#e49d63"/></linearGradient>
 <linearGradient id="tank" x2="0" y2="1"><stop stop-color="#27434d"/><stop offset="1" stop-color="#0b1f29"/></linearGradient>
 <linearGradient id="lab" x2="1" y2="1"><stop stop-color="#eaf0f2"/><stop offset="1" stop-color="#9eb1ba"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1595ad"/><stop offset="1" stop-color="#063247"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".5"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#061017"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#12334a"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #139  탱크 바닥의 잠든 침입자를 깨우지 마라</text>
<text x="900" y="49" fill="#caf8ff" font-family="Arial" font-size="18" font-weight="800">B-42 SEDIMENT BIOSECURITY · 沉积物生物安全</text>

<!-- PANEL 1: ballast tank inspection -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#tank)"/>
 <path d="M45 412q155-72 312-16t371-24v120H45z" fill="#634f3a"/>
 <circle cx="113" cy="432" r="22" fill="#8b704b"/><circle cx="181" cy="449" r="15" fill="#9b7e55"/><circle cx="252" cy="428" r="17" fill="#7d6548"/><circle cx="329" cy="459" r="11" fill="#a98a5c"/>
 <path d="M102 422q16-29 34 0q-14 19-34 0zM210 447q10-22 24 0q-11 17-24 0zM285 422q13-26 29 0q-13 20-29 0z" fill="#f3bb52" stroke="#4b3416" stroke-width="3"/>
 <path d="M34 152h694M61 111v339M714 111v339" stroke="#607985" stroke-width="8" opacity=".75"/>
 <!-- inspector -->
 <g transform="translate(488 340)" filter="url(#shadow)">
  <ellipse cx="45" cy="-50" rx="35" ry="42" fill="#e6ad84" stroke="#14242c" stroke-width="5"/>
  <path d="M11-56q8-34 37-38q31 6 31 40l-16-12q-20 10-52 10z" fill="#2d3137"/>
  <circle cx="34" cy="-49" r="4"/><circle cx="58" cy="-49" r="4"/>
  <rect x="0" y="-7" width="92" height="115" rx="18" fill="#f2ba2d" stroke="#14242c" stroke-width="5"/>
  <path d="M15 21l-90 42" stroke="#f2ba2d" stroke-width="19" stroke-linecap="round"/>
  <rect x="-145" y="34" width="100" height="78" rx="10" fill="#0c3244" stroke="#7ceaf1" stroke-width="4"/>
  <text x="-95" y="57" text-anchor="middle" fill="#d9fbff" font-family="Arial" font-size="11" font-weight="900">SEDIMENT SCAN</text><text x="-95" y="86" text-anchor="middle" fill="#ffd377" font-family="Arial" font-size="17" font-weight="900">CYSTS?</text>
 </g>
 <rect x="38" y="103" width="490" height="117" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="283" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="283">밸러스트수 처리가 끝나도 탱크 바닥의 침전물은 남는다. FTF팀이 직접 내부를 검사한다.</tspan><tspan x="283" dy="24" font-size="14">压载水处理结束后，舱底沉积物仍会残留。FTF团队进入舱内检查。</tspan><tspan x="283" dy="22" font-size="13">Even after water treatment, sediment remains. The FTF team inspects the tank floor.</tspan></text>
 <rect x="548" y="103" width="188" height="94" rx="22" fill="#fff1b5" stroke="#111" stroke-width="4"/>
 <text x="642" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="642">바닥까지 확인!</tspan><tspan x="642" dy="21" font-size="13">舱底也要检查！</tspan><tspan x="642" dy="19" font-size="12">Check the bottom!</tspan></text>
 <text x="42" y="486" fill="#fff" stroke="#0d596c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">ENTER!  SCAN!  SAMPLE!</text>
</g>

<!-- PANEL 2: lab finds dormant cysts -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#lab)"/>
 <rect x="808" y="252" width="678" height="224" rx="16" fill="#c7d5db" stroke="#607681" stroke-width="4"/>
 <g transform="translate(863 350)" filter="url(#shadow)">
  <ellipse cx="45" cy="-48" rx="34" ry="40" fill="#e1aa82" stroke="#18262d" stroke-width="5"/>
  <path d="M11-55q9-31 36-36q30 5 31 36l-16-11q-21 10-51 11z" fill="#403029"/>
  <circle cx="34" cy="-47" r="4"/><circle cx="57" cy="-47" r="4"/>
  <rect y="-7" width="92" height="112" rx="18" fill="#f8fbfc" stroke="#18262d" stroke-width="5"/>
  <path d="M79 20l83 19" stroke="#f8fbfc" stroke-width="19" stroke-linecap="round"/>
 </g>
 <g transform="translate(1062 294)" filter="url(#shadow)"><path d="M40 0h44l-9 73q36 21 36 75H46q2-42 33-57l-8-40H40z" fill="#2a4653" stroke="#152730" stroke-width="6"/><rect x="17" y="144" width="126" height="24" rx="8" fill="#17313c"/><circle cx="94" cy="66" r="15" fill="#7be9f1"/></g>
 <g transform="translate(1250 255)" filter="url(#shadow)"><rect width="224" height="176" rx="16" fill="#0e3040" stroke="#6ee5ec" stroke-width="5"/><text x="112" y="28" text-anchor="middle" fill="#ddfbff" font-family="Arial" font-size="13" font-weight="900">DORMANT CYST ANALYSIS</text><circle cx="72" cy="83" r="25" fill="#d7a84f" stroke="#fff1a1" stroke-width="5"/><circle cx="72" cy="83" r="10" fill="#8f6330"/><path d="M140 59q28 19 4 50q-29-16-4-50z" fill="#f07f69" stroke="#ffc6b7" stroke-width="4"/><text x="112" y="145" text-anchor="middle" fill="#ffca75" font-family="Arial" font-size="17" font-weight="900">RESTING STAGES: FOUND</text></g>
 <rect x="796" y="103" width="494" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1043" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1043">현미경에서 휴면 포자와 알이 확인된다. 물속 생물보다 오래 살아남아 다른 항구에서 다시 깨어날 수 있다.</tspan><tspan x="1043" dy="24" font-size="14">显微镜确认休眠孢子和卵，它们能存活更久，并可能在另一港口重新苏醒。</tspan><tspan x="1043" dy="22" font-size="13">Dormant cysts and eggs can survive longer and awaken in another harbor.</tspan></text>
 <rect x="1308" y="103" width="188" height="94" rx="22" fill="#ffe1d7" stroke="#111" stroke-width="4"/>
 <text x="1402" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1402">살아날 수 있다!</tspan><tspan x="1402" dy="21" font-size="13">它们还能苏醒！</tspan><tspan x="1402" dy="19" font-size="12">They can wake again!</tspan></text>
 <text x="802" y="486" fill="#fff" stroke="#607681" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">ZOOM!  IDENTIFY!  ALERT!</text>
</g>

<!-- PANEL 3: closed sediment removal and treatment -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="12" fill="#253f4b"/>
 <rect x="28" y="681" width="722" height="313" rx="16" fill="#172f3a" stroke="#57727f" stroke-width="4"/>
 <g transform="translate(54 714)" filter="url(#shadow)"><rect width="254" height="205" rx="18" fill="#173846" stroke="#74e6ed" stroke-width="5"/><text x="127" y="29" text-anchor="middle" fill="#d8fbff" font-family="Arial" font-size="14" font-weight="900">CLOSED SEDIMENT RECOVERY</text><path d="M24 78h84" stroke="#76dae5" stroke-width="15"/><path d="M99 78l-19-14v28z" fill="#baf9ff"/><rect x="117" y="52" width="108" height="55" rx="12" fill="#6c5439" stroke="#d8bc7a" stroke-width="4"/><path d="M130 83q38-21 82 0" stroke="#b59862" stroke-width="12"/><text x="127" y="139" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="800">VACUUM → SEAL → HEAT</text><rect x="42" y="154" width="170" height="32" rx="8" fill="#0d2732"/><text x="127" y="176" text-anchor="middle" fill="#79f0b3" font-family="Arial" font-size="16" font-weight="900">NO HARBOR DISCHARGE</text></g>
 <!-- technician -->
 <g transform="translate(399 778)" filter="url(#shadow)"><ellipse cx="43" cy="-48" rx="34" ry="40" fill="#dca47e" stroke="#15242c" stroke-width="5"/><path d="M10-54q9-31 34-36q29 4 33 34l-17-10q-20 10-50 12z" fill="#252c31"/><circle cx="32" cy="-47" r="4"/><circle cx="55" cy="-47" r="4"/><rect y="-7" width="88" height="110" rx="18" fill="#eead2b" stroke="#15242c" stroke-width="5"/><path d="M70 16l93-32" stroke="#eead2b" stroke-width="19" stroke-linecap="round"/><rect x="149" y="-57" width="144" height="100" rx="12" fill="#0d3444" stroke="#79e8ef" stroke-width="5"/><text x="221" y="-31" text-anchor="middle" fill="#d9fbff" font-family="Arial" font-size="12" font-weight="900">RECOVERY STATUS</text><text x="221" y="0" text-anchor="middle" fill="#7cf0b4" font-family="Arial" font-size="20" font-weight="900">SEALED</text><text x="221" y="26" text-anchor="middle" fill="#ffd477" font-family="Arial" font-size="12">SEDIMENT CONTAINED</text></g>
 <path d="M310 814h86" stroke="#6adce7" stroke-width="14"/><path d="M387 814l-22-15v30z" fill="#b5f9ff"/>
 <rect x="38" y="543" width="493" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="284" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="284">침전물을 물로 씻어 바다로 흘리지 않는다. 진공 회수해 밀폐하고 열처리 후 육상에서 처리한다.</tspan><tspan x="284" dy="24" font-size="14">不把沉积物冲入海里，而是密闭抽吸回收、热处理后上岸处置。</tspan><tspan x="284" dy="22" font-size="13">Sediment is vacuum-recovered, sealed and heat-treated instead of washed into the sea.</tspan></text>
 <rect x="548" y="543" width="188" height="94" rx="22" fill="#d9ffe8" stroke="#111" stroke-width="4"/>
 <text x="642" y="573" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="642">바다 배출 0!</tspan><tspan x="642" dy="21" font-size="13">入海排放为零！</tspan><tspan x="642" dy="19" font-size="12">Zero harbor discharge!</tspan></text>
 <text x="42" y="969" fill="#fff" stroke="#0d596c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">VAC!  SEAL!  HEAT!  CONTAIN!</text>
</g>

<!-- PANEL 4: verification and protected native harbor -->
<g>
 <rect x="774" y="524" width="746" height="482" rx="12" fill="url(#sea)"/>
 <path d="M774 780q160-63 324-4t422-19v249H774z" fill="#0b5565"/>
 <path d="M836 928q22-78 42 0M904 947q22-92 42 0M1378 935q25-84 45 0" stroke="#3aaa70" stroke-width="15" fill="none"/>
 <g fill="#d9f8d1"><path d="M1110 842q42-27 80 0q-38 32-80 0z"/><path d="M1175 908q35-22 67 0q-32 27-67 0z"/><path d="M1300 856q45-29 86 0q-41 33-86 0z"/></g>
 <g transform="translate(810 682)" filter="url(#shadow)"><rect width="330" height="204" rx="18" fill="#0d3040" stroke="#75e8ef" stroke-width="5"/><text x="165" y="28" text-anchor="middle" fill="#d9fbff" font-family="Arial" font-size="14" font-weight="900">30-DAY BIOSECURITY VERIFY</text><text x="24" y="65" fill="#fff" font-family="Arial" font-size="16" font-weight="800">Dormant cyst release</text><text x="306" y="65" text-anchor="end" fill="#7cf0b4" font-family="Arial" font-size="18" font-weight="900">−96%</text><text x="24" y="97" fill="#fff" font-family="Arial" font-size="16" font-weight="800">Sediment recovered</text><text x="306" y="97" text-anchor="end" fill="#7cf0b4" font-family="Arial" font-size="18" font-weight="900">94%</text><text x="24" y="129" fill="#fff" font-family="Arial" font-size="16" font-weight="800">Harbor discharge</text><text x="306" y="129" text-anchor="end" fill="#7cf0b4" font-family="Arial" font-size="18" font-weight="900">0</text><text x="24" y="161" fill="#fff" font-family="Arial" font-size="16" font-weight="800">Native larvae</text><text x="306" y="161" text-anchor="end" fill="#ffd477" font-family="Arial" font-size="18" font-weight="900">STABLE</text></g>
 <!-- harbor officer -->
 <g transform="translate(1255 784)" filter="url(#shadow)"><ellipse cx="45" cy="-49" rx="35" ry="41" fill="#e9af86" stroke="#15242c" stroke-width="5"/><path d="M11-55q9-32 36-37q30 5 31 36l-16-10q-21 10-51 11z" fill="#302e31"/><circle cx="34" cy="-47" r="4"/><circle cx="57" cy="-47" r="4"/><rect y="-7" width="92" height="113" rx="18" fill="#e9f4f6" stroke="#15242c" stroke-width="5"/><path d="M14 20l-83-39" stroke="#e9f4f6" stroke-width="19" stroke-linecap="round"/><rect x="-143" y="-51" width="78" height="52" rx="9" fill="#0f3748" stroke="#7ae9f0" stroke-width="4"/><text x="-104" y="-20" text-anchor="middle" fill="#7cf0b4" font-family="Arial" font-size="15" font-weight="900">PASS</text></g>
 <rect x="796" y="543" width="494" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1043" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1043">30일 추적 결과, 휴면 생물 유출은 크게 줄고 항구의 토종 유생은 안정적으로 유지된다.</tspan><tspan x="1043" dy="24" font-size="14">30天追踪显示，休眠生物释放大幅下降，本地幼体保持稳定。</tspan><tspan x="1043" dy="22" font-size="13">After 30 days, dormant-stage release falls sharply while native larvae remain stable.</tspan></text>
 <rect x="1308" y="543" width="188" height="94" rx="22" fill="#d9ffe8" stroke="#111" stroke-width="4"/>
 <text x="1402" y="573" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1402">물만 막아선 부족해.</tspan><tspan x="1402" dy="21" font-size="13">只管水还不够。</tspan><tspan x="1402" dy="19" font-size="12">Water alone isn't enough.</tspan></text>
 <text x="802" y="969" fill="#fff" stroke="#084a5b" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">VERIFY!  ZERO RELEASE!  PROTECT NATIVE LIFE!</text>
</g>
</svg>