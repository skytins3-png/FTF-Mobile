<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 145 biosecurity passport mismatch triggers quarantine and physical reinspection">
<defs>
 <linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#14263e"/><stop offset=".58" stop-color="#557f9e"/><stop offset="1" stop-color="#efb66d"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#168ca8"/><stop offset="1" stop-color="#063a4d"/></linearGradient>
 <linearGradient id="dock" x2="0" y2="1"><stop stop-color="#748995"/><stop offset="1" stop-color="#263842"/></linearGradient>
 <linearGradient id="lab" x2="1" y2="1"><stop stop-color="#f1f7f8"/><stop offset="1" stop-color="#b8d0d8"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".42"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#07151d"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#153d55"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #145  여권이 틀리면 배부터 멈춘다</text>
<text x="895" y="49" fill="#c8f7ff" font-family="Arial" font-size="18" font-weight="800">MISMATCH → HOLD → REINSPECT · 不匹配即停船复检</text>

<!-- PANEL 1: harbor entry scan detects mismatch -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#dawn)"/>
 <rect x="16" y="330" width="746" height="182" fill="url(#sea)"/>
 <path d="M18 454q105-22 205 0t205 0t205 0t128 0" fill="none" stroke="#d8f7ff" stroke-width="6" opacity=".7"/>
 <g transform="translate(337 317)" filter="url(#sh)"><path d="M0 42h330l-35 86H38z" fill="#e5ecef" stroke="#132b37" stroke-width="6"/><rect x="106" y="-42" width="119" height="86" rx="6" fill="#cadbe1" stroke="#132b37" stroke-width="5"/><rect x="151" y="-94" width="12" height="52" fill="#263c47"/><text x="165" y="96" text-anchor="middle" fill="#203944" font-family="Arial" font-size="18" font-weight="900">K-17 LINE</text></g>
 <path d="M476 327v-142h156v142" fill="none" stroke="#70edf4" stroke-width="13"/>
 <rect x="497" y="207" width="114" height="74" rx="10" fill="#082f40" stroke="#8bf6fa" stroke-width="4" filter="url(#glow)"/>
 <text x="554" y="230" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="900">BIO PASS</text><text x="554" y="256" text-anchor="middle" fill="#ff6565" font-family="Arial" font-size="18" font-weight="900">MISMATCH!</text>
 <g transform="translate(80 358)" filter="url(#sh)"><ellipse cx="45" cy="-55" rx="34" ry="41" fill="#d59b73" stroke="#122833" stroke-width="5"/><path d="M12-62q7-31 33-36q30 6 32 35l-17-9q-20 8-48 10z" fill="#263038"/><rect y="-8" width="96" height="113" rx="18" fill="#225f79" stroke="#122833" stroke-width="5"/><rect x="72" y="5" width="76" height="96" rx="8" fill="#072f40" stroke="#75eaf2" stroke-width="4"/><path d="M20 105l-18 66M76 105l22 66" stroke="#344b56" stroke-width="23" stroke-linecap="round"/></g>
 <rect x="38" y="102" width="506" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="291" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="291">입항 게이트에서 여권의 시간·선박 ID·검사기관 서명이 맞지 않는다.</tspan><tspan x="291" dy="24" font-size="14">入港闸口发现时间、船舶ID与检查机构签名不一致。</tspan><tspan x="291" dy="22" font-size="13">At the harbor gate, time, vessel ID and inspector signature do not match.</tspan></text>
 <path d="M562 105h164q18 0 18 18v74q0 18-18 18h-101l-30 27 8-27h-41q-18 0-18-18v-74q0-18 18-18z" fill="#ffd9d9" stroke="#111" stroke-width="4"/>
 <text x="644" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="644">불일치! 입항 중지!</tspan><tspan x="644" dy="22">不匹配！停止入港！</tspan><tspan x="644" dy="20" font-size="12">Mismatch. HOLD!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#5d2630" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">SCAN!  MISMATCH!  HOLD!</text>
</g>

<!-- PANEL 2: ship diverted to quarantine berth -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="#18384b"/>
 <rect x="774" y="306" width="746" height="206" fill="url(#sea)"/>
 <rect x="1180" y="265" width="340" height="69" fill="url(#dock)" stroke="#142b36" stroke-width="5"/>
 <path d="M810 232C940 180 1084 188 1198 240" fill="none" stroke="#ffcf4b" stroke-width="8" stroke-dasharray="18 12"/>
 <polygon points="1185,231 1216,244 1187,260" fill="#ffcf4b"/>
 <g transform="translate(855 327)" filter="url(#sh)"><path d="M0 30h281l-29 74H34z" fill="#e4ebee" stroke="#132b37" stroke-width="6"/><rect x="89" y="-37" width="100" height="69" rx="5" fill="#cedde2" stroke="#132b37" stroke-width="5"/></g>
 <rect x="1248" y="176" width="189" height="76" rx="12" fill="#562d31" stroke="#ff7b7b" stroke-width="5"/><text x="1342" y="205" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="900">QUARANTINE BERTH</text><text x="1342" y="231" text-anchor="middle" fill="#ffd2d2" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900">격리 선석 · 隔离泊位</text>
 <g transform="translate(1260 343)" filter="url(#sh)"><ellipse cx="42" cy="-49" rx="31" ry="37" fill="#dda27a" stroke="#132b37" stroke-width="5"/><path d="M11-56q7-28 31-32q27 5 29 31l-15-8q-18 7-45 9z" fill="#3b2928"/><rect y="-4" width="86" height="101" rx="17" fill="#ef9d35" stroke="#132b37" stroke-width="5"/><path d="M73 15l68-22" stroke="#ef9d35" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="798" y="102" width="506" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1051" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1051">배는 일반 부두가 아니라 격리 선석으로 이동한다. 승객·화물보다 먼저 생물보안을 다시 확인한다.</tspan><tspan x="1051" dy="24" font-size="14">船舶改靠隔离泊位，先复核生物安全，再处理人员和货物。</tspan><tspan x="1051" dy="22" font-size="13">The vessel diverts to quarantine; biosecurity is rechecked before routine port operations.</tspan></text>
 <path d="M1322 103h160q18 0 18 18v76q0 18-18 18h-98l-28 27 7-27h-41q-18 0-18-18v-76q0-18 18-18z" fill="#fff0bd" stroke="#111" stroke-width="4"/>
 <text x="1402" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1402">일반 부두로 가지 마!</tspan><tspan x="1402" dy="21">转去隔离泊位！</tspan><tspan x="1402" dy="19" font-size="12">Divert to quarantine!</tspan></text>
 <text x="802" y="487" fill="#fff" stroke="#70541c" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">DIVERT!  ISOLATE!  SECURE!</text>
</g>

<!-- PANEL 3: real inspectors physically reinspect hull/sea chest and resample eDNA -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="12" fill="#0b3c50"/>
 <rect x="16" y="705" width="746" height="301" fill="#0a6176"/>
 <path d="M16 716q110 25 225 0t225 0t296 0" fill="none" stroke="#b9f3ff" stroke-width="5" opacity=".55"/>
 <path d="M420 670h310v74H455z" fill="#dbe6ea" stroke="#112d39" stroke-width="6"/>
 <path d="M504 744v116" stroke="#859ca6" stroke-width="9"/>
 <!-- diver -->
 <g transform="translate(520 816) rotate(-9)" filter="url(#sh)"><ellipse cx="0" cy="0" rx="30" ry="35" fill="#1e2f38" stroke="#07151c" stroke-width="5"/><rect x="-44" y="30" width="88" height="108" rx="32" fill="#1a252c" stroke="#07151c" stroke-width="5"/><rect x="-19" y="-12" width="38" height="24" rx="8" fill="#8feaf2" stroke="#07151c" stroke-width="4"/><path d="M-37 62l-68 45M37 62l72 24M-24 132l-48 72M25 132l55 64" stroke="#1a252c" stroke-width="23" stroke-linecap="round"/><circle cx="112" cy="84" r="19" fill="#f0c34d" stroke="#0b2029" stroke-width="5"/><path d="M112 84l72-20" stroke="#f0c34d" stroke-width="7"/></g>
 <!-- ROV -->
 <g transform="translate(283 816)" filter="url(#sh)"><rect x="-72" y="-38" width="144" height="76" rx="22" fill="#e5b13d" stroke="#102b36" stroke-width="6"/><circle cx="-33" cy="0" r="16" fill="#89f3ff" stroke="#102b36" stroke-width="5"/><circle cx="33" cy="0" r="16" fill="#89f3ff" stroke="#102b36" stroke-width="5"/><path d="M-73 5l-67 37M73 5l67 37" stroke="#d9a331" stroke-width="15" stroke-linecap="round"/><path d="M0-38v-67" stroke="#e7d27b" stroke-width="5"/></g>
 <!-- scientists at sampling table -->
 <g transform="translate(76 697)" filter="url(#sh)"><ellipse cx="43" cy="-51" rx="32" ry="39" fill="#d8a07a" stroke="#132b37" stroke-width="5"/><path d="M11-57q7-29 32-34q28 5 30 33l-16-9q-18 8-46 10z" fill="#31292a"/><rect y="-4" width="90" height="105" rx="17" fill="#f4f7f8" stroke="#132b37" stroke-width="5"/><path d="M77 18l84 22" stroke="#f4f7f8" stroke-width="19" stroke-linecap="round"/></g>
 <rect x="178" y="670" width="166" height="76" rx="10" fill="#dce9ed" stroke="#102b36" stroke-width="5"/><circle cx="220" cy="708" r="18" fill="#67d5e4"/><rect x="251" y="686" width="70" height="44" rx="7" fill="#103b4b"/><text x="286" y="713" text-anchor="middle" fill="#8fffae" font-family="Arial" font-size="13" font-weight="900">eDNA RUN</text>
 <rect x="38" y="543" width="520" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="298" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">잠수팀·ROV가 선체와 해수흡입구를 다시 보고, 연구원이 현장에서 새 eDNA 시료를 채취한다.</tspan><tspan x="298" dy="24" font-size="14">潜水员和ROV复查船体与海水箱，研究员现场重新采集eDNA样本。</tspan><tspan x="298" dy="22" font-size="13">Divers and an ROV reinspect the hull and sea chest while scientists collect a fresh eDNA sample.</tspan></text>
 <path d="M579 547h153q18 0 18 18v75q0 18-18 18h-89l-29 27 8-27h-43q-18 0-18-18v-75q0-18 18-18z" fill="#d9fff0" stroke="#111" stroke-width="4"/>
 <text x="655" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="655">기록 말고 실제를 본다!</tspan><tspan x="655" dy="21">不只看记录，要看实物！</tspan><tspan x="655" dy="19" font-size="12">Verify the vessel itself!</tspan></text>
 <text x="42" y="979" fill="#fff" stroke="#154757" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">DIVE!  SAMPLE!  REINSPECT!</text>
</g>

<!-- PANEL 4: discrepancy explained, record corrected, vessel cleared only after negative retest -->
<g>
 <rect x="774" y="524" width="746" height="482" rx="12" fill="url(#lab)"/>
 <rect x="801" y="691" width="690" height="260" rx="22" fill="#c3d9df" stroke="#587580" stroke-width="5"/>
 <rect x="842" y="715" width="305" height="176" rx="14" fill="#092f40" stroke="#67e9ef" stroke-width="5" filter="url(#sh)"/>
 <text x="994" y="745" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="900">REINSPECTION RESULT</text>
 <text x="872" y="782" fill="#c8f8ff" font-family="Arial" font-size="15">VESSEL ID: K-17 ✓</text><text x="872" y="812" fill="#c8f8ff" font-family="Arial" font-size="15">HULL / SEA CHEST: CLEAR ✓</text><text x="872" y="842" fill="#7dffb5" font-family="Arial" font-size="15" font-weight="900">FRESH eDNA: NEGATIVE ✓</text><text x="872" y="872" fill="#ffd56a" font-family="Arial" font-size="14" font-weight="900">OLD SIGNATURE: EXPIRED → REISSUED</text>
 <!-- female officer -->
 <g transform="translate(1200 810)" filter="url(#sh)"><ellipse cx="44" cy="-53" rx="33" ry="40" fill="#dfa57d" stroke="#132b37" stroke-width="5"/><path d="M11-60q8-30 33-34q29 5 31 33l-16-9q-19 8-48 10z" fill="#382827"/><rect y="-5" width="93" height="110" rx="17" fill="#225f79" stroke="#132b37" stroke-width="5"/><path d="M80 16l92-23" stroke="#225f79" stroke-width="19" stroke-linecap="round"/><path d="M22 105l-18 72M74 105l22 72" stroke="#344b56" stroke-width="23" stroke-linecap="round"/></g>
 <!-- captain -->
 <g transform="translate(1370 818)" filter="url(#sh)"><ellipse cx="40" cy="-48" rx="30" ry="37" fill="#ca936d" stroke="#132b37" stroke-width="5"/><path d="M9-54q7-27 31-31q26 5 28 30l-14-8q-18 7-45 9z" fill="#283239"/><rect y="-3" width="83" height="99" rx="16" fill="#f1f3f4" stroke="#132b37" stroke-width="5"/></g>
 <circle cx="1170" cy="759" r="49" fill="#39c878" stroke="#0d6239" stroke-width="7"/><path d="M1148 758l16 18 31-39" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="798" y="543" width="520" height="119" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">재검사 결과는 음성. 원인은 만료된 서명으로 확인되어 새 여권을 발급한 뒤에만 입항을 허가한다.</tspan><tspan x="1058" dy="24" font-size="14">复检为阴性，确认原因是签名过期；重新签发通行证后才允许入港。</tspan><tspan x="1058" dy="22" font-size="13">The retest is negative; the mismatch was an expired signature. Entry is allowed only after reissue.</tspan></text>
 <path d="M1337 547h150q18 0 18 18v77q0 18-18 18h-94l-29 27 8-27h-35q-18 0-18-18v-77q0-18 18-18z" fill="#d9fff0" stroke="#111" stroke-width="4"/>
 <text x="1412" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">음성 확인 후에만 통과!</tspan><tspan x="1412" dy="21">确认阴性后才放行！</tspan><tspan x="1412" dy="19" font-size="12">Clear only after retest!</tspan></text>
 <text x="802" y="979" fill="#fff" stroke="#2f6651" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="29" font-weight="900">RETEST!  REISSUE!  CLEAR!</text>
</g>
</svg>