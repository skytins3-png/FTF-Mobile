<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c9b58d"/><stop offset="1" stop-color="#805944"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#7592a5"/><stop offset="1" stop-color="#263c49"/></linearGradient></defs><rect width="1080" height="1920" fill="#11151a"/><rect x="28" y="28" width="1024" height="1135" rx="28" fill="url(#sky)" stroke="#f0e2c8" stroke-width="6"/><path d="M28 530Q250 430 470 520T820 500T1052 510V845H28Z" fill="#4b443d"/><path d="M28 780Q210 700 430 760T780 750T1052 770V1163H28Z" fill="#c39a67"/><path d="M440 830Q590 790 760 835T1052 830V1040Q870 1010 690 1045T440 1045Z" fill="url(#lake)"/><g stroke="#6e4b36" stroke-width="8"><path d="M55 940l110 90 95-85 110 95 95-90" fill="none"/><path d="M80 1085l120-95 110 80 110-90" fill="none"/></g><g transform="translate(170 670)"><circle cx="100" cy="100" r="42" fill="#c88f69"/><path d="M54 98q42-64 88 0V48q-42-42-87 3z" fill="#362b28"/><path d="M40 160q55-50 112 0l20 205H20z" fill="#51667c"/><path d="M78 205l42 0 8 95H70z" fill="#a8d1df"/></g><g transform="translate(355 760)"><circle cx="82" cy="72" r="34" fill="#d0a07c"/><path d="M48 72q32-48 66 0V38q-31-34-66 1z" fill="#332522"/><path d="M35 125q47-40 94 0l15 155H20z" fill="#d36a4a"/></g><rect x="64" y="70" width="600" height="142" rx="20" fill="#121820e8" stroke="#dfc89d" stroke-width="3"/><text x="95" y="119" fill="#e8d2a8" font-family="Arial" font-weight="700" font-size="34">SCENE 12 · EMPTY RESERVOIR</text><text x="95" y="166" fill="#fff" font-family="Arial" font-size="28">저수율 12% · 水库蓄水率12%</text><path d="M615 410h370v225H615z" fill="#fff" stroke="#111" stroke-width="6" rx="22"/><path d="M675 635l-48 70 15-88z" fill="#fff" stroke="#111" stroke-width="5"/><text x="647" y="468" font-family="Arial" font-size="32" font-weight="700">“여기가 호수였어?”</text><text x="647" y="515" font-family="Arial" font-size="28">这里以前是湖吗？</text><text x="647" y="563" font-family="Arial" font-size="25">“Was this really a lake?”</text><text x="706" y="960" fill="#f4e0bc" font-family="Arial" font-size="60" font-weight="900" transform="rotate(-10 706 960)">CRK… CRK…</text><rect x="52" y="1205" width="976" height="265" rx="26" fill="#101925" stroke="#d5e6f6" stroke-width="4"/><text x="88" y="1270" fill="#9ed5ff" font-family="Arial" font-weight="700" font-size="30">상황 설명 · NARRATION</text><text x="88" y="1331" fill="#fff" font-family="Arial" font-size="34">물이 빠진 자리에는 갈라진 바닥과 오래된 선착장만 남았다.</text><text x="88" y="1382" fill="#fff" font-family="Arial" font-size="32">아이에게 ‘정상적인 수위’는 사진 속 기억이 되었다.</text><text x="88" y="1432" fill="#b8c8d8" font-family="Arial" font-size="26">干旱让湖底裸露。Drought turns memory into landscape.</text><rect x="52" y="1505" width="976" height="335" rx="26" fill="#18140f" stroke="#d6a967" stroke-width="4"/><text x="86" y="1575" fill="#e2bd7e" font-family="Arial" font-weight="700" font-size="29">지구의 경고 · EARTH’S WARNING</text><text x="86" y="1640" fill="#fff" font-family="Arial" font-size="35">“물이 사라지면, 도시는 먼저 목마른다.”</text><text x="86" y="1698" fill="#f2dcc0" font-family="Arial" font-size="30">“水消失时，城市会先感到口渴。”</text><text x="86" y="1756" fill="#f2dcc0" font-family="Arial" font-size="28">“When the water goes, the city thirsts first.”</text></svg>