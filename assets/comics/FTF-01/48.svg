<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512"><title>FTF-01 Scene 48 - Small Actions, Green Future</title><desc>Four-panel cinematic manga scene: turning off unused lights, fossil-fuel pollution harming people, solar and wind renewable-energy work, and a restored clean green city. Korean, Chinese and English captions and visual sound effects are embedded in the artwork.</desc><image width="768" height="512" href="data:image/jpeg;base64,"/></svg>