<circle cx="632" cy="1575" r="39" fill="#edb891"/><path d="M596 1571 Q632 1527 673 1570 Q659 1537 632 1534 Q607 1537 594 1556Z" fill="#4f392f"/><path d="M585 1620 Q632 1594 682 1622 L700 1811 H570Z" fill="#8a5b55"/>
<circle cx="757" cy="1610" r="30" fill="#f0bf99"/><path d="M729 1607 Q757 1570 790 1605 Q779 1577 757 1575 Q737 1578 727 1594Z" fill="#604435"/><path d="M720 1645 Q757 1625 796 1647 L811 1810 H706Z" fill="#d28557"/>
<!-- narrator and speech -->
<path d="M94 1298 Q413 1268 792 1310 L772 1446 Q418 1472 114 1436Z" fill="#fff" stroke="#111" stroke-width="6"/>
<text x="130" y="1342" fill="#111" font-size="28" font-family="Arial" font-weight="900">“미래는 기다리는 게 아니라, 함께 만드는 거야.”</text>
<text x="130" y="1383" fill="#333" font-size="21" font-family="Arial">“未来不是等待，而是我们一起创造。”</text>
<text x="130" y="1415" fill="#555" font-size="19" font-family="Arial">“The future isn’t something we wait for. We build it together.”</text>
<rect x="96" y="1748" width="884" height="62" rx="10" fill="#081111" opacity=".9"/>
<text x="118" y="1784" fill="#fff2bf" font-size="24" font-family="Arial" font-weight="900">내레이션 · 지구의 경고는 끝이 아니라, 행동의 시작이다.</text>
<text x="118" y="1813" fill="#dbe9e6" font-size="17" font-family="Arial">地球的警告不是终点，而是行动的开始。 · Earth’s warning is not the end, but the beginning of action.</text>
<text x="784" y="1706" fill="#ffe48c" font-size="45" font-family="Arial" font-weight="900">WHOOSH—</text>
</g>
<text x="62" y="1876" fill="#8da7b7" font-family="Arial" font-size="20">FTF-01 · SCENE 30 · 재건, 회복탄력성, 다음 세대</text>
