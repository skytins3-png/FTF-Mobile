<path d="M90 154 Q350 124 676 165 L655 286 Q356 310 110 270Z" fill="#fff" stroke="#111" stroke-width="6"/>
<text x="126" y="198" fill="#111" font-size="27" font-family="Arial" font-weight="900">“우리는 경고를 기억하고, 마을을 다시 세웠다.”</text>
<text x="126" y="237" fill="#333" font-size="21" font-family="Arial">“我们记住了警告，也重建了家园。”</text>
<text x="126" y="268" fill="#555" font-size="19" font-family="Arial">“We remembered the warning—and rebuilt.”</text>
<text x="78" y="616" fill="#fff0a0" font-size="42" font-family="Arial" font-weight="900">CLACK · HAMMER · THUMP</text>
</g>

<!-- PANEL 2: resilient infrastructure and community action -->
<g filter="url(#sh)">
<rect x="56" y="675" width="968" height="555" rx="20" fill="url(#sky2)" stroke="#fff" stroke-width="6"/>
