<linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9d9df"/><stop offset="1" stop-color="#4d866b"/></linearGradient>
<linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7a85c"/><stop offset=".58" stop-color="#836b94"/><stop offset="1" stop-color="#283d55"/></linearGradient>
