<circle cx="312" cy="1061" r="34" fill="#edb690"/><path d="M281 1057 Q312 1017 348 1055 Q336 1026 311 1024 Q290 1027 279 1043Z" fill="#332c2c"/><path d="M272 1102 Q311 1080 353 1104 L367 1204 H258Z" fill="#547552"/><path d="M338 1125 L402 1080" stroke="#7f5d3b" stroke-width="13" stroke-linecap="round"/>
<circle cx="461" cy="1083" r="29" fill="#dca47d"/><path d="M434 1080 Q461 1044 493 1079 Q482 1052 460 1050 Q441 1053 432 1067Z" fill="#2b3437"/><path d="M426 1118 Q461 1100 498 1120 L510 1208 H414Z" fill="#cf7c4d"/>
<!-- text box -->
<rect x="85" y="704" width="890" height="112" rx="16" fill="#f9fbfb" stroke="#111" stroke-width="5"/>
<text x="111" y="744" fill="#111" font-size="25" font-family="Arial" font-weight="900">작은 실천이 다음 재난을 막는 힘이 된다.</text>
<text x="111" y="779" fill="#333" font-size="20" font-family="Arial">小小的行动，成为阻止下一场灾难的力量。</text>
<text x="111" y="807" fill="#555" font-size="18" font-family="Arial">Small actions become the strength that prevents the next disaster.</text>
<text x="714" y="1188" fill="#fff6a8" font-size="42" font-family="Arial" font-weight="900">WHIRR · CLICK!</text>
</g>

<!-- PANEL 3: handoff to the next generation -->
<g filter="url(#sh)">
<rect x="56" y="1260" width="968" height="576" rx="20" fill="url(#sky3)" stroke="#fff" stroke-width="6"/>
<circle cx="845" cy="1425" r="86" fill="#ffd99b" opacity=".95"/>
