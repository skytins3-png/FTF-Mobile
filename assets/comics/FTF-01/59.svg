<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t d">
<title id="t">FTF-01 #59 — 끊어진 산호 길을 다시 잇다</title>
<desc id="d">Four-panel cinematic manga-style scene continuing the FTF-01 reef restoration story: marine researchers identify a broken reef corridor, a family helps prepare coral modules, divers carry and anchor living coral fragments across the damaged gap, and fish, rays and a sea turtle return through the restored corridor. Korean, Chinese and English narration, speech bubbles, visual sound effects, illustrated people, research vessel, divers, coral reef and marine animals.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ad9f3"/><stop offset=".58" stop-color="#c8edf6"/><stop offset="1" stop-color="#f7c878"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#25b9de"/><stop offset=".45" stop-color="#0878a5"/><stop offset="1" stop-color="#043a58"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08759f"/><stop offset="1" stop-color="#022638"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffad7"/><stop offset=".65" stop-color="#ffd770"/><stop offset="1" stop-color="#f29b49"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".38"/></filter>
 <style>
  .panel{stroke:#0c1720;stroke-width:10}.box{fill:#fffdf3;stroke:#0d1d27;stroke-width:4}.bubble{fill:white;stroke:#0d1820;stroke-width:4}
  .ko{font:700 25px 'Noto Sans KR',Arial,sans-serif;fill:#101820}.zh{font:600 19px Arial,sans-serif;fill:#173f57}.en{font:600 18px Arial,sans-serif;fill:#122631}
  .sfx{font:900 44px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.skin{fill:#e7a47b;stroke:#63392e;stroke-width:2}.hair{fill:#1f2b34}
  .suit{fill:#153f58;stroke:#082838;stroke-width:4}.line{stroke:#18333e;stroke-width:4;stroke-linecap:round;fill:none}
  .coralA{fill:#f36f62;stroke:#712e2d;stroke-width:3}.coralB{fill:#f2c249;stroke:#725821;stroke-width:3}.coralC{fill:#a778e8;stroke:#503875;stroke-width:3}.coralD{fill:#65c58b;stroke:#27634a;stroke-width:3}
 </style>
</defs>
<!-- PANEL 1: map the missing reef corridor -->
<g>
 <rect class="panel" x="4" y="4" width="760" height="500" fill="url(#sky)"/>
 <circle cx="680" cy="75" r="49" fill="url(#sun)"/>
 <path d="M4 338Q125 304 260 337T520 332T760 344V500H4Z" fill="#08779b"/>
 <path d="M4 385Q160 350 315 390T760 370V500H4Z" fill="#075e81" opacity=".7"/>
 <g transform="translate(408 258)" filter="url(#shadow)"><path d="M-112 92h320l-30 65H-75Z" fill="#edf5f5" stroke="#193744" stroke-width="5"/><path d="M15 8h115v87H15Z" fill="#f8f3da" stroke="#193744" stroke-width="4"/><rect x="-60" y="110" width="120" height="16" fill="#efbd3a"/><path d="M130 52h58l25 40h-83Z" fill="#c9e7ef" stroke="#193744" stroke-width="4"/></g>
 <g transform="translate(94 220)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 48Q25 3 59 2q41 2 41 52q-24-18-43-15q-23 2-39 9"/><path d="M7 104q50-24 100 6l20 129H-4Z" fill="#dc657b" stroke="#1b303a" stroke-width="4"/><path d="M98 132q76 4 118 44" stroke="#e7a47b" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(250 224)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 48Q25 3 59 2q41 2 41 52q-24-18-43-15q-23 2-39 9"/><path class="suit" d="M7 104q50-24 100 6l20 129H-4Z"/><rect x="16" y="130" width="104" height="70" rx="7" fill="#dbeaf0" stroke="#173846" stroke-width="4"/><path d="M28 185l23-24 19 13 20-30 18 12" fill="none" stroke="#d84d42" stroke-width="5"/></g>
 <g transform="translate(470 330)"><rect x="0" y="0" width="210" height="108" rx="8" fill="#eef4e6" stroke="#173846" stroke-width="5"/><path d="M22 78q36-42 65-4q28-42 53-3q28-41 47-3" fill="none" stroke="#49a468" stroke-width="13"/><path d="M93 20v74" stroke="#d94a45" stroke-width="7" stroke-dasharray="10 9"/><text x="116" y="36" font-size="17" font-weight="800" fill="#d94a45">GAP</text></g>
 <rect class="box" x="18" y="18" width="498" height="143" rx="8"/><text x="38" y="52" class="ko">모니터링 결과, 두 산호초 사이에 생명이 끊긴 구간을 찾았어요.</text><text x="38" y="86" class="ko">오늘은 그 빈 길을 다시 연결합니다.</text><text x="38" y="118" class="zh">监测发现两片珊瑚礁之间有一段生态断裂带。</text><text x="38" y="147" class="en">Monitoring reveals a broken corridor between two reefs.</text>
 <path class="bubble" d="M510 38h224q16 0 16 16v111q0 16-16 16H630l-28 34 5-34H510q-16 0-16-16V54q0-16 16-16Z"/><text x="529" y="77" class="ko">여기를 이어주면 물고기들이 다시 오갈 수 있어요!</text><text x="529" y="111" class="zh">连上这里，鱼儿就能再次往来！</text><text x="529" y="145" class="en">Reconnect this gap and fish can move again!</text><text x="48" y="470" class="sfx" fill="#43e0ff">MAP! FIND! CONNECT!</text>
</g>
<!-- PANEL 2: prepare living coral modules -->
<g transform="translate(768 0)">
 <rect class="panel" x="4" y="4" width="764" height="500" fill="#0b6f92"/>
 <path d="M4 335Q160 300 310 338T760 326V500H4Z" fill="#086384"/>
 <g transform="translate(75 220)" filter="url(#shadow)"><rect x="0" y="0" width="230" height="160" rx="12" fill="#d7d2bd" stroke="#163846" stroke-width="5"/><g class="coralA"><path d="M28 135q8-65 20-5q10-50 24 2q11-46 23 4q-31 10-67-1Z"/></g><g class="coralB"><path d="M106 136q7-62 20-4q8-48 22 1q11-44 23 4q-31 9-65-1Z"/></g><g class="coralC"><path d="M169 137q6-55 17-3q8-43 19 1q9-38 19 3q-27 8-55-1Z"/></g><circle cx="53" cy="40" r="17" fill="#daeef5"/><circle cx="113" cy="41" r="17" fill="#daeef5"/><circle cx="177" cy="40" r="17" fill="#daeef5"/></g>
 <g transform="translate(360 200)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 49Q26 4 59 2q40 3 40 52q-23-17-42-15q-22 2-39 10"/><path d="M8 104q49-23 98 5l18 134H-3Z" fill="#df697b" stroke="#17313b" stroke-width="4"/><path d="M5 126q-56 21-92 69" stroke="#e7a47b" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(500 205)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="52" rx="39" ry="44"/><path class="hair" d="M18 49Q26 4 59 2q40 3 40 52q-23-17-42-15q-22 2-39 10"/><path class="suit" d="M8 104q49-23 98 5l18 134H-3Z"/><path d="M4 130q-70 8-120 52" stroke="#e7a47b" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <rect class="box" x="18" y="18" width="492" height="142" rx="8"/><text x="38" y="52" class="ko">연구팀과 가족은 살아있는 산호 조각을 전용 모듈에 고정해요.</text><text x="38" y="86" class="ko">각 모듈은 손상된 바다의 빈자리에 들어갈 작은 산호섬입니다.</text><text x="38" y="117" class="zh">研究团队把健康珊瑚碎片固定在专用生态模块上。</text><text x="38" y="147" class="en">Healthy coral fragments are secured to reef modules.</text>
 <path class="bubble" d="M508 44h226q16 0 16 16v103q0 16-16 16H632l-28 32 5-32H508q-16 0-16-16V60q0-16 16-16Z"/><text x="527" y="82" class="ko">하나씩 단단히! 바다에서 떨어지면 안 돼요.</text><text x="527" y="116" class="zh">一个一个固定好，不能松脱！</text><text x="527" y="149" class="en">Secure every piece—no loose fragments!</text><text x="44" y="470" class="sfx" fill="#ffd84e">CLICK! LOCK! READY!</text>
</g>
<!-- PANEL 3: divers bridge the gap -->
<g transform="translate(0 512)">
 <rect class="panel" x="4" y="4" width="760" height="508" fill="url(#deep)"/>
 <g opacity=".24" stroke="#efffff" stroke-width="5"><path d="M90 0L12 310M235 0L145 320M390 0L275 320M555 0L430 310M730 0L615 315"/></g>
 <path d="M4 402Q145 347 310 390T760 360V508H4Z" fill="#9c8565"/>
 <g class="coralA"><path d="M30 468q11-82 28-6q13-62 30 2q14-57 31 4q-41 14-89 0Z"/></g><g class="coralD"><path d="M630 466q11-83 29-6q13-64 31 1q15-57 30 4q-43 14-90 1Z"/></g>
 <g transform="translate(250 235)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="45" width="82" height="30" rx="14" fill="#c9f4ff" opacity=".88" stroke="#153949" stroke-width="4"/><path class="suit" d="M10 101q48-22 95 7l18 128H0Z"/><path d="M100 130q78 4 138 38" stroke="#e7a47b" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="218" y="137" width="108" height="78" rx="8" fill="#d8d2bd" stroke="#173846" stroke-width="5"/><g class="coralB"><path d="M238 201q6-42 16-3q7-33 18 1q9-29 18 3q-25 8-52-1Z"/></g></g>
 <g transform="translate(80 255)"><ellipse class="skin" cx="58" cy="52" rx="38" ry="42"/><rect x="18" y="45" width="82" height="30" rx="14" fill="#c9f4ff" opacity=".88" stroke="#153949" stroke-width="4"/><path d="M10 101q48-22 95 7l18 128H0Z" fill="#d85f77" stroke="#17313b" stroke-width="4"/><path d="M95 134q70 14 115 60" stroke="#e7a47b" stroke-width="16" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(470 332)"><rect x="0" y="0" width="175" height="92" rx="9" fill="#d8d2bd" stroke="#173846" stroke-width="5"/><path d="M15 74q31-43 57-4q28-40 48-2q20-36 38-1" fill="none" stroke="#f27967" stroke-width="11"/><path d="M22 84h136" stroke="#4b6e78" stroke-width="6"/></g>
 <rect class="box" x="18" y="18" width="492" height="139" rx="8"/><text x="38" y="52" class="ko">잠수사들이 모듈을 손상 구간에 내려놓고 암반에 단단히 고정합니다.</text><text x="38" y="86" class="ko">끊어졌던 두 산호초가 하나의 생태 길로 이어져요.</text><text x="38" y="117" class="zh">潜水员把生态模块固定在断裂带，让两片珊瑚礁重新相连。</text><text x="38" y="147" class="en">Divers anchor modules to bridge the damaged reef gap.</text>
 <path class="bubble" d="M512 38h218q15 0 15 15v102q0 15-15 15H636l-26 32 4-32H512q-15 0-15-15V53q0-15 15-15Z"/><text x="529" y="77" class="ko">고정 완료! 이제 생명의 길이 연결됐어요!</text><text x="529" y="111" class="zh">固定完成！生命通道连上了！</text><text x="529" y="144" class="en">Anchored! The life corridor is connected!</text><text x="45" y="476" class="sfx" fill="#63efff">LOWER! ANCHOR! LINK!</text>
</g>
<!-- PANEL 4: life returns through the corridor -->
<g transform="translate(768 512)">
 <rect class="panel" x="4" y="4" width="764" height="508" fill="url(#sea)"/>
 <g opacity=".25" stroke="#efffff" stroke-width="5"><path d="M85 0L15 300M240 0L145 320M410 0L292 325M575 0L450 315M742 0L625 320"/></g>
 <path d="M4 405Q150 350 320 392T760 355V508H4Z" fill="#9b835f"/>
 <g class="coralA"><path d="M26 475q14-96 36-7q15-74 35 2q18-67 38 5q-48 17-109 0Z"/></g><g class="coralB"><path d="M180 472q12-89 33-6q14-69 32 2q16-62 35 4q-45 15-100 0Z"/></g><g class="coralC"><path d="M332 470q13-92 34-6q15-72 34 1q18-64 36 4q-45 16-104 1Z"/></g><g class="coralD"><path d="M515 472q13-92 34-6q15-72 34 1q18-64 36 4q-45 16-104 1Z"/></g>
 <g fill="#ffcf43" stroke="#714f1d" stroke-width="2"><path d="M132 245q35-24 68 0q-32 28-68 3l-20 14 4-23Z"/><path d="M260 205q31-21 60 0q-29 25-60 2l-18 13 4-21Z"/><path d="M600 260q34-23 66 0q-31 27-66 3l-20 13 4-22Z"/></g>
 <g fill="#5bc6f0" stroke="#1e5c75" stroke-width="2"><path d="M390 232q27-19 54 0q-26 22-54 2l-16 11 4-18Z"/><path d="M485 182q27-19 54 0q-26 22-54 2l-16 11 4-18Z"/></g>
 <g transform="translate(395 245)"><path d="M0 45q65-70 142-10q-22 88-105 91q-51-7-37-81Z" fill="#9b8664" stroke="#243c45" stroke-width="4"/><ellipse cx="75" cy="44" rx="9" ry="7" fill="#111"/><path d="M137 62q56-20 86 5q-37 24-78 16Z" fill="#9b8664" stroke="#243c45" stroke-width="4"/></g>
 <g transform="translate(110 190)"><path d="M0 40q80-55 142 0q-68 33-142 7l-36 23 10-35Z" fill="#678ca0" stroke="#203e4d" stroke-width="4"/><path d="M70 8q24 24 35 48q-34-5-57-28Z" fill="#678ca0" stroke="#203e4d" stroke-width="4"/></g>
 <rect class="box" x="18" y="18" width="503" height="142" rx="8"/><text x="38" y="52" class="ko">며칠 뒤, 물고기와 거북이와 가오리가 새 산호 길을 따라 돌아옵니다.</text><text x="38" y="86" class="ko">작은 연결 하나가 바다 전체의 이동 통로를 되살렸어요.</text><text x="38" y="117" class="zh">几天后，鱼群、海龟和鳐鱼沿着新的珊瑚通道重新回来。</text><text x="38" y="147" class="en">Days later, marine life returns through the restored corridor.</text>
 <path class="bubble" d="M525 40h210q15 0 15 15v102q0 15-15 15H643l-25 31 4-31H525q-15 0-15-15V55q0-15 15-15Z"/><text x="543" y="78" class="ko">봐요! 정말 다시 지나가고 있어요!</text><text x="543" y="112" class="zh">看！它们真的又回来了！</text><text x="543" y="145" class="en">Look! They're moving through again!</text><text x="42" y="477" class="sfx" fill="#eaff53">REEF LINK! LIFE RETURNS!</text>
</g>
<rect x="12" y="960" width="1512" height="52" rx="10" fill="#f8f9f3" opacity=".96"/><text x="30" y="993" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#0c5779">FTF-01 #59  •  이어진 산호 길, 이어지는 생명  •  连起珊瑚通道，连起生命  •  CONNECT THE REEF, CONNECT LIFE</text>
</svg>