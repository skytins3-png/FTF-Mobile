 <text x="377" y="582" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="377">현장팀은 B-5 주변 선체·방현재·계류줄을 동시에 면봉검사한다.</tspan><tspan x="377" dy="26" font-size="14">现场队同时采样船体、防碰垫和缆绳，快速PCR比对来源。</tspan><tspan x="377" dy="24" font-size="13">Teams swab hulls, fenders and ropes together, then run rapid field PCR.</tspan></text>
