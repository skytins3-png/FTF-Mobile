<text x="768" y="998" text-anchor="middle" fill="#fff" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900">작은 경보도 즉시 움직이면 큰 확산을 막는다 · 小警报，快行动，阻止大扩散 · Fast action turns a small alert into zero spread</text>
