 <text x="1076" y="360" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1076">입항·작업선·공용장비 이동을 동시에 멈춰 확산 경로부터 잠근다.</tspan><tspan x="1076" dy="23" font-size="13">同时冻结船舶、工作艇和共享设备移动，先锁住传播路线。</tspan></text>
 <text x="810" y="496" font-family="Arial" font-size="26" font-weight="1000" fill="#ffd95d">FREEZE! LOCK! CONTAIN THE ROUTE!</text>
