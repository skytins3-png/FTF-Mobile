 <text x="651" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="651">경보 확인!</tspan><tspan x="651" dy="24">10분 대응 시작!</tspan><tspan x="651" dy="21" font-size="12">十分钟响应！</tspan></text>
 <text x="52" y="499" font-family="Arial" font-size="27" font-weight="1000" fill="#ffe45d" stroke="#111" stroke-width="1">PING! ALERT! WHOLE PORT!</text>
