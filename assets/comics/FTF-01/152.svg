 <text x="1324" y="583" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1324">훈련이 아니라 실제 경보여도 같은 순서로 움직인다.</tspan><tspan x="1324" dy="24" font-size="13">即使是真实警报，也按同一流程行动。</tspan><tspan x="1324" dy="22" font-size="13">The same protocol works when the alert is real.</tspan></text>
 <path d="M1182 696h284q17 0 17 17v70q0 17-17 17h-147l-34 28 10-28h-113q-17 0-17-17v-70q0-17 17-17z" fill="#effff8" stroke="#111" stroke-width="4"/>
 <text x="1324" y="724" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1324">10분 안에 막았다.</tspan><tspan x="1324" dy="23">바다는 계속 열린다!</tspan><tspan x="1324" dy="20" font-size="12">十分钟阻断，海洋继续呼吸！</tspan></text>
 <text x="803" y="983" font-family="Arial" font-size="25" font-weight="1000" fill="#fff" stroke="#0a3347" stroke-width="2">VERIFY! UNDER 10 MIN! ZERO SECONDARY SPREAD!</text>
