<text x="28" y="52" fill="#fff" font-family="Arial,Malgun Gothic" font-size="31" font-weight="900">FTF-01  #152  경보가 울리면 10분 안에 항만 전체가 움직인다</text>
<text x="915" y="50" fill="#d8f8ff" font-family="Arial" font-size="18" font-weight="800">ALERT → FREEZE → SAMPLE → CONTAIN → VERIFY · 港口联动</text>

