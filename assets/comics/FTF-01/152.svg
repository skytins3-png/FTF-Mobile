 <text x="202" y="725" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="202">97% 일치!</tspan><tspan x="202" dy="23">이 장비부터 격리!</tspan><tspan x="202" dy="20" font-size="12">立即隔离！</tspan></text>
