 <text x="298" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="298">B-5 스마트 부이가 낯선 eDNA를 잡았다. 자동으로 항만 공동경보가 울린다.</tspan><tspan x="298" dy="26" font-size="14">B-5智能浮标发现异常eDNA，港口联动警报自动启动。</tspan><tspan x="298" dy="24" font-size="13">B-5 detects unusual eDNA. The whole-port alert fires automatically.</tspan></text>
