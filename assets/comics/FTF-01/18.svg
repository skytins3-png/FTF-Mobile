 1005 730 1090 L700 1270 Q480 1320 275 1238Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="300" y="1152" font-size="34" font-family="Arial" fill="#111" font-weight="700">“오늘도 침수 경보야.”</text><text x="300" y="1202" font-size="29" font-family="Arial" fill="#333">今天又发布内涝警报。</text><text x="300" y="1245" font-size="26" font-family="Arial" fill="#555">Another flood alert today.</text></g><g><path d="M78 1450 H990 V1698 H78Z" fill="#0a1017" opacity=".94" stroke="#d5deea" stroke-width="5"/><text x="112" y="1518" font-size="38" font-family="Arial" fill="#ffe38a" font-weight="700">상황 설명 · 만조와 폭우가 겹친 해안 도시.</text><text x="112" y="1575" font-size="31" font-family="Arial" fill="#fff">바닷물이 배수로를 거슬러 도로로 올라온다.</text><text x="112" y="1624" font-size="28" font-family="Arial" fill="#c9d8e8">海水正沿着排水系统倒灌进城市。</text></g><text x="76" y="190" font-size="54" font-family="Arial" fill="#fff" font-weight="900">FTF-01 · 18 / 26</text><text x="735" y="285" font-size="70" font-family="Arial" fill="#8ed8ff" font-weight="900" transform="rotate(-5 735 285)">SPLASH!</text></svg>