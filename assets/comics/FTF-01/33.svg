<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="FTF-01 scene 33 wildfire smoke and community clean-air response"><defs><linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#8d6f62"/><stop offset="1" stop-color="#272b35"/></linearGradient><linearGradient id="safe" x2="1" y2="1"><stop stop-color="#8fc7d7"/><stop offset="1" stop-color="#356f63"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".4"/></filter></defs><rect width="1080" height="1920" fill="#090c12"/><rect x="25" y="24" width="1030" height="1870" rx="30" fill="#111823" stroke="#fff" stroke-width="5"/><text x="58" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="900">FTF-01 · EARTH'S WARNING</text><text x="914" y="80" fill="#ffd96b" font-family="Arial" font-size="32" font-weight="900">33</text>
<!-- panel 1 wildfire smoke --> <g filter="url(#sh)"><rect x="54" y="112" width="972" height="410" rx="22" fill="url(#smoke)" stroke="#fff" stroke-width="6"/><circle cx="885" cy="184" r="66" fill="#e89a5d" opacity=".55"/><path d="M54 365 Q190 300 330 352 T610 340 T1026 328 V522 H54Z" fill="#303d38"/><path d="M650 355 q45-110 92-8 q35-140 90-18 q38-95 76 15 q45-84 88 20" fill="#f06b3f" opacity=".85"/><path d="M655 360 q70-160 128-12 q64-160 126 2 q50-90 96 15" fill="#ffb34f" opacity=".55"/><rect x="75" y="132" width="650" height="84" rx="15" fill="#151a22" fill-opacity=".9" stroke="#ffd96b" stroke-width="3"/><text x="94" y="164" fill="#fff" font-family="Arial" font-size="27" font-weight="900">산불 연기가 도시를 덮는다 — 공기도 경보다.</text><text x="94" y="191" fill="#fff" font-family="Arial" font-size="19">山火烟雾笼罩城市——空气也在报警。 · Smoke is a warning too.</text><!-- mother/child --><circle cx="235" cy="325" r="52" fill="#e7b994" stroke="#252b34" stroke-width="5"/><path d="M188 314 Q198 252 242 260 Q286 265 291 319 Q260 292 226 295Z" fill="#302827"/><path d="M197 330 Q236 307 274 330 L269 353 Q236 370 202 352Z" fill="#d9eef1" stroke="#566" stroke-width="3"/><path d="M174 380 Q235 350 300 386 L322 500 H153Z" fill="#547ba0" stroke="#252b34" stroke-width="5"/><circle cx="400" cy="380" r="40" fill="#e8bd96" stroke="#252b34" stroke-width="5"/><path d="M364 370 Q373 327 405 333 Q439 337 442 375 Q416 354 389 357Z" fill="#182535"/><path d="M371 386 Q402 370 431 388 L428 407 Q401 420 375 404Z" fill="#d9eef1"/><rect x="366" y="420" width="76" height="78" rx="18" fill="#e6a83f" stroke="#252b34" stroke-width="5"/><path d="M306 304 q110-64 206 2 v54 q-104 55-206 0Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="409" y="327" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900">마스크 쓰고, 실내로 가자!</text><text x="409" y="350" text-anchor="middle" font-family="Arial" font-size="14">戴好口罩，进室内！ · Mask on—go inside!</text><text x="790" y="470" fill="#ffe66d" font-family="Arial" font-size="38" font-weight="900" transform="rotate(-7 790 470)">WOOOSH—</text></g>
<!-- panel 2 clean air shelter --><g filter="url(#sh)"><rect x="54" y="548" width="972" height="410" rx="22" fill="#dce9e8" stroke="#fff" stroke-width="6"/><rect x="54" y="548" width="972" height="105" rx="22" fill="#5c8792"/><text x="85" y="610" fill="#fff" font-family="Arial" font-size="29" font-weight="900">CLEAN AIR SHELTER · 깨끗한 공기 대피소 · 清洁空气避难所</text><rect x="110" y="694" width="270" height="180" rx="18" fill="#eef6f6" stroke="#334" stroke-width="5"/><circle cx="245" cy="775" r="67" fill="#9dc8d2" stroke="#345" stroke-width="6"/><path d="M245 716 v118 M186 775 h118 M203 733 l84 84 M287 733 l-84 84" stroke="#fff" stroke-width="10"/><text x="245" y="910" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900">HEPA FILTER · PM2.5 ↓</text><!-- volunteer woman --><circle cx="570" cy="733" r="48" fill="#d9a77f" stroke="#252b34" stroke-width="5"/><path d="M527 724 Q535 672 573 678 Q615 682 618 729 Q587 704 555 708Z" fill="#422e29"/><rect x="522" y="778" width="103" height="140" rx="24" fill="#49a178" stroke="#252b34" stroke-width="5"/><path d="M625 804 Q684 780 729 770" stroke="#d9a77f" stroke-width="18" stroke-linecap="round"/><rect x="718" y="738" width="205" height="95" rx="12" fill="#21333d"/><text x="820" y="775" text-anchor="middle" fill="#8ff0b1" font-family="Arial" font-size="25" font-weight="900">PM2.5 12</text><text x="820" y="805" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17">SAFE / 안전 / 安全</text><path d="M588 665 q150-52 327 5 v58 q-165 50-327 0Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="752" y="695" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900">아이와 어르신부터 보호해요.</text><text x="752" y="718" text-anchor="middle" font-family="Arial" font-size="14">先保护孩子和老人。 · Protect the vulnerable first.</text><text x="410" y="895" fill="#547b88" font-family="Arial" font-size="34" font-weight="900">HMMMM—</text></g>
<!-- panel 3 forest buffer restoration --><g filter="url(#sh)"><rect x="54" y="984" width="972" height="410" rx="22" fill="url(#safe)" stroke="#fff" stroke-width="6"/><path d="M54 1195 Q210 1120 390 1190 T720 1170 T1026 1185 V1394 H54Z" fill="#356344"/><g fill="#27543c" stroke="#173729" stroke-width="5"><path d="M125 1225 l55-155 55 155Z"/><path d="M240 1230 l62-180 62 180Z"/><path d="M820 1230 l64-185 64 185Z"/></g><!-- people planting --><circle cx="490" cy="1190" r="45" fill="#d6a27c" stroke="#252b34" stroke-width="5"/><rect x="448" y="1234" width="88" height="120" rx="22" fill="#d76a4d" stroke="#252b34" stroke-width="5"/><path d="M536 1260 l72 58" stroke="#d6a27c" stroke-width="17"/><path d="M600 1308 l42 58" stroke="#6c4d31" stroke-width="10"/><circle cx="700" cy="1215" r="40" fill="#e8bd96" stroke="#252b34" stroke-width="5"/><rect x="663" y="1254" width="76" height="99" rx="18" fill="#e9b73e" stroke="#252b34" stroke-width="5"/><path d="M700 1270 v-80" stroke="#79512e" stroke-width="8"/><path d="M700 1200 q-45-35-50-70 q45 4 52 44 q15-50 58-58 q-5 46-60 84" fill="#61a75d" stroke="#285b35" stroke-width="4"/><rect x="76" y="1005" width="665" height="84" rx="16" fill="#13221b" fill-opacity=".9" stroke="#a5efad" stroke-width="3"/><text x="95" y="1037" fill="#fff" font-family="Arial" font-size="27" font-weight="900">오늘의 대응은 내일의 숲까지 이어진다.</text><text x="95" y="1065" fill="#fff" font-family="Arial" font-size="19">今天的行动延续到明天的森林。 · Today's action grows tomorrow's forest.</text><text x="750" y="1350" fill="#fff4a1" font-family="Arial" font-size="34" font-weight="900">THUMP! RUSTLE—</text></g>
<!-- panel 4 clear horizon --><g filter="url(#sh)"><rect x="54" y="1420" width="972" height="420" rx="22" fill="#9bd5e5" stroke="#fff" stroke-width="6"/><circle cx="870" cy="1515" r="68" fill="#ffe29a"/><path d="M54 1695 Q180 1625 335 1680 T620 1660 T1026 1678 V1840 H54Z" fill="#43845a"/><path d="M54 1765 Q260 1710 450 1758 T790 1745 T1026 1760 V1840 H54Z" fill="#4c9db3"/><!-- family backs detailed --> <circle cx="360" cy="1642" r="45" fill="#ddb08a" stroke="#252b34" stroke-width="5"/><path d="M320 1630 q15-54 48-43 q32 10 37 50" fill="#342a27"/><rect x="320" y="1683" width="90" height="130" rx="22" fill="#557ba0" stroke="#252b34" stroke-width="5"/><circle cx="485" cy="1685" r="36" fill="#e8bd96" stroke="#252b34" stroke-width="5"/><rect x="452" y="1720" width="68" height="93" rx="17" fill="#e9ad3f" stroke="#252b34" stroke-width="5"/><path d="M405 1720 q38 20 58 5" fill="none" stroke="#ddb08a" stroke-width="15"/><rect x="76" y="1442" width="700" height="95" rx="16" fill="#10232b" fill-opacity=".9" stroke="#fff" stroke-width="3"/><text x="96" y="1477" fill="#fff" font-family="Arial" font-size="29" font-weight="900">경고를 기억하면, 미래의 선택이 달라진다.</text><text x="96" y="1507" fill="#fff" font-family="Arial" font-size="19">记住警告，未来的选择就会改变。 · Remember the warning. Change the future.</text><path d="M575 1580 q180-58 360 0 v66 q-180 58-360 0Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="755" y="1613" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900">우리가 지킬게. / 我们会守护。 / We'll protect it.</text><text x="790" y="1810" fill="#fff" font-family="Arial" font-size="34" font-weight="900">SHHHH—</text></g></svg>