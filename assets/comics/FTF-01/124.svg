<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#ffd7a2"/><stop offset=".48" stop-color="#78c5dc"/><stop offset="1" stop-color="#0d5373"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#4fb7d1"/><stop offset="1" stop-color="#063b59"/></linearGradient>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#173c56"/><stop offset="1" stop-color="#071827"/></linearGradient>
 <linearGradient id="lab" x2="0" y2="1"><stop stop-color="#29485b"/><stop offset="1" stop-color="#0c1b27"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".45"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#06121d"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#0b2a43"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #124  미세플라스틱의 길을 거슬러</text>
<text x="930" y="49" fill="#baf4ff" font-family="Arial" font-size="18" font-weight="800">B-27 SOURCE TRACE · 微塑料源头追踪</text>

<!-- PANEL 1: estuary tracking -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="8" fill="url(#dawn)"/>
 <circle cx="647" cy="144" r="54" fill="#ffe9ad"/>
 <path d="M16 342Q150 310 302 340T545 328T762 340V512H16Z" fill="#0f6c86"/>
 <path d="M16 423Q190 395 358 425T762 410V512H16Z" fill="#0b4d6b"/>
 <!-- restored kelp forest -->
 <g stroke="#245d31" stroke-width="8" fill="#69a94e"><path d="M64 498q8-145 56-240q-10 105 38 182q-43-16-94 58Z"/><path d="M135 500q6-132 54-224q-13 96 39 170q-43-9-93 54Z"/><path d="M225 499q5-142 59-235q-18 102 40 177q-46-7-99 58Z"/></g>
 <!-- floating barrier from #123 -->
 <path d="M318 358Q445 337 574 365T724 354" fill="none" stroke="#ffb52d" stroke-width="15"/>
 <g fill="#ffd35d" stroke="#6a4a00" stroke-width="3"><circle cx="350" cy="354" r="14"/><circle cx="430" cy="350" r="14"/><circle cx="510" cy="355" r="14"/><circle cx="590" cy="359" r="14"/><circle cx="670" cy="356" r="14"/></g>
 <!-- drone -->
 <g filter="url(#sh)"><rect x="430" y="210" width="102" height="34" rx="10" fill="#d7ebef" stroke="#142936" stroke-width="5"/><path d="M450 208l-34-26M514 208l34-26" stroke="#142936" stroke-width="7"/><ellipse cx="410" cy="178" rx="34" ry="7" fill="#132a36"/><ellipse cx="554" cy="178" rx="34" ry="7" fill="#132a36"/><circle cx="482" cy="228" r="9" fill="#39ffd5" filter="url(#glow)"/></g>
 <!-- tracked microplastic dots -->
 <g fill="#ff6e79" filter="url(#glow)"><circle cx="324" cy="308" r="7"/><circle cx="370" cy="288" r="6"/><circle cx="404" cy="270" r="6"/><circle cx="444" cy="259" r="5"/><circle cx="492" cy="255" r="4"/></g>
 <path d="M320 307Q380 270 480 250" fill="none" stroke="#ff8b94" stroke-width="4" stroke-dasharray="9 8"/>
 <!-- scientist -->
 <g filter="url(#sh)"><ellipse cx="620" cy="263" rx="40" ry="45" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M583 255q7-34 38-41q34 5 40 44z" fill="#402f2f"/><path d="M579 313q42-25 84 0l33 140H548z" fill="#eaf7fa" stroke="#10212b" stroke-width="5"/><text x="621" y="393" text-anchor="middle" fill="#0b688f" font-family="Arial" font-size="21" font-weight="900">FTF</text><path d="M584 332q-43 13-80 39" stroke="#eaf7fa" stroke-width="23" stroke-linecap="round"/></g>
 <rect x="38" y="101" width="480" height="114" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="278" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="278">차단선은 큰 쓰레기를 막았지만, 센서에는 더 작은 입자가 계속 잡혔다.</tspan><tspan x="278" dy="24" font-size="14">拦截线挡住了大件垃圾，但传感器仍检测到更小的颗粒。</tspan><tspan x="278" dy="22" font-size="13">The barrier stops larger trash, but sensors still detect tiny particles.</tspan></text>
 <rect x="510" y="102" width="224" height="91" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="622" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="622">흐름을 거슬러 올라가!</tspan><tspan x="622" dy="23" font-size="14">逆流追踪！</tspan><tspan x="622" dy="21" font-size="13">Trace it upstream!</tspan></text>
 <text x="42" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">PING!  TRACE!  FOLLOW!</text>
</g>

<!-- PANEL 2: storm drain sampling -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="8" fill="url(#night)"/>
 <rect x="774" y="339" width="746" height="173" fill="#233d47"/>
 <path d="M774 412Q940 385 1085 414T1520 404V512H774Z" fill="#0b5d75"/>
 <!-- concrete drain -->
 <path d="M1160 173h286v219h-286z" fill="#75858d" stroke="#202d33" stroke-width="7"/><path d="M1198 241h212v151h-212z" fill="#101d24" stroke="#27363d" stroke-width="6"/><path d="M1200 361q101 38 210 0" fill="none" stroke="#36aac5" stroke-width="26"/>
 <!-- fibers -->
 <g stroke-linecap="round" fill="none" filter="url(#glow)"><path d="M1254 332q34 24 66 0" stroke="#ff7e9b" stroke-width="5"/><path d="M1311 343q39 19 72-4" stroke="#ffd55c" stroke-width="4"/><path d="M1218 348q29 17 57-2" stroke="#a875ff" stroke-width="4"/></g>
 <!-- two field scientists -->
 <g filter="url(#sh)"><ellipse cx="900" cy="243" rx="40" ry="44" fill="#edb890" stroke="#10212b" stroke-width="5"/><path d="M864 236q8-34 37-41q34 5 40 44z" fill="#25333d"/><path d="M859 297q42-25 84 0l34 151H826z" fill="#173f55" stroke="#10212b" stroke-width="5"/><text x="901" y="378" text-anchor="middle" fill="#eaffff" font-family="Arial" font-size="21" font-weight="900">FTF</text><path d="M939 319q56 16 112 38" stroke="#173f55" stroke-width="23" stroke-linecap="round"/></g>
 <g filter="url(#sh)"><ellipse cx="1063" cy="258" rx="39" ry="44" fill="#f0bd97" stroke="#10212b" stroke-width="5"/><path d="M1027 250q8-34 37-40q33 5 39 43z" fill="#51372d"/><path d="M1023 309q40-24 81 0l31 132H992z" fill="#eaf7fa" stroke="#10212b" stroke-width="5"/><text x="1064" y="387" text-anchor="middle" fill="#0b688f" font-family="Arial" font-size="21" font-weight="900">FTF</text><path d="M1030 333q-23 21-46 42" stroke="#eaf7fa" stroke-width="22" stroke-linecap="round"/></g>
 <!-- sample bottle -->
 <rect x="985" y="358" width="35" height="54" rx="7" fill="#c9fbff" stroke="#12252f" stroke-width="4"/><rect x="992" y="348" width="21" height="12" rx="3" fill="#263c47"/>
 <!-- microscope inset -->
 <circle cx="1425" cy="145" r="68" fill="#f5fbff" stroke="#111" stroke-width="5"/><g fill="#ff6e79"><circle cx="1399" cy="126" r="7"/><circle cx="1437" cy="116" r="5"/><circle cx="1453" cy="150" r="8"/></g><g stroke="#6d59ff" stroke-width="4"><path d="M1387 164q28-25 54 0"/><path d="M1410 142q22-18 43 2"/></g>
 <rect x="801" y="101" width="474" height="114" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1038" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1038">신호는 상류 우수관으로 이어졌다. 샘플에서는 미세섬유와 플라스틱 조각이 함께 나왔다.</tspan><tspan x="1038" dy="24" font-size="14">信号指向上游雨水口，样本中同时发现微纤维与塑料碎片。</tspan><tspan x="1038" dy="22" font-size="13">The trail leads to an upstream drain: microfibers and plastic fragments appear together.</tspan></text>
 <rect x="1291" y="225" width="199" height="92" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="1390" y="256" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1390">원인을 찾았다!</tspan><tspan x="1390" dy="23" font-size="14">找到源头了！</tspan><tspan x="1390" dy="21" font-size="13">We found the source!</tspan></text>
 <text x="808" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="39" font-weight="900">SPLASH!  SAMPLE!  CHECK!</text>
</g>

<!-- PANEL 3: capture filter installation -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="8" fill="url(#lab)"/>
 <rect x="30" y="750" width="718" height="256" fill="#2b4048"/>
 <!-- drain channel and filter cassette -->
 <path d="M390 620h310v250H390z" fill="#73878f" stroke="#15262e" stroke-width="7"/><path d="M430 674h228v196H430z" fill="#0b202a" stroke="#172d36" stroke-width="6"/>
 <rect x="488" y="694" width="112" height="155" rx="9" fill="#d9eef1" stroke="#0f2834" stroke-width="6"/><g stroke="#3b7e91" stroke-width="5"><path d="M506 719h76M506 744h76M506 769h76M506 794h76M506 819h76"/></g><g fill="#ff7384"><circle cx="523" cy="733" r="6"/><circle cx="563" cy="756" r="5"/><circle cx="540" cy="808" r="6"/></g>
 <!-- technician 1 -->
 <g filter="url(#sh)"><ellipse cx="171" cy="675" rx="42" ry="47" fill="#efbd98" stroke="#101f29" stroke-width="5"/><path d="M133 667q8-36 39-43q35 5 42 47z" fill="#3b2c2c"/><path d="M128 728q43-27 87 0l35 173H91z" fill="#eaf7fa" stroke="#101f29" stroke-width="5"/><text x="171" y="817" text-anchor="middle" fill="#0a668d" font-family="Arial" font-size="22" font-weight="900">FTF</text><path d="M213 752q62 19 122 60" stroke="#eaf7fa" stroke-width="25" stroke-linecap="round"/></g>
 <!-- technician 2 -->
 <g filter="url(#sh)"><ellipse cx="321" cy="705" rx="40" ry="45" fill="#e6b187" stroke="#101f29" stroke-width="5"/><path d="M285 696q8-34 36-40q33 5 39 44z" fill="#22323b"/><path d="M281 755q40-24 81 0l32 151H249z" fill="#173e54" stroke="#101f29" stroke-width="5"/><text x="322" y="836" text-anchor="middle" fill="#eaffff" font-family="Arial" font-size="22" font-weight="900">FTF</text><path d="M360 776q41 8 82 18" stroke="#173e54" stroke-width="23" stroke-linecap="round"/></g>
 <!-- tool sparks / install arrows -->
 <g fill="#ffd45e" filter="url(#glow)"><path d="M451 720l13-30 8 29 27-13-16 25 27 7-30 8-3 31-11-27-29 12 18-24-27-8z"/></g>
 <path d="M430 645h210" stroke="#66e7d1" stroke-width="8" stroke-dasharray="18 10"/><path d="M623 631l32 14-32 14z" fill="#66e7d1"/>
 <rect x="41" y="548" width="485" height="115" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="283" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="283">FTF는 우수관에 교체형 미세입자 포집 카세트를 설치하고, 빗물 흐름은 그대로 유지했다.</tspan><tspan x="283" dy="24" font-size="14">FTF安装可更换微粒拦截盒，同时保持雨水正常流动。</tspan><tspan x="283" dy="22" font-size="13">FTF installs a replaceable particle-capture cassette without blocking stormwater flow.</tspan></text>
 <rect x="530" y="558" width="202" height="95" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="631" y="589" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="631">막는 게 아니라 걸러낸다!</tspan><tspan x="631" dy="23" font-size="14">不是堵住，是过滤！</tspan><tspan x="631" dy="21" font-size="13">Filter, don't block!</tspan></text>
 <text x="48" y="976" fill="#fff" stroke="#0b5168" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="40" font-weight="900">CLICK!  LOCK!  FILTER!</text>
</g>

<!-- PANEL 4: result and living kelp -->
<g>
 <rect x="774" y="524" width="746" height="482" rx="8" fill="#dff5f7"/>
 <rect x="798" y="548" width="693" height="236" rx="16" fill="#12364b"/>
 <rect x="820" y="572" width="649" height="190" rx="10" fill="#061f2e"/>
 <g fill="#a9f1f3" font-family="Arial" font-size="22" font-weight="800"><text x="846" y="615">Drain microplastic load   -57%</text><text x="846" y="652">Microfiber capture        +71%</text><text x="846" y="689">Kelp-leaf particle load   -35%</text><text x="846" y="726">Nursery fish activity     +22%</text></g>
 <polyline points="1185,721 1230,693 1275,676 1320,646 1365,628 1418,597" fill="none" stroke="#6fffd2" stroke-width="8"/>
 <!-- healthy kelp + fish -->
 <rect x="800" y="800" width="690" height="206" fill="url(#water)"/>
 <g stroke="#245d31" stroke-width="7" fill="#69a94e"><path d="M830 998q8-120 49-186q-8 76 31 135q-36-8-80 51Z"/><path d="M918 999q3-131 49-188q-12 78 32 139q-37-6-81 49Z"/><path d="M1010 999q4-126 53-187q-13 79 36 143q-41-7-89 44Z"/></g>
 <g fill="#f8cf66" stroke="#7c5b12" stroke-width="2"><path d="M1112 865q34-20 62 0q-30 26-62 0z"/><path d="M1180 914q31-18 57 0q-28 23-57 0z"/><path d="M1246 846q28-16 53 0q-26 22-53 0z"/></g>
 <!-- scientist -->
 <g filter="url(#sh)"><ellipse cx="1390" cy="870" rx="42" ry="47" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M1352 862q8-36 39-43q35 5 42 47z" fill="#402f2f"/><path d="M1347 920q43-26 87 0l39 86h-165z" fill="#eaf7fa" stroke="#10212b" stroke-width="5"/></g>
 <rect x="812" y="792" width="466" height="105" rx="18" fill="#fff" stroke="#111" stroke-width="4"/><text x="1045" y="821" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1045">2주 뒤, 하구 미세플라스틱 유입이 줄고 다시마 잎과 치어 서식지의 부담도 낮아졌다.</tspan><tspan x="1045" dy="24" font-size="14">两周后，河口微塑料输入下降，海带叶片与幼鱼栖息地压力同步减轻。</tspan><tspan x="1045" dy="22" font-size="13">Two weeks later, microplastic inflow falls and pressure on kelp and nursery habitat eases.</tspan></text>
 <rect x="1265" y="798" width="204" height="92" rx="22" fill="#fff4cb" stroke="#111" stroke-width="4"/><text x="1367" y="829" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1367">바다의 길을 지켰어.</tspan><tspan x="1367" dy="23" font-size="14">守住了海洋通道。</tspan><tspan x="1367" dy="21" font-size="13">The ocean path is safer.</tspan></text>
 <text x="1090" y="981" fill="#fff" stroke="#0a5d74" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="38" font-weight="900">FLOW CLEANER · LIFE STRONGER!</text>
</g>
</svg>