<!-- two generations --> <circle cx="245" cy="535" r="42" fill="#d6a079"/><path d="M204 530 Q245 477 288 532 L277 492 Q244 465 212 493Z" fill="#29231f"/><path d="M200 580 Q245 557 290 580 L315 650 H178Z" fill="#355e70"/><circle cx="365" cy="555" r="30" fill="#e7b38b"/><path d="M335 551 Q365 512 397 552 L388 523 Q365 504 342 524Z" fill="#3d2c24"/><path d="M333 590 Q365 575 397 590 L415 650 H318Z" fill="#d27b56"/>
<path d="M390 455 Q570 400 800 445 L784 560 Q580 600 408 548Z" fill="#fff" stroke="#111" stroke-width="7"/><text x="425" y="498" font-family="Arial" font-size="29" fill="#111" font-weight="800">“지구가 조용해진 게 아니라, 우리가 듣기 시작한 거야.”</text><text x="425" y="537" font-family="Arial" font-size="24" fill="#333">地球没有沉默，只是我们终于开始倾听。</text><text x="835" y="600" font-family="Arial" font-size="48" fill="#ffe18a" font-weight="900">WIND…</text></g>
<!-- Earth from space -->
<g filter="url(#sh)"><rect x="64" y="685" width="952" height="520" rx="12" fill="#050913" stroke="#fff" stroke-width="6"/><g fill="#fff"><circle cx="150" cy="770" r="3"/><circle cx="250" cy="840" r="4"/><circle cx="830" cy="760" r="3"/><circle cx="930" cy="920" r="4"/><circle cx="690" cy="820" r="3"/></g><circle cx="540" cy="945" r="205" fill="url(#earth)" stroke="#9be5ff" stroke-width="7"/><path d="M395 870 Q480 805 570 855 T690 945 Q600 975 535 940 T390 975Z" fill="#7ba765"/><path d="M455 1065 Q545 1110 650 1065" fill="none" stroke="#cbdcf2" stroke-width="12" opacity=".85"/><path d="M355 735 Q505 690 685 730 L672 845 Q515 880 372 830Z" fill="#fff" stroke="#111" stroke-width="7"/><text x="390" y="778" font-family="Arial" font-size="29" fill="#111" font-weight="800">“The warning is still here.”</text><text x="390" y="818" font-family="Arial" font-size="24" fill="#333">但警告仍然存在。</text><text x="735" y="1105" font-family="Arial" font-size="50" fill="#b8eaff" font-weight="900">HUMM…</text></g>
<!-- final command / promise -->
<g filter="url(#sh)"><rect x="64" y="1235" width="952" height="445" rx="12" fill="#14202b" stroke="#fff" stroke-width="6"/><rect x="110" y="1285" width="480" height="230" rx="12" fill="#07131d" stroke="#69c9ef" stroke-width="5"/><text x="145" y="1335" font-family="Arial" font-size="27" fill="#ffe06c" font-weight="900">EARTH STATUS</text><path d="M145 1400 L210 1365 275 1392 345 1345 420 1375 500 1328" fill="none" stroke="#73df9d" stroke-width="9"/><path d="M145 1450 L210 1410 280 1442 350 1400 420 1425 500 1388" fill="none" stroke="#ffd064" stroke-width="6"/><text x="145" y="1495" font-family="Arial" font-size="23" fill="#9de8ff">MONITORING CONTINUES</text>
<circle cx="760" cy="1395" r="50" fill="#d7a17b"/><path d="M712 1388 Q760 1327 810 1390 L797 1345 Q758 1315 722 1348Z" fill="#18202a"/><path d="M700 1450 Q760 1418 820 1450 L850 1675 H670Z" fill="#2f5269"/><circle cx="900" cy="1440" r="34" fill="#e4ad84"/><path d="M867 1435 Q900 1392 936 1437 L925 1404 Q899 1382 874 1406Z" fill="#3e2c24"/><path d="M865 1477 Q900 1460 935 1477 L955 1675 H845Z" fill="#bc6d53"/>
<path d="M260 1520 Q475 1465 750 1510 L733 1635 Q490 1675 282 1620Z" fill="#fff" stroke="#111" stroke-width="7"/><text x="300" y="1565" font-family="Arial" font-size="29" fill="#111" font-weight="800">“경고를 기억하자. 그리고 계속 행동하자.”</text><text x="300" y="1605" font-family="Arial" font-size="24" fill="#333">Remember the warning. Keep acting.</text><text x="780" y="1630" font-family="Arial" font-size="47" fill="#7ee6a5" font-weight="900">BEEP</text></g>
<rect x="64" y="1725" width="952" height="135" rx="9" fill="#081018" stroke="#dfe8f0" stroke-width="4"/><text x="92" y="1772" font-family="Arial" font-size="30" fill="#ffe27d" font-weight="900">상황 설명 · 마지막 장면은 끝이 아니라 감시와 행동의 시작이다.</text><text x="92" y="1812" font-family="Arial" font-size="24" fill="#fff">지구의 경고는 사라지지 않는다. 우리가 대응하는 방식이 달라진다.</text><text x="92" y="1848" font-family="Arial" font-size="22" fill="#b9d8ea">The Earth warned us. Now we answer.</text></svg>