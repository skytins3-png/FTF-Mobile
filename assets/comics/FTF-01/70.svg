 <g transform="translate(340 318)"><circle cx="0" cy="0" r="32" fill="#d7a27d" stroke="#1d2b34" stroke-width="4"/><path d="M-31 -6Q0-42 31-6V-27Q0-53-31-25Z" fill="#1f252b"/><rect x="-34" y="36" width="68" height="120" rx="19" fill="#173c56"/></g>
 <g transform="translate(455 303)"><circle cx="0" cy="0" r="34" fill="#e8b58c" stroke="#1d2b34" stroke-width="4"/><path d="M-34 -6Q0-44 34-6V-28Q0-57-34-27Z" fill="#34241e"/><rect x="-37" y="38" width="74" height="125" rx="20" fill="#f4f5f6" stroke="#1d2b34" stroke-width="4"/></g>
 <g transform="translate(565 320)"><circle cx="0" cy="0" r="32" fill="#d7a47d" stroke="#1d2b34" stroke-width="4"/><path d="M-31 -5Q0-40 31-5V-25Q0-52-31-25Z" fill="#111820"/><rect x="-34" y="36" width="68" height="120" rx="19" fill="#16374c"/></g>
 <rect class="narr" x="24" y="22" width="470" height="112" rx="8"/><text x="42" y="54" class="cap med">4. 다음 세대의 산호초를 바다로 돌려보낼 준비</text><text x="42" y="83" class="body small">准备把下一代珊瑚礁送回大海</text><text x="42" y="111" class="body small">Preparing the next generation reef for the sea</text>
 <path class="bubble" d="M205 144h474q18 0 18 18v83q0 18-18 18H501l-24 29 2-29H205q-18 0-18-18v-83q0-18 18-18Z"/><text x="224" y="175" class="body small">이 작은 생명들이 언젠가 거대한 산호숲이 될 거예요.</text><text x="224" y="202" class="body small">这些小生命终会长成巨大的珊瑚森林。</text><text x="224" y="229" class="body small">These tiny lives will become a great reef forest.</text>
 <text x="270" y="465" class="sfx big" fill="#73f2ff">NEXT GENERATION REEF!</text>
</g>
<rect x="20" y="16" width="210" height="60" rx="12" fill="#071a2c" stroke="#fff" stroke-width="3"/><text x="40" y="57" class="label big">FTF-01 #70</text>
