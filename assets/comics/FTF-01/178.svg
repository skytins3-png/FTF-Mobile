<g transform="translate(550 810)" filter="url(#sh)"><rect x="-120" y="-125" width="240" height="250" rx="18" fill="#dce8ea" stroke="#244956" stroke-width="7"/><rect x="-94" y="-94" width="188" height="58" rx="8" fill="#123747"/><text x="0" y="-69" text-anchor="middle" class="tiny" fill="#b8f6ff">B-ZONE · PERSONAL QR</text><rect x="-35" y="-10" width="70" height="120" rx="20" fill="#e9f8fb" stroke="#315a67" stroke-width="5"/><rect x="-18" y="18" width="36" height="36" fill="#17323d"/><path d="M-14 22h8v8h-8zm18 0h10v10H4zm-18 18h12v12h-12zm20 2h8v8H6z" fill="#fff"/></g><text x="42" y="990" class="sfx">QUARANTINE!  TOUCHLESS!  PERSONAL QR!  NO CROSSING!</text></g>
<!-- P4 -->
<g><rect x="774" y="524" width="746" height="484" rx="12" fill="#173f59"/><rect x="798" y="544" width="666" height="111" rx="18" class="box"/><text x="1131" y="573" text-anchor="middle" class="t cap"><tspan x="1131">48시간·10회 휴게 검증: 공용 물병 0, 구역간 물병 이동 0, 급수대·개인병 접촉면 48/48 음성.</tspan><tspan x="1131" dy="25" font-size="14">48小时10次休息验证：共用水瓶0，跨区水瓶0，饮水站与个人瓶接触面48/48阴性。</tspan><tspan x="1131" dy="22" font-size="13">48 h / 10 breaks: shared bottles 0, cross-zone bottles 0, hydration surfaces 48/48 NEG.</tspan></text>
<g transform="translate(1145 808)" filter="url(#sh)"><rect x="-285" y="-112" width="570" height="224" rx="20" fill="#071d2a" stroke="#7cd8e8" stroke-width="6"/><text x="0" y="-72" text-anchor="middle" class="t" fill="#fff" font-size="25" font-weight="900">HUMAN CONTACT LOOP — FINAL AUDIT</text><text x="-235" y="-23" class="t" fill="#b9f5ff" font-size="20" font-weight="900">SHARED BOTTLES</text><text x="235" y="-23" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">0</text><text x="-235" y="22" class="t" fill="#b9f5ff" font-size="20" font-weight="900">CROSS-ZONE BOTTLES</text><text x="235" y="22" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">0</text><text x="-235" y="67" class="t" fill="#b9f5ff" font-size="20" font-weight="900">HYDRATION SWABS</text><text x="235" y="67" text-anchor="end" class="t" fill="#75efae" font-size="25" font-weight="900">48 / 48 NEG</text></g>
<g transform="translate(900 925)" filter="url(#sh)"><ellipse cy="-55" rx="28" ry="34" fill="#d9a37f" stroke="#102631" stroke-width="4"/><rect x="-46" y="-17" width="92" height="86" rx="18" fill="#e38b35" stroke="#102631" stroke-width="4"/></g><path d="M1210 900h250q13 0 13 13v52q0 13-13 13h-120l-25 20 6-20h-111q-13 0-13-13v-52q0-13 13-13z" class="bub"/><text x="1335" y="927" text-anchor="middle" class="t" font-size="14" font-weight="900"><tspan x="1335">이제 일도, 휴식도 같은 생물보안 경계 안에서 움직여.</tspan><tspan x="1335" dy="19" font-size="11">工作和休息都遵守同一条生物安全边界。 / Work and breaks now obey one boundary.</tspan></text><text x="800" y="990" class="sfx">10/10 PASS!  48/48 NEG!  HUMAN LOOP CLOSED!</text></g></svg>