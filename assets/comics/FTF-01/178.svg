<g transform="translate(1190 350)" filter="url(#sh)"><rect x="-48" y="-80" width="96" height="160" rx="26" fill="#e9f8fb" stroke="#263b43" stroke-width="6"/><rect x="-25" y="-101" width="50" height="26" rx="7" fill="#397b93"/><circle cx="33" cy="-82" r="12" fill="#ff7169"/><path d="M42-88q45-25 78-8" fill="none" stroke="#ff7169" stroke-width="8"/></g>
<g transform="translate(1400 358)" filter="url(#sh)"><rect x="-90" y="-80" width="180" height="160" rx="13" fill="#edf3f4" stroke="#263b43" stroke-width="5"/><text x="0" y="-55" text-anchor="middle" class="tiny">W-8 SWAB</text><text x="-68" y="-15" class="tiny">BODY</text><text x="70" y="-15" text-anchor="end" class="tiny" fill="#18765b">NEG</text><text x="-68" y="20" class="tiny">CAP</text><text x="70" y="20" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text><text x="-68" y="55" class="tiny">LOOP</text><text x="70" y="55" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text></g><text x="800" y="490" class="sfx">STOP!  SWAB!  CAP TRACE+!  LOOP TRACE+!</text></g>
<!-- P3 -->
<g><rect x="16" y="524" width="746" height="484" rx="12" fill="#afc1c4"/><rect x="16" y="823" width="746" height="185" fill="url(#floor)"/><rect x="40" y="544" width="665" height="111" rx="18" class="box"/><text x="372" y="573" text-anchor="middle" class="t cap"><tspan x="372">W-8을 격리한다. A/B 구역마다 비접촉 급수대와 개인 QR 물병을 배치해 병 자체가 경계를 넘지 않게 한다.</tspan><tspan x="372" dy="25" font-size="14">隔离W-8。A/B区分别设置无接触饮水站与个人QR水瓶，水瓶不得跨区。</tspan><tspan x="372" dy="22" font-size="13">W-8 is quarantined. Each zone gets touchless hydration and personal QR bottles that never cross boundaries.</tspan></text>
