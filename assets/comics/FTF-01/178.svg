<g transform="translate(398 330)" filter="url(#sh)"><rect x="-54" y="-88" width="108" height="176" rx="30" fill="#dff5fb" stroke="#17323d" stroke-width="6"/><rect x="-28" y="-108" width="56" height="28" rx="8" fill="#397b93"/><text x="0" y="12" text-anchor="middle" class="tiny">W-8</text></g><text x="42" y="490" class="sfx">BREAK!  REACH W-8!  SHARED TOUCH!</text></g>
<!-- P2 -->
<g><rect x="774" y="84" width="746" height="428" rx="12" fill="#9db1b7"/><rect x="774" y="355" width="746" height="157" fill="url(#floor)"/><rect x="798" y="103" width="666" height="111" rx="18" class="box"/><text x="1131" y="132" text-anchor="middle" class="t cap"><tspan x="1131">게이트 요원이 즉시 멈춘다. 병 몸통은 음성, 뚜껑 홈과 손잡이 고리에서 TRACE+가 검출된다.</tspan><tspan x="1131" dy="25" font-size="14">门区人员立即制止。瓶身阴性，但瓶盖沟槽与提环检测出TRACE+。</tspan><tspan x="1131" dy="22" font-size="13">The gate officer stops the handoff. Bottle body NEG; cap groove and carry loop are TRACE+.</tspan></text>
