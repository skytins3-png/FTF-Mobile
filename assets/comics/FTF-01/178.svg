<rect width="1536" height="1024" fill="#061019"/><rect x="12" y="12" width="1512" height="60" rx="12" fill="#174c65"/><text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #178  마지막 생활 접촉점 — 공용 물병을 끊는다</text><text x="1000" y="49" class="t" fill="#d7f5ff" font-size="16" font-weight="800">HYDRATION TRACE · ZONE STATIONS · NO SHARED BOTTLES</text>
<!-- P1 -->
<g><rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/><rect x="16" y="355" width="746" height="157" fill="url(#floor)"/><rect x="40" y="103" width="664" height="111" rx="18" class="box"/><text x="372" y="132" text-anchor="middle" class="t cap"><tspan x="372">11:48. PPE까지 분리됐지만 휴게 직전, 작업자 두 명이 공용 냉수대의 같은 물병 W-8을 잡는다.</tspan><tspan x="372" dy="25" font-size="14">11:48，PPE已分区，但休息前两名工人伸手拿同一只公共水瓶W-8。</tspan><tspan x="372" dy="22" font-size="13">11:48 — PPE is separated, but two workers reach for the same shared bottle W-8 before break.</tspan></text>
