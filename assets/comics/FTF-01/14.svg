<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#17314a"/><stop offset="1" stop-color="#07111d"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#3b7899"/><stop offset="1" stop-color="#112c3d"/></linearGradient></defs><rect width="1080" height="1920" fill="#081018"/><rect x="28" y="28" width="1024" height="1145" rx="28" fill="url(#sky)" stroke="#cfe6f5" stroke-width="6"/><g fill="#142332"><rect x="80" y="300" width="190" height="590"/><rect x="310" y="250" width="220" height="640"/><rect x="580" y="340" width="180" height="550"/><rect x="800" y="280" width="190" height="610"/></g><g fill="#93bfd5" opacity=".5"><rect x="115" y="350" width="38" height="80"/><rect x="180" y="350" width="38" height="80"/><rect x="355" y="305" width="44" height="85"/><rect x="438" y="305" width="44" height="85"/><rect x="625" y="395" width="40" height="80"/><rect x="845" y="335" width="42" height="82"/></g><path d="M28 690H1052V1173H28Z" fill="url(#water)"/><g stroke="#9dd7f1" stroke-width="7" fill="none" opacity=".8"><path d="M60 760q100-45 200 0t200 0t200 0t200 0t170 0"/><path d="M45 900q100-45 200 0t200 0t200 0t200 0t180 0"/></g><g transform="translate(210 650)"><path d="M0 270q90-80 260 0l-45 105H40z" fill="#df6d35" stroke="#ffc7a8" stroke-width="5"/><circle cx="95" cy="170" r="40" fill="#c98b66"/><path d="M55 170q38-57 78 0v-42q-38-40-78 0z" fill="#1f1d20"/><path d="M45 220q50-45 103 0l16 120H28z" fill="#f0c44e"/><circle cx="200" cy="190" r="34" fill="#d6a17d"/><path d="M165 190q33-49 68 0v-36q-33-34-68 0z" fill="#3a2925"/><path d="M160 235q42-36 85 0l15 100H148z" fill="#4d6177"/></g><g transform="translate(595 600)"><circle cx="92" cy="95" r="42" fill="#b97b59"/><path d="M48 95q42-62 88 0V47q-42-42-88 2z" fill="#1f1b1d"/><path d="M38 158q55-48 112 0l20 190H18z" fill="#e65346"/><path d="M42 210l-65 100M150 210l65 105" stroke="#b97b59" stroke-width="22" stroke-linecap="round"/></g><rect x="64" y="70" width="600" height="142" rx="20" fill="#101821e8" stroke="#b9dcf0" stroke-width="3"/><text x="95" y="118" fill="#bfe6fb" font-family="Arial" font-weight="700" font-size="34">SCENE 14 · FLASH FLOOD</text><text x="95" y="165" fill="#fff" font-family="Arial" font-size="28">지하차도 침수 · 地下通道被淹</text><path d="M605 395h380v235H605z" fill="#fff" stroke="#111" stroke-width="6" rx="22"/><path d="M663 630l-48 72 16-90z" fill="#fff" stroke="#111" stroke-width="5"/><text x="636" y="455" font-family="Arial" font-size="31" font-weight="700">“손을 잡아요!”</text><text x="636" y="502" font-family="Arial" font-size="28">抓住我的手！</text><text x="636" y="548" font-family="Arial" font-size="25">“Take my hand!”</text><text x="720" y="935" fill="#d9f4ff" font-family="Arial" font-size="62" font-weight="900" transform="rotate(-8 720 935)">ROOOAR!</text><rect x="52" y="1210" width="976" height="265" rx="26" fill="#101925" stroke="#d5e6f6" stroke-width="4"/><text x="88" y="1275" fill="#9ed5ff" font-family="Arial" font-weight="700" font-size="30">상황 설명 · NARRATION</text><text x="88" y="1336" fill="#fff" font-family="Arial" font-size="34">한 시간의 폭우가 도로를 강으로 바꾸었다.</text><text x="88" y="1387" fill="#fff" font-family="Arial" font-size="32">구조대는 보트를 띄워 고립된 시민을 끌어냈다.</text><text x="88" y="1437" fill="#b8c8d8" font-family="Arial" font-size="26">暴雨把道路变成河流。The street becomes a river.</text><rect x="52" y="1510" width="976" height="330" rx="26" fill="#10161c" stroke="#6fc7ef" stroke-width="4"/><text x="86" y="1580" fill="#8edcff" font-family="Arial" font-weight="700" font-size="29">지구의 경고 · EARTH’S WARNING</text><text x="86" y="1643" fill="#fff" font-family="Arial" font-size="35">“비는 내렸지만, 재난은 우리가 만든 조건을 따라왔다.”</text><text x="86" y="1700" fill="#d5f0fb" font-family="Arial" font-size="30">“雨落下了，灾难却沿着我们制造的条件而来。”</text><text x="86" y="1757" fill="#d5f0fb" font-family="Arial" font-size="28">“Rain fell. Disaster followed the conditions we built.”</text></svg>