 <g transform="translate(842 458)" filter="url(#sh)"><ellipse cy="-59" rx="26" ry="31" fill="#d1a07b" stroke="#102a35" stroke-width="4"/><path d="M-25-69q9-25 26-25q21 4 26 25l-17-8q-17 6-35 8" fill="#51362a"/><rect x="-39" y="-22" width="78" height="93" rx="16" fill="#48a98f" stroke="#102a35" stroke-width="4"/></g>
 <rect x="798" y="103" width="663" height="111" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1130" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1130">FR-2 호스 안쪽 생물막이 K-42의 F-7과 99.2% 일치. 역류방지 밸브 고장이 오염을 되돌려 보냈다.</tspan><tspan x="1130" dy="25" font-size="14">FR-2软管生物膜与K-42 F-7吻合99.2%，故障止回阀造成污染回流。</tspan><tspan x="1130" dy="23" font-size="13">The hose biofilm matches K-42; a failed check valve caused contaminated backflow.</tspan></text>
 <text x="815" y="493" font-family="Arial" font-size="24" font-weight="1000" fill="#16394c">SWAB! MATCH! ROOT CAUSE CONFIRMED!</text>
</g>

