 <rect x="798" y="548" width="665" height="124" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1130" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1130">48시간 뒤 관련 선박·FR-2 모두 음성. 이제 공용 호스를 없애고 ‘선박 1척-전용 세척라인 1개’로 바꾼다.</tspan><tspan x="1130" dy="25" font-size="14">48小时后相关船舶与FR-2全部阴性，并改为“一船一专用冲洗管线”。</tspan><tspan x="1130" dy="23" font-size="13">All linked tests turn negative; shared hoses are replaced by dedicated one-vessel lines.</tspan></text>
 <path d="M840 680h287q16 0 16 16v62q0 16-16 16H967l-29 25 7-25H840q-16 0-16-16v-62q0-16 16-16z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="988" y="712" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="988">재검사 전부 음성. 공유 경로를 없앤다!</tspan><tspan x="988" dy="23" font-size="13">复检全部阴性，取消共用污染路径！</tspan></text>
 <text x="812" y="986" font-family="Arial" font-size="24" font-weight="1000" fill="#1b694b">VERIFY! ZERO RETURN! BREAK THE SHARED PATH!</text>
</g>
