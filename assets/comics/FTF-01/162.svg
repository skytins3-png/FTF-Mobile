 <g transform="translate(343 430)" filter="url(#sh)"><ellipse cy="-68" rx="29" ry="35" fill="#c9906d" stroke="#0e2430" stroke-width="5"/><path d="M-28-79q11-27 29-28q23 4 29 28l-18-8q-20 7-40 8" fill="#222"/><rect x="-44" y="-29" width="88" height="112" rx="18" fill="#f0b43b" stroke="#0e2430" stroke-width="5"/><path d="M-34-5l-79 20M34-5l75 7" stroke="#f0b43b" stroke-width="19" stroke-linecap="round"/></g>
 <rect x="39" y="104" width="675" height="113" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="376" y="135" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="376">K-41·K-44·K-47의 정비 동선을 겹치자 세 척 모두 같은 M-3 기지의 세척 카트 FR-2를 썼다.</tspan><tspan x="376" dy="25" font-size="14">叠加三艘船的维护轨迹后，全部指向M-3维修站的共用冲洗设备FR-2。</tspan><tspan x="376" dy="23" font-size="13">Maintenance routes converge on one shared flushing rig: FR-2 at depot M-3.</tspan></text>
 <text x="50" y="493" font-family="Arial" font-size="24" font-weight="1000" fill="#ffe568">TRACE! THREE SHIPS — ONE SERVICE RIG!</text>
</g>

<!-- PANEL 2 -->
<g>
