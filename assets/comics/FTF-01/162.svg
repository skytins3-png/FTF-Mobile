 <rect x="39" y="548" width="668" height="124" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="373" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="373">M-3 기지를 즉시 격리한다. FR-2는 분해·고온세척·UV 처리하고 역류방지 밸브를 새것으로 교체한다.</tspan><tspan x="373" dy="25" font-size="14">立即隔离M-3维修站，FR-2拆解、高温清洗、UV处理并更换止回阀。</tspan><tspan x="373" dy="23" font-size="13">Depot M-3 is quarantined; FR-2 is stripped, heat-cleaned, UV-treated and rebuilt.</tspan></text>
 <path d="M408 680h289q16 0 16 16v70q0 16-16 16H527l-31 27 8-27H408q-16 0-16-16v-70q0-16 16-16z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="557" y="711" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="557">M-3 사용 중지! FR-2 전부 분해한다!</tspan><tspan x="557" dy="24" font-size="13">M-3暂停使用！FR-2全部拆解！</tspan></text>
 <text x="51" y="988" font-family="Arial" font-size="24" font-weight="1000" fill="#ffe36d">LOCKDOWN! STRIP! HEAT! UV!</text>
</g>

