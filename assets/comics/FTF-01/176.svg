<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 176 identifies a shared emergency access card as the last cross-zone touchpoint and replaces it with zone-bound biometric access">
<defs>
 <linearGradient id="storm" x2="0" y2="1"><stop stop-color="#07131d"/><stop offset=".55" stop-color="#294b5b"/><stop offset="1" stop-color="#7b929a"/></linearGradient>
 <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#c7d2d4"/><stop offset="1" stop-color="#607680"/></linearGradient>
 <linearGradient id="lab" x2="1" y2="1"><stop stop-color="#e7eef0"/><stop offset="1" stop-color="#8faab1"/></linearGradient>
 <linearGradient id="gate" x2="0" y2="1"><stop stop-color="#244b5a"/><stop offset="1" stop-color="#091a22"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".42"/></filter>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.t{font-family:Arial,'Malgun Gothic',sans-serif}.cap{font-size:17px;font-weight:900;fill:#10232b}.tiny{font-family:Arial,'Malgun Gothic',sans-serif;font-size:12px;font-weight:900}.box{fill:#fff;stroke:#17323d;stroke-width:4}.bub{fill:#fff;stroke:#10242d;stroke-width:4}.sfx{font-family:Arial,'Malgun Gothic',sans-serif;font-size:22px;font-weight:1000;fill:#fff26d;stroke:#081820;stroke-width:2;paint-order:stroke}.hud{font-family:Arial,'Malgun Gothic',sans-serif;font-size:14px;font-weight:900;fill:#a8f6ff}</style>
</defs>
<rect width="1536" height="1024" fill="#061019"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#173f59"/>
<text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #176  마지막 공용 접촉점 — 비상 출입카드 C-9</text>
<text x="1010" y="49" class="t" fill="#d7f5ff" font-size="16" font-weight="800">ACCESS TRACE · CARD LOCK · BIOMETRIC ZONE BINDING</text>
<!-- PANEL 1 -->
<g><rect x="16" y="84" width="746" height="428" rx="12" fill="url(#storm)"/><rect x="16" y="352" width="746" height="160" fill="url(#deck)"/><g opacity=".5" stroke="#d8eef4" stroke-width="3"><path d="M52 91L4 184M117 91L66 188M183 91L129 193M639 91l-52 104M704 91l-49 102"/></g>
<rect x="40" y="103" width="664" height="111" rx="18" class="box"/><text x="372" y="132" text-anchor="middle" class="t cap"><tspan x="372">06:07. 통신 장비 분리 후, B구역 비상문이 자동 잠긴다. 작업자는 벽걸이 공용 출입카드 C-9를 집어 든다.</tspan><tspan x="372" dy="25" font-size="14">06:07，通信设备分区后，B区应急门自动上锁。工人拿起墙上的共用门禁卡C-9。</tspan><tspan x="372" dy="22" font-size="13">06:07 — the B-zone emergency door auto-locks; a worker reaches for shared access card C-9.</tspan></text>
<!-- gate --> <g transform="translate(520 330)" filter="url(#sh)"><rect x="-72" y="-93" width="144" height="187" rx="11" fill="url(#gate)" stroke="#06141b" stroke-width="6"/><rect x="-47" y="-63" width="94" height="62" rx="7" fill="#103343" stroke="#6d9dac" stroke-width="3"/><text x="0" y="-38" text-anchor="middle" class="hud">B-ZONE</text><text x="0" y="-17" text-anchor="middle" class="hud" fill="#ff827a">LOCKED</text><circle cx="0" cy="44" r="26" fill="#c8433e" stroke="#ffb4ad" stroke-width="4"/></g>
<!-- worker --> <g transform="translate(247 411)" filter="url(#sh)"><ellipse cy="-101" rx="31" ry="38" fill="#d5a07c" stroke="#102631" stroke-width="4"/><path d="M-30-113q8-28 31-31q24 2 31 27l-18-6q-22 1-44 10" fill="#242a2f"/><circle cx="-11" cy="-101" r="3"/><circle cx="12" cy="-101" r="3"/><rect x="-53" y="-57" width="106" height="132" rx="22" fill="#e38b35" stroke="#102631" stroke-width="4"/><path d="M-42-18h84" stroke="#f9d56d" stroke-width="12"/><path d="M45-27l118-21" stroke="#e38b35" stroke-width="20" stroke-linecap="round"/><path d="M-27 74l-8 76M27 74l9 76" stroke="#273b43" stroke-width="23"/></g>
<!-- card C9 --> <g transform="translate(420 341) rotate(-10)" filter="url(#sh)"><rect x="-42" y="-28" width="84" height="56" rx="8" fill="#f1d457" stroke="#17252b" stroke-width="5"/><rect x="-31" y="-17" width="23" height="21" rx="3" fill="#263a43"/><text x="14" y="2" text-anchor="middle" class="tiny">C-9</text><text x="0" y="18" text-anchor="middle" class="tiny" font-size="9">EMERGENCY</text></g>
<path d="M60 236h302q14 0 14 14v61q0 14-14 14H226l-25 23 6-23H60q-14 0-14-14v-61q0-14 14-14z" class="bub"/><text x="211" y="263" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="211">이 카드만 찍고 바로 들어갈게.</tspan><tspan x="211" dy="20" font-size="12">刷一下这张卡就进去。 / One tap and I'm through.</tspan></text><text x="43" y="490" class="sfx">LOCK!  GRAB C-9!  EMERGENCY ACCESS!</text></g>
<!-- PANEL 2 -->
<g><rect x="774" y="84" width="746" height="428" rx="12" fill="url(#lab)"/><rect x="774" y="354" width="746" height="158" fill="url(#deck)"/><path d="M1148 210v302" stroke="#f0d44f" stroke-width="9" stroke-dasharray="22 12"/>
<rect x="798" y="103" width="666" height="111" rx="18" class="box"/><text x="1131" y="132" text-anchor="middle" class="t cap"><tspan x="1131">카드 리더가 C-9를 읽기 전에 경계 센서가 정지시킨다. 앞면은 음성, 가장자리와 목걸이 끈에서 TRACE+가 검출된다.</tspan><tspan x="1131" dy="25" font-size="14">门禁读卡前，边界传感器先拦截C-9。卡面阴性，但卡边和挂绳检测出TRACE+。</tspan><tspan x="1131" dy="22" font-size="13">Before the reader accepts C-9, the boundary sensor stops it: face NEG, edge and lanyard TRACE+.</tspan></text>
<!-- inspector --> <g transform="translate(925 419)" filter="url(#sh)"><ellipse cy="-92" rx="29" ry="36" fill="#e0ad88" stroke="#102631" stroke-width="4"/><path d="M-29-104q9-24 29-27q22 2 29 24l-15-5q-20 2-43 8" fill="#392d2a"/><rect x="-49" y="-46" width="98" height="118" rx="19" fill="#2f8d83" stroke="#102631" stroke-width="4"/><path d="M37-13l120-24" stroke="#2f8d83" stroke-width="18" stroke-linecap="round"/><path d="M-24 70v65M24 70v65" stroke="#263941" stroke-width="21"/></g>
<!-- swab/card --> <g transform="translate(1106 337)" filter="url(#sh)"><rect x="-58" y="-42" width="116" height="84" rx="10" fill="#f1d457" stroke="#263b43" stroke-width="5"/><text x="0" y="-9" text-anchor="middle" class="tiny" font-size="18">C-9</text><text x="0" y="13" text-anchor="middle" class="tiny">EDGE SWAB</text><path d="M-74-52l150 104" stroke="#f5f5f5" stroke-width="9"/><circle cx="76" cy="52" r="9" fill="#ff6e65" filter="url(#gl)"/></g>
<!-- result screen --> <g transform="translate(1352 348)" filter="url(#sh)"><rect x="-102" y="-76" width="204" height="152" rx="14" fill="#edf3f4" stroke="#263b43" stroke-width="5"/><text x="0" y="-53" text-anchor="middle" class="tiny">C-9 CONTACT SWAB</text><text x="-75" y="-15" class="tiny">FACE</text><rect x="-19" y="-28" width="70" height="20" rx="8" fill="#b9dccf"/><text x="82" y="-13" text-anchor="end" class="tiny" fill="#1d775e">NEG</text><text x="-75" y="21" class="tiny">EDGE</text><rect x="-19" y="8" width="70" height="20" rx="8" fill="#ff786d" filter="url(#gl)"/><text x="82" y="23" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text><text x="-75" y="57" class="tiny">STRAP</text><rect x="-19" y="44" width="70" height="20" rx="8" fill="#ff786d" filter="url(#gl)"/><text x="82" y="59" text-anchor="end" class="tiny" fill="#c5302c">TRACE+</text></g>
<path d="M802 234h294q14 0 14 14v62q0 14-14 14H981l-27 23 7-23H802q-14 0-14-14v-62q0-14 14-14z" class="bub"/><text x="949" y="260" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="949">카드보다 손이 닿는 가장자리와 끈이 문제야.</tspan><tspan x="949" dy="20" font-size="12">问题在卡边和挂绳。 / The edge and strap are the route.</tspan></text><text x="801" y="490" class="sfx">BEEP!  STOP C-9!  EDGE TRACE+!  STRAP TRACE+!</text></g>
<!-- PANEL 3 -->
<g><rect x="16" y="524" width="746" height="484" rx="12" fill="#9eb4ba"/><rect x="16" y="821" width="746" height="187" fill="url(#deck)"/>
<rect x="40" y="544" width="665" height="111" rx="18" class="box"/><text x="372" y="573" text-anchor="middle" class="t cap"><tspan x="372">C-9는 즉시 격리한다. 공용 카드함을 제거하고 A/B 구역별 생체인증 + 구역고정 권한으로 바꾼다.</tspan><tspan x="372" dy="25" font-size="14">立即隔离C-9，撤掉共用卡盒，改为A/B区独立生物识别与区域绑定权限。</tspan><tspan x="372" dy="22" font-size="13">C-9 is quarantined; the shared card rack is removed and access becomes biometric and zone-bound.</tspan></text>
<!-- left biometric gate --> <g transform="translate(230 798)" filter="url(#sh)"><rect x="-93" y="-112" width="186" height="222" rx="18" fill="#dce8ea" stroke="#244956" stroke-width="7"/><rect x="-64" y="-82" width="128" height="65" rx="9" fill="#0f3545"/><text x="0" y="-56" text-anchor="middle" class="hud">A-ZONE BIO ID</text><text x="0" y="-34" text-anchor="middle" class="hud" fill="#75f0b5">BOUND</text><circle cx="0" cy="32" r="39" fill="#f5f8f8" stroke="#4f727f" stroke-width="4"/><path d="M-18 32q18-27 36 0M-14 43q14-17 28 0M0 2v55" fill="none" stroke="#32a77a" stroke-width="5"/></g>
<!-- right biometric gate --> <g transform="translate(546 798)" filter="url(#sh)"><rect x="-93" y="-112" width="186" height="222" rx="18" fill="#dce8ea" stroke="#244956" stroke-width="7"/><rect x="-64" y="-82" width="128" height="65" rx="9" fill="#0f3545"/><text x="0" y="-56" text-anchor="middle" class="hud">B-ZONE BIO ID</text><text x="0" y="-34" text-anchor="middle" class="hud" fill="#75f0b5">BOUND</text><circle cx="0" cy="32" r="39" fill="#f5f8f8" stroke="#4f727f" stroke-width="4"/><path d="M-18 32q18-27 36 0M-14 43q14-17 28 0M0 2v55" fill="none" stroke="#32a77a" stroke-width="5"/></g>
<!-- quarantine case --> <g transform="translate(383 925)" filter="url(#sh)"><rect x="-83" y="-37" width="166" height="74" rx="12" fill="#e65d55" stroke="#3d2020" stroke-width="5"/><text x="0" y="-7" text-anchor="middle" class="tiny" fill="#fff">QUARANTINE</text><text x="0" y="15" text-anchor="middle" class="tiny" fill="#fff">C-9 SEALED</text></g>
<text x="45" y="987" class="sfx">SEAL C-9!  REMOVE CARD RACK!  BIO-ID ONLY!</text></g>
<!-- PANEL 4 -->
<g><rect x="774" y="524" width="746" height="484" rx="12" fill="#78939c"/><rect x="774" y="823" width="746" height="185" fill="url(#deck)"/>
<rect x="798" y="544" width="666" height="111" rx="18" class="box"/><text x="1131" y="573" text-anchor="middle" class="t cap"><tspan x="1131">12시간 비상훈련 10회. 공용 카드 0, 구역 밖 권한 0, 접촉면 36/36 음성. 물건 없는 출입 통제가 완성된다.</tspan><tspan x="1131" dy="25" font-size="14">12小时内10次应急演练：共用卡0、跨区权限0、接触面36/36阴性。无共享物门禁完成。</tspan><tspan x="1131" dy="22" font-size="13">Ten emergency drills in 12 hours: shared cards 0, cross-zone privileges 0, surfaces 36/36 NEG.</tspan></text>
<!-- command center --> <g transform="translate(1138 781)" filter="url(#sh)"><rect x="-244" y="-95" width="488" height="190" rx="18" fill="#102832" stroke="#081219" stroke-width="7"/><text x="0" y="-63" text-anchor="middle" class="hud" font-size="18">ACCESS CONTROL — LIVE VALIDATION</text><line x1="-210" y1="-39" x2="210" y2="-39" stroke="#47717f" stroke-width="3"/><text x="-195" y="-8" class="hud">SHARED CARD</text><text x="190" y="-8" text-anchor="end" class="hud" fill="#6df1b5">0</text><text x="-195" y="22" class="hud">CROSS-ZONE PRIVILEGE</text><text x="190" y="22" text-anchor="end" class="hud" fill="#6df1b5">0</text><text x="-195" y="52" class="hud">CONTACT SURFACES</text><text x="190" y="52" text-anchor="end" class="hud" fill="#6df1b5">36 / 36 NEG</text><text x="-195" y="82" class="hud">EMERGENCY DRILLS</text><text x="190" y="82" text-anchor="end" class="hud" fill="#6df1b5">10 / 10 PASS</text></g>
<!-- supervisor --> <g transform="translate(856 909)" filter="url(#sh)"><ellipse cy="-93" rx="29" ry="36" fill="#d9a481" stroke="#102631" stroke-width="4"/><path d="M-28-105q8-24 28-27q22 2 29 24l-16-5q-20 1-41 8" fill="#282d31"/><rect x="-48" y="-47" width="96" height="119" rx="19" fill="#315d74" stroke="#102631" stroke-width="4"/><path d="M-24 70v64M24 70v64" stroke="#263941" stroke-width="21"/></g>
<!-- two workers --> <g transform="translate(1430 905)" filter="url(#sh)"><ellipse cy="-90" rx="28" ry="35" fill="#c99372" stroke="#102631" stroke-width="4"/><rect x="-47" y="-45" width="94" height="113" rx="19" fill="#2f8d83" stroke="#102631" stroke-width="4"/><path d="M-23 67v66M23 67v66" stroke="#263941" stroke-width="20"/></g>
<path d="M803 675h235q14 0 14 14v61q0 14-14 14H925l-26 23 6-23H803q-14 0-14-14v-61q0-14 14-14z" class="bub"/><text x="920" y="702" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="920">이제 출입에도 넘겨줄 물건이 없다.</tspan><tspan x="920" dy="20" font-size="12">现在连门禁也没有可传递的物件。 / Nothing physical needs to cross.</tspan></text><text x="803" y="987" class="sfx">10/10 PASS!  36/36 NEG!  ZERO SHARED ACCESS!</text></g>
</svg>