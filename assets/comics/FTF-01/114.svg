 <rect x="1218" y="102" width="278" height="120" rx="28" fill="#fff" stroke="#111" stroke-width="4"/><text x="1357" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1357">센서 고정 완료!</tspan><tspan x="1357" dy="23">탄소·유속·생물 이동을 함께 추적해.</tspan><tspan x="1357" dy="21" font-size="13">同步追踪碳、流速与生物迁移。</tspan><tspan x="1357" dy="20" font-size="13">Track carbon, current and wildlife movement.</tspan></text>
 <text x="983" y="477" fill="#fff" stroke="#075270" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="47" font-weight="900" font-style="italic">ANCHOR!  CONNECT!  GROW!</text>
</g>

