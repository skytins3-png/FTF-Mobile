 <text x="45" y="482" fill="#fff" stroke="#084461" stroke-width="5" paint-order="stroke" font-family="Arial" font-size="37" font-weight="900" font-style="italic">MAP IT!  LINK IT!  RESTORE IT!</text>
</g>

