<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc"><title id="title">FTF-01 #66 — 복원의 다음 단계</title><desc id="desc">Four-panel cinematic manga continuation. Researchers monitor stable sea temperature and coral health, divers expand coral restoration, marine life returns, and the team promises continued protection. Korean Chinese English captions and story-specific reef imagery.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#35bce8"/><stop offset="1" stop-color="#063b65"/></linearGradient><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd27b"/><stop offset="1" stop-color="#ef7c5c"/></linearGradient><style>.p{stroke:#071d31;stroke-width:10}.b{fill:#fff;stroke:#102d42;stroke-width:4}.ko{font:700 25px Arial,sans-serif}.zh{font:600 20px Arial,sans-serif}.en{font:600 18px Arial,sans-serif}.fx{font:900 40px Impact,Arial;fill:#fff;stroke:#063b65;stroke-width:7;paint-order:stroke}</style></defs><rect class="p" x="4" y="4" width="760" height="500" fill="#8ed9f3"/><path d="M4 300Q170 250 340 310T764 285V504H4Z" fill="#0787ad"/><path d="M470 95h250v180H470z" fill="#eef8fb" stroke="#173b4e" stroke-width="6"/><text x="495" y="135" class="ko">REEF MONITOR</text><text x="495" y="185" font-size="40" font-weight="900">27.1°C STABLE</text><path d="M495 225l35-20 38 8 42-31 40 18" fill="none" stroke="#24a766" stroke-width="8"/><circle cx="210" cy="300" r="58" fill="#e8b08a"/><path d="M150 292q18-80 75-45q42 24 45 75" fill="#162735"/><path d="M120 355q90-45 175 5l40 144H80Z" fill="#143f5b"/><circle cx="380" cy="315" r="55" fill="#dba37e"/><path d="M330 300q20-70 75-38q35 20 38 65" fill="#17232d"/><path d="M310 370q75-38 145 4l30 130H280Z" fill="#12384e"/><rect class="b" x="18" y="18" width="430" height="140" rx="8"/><text x="38" y="55" class="ko">수온과 산호 상태가 안정됐어요.</text><text x="38" y="88" class="zh">水温和珊瑚状态已经稳定。</text><text x="38" y="120" class="en">Temperature and coral health are stable.</text><text x="28" y="470" class="fx">DATA → NEXT ACTION!</text><rect class="p" x="772" y="4" width="760" height="500" fill="url(#sea)"/><g fill="#e8ad83" stroke="#263845" stroke-width="5"><circle cx="980" cy="210" r="48"/><circle cx="1190" cy="230" r="48"/></g><g fill="#112f45"><path d="M910 260q70-45 140 0l45 220H870Z"/><path d="M1120 280q70-45 140 0l45 200h-225Z"/></g><g stroke="#d7d1a1" stroke-width="15"><path d="M830 420h650"/><path d="M850 385v95M930 385v95M1010 385v95M1090 385v95M1170 385v95M1250 385v95M1330 385v95"/></g><g fill="#ef806c"><path d="M880 420q-20-70 20-80q35 15 15 80"/><path d="M1040 420q-20-65 18-85q42 22 15 85"/><path d="M1220 420q-18-68 22-82q38 20 12 82"/></g><rect class="b" x="790" y="18" width="470" height="135" rx="8"/><text x="810" y="55" class="ko">건강한 산호를 더 넓은 곳에 심습니다.</text><text x="810" y="88" class="zh">把健康珊瑚种植到更大的区域。</text><text x="810" y="120" class="en">We expand restoration with healthy coral.</text><text x="1080" y="475" class="fx">PLANT! GROW!</text><rect class="p" x="4" y="512" width="760" height="508" fill="url(#sea)"/><g fill="#ee806b"><circle cx="130" cy="890" r="55"/><circle cx="260" cy="900" r="70"/><circle cx="420" cy="880" r="65"/></g><ellipse cx="380" cy="720" rx="125" ry="60" fill="#8b8a55" stroke="#263c40" stroke-width="7"/><circle cx="500" cy="700" r="35" fill="#a39c62"/><path d="M320 720l-95-80M420 730l80 85" stroke="#817b4e" stroke-width="30"/><g fill="#ffd14c"><ellipse cx="160" cy="690" rx="45" ry="22"/><ellipse cx="590" cy="790" rx="48" ry="24"/></g><rect class="b" x="18" y="530" width="430" height="125" rx="8"/><text x="38" y="567" class="ko">시간이 지나자 생명들이 돌아옵니다.</text><text x="38" y="600" class="zh">随着时间推移，生命再次归来。</text><text x="38" y="632" class="en">Life returns as the reef recovers.</text><text x="28" y="985" class="fx">MORE LIFE! BRIGHTER OCEAN!</text><rect class="p" x="772" y="512" width="760" height="508" fill="url(#sun)"/><path d="M772 780q200-80 400 0t360-20v260H772Z" fill="#087b9e"/><g><circle cx="930" cy="720" r="48" fill="#e8ad83"/><circle cx="1080" cy="710" r="50" fill="#dca27d"/><circle cx="1230" cy="725" r="48" fill="#e9b18b"/><path d="M860 775q70-45 140 0l40 245H820Z" fill="#123c58"/><path d="M1010 765q70-45 140 0l40 255H970Z" fill="#173e54"/><path d="M1160 780q70-45 140 0l40 240h-220Z" fill="#123c58"/></g><rect class="b" x="790" y="530" width="500" height="150" rx="8"/><text x="810" y="567" class="ko">우리는 앞으로도 함께 지켜갈 것을 약속합니다.</text><text x="810" y="602" class="zh">我们承诺继续一起守护海洋。</text><text x="810" y="637" class="en">We promise to keep protecting the ocean together.</text><text x="930" y="970" class="fx">TOGETHER, ALWAYS!</text></svg>