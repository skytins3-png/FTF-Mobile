<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 155 links neighboring ports into one regional biosecurity network so invasive species cannot simply move to the next harbor">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#173b60"/><stop offset="1" stop-color="#ee945a"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#25a7c2"/><stop offset="1" stop-color="#06455b"/></linearGradient>
 <linearGradient id="room" x2="1" y2="1"><stop stop-color="#e8f2f4"/><stop offset="1" stop-color="#9bb5bd"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#dffff3"/><stop offset="1" stop-color="#55c89b"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".42"/></filter>
</defs>
<rect width="1536" height="1024" fill="#06141d"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#154561"/>
<text x="30" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="30" font-weight="900">FTF-01 #155  한 항만만 깨끗하면 끝이 아니다 — 이웃 항만을 하나의 방역망으로 묶는다</text>
<text x="1010" y="49" fill="#c9f8ff" font-family="Arial" font-size="17" font-weight="800">ONE COAST · ONE BIOSECURITY LINE · 一条海岸 一道防线</text>

<!-- PANEL 1 regional risk map -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#sky)"/>
 <rect x="16" y="336" width="746" height="176" fill="url(#sea)"/>
 <path d="M30 355c120-70 210-35 300-80 100-50 190-30 300-88 48-25 90-22 132-10v175H30z" fill="#5d745f" opacity=".92"/>
 <g filter="url(#shadow)"><rect x="76" y="278" width="138" height="74" rx="10" fill="#d9e5e7" stroke="#15313c" stroke-width="5"/><text x="145" y="307" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#15313c">PORT A</text><circle cx="145" cy="329" r="11" fill="#43d49a"/></g>
 <g filter="url(#shadow)"><rect x="305" y="229" width="138" height="74" rx="10" fill="#d9e5e7" stroke="#15313c" stroke-width="5"/><text x="374" y="258" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#15313c">PORT B</text><circle cx="374" cy="280" r="11" fill="#ffcf4f"/></g>
 <g filter="url(#shadow)"><rect x="541" y="174" width="138" height="74" rx="10" fill="#d9e5e7" stroke="#15313c" stroke-width="5"/><text x="610" y="203" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#15313c">PORT C</text><circle cx="610" cy="225" r="11" fill="#ff5f62"/></g>
 <path d="M145 329C245 300 280 285 374 280S520 238 610 225" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="18 12"/>
 <path d="M190 428h430" stroke="#8ce7ff" stroke-width="9"/><path d="M620 428l-35-22v44z" fill="#8ce7ff"/>
 <g transform="translate(688 375)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-28-69q9-28 29-28q21 4 27 28l-18-7q-18 7-38 7" fill="#282727"/><rect x="-40" y="-20" width="80" height="103" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-31 1l-62 31M31 1l53 26" stroke="#f1b842" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="38" y="102" width="532" height="120" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="304" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="304">우리 항만의 유입을 막아도 선박과 장비가 이웃 항만을 오가면 위험은 다시 돌아온다.</tspan><tspan x="304" dy="24" font-size="14">即使本港阻断入侵，船舶与设备经过邻港后仍可能把风险带回来。</tspan><tspan x="304" dy="23" font-size="13">A clean harbor is not enough when vessels and gear move across the same coastline.</tspan></text>
 <path d="M579 102h150q16 0 16 16v93q0 16-16 16h-78l-30 27 8-27h-50q-16 0-16-16v-93q0-16 16-16z" fill="#fff2c2" stroke="#111" stroke-width="4"/>
 <text x="654" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="654">해안 전체를</tspan><tspan x="654" dy="23">같이 막자!</tspan><tspan x="654" dy="20" font-size="12">整条海岸一起防！</tspan></text>
 <text x="48" y="493" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">MAP! CONNECT! CLOSE THE GAP!</text>
</g>

<!-- PANEL 2 joint command -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#room)"/>
 <rect x="804" y="238" width="686" height="205" rx="18" fill="#173f56" stroke="#082632" stroke-width="6"/>
 <path d="M840 401h610" stroke="#4a6973" stroke-width="2"/>
 <g font-family="Arial" font-weight="900"><rect x="836" y="268" width="180" height="104" rx="12" fill="#d9fff3"/><text x="926" y="298" text-anchor="middle" font-size="18" fill="#16553f">PORT A</text><text x="926" y="327" text-anchor="middle" font-size="15" fill="#16553f">eDNA  NEGATIVE</text><text x="926" y="350" text-anchor="middle" font-size="13" fill="#16553f">GATE READY ✓</text><rect x="1055" y="268" width="180" height="104" rx="12" fill="#fff3c6"/><text x="1145" y="298" text-anchor="middle" font-size="18" fill="#66521a">PORT B</text><text x="1145" y="327" text-anchor="middle" font-size="15" fill="#66521a">VESSEL HOLD</text><text x="1145" y="350" text-anchor="middle" font-size="13" fill="#66521a">SWAB 12/12</text><rect x="1274" y="268" width="180" height="104" rx="12" fill="#ffd9d9"/><text x="1364" y="298" text-anchor="middle" font-size="18" fill="#782626">PORT C</text><text x="1364" y="327" text-anchor="middle" font-size="15" fill="#782626">ALERT B-2</text><text x="1364" y="350" text-anchor="middle" font-size="13" fill="#782626">RESPONSE ACTIVE</text></g>
 <path d="M1016 320h39M1235 320h39" stroke="#87e9ff" stroke-width="8"/>
 <g transform="translate(905 470)" filter="url(#shadow)"><ellipse cy="-62" rx="28" ry="34" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-29-72q9-29 30-29q21 4 28 29l-19-8q-18 8-39 8" fill="#2b2726"/><rect x="-41" y="-23" width="82" height="95" rx="18" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-33-1l-61-35M33-1l63-31" stroke="#43b994" stroke-width="18" stroke-linecap="round"/></g>
 <g transform="translate(1390 470)" filter="url(#shadow)"><ellipse cy="-62" rx="28" ry="34" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-29-72q8-29 29-29q22 4 28 29l-19-8q-18 8-38 8" fill="#1f2528"/><rect x="-41" y="-23" width="82" height="95" rx="18" fill="#4ea5c8" stroke="#102a35" stroke-width="5"/><path d="M-33-1l-61-32M33-1l60-34" stroke="#4ea5c8" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="796" y="102" width="650" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">세 항만은 eDNA 경보·선박 검사·장비 봉인 기록을 실시간 공유하고 같은 단계의 대응 규칙을 사용한다.</tspan><tspan x="1121" dy="24" font-size="14">三座港口实时共享eDNA警报、船检与设备封签记录，并采用同级响应规则。</tspan><tspan x="1121" dy="23" font-size="13">Three ports now share alerts, inspections and sealed-equipment status in one response system.</tspan></text>
 <text x="812" y="492" font-family="Arial" font-size="25" font-weight="1000" fill="#163542">SYNC! SHARE! ACT AS ONE!</text>
</g>

<!-- PANEL 3 intercepted vessel -->
<g>
 <rect x="16" y="524" width="746" height="484" rx="12" fill="#0d2e3f"/>
 <rect x="16" y="734" width="746" height="274" fill="url(#sea)"/>
 <path d="M79 812h385l-58 98H128z" fill="#e7edef" stroke="#102f3b" stroke-width="7"/>
 <rect x="184" y="703" width="160" height="110" rx="9" fill="#c6dce3" stroke="#102f3b" stroke-width="6"/><rect x="214" y="730" width="44" height="32" fill="#236278"/><rect x="270" y="730" width="44" height="32" fill="#236278"/>
 <path d="M343 756h108" stroke="#f2ba43" stroke-width="12"/><circle cx="466" cy="756" r="27" fill="#ef5558" stroke="#fff" stroke-width="5"/><path d="M451 741l30 30M481 741l-30 30" stroke="#fff" stroke-width="7"/>
 <g transform="translate(575 800)" filter="url(#shadow)"><ellipse cy="-68" rx="29" ry="35" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-30-79q9-29 31-29q22 4 28 29l-19-8q-19 8-40 8" fill="#292525"/><rect x="-43" y="-28" width="86" height="116" rx="18" fill="#f1b842" stroke="#102a35" stroke-width="5"/><path d="M-35-2l-75 36M35-2l78 31" stroke="#f1b842" stroke-width="19" stroke-linecap="round"/><rect x="-16" y="8" width="32" height="46" rx="5" fill="#173f56"/><path d="M-29 88l-22 86M29 88l22 86" stroke="#172a31" stroke-width="20" stroke-linecap="round"/></g>
 <g filter="url(#shadow)"><rect x="490" y="674" width="220" height="104" rx="14" fill="#fff1c1" stroke="#604f19" stroke-width="5"/><text x="600" y="706" text-anchor="middle" font-family="Arial" font-size="19" font-weight="900" fill="#674f16">PORT C ALERT → PORT A</text><text x="600" y="735" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#674f16">VESSEL K-12 HOLD</text><text x="600" y="758" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#674f16">HULL SWAB BEFORE ENTRY</text></g>
 <rect x="38" y="546" width="674" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">PORT C에서 나온 경보가 4분 만에 PORT A에 도착했다. 같은 항로의 K-12는 입항 전에 정지·선체 검사됐다.</tspan><tspan x="375" dy="24" font-size="14">C港警报4分钟内传到A港，同航线K-12在入港前被拦截并检查船体。</tspan><tspan x="375" dy="23" font-size="13">A Port C alert reaches Port A in four minutes; vessel K-12 is held and swabbed before entry.</tspan></text>
 <path d="M515 861h181q14 0 14 14v70q0 14-14 14h-100l-30 27 8-27h-59q-14 0-14-14v-70q0-14 14-14z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="605" y="891" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="605">입항 전 검사!</tspan><tspan x="605" dy="24" font-size="13">进港前先检查！</tspan></text>
 <text x="52" y="984" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">ALERT! HOLD! SWAB! CLEAR!</text>
</g>

<!-- PANEL 4 regional recovery -->
<g>
 <rect x="774" y="524" width="746" height="484" rx="12" fill="#0a3340"/>
 <rect x="774" y="742" width="746" height="266" fill="url(#sea)"/>
 <circle cx="1420" cy="610" r="62" fill="#ffd86d" opacity=".9"/>
 <path d="M774 745c120-70 205-43 294-28 116 19 214-33 452-26v51H774z" fill="#78966d"/>
 <g fill="#b7f5ee" stroke="#245c6d" stroke-width="4"><path d="M945 859l54-26-19 26 19 27z"/><path d="M1085 907l62-30-21 30 21 31z"/><path d="M1270 842l52-25-18 25 18 26z"/><path d="M1394 927l45-22-15 22 15 23z"/></g>
 <g filter="url(#shadow)"><rect x="840" y="650" width="586" height="151" rx="18" fill="url(#green)" stroke="#17694d" stroke-width="6"/><text x="1133" y="685" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="24" font-weight="900" fill="#14523d">REGIONAL 30-DAY AUDIT · 해안 공동검증</text><text x="900" y="725" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#14523d">항만 연결 3/3</text><text x="900" y="756" font-family="Arial" font-size="17" font-weight="900" fill="#14523d">ALERT SHARE 100%</text><text x="1120" y="725" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#14523d">미통보 이동 0</text><text x="1120" y="756" font-family="Arial" font-size="17" font-weight="900" fill="#14523d">UNLOGGED MOVE 0</text><text x="1320" y="725" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900" fill="#14523d">재유입 eDNA 0</text><text x="1320" y="756" font-family="Arial" font-size="17" font-weight="900" fill="#14523d">RE-ENTRY 0</text></g>
 <g transform="translate(934 936)" filter="url(#shadow)"><ellipse cy="-68" rx="29" ry="35" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-30-79q8-29 30-29q22 4 29 29l-19-8q-19 8-40 8" fill="#292525"/><rect x="-43" y="-28" width="86" height="116" rx="18" fill="#43b994" stroke="#102a35" stroke-width="5"/><path d="M-35-2l-70-34M35-2l70-33" stroke="#43b994" stroke-width="19" stroke-linecap="round"/></g>
 <g transform="translate(1480 934)" filter="url(#shadow)"><ellipse cy="-66" rx="28" ry="34" fill="#b98265" stroke="#102a35" stroke-width="5"/><path d="M-29-77q9-29 30-28q21 3 27 28l-19-8q-18 8-38 8" fill="#1f2528"/><rect x="-41" y="-27" width="82" height="112" rx="18" fill="#4ea5c8" stroke="#102a35" stroke-width="5"/><path d="M-33-2l-64-31M33-2l60-28" stroke="#4ea5c8" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="796" y="546" width="650" height="92" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">30일 뒤 세 항만의 경보 공유율 100%, 무기록 이동 0, 재유입 외래종 eDNA 0. 방역선이 항만에서 해안 전체로 넓어졌다.</tspan><tspan x="1121" dy="23" font-size="14">30天后，三港警报共享100%，无记录转移0，再入侵eDNA 0。</tspan><tspan x="1121" dy="22" font-size="13">After 30 days: 100% alert sharing, zero unlogged transfers and zero invasive eDNA re-entry.</tspan></text>
 <text x="804" y="985" font-family="Arial" font-size="25" font-weight="1000" fill="#dffff4">LINK! VERIFY! PROTECT THE WHOLE COAST!</text>
</g>
</svg>