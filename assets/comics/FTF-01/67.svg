<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc"><title id="title">FTF-01 #67 — 산호의 다음 세대</title><desc id="desc">Four-panel cinematic manga scene: reef scientists survey restored coral, divers discover coral spawning, a young volunteer records new juvenile fish, and the team protects the nursery zone. Korean Chinese English captions, speech bubbles, narration and visual sound effects.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83d7ff"/><stop offset="1" stop-color="#0b78ad"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18bce0"/><stop offset=".52" stop-color="#08779e"/><stop offset="1" stop-color="#023957"/></linearGradient><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd783"/><stop offset="1" stop-color="#ee765a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter><style>.panel{stroke:#071a2a;stroke-width:10}.box{fill:#fff;stroke:#10293e;stroke-width:4;filter:url(#shadow)}.ko{font:800 25px Arial,'Malgun Gothic',sans-serif}.zh{font:700 20px Arial,'Microsoft YaHei',sans-serif}.en{font:650 18px Arial,sans-serif}.fx{font:900 42px Impact,Arial;fill:#ffe65b;stroke:#052941;stroke-width:8;paint-order:stroke}.small{font:700 18px Arial,sans-serif}.line{stroke:#10293e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<!-- PANEL 1: survey boat --> <rect class="panel" x="4" y="4" width="760" height="500" fill="url(#sky)"/><path d="M4 315Q130 275 260 320T520 304T764 312V504H4Z" fill="#087da7"/><path d="M395 110h310l-45 180H350Z" fill="#f6fbff" stroke="#183b50" stroke-width="7"/><path d="M460 65h150v55H460Z" fill="#d7ecf4" stroke="#183b50" stroke-width="6"/><text x="438" y="155" font-size="24" font-weight="900" fill="#0d4f7b">OCEAN RESTORATION TEAM</text><path d="M580 65v-38M605 65V20" class="line"/><circle cx="205" cy="300" r="58" fill="#efb58d" stroke="#233543" stroke-width="5"/><path d="M145 285q15-82 72-55q50 22 50 83" fill="#1c2d39"/><path d="M119 360q92-52 178-2l40 146H78Z" fill="#153f5d"/><circle cx="355" cy="310" r="54" fill="#dca47f" stroke="#233543" stroke-width="5"/><path d="M305 298q17-73 70-43q39 24 39 71" fill="#172733"/><path d="M288 370q73-42 142 0l38 134H252Z" fill="#17384c"/><rect x="475" y="320" width="225" height="120" rx="10" fill="#0b2940" stroke="#bcefff" stroke-width="5"/><path d="M500 400l35-30 30 8 36-48 35 25 38-55" fill="none" stroke="#64ffb0" stroke-width="7"/><text x="494" y="352" class="small" fill="#fff">REEF HEALTH +18%</text><rect class="box" x="18" y="18" width="430" height="145" rx="10"/><text x="38" y="55" class="ko">복원 구역의 산호가 안정적으로 자라고 있어요.</text><text x="38" y="90" class="zh">修复区的珊瑚正在稳定生长。</text><text x="38" y="124" class="en">The restored reef is growing steadily.</text><ellipse class="box" cx="265" cy="225" rx="190" ry="66"/><text x="118" y="214" class="ko">오늘은 새 생명의 흔적을 찾아봐요!</text><text x="144" y="248" class="en">Let's look for signs of new life!</text><text x="25" y="476" class="fx">CHECK! RECORD! PROTECT!</text>
<!-- PANEL 2: spawning --> <rect class="panel" x="772" y="4" width="760" height="500" fill="url(#sea)"/><g opacity=".22" fill="#c9fbff"><circle cx="890" cy="80" r="7"/><circle cx="925" cy="135" r="5"/><circle cx="1160" cy="85" r="9"/><circle cx="1400" cy="145" r="6"/></g><g fill="#f58a75" stroke="#7d3a40" stroke-width="4"><path d="M820 470q0-120 45-135q44 28 22 135Z"/><path d="M925 470q-10-160 43-185q55 39 24 185Z"/><path d="M1105 470q-5-130 42-150q45 33 22 150Z"/><path d="M1265 470q0-155 50-180q50 38 18 180Z"/><path d="M1390 470q0-115 40-140q43 30 23 140Z"/></g><g fill="#f7efe0"><circle cx="955" cy="235" r="8"/><circle cx="984" cy="210" r="7"/><circle cx="1014" cy="240" r="9"/><circle cx="1040" cy="195" r="7"/><circle cx="1075" cy="230" r="8"/><circle cx="1110" cy="190" r="7"/><circle cx="1142" cy="225" r="9"/><circle cx="1180" cy="175" r="8"/><circle cx="1220" cy="215" r="7"/></g><circle cx="935" cy="300" r="48" fill="#e7a77e" stroke="#203441" stroke-width="5"/><path d="M890 286q18-66 67-39q34 20 34 63" fill="#111e28"/><path d="M860 350q73-43 144 0l38 154H825Z" fill="#112f45"/><ellipse cx="934" cy="300" rx="60" ry="38" fill="none" stroke="#bde8ff" stroke-width="9"/><circle cx="1245" cy="318" r="48" fill="#e0a37e" stroke="#203441" stroke-width="5"/><path d="M1200 305q18-68 68-39q35 22 34 63" fill="#15232d"/><path d="M1175 365q70-42 140 0l34 139h-210Z" fill="#13364d"/><ellipse cx="1245" cy="318" rx="60" ry="38" fill="none" stroke="#bde8ff" stroke-width="9"/><rect class="box" x="790" y="18" width="455" height="140" rx="10"/><text x="810" y="55" class="ko">산호가 산란하고 있어요! 다음 세대의 시작입니다.</text><text x="810" y="90" class="zh">珊瑚正在产卵！这是下一代的开始。</text><text x="810" y="124" class="en">The corals are spawning — a new generation begins.</text><ellipse class="box" cx="1235" cy="210" rx="220" ry="62"/><text x="1082" y="198" class="ko">빛을 줄여요. 산호를 놀라게 하면 안 돼요!</text><text x="1102" y="232" class="en">Dim the lights. Don't disturb them!</text><text x="1060" y="465" class="fx">SPARKLE… NEW LIFE!</text>
<!-- PANEL 3 juvenile fish survey --> <rect class="panel" x="4" y="512" width="760" height="508" fill="url(#sea)"/><g fill="#f18870"><path d="M70 990q0-145 40-185q45 35 18 185Z"/><path d="M180 990q0-115 40-150q42 30 18 150Z"/><path d="M600 990q0-150 50-190q44 32 20 190Z"/></g><g fill="#ffd84f" stroke="#654b10" stroke-width="3"><ellipse cx="250" cy="790" rx="40" ry="20"/><ellipse cx="340" cy="740" rx="32" ry="16"/><ellipse cx="540" cy="825" rx="38" ry="19"/><ellipse cx="455" cy="700" rx="27" ry="14"/></g><circle cx="410" cy="790" r="55" fill="#efb48b" stroke="#203441" stroke-width="5"/><path d="M350 777q20-74 75-44q40 22 40 70" fill="#1c2b36"/><path d="M320 850q88-46 170 0l40 170H280Z" fill="#16415e"/><rect x="490" y="780" width="160" height="110" rx="10" fill="#eaf7ff" stroke="#18384c" stroke-width="6"/><path d="M515 850l25-30 27 18 30-42 28 22" fill="none" stroke="#38a66b" stroke-width="7"/><text x="510" y="815" class="small">JUVENILE FISH</text><rect class="box" x="18" y="530" width="460" height="145" rx="10"/><text x="38" y="568" class="ko">어린 물고기들이 복원 산호 사이에 모여듭니다.</text><text x="38" y="603" class="zh">幼鱼开始聚集在修复后的珊瑚之间。</text><text x="38" y="638" class="en">Young fish are gathering among the restored corals.</text><ellipse class="box" cx="545" cy="650" rx="190" ry="60"/><text x="425" y="640" class="ko">숫자가 늘었어요!</text><text x="427" y="674" class="en">Their numbers are rising!</text><text x="34" y="982" class="fx">LIFE RETURNS — COUNT IT!</text>
<!-- PANEL 4 protected nursery at sunset --> <rect class="panel" x="772" y="512" width="760" height="508" fill="url(#sun)"/><path d="M772 792q170-65 340 0t420-10v238H772Z" fill="#086f94"/><path d="M1320 622h95v190h-95Z" fill="#f4f7f7" stroke="#193849" stroke-width="6"/><text transform="translate(1352 785) rotate(-90)" font-size="24" font-weight="900" fill="#07557f">CORAL NURSERY — NO ANCHORING</text><g><circle cx="900" cy="740" r="48" fill="#efb58d" stroke="#213542" stroke-width="5"/><path d="M852 727q18-68 68-40q37 20 37 63" fill="#1a2c38"/><path d="M835 795q70-40 137 0l35 225H800Z" fill="#153e59"/><circle cx="1040" cy="735" r="50" fill="#dba27c" stroke="#213542" stroke-width="5"/><path d="M994 722q17-70 70-39q35 22 35 65" fill="#172730"/><path d="M975 793q72-42 145 0l35 227H940Z" fill="#17394d"/><circle cx="1185" cy="748" r="47" fill="#edb18a" stroke="#213542" stroke-width="5"/><path d="M1138 735q15-68 67-40q36 21 36 64" fill="#26313a"/><path d="M1120 805q66-38 132 0l36 215h-205Z" fill="#173e58"/></g><path d="M870 855l80 75M1030 845l30 88M1190 860l-40 75" class="line"/><rect class="box" x="790" y="530" width="500" height="150" rx="10"/><text x="810" y="568" class="ko">다음 세대가 자랄 수 있도록 이 구역을 더 강하게 지킵니다.</text><text x="810" y="603" class="zh">为了让下一代成长，我们会更好地守护这里。</text><text x="810" y="638" class="en">We protect this nursery so the next generation can grow.</text><ellipse class="box" cx="1160" cy="705" rx="225" ry="60"/><text x="1005" y="694" class="ko">바다가 스스로 살아날 시간을 돌려줘요.</text><text x="1015" y="728" class="en">Give the ocean time to heal itself.</text><text x="875" y="980" class="fx">GUARD THE NURSERY! FUTURE GROWS!</text></svg>