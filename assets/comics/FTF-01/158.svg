 <rect x="801" y="772" width="672" height="94" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1137" y="802" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1137">30일 동안 84번의 교대가 모두 이중서명으로 이어졌다. 인계 누락 0, 2차 eDNA 0 — 사람의 기억 대신 시스템이 바다를 지킨다.</tspan><tspan x="1137" dy="24" font-size="14">30天84次交接全部双签闭环，交接缺口0，二次eDNA 0。</tspan><tspan x="1137" dy="23" font-size="13">Eighty-four handoffs, zero broken links: the system protects the sea across every shift.</tspan></text>
 <text x="804" y="985" font-family="Arial" font-size="24" font-weight="1000" fill="#fff">VERIFY! DUAL-SIGN! ZERO BROKEN HANDOFFS!</text>
