 <rect x="38" y="546" width="674" height="112" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="375" y="575" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="375">무작위 교대감사에서 공용 호스 H-9의 청결 태그가 빠진 것을 발견했다. 누구도 추측하지 않고 즉시 사용을 멈춘다.</tspan><tspan x="375" dy="24" font-size="14">随机交接审计发现共用软管H-9缺少洁净标签，立即停止使用。</tspan><tspan x="375" dy="23" font-size="13">A missing clean tag stops the hose before uncertainty becomes contamination.</tspan></text>
 <path d="M444 848h270q15 0 15 15v72q0 15-15 15h-137l-33 30 8-30h-108q-15 0-15-15v-72q0-15 15-15z" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="579" y="878" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="579">태그 없으면 사용 금지!</tspan><tspan x="579" dy="24" font-size="13">无标签，不使用！</tspan></text>
 <text x="49" y="988" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">AUDIT! STOP! NO TAG, NO USE!</text>
</g>

