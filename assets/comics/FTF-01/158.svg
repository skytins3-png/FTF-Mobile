 <g transform="translate(1010 478)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#c99572" stroke="#102a35" stroke-width="5"/><path d="M-28-69q8-27 29-28q21 3 27 28l-18-8q-19 8-38 8" fill="#25282b"/><rect x="-40" y="-20" width="80" height="94" rx="17" fill="#4ea5c8" stroke="#102a35" stroke-width="5"/><path d="M-33 0l-60-30M33 0l60-26" stroke="#4ea5c8" stroke-width="18" stroke-linecap="round"/></g>
 <rect x="796" y="102" width="650" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">봉인번호, 샘플 상자 수량, 청결 장비 수량, 시각을 함께 스캔하고 두 교대 책임자가 동시에 서명해야 인계가 닫힌다.</tspan><tspan x="1121" dy="24" font-size="14">封签号、样本箱、洁净设备和时间全部扫描后，双方同时签字才完成交接。</tspan><tspan x="1121" dy="23" font-size="13">Seal, samples, clean gear and time are locked under dual signature.</tspan></text>
 <text x="811" y="493" font-family="Arial" font-size="25" font-weight="1000" fill="#163642">SCAN! COUNT! DUAL-SIGN! LOCK THE HANDOFF!</text>
</g>

<!-- PANEL 3 -->
<g>
