<rect width="1536" height="1024" fill="#06141d"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#164965"/>
<text x="28" y="50" fill="#fff" font-family="Arial,Malgun Gothic" font-size="30" font-weight="900">FTF-01 #158  교대가 바뀌어도 규칙은 끊기지 않는다 — 사람 사이 인계까지 봉인한다</text>
<text x="970" y="49" fill="#c9f8ff" font-family="Arial" font-size="17" font-weight="800">SHIFT HANDOFF · HUMAN CHAIN OF CUSTODY · 人员交接闭环</text>

<!-- PANEL 1 -->
<g>
