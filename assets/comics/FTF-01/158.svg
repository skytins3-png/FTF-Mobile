 <path d="M38 366h690v42H38z" fill="#697b80"/><path d="M74 408v84M206 408v84M595 408v84M706 408v84" stroke="#33464b" stroke-width="17"/>
 <g filter="url(#shadow)"><path d="M82 426h270l-40 62H119z" fill="#eef3f5" stroke="#163744" stroke-width="6"/><rect x="157" y="354" width="126" height="74" rx="9" fill="#bdd9df" stroke="#163744" stroke-width="5"/><text x="217" y="474" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#163744">K-27</text></g>
 <g transform="translate(468 368)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#c68f6d" stroke="#102a35" stroke-width="5"/><path d="M-28-69q9-27 29-28q21 4 27 28l-18-8q-18 7-38 8" fill="#24272a"/><rect x="-40" y="-20" width="80" height="104" rx="17" fill="#f0b640" stroke="#102a35" stroke-width="5"/><path d="M-33 0l-70 31M33 0l68 26" stroke="#f0b640" stroke-width="18" stroke-linecap="round"/><rect x="-15" y="10" width="30" height="42" rx="4" fill="#163f55"/></g>
 <g transform="translate(610 366)" filter="url(#shadow)"><ellipse cy="-58" rx="27" ry="33" fill="#b77d61" stroke="#102a35" stroke-width="5"/><path d="M-28-68q10-28 29-29q22 5 28 29l-20-8q-18 8-37 8" fill="#3a2d27"/><rect x="-40" y="-20" width="80" height="104" rx="17" fill="#45b996" stroke="#102a35" stroke-width="5"/><path d="M-33 0l-68 29M33 0l69 26" stroke="#45b996" stroke-width="18" stroke-linecap="round"/><rect x="-15" y="10" width="30" height="42" rx="4" fill="#163f55"/></g>
 <path d="M520 393h43" stroke="#7ceaff" stroke-width="9"/><polygon points="575,393 545,373 545,413" fill="#7ceaff"/>
 <rect x="38" y="102" width="544" height="122" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="310" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="310">PORT B 야간조가 K-27을 넘겨받는다. 배만 인계하는 것이 아니라 봉인·샘플·장비 상태를 사람 대 사람으로 다시 확인한다.</tspan><tspan x="310" dy="24" font-size="14">B港夜班接管K-27时，人员面对面核对封签、样本和设备状态。</tspan><tspan x="310" dy="23" font-size="13">The vessel changes hands only after a face-to-face custody check.</tspan></text>
 <path d="M590 103h141q17 0 17 17v90q0 17-17 17h-78l-27 25 7-25h-43q-17 0-17-17v-90q0-17 17-17z" fill="#fff0c0" stroke="#111" stroke-width="4"/>
 <text x="660" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="660">말로만 넘기지 마!</tspan><tspan x="660" dy="23">같이 보고 찍어!</tspan><tspan x="660" dy="20" font-size="12">当面核验！</tspan></text>
 <text x="48" y="494" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">SHIFT! FACE-TO-FACE! VERIFY BEFORE HANDOFF!</text>
</g>

<!-- PANEL 2 -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="url(#ops)"/>
 <rect x="802" y="244" width="688" height="204" rx="18" fill="#153e54" stroke="#092633" stroke-width="6"/>
 <g filter="url(#shadow)"><rect x="828" y="267" width="292" height="157" rx="14" fill="#e8fff8" stroke="#2c8f68" stroke-width="5"/><text x="974" y="297" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#16563f">HANDOFF CHECKLIST</text><text x="856" y="327" font-family="Arial" font-size="13" font-weight="900" fill="#16563f">✓ SEAL S-88421</text><text x="856" y="352" font-family="Arial" font-size="13" font-weight="900" fill="#16563f">✓ SAMPLE BOX 4/4</text><text x="856" y="377" font-family="Arial" font-size="13" font-weight="900" fill="#16563f">✓ CLEAN GEAR 6/6</text><text x="856" y="402" font-family="Arial" font-size="13" font-weight="900" fill="#16563f">✓ TIME 21:04 · BOTH SIGN</text></g>
 <path d="M1132 344h67" stroke="#7ceaff" stroke-width="9"/><polygon points="1211,344 1181,324 1181,364" fill="#7ceaff"/>
