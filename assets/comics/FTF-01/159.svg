 <text x="556" y="878" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="18" font-weight="900"><tspan x="556">태그 없음! H-9 사용 금지!</tspan><tspan x="556" dy="24" font-size="13">标签缺失！禁止使用H-9！</tspan></text>
 <text x="49" y="988" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe15c">SPOT! STOP! 14 SEC! NO TAG, NO USE!</text>
</g>

