 <rect x="38" y="103" width="610" height="128" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="343" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="343">21:17, 예고 없이 모의 eDNA 경보가 울렸다. 야간조는 이것이 훈련인지 모른 채 실제 절차대로 K-27을 즉시 멈춘다.</tspan><tspan x="343" dy="25" font-size="14">21:17，未预告的模拟eDNA警报响起，夜班按真实程序立即停止K-27。</tspan><tspan x="343" dy="23" font-size="13">At 21:17 an unannounced simulated alert tests the night crew like a real event.</tspan></text>
 <text x="49" y="494" font-family="Arial" font-size="25" font-weight="1000" fill="#ffe56a">BEEP! ALERT! HOLD K-27! START THE CLOCK!</text>
</g>

