 <text x="1122" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1122">07:26에 전 절차가 닫혔다. 30일 동안 불시훈련 12회 모두 성공, 끊어진 인계 0, 2차 eDNA 0.</tspan><tspan x="1122" dy="25" font-size="14">07:26完成全流程；30天12次突击演练全部完成，交接中断0，二次eDNA 0。</tspan><tspan x="1122" dy="23" font-size="13">The chain closes in 7:26. Twelve surprise drills prove the rule works under pressure.</tspan></text>
