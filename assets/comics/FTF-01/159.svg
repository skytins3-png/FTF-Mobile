 <rect x="796" y="103" width="650" height="122" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1121" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1121">정지 → 봉인 → 재채취 → 이중서명. 누구도 단계를 건너뛰지 않는다. 타이머는 10분 제한을 계속 세고 있다.</tspan><tspan x="1121" dy="25" font-size="14">停止→封签→复采→双签，任何步骤都不能跳过，十分钟倒计时持续进行。</tspan><tspan x="1121" dy="23" font-size="13">Hold, seal, swab and dual-sign—every step must survive pressure.</tspan></text>
 <text x="810" y="493" font-family="Arial" font-size="24" font-weight="1000" fill="#153847">HOLD! SEAL! SWAB! SIGN! NO SHORTCUTS!</text>
