 <text x="372" y="579" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="372">훈련팀이 일부러 H-9 청결 태그를 빼 두었다. 신입 요원이 14초 만에 발견하고 사용을 막는다. 절차가 사람보다 먼저 움직인다.</tspan><tspan x="372" dy="25" font-size="14">演练组故意移除H-9洁净标签，新队员14秒内发现并立即停用。</tspan><tspan x="372" dy="23" font-size="13">A planted missing tag is caught in 14 seconds before the hose can be used.</tspan></text>
