<rect x="72" y="132" width="660" height="88" rx="15" fill="#171b22" fill-opacity=".91" stroke="#fff0a8" stroke-width="3"/><text x="94" y="167" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="27" font-weight="900">비가 멈춘 뒤, 저수지의 바닥이 드러났다.</text><text x="94" y="197" fill="#fff" font-family="Arial" font-size="18">雨停了太久，水库露出了底部。 · The reservoir is running dry.</text><path d="M385 245 q270-58 535 8 v66 q-267 54-535-7Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="652" y="276" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="21" font-weight="900">수위 18%. 지금부터 물을 나눠 써야 합니다.</text><text x="652" y="301" text-anchor="middle" font-family="Arial" font-size="14">蓄水量18%。必须从现在开始节水。 · 18%. We ration now.</text><text x="800" y="472" fill="#fff2a6" font-family="Arial" font-size="38" font-weight="900" transform="rotate(-6 800 472)">CRACK…</text></g>
