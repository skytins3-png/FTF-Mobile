<path d="M550 670 q190-48 377 12 v65 q-193 49-377-4Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="739" y="703" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="20" font-weight="900">먼저 아이와 어르신 몫부터 챙겨요.</text><text x="739" y="728" text-anchor="middle" font-family="Arial" font-size="14">先照顾孩子和老人。 · Children and elders first.</text><text x="836" y="899" fill="#34687b" font-family="Arial" font-size="36" font-weight="900">GLUG—</text></g>
