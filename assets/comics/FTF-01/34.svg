<!-- rain --> <g stroke="#d8f5ff" stroke-width="5" stroke-linecap="round" opacity=".9"><path d="M100 1480 l-12 26 M150 1455 l-12 26 M210 1490 l-12 26 M280 1460 l-12 26 M350 1484 l-12 26 M430 1450 l-12 26 M510 1482 l-12 26 M590 1452 l-12 26 M670 1488 l-12 26 M750 1455 l-12 26 M835 1490 l-12 26 M920 1450 l-12 26 M985 1482 l-12 26"/></g><rect x="75" y="1441" width="710" height="92" rx="16" fill="#10241d" fill-opacity=".9" stroke="#c9ffd2" stroke-width="3"/><text x="96" y="1476" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="28" font-weight="900">물을 아끼는 것만으로는 부족하다. 물이 돌아올 숲도 지킨다.</text><text x="96" y="1507" fill="#fff" font-family="Arial" font-size="18">节水还不够，也要守护让水回来的森林。 · Save water—and the forest that brings it back.</text><path d="M560 1542 q190-50 389 7 v65 q-198 48-389-4Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="754" y="1576" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="20" font-weight="900">비가 와도, 우리는 다시 낭비하지 않을 거야.</text><text x="754" y="1600" text-anchor="middle" font-family="Arial" font-size="13">即使下雨，也不会再浪费。 · Rain won't make us waste again.</text><text x="770" y="1811" fill="#eaffff" font-family="Arial" font-size="35" font-weight="900">PITTER—PATTER</text></g></svg>