e="20" font-weight="900"><tspan x="201">자유를 되찾은 돌고래가 돌아간다!</tspan><tspan x="201" dy="25" font-size="16">重获自由的海豚，回到蔚蓝大海。</tspan><tspan x="201" dy="23" font-size="15">Free again, the dolphin returns to the blue ocean.</tspan></text><rect x="463" y="821" width="274" height="143" rx="18" fill="#fff8df" stroke="#111" stroke-width="4"/><text x="600" y="853" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="19" font-weight="900"><tspan x="600">작은 구조 하나가</tspan><tspan x="600" dy="24">바다의 내일을 바꾼다.</tspan><tspan x="600" dy="23" font-size="16">一次救援，改变海洋的明天。</tspan><tspan x="600" dy="21" font-size="15">One rescue can change tomorrow.</tspan></text><text x="65" y="964" fill="#fff" stroke="#07527f" stroke-width="9" paint-order="stroke" font-size="61" font-family="Arial" font-weight="1000" font-style="italic">LIFE RETURNS!</text></g>
