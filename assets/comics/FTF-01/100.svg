 <style>.p{stroke:#071722;stroke-width:8}.b{fill:#fffdf8;stroke:#11232e;stroke-width:4}.sp{fill:#fff;stroke:#11232e;stroke-width:4}.txt{font-family:'Noto Sans KR','Noto Sans CJK SC',Arial,sans-serif;font-weight:700}.ko{font-size:22px}.zh{font-size:18px}.en{font-size:17px}.line{stroke:#101820;stroke-width:4;stroke-linejoin:round}.skin{fill:#efbd9c}.skin2{fill:#d7a17d}.hair{fill:#18232c}.hair2{fill:#493028}.ftf{fill:#155f92}.sfx{font-family:Arial Black,sans-serif;font-weight:900;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}.tag{font-family:Arial Black,sans-serif;font-weight:900}</style>
</defs>
<rect width="1536" height="1024" fill="#07151e"/><rect width="1536" height="66" fill="#0a385e"/>
<text x="20" y="45" class="tag" font-size="34" fill="#fff">FTF-01  #100</text>
<text x="270" y="42" class="txt" font-size="29" fill="#fff">바다의 변화를 함께 기록하다 · 一起记录海洋的变化 · RECORDING THE OCEAN TOGETHER</text>
<text x="1510" y="42" text-anchor="end" class="txt" font-size="16" fill="#d7f7ff">보호는 눈으로 보는 것에서, 정확히 기록하는 일로 이어집니다.</text>
<!-- PANEL 1 citizen-science briefing -->
<g transform="translate(14,80)">
 <rect class="p" width="748" height="424" rx="8" fill="url(#sky)"/><path d="M0 280q100-32 200 0t200 0 180 0 168 0v144H0z" fill="#1594bd"/><path d="M0 295q98-20 196 0t196 0 196 0 160 0" fill="none" stroke="#c9f7ff" stroke-width="7"/>
 <path d="M510 130l54 74H458z" fill="#587a88"/><path d="M532 106l22 29h-42z" fill="#f4f7f8"/>
 <g transform="translate(75,190)" filter="url(#sh)"><path d="M52 103Q19 136 22 214h126q3-78-40-110z" class="ftf line"/><circle cx="87" cy="69" r="45" class="skin line"/><path d="M44 70q6-48 43-50 43 2 47 51-22-15-42-28-16 17-47 27z" class="hair2 line"/><path d="M48 36q34-24 78-2l-7-24q-34-20-64 0z" fill="#155f92" class="line"/><text x="87" y="27" text-anchor="middle" class="tag" font-size="13" fill="#fff">FTF</text><ellipse cx="72" cy="74" rx="6" ry="8"/><ellipse cx="103" cy="74" rx="6" ry="8"/><path d="M76 96q13 9 28-1" fill="none" stroke="#9c5148" stroke-width="4"/><path d="M112 145l135-48 10 27-130 67" class="skin line"/></g>
 <g transform="translate(332,205)" filter="url(#sh)"><circle cx="63" cy="58" r="37" class="skin2 line"/><path d="M27 58q5-39 36-41 36 2 38 42-18-12-35-22-13 14-38 21z" class="hair line"/><path d="M36 91q-22 35-19 101h94q2-62-25-100z" fill="#f1f4f5" class="line"/><rect x="85" y="112" width="94" height="68" rx="7" fill="#253844" class="line"/><rect x="96" y="123" width="72" height="44" fill="#78cfe4"/></g>
 <g fill="#f3d1b3" stroke="#2a2422" stroke-width="3"><circle cx="450" cy="355" r="29"/><circle cx="548" cy="368" r="27"/><circle cx="640" cy="347" r="28"/></g><g fill="#382d2b"><path d="M420 351q8-35 31-32 22 2 28 32-30-17-59 0z"/><path d="M521 364q7-32 28-30 20 2 25 30-26-15-53 0z"/><path d="M611 343q8-34 30-32 22 2 27 32-28-16-57 0z"/></g>
 <rect x="18" y="16" width="365" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">아이들과 함께 시민 해양조사 수업을 시작합니다.</text><text x="31" y="73" class="txt zh">我们和孩子们一起开始公民海洋调查课。</text><text x="31" y="100" class="txt en">We begin a citizen-ocean survey with the next generation.</text>
 <rect x="405" y="18" width="318" height="112" rx="54" class="sp"/><text x="564" y="48" text-anchor="middle" class="txt ko">오늘은 바다를 직접 측정해 볼 거예요!</text><text x="564" y="77" text-anchor="middle" class="txt zh">今天我们亲手测量海洋！</text><text x="564" y="104" text-anchor="middle" class="txt en">Today, we measure the ocean ourselves!</text><text x="480" y="397" class="sfx" font-size="45" fill="#2dc8ff">READY!</text>
</g>
<!-- PANEL 2 sampling -->
<g transform="translate(774,80)">
 <rect class="p" width="748" height="424" rx="8" fill="url(#sea)"/><path d="M0 340q110-52 220-20t210-4 318 12v96H0z" fill="#27505b"/>
 <g opacity=".28" fill="#dcfaff"><circle cx="85" cy="63" r="8"/><circle cx="127" cy="42" r="5"/><circle cx="352" cy="70" r="7"/><circle cx="614" cy="56" r="9"/></g>
 <g transform="translate(94,132)" filter="url(#sh)"><path d="M44 89q-21 46-18 117h104q3-70-24-116z" fill="#0f1b24" class="line"/><circle cx="78" cy="59" r="39" class="skin line"/><path d="M40 60q5-41 38-42 37 2 40 43-20-13-37-23-14 15-40 22z" class="hair line"/><rect x="45" y="47" width="68" height="30" rx="11" fill="#8edaf0" opacity=".76" stroke="#0d1b22" stroke-width="4"/><rect x="18" y="89" width="19" height="88" rx="9" fill="#d8dfe4" class="line"/><path d="M108 135l124 26-7 27-124-14" class="skin line"/><rect x="221" y="145" width="34" height="72" rx="7" fill="#f5fbff" class="line"/><rect x="226" y="178" width="24" height="31" fill="#76d6ea"/></g>
 <g transform="translate(435,173)" filter="url(#sh)"><circle cx="66" cy="56" r="36" class="skin2 line"/><path d="M31 57q5-38 35-40 35 2 38 41-18-12-34-21-13 13-38 20z" class="hair2 line"/><path d="M40 89q-20 34-18 94h90q2-57-24-93z" fill="#f0f5f7" class="line"/><path d="M91 125l92 17-5 25-94-8" class="skin2 line"/><rect x="171" y="126" width="62" height="47" rx="6" fill="#263944" class="line"/><rect x="179" y="134" width="46" height="30" fill="#72cade"/></g>
 <path d="M336 248q30-19 61 0l-20 55h-47z" fill="#e8f7fa" class="line"/><path d="M343 273h42" stroke="#54cbe1" stroke-width="12"/><text x="364" y="326" text-anchor="middle" class="txt" font-size="16" fill="#fff">SAMPLE A-17</text>
 <rect x="18" y="16" width="365" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">수질과 미세플라스틱 샘플을 같은 지점에서 기록합니다.</text><text x="31" y="73" class="txt zh">我们在同一地点记录水质和微塑料样本。</text><text x="31" y="100" class="txt en">We log water quality and microplastic samples at one site.</text>
 <rect x="410" y="18" width="312" height="112" rx="54" class="sp"/><text x="566" y="48" text-anchor="middle" class="txt ko">병 번호와 위치를 꼭 같이 적어!</text><text x="566" y="77" text-anchor="middle" class="txt zh">瓶号和位置一定要一起记录！</text><text x="566" y="104" text-anchor="middle" class="txt en">Record the bottle number and location together!</text><text x="515" y="393" class="sfx" font-size="49" fill="#62e8ff">SAMPLE!</text>
</g>
<!-- PANEL 3 data map -->
<g transform="translate(14,518)">
 <rect class="p" width="748" height="490" rx="8" fill="url(#lab)"/><rect x="42" y="132" width="664" height="302" rx="16" fill="#eaf6f8" class="line"/>
 <rect x="68" y="159" width="362" height="244" rx="9" fill="#0e3349" class="line"/><path d="M95 337q55-104 111-66t86-62 109-4" fill="none" stroke="#7bdcf1" stroke-width="8"/><circle cx="206" cy="271" r="12" fill="#ffcf5b"/><circle cx="292" cy="209" r="12" fill="#ff6d5d"/><circle cx="383" cy="205" r="12" fill="#62e3a5"/><text x="92" y="190" class="tag" font-size="22" fill="#fff">FTF OCEAN MAP</text><text x="92" y="380" class="txt" font-size="15" fill="#c9f5ff">A-17 · microplastic count ↓ 31%</text>
 <rect x="462" y="160" width="214" height="116" rx="9" fill="#fff" class="line"/><text x="481" y="191" class="txt" font-size="17">HOTSPOT B-04</text><text x="481" y="221" class="txt" font-size="15">Plastic fragments: HIGH</text><text x="481" y="250" class="txt" font-size="15">Next action: targeted cleanup</text><rect x="462" y="294" width="214" height="109" rx="9" fill="#fff" class="line"/><text x="481" y="326" class="txt" font-size="16">TREND</text><path d="M487 374l42-23 38 6 46-48 37 12" fill="none" stroke="#1998bd" stroke-width="6"/><circle cx="613" cy="309" r="7" fill="#1998bd"/>
 <g transform="translate(48,40)" filter="url(#sh)"><circle cx="65" cy="57" r="37" class="skin line"/><path d="M29 58q5-39 36-41 36 2 38 42-18-12-35-22-13 14-38 21z" class="hair2 line"/><path d="M39 90q-21 35-18 96h91q2-59-25-95z" class="ftf line"/></g><g transform="translate(600,46)" filter="url(#sh)"><circle cx="60" cy="54" r="34" class="skin2 line"/><path d="M27 55q5-36 33-38 33 2 36 39-17-11-32-20-12 12-36 19z" class="hair line"/><path d="M36 84q-19 32-17 87h84q2-53-23-86z" fill="#f2f5f7" class="line"/></g>
 <rect x="18" y="16" width="378" height="103" rx="8" class="b"/><text x="31" y="43" class="txt ko">측정한 데이터를 지도에 올리니 다음 행동이 보입니다.</text><text x="31" y="70" class="txt zh">把数据放到地图上，下一步行动就清晰了。</text><text x="31" y="96" class="txt en">Mapping the data reveals exactly where to act next.</text><text x="484" y="466" class="sfx" font-size="48" fill="#1fbde9">DATA CHECK!</text>
</g>
<!-- PANEL 4 targeted return and hopeful dawn -->
<g transform="translate(774,518)">
 <rect class="p" width="748" height="490" rx="8" fill="url(#dawn)"/><circle cx="601" cy="104" r="52" fill="#fff2b7" opacity=".93"/><path d="M0 270q102-38 204 0t204 0 190 0 150 0v220H0z" fill="#285e77" opacity=".88"/><path d="M0 352q110-28 220 0t220 0 308 0v138H0z" fill="#d5ad78"/>
 <g transform="translate(85,207)" filter="url(#sh)"><path d="M51 99Q20 130 22 204h121q3-73-40-104z" class="ftf line"/><circle cx="85" cy="67" r="44" class="skin line"/><path d="M43 68q5-47 42-48 42 2 45 49-21-14-40-27-16 17-46 26z" class="hair2 line"/><path d="M48 34q33-23 75-2l-6-22q-33-19-62 0z" fill="#155f92" class="line"/><text x="85" y="26" text-anchor="middle" class="tag" font-size="12" fill="#fff">FTF</text></g>
 <g transform="translate(300,230)" filter="url(#sh)"><circle cx="61" cy="55" r="35" class="skin2 line"/><path d="M27 56q5-37 34-39 34 2 36 40-17-12-33-21-12 13-36 20z" class="hair line"/><path d="M37 87q-20 34-18 91h87q2-56-23-90z" fill="#f2f5f7" class="line"/></g>
 <g transform="translate(515,238)" filter="url(#sh)"><circle cx="58" cy="52" r="33" class="skin line"/><path d="M25 53q5-35 33-37 32 2 35 38-16-11-31-20-12 12-36 19z" class="hair2 line"/><path d="M35 82q-18 31-17 84h82q2-51-22-83z" fill="#f2f5f7" class="line"/></g>
 <g transform="translate(500,102)"><ellipse cx="80" cy="55" rx="54" ry="33" fill="#769a69" class="line"/><path d="M33 54q-36-29-55-5 23 21 55 27M125 52q38-31 59-6-23 22-58 28" fill="#7fa970" class="line"/><circle cx="132" cy="52" r="19" fill="#8db079" class="line"/><circle cx="139" cy="47" r="3"/></g>
 <rect x="18" y="16" width="378" height="112" rx="8" class="b"/><text x="31" y="44" class="txt ko">데이터가 가리킨 곳으로 돌아와 더 정확하게 지킵니다.</text><text x="31" y="73" class="txt zh">我们回到数据指向的地方，进行更精准的守护。</text><text x="31" y="100" class="txt en">We return where the data points and protect with precision.</text>
 <rect x="410" y="18" width="312" height="112" rx="54" class="sp"/><text x="566" y="48" text-anchor="middle" class="txt ko">기록하면, 바다가 어떻게 좋아지는지 보여요!</text><text x="566" y="77" text-anchor="middle" class="txt zh">记录下来，就能看见海洋正在变好！</text><text x="566" y="104" text-anchor="middle" class="txt en">When we record it, we can see the ocean healing!</text><text x="455" y="463" class="sfx" font-size="44" fill="#fff">MEASURE · ACT · PROTECT!</text>
</g>
</svg>