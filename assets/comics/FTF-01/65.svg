<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 #65 — 산호 복원, 함께 지키는 바다</title>
<desc id="desc">Four-panel cinematic manga scene in strict continuation of FTF-01. Marine researchers confirm stabilized reef temperatures, divers restore a coral nursery with real illustrated people and equipment, turtles and reef fish return, and the team closes with a shared ocean-protection promise. Korean Chinese English captions, speech bubbles, narration boxes, visual sound effects, story-specific coral reef imagery.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65c7f3"/><stop offset=".55" stop-color="#dff8ff"/><stop offset="1" stop-color="#ffc47c"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#19b9d9"/><stop offset=".45" stop-color="#08769a"/><stop offset="1" stop-color="#033249"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c98bc"/><stop offset=".5" stop-color="#075f80"/><stop offset="1" stop-color="#022b3f"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".35"/></filter>
 <style>
 .p{stroke:#081b29;stroke-width:10}.box{fill:#fffdf6;stroke:#132d3c;stroke-width:4}.bubble{fill:#fff;stroke:#102938;stroke-width:4}.ko{font:700 23px 'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#101820}.zh{font:600 18px 'Noto Sans SC','Microsoft YaHei',Arial,sans-serif;fill:#17485e}.en{font:600 17px Arial,sans-serif;fill:#15303d}.sfx{font:900 42px Impact,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}.skin{fill:#e8ad83;stroke:#704733;stroke-width:2}.hair{fill:#15232e}.suit{fill:#103f5d;stroke:#062b40;stroke-width:4}.reefA{fill:#ef776e;stroke:#7c3131;stroke-width:3}.reefB{fill:#e9c958;stroke:#7c6722;stroke-width:3}.reefC{fill:#9f82df;stroke:#50407c;stroke-width:3}.reefD{fill:#60c89c;stroke:#286f57;stroke-width:3}
 </style>
</defs>
<!-- PANEL 1: DATA TO ACTION -->
<g><rect class="p" x="4" y="4" width="760" height="500" fill="url(#sky)"/><path d="M4 336Q150 300 320 340T760 316V500H4Z" fill="#0b8dae"/><path d="M520 250q42-73 88-44q29 18 49 48q42-33 103-4v82H520Z" fill="#5b9d70"/>
<g transform="translate(48 205)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="50" rx="39" ry="43"/><path class="hair" d="M17 46Q24 4 60 5q40 3 42 46q-22-14-42-11q-21 3-43 6"/><path class="suit" d="M3 101q53-24 105 7l18 133H-6Z"/><path d="M24 17h69l16 18H12Z" fill="#173f58"/><text x="23" y="157" font-size="17" font-weight="900" fill="#eaffff">OCEAN</text></g>
<g transform="translate(208 211)" filter="url(#shadow)"><ellipse class="skin" cx="57" cy="50" rx="38" ry="42"/><path class="hair" d="M18 45Q22 8 56 4q41 3 43 43q-22-12-41-9q-20 2-40 7"/><path d="M4 101q51-22 102 7l17 132H-5Z" fill="#1b5069" stroke="#062b40" stroke-width="4"/><path d="M99 129q79 7 148 48" stroke="#e8ad83" stroke-width="15" fill="none" stroke-linecap="round"/></g>
<g transform="translate(432 244)" filter="url(#shadow)"><rect width="286" height="176" rx="14" fill="#edf8f3" stroke="#173b49" stroke-width="6"/><rect x="17" y="20" width="252" height="119" rx="8" fill="#0b3447"/><path d="M33 104L66 91l30 5 33-23 34 8 31-15 40 4" fill="none" stroke="#6fe099" stroke-width="7"/><text x="44" y="50" font-size="18" font-weight="900" fill="#fff">REEF TEMP STABLE</text><text x="44" y="79" font-size="24" font-weight="900" fill="#a6ffbc">27.3°C</text><text x="44" y="112" font-size="16" fill="#8bd8ff">RESTORATION WINDOW</text><text x="66" y="165" font-size="18" font-weight="900" fill="#17445b">REEF MONITOR</text></g>
<rect class="box" x="18" y="18" width="487" height="139" rx="8"/><text x="38" y="50" class="ko">수온이 안정되고 산호의 반응도 좋아졌습니다.</text><text x="38" y="82" class="ko">이제 복원 작업을 본격적으로 시작합니다.</text><text x="38" y="112" class="zh">水温趋于稳定，珊瑚状态改善。现在开始正式修复。</text><text x="38" y="142" class="en">Temperatures are stable. The reef is ready for restoration.</text>
<path class="bubble" d="M512 40h225q15 0 15 15v112q0 15-15 15H626l-28 28 7-28h-93q-15 0-15-15V55q0-15 15-15Z"/><text x="530" y="80" class="ko">데이터가 희망을 보여줘요!</text><text x="530" y="114" class="zh">数据给了我们希望！</text><text x="530" y="148" class="en">The data gives us hope!</text><text x="28" y="471" class="sfx" fill="#28aee4">DATA TO ACTION!</text></g>
<!-- PANEL 2: CORAL NURSERY -->
<g transform="translate(768 0)"><rect class="p" x="4" y="4" width="764" height="500" fill="url(#deep)"/><g opacity=".22" stroke="#eaffff" stroke-width="5"><path d="M80 0L24 250M260 0L160 280M500 0L365 300M730 0L580 290"/></g><path d="M4 396Q165 342 333 391T760 363V500H4Z" fill="#786e59"/>
<g transform="translate(72 170)" filter="url(#shadow)"><ellipse class="skin" cx="58" cy="50" rx="39" ry="43"/><rect x="18" y="40" width="80" height="32" rx="13" fill="#cdf5ff" stroke="#153947" stroke-width="4"/><path class="suit" d="M5 98q51-22 103 7l18 134H-5Z"/><path d="M104 126q87 10 157 62" stroke="#e8ad83" stroke-width="15" fill="none" stroke-linecap="round"/></g>
<g transform="translate(300 184)" filter="url(#shadow)"><ellipse class="skin" cx="57" cy="50" rx="38" ry="42"/><rect x="17" y="40" width="79" height="32" rx="13" fill="#cdf5ff" stroke="#153947" stroke-width="4"/><path d="M4 99q51-22 102 7l18 133H-5Z" fill="#27536b" stroke="#062b40" stroke-width="4"/></g>
<g transform="translate(425 316)"><path d="M0 80h280M18 80v110M91 80v110M165 80v110M240 80v110" stroke="#dce9e5" stroke-width="10"/><path class="reefA" d="M18 80q-8-42 20-65q0 34 17 27q8-40 30-52q-5 42 11 44q17-31 35-35q-9 41-1 76Z"/><path class="reefB" d="M107 81q-7-41 20-63q0 33 17 26q8-39 29-50q-5 40 11 42q16-29 34-34q-9 40-1 73Z"/><path class="reefC" d="M197 80q-7-39 19-60q0 31 16 25q7-37 27-48q-4 38 11 40q15-28 32-32q-8 37-1 70Z"/></g>
<rect class="box" x="18" y="18" width="485" height="139" rx="8"/><text x="38" y="50" class="ko">잠수팀이 보육틀에 어린 산호를 조심스럽게 고정합니다.</text><text x="38" y="82" class="ko">작은 산호 하나가 새로운 산호숲의 시작입니다.</text><text x="38" y="112" class="zh">潜水员将幼珊瑚固定在育苗架上，每一株都是新的开始。</text><text x="38" y="142" class="en">Each nursery coral can become the start of a new reef forest.</text>
<path class="bubble" d="M511 42h229q14 0 14 15v110q0 15-14 15H628l-26 28 5-28h-96q-14 0-14-15V57q0-15 14-15Z"/><text x="529" y="80" class="ko">천천히, 흔들리지 않게!</text><text x="529" y="114" class="zh">慢一点，固定好！</text><text x="529" y="148" class="en">Slowly — keep it secure!</text><text x="385" y="467" class="sfx" fill="#ffd338">PLANT! GROW! TOGETHER!</text></g>
<!-- PANEL 3: LIFE RETURNS -->
<g transform="translate(0 512)"><rect class="p" x="4" y="4" width="760" height="508" fill="url(#sea)"/><path d="M4 382Q145 333 319 379T760 352V508H4Z" fill="#6f6957"/>
<g transform="translate(42 282)"><path class="reefA" d="M20 170q-9-67 29-101q0 54 25 42q11-61 42-79q-7 64 17 68q25-47 53-53q-14 62-2 114Z"/><path class="reefB" d="M130 178q-10-70 31-107q0 57 26 44q12-64 44-82q-8 67 17 70q25-49 55-56q-15 65-2 121Z"/><path class="reefC" d="M280 177q-8-65 28-98q0 52 23 41q10-59 40-76q-6 61 16 64q23-44 50-51q-13 60-2 111Z"/></g>
<g transform="translate(175 160)" filter="url(#shadow)"><path d="M0 32q56-47 126-6q-28 3-46 21q22 3 33 17q-61 17-113-5q-24 13-42 2q16-15 42-29Z" fill="#e6a246" stroke="#6a4b19" stroke-width="4"/><circle cx="91" cy="30" r="4" fill="#111"/></g>
<g transform="translate(360 130)" filter="url(#shadow)"><ellipse cx="92" cy="63" rx="91" ry="45" fill="#7d9f6a" stroke="#334a35" stroke-width="5"/><ellipse cx="88" cy="62" rx="55" ry="39" fill="#b7a36c" stroke="#564d33" stroke-width="4"/><path d="M18 57L-36 29L0 83M163 52l55-35l-28 57M62 100l-29 57l51-38M121 101l32 55l-55-36" fill="#799f75" stroke="#334a35" stroke-width="4"/><circle cx="171" cy="45" r="17" fill="#7d9f6a" stroke="#334a35" stroke-width="4"/><circle cx="177" cy="41" r="3"/></g>
<g fill="#ffd760" stroke="#7a5d18" stroke-width="3"><path d="M80 235q35-30 76 0q-41 32-76 0m0 0l-24-17v34Z"/><path d="M570 260q35-30 76 0q-41 32-76 0m0 0l-24-17v34Z"/><path d="M612 176q28-24 61 0q-33 27-61 0m0 0l-20-14v28Z"/></g>
<rect class="box" x="18" y="18" width="430" height="139" rx="8"/><text x="38" y="50" class="ko">며칠 뒤, 물고기와 거북이가 다시 보육장 주변으로 모입니다.</text><text x="38" y="82" class="ko">회복되는 산호초에 생명이 돌아옵니다.</text><text x="38" y="112" class="zh">几天后，鱼群和海龟重新回到修复区，生命正在归来。</text><text x="38" y="142" class="en">Fish and turtles return as the restored reef comes alive.</text>
<path class="bubble" d="M468 34h270q14 0 14 15v111q0 15-14 15H613l-26 28 6-28H468q-14 0-14-15V49q0-15 14-15Z"/><text x="488" y="73" class="ko">봐요! 정말 돌아왔어요!</text><text x="488" y="108" class="zh">快看！它们真的回来了！</text><text x="488" y="143" class="en">Look! They really came back!</text><text x="27" y="476" class="sfx" fill="#59dcf5">MORE LIFE! BRIGHTER OCEAN!</text></g>
<!-- PANEL 4: SHARED PROMISE -->
<g transform="translate(768 512)"><rect class="p" x="4" y="4" width="764" height="508" fill="url(#sky)"/><path d="M4 338Q170 302 345 344T760 317V508H4Z" fill="#0b7897"/><circle cx="652" cy="126" r="74" fill="#ffd56f" opacity=".9"/>
<g transform="translate(65 198)" filter="url(#shadow)"><ellipse class="skin" cx="56" cy="48" rx="37" ry="41"/><path class="hair" d="M18 45Q22 6 56 5q39 2 41 42q-22-12-40-9q-20 2-39 7"/><path class="suit" d="M5 98q49-22 99 7l17 135H-5Z"/></g><g transform="translate(215 193)" filter="url(#shadow)"><ellipse class="skin" cx="57" cy="49" rx="38" ry="42"/><path class="hair" d="M17 45Q21 5 58 4q41 3 42 44q-22-13-41-10q-21 2-42 7"/><path d="M4 100q51-23 102 7l17 134H-5Z" fill="#28556d" stroke="#062b40" stroke-width="4"/></g><g transform="translate(372 200)" filter="url(#shadow)"><ellipse class="skin" cx="57" cy="49" rx="38" ry="42"/><path class="hair" d="M17 46Q23 7 57 5q40 3 42 43q-21-13-41-10q-20 2-41 8"/><path class="suit" d="M4 100q51-23 103 7l17 134H-5Z"/></g><g transform="translate(524 197)" filter="url(#shadow)"><ellipse class="skin" cx="56" cy="49" rx="37" ry="42"/><path class="hair" d="M17 45Q22 5 56 4q40 3 42 44q-21-13-40-10q-20 2-41 7"/><path d="M4 100q50-23 101 7l17 134H-5Z" fill="#1b5069" stroke="#062b40" stroke-width="4"/></g>
<path d="M135 348q171 61 337 3q85-29 167 6" fill="none" stroke="#e8ad83" stroke-width="22" stroke-linecap="round"/><circle cx="353" cy="357" r="28" fill="#e8ad83" stroke="#704733" stroke-width="3"/>
<rect class="box" x="18" y="18" width="478" height="139" rx="8"/><text x="38" y="50" class="ko">우리가 지킨 바다가 더 많은 생명을 품을 것입니다.</text><text x="38" y="82" class="ko">작은 행동을 이어 가는 것이 우리의 약속입니다.</text><text x="38" y="112" class="zh">我们守护的海洋会孕育更多生命，坚持行动就是我们的约定。</text><text x="38" y="142" class="en">The ocean we protect will support more life. This is our promise.</text>
<path class="bubble" d="M506 42h235q14 0 14 15v111q0 15-14 15H628l-26 28 5-28H506q-14 0-14-15V57q0-15 14-15Z"/><text x="525" y="80" class="ko">함께 지키면 바다는 살아납니다!</text><text x="525" y="114" class="zh">一起守护，海洋就会重获生机！</text><text x="525" y="148" class="en">Together, we bring the ocean back!</text>
<text x="39" y="466" class="sfx" fill="#1f9fd0">CLEAN OCEAN! HEALTHY REEFS!</text><text x="557" y="486" font-size="28" font-weight="900" fill="#fff">FTF-01 #65</text></g>
</svg>