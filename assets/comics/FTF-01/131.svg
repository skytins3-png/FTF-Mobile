 <rect x="796" y="103" width="473" height="114" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1032" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1032">시험 구간에는 저마모 타이어 차량과 저속 운행 구역을 함께 적용한다.</tspan><tspan x="1032" dy="24" font-size="14">试验路段同时采用低磨耗轮胎与低速行驶区。</tspan><tspan x="1032" dy="22" font-size="13">The pilot street pairs low-wear tires with a lower-speed zone.</tspan></text>
 <rect x="1280" y="103" width="215" height="94" rx="22" fill="#eaffdb" stroke="#111" stroke-width="4"/>
 <text x="1387" y="133" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1387">마찰 자체를 줄여!</tspan><tspan x="1387" dy="21" font-size="13">先减少磨耗！</tspan><tspan x="1387" dy="19" font-size="12">Reduce wear itself!</tspan></text>
 <text x="801" y="486" fill="#fff" stroke="#4a5a18" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">ROLL!  SLOW!  SHED LESS!</text>
</g>

