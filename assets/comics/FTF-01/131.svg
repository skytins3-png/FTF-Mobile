 <rect x="36" y="102" width="477" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="274" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="274">포집만으로는 끝이 아니다. 처음부터 덜 닳는 타이어를 고른다.</tspan><tspan x="274" dy="24" font-size="14">不能只靠拦截，要从源头选择更耐磨的轮胎材料。</tspan><tspan x="274" dy="22" font-size="13">Capture is not enough. Choose compounds that shed less from the start.</tspan></text>
 <rect x="520" y="103" width="214" height="90" rx="22" fill="#fff1bd" stroke="#111" stroke-width="4"/>
 <text x="627" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="627">성능은 유지, 먼지는 감소!</tspan><tspan x="627" dy="21" font-size="13">性能不降，颗粒更少！</tspan><tspan x="627" dy="19" font-size="12">Grip stays. Dust drops.</tspan></text>
 <text x="40" y="486" fill="#fff" stroke="#0d5d76" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">TEST!  SPIN!  CUT THE SHED!</text>
</g>

