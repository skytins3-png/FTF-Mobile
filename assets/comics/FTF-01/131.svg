 <rect x="38" y="544" width="479" height="113" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="277" y="574" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="277">남은 빗물은 식생도랑과 투수성 포장으로 천천히 걸러 바다로 보낸다.</tspan><tspan x="277" dy="24" font-size="14">剩余雨水经植草沟与透水铺装缓慢过滤后再入海。</tspan><tspan x="277" dy="22" font-size="13">Bioswales and permeable paving filter what remains before it reaches the sea.</tspan></text>
 <text x="43" y="982" fill="#fff" stroke="#185e44" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">SWISH!  SOAK!  FILTER!</text>
</g>

