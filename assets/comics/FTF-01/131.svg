 <text x="1110" y="879" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="16" font-weight="900"><tspan x="1110">잡는 것보다 더 좋은 건</tspan><tspan x="1110" dy="23">처음부터 덜 만드는 것!</tspan><tspan x="1110" dy="24" font-size="13">比拦截更好的是从源头少产生。</tspan><tspan x="1110" dy="21" font-size="12">The best particle is the one never shed.</tspan></text>
 <text x="797" y="989" fill="#fff" stroke="#08718c" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="31" font-weight="900">CUT AT THE SOURCE · CLEANER STREET · CLEANER SEA!</text>
