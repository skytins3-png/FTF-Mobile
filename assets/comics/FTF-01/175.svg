<!-- B worker --> <g transform="translate(606 850)" filter="url(#sh)"><ellipse cy="-96" rx="30" ry="37" fill="#c88f70" stroke="#102631" stroke-width="4"/><path d="M-29-108q10-25 29-28q22 2 29 24l-15-5q-20 1-43 9" fill="#1f292e"/><rect x="-51" y="-50" width="102" height="123" rx="20" fill="#2f8d83" stroke="#102631" stroke-width="4"/><path d="M-40-13h80" stroke="#b7eee0" stroke-width="11"/><path d="M-39-17l-71-24" stroke="#2f8d83" stroke-width="19" stroke-linecap="round"/><path d="M-24 72v72M24 72v72" stroke="#263941" stroke-width="21"/><circle cx="-31" cy="-98" r="8" fill="#1c2e36"/><path d="M-35-94l-25 17" stroke="#172a31" stroke-width="5"/></g>
<!-- radios --> <g transform="translate(235 744)"><rect x="-27" y="-43" width="54" height="86" rx="8" fill="#d66f28" stroke="#162932" stroke-width="4"/><path d="M14-44l8-34" stroke="#111" stroke-width="6"/><text x="0" y="11" text-anchor="middle" class="tiny" fill="#fff">A-RADIO</text></g><g transform="translate(528 744)"><rect x="-27" y="-43" width="54" height="86" rx="8" fill="#1a7f79" stroke="#162932" stroke-width="4"/><path d="M14-44l8-34" stroke="#111" stroke-width="6"/><text x="0" y="11" text-anchor="middle" class="tiny" fill="#fff">B-RADIO</text></g>
<text x="44" y="986" class="sfx">QUARANTINE R-2!  ZONE RADIO!  VOICE ONLY!</text></g>
<!-- P4 -->
<g><rect x="774" y="524" width="746" height="484" rx="12" fill="#173c4b"/><rect x="792" y="544" width="710" height="111" rx="18" class="box"/><text x="1147" y="573" text-anchor="middle" class="t cap"><tspan x="1147">24시간, 비상통신 8회 검증. 무전기 경계 이동 0회, 이어피스 공유 0회, 접촉면 30/30 음성. 알람 대응시간도 유지된다.</tspan><tspan x="1147" dy="25" font-size="14">24小时验证8次应急通信：对讲机跨区0次、耳机共用0次、接触面30/30阴性，响应时间不变。</tspan><tspan x="1147" dy="22" font-size="13">24-hour test: 8 emergency calls, zero radio crossings, zero shared earpieces, 30/30 contact surfaces negative, response time preserved.</tspan></text>
<!-- dashboard --> <rect x="824" y="687" width="425" height="232" rx="19" fill="url(#screen)" stroke="#a5d8e8" stroke-width="5" filter="url(#sh)"/><text x="1036" y="722" text-anchor="middle" class="t" font-size="21" font-weight="900" fill="#d8f8ff">COMMUNICATION BIOSECURITY / 24H</text><text x="858" y="770" class="t" font-size="18" font-weight="900" fill="#fff">Emergency calls</text><text x="1207" y="770" text-anchor="end" class="t" font-size="24" font-weight="1000" fill="#63efb0">8/8</text><text x="858" y="813" class="t" font-size="18" font-weight="900" fill="#fff">Radio crossings</text><text x="1207" y="813" text-anchor="end" class="t" font-size="24" font-weight="1000" fill="#63efb0">0</text><text x="858" y="856" class="t" font-size="18" font-weight="900" fill="#fff">Shared earpieces</text><text x="1207" y="856" text-anchor="end" class="t" font-size="24" font-weight="1000" fill="#63efb0">0</text><text x="858" y="899" class="t" font-size="18" font-weight="900" fill="#fff">Contact swabs</text><text x="1207" y="899" text-anchor="end" class="t" font-size="24" font-weight="1000" fill="#63efb0">30/30 NEG</text>
<!-- commander --> <g transform="translate(1370 872)" filter="url(#sh)"><ellipse cy="-105" rx="34" ry="41" fill="#d9a47f" stroke="#07151c" stroke-width="4"/><path d="M-34-117q10-29 34-31q26 2 34 27l-17-6q-24 0-51 10" fill="#252a2e"/><rect x="-60" y="-59" width="120" height="140" rx="25" fill="#304f5c" stroke="#081820" stroke-width="5"/><path d="M-46-17h92" stroke="#74b5c9" stroke-width="12"/><path d="M-49-29l-69 45" stroke="#304f5c" stroke-width="22" stroke-linecap="round"/><path d="M-27 79l-9 77M27 79l9 77" stroke="#1e3038" stroke-width="24"/></g><path d="M1269 678h211q14 0 14 14v70q0 14-14 14h-116l-30 25 8-25h-73q-14 0-14-14v-70q0-14 14-14z" class="bub"/><text x="1375" y="706" text-anchor="middle" class="t" font-size="14" font-weight="900"><tspan x="1375">규칙은 단순하다.</tspan><tspan x="1375" dy="19">사람·종이·전원·무전기까지</tspan><tspan x="1375" dy="19">경계는 넘지 않는다.</tspan></text><text x="802" y="985" class="sfx">8/8 CALLS!  ZERO CROSSING!  30/30 NEGATIVE!</text></g>
</svg>