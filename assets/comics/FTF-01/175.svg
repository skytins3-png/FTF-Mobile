<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 175 identifies a shared emergency radio and earpiece as a cross-zone contamination route and replaces them with zone-dedicated radios and a contactless relay protocol">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#06131f"/><stop offset=".58" stop-color="#23495c"/><stop offset="1" stop-color="#7f9ca5"/></linearGradient>
 <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#becbd0"/><stop offset="1" stop-color="#647d87"/></linearGradient>
 <linearGradient id="lab" x2="1" y2="1"><stop stop-color="#dce8ea"/><stop offset="1" stop-color="#91aeb6"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#113f52"/><stop offset="1" stop-color="#03161f"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".42"/></filter>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.t{font-family:Arial,'Malgun Gothic',sans-serif}.cap{font-size:17px;font-weight:900;fill:#10232b}.tiny{font-family:Arial,'Malgun Gothic',sans-serif;font-size:12px;font-weight:900}.box{fill:#fff;stroke:#17323d;stroke-width:4}.bub{fill:#fff;stroke:#10242d;stroke-width:4}.sfx{font-family:Arial,'Malgun Gothic',sans-serif;font-size:22px;font-weight:1000;fill:#fff26d;stroke:#081820;stroke-width:2;paint-order:stroke}</style>
</defs>
<rect width="1536" height="1024" fill="#061019"/>
<rect x="12" y="12" width="1512" height="60" rx="12" fill="#173f59"/>
<text x="28" y="50" class="t" fill="#fff" font-size="29" font-weight="900">FTF-01 #175  목소리는 넘어가도 장비는 넘지 않는다 — 공용 무전기 차단</text>
<text x="1040" y="49" class="t" fill="#d7f5ff" font-size="16" font-weight="800">RADIO TRACE · ZONE LOCK · CONTACTLESS RELAY</text>
<!-- P1 -->
<g><rect x="16" y="84" width="746" height="428" rx="12" fill="url(#night)"/><rect x="16" y="355" width="746" height="157" fill="url(#deck)"/><path d="M388 208v304" stroke="#f2d64f" stroke-width="10" stroke-dasharray="23 12"/><text x="403" y="493" class="tiny" fill="#243b44">BIOSECURITY LINE</text>
<g opacity=".55" stroke="#d7ecf3" stroke-width="3"><path d="M52 92L0 195M120 90L62 206M188 92L128 210M612 90l-61 121M684 91l-58 119"/></g>
<rect x="40" y="103" width="664" height="111" rx="18" class="box"/><text x="372" y="132" text-anchor="middle" class="t cap"><tspan x="372">05:26. 종이 인계까지 막힌 뒤, B구역에서 배관 압력 알람이 다시 울린다. 책임자는 A구역 공용 비상무전기 R-2를 집어 든다.</tspan><tspan x="372" dy="25" font-size="14">05:26，纸质交接被封锁后，B区管线再次报警。负责人拿起A区共用应急对讲机R-2。</tspan><tspan x="372" dy="22" font-size="13">05:26 — another pressure alarm hits B-zone; the supervisor reaches for shared emergency radio R-2.</tspan></text>
<!-- human A --> <g transform="translate(255 414)" filter="url(#sh)"><ellipse cy="-101" rx="31" ry="38" fill="#d7a27e" stroke="#102631" stroke-width="4"/><path d="M-30-113q8-28 31-31q24 2 31 27l-18-6q-22 1-44 10" fill="#292d31"/><circle cx="-11" cy="-101" r="3"/><circle cx="12" cy="-101" r="3"/><rect x="-53" y="-57" width="106" height="132" rx="22" fill="#e38b35" stroke="#102631" stroke-width="4"/><path d="M-42-18h84" stroke="#f9d56d" stroke-width="12"/><path d="M45-27l95-30" stroke="#e38b35" stroke-width="20" stroke-linecap="round"/><path d="M-27 74l-8 76M27 74l9 76" stroke="#273b43" stroke-width="23"/></g>
<!-- radio --> <g transform="translate(410 336) rotate(-7)" filter="url(#sh)"><rect x="-38" y="-59" width="76" height="118" rx="10" fill="#172932" stroke="#071116" stroke-width="5"/><path d="M20-60l12-55" stroke="#111" stroke-width="8"/><rect x="-25" y="-42" width="50" height="31" rx="4" fill="#65b7af"/><circle cx="0" cy="24" r="18" fill="#273f49" stroke="#607781" stroke-width="4"/><path d="M-24 50h48" stroke="#84979d" stroke-width="4"/><path d="M38-12q42 10 51 44" stroke="#111" stroke-width="6" fill="none"/><circle cx="91" cy="36" r="15" fill="#1b2d34"/></g>
<path d="M441 230h254q14 0 14 14v62q0 14-14 14H583l-28 23 8-23H441q-14 0-14-14v-62q0-14 14-14z" class="bub"/><text x="569" y="257" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="569">무전으로만 말하면 괜찮겠지.</tspan><tspan x="569" dy="20" font-size="12">只用对讲说话就没事吧。 / Voice only should be safe.</tspan></text><text x="43" y="490" class="sfx">ALARM!  GRAB R-2!  RADIO CHECK!</text></g>
<!-- P2 -->
<g><rect x="774" y="84" width="746" height="428" rx="12" fill="url(#lab)"/><rect x="774" y="355" width="746" height="157" fill="url(#deck)"/><path d="M1149 210v302" stroke="#f0d44f" stroke-width="9" stroke-dasharray="22 12"/>
<rect x="798" y="103" width="666" height="111" rx="18" class="box"/><text x="1131" y="132" text-anchor="middle" class="t cap"><tspan x="1131">경계 스캐너가 R-2를 차단한다. PTT 버튼은 음성이지만 이어피스 고무와 벨트클립에서 TRACE+가 동시에 검출된다.</tspan><tspan x="1131" dy="25" font-size="14">边界扫描器拦下R-2。PTT按钮阴性，但耳机胶套和腰夹同时检测出TRACE+。</tspan><tspan x="1131" dy="22" font-size="13">The scanner stops R-2: PTT is negative, but the earpiece rubber and belt clip both test TRACE+.</tspan></text>
<!-- inspector --> <g transform="translate(935 416)" filter="url(#sh)"><ellipse cy="-91" rx="29" ry="36" fill="#e0ad88" stroke="#102631" stroke-width="4"/><path d="M-29-103q9-24 29-27q22 2 29 24l-15-5q-20 2-43 8" fill="#382d2a"/><rect x="-49" y="-45" width="98" height="117" rx="19" fill="#2f8d83" stroke="#102631" stroke-width="4"/><path d="M37-13l110-27" stroke="#2f8d83" stroke-width="18" stroke-linecap="round"/><path d="M-24 70v65M24 70v65" stroke="#263941" stroke-width="21"/></g>
<g transform="translate(1323 348)" filter="url(#sh)"><rect x="-112" y="-75" width="224" height="150" rx="15" fill="#eef3f4" stroke="#263b43" stroke-width="5"/><text x="0" y="-51" text-anchor="middle" class="tiny">R-2 CONTACT SWAB</text><text x="-82" y="-15" class="tiny">PTT</text><rect x="-30" y="-29" width="78" height="20" rx="8" fill="#b8d8cf"/><text x="85" y="-14" class="tiny" text-anchor="end" fill="#1d775e">NEG</text><text x="-82" y="20" class="tiny">EAR</text><rect x="-30" y="6" width="78" height="20" rx="8" fill="#ff786d" filter="url(#gl)"/><text x="85" y="21" class="tiny" text-anchor="end" fill="#c5302c">TRACE+</text><text x="-82" y="55" class="tiny">CLIP</text><rect x="-30" y="41" width="78" height="20" rx="8" fill="#ff786d" filter="url(#gl)"/><text x="85" y="56" class="tiny" text-anchor="end" fill="#c5302c">TRACE+</text></g>
<path d="M806 234h332q14 0 14 14v63q0 14-14 14H1005l-29 23 7-23H806q-14 0-14-14v-63q0-14 14-14z" class="bub"/><text x="972" y="261" text-anchor="middle" class="t" font-size="15" font-weight="900"><tspan x="972">목소리가 아니라, 귀와 허리에 닿는 장비가 문제야.</tspan><tspan x="972" dy="20" font-size="12">问题不是声音，是贴耳和腰部的设备。 / The voice is clean—the contact hardware isn't.</tspan></text><text x="802" y="490" class="sfx">BEEP!  HOLD R-2!  EAR TRACE+!  CLIP TRACE+!</text></g>
<!-- P3 -->
<g><rect x="16" y="524" width="746" height="484" rx="12" fill="#9fb3b8"/><rect x="16" y="820" width="746" height="188" fill="url(#deck)"/><rect x="40" y="544" width="665" height="111" rx="18" class="box"/><text x="372" y="573" text-anchor="middle" class="t cap"><tspan x="372">공용 R-2는 즉시 격리한다. A·B 구역에 색상 고정 무전기와 개인 이어피스를 배치하고, 경계에서는 음성만 중계한다.</tspan><tspan x="372" dy="25" font-size="14">立即隔离共用R-2。A/B区分别配置固定颜色对讲机和个人耳机，边界只中继语音。</tspan><tspan x="372" dy="22" font-size="13">Shared R-2 is quarantined; each zone gets dedicated radios and personal earpieces, with voice-only relay across the boundary.</tspan></text>
<!-- relay wall --> <rect x="301" y="676" width="160" height="214" rx="16" fill="#dce8ea" stroke="#244956" stroke-width="7" filter="url(#sh)"/><rect x="326" y="701" width="110" height="57" rx="8" fill="url(#screen)"/><text x="381" y="725" text-anchor="middle" class="tiny" fill="#a9edff">VOICE RELAY</text><text x="381" y="745" text-anchor="middle" class="tiny" fill="#65f0b5">LINK ONLY</text><circle cx="350" cy="797" r="19" fill="#23b77e"/><circle cx="412" cy="797" r="19" fill="#23b77e"/><path d="M381 758v118" stroke="#f2d64f" stroke-width="6" stroke-dasharray="12 8"/>
