<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">FTF-01 Scene 89 - 데이터가 찾은 숨은 오염</title>
<desc id="desc">Four-panel cinematic manga scene continuing the citizen-science storyline: community ocean-watch data reveals a microplastic hotspot, researchers map the current and trace the source, families and students clean the affected cove, and shorebirds return as the updated report turns evidence into action. Korean Chinese English narration, speech bubbles and visual sound effects.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#69c8fa"/><stop offset="1" stop-color="#eefbff"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20bce2"/><stop offset=".5" stop-color="#0878a8"/><stop offset="1" stop-color="#043b61"/></linearGradient>
 <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8fa"/><stop offset="1" stop-color="#cce7ef"/></linearGradient>
 <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe38c"/><stop offset=".48" stop-color="#ffad73"/><stop offset="1" stop-color="#7480ad"/></linearGradient>
 <style>.p{stroke:#071d2a;stroke-width:7}.box,.bub{fill:#fff;stroke:#071d2a;stroke-width:4}.ko{font:700 20px Arial,sans-serif;fill:#071d2a}.zh{font:600 15px Arial,sans-serif;fill:#173947}.en{font:600 15px Arial,sans-serif;fill:#274957}.fx{font:900 34px Impact,Arial,sans-serif;fill:#fff;stroke:#087bbb;stroke-width:7;paint-order:stroke}.skin{fill:#efbd98;stroke:#071d2a;stroke-width:3}.hair{fill:#2b1f1d;stroke:#071d2a;stroke-width:3}.ftf{fill:#184a67;stroke:#071d2a;stroke-width:3}.vest{fill:#f08b4c;stroke:#071d2a;stroke-width:3}.line{fill:none;stroke:#071d2a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.eye{fill:#071d2a}.tiny{font-size:13px}</style>
</defs>
<!-- PANEL 1: community lab detects hotspot -->
<g class="p"><rect x="4" y="4" width="584" height="386" fill="url(#lab)"/><rect x="28" y="31" width="529" height="329" rx="18" fill="#f9fcfd" stroke="#071d2a" stroke-width="5"/><rect x="245" y="87" width="274" height="195" rx="11" fill="#074f79" stroke="#071d2a" stroke-width="5"/><text x="264" y="116" font-family="Arial" font-size="18" font-weight="900" fill="#e8fbff">COMMUNITY OCEAN WATCH</text><text x="264" y="147" font-family="Arial" font-size="16" font-weight="800" fill="#8df0cf">Water clarity  +18%</text><text x="264" y="176" font-family="Arial" font-size="16" font-weight="800" fill="#8df0cf">Shore species   +11%</text><text x="264" y="205" font-family="Arial" font-size="16" font-weight="900" fill="#ff9d76">MICROPLASTIC HOTSPOT</text><text x="264" y="234" font-family="Arial" font-size="16" font-weight="800" fill="#ffd27d">Cove C-3  +46%</text><circle cx="484" cy="230" r="18" fill="#ff644f"/><circle cx="484" cy="230" r="32" fill="none" stroke="#ff8a73" stroke-width="5"/>
<!-- researcher --> <ellipse cx="139" cy="201" rx="30" ry="33" class="skin"/><path d="M111 194q8-46 40-29 24 12 20 39-28-11-60-10Z" class="hair"/><path d="M91 242q48-24 95 0l15 102H73Z" fill="#f5f9fb" stroke="#071d2a" stroke-width="4"/><circle cx="130" cy="201" r="4" class="eye"/><circle cx="151" cy="201" r="4" class="eye"/><path d="M157 247q52-33 103-51" class="line"/>
<!-- student --> <ellipse cx="214" cy="286" rx="24" ry="27" class="skin"/><path d="M191 280q8-36 32-23 19 9 16 30-21-9-48-7Z" class="hair"/><path d="M181 317q33-15 66 0l8 38h-82Z" class="vest"/>
<rect class="box" x="45" y="47" width="347" height="84" rx="9"/><text x="59" y="75" class="ko">어제의 기록이 오늘 숨은 오염 지점을 찾아냈습니다.</text><text x="59" y="98" class="zh">昨天的记录，今天找出了隐藏的污染点。</text><text x="59" y="121" class="en">Yesterday’s records reveal a hidden pollution hotspot today.</text>
<path class="bub" d="M74 142h294q14 0 14 14v67q0 14-14 14H252l-20 19 4-19H74q-14 0-14-14v-67q0-14 14-14Z"/><text x="89" y="171" class="ko">C-3만 수치가 갑자기 올랐어요!</text><text x="89" y="194" class="zh tiny">只有C-3的数据突然升高了！</text><text x="89" y="216" class="en tiny">Only C-3 suddenly spiked!</text><text x="365" y="335" class="fx" transform="rotate(-5 365 335)">ALERT!</text></g>
<!-- PANEL 2: trace source with map/drone -->
<g class="p"><rect x="596" y="4" width="600" height="386" fill="url(#sky)"/><path d="M596 240q130-31 265 0t335-4v154H596Z" fill="url(#sea)"/><path d="M596 322q91-25 173-8t160 1q131-24 267 9v66H596Z" fill="#d7bd8a"/>
<!-- drone --> <g stroke="#071d2a" stroke-width="4" fill="#e6eef2"><rect x="951" y="78" width="79" height="30" rx="10"/><path d="M964 93h-63M1017 93h63" class="line"/><circle cx="895" cy="93" r="26" fill="none"/><circle cx="1086" cy="93" r="26" fill="none"/><rect x="980" y="108" width="22" height="18" rx="4" fill="#152b36"/></g>
<!-- map tablet --> <rect x="769" y="164" width="184" height="121" rx="10" fill="#dff5fb" stroke="#071d2a" stroke-width="5"/><path d="M790 248q35-52 70-27t65-33" fill="none" stroke="#2c94bc" stroke-width="8"/><circle cx="904" cy="192" r="12" fill="#ff684e"/><text x="797" y="188" font-family="Arial" font-weight="900" font-size="15" fill="#17455f">CURRENT MAP</text><text x="897" y="218" font-family="Arial" font-weight="900" font-size="13" fill="#9b2f27">C-3</text>
<!-- field researcher --> <ellipse cx="710" cy="220" rx="29" ry="32" class="skin"/><path d="M683 214q7-44 38-28 23 12 20 39-27-11-58-11Z" class="hair"/><path d="M667 259q45-21 90 0l17 113H649Z" class="ftf"/><path d="M739 266q51-18 82-45" class="line"/>
<!-- student binoculars --> <ellipse cx="1061" cy="232" rx="25" ry="28" class="skin"/><path d="M1038 226q8-37 32-24 19 9 17 31-22-9-49-7Z" class="hair"/><path d="M1025 264q36-16 72 0l11 99h-94Z" class="vest"/><circle cx="1049" cy="223" r="9" fill="#1e2c34" stroke="#071d2a" stroke-width="3"/><circle cx="1074" cy="223" r="9" fill="#1e2c34" stroke="#071d2a" stroke-width="3"/><path d="M1058 223h7" class="line"/>
<rect class="box" x="615" y="24" width="341" height="87" rx="9"/><text x="630" y="52" class="ko">조류 지도와 드론으로 오염이 흘러온 길을 따라갑니다.</text><text x="630" y="76" class="zh">利用海流图和无人机追踪污染物的来路。</text><text x="630" y="100" class="en">Current maps and a drone trace the route the pollution traveled.</text>
<path class="bub" d="M827 119h347q13 0 13 13v67q0 13-13 13h-132l-20 19 4-19H827q-13 0-13-13v-67q0-13 13-13Z"/><text x="842" y="148" class="ko">하천 입구에서 바람을 타고 이쪽 만으로 모였어요!</text><text x="842" y="171" class="zh tiny">它从河口随风和海流聚到这个海湾！</text><text x="842" y="194" class="en tiny">It drifted from the river mouth into this cove!</text><text x="963" y="354" class="fx" transform="rotate(-5 963 354)">TRACE!</text></g>
<!-- PANEL 3: targeted cleanup -->
<g class="p"><rect x="4" y="398" width="584" height="398" fill="url(#sky)"/><path d="M4 614q110-28 221 3t363-5v184H4Z" fill="url(#sea)"/><path d="M4 666q129-43 261-20 111 19 323 67v83H4Z" fill="#d8bc85"/>
<!-- cleanup people --> <g><ellipse cx="132" cy="600" rx="27" ry="30" class="skin"/><path d="M107 594q7-40 35-26 21 10 18 34-24-10-53-8Z" class="hair"/><path d="M94 636q39-18 76 0l13 128H82Z" class="ftf"/><path d="M161 650q39 14 66 41" class="line"/><ellipse cx="261" cy="618" rx="24" ry="27" class="skin"/><path d="M238 612q7-36 32-23 19 9 16 30-22-9-48-7Z" class="hair"/><path d="M227 650q34-15 67 0l11 108h-89Z" class="vest"/><ellipse cx="371" cy="607" rx="26" ry="29" class="skin"/><path d="M347 601q7-39 34-25 20 10 17 33-23-10-51-8Z" class="hair"/><path d="M336 642q36-17 72 0l12 116h-96Z" fill="#f7fafb" stroke="#071d2a" stroke-width="4"/></g>
<!-- collected debris bags/buckets --> <rect x="444" y="651" width="92" height="79" rx="14" fill="#d8edf1" stroke="#071d2a" stroke-width="5"/><g fill="#ef6b55"><circle cx="470" cy="679" r="7"/><rect x="491" y="671" width="19" height="10"/></g><g fill="#3a8dc2"><circle cx="474" cy="704" r="6"/><rect x="506" y="698" width="14" height="13"/></g><path d="M182 687q39-22 78-5" class="line"/><path d="M281 691q40-17 79 0" class="line"/>
<rect class="box" x="18" y="415" width="350" height="91" rx="9"/><text x="33" y="443" class="ko">이번엔 넓게가 아니라, 데이터가 가리킨 곳을 정확히 청소합니다.</text><text x="33" y="467" class="zh">这一次不是盲目清理，而是精准清理数据指向的区域。</text><text x="33" y="491" class="en">This time, the cleanup targets exactly where the data points.</text>
<path class="bub" d="M329 520h240q13 0 13 13v69q0 13-13 13h-82l-19 18 3-18H329q-13 0-13-13v-69q0-13 13-13Z"/><text x="344" y="549" class="ko">작아 보여도 전부 모으면 큰 차이예요!</text><text x="344" y="573" class="zh tiny">看起来很小，聚在一起就会造成大影响！</text><text x="344" y="596" class="en tiny">Small pieces add up to a big difference!</text><text x="354" y="760" class="fx" transform="rotate(-5 354 760)">PICK · SORT · CLEAR!</text></g>
<!-- PANEL 4: return of shorebirds and updated report -->
<g class="p"><rect x="596" y="398" width="600" height="398" fill="url(#sunset)"/><circle cx="1027" cy="534" r="47" fill="#fff2ad"/><path d="M596 610q118-30 230 0t370-3v189H596Z" fill="url(#sea)"/><path d="M596 682q88-23 172-7t161 1q130-25 267 11v109H596Z" fill="#d7bc82"/>
<!-- shorebirds --> <g fill="none" stroke="#071d2a" stroke-width="5" stroke-linecap="round"><path d="M828 493q20-16 40 0 19-16 38 0"/><path d="M916 460q17-14 34 0 17-14 34 0"/><path d="M1073 486q18-15 36 0 18-15 36 0"/></g>
<!-- report board --> <rect x="633" y="447" width="291" height="162" rx="12" fill="#f9fcfd" stroke="#071d2a" stroke-width="5"/><text x="652" y="478" font-family="Arial" font-size="18" font-weight="900" fill="#17455f">COVE C-3 · FOLLOW-UP</text><text x="652" y="510" font-family="Arial" font-size="17" font-weight="900" fill="#2c8c68">Microplastic  −61%</text><text x="652" y="541" font-family="Arial" font-size="17" font-weight="900" fill="#2c8c68">Shorebirds    +24%</text><text x="652" y="572" font-family="Arial" font-size="17" font-weight="900" fill="#2c8c68">Water clarity +19%</text><text x="652" y="597" font-family="Arial" font-size="15" font-weight="800" fill="#1b607d">Evidence → Action → Recovery</text>
<!-- kids and researcher --> <g><ellipse cx="762" cy="692" rx="24" ry="27" class="skin"/><path d="M739 686q8-36 32-23 19 9 16 30-21-9-48-7Z" class="hair"/><path d="M727 724q35-16 69 0l9 72h-88Z" fill="#f7fafb" stroke="#071d2a" stroke-width="4"/><ellipse cx="840" cy="687" rx="25" ry="28" class="skin"/><path d="M817 681q7-37 32-24 19 9 17 31-22-9-49-7Z" class="hair"/><path d="M806 720q35-16 69 0l10 76h-89Z" class="vest"/><ellipse cx="929" cy="678" rx="28" ry="31" class="skin"/><path d="M903 672q7-42 37-27 22 11 19 37-26-11-56-10Z" class="hair"/><path d="M889 714q42-20 82 0l12 82H878Z" class="ftf"/></g>
<path class="bub" d="M916 612h263q13 0 13 13v70q0 13-13 13h-91l-19 18 3-18H916q-13 0-13-13v-70q0-13 13-13Z"/><text x="931" y="642" class="ko">우리가 기록해서, 우리가 바꿨어요!</text><text x="931" y="666" class="zh tiny">因为我们记录，所以我们改变了！</text><text x="931" y="689" class="en tiny">We measured it—and we changed it!</text><text x="975" y="762" class="fx" transform="rotate(-5 975 762)">LIFE RETURNS!</text>
<text x="617" y="782" class="ko">기록은 숫자로 끝나지 않습니다. 행동으로 이어질 때 바다가 달라집니다.</text></g>
</svg>