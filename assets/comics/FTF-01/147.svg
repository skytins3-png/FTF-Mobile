<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="FTF-01 scene 147 traces a faint harbor biosecurity signal to an internal workboat and stops secondary spread">
<defs>
 <linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#15263c"/><stop offset=".55" stop-color="#5785a0"/><stop offset="1" stop-color="#f2b56c"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#168ba4"/><stop offset="1" stop-color="#063b4f"/></linearGradient>
 <linearGradient id="lab" x2="1" y2="1"><stop stop-color="#f7fbfc"/><stop offset="1" stop-color="#bfd7de"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".4"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="#07151d"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#173f56"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #147  미세 신호의 마지막 이동경로를 끊는다</text>
<text x="955" y="49" fill="#c8f8ff" font-family="Arial" font-size="18" font-weight="800">TRACE → ISOLATE → CLEAN · 追踪微弱信号并切断二次扩散</text>

<!-- PANEL 1 -->
<g>
 <rect x="16" y="84" width="746" height="428" rx="12" fill="url(#dawn)"/>
 <rect x="16" y="328" width="746" height="184" fill="url(#sea)"/>
 <path d="M18 452q100-20 200 0t200 0t344 0" fill="none" stroke="#d4fbff" stroke-width="5" opacity=".55"/>
 <g transform="translate(510 330)" filter="url(#shadow)"><path d="M-165 55h310l-42 76H-125z" fill="#e6ecef" stroke="#17303a" stroke-width="6"/><rect x="-72" y="-20" width="118" height="77" rx="7" fill="#c7dce2" stroke="#17303a" stroke-width="5"/><rect x="-28" y="-69" width="12" height="51" fill="#263d48"/><circle cx="72" cy="16" r="10" fill="#ffcc4e"/><text x="-10" y="104" text-anchor="middle" fill="#1c3944" font-family="Arial" font-size="17" font-weight="900">HARBOR WORKBOAT W-3</text></g>
 <g transform="translate(83 350)" filter="url(#shadow)"><ellipse cx="42" cy="-49" rx="31" ry="37" fill="#d5a079" stroke="#132b37" stroke-width="5"/><path d="M12-55q7-28 30-32q27 4 30 31l-15-8q-19 7-45 9z" fill="#302b2b"/><rect y="-3" width="88" height="104" rx="17" fill="#eef4f6" stroke="#132b37" stroke-width="5"/><rect x="72" y="6" width="138" height="96" rx="10" fill="#082f40" stroke="#74edf5" stroke-width="4"/><text x="141" y="29" text-anchor="middle" fill="#dffcff" font-family="Arial" font-size="11" font-weight="900">B-2 eDNA MICRO-SPIKE</text><polyline points="88,80 108,78 128,79 149,70 169,43 189,73" fill="none" stroke="#ff5964" stroke-width="6"/><circle cx="169" cy="43" r="8" fill="#ffe36b"/></g>
 <rect x="38" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="298" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">B-2의 아주 작은 재상승 신호가 외항선이 아니라 항만 작업선 W-3의 이동 시간과 정확히 겹친다.</tspan><tspan x="298" dy="24" font-size="14">B-2的微弱回升并非来自外轮，而与港内作业船W-3的移动时间完全重合。</tspan><tspan x="298" dy="22" font-size="13">The tiny B-2 rebound matches the movement of harbor workboat W-3, not an ocean-going vessel.</tspan></text>
 <path d="M575 104h157q18 0 18 18v75q0 18-18 18h-92l-30 27 9-27h-44q-18 0-18-18v-75q0-18 18-18z" fill="#fff5d5" stroke="#111" stroke-width="4"/>
 <text x="654" y="137" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="654">W-3 항적부터 확인해!</tspan><tspan x="654" dy="21">先查W-3航迹！</tspan><tspan x="654" dy="19" font-size="12">Check W-3 first!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#234c61" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">PING!  CORRELATE!  TRACE!</text>
</g>

<!-- PANEL 2 -->
<g>
 <rect x="774" y="84" width="746" height="428" rx="12" fill="#0b3041"/>
 <rect x="774" y="328" width="746" height="184" fill="#075469"/>
 <g transform="translate(1120 325)" filter="url(#shadow)"><path d="M-170 58h324l-45 79H-128z" fill="#e8edef" stroke="#142d38" stroke-width="6"/><rect x="-75" y="-19" width="122" height="80" rx="7" fill="#c8dde2" stroke="#142d38" stroke-width="5"/><text x="-12" y="109" text-anchor="middle" fill="#223d47" font-family="Arial" font-size="17" font-weight="900">W-3 · ISOLATION BERTH</text></g>
 <g transform="translate(858 381)" filter="url(#shadow)"><ellipse cx="36" cy="-50" rx="30" ry="36" fill="#c98f69" stroke="#0c222d" stroke-width="5"/><rect x="-4" y="-6" width="82" height="102" rx="20" fill="#efb43f" stroke="#0c222d" stroke-width="5"/><path d="M9 19l-58 39M67 18l64 28" stroke="#efb43f" stroke-width="20" stroke-linecap="round"/><rect x="-55" y="48" width="56" height="33" rx="7" fill="#18333d" stroke="#0c222d" stroke-width="4"/></g>
 <g transform="translate(1380 398)" filter="url(#shadow)"><ellipse cx="0" cy="-55" rx="29" ry="34" fill="#d4a079" stroke="#0b222c" stroke-width="5"/><rect x="-39" y="-13" width="78" height="103" rx="18" fill="#205f79" stroke="#0b222c" stroke-width="5"/><path d="M-28 20l-62 35M28 18l62 27" stroke="#205f79" stroke-width="19" stroke-linecap="round"/></g>
 <path d="M1005 382q90-104 190 0v83q-95 43-190 0z" fill="none" stroke="#ffd95b" stroke-width="7" stroke-dasharray="15 10"/>
 <circle cx="1170" cy="437" r="9" fill="#ff5964" filter="url(#glow)"/><circle cx="1201" cy="421" r="7" fill="#ff5964" filter="url(#glow)"/><circle cx="1229" cy="446" r="6" fill="#ff5964" filter="url(#glow)"/>
 <rect x="798" y="102" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">W-3를 격리 선석에 멈추고 선미 흡입구·계류줄·방현재 접촉면을 순서대로 검사한다.</tspan><tspan x="1058" dy="24" font-size="14">将W-3停靠隔离泊位，依次检查船尾进水口、缆绳与护舷接触面。</tspan><tspan x="1058" dy="22" font-size="13">W-3 is held at an isolation berth while the stern intake, mooring lines and fender contact points are checked.</tspan></text>
 <path d="M1337 104h150q18 0 18 18v75q0 18-18 18h-88l-29 27 8-27h-41q-18 0-18-18v-75q0-18 18-18z" fill="#ffe6e6" stroke="#111" stroke-width="4"/>
 <text x="1412" y="136" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">움직이지 말고 전부 검사!</tspan><tspan x="1412" dy="21">停止移动，全面检查！</tspan><tspan x="1412" dy="19" font-size="12">Hold and inspect all!</tspan></text>
 <text x="800" y="487" fill="#fff" stroke="#663235" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">HOLD!  ISOLATE!  INSPECT!</text>
</g>

<!-- PANEL 3 -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="12" fill="#123b48"/>
 <rect x="16" y="735" width="746" height="271" fill="#09687b"/>
 <g transform="translate(154 816)" filter="url(#shadow)"><ellipse cx="0" cy="-42" rx="31" ry="36" fill="#1e3039" stroke="#07171e" stroke-width="5"/><rect x="-43" y="-4" width="86" height="108" rx="29" fill="#172830" stroke="#07171e" stroke-width="5"/><rect x="-20" y="-55" width="40" height="23" rx="8" fill="#8bf4ff" stroke="#07171e" stroke-width="4"/><path d="M-32 26l-79 40M32 25l83 16M-24 98l-48 70M24 98l57 64" stroke="#172830" stroke-width="22" stroke-linecap="round"/></g>
 <g transform="translate(393 836)" filter="url(#shadow)"><rect x="-73" y="-38" width="146" height="76" rx="22" fill="#e6b43e" stroke="#112a35" stroke-width="6"/><circle cx="-33" cy="0" r="16" fill="#8cf5ff" stroke="#112a35" stroke-width="5"/><circle cx="33" cy="0" r="16" fill="#8cf5ff" stroke="#112a35" stroke-width="5"/><path d="M-73 0l-76 39M73 0l78 39" stroke="#e0a82f" stroke-width="14" stroke-linecap="round"/></g>
 <g transform="translate(592 796)" filter="url(#shadow)"><rect x="-55" y="-37" width="110" height="74" rx="12" fill="#dfe8eb" stroke="#12303b" stroke-width="5"/><path d="M-36-9h72M-36 9h72" stroke="#76dbe8" stroke-width="5"/><rect x="-22" y="37" width="44" height="76" rx="8" fill="#8f704f" stroke="#12303b" stroke-width="5"/></g>
 <path d="M503 869q40-65 88-5" fill="none" stroke="#ffdc5f" stroke-width="8" stroke-dasharray="14 9"/>
 <circle cx="557" cy="871" r="9" fill="#ff5662" filter="url(#glow)"/><circle cx="577" cy="883" r="6" fill="#ff5662" filter="url(#glow)"/>
 <rect x="38" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="298" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="298">잠수팀이 W-3 방현재에 붙은 미세 군집을 발견한다. 작업선이 부두 사이를 오가며 옮긴 2차 전파원이다.</tspan><tspan x="298" dy="24" font-size="14">潜水组在W-3护舷发现微小群落——它正是往返泊位造成二次传播的来源。</tspan><tspan x="298" dy="22" font-size="13">Divers find a tiny colony on W-3's fender: the secondary vector that moved between berths.</tspan></text>
 <path d="M575 546h157q18 0 18 18v74q0 18-18 18h-92l-30 28 9-28h-44q-18 0-18-18v-74q0-18 18-18z" fill="#e8fbff" stroke="#111" stroke-width="4"/>
 <text x="654" y="578" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="654">여기가 이동 고리였어!</tspan><tspan x="654" dy="21">这里就是传播环节！</tspan><tspan x="654" dy="19" font-size="12">This was the transfer link!</tspan></text>
 <text x="42" y="981" fill="#fff" stroke="#315f6b" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">DIVE!  FIND!  CONFIRM VECTOR!</text>
</g>

<!-- PANEL 4 -->
<g>
 <rect x="774" y="524" width="746" height="482" rx="12" fill="#184b58"/>
 <rect x="774" y="731" width="746" height="275" fill="#0a7387"/>
 <g transform="translate(952 791)" filter="url(#shadow)"><rect x="-94" y="-63" width="188" height="126" rx="18" fill="#d7e8ec" stroke="#15313b" stroke-width="6"/><rect x="-72" y="-39" width="144" height="57" rx="9" fill="#183f4e"/><text x="0" y="-12" text-anchor="middle" fill="#8dffad" font-family="Arial" font-size="16" font-weight="900">SEALED CLEANING LOOP</text><path d="M-69 37h138" stroke="#55d5df" stroke-width="8"/><circle cx="-50" cy="37" r="10" fill="#ffe36b"/><circle cx="50" cy="37" r="10" fill="#8dffad"/></g>
 <g transform="translate(1275 813)" filter="url(#shadow)"><ellipse cx="0" cy="-59" rx="30" ry="36" fill="#d6a079" stroke="#102a34" stroke-width="5"/><rect x="-40" y="-17" width="80" height="108" rx="18" fill="#edf4f5" stroke="#102a34" stroke-width="5"/><rect x="51" y="-5" width="142" height="98" rx="10" fill="#072f40" stroke="#74edf5" stroke-width="4"/><text x="122" y="20" text-anchor="middle" fill="#dffcff" font-family="Arial" font-size="11" font-weight="900">14-DAY VERIFICATION</text><text x="122" y="49" text-anchor="middle" fill="#8dffad" font-family="Arial" font-size="18" font-weight="900">B-2 / C-4 : NEGATIVE</text><text x="122" y="74" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="800">W-3 ROUTE RESET ✓</text></g>
 <path d="M835 901q70 28 139 0t139 0t139 0t230 0" fill="none" stroke="#b4f4fb" stroke-width="5" opacity=".6"/>
 <g fill="#9ee7c0"><path d="M1110 930q28-22 55 0q-27 21-55 0z"/><circle cx="1160" cy="930" r="4"/><path d="M1197 955q27-21 53 0q-26 20-53 0z"/><circle cx="1247" cy="955" r="4"/><path d="M1370 930q26-20 52 0q-26 20-52 0z"/><circle cx="1418" cy="930" r="4"/></g>
 <rect x="798" y="543" width="520" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1058" y="571" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1058">W-3는 밀폐 순환 세척 후 동선을 재설계한다. 14일 연속 음성으로 부두 간 2차 전파 고리가 끊긴다.</tspan><tspan x="1058" dy="24" font-size="14">W-3完成封闭循环清洗并重设航线，连续14天阴性后确认二次传播链已切断。</tspan><tspan x="1058" dy="22" font-size="13">After closed-loop cleaning and route redesign, 14 negative days confirm the secondary spread chain is broken.</tspan></text>
 <path d="M1337 545h150q18 0 18 18v74q0 18-18 18h-88l-29 28 8-28h-41q-18 0-18-18v-74q0-18 18-18z" fill="#e1ffe9" stroke="#111" stroke-width="4"/>
 <text x="1412" y="577" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="14" font-weight="900"><tspan x="1412">작은 이동고리도 놓치지 마!</tspan><tspan x="1412" dy="21">别漏掉任何传播环！</tspan><tspan x="1412" dy="19" font-size="12">Break every transfer link!</tspan></text>
 <text x="802" y="981" fill="#fff" stroke="#256b52" stroke-width="7" paint-order="stroke" font-family="Arial" font-size="30" font-weight="900">SEAL!  CLEAN!  RE-ROUTE!  VERIFY!</text>
</g>
</svg>