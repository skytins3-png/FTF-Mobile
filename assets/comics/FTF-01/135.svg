<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="lab" x2="0" y2="1"><stop stop-color="#eef8fb"/><stop offset="1" stop-color="#9eb9c4"/></linearGradient>
 <linearGradient id="dock" x2="0" y2="1"><stop stop-color="#829aa4"/><stop offset="1" stop-color="#25333a"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#55d3df"/><stop offset="1" stop-color="#075672"/></linearGradient>
 <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#ffc77b"/><stop offset=".48" stop-color="#7ec9df"/><stop offset="1" stop-color="#155b75"/></linearGradient>
