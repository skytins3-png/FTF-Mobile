 <rect x="796" y="542" width="380" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="986" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="986">바다는 마지막 필터가 아니라, 우리가 지켜야 할 목적지다.</tspan><tspan x="986" dy="24" font-size="14">大海不是最后一道滤网，而是我们要守护的目的地。</tspan><tspan x="986" dy="22" font-size="13">The ocean is not our last filter. It is the place we protect.</tspan></text>
 <text x="804" y="980" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">STOP UPSTREAM · LET LIFE RETURN!</text>
</g>
