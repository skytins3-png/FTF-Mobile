 <g filter="url(#shadow)"><ellipse cx="1016" cy="171" rx="35" ry="41" fill="#efbd98" stroke="#10212b" stroke-width="5"/><path d="M985 165q8-31 32-37q29 5 35 38z" fill="#2c3b43"/><path d="M979 225q38-22 76 0l27 117H950z" fill="#edf7f8" stroke="#10212b" stroke-width="5"/><path d="M1051 247q49 8 79 32" stroke="#edf7f8" stroke-width="21" stroke-linecap="round"/></g>
 <g filter="url(#shadow)"><ellipse cx="1451" cy="171" rx="34" ry="40" fill="#daa071" stroke="#10212b" stroke-width="5"/><path d="M1421 165q8-31 32-37q28 5 34 37z" fill="#32323a"/><path d="M1414 225q38-22 75 0l24 120h-126z" fill="#245b48" stroke="#10212b" stroke-width="5"/></g>
 <rect x="796" y="101" width="466" height="115" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1029" y="131" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="1029">빗물받이에 교체식 미세섬유 필터를 넣어 바다로 가기 전에 잡는다.</tspan><tspan x="1029" dy="24" font-size="14">在雨水口安装可更换微纤维滤网，入海前就拦截。</tspan><tspan x="1029" dy="22" font-size="13">Replaceable drain filters catch microfibers before runoff reaches the ocean.</tspan></text>
 <rect x="1278" y="105" width="215" height="94" rx="22" fill="#e7ffd9" stroke="#111" stroke-width="4"/>
 <text x="1385" y="134" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="1385">여기서 막는다!</tspan><tspan x="1385" dy="22" font-size="13">就在这里拦住！</tspan><tspan x="1385" dy="20" font-size="12">Stop it here!</tspan></text>
 <text x="804" y="486" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">CLICK!  LOCK!  CAPTURE!</text>
</g>

<!-- PANEL 3: microscope verification -->
<g>
 <rect x="16" y="524" width="746" height="482" rx="10" fill="url(#lab)"/>
 <rect x="48" y="722" width="666" height="225" rx="18" fill="#b9d0d2" stroke="#41656d" stroke-width="5"/>
 <g transform="translate(88 738)"><rect width="248" height="176" rx="14" fill="#173d4e" stroke="#6ee8d8" stroke-width="5"/><circle cx="78" cy="91" r="51" fill="#eefcff" stroke="#255f70" stroke-width="6"/><g stroke="#ff5ca8" stroke-width="4"><path d="M42 65q32 15 71 48"/><path d="M45 104q36-22 69-27"/><path d="M68 42q6 53 50 89"/><path d="M99 49q-11 48-32 77"/></g><text x="176" y="55" fill="#fff" font-family="Arial" font-size="16" font-weight="900">FILTER SAMPLE</text><text x="176" y="88" fill="#8df4d1" font-family="Arial" font-size="28" font-weight="900">−74%</text><text x="176" y="115" fill="#fff" font-family="Arial" font-size="13">MICROFIBER LOAD</text></g>
 <g transform="translate(375 741)"><rect width="298" height="171" rx="14" fill="#102f40" stroke="#7ef2e1" stroke-width="5"/><text x="149" y="32" text-anchor="middle" fill="#dffff9" font-family="Arial" font-size="16" font-weight="900">STORMWATER SHIELD LIVE</text><text x="22" y="72" fill="#fff" font-family="Arial" font-size="14" font-weight="800">CAPTURE EFFICIENCY</text><text x="273" y="72" text-anchor="end" fill="#81f2b0" font-family="Arial" font-size="23" font-weight="900">74%</text><text x="22" y="108" fill="#fff" font-family="Arial" font-size="14" font-weight="800">OUTFALL FIBERS</text><text x="273" y="108" text-anchor="end" fill="#7edcff" font-family="Arial" font-size="23" font-weight="900">−58%</text><text x="22" y="144" fill="#fff" font-family="Arial" font-size="14" font-weight="800">FILTER SERVICE</text><text x="273" y="144" text-anchor="end" fill="#ffe477" font-family="Arial" font-size="18" font-weight="900">12 DAYS</text></g>
 <g filter="url(#shadow)"><ellipse cx="615" cy="650" rx="37" ry="43" fill="#edb58e" stroke="#10212b" stroke-width="5"/><path d="M582 643q8-33 35-39q30 6 34 40z" fill="#37323a"/><path d="M575 710q41-24 81 0l29 112H546z" fill="#eef8f9" stroke="#10212b" stroke-width="5"/><path d="M580 729q-48 8-84 34" stroke="#eef8f9" stroke-width="21" stroke-linecap="round"/></g>
 <rect x="40" y="542" width="472" height="116" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="276" y="572" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="276">첫 폭우 뒤 분석에서 하구로 빠져나간 미세섬유가 크게 줄었다.</tspan><tspan x="276" dy="24" font-size="14">首场暴雨后，排向河口的微纤维明显减少。</tspan><tspan x="276" dy="22" font-size="13">After the first storm, microfiber discharge at the outfall falls sharply.</tspan></text>
 <rect x="525" y="550" width="204" height="95" rx="22" fill="#eafff5" stroke="#111" stroke-width="4"/>
 <text x="627" y="580" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="627">수치가 증명했어.</tspan><tspan x="627" dy="22" font-size="13">数据证明了。</tspan><tspan x="627" dy="20" font-size="12">The data proves it.</tspan></text>
 <text x="42" y="980" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="33" font-weight="900">SAMPLE!  COUNT!  VERIFY!</text>
</g>

