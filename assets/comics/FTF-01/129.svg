 <g filter="url(#shadow)"><ellipse cx="680" cy="307" rx="34" ry="40" fill="#e2a778" stroke="#10212b" stroke-width="5"/><path d="M649 300q8-31 33-37q29 6 34 38z" fill="#432f30"/><path d="M645 361q38-22 76 0l26 119H618z" fill="#d18b3e" stroke="#10212b" stroke-width="5"/><path d="M646 374q-42 10-67 30" stroke="#d18b3e" stroke-width="20" stroke-linecap="round"/></g>
 <rect x="35" y="102" width="480" height="118" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="275" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="17" font-weight="900"><tspan x="275">비가 오면 도로와 거리의 미세섬유가 빗물관을 타고 바다로 간다.</tspan><tspan x="275" dy="24" font-size="14">下雨时，街道上的微纤维会沿雨水管流向大海。</tspan><tspan x="275" dy="22" font-size="13">Rain can carry street microfibers through storm drains straight to the sea.</tspan></text>
 <rect x="508" y="103" width="226" height="96" rx="22" fill="#fff4c9" stroke="#111" stroke-width="4"/>
 <text x="621" y="132" text-anchor="middle" font-family="Arial,Malgun Gothic" font-size="15" font-weight="900"><tspan x="621">흐름을 추적해!</tspan><tspan x="621" dy="22" font-size="13">追踪水流！</tspan><tspan x="621" dy="20" font-size="12">Track the runoff!</tspan></text>
 <text x="42" y="487" fill="#fff" stroke="#0b5670" stroke-width="6" paint-order="stroke" font-family="Arial" font-size="34" font-weight="900">RAIN!  FLOW!  TRACE!</text>
</g>

