<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
 <linearGradient id="rain" x2="0" y2="1"><stop stop-color="#263d58"/><stop offset="1" stop-color="#668da0"/></linearGradient>
 <linearGradient id="drain" x2="0" y2="1"><stop stop-color="#8ca3a8"/><stop offset="1" stop-color="#3c555e"/></linearGradient>
 <linearGradient id="lab" x2="0" y2="1"><stop stop-color="#d8eef1"/><stop offset="1" stop-color="#76a8b6"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#42bdd5"/><stop offset="1" stop-color="#073b5d"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".4"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="rainlines" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M6 0L0 18M24 0L12 34M38 4L27 34" stroke="#d4f4ff" stroke-width="3" opacity=".35"/></pattern>
</defs>
<rect width="1536" height="1024" fill="#06131e"/>
<rect x="12" y="12" width="1512" height="58" rx="12" fill="#0b2d43"/>
<text x="30" y="51" fill="#fff" font-family="Arial,Malgun Gothic" font-size="34" font-weight="900">FTF-01  #129  도시의 빗물길에서 바다를 지켜라</text>
<text x="960" y="49" fill="#bdf7ff" font-family="Arial" font-size="18" font-weight="800">B-32 STORMWATER MICROFIBER SHIELD · 城市雨水微纤维拦截</text>

<!-- PANEL 1: storm runoff survey -->
<g>
