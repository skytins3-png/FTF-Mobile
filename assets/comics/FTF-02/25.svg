<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#060b12"/><rect width="1080" height="1180" fill="#172638"/><rect x="70" y="520" width="940" height="650" rx="28" fill="#26384b" stroke="#8aa6bc" stroke-width="8"/><rect x="110" y="580" width="520" height="330" rx="16" fill="#0c1723" stroke="#5fc1e8" stroke-width="6"/><circle cx="370" cy="745" r="125" fill="none" stroke="#5fc1e8" stroke-width="6"/><circle cx="370" cy="745" r="82" fill="none" stroke="#5fc1e8" stroke-width="4"/><circle cx="370" cy="745" r="38" fill="#f0c94d"/><path d="M370 745l150-95" stroke="#f05b61" stroke-width="8"/><g fill="#80d8ff"><rect x="690" y="610" width="250" height="32"/><rect x="690" y="675" width="210" height="32"/><rect x="690" y="740" width="180" height="32"/><rect x="690" y="805" width="230" height="32"/></g><g stroke="#111" stroke-width="7"><circle cx="250" cy="1240" r="47" fill="#d2a07b"/><path d="M210 1225q42-62 82 0" fill="#1d252d"/><path d="M195 1288h110l62 190H135z" fill="#4f7fa1"/><circle cx="455" cy="1240" r="46" fill="#c99772"/><path d="M415 1225q42-62 82 0" fill="#2c2629"/><path d="M405 1288h100l60 190H350z" fill="#65728f"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M40 210h485q35 0 35 35v180q0 35-35 35H285l-55 70 10-70H40q-35 0-35-35V245q0-35 35-35z"/><path d="M570 330h465q35 0 35 35v180q0 35-35 35H815l-45 70-40-70H570q-35 0-35-35V365q0-35 35-35z"/></g><text x="65" y="275" font-size="33" font-family="sans-serif" font-weight="800">기상관: 새 경보망이 전 구역에 연결됐습니다.</text><text x="65" y="330" font-size="29" font-family="sans-serif">气象员：新的预警网络已经覆盖全城。</text><text x="65" y="385" font-size="27" font-family="sans-serif">Meteorologist: The new warning network covers the whole city.</text><text x="595" y="395" font-size="33" font-family="sans-serif" font-weight="800">시장: 대피소와 병원도 동시에 움직입니다.</text><text x="595" y="450" font-size="29" font-family="sans-serif">市长：避难所和医院将同步行动。</text><text x="595" y="505" font-size="27" font-family="sans-serif">Mayor: Shelters and hospitals will move together.</text><text x="680" y="980" fill="#ffe178" font-size="65" font-family="sans-serif" font-weight="900">PING! ALERT READY</text><rect x="55" y="1510" width="970" height="305" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1570" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 25 / FTF-02 · 다음 폭풍을 위한 약속</text><text x="90" y="1630" fill="#fff" font-size="31" font-family="sans-serif">새 레이더와 하천 센서, 대피 안내망이 하나의 상황실 화면에 연결된다.</text><text x="90" y="1690" fill="#dbe8f0" font-size="29" font-family="sans-serif">新雷达、河流水位传感器和疏散系统被接入同一座指挥中心。</text><text x="90" y="1750" fill="#b8c8d8" font-size="27" font-family="sans-serif">New radar, river sensors, and evacuation systems converge on one command screen.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">为下一场风暴准备 · Preparing for the next storm</text></svg>