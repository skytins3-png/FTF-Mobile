="1136" fill="#17202a" font-size="25" font-weight="900">“높은 곳으로 가!”</text><text x="446" y="1170" fill="#394a58" font-size="21">“快往高处走！”</text><text x="454" y="1196" fill="#72818f" font-size="17">“Move to higher ground!”</text><rect x="72" y="1536" width="936" height="236" rx="26" fill="#0d1218" stroke="#f0c35a" stroke-width="4"/><text x="104" y="1590" fill="#f0c35a" font-size="25" font-weight="900">상황 설명 · CAPTION</text><text x="104" y="1640" fill="#f7f8fa" font-size="31" font-weight="900">간판이 흔들리고 나무가 강풍에 휘어진다.</text><text x="104" y="1690" fill="#d4dfe8" font-size="28">招牌剧烈摇晃，树木被强风压弯。</text><text x="104" y="1732" fill="#9fb4ca" font-size="22">The wind tears through the streets.</text><text x="80" y="1840" fill="#9fb4ca" font-size="22">FTF comic scene 02 / 26</text></svg>