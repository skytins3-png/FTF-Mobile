<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0c1520"/><stop offset=".7" stop-color="#27394a"/><stop offset="1" stop-color="#101821"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#070b10"/><rect width="1080" height="1320" fill="url(#sky)"/><g stroke="#9dcde1" stroke-width="7" opacity=".45"><path d="M50 70L-20 260"/><path d="M190 30L120 235"/><path d="M360 70L290 260"/><path d="M560 25L490 230"/><path d="M760 60L690 260"/><path d="M965 30L890 245"/></g><g transform="translate(230 305)"><path d="M0 130Q135 40 300 55L555 150L485 220L270 160L90 205Z" fill="#2e4355" stroke="#0b1118" stroke-width="9"/><rect x="210" y="75" width="115" height="70" rx="12" fill="#78b6d3" stroke="#0b1118" stroke-width="7"/><path d="M145 93L-120 18M438 116L720 48" stroke="#d2e7ef" stroke-width="18" stroke-linecap="round"/><circle cx="270" cy="145" r="54" fill="#1a2631" stroke="#0b1118" stroke-width="8"/><path d="M215 225L185 340M330 222L380 340" stroke="#e8d969" stroke-width="12"/><path d="M485 160L620 210" stroke="#2e4355" stroke-width="26" stroke-linecap="round"/></g><g><rect x="85" y="725" width="910" height="390" fill="#3e4852" stroke="#111820" stroke-width="10"/><rect x="130" y="770" width="820" height="82" fill="#f1d164"/><text x="540" y="826" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="900" fill="#17202a">ROOFTOP EVACUATION · 옥상 대피 · 屋顶疏散</text><g transform="translate(185 900)"><circle cx="75" cy="0" r="45" fill="#dda77f"/><path d="M35 8Q44-48 76-48Q113-45 117 12Q94-13 74-13Q54-12 35 8" fill="#333139"/><path d="M12 80Q75 38 138 80V180H12Z" fill="#b95e65"/><path d="M72 95L210 55" stroke="#dda77f" stroke-width="20" stroke-linecap="round"/></g><g transform="translate(455 900)"><circle cx="76" cy="0" r="45" fill="#dba077"/><path d="M38 8Q45-48 78-48Q116-47 119 12Q96-13 76-13Q56-12 38 8" fill="#25282d"/><path d="M12 82Q76 38 140 82V180H12Z" fill="#f1c64e"/><path d="M75 98L-40 65" stroke="#dba077" stroke-width="20" stroke-linecap="round"/></g><g transform="translate(730 900)"><circle cx="70" cy="0" r="42" fill="#e0b18f"/><path d="M34 7Q42-43 72-43Q105-42 109 11Q88-12 69-12Q52-11 34 7" fill="#5a443b"/><path d="M10 76Q70 36 130 76V180H10Z" fill="#4d748f"/></g></g><path d="M0 1120Q160 1060 350 1120T760 1090T1080 1150V1320H0Z" fill="#345d76"/><g filter="url(#sh)"><path d="M55 45Q55 20 115 20H875Q935 20 935 95V315Q935 377 862 377H720L655 438L662 377H115Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="112" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="900">한 명씩! 아이부터 호이스트에 연결합니다!</text><text x="92" y="180" font-family="Arial" font-size="31">一个一个来！先把孩子接上吊索！</text><text x="92" y="245" font-family="Arial" font-size="29">One at a time! Clip the children to the hoist first!</text></g><g filter="url(#sh)"><rect x="55" y="1465" width="970" height="305" rx="22" fill="#10161e" stroke="#78d7ff" stroke-width="7"/><text x="90" y="1540" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="900" fill="#78d7ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1608" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">고립된 주민들이 옥상에 모이고, 구조 헬기가 강풍 속에서 한 명씩 끌어올린다.</text><text x="90" y="1670" font-family="Arial" font-size="30" fill="#d8e4e9">受困居民聚集在屋顶，救援直升机在强风中逐一吊运。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">Stranded residents crowd a rooftop while a rescue helicopter lifts them through the gale.</text></g><text x="650" y="1220" font-family="Impact,Arial Black" font-size="88" fill="#ffe57a" stroke="#111" stroke-width="9" transform="rotate(-6 650 1220)">WHUP-WHUP!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 14 / 26</text></svg>