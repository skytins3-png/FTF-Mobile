<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#495c73"/><stop offset="1" stop-color="#c98d6d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1920" fill="#070b10"/><rect width="1080" height="1110" fill="url(#sky)"/><circle cx="850" cy="260" r="90" fill="#ffd77d" opacity=".8" filter="url(#glow)"/><path d="M0 880l180-120 120 70 160-110 170 100 150-80 160 90 140-40v420H0z" fill="#33424d"/><path d="M0 1080q180-45 360 0t360 0 360 0v840H0z" fill="#203848"/><g><rect x="80" y="450" width="300" height="370" fill="#6f7c88" stroke="#c7d3db" stroke-width="7"/><path d="M80 450l150-120 150 120z" fill="#444f59"/><rect x="165" y="600" width="120" height="220" fill="#392b28"/><rect x="470" y="480" width="430" height="300" fill="#5a6876" stroke="#c7d3db" stroke-width="7"/><path d="M470 480l215-120 215 120z" fill="#424f59"/><rect x="550" y="570" width="100" height="90" fill="#8eb1c6"/><rect x="720" y="570" width="100" height="90" fill="#8eb1c6"/></g><g stroke="#111" stroke-width="7"><circle cx="230" cy="1000" r="43" fill="#c99574"/><path d="M195 982q37-55 72 0" fill="#20242b"/><path d="M190 1042h82l52 165H145z" fill="#f2c13b"/><circle cx="410" cy="970" r="42" fill="#d3a27e"/><path d="M375 952q36-55 72 0" fill="#2b2728"/><path d="M372 1015h76l50 160H330z" fill="#e45b50"/><circle cx="585" cy="1010" r="40" fill="#c99a77"/><path d="M552 994q35-52 69 0" fill="#1e242a"/><path d="M548 1050h75l48 155H505z" fill="#5879d7"/><circle cx="760" cy="985" r="41" fill="#d5a682"/><path d="M726 968q36-54 72 0" fill="#24282d"/><path d="M720 1028h82l50 160H675z" fill="#55a36d"/></g><path d="M130 1260h820" stroke="#f0e5c0" stroke-width="12"/><g fill="#d6e1e8" stroke="#fff" stroke-width="6"><rect x="170" y="1220" width="90" height="70" rx="10"/><rect x="350" y="1220" width="90" height="70" rx="10"/><rect x="530" y="1220" width="90" height="70" rx="10"/><rect x="710" y="1220" width="90" height="70" rx="10"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M75 620h420q35 0 35 35v150q0 35-35 35H275l-60 70 10-70H75q-35 0-35-35V655q0-35 35-35z"/><path d="M585 610h420q35 0 35 35v150q0 35-35 35H825l-45 70-40-70H585q-35 0-35-35V645q0-35 35-35z"/></g><text x="85" y="680" font-size="33" font-family="sans-serif" font-weight="700">주민: 서로 도우면 다시 일어설 수 있어요.</text><text x="85" y="730" font-size="29" font-family="sans-serif">只要互相帮助，我们一定能重新站起来。</text><text x="85" y="780" font-size="27" font-family="sans-serif">Resident: If we help each other, we can rebuild.</text><text x="595" y="670" font-size="33" font-family="sans-serif" font-weight="700">구조대: 물과 약부터 나눕니다.</text><text x="595" y="720" font-size="29" font-family="sans-serif">先分发饮用水和药品。</text><text x="595" y="770" font-size="27" font-family="sans-serif">Rescuer: Water and medicine first.</text><text x="720" y="430" fill="#ffe37d" font-size="66" font-family="sans-serif" font-weight="900" transform="rotate(-7 720 430)">CLACK · THUD</text><rect x="55" y="1540" width="970" height="250" rx="28" fill="#080d14e8" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1605" fill="#e9c46a" font-size="32" font-family="sans-serif" font-weight="700">상황 설명 · SCENE 20 / FTF-02</text><text x="90" y="1660" fill="#fff" font-size="34" font-family="sans-serif">폭풍이 지나간 뒤, 주민과 구조대가 함께 복구 거점을 만든다.</text><text x="90" y="1710" fill="#d9e7ef" font-size="30" font-family="sans-serif">风暴过后，居民与救援队共同建立恢复据点。</text><text x="90" y="1760" fill="#b8c8d8" font-size="28" font-family="sans-serif">After the storm, residents and rescuers build a recovery hub together.</text></svg>