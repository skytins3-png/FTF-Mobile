<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#090b12"/><rect width="1080" height="1180" fill="#303d4d"/><circle cx="850" cy="230" r="72" fill="#f3c982"/><path d="M0 760l180-80 130 45 145-95 160 85 160-70 160 75 145-50v510H0z" fill="#44515c"/><rect x="180" y="650" width="720" height="430" rx="20" fill="#4d555d" stroke="#cfd7de" stroke-width="8"/><text x="260" y="735" fill="#fff" font-size="42" font-family="sans-serif" font-weight="900">REMEMBER</text><g fill="#f3d58c"><circle cx="280" cy="950" r="16"/><circle cx="400" cy="950" r="16"/><circle cx="520" cy="950" r="16"/><circle cx="640" cy="950" r="16"/><circle cx="760" cy="950" r="16"/></g><g stroke="#111" stroke-width="7"><circle cx="250" cy="1180" r="46" fill="#d3a27d"/><path d="M210 1165q42-62 82 0" fill="#29252a"/><path d="M200 1225h100l58 185H145z" fill="#705f8f"/><circle cx="465" cy="1170" r="45" fill="#c99773"/><path d="M425 1155q42-62 82 0" fill="#1f2930"/><path d="M415 1215h100l58 190H360z" fill="#e7bd3a"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M45 240h470q35 0 35 35v170q0 35-35 35H285l-55 70 8-70H45q-35 0-35-35V275q0-35 35-35z"/><path d="M575 350h455q35 0 35 35v170q0 35-35 35H820l-45 70-40-70H575q-35 0-35-35V385q0-35 35-35z"/></g><text x="70" y="300" font-size="34" font-family="sans-serif" font-weight="800">여성: 오늘은 이름을 기억할게요.</text><text x="70" y="355" font-size="29" font-family="sans-serif">女人：今天，我们记住他们的名字。</text><text x="70" y="410" font-size="27" font-family="sans-serif">Woman: Today, we remember their names.</text><text x="600" y="410" font-size="33" font-family="sans-serif" font-weight="800">구조대원: 다음엔 더 빨리 움직이겠습니다.</text><text x="600" y="465" font-size="29" font-family="sans-serif">救援队员：下次我们会更快行动。</text><text x="600" y="520" font-size="27" font-family="sans-serif">Rescuer: Next time, we will move faster.</text><text x="780" y="870" fill="#ffe178" font-size="70" font-family="sans-serif" font-weight="900">… TOLL</text><rect x="55" y="1490" width="970" height="325" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1555" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 23 / FTF-02 · 잃어버린 이름들</text><text x="90" y="1615" fill="#fff" font-size="31" font-family="sans-serif">비가 멎은 광장에 추모 벽이 세워지고 주민과 구조대가 함께 촛불을 밝힌다.</text><text x="90" y="1680" fill="#dbe8f0" font-size="29" font-family="sans-serif">雨停后的广场上立起纪念墙，居民与救援人员一起点亮烛光。</text><text x="90" y="1745" fill="#b8c8d8" font-size="27" font-family="sans-serif">A memorial wall rises in the square as rescuers and residents light candles.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">那些失去的名字 · The names we lost</text></svg>