<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#26394e"/><stop offset="1" stop-color="#e5a873"/></linearGradient></defs><rect width="1080" height="1920" fill="#070b10"/><rect width="1080" height="1120" fill="url(#sky)"/><circle cx="850" cy="210" r="80" fill="#ffd58a"/><path d="M0 690l150-90 130 55 150-120 140 95 170-80 150 90 190-70v520H0z" fill="#394d5a"/><path d="M0 1130h1080v330H0z" fill="#343c42"/><path d="M0 1280h1080" stroke="#e4d382" stroke-width="14" stroke-dasharray="80 45"/><path d="M80 1190h420l70 85H60z" fill="#697985" stroke="#e8eef2" stroke-width="8"/><path d="M565 1150h300l95 70v115H535v-120z" fill="#e9edf0" stroke="#17212b" stroke-width="8"/><rect x="610" y="1175" width="105" height="65" fill="#8db9cf"/><circle cx="625" cy="1345" r="43" fill="#161d22"/><circle cx="865" cy="1345" r="43" fill="#161d22"/><rect x="550" y="1098" width="88" height="50" fill="#f2c94c"/><text x="560" y="1132" font-size="24" font-family="sans-serif" font-weight="900">RELIEF</text><g stroke="#111" stroke-width="7"><circle cx="230" cy="1095" r="46" fill="#d2a07b"/><path d="M190 1080q42-62 82 0" fill="#1e252b"/><path d="M180 1140h96l58 190H125z" fill="#f0c441"/><circle cx="405" cy="1115" r="44" fill="#c99772"/><path d="M368 1100q40-60 78 0" fill="#332729"/><path d="M360 1160h92l55 182H305z" fill="#cf5c58"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M50 245h460q35 0 35 35v170q0 35-35 35H280l-55 70 8-70H50q-35 0-35-35V280q0-35 35-35z"/><path d="M570 355h455q35 0 35 35v170q0 35-35 35H815l-45 68-38-68H570q-35 0-35-35V390q0-35 35-35z"/></g><text x="75" y="305" font-size="34" font-family="sans-serif" font-weight="800">구조대: 이 다리부터 다시 엽니다.</text><text x="75" y="360" font-size="29" font-family="sans-serif">救援队：先重新开放这座桥。</text><text x="75" y="415" font-size="27" font-family="sans-serif">Rescuer: We reopen this bridge first.</text><text x="595" y="415" font-size="33" font-family="sans-serif" font-weight="800">주민: 약과 물이 마을로 들어옵니다.</text><text x="595" y="470" font-size="29" font-family="sans-serif">居民：药品和饮用水终于进村了。</text><text x="595" y="525" font-size="27" font-family="sans-serif">Resident: Medicine and water are coming back in.</text><text x="660" y="900" fill="#ffe174" font-size="68" font-family="sans-serif" font-weight="900" transform="rotate(-7 660 900)">CLANG! BEEP!</text><rect x="55" y="1490" width="970" height="325" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1555" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 21 / FTF-02 · 긴급 보급로 재개</text><text x="90" y="1615" fill="#fff" font-size="31" font-family="sans-serif">임시 철교가 연결되고 구호 트럭이 다시 도시 안으로 들어온다.</text><text x="90" y="1680" fill="#dbe8f0" font-size="29" font-family="sans-serif">临时钢桥重新连接道路，救援卡车再次驶入城市。</text><text x="90" y="1745" fill="#b8c8d8" font-size="27" font-family="sans-serif">A temporary steel bridge reconnects the road and relief trucks return.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">应急补给路线重新开放 · Emergency supply routes reopen</text></svg>