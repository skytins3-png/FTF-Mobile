<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="FTF-02 scene 30 final aftermath and transition from Typhoon Arka"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#21324b"/><stop offset=".55" stop-color="#6d91a7"/><stop offset="1" stop-color="#f3b76b"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#3e7184"/><stop offset="1" stop-color="#173d49"/></linearGradient><linearGradient id="room" x2="1" y2="1"><stop stop-color="#1b2a38"/><stop offset="1" stop-color="#0b131c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#05090e"/><text x="42" y="60" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="900">FTF-02 · TYPHOON ARKA · SCENE 30</text><text x="42" y="95" fill="#b8cada" font-family="Arial,sans-serif" font-size="20">THE MORNING AFTER · 폭풍 뒤의 아침 · 风暴后的清晨</text><!-- PANEL 1: sunrise over damaged city --><rect x="30" y="120" width="1020" height="470" rx="22" fill="url(#dawn)" stroke="#fff" stroke-width="6"/><circle cx="885" cy="245" r="92" fill="#ffd27b"/><path d="M30 390L120 338 210 375 320 305 420 360 535 295 645 365 760 320 860 380 950 330 1050 390V590H30Z" fill="#344b56"/><path d="M30 470q180-55 350 0t350 0 320 0v120H30z" fill="url(#sea)"/><g stroke="#111" stroke-width="6"><rect x="95" y="330" width="95" height="110" fill="#8a7b70"/><path d="M90 330l52-45 54 45" fill="#715d55"/><rect x="245" y="355" width="120" height="85" fill="#756c66"/><path d="M238 355l66-50 67 50" fill="#5c4e49"/><rect x="410" y="345" width="110" height="95" fill="#9a8b78"/><path d="M402 345l63-49 63 49" fill="#726258"/></g><path d="M115 448l62-25M260 455l90-18M432 448l72-20" stroke="#d7c279" stroke-width="12"/><g stroke="#18212a" stroke-width="7"><circle cx="690" cy="422" r="40" fill="#d3a07b"/><path d="M653 412q37-57 74 0" fill="#27343e"/><path d="M640 468h100l28 115H612z" fill="#e2b94d"/><circle cx="830" cy="420" r="40" fill="#c88d69"/><path d="M793 411q37-57 74 0" fill="#382c30"/><path d="M780 468h100l28 115H752z" fill="#4d839e"/></g><rect x="55" y="145" width="690" height="170" rx="22" fill="#fff" stroke="#111" stroke-width="7" filter="url(#shadow)"/><text x="80" y="197" font-family="Arial,sans-serif" font-size="30" font-weight="900">주민: 해가 떴어… 정말 끝난 거야?</text><text x="80" y="245" font-family="Arial,sans-serif" font-size="26">居民：太阳出来了……真的结束了吗？</text><text x="80" y="291" font-family="Arial,sans-serif" font-size="25">Resident: The sun is up… is it really over?</text><text x="790" y="365" fill="#ffe36d" font-family="Arial,sans-serif" font-size="55" font-weight="900" transform="rotate(-7 790 365)">DRIP…</text><!-- PANEL 2: responders restoring lifelines --><rect x="30" y="620" width="500" height="550" rx="22" fill="#263d46" stroke="#fff" stroke-width="6"/><path d="M50 1000h460v170H50z" fill="#3b5963"/><rect x="72" y="710" width="385" height="170" rx="16" fill="#182832" stroke="#77aab9" stroke-width="5"/><path d="M95 832l55-42 60 10 45-58 65 22 52-47 55 63" fill="none" stroke="#77e0a4" stroke-width="9"/><text x="95" y="755" fill="#dff8ff" font-family="Arial,sans-serif" font-size="22" font-weight="900">POWER · WATER · ROAD · SHELTER</text><g stroke="#111" stroke-width="6"><circle cx="140" cy="955" r="35" fill="#d3a07a"/><path d="M108 946q32-49 64 0" fill="#26333d"/><path d="M98 1000h84l25 130H73z" fill="#e4b545"/><circle cx="295" cy="953" r="35" fill="#c9906b"/><path d="M263 944q32-49 64 0" fill="#3a2e30"/><path d="M253 998h84l25 130H228z" fill="#4b7f98"/><circle cx="420" cy="965" r="30" fill="#d7a47e"/><path d="M393 956q27-43 54 0" fill="#4c3a34"/><path d="M385 1005h70l21 115H364z" fill="#6d78af"/></g><rect x="55" y="655" width="430" height="190" rx="22" fill="#fff" stroke="#111" stroke-width="7"/><text x="75" y="707" font-family="Arial,sans-serif" font-size="26" font-weight="900">대원: 전기 복구. 식수 통로 확보. 도로도 연다!</text><text x="75" y="757" font-family="Arial,sans-serif" font-size="23">队员：恢复供电，确保饮水通道，打开道路！</text><text x="75" y="807" font-family="Arial,sans-serif" font-size="22">Responder: Power back. Water route secure. Reopen the road!</text><text x="320" y="930" fill="#ffe16b" font-family="Arial,sans-serif" font-size="42" font-weight="900">CLACK! BEEP!</text><!-- PANEL 3: data review after disaster --><rect x="550" y="620" width="500" height="550" rx="22" fill="url(#room)" stroke="#fff" stroke-width="6"/><rect x="580" y="685" width="440" height="260" rx="18" fill="#08131b" stroke="#4f7891" stroke-width="5"/><path d="M615 885l58-40 58 10 52-104 66 34 54-80 70 132" fill="none" stroke="#ffbd5a" stroke-width="10"/><path d="M615 815h360M615 760h360" stroke="#284455" stroke-width="3"/><text x="608" y="724" fill="#dff6ff" font-family="Arial,sans-serif" font-size="21" font-weight="900">ARKA DAMAGE REVIEW · FLOOD DEPTH · EVACUATION TIME</text><g stroke="#111" stroke-width="7"><circle cx="690" cy="1030" r="39" fill="#d2a07a"/><path d="M654 1020q36-55 72 0" fill="#29343d"/><path d="M640 1075h100l24 88H616z" fill="#3f7894"/><circle cx="900" cy="1030" r="39" fill="#c98f6b"/><path d="M864 1020q36-55 72 0" fill="#3c2c30"/><path d="M850 1075h100l24 88H826z" fill="#d6aa45"/></g><rect x="575" y="955" width="440" height="170" rx="22" fill="#fff" stroke="#111" stroke-width="7"/><text x="595" y="1005" font-family="Arial,sans-serif" font-size="25" font-weight="900">분석관: 다음 폭풍은, 오늘의 기록으로 막는다.</text><text x="595" y="1053" font-family="Arial,sans-serif" font-size="22">分析员：用今天的记录，挡住下一场风暴。</text><text x="595" y="1100" font-family="Arial,sans-serif" font-size="21">Analyst: Today's data will defend us from the next storm.</text><text x="670" y="1150" fill="#ffe36d" font-family="Arial,sans-serif" font-size="41" font-weight="900">TAP! SAVE!</text><!-- PANEL 4: transition to survival council --> <rect x="30" y="1200" width="1020" height="670" rx="22" fill="#101b27" stroke="#fff" stroke-width="6"/><path d="M30 1500L180 1430 300 1480 445 1385 610 1470 760 1410 900 1490 1050 1435V1870H30Z" fill="#1d3441"/><rect x="110" y="1355" width="860" height="300" rx="28" fill="#0a1119" stroke="#6288a4" stroke-width="6"/><ellipse cx="540" cy="1492" rx="310" ry="96" fill="#172a39" stroke="#47667e" stroke-width="5"/><g fill="#d9e5ed" stroke="#111" stroke-width="5"><circle cx="290" cy="1435" r="32"/><circle cx="380" cy="1398" r="32"/><circle cx="500" cy="1382" r="32"/><circle cx="620" cy="1398" r="32"/><circle cx="710" cy="1435" r="32"/></g><g fill="#315068"><path d="M255 1480h70l22 110H233z"/><path d="M345 1442h70l22 110H323z"/><path d="M465 1426h70l22 110H443z"/><path d="M585 1442h70l22 110H563z"/><path d="M675 1480h70l22 110H653z"/></g><rect x="165" y="1240" width="760" height="165" rx="23" fill="#fff" stroke="#111" stroke-width="7"/><text x="190" y="1292" font-family="Arial,sans-serif" font-size="29" font-weight="900">내레이션: 아르카는 지나갔다. 그러나 질문은 남았다.</text><text x="190" y="1342" font-family="Arial,sans-serif" font-size="25">旁白：阿尔卡已经过去，但问题仍然存在。</text><text x="190" y="1388" font-family="Arial,sans-serif" font-size="24">Narration: Arka passed. The questions remained.</text><rect x="250" y="1605" width="580" height="145" rx="22" fill="#f4f6f8" stroke="#111" stroke-width="7"/><text x="540" y="1658" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900">다음 의제: 지구 생존 계획</text><text x="540" y="1705" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">下一议题：地球生存计划</text><text x="540" y="1748" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">NEXT: EARTH SURVIVAL PLAN</text><text x="780" y="1815" fill="#ffe36d" font-family="Arial,sans-serif" font-size="58" font-weight="900" transform="rotate(-5 780 1815)">CLACK!</text></svg>