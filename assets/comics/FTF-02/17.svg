x="230" y="1010" width="160" height="55" rx="12" fill="#233348"/><circle cx="750" cy="910" r="52" fill="#d2a07d"/><path d="M705 890q45-70 95 0" fill="#16191f"/><path d="M700 960h110l70 225H635z" fill="#ea5b4f"/><rect x="680" y="1010" width="150" height="55" rx="12" fill="#263a50"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M80 1110h450q35 0 35 35v150q0 35-35 35H300l-70 70 15-70H80q-35 0-35-35v-150q0-35 35-35z"/><path d="M575 1080h420q35 0 35 35v150q0 35-35 35H800l-40 75-45-75H575q-35 0-35-35v-150q0-35 35-35z"/></g><text x="85" y="1170" font-size="34" font-family="sans-serif" font-weight="700">상황실: B-7 교량은 포기한다.</text><text x="85" y="1220" font-size="29" font-family="sans-serif">放弃B-7桥，改走北侧救援线。</text><text x="85" y="1270" font-size="27" font-family="sans-serif">Command: Abandon B-7. Take the north route.</text><text x="585" y="1140" font-size="33" font-family="sans-serif" font-weight="700">구조대: 북쪽으로 우회합니다!</text><text x="585" y="1190" font-size="29" font-family="sans-serif">收到，向北绕行！</text><text x="585" y="1240" font-size="27" font-family="sans-serif">Rescue team: Copy. Redirecting north!</text><path d="M140 1440L930 1340" stroke="#ffdb6b" stroke-width="16" stroke-dasharray="26 18"/><path d="M900 1305l75 28-58 53z" fill="#ffdb6b"/><text x="620" y="1420" fill="#ffe37d" font-size="72" font-family="sans-serif" font-weight="900" transform="rotate(-7 620 1420)">BEEP! BEEP!</text><rect x="55" y="1540" width="970" height="250" rx="28" fill="#080d14e8" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1605" fill="#e9c46a" font-size="32" font-family="sans-serif" font-weight="700">상황 설명 · SCENE 17 / FTF-02</text><text x="90" y="1660" fill="#fff" font-size="34" font-family="sans-serif">강 수위가 급상승하며 구조본부는 이동 경로를 다시 짠다.</text><text x="90" y="1710" fill="#d9e7ef" font-size="30" font-family="sans-serif">河水暴涨，救援指挥部重新规划撤离路线。</text><text x="90" y="1760" fill="#b8c8d8" font-size="28" font-family="sans-serif">The command center redraws the rescue route as the river surges