<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="night" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#243447"/></linearGradient><linearGradient id="floor" x2="1" y2="1"><stop stop-color="#25313f"/><stop offset="1" stop-color="#141b24"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#080c12"/><rect width="1080" height="1320" fill="url(#night)"/><rect y="1010" width="1080" height="310" fill="url(#floor)"/><path d="M0 270 L1080 110 L1080 0 L0 0Z" fill="#0c1420"/><g stroke="#6da8cb" stroke-width="7" opacity=".55"><path d="M30 80L-40 250"/><path d="M145 40L65 235"/><path d="M310 70L225 270"/><path d="M500 35L420 225"/><path d="M690 70L610 265"/><path d="M860 40L785 225"/><path d="M1030 90L955 260"/></g><g fill="#d7e5ef" stroke="#0b1118" stroke-width="7"><path d="M110 360L970 360L1025 1010H55Z"/><path d="M150 420H930L970 990H110Z" fill="#8798a7"/></g><g fill="#f6d36b"><rect x="240" y="455" width="120" height="64" rx="8"/><rect x="480" y="455" width="120" height="64" rx="8"/><rect x="720" y="455" width="120" height="64" rx="8"/></g><text x="540" y="505" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="42" font-weight="900" fill="#17212c">긴급 대피소 · EMERGENCY SHELTER</text><g><rect x="110" y="640" width="240" height="240" rx="25" fill="#445464" stroke="#dce8ef" stroke-width="6"/><path d="M145 770Q230 690 315 770V880H145Z" fill="#bf6a48"/><circle cx="230" cy="705" r="55" fill="#dba27b"/><path d="M178 712Q190 645 230 640Q285 645 290 720Q255 687 230 688Q205 688 178 712" fill="#2e2622"/></g><g><rect x="410" y="620" width="260" height="280" rx="25" fill="#3c4a58" stroke="#dce8ef" stroke-width="6"/><circle cx="535" cy="690" r="52" fill="#d8a17b"/><path d="M485 698Q496 636 540 636Q590 640 594 704Q560 675 535 675Q510 675 485 698" fill="#47362e"/><path d="M455 790Q535 735 615 790V900H455Z" fill="#366b89"/><path d="M518 800L400 865" stroke="#d8a17b" stroke-width="24" stroke-linecap="round"/></g><g><rect x="720" y="650" width="245" height="225" rx="25" fill="#475564" stroke="#dce8ef" stroke-width="6"/><circle cx="795" cy="715" r="48" fill="#d69c76"/><path d="M752 721Q762 665 800 662Q842 664 846 726Q818 698 794 699Q772 700 752 721" fill="#242930"/><path d="M745 805Q795 765 850 805V875H745Z" fill="#efb94f"/><circle cx="893" cy="728" r="38" fill="#e2b08d"/><path d="M862 728Q870 688 900 688Q928 692 930 733Q908 712 892 712Q877 712 862 728" fill="#594238"/><path d="M855 808Q895 775 936 810V875H855Z" fill="#a85d65"/></g><path d="M70 1060Q300 985 520 1055T1010 1040" fill="none" stroke="#7fb4ce" stroke-width="22" opacity=".45"/><g filter="url(#sh)"><path d="M55 45Q55 20 115 20H875Q935 20 935 95V315Q935 377 862 377H720L660 435L666 377H115Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="900">여기서 기다리세요. 새벽까지 모두 확인할게요.</text><text x="92" y="182" font-family="Arial" font-size="31">请留在这里，我们会一直确认到天亮。</text><text x="92" y="245" font-family="Arial" font-size="29">Stay here. We'll keep checking on everyone until dawn.</text></g><g filter="url(#sh)"><rect x="55" y="1465" width="970" height="305" rx="22" fill="#10161e" stroke="#78d7ff" stroke-width="7"/><text x="90" y="1540" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="900" fill="#78d7ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1608" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">침수 구역 주민들이 체육관 대피소로 모이고, 구조대가 가족 명단을 확인한다.</text><text x="90" y="1670" font-family="Arial" font-size="30" fill="#d8e4e9">受灾居民聚集到体育馆避难所，救援队逐一核对家属名单。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">Flood-zone residents gather in a gym shelter as rescuers verify every family.</text></g><text x="730" y="1180" font-family="Impact,Arial Black" font-size="86" fill="#9ce8ff" stroke="#111" stroke-width="9" transform="rotate(-6 730 1180)">WOOO—</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 11 / 26</text></svg>