text></g><g stroke="#111" stroke-width="8"><circle cx="340" cy="1150" r="52" fill="#d7aa88"/><path d="M295 1132q45-70 95 0" fill="#142438"/><path d="M300 1200q40-25 80 0l45 145H260z" fill="#ffcf4a"/><circle cx="700" cy="1190" r="45" fill="#d0a17d"/><path d="M660 1170q40-60 80 0" fill="#242222"/><path d="M660 1235l85 0 45 125H620z" fill="#d83c3c"/><circle cx="790" cy="1180" r="38" fill="#d2a27e"/><path d="M758 1165q35-55 70 0" fill="#1b1d21"/><path d="M755 1220h70l35 115h-135z" fill="#3e75d8"/></g><g fill="#fff" stroke="#101820" stroke-width="7"><path d="M95 1030h440q35 0 35 35v150q0 35-35 35H315l-80 70 20-70H95q-35 0-35-35v-150q0-35 35-35Z"/><path d="M560 905h420q35 0 35 35v145q0 35-35 35H770l-20 80-60-80H560q-35 0-35-35V940q0-35 35-35Z"/></g><text x="95" y="1090" font-size="34" font-family="sans-serif" font-weight="700">구조대장: 아이들부터 태운다!</text><text x="95" y="1140" font-size="30" font-family="sans-serif">先让孩子们上船！</text><text x="95" y="1190" font-size="28" font-family="sans-serif">Captain: Kids first. Move!</text><text x="555" y="965" font-size="32" font-family="sans-serif" font-weight="700">교사: 전원 확인했습니다!</text><text x="555" y="1015" font-size="29" font-family="sans-serif">所有学生都在这里！</text><text x="555" y="1065" font-size="27" font-family="sans-serif">Teacher: Everyone is accounted for!</text><rect x="55" y="1545" width="970" height="250" rx="28" fill="#080d14e8" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1610" fill="#e9c46a" font-size="32" font-family="sans-serif" font-weight="700">상황 설명 · SCENE 16 / FTF-02</text><text x="90" y="1665" fill="#fff" font-size="34" font-family="sans-serif">침수된 초등학교. 구조보트가 창문 아래까지 접근한다.</text><text x="90" y="1715" fill="#d9e7ef" font-size="30" font-family="sans-serif">被洪水包围的小学，救援艇靠近教学楼。</text><text x="90" y="1765" fill="#b8c8d8" font-size="28" font-family="sans-serif">A rescue boat reaches the flooded school before the water rises again.</text><text x="760" y="430" fill="#ffe37d" font-size="70" font-family="sans-serif" font-weight="900" transform="rotate(-9 760 430)" filter="url(#glow)">SPLASH!</text><path d="M60 1500q130-90 260 0t260 0 260 0 200 0" fill="none" stroke="#d9f2ff" stroke-width="10" opacity=".8"/></svg>