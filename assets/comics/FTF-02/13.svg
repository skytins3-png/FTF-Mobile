<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#121a25"/><stop offset=".62" stop-color="#30465c"/><stop offset="1" stop-color="#15212c"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#080c11"/><rect width="1080" height="1300" fill="url(#sky)"/><g stroke="#acd6e8" stroke-width="8" opacity=".55"><path d="M55 35L-20 245"/><path d="M210 55L130 275"/><path d="M370 20L300 220"/><path d="M560 70L485 280"/><path d="M760 30L690 235"/><path d="M950 55L875 270"/></g><path d="M0 760Q190 705 390 750T760 735T1080 775V1300H0Z" fill="#355d76"/><path d="M0 845Q185 785 370 845T760 820T1080 865" fill="none" stroke="#9fe7ff" stroke-width="22" opacity=".6"/><path d="M0 610L370 545L520 600L720 535L1080 600V735L780 690L605 745L430 685L0 760Z" fill="#777b6c" stroke="#252923" stroke-width="10"/><path d="M515 594L610 665L552 744L470 684Z" fill="#1d2530"/><path d="M500 610L550 640L520 690L470 665Z" fill="#52738a"/><g fill="#252c34"><rect x="85" y="420" width="190" height="220"/><rect x="805" y="400" width="190" height="220"/></g><g fill="#ffd36b"><rect x="115" y="458" width="48" height="58"/><rect x="185" y="458" width="48" height="58"/><rect x="835" y="438" width="48" height="58"/><rect x="905" y="438" width="48" height="58"/></g><g transform="translate(130 930)"><circle cx="105" cy="0" r="55" fill="#d89d74"/><path d="M55 8Q65-60 108-60Q158-58 164 15Q130-18 105-18Q78-17 55 8" fill="#25272c"/><path d="M20 100Q105 45 190 100V260H20Z" fill="#f0c94f" stroke="#172330" stroke-width="8"/><path d="M88 125L88 210M45 168H132" stroke="#ec5f5f" stroke-width="13"/><path d="M130 130L300 72" stroke="#d89d74" stroke-width="24" stroke-linecap="round"/></g><g transform="translate(680 920)"><circle cx="110" cy="0" r="53" fill="#deb18e"/><path d="M62 8Q74-55 112-55Q158-53 164 12Q135-15 110-15Q86-14 62 8" fill="#43342f"/><path d="M28 95Q110 42 192 95V255H28Z" fill="#315f7e"/><path d="M95 125L-20 82" stroke="#deb18e" stroke-width="24" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 45Q55 20 115 20H875Q935 20 935 95V315Q935 377 862 377H720L655 438L662 377H115Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="112" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="900">제방이 무너진다! 모두 동쪽 고지대로!</text><text x="92" y="180" font-family="Arial" font-size="31">堤坝决口了！所有人立刻向东侧高地撤离！</text><text x="92" y="245" font-family="Arial" font-size="29">The levee is breaking! Everyone to the eastern high ground!</text></g><g filter="url(#sh)"><rect x="55" y="1465" width="970" height="305" rx="22" fill="#10161e" stroke="#78d7ff" stroke-width="7"/><text x="90" y="1540" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="900" fill="#78d7ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1608" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">불어난 강물이 제방 틈을 찢고 들어오자 구조대가 즉시 대피 방향을 바꾼다.</text><text x="90" y="1670" font-family="Arial" font-size="30" fill="#d8e4e9">暴涨河水冲破堤坝缺口，救援队立即改变疏散路线。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">The swollen river tears through the levee, forcing rescuers to reroute the evacuation.</text></g><text x="650" y="1120" font-family="Impact,Arial Black" font-size="92" fill="#8ce7ff" stroke="#111" stroke-width="10" transform="rotate(-8 650 1120)">CRAAASH!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 13 / 26</text></svg>