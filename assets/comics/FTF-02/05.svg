<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111827"/><stop offset=".55" stop-color="#263746"/><stop offset="1" stop-color="#42505b"/></linearGradient><linearGradient id="flood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#375566"/><stop offset="1" stop-color="#172832"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs>
<rect width="1080" height="1920" fill="#080d12"/>
<rect width="1080" height="1190" fill="url(#storm)"/>
<!-- storm clouds and lightning -->
<g fill="#0b1118" opacity=".92"><ellipse cx="180" cy="170" rx="260" ry="130"/><ellipse cx="470" cy="120" rx="330" ry="150"/><ellipse cx="820" cy="190" rx="360" ry="150"/></g>
<path d="M715 140 L625 340 L720 322 L650 540 L840 270 L735 290 L815 140Z" fill="#f8f3b2" stroke="#fff" stroke-width="10"/>
<!-- city -->
<g fill="#18242c"><rect x="20" y="480" width="120" height="350"/><rect x="160" y="410" width="150" height="420"/><rect x="340" y="520" width="100" height="310"/><rect x="470" y="445" width="160" height="385"/><rect x="660" y="500" width="120" height="330"/><rect x="805" y="430" width="110" height="400"/><rect x="940" y="520" width="120" height="310"/></g>
<g fill="#e5d58e"><rect x="55" y="535" width="28" height="35"/><rect x="210" y="475" width="28" height="35"/><rect x="525" y="505" width="28" height="35"/><rect x="850" y="490" width="28" height="35"/></g>
<!-- flooded street -->
<path d="M0 760 C220 710 370 810 540 760 C720 705 900 805 1080 742 L1080 1260 L0 1260Z" fill="url(#flood)"/>
<path d="M0 885 C170 845 300 925 455 890 C630 850 780 940 1080 865" fill="none" stroke="#8eb6c1" stroke-width="12" opacity=".6"/>
<path d="M0 1010 C180 970 310 1060 500 1010 C680 970 840 1065 1080 990" fill="none" stroke="#7ba2ae" stroke-width="9" opacity=".5"/>
<!-- evacuation bus -->
<g transform="translate(78 765)" filter="url(#shadow)"><rect x="0" y="0" width="370" height="180" rx="22" fill="#e6a542" stroke="#111" stroke-width="9"/><rect x="38" y="32" width="90" height="70" fill="#8fb0bd"/><rect x="150" y="32" width="90" height="70" fill="#8fb0bd"/><rect x="262" y="32" width="70" height="70" fill="#8fb0bd"/><circle cx="90" cy="180" r="38" fill="#111"/><circle cx="285" cy="180" r="38" fill="#111"/><text x="75" y="150" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#111">EVAC</text></g>
<!-- rescue characters -->
<g transform="translate(530 835)"><ellipse cx="190" cy="540" rx="230" ry="60" fill="#000" opacity=".3"/><circle cx="150" cy="115" r="72" fill="#eac4a4"/><path d="M82 110 Q100 28 160 35 Q225 35 230 125 Q190 92 150 92 Q112 92 82 110" fill="#171c21"/><path d="M80 205 Q150 160 220 205 L265 460 Q150 505 35 460Z" fill="#df5a3e"/><rect x="82" y="285" width="140" height="35" fill="#f5dd64"/><path d="M58 445 L100 710 L155 710 L150 468Z" fill="#202830"/><path d="M245 445 L210 710 L160 710 L165 468Z" fill="#202830"/>
<circle cx="360" cy="180" r="58" fill="#edc7aa"/><path d="M305 177 Q320 110 370 115 Q420 116 425 192 Q390 165 358 165 Q330 165 305 177" fill="#2c2421"/><path d="M305 250 Q360 220 415 250 L440 440 Q360 470 280 440Z" fill="#3a5970"/><path d="M292 435 L320 650 L360 650 L355 450Z" fill="#202830"/><path d="M430 435 L405 650 L365 650 L370 450Z" fill="#202830"/><path d="M214 320 Q275 340 314 305" fill="none" stroke="#eac4a4" stroke-width="30" stroke-linecap="round"/></g>
<!-- speech bubble -->
<g filter="url(#shadow)"><path d="M70 220 Q70 145 150 145 H590 Q670 145 670 225 V410 Q670 485 590 485 H220 L150 540 L170 485 H150 Q70 485 70 410Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="125" y="240" font-family="Arial,'Malgun Gothic',sans-serif" font-size="40" font-weight="800" fill="#111">물이 더 차오르기 전에 올라가요!</text><text x="125" y="305" font-family="Arial,sans-serif" font-size="34" fill="#333">趁水位还没继续上涨，快上车！</text><text x="125" y="365" font-family="Arial,sans-serif" font-size="31" fill="#555">Get on before the water rises higher!</text></g>
<g filter="url(#shadow)"><path d="M585 1185 Q600 1110 680 1110 H980 Q1030 1110 1030 1180 V1325 Q1030 1400 950 1400 H740 L680 1450 L695 1400 Q585 1395 585 1325Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="640" y="1208" font-family="Arial,'Malgun Gothic',sans-serif" font-size="38" font-weight="800" fill="#111">네, 같이 가요!</text><text x="640" y="1265" font-family="Arial,sans-serif" font-size="34" fill="#333">好，我们一起走！</text><text x="640" y="1322" font-family="Arial,sans-serif" font-size="31" fill="#555">Yes—let's go together!</text></g>
<!-- caption -->
<g filter="url(#shadow)"><rect x="55" y="1510" width="970" height="275" rx="18" fill="#101318" stroke="#ffd65c" stroke-width="7"/><text x="92" y="1580" font-family="Arial,'Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="92" y="1643" font-family="Arial,'Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#fff">강물이 도로를 삼키자 마지막 대피 차량이 출발한다.</text><text x="92" y="1702" font-family="Arial,sans-serif" font-size="31" fill="#d8e4e9">河水吞没道路，最后一辆疏散车即将出发。</text><text x="92" y="1760" font-family="Arial,sans-serif" font-size="29" fill="#b9c9d0">As floodwater takes the street, the final evacuation bus departs.</text></g>
<text x="715" y="600" font-family="Impact,Arial Black,sans-serif" font-size="100" font-style="italic" fill="#ffd65c" stroke="#111" stroke-width="10" transform="rotate(-9 715 600)">RUMBLE!</text>
<text x="58" y="1870" font-family="Arial,sans-serif" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 05 / 26</text>
</svg>