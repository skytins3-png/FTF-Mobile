<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#15263a"/><stop offset=".65" stop-color="#556d7c"/><stop offset="1" stop-color="#d0a36b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#070b10"/><rect width="1080" height="1260" fill="url(#sky)"/><circle cx="850" cy="250" r="110" fill="#ffd18a" opacity=".8"/><g fill="#17222b"><rect x="0" y="480" width="170" height="420"/><rect x="205" y="390" width="165" height="510"/><rect x="410" y="520" width="180" height="380"/><rect x="640" y="430" width="160" height="470"/><rect x="835" y="470" width="245" height="430"/></g><path d="M0 850 C190 800 340 900 520 850 C720 800 900 915 1080 845 L1080 1260 L0 1260Z" fill="#2e5868"/><g transform="translate(95 865)"><rect width="430" height="190" rx="24" fill="#cfd8df" stroke="#182128" stroke-width="8"/><rect x="42" y="42" width="160" height="92" fill="#7ba5b6"/><rect x="220" y="42" width="155" height="92" fill="#7ba5b6"/><rect x="150" y="-45" width="125" height="55" rx="12" fill="#cf3f38"/><circle cx="72" cy="190" r="36" fill="#0d1014"/><circle cx="350" cy="190" r="36" fill="#0d1014"/></g><g transform="translate(600 850)"><circle cx="125" cy="105" r="65" fill="#eac3a4"/><path d="M65 100 Q75 30 130 32 Q190 35 194 112 Q155 78 120 78 Q88 78 65 100" fill="#2b2828"/><path d="M55 195 Q125 150 195 195 L230 430 Q125 470 18 430Z" fill="#e6a53e"/><rect x="78" y="255" width="105" height="30" fill="#f8ed84"/><path d="M60 430 L95 680 H140 L132 448Z" fill="#242b32"/><path d="M195 430 L170 680 H128 L132 448Z" fill="#242b32"/><circle cx="300" cy="170" r="48" fill="#e9c1a0"/><path d="M257 168 Q268 115 305 117 Q347 120 349 178 Q324 153 295 153 Q273 153 257 168" fill="#3a302a"/><path d="M255 235 Q300 208 347 238 L370 400 Q300 432 232 400Z" fill="#385c74"/></g><g filter="url(#s)"><path d="M55 70 Q55 30 115 30 H720 Q790 30 790 100 V300 Q790 365 720 365 H225 L145 430 L165 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="108" y="130" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">밤은 버텼어. 이제 구조를 시작한다.</text><text x="108" y="196" font-family="Arial" font-size="34">我们熬过了这一夜，现在开始救援。</text><text x="108" y="260" font-family="Arial" font-size="31">We made it through the night. Rescue starts now.</text></g><text x="675" y="720" font-family="Impact,Arial Black" font-size="92" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 675 720)">WEE-OO!</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">폭풍이 약해지자 구조 차량이 침수된 거리로 들어간다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">风暴减弱后，救援车辆驶入被淹的街道。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">As the storm weakens, rescue vehicles enter the flooded streets.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 07 / 26</text></svg>