<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="FTF-02 scene 29 dawn rescue corridor after Typhoon Arka"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#18243a"/><stop offset=".55" stop-color="#5f7890"/><stop offset="1" stop-color="#efb16c"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#315f76"/><stop offset="1" stop-color="#153542"/></linearGradient><filter id="ds"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#060a10"/><text x="42" y="62" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="900">FTF-02 · TYPHOON ARKA · SCENE 29</text><text x="42" y="96" fill="#a9bdd0" font-family="Arial,sans-serif" font-size="20">DAWN RESCUE CORRIDOR · 새벽 구조 회랑 · 黎明救援通道</text><!-- panel 1 --><rect x="30" y="120" width="1020" height="520" rx="22" fill="url(#sky)" stroke="#fff" stroke-width="6"/><path d="M30 440L160 360 290 415 430 325 610 405 760 350 1050 455V640H30Z" fill="#293d4b"/><path d="M30 505q160-55 320 0t320 0 380 0v135H30z" fill="url(#water)"/><path d="M85 536h720" stroke="#9fd8e8" stroke-width="9"/><path d="M760 485l170-78 82 65-175 75z" fill="#e7e9ea" stroke="#13202a" stroke-width="7"/><rect x="828" y="430" width="54" height="46" rx="6" fill="#3b6680"/><circle cx="815" cy="560" r="14" fill="#f14e4e"/><circle cx="885" cy="552" r="14" fill="#f14e4e"/><g stroke="#18202a" stroke-width="7"><circle cx="220" cy="490" r="41" fill="#d29b74"/><path d="M180 482q40-58 80 0" fill="#27333e"/><path d="M163 535h114l30 105H133z" fill="#f2c548"/><circle cx="380" cy="490" r="41" fill="#c98f69"/><path d="M340 482q40-58 80 0" fill="#3a2c2f"/><path d="M323 535h114l30 105H293z" fill="#4b829d"/></g><rect x="58" y="150" width="690" height="205" rx="24" fill="#fff" stroke="#111" stroke-width="7" filter="url(#ds)"/><text x="85" y="205" font-family="Arial,sans-serif" font-size="31" font-weight="900">구조대장: 새벽 5시, 구조 회랑을 연다!</text><text x="85" y="260" font-family="Arial,sans-serif" font-size="27">救援队长：凌晨五点，开启救援通道！</text><text x="85" y="315" font-family="Arial,sans-serif" font-size="26">Rescue chief: 05:00. Open the rescue corridor!</text><text x="780" y="255" fill="#ffe36d" font-family="Arial,sans-serif" font-size="58" font-weight="900" transform="rotate(-8 780 255)">WEE-OO!</text><!-- panel 2 --><rect x="30" y="670" width="500" height="540" rx="22" fill="#243845" stroke="#fff" stroke-width="6"/><path d="M55 1030h450v180H55z" fill="#385668"/><path d="M80 1040h380" stroke="#d7c27e" stroke-width="20"/><path d="M90 900l85-72 100 72v170H90z" fill="#cfc8b8" stroke="#111" stroke-width="7"/><path d="M315 820l75-64 85 64v180H315z" fill="#bbb7ad" stroke="#111" stroke-width="7"/><g stroke="#111" stroke-width="6"><circle cx="155" cy="1000" r="34" fill="#d6a27a"/><path d="M124 992q31-48 62 0" fill="#302a2b"/><path d="M112 1040h86l28 120H84z" fill="#efc64d"/><circle cx="310" cy="995" r="34" fill="#c98f68"/><path d="M279 987q31-48 62 0" fill="#25303a"/><path d="M267 1035h86l28 125H239z" fill="#4f839e"/><circle cx="430" cy="1005" r="28" fill="#d3a17c"/><path d="M405 999q25-40 50 0" fill="#49352f"/><path d="M394 1040h72l22 105H372z" fill="#8a6cc2"/></g><rect x="55" y="700" width="435" height="190" rx="22" fill="#fff" stroke="#111" stroke-width="7"/><text x="76" y="753" font-family="Arial,sans-serif" font-size="27" font-weight="900">대원: 노란 선 안쪽으로, 한 줄로 이동!</text><text x="76" y="804" font-family="Arial,sans-serif" font-size="24">队员：沿黄色安全线，排成一列前进！</text><text x="76" y="855" font-family="Arial,sans-serif" font-size="23">Rescuer: Stay inside the yellow line. Single file!</text><text x="300" y="960" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="900">STEP! STEP!</text><!-- panel 3 --><rect x="550" y="670" width="500" height="540" rx="22" fill="#172833" stroke="#fff" stroke-width="6"/><rect x="582" y="710" width="436" height="245" rx="18" fill="#08151d" stroke="#6eafc6" stroke-width="5"/><path d="M610 900l65-42 65 18 58-95 70 30 66-70 55 115" fill="none" stroke="#ffcf5d" stroke-width="10"/><circle cx="835" cy="812" r="15" fill="#ff5d5d"/><text x="607" y="760" fill="#d9f5ff" font-family="Arial,sans-serif" font-size="22" font-weight="800">BRIDGE · RIVER · SHELTER · RESCUE LIVE</text><g stroke="#111" stroke-width="7"><circle cx="690" cy="1050" r="38" fill="#d0a07a"/><path d="M655 1040q35-53 70 0" fill="#24313a"/><path d="M640 1092h100l24 112H616z" fill="#397c98"/><circle cx="900" cy="1050" r="38" fill="#c9906b"/><path d="M865 1040q35-53 70 0" fill="#3a2c2f"/><path d="M850 1092h100l24 112H826z" fill="#d8aa40"/></g><rect x="575" y="960" width="435" height="165" rx="21" fill="#fff" stroke="#111" stroke-width="7"/><text x="595" y="1008" font-family="Arial,sans-serif" font-size="25" font-weight="900">관제: 3번 다리 통과 완료. 다음 구역 개방.</text><text x="595" y="1055" font-family="Arial,sans-serif" font-size="22">指挥中心：三号桥已清空，开放下一区域。</text><text x="595" y="1102" font-family="Arial,sans-serif" font-size="21">Control: Bridge 3 cleared. Open the next sector.</text><text x="650" y="1180" fill="#ffe16b" font-family="Arial,sans-serif" font-size="44" font-weight="900">BEEP! CLEAR!</text><!-- panel 4 --><rect x="30" y="1240" width="1020" height="630" rx="22" fill="#1b3037" stroke="#fff" stroke-width="6"/><circle cx="890" cy="1400" r="110" fill="#f1bb6a"/><path d="M30 1640l170-95 150 55 145-115 180 98 150-92 225 130v249H30z" fill="#375b49"/><path d="M95 1715h875" stroke="#dccb86" stroke-width="25"/><g stroke="#111" stroke-width="7"><circle cx="290" cy="1585" r="45" fill="#d4a17a"/><path d="M248 1574q42-64 84 0" fill="#24303a"/><path d="M230 1635h120l36 180H194z" fill="#e5b644"/><circle cx="500" cy="1585" r="45" fill="#c98f6a"/><path d="M458 1574q42-64 84 0" fill="#392b2e"/><path d="M440 1635h120l36 180H404z" fill="#4d819c"/><circle cx="690" cy="1592" r="38" fill="#d7a57f"/><path d="M655 1583q35-54 70 0" fill="#564039"/><path d="M642 1636h96l30 165H612z" fill="#7b68b8"/></g><rect x="65" y="1280" width="720" height="210" rx="25" fill="#fff" stroke="#111" stroke-width="7"/><text x="92" y="1340" font-family="Arial,sans-serif" font-size="30" font-weight="900">내레이션: 밤을 버틴 도시는, 함께 움직여 아침을 만들었다.</text><text x="92" y="1397" font-family="Arial,sans-serif" font-size="26">旁白：熬过黑夜的城市，用同行迎来了清晨。</text><text x="92" y="1452" font-family="Arial,sans-serif" font-size="25">Narration: The city survived the night by moving as one.</text><text x="760" y="1710" fill="#ffe36d" font-family="Arial,sans-serif" font-size="55" font-weight="900">THUMP!</text><text x="625" y="1780" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="900">구조는 한 사람을 구하는 일이 아니라, 길을 함께 여는 일.</text><text x="625" y="1823" fill="#dce9ef" font-family="Arial,sans-serif" font-size="23">救援不仅是救一个人，而是一起打开生路。</text><text x="625" y="1858" fill="#b9cbd6" font-family="Arial,sans-serif" font-size="22">Rescue means opening a safe way forward together.</text></svg>