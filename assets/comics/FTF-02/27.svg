<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="FTF-02 scene 27 community storm drill"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#17324a"/><stop offset=".52" stop-color="#6f91a6"/><stop offset="1" stop-color="#f1b86d"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#070b10"/><text x="55" y="72" fill="#fff" font-family="sans-serif" font-size="38" font-weight="900">FTF-02 · AFTER SEPTEMBER 13 · SCENE 27</text><!-- panel 1 --><rect x="35" y="100" width="1010" height="610" rx="22" fill="url(#sky)" stroke="#fff" stroke-width="6"/><path d="M35 530L190 430 310 485 455 390 620 470 760 405 1045 520V710H35z" fill="#314b58"/><g fill="#536b76" stroke="#d8e4e9" stroke-width="5"><rect x="95" y="390" width="220" height="250"/><rect x="350" y="350" width="270" height="290"/><rect x="670" y="410" width="280" height="230"/></g><path d="M35 620h1010v90H35z" fill="#31383e"/><path d="M90 660h880" stroke="#f4d35e" stroke-width="10" stroke-dasharray="65 35"/><g stroke="#111" stroke-width="7"><circle cx="245" cy="545" r="42" fill="#d4a17d"/><path d="M205 535q40-60 80 0" fill="#202b35"/><path d="M185 585h120l50 115H145z" fill="#e7b73e"/><circle cx="520" cy="540" r="42" fill="#c9906e"/><path d="M480 530q40-58 80 0" fill="#252126"/><path d="M460 580h120l45 120H420z" fill="#457c9b"/></g><path d="M735 480h210v90H735z" fill="#fff5bd" stroke="#111" stroke-width="6"/><text x="760" y="520" font-family="sans-serif" font-size="25" font-weight="900">EVAC ROUTE</text><text x="785" y="555" font-family="sans-serif" font-size="24">HIGH GROUND ↑</text><path d="M70 135h570q30 0 30 30v165q0 30-30 30H360l-55 65 10-65H70q-30 0-30-30V165q0-30 30-30z" fill="#fff" stroke="#111" stroke-width="7" filter="url(#sh)"/><text x="95" y="195" font-family="sans-serif" font-size="32" font-weight="900">구조대장: 경보가 울리면 망설이지 마세요!</text><text x="95" y="245" font-family="sans-serif" font-size="28">救援队长：警报响起时，不要犹豫！</text><text x="95" y="295" font-family="sans-serif" font-size="27">Rescue chief: When the alarm sounds, move!</text><text x="760" y="300" fill="#ffe66d" font-family="sans-serif" font-size="66" font-weight="900" transform="rotate(-8 760 300)">WEE-OO!</text><!-- panel 2 --><rect x="35" y="740" width="490" height="540" rx="22" fill="#8bb4bd" stroke="#fff" stroke-width="6"/><path d="M35 1060q130-80 250-10t240-10v240H35z" fill="#547c69"/><path d="M110 960l140-115 145 115v205H110z" fill="#e8e0cf" stroke="#333" stroke-width="7"/><path d="M210 1080h90v85h-90z" fill="#4b6978"/><g stroke="#111" stroke-width="7"><circle cx="125" cy="1130" r="38" fill="#d5a27d"/><path d="M90 1120q35-52 70 0" fill="#33272a"/><path d="M75 1165h100l30 110H45z" fill="#efc24b"/><circle cx="410" cy="1130" r="38" fill="#c58e69"/><path d="M375 1120q35-52 70 0" fill="#1f2930"/><path d="M360 1165h100l30 110H330z" fill="#477b9d"/></g><rect x="65" y="775" width="430" height="185" rx="24" fill="#fff" stroke="#111" stroke-width="7"/><text x="90" y="825" font-family="sans-serif" font-size="29" font-weight="900">아이: 가족 대피 장소를 외웠어요.</text><text x="90" y="875" font-family="sans-serif" font-size="26">孩子：我记住了家人的避难地点。</text><text x="90" y="925" font-family="sans-serif" font-size="25">Child: I memorized our family meeting point.</text><text x="325" y="1030" fill="#fff" font-family="sans-serif" font-size="54" font-weight="900">STEP!</text><!-- panel 3 --><rect x="555" y="740" width="490" height="540" rx="22" fill="#425c6b" stroke="#fff" stroke-width="6"/><rect x="590" y="790" width="420" height="250" rx="16" fill="#15232c" stroke="#8fc9d4" stroke-width="5"/><path d="M620 980l70-80 65 45 80-120 130 155" fill="none" stroke="#ffce56" stroke-width="12"/><circle cx="885" cy="870" r="18" fill="#ff5d5d"/><text x="620" y="835" fill="#d8f5ff" font-family="sans-serif" font-size="26" font-weight="800">RAIN / RIVER / SLOPE LIVE MONITOR</text><g stroke="#111" stroke-width="7"><circle cx="690" cy="1135" r="40" fill="#d2a07b"/><path d="M652 1125q38-56 76 0" fill="#242c31"/><path d="M640 1175h105l28 100H612z" fill="#3e7f98"/><circle cx="890" cy="1135" r="40" fill="#c98f6c"/><path d="M852 1125q38-56 76 0" fill="#2d2527"/><path d="M840 1175h105l28 100H812z" fill="#d6a83f"/></g><text x="580" y="1085" fill="#ffdf69" font-family="sans-serif" font-size="48" font-weight="900">BEEP · BEEP</text><!-- finale --><rect x="35" y="1310" width="1010" height="560" rx="22" fill="#101a22" stroke="#fff" stroke-width="6"/><circle cx="875" cy="1440" r="105" fill="#f4c66b"/><path d="M35 1610l160-105 145 65 145-110 180 100 145-90 285 140v260H35z" fill="#294b45"/><g stroke="#111" stroke-width="7"><circle cx="300" cy="1590" r="48" fill="#d4a17c"/><path d="M255 1578q45-68 90 0" fill="#202830"/><path d="M235 1640h130l45 185H190z" fill="#e4b744"/><circle cx="520" cy="1590" r="48" fill="#ca946f"/><path d="M475 1578q45-68 90 0" fill="#30262a"/><path d="M455 1640h130l45 185H410z" fill="#4d809b"/></g><rect x="70" y="1345" width="660" height="200" rx="26" fill="#fff" stroke="#111" stroke-width="7"/><text x="100" y="1400" font-family="sans-serif" font-size="31" font-weight="900">내레이션: 기억은 공포가 아니라 준비가 된다.</text><text x="100" y="1455" font-family="sans-serif" font-size="28">旁白：记忆不再是恐惧，而成为准备。</text><text x="100" y="1510" font-family="sans-serif" font-size="27">Narration: Memory becomes preparation, not fear.</text><text x="650" y="1710" fill="#ffe16b" font-family="sans-serif" font-size="58" font-weight="900">THUMP!</text><text x="650" y="1770" fill="#fff" font-family="sans-serif" font-size="29" font-weight="800">9월 13일 이후, 우리는 더 빨리 움직인다.</text><text x="650" y="1810" fill="#dbe8ef" font-family="sans-serif" font-size="25">九月十三日之后，我们行动得更快。</text><text x="650" y="1848" fill="#b9cad5" font-family="sans-serif" font-size="24">After Sept. 13, we move sooner.</text></svg>