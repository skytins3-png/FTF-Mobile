130H500z" fill="#5b78d6"/></g><path d="M0 1240q140-65 280 0t280 0 280 0 240 0" fill="none" stroke="#6f9eb8" stroke-width="16"/><g fill="#fff" stroke="#111" stroke-width="7"><path d="M75 900h440q35 0 35 35v155q0 35-35 35H285l-65 75 10-75H75q-35 0-35-35V935q0-35 35-35z"/><path d="M585 870h420q35 0 35 35v155q0 35-35 35H825l-50 70-35-70H585q-35 0-35-35V905q0-35 35-35z"/></g><text x="85" y="965" font-size="33" font-family="sans-serif" font-weight="700">주민: 옥상에 세 명 더 있어요!</text><text x="85" y="1015" font-size="29" font-family="sans-serif">屋顶还有三个人！</text><text x="85" y="1065" font-size="27" font-family="sans-serif">Resident: Three more are still on the roof!</text><text x="595" y="935" font-size="33" font-family="sans-serif" font-weight="700">구조대: 한 명씩, 천천히!</text><text x="595" y="985" font-size="29" font-family="sans-serif">一个一个来，慢慢走！</text><text x="595" y="1035" font-size="27" font-family="sans-serif">Rescuer: One at a time. Stay low!</text><text x="720" y="710" fill="#ffe37d" font-size="72" font-family="sans-serif" font-weight="900" transform="rotate(-8 720 710)" filter="url(#glow)">WHUP-WHUP!</text><rect x="55" y="1540" width="970" height="250" rx="28" fill="#080d14e8" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1605" fill="#e9c46a" font-size="32" font-family="sans-serif" font-weight="700">상황 설명 · SCENE 18 / FTF-02</text><text x="90" y="1660" fill="#fff" font-size="34" font-family="sans-serif">침수된 아파트 옥상, 헬기와 구조대가 주민들을 옮긴다.</text><text x="90" y="1710" fill="#d9e7ef" font-size="30" font-family="sans-serif">被洪水围困的公寓楼顶，直升机正在转移居民。</text><text x="90" y="1760" fill="#b8c8d8" font-size="28" font-family="sans-serif">A helicopter lifts residents from a rooftop above the floodwater.</text><path d="M810 520h140M880 450v140" stroke="#ffe37d" stroke-width="12"/><path d="M900 760l-55 120M865 760l-40 120M935 760l-70 120" stroke="#cdd7df" stroke-width="5"/></svg>