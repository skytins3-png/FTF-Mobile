fill="#4b3a33"/><path d="M425 255 Q500 205 575 255 L602 380 H405Z" fill="#2f5876"/><path d="M470 292 L370 245" stroke="#d9a079" stroke-width="26" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 45 Q55 20 115 20 H875 Q935 20 935 95 V315 Q935 377 862 377 H710 L648 440 L655 377 H115 Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">손 놓지 마요! 보트가 건물 사이로 빠져나갑니다!</text><text x="92" y="182" font-family="Arial" font-size="31">别松手！救援艇要穿过楼群了！</text><text x="92" y="245" font-family="Arial" font-size="29">Don't let go! The rescue boat is threading between the buildings!</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#78d7ff" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#78d7ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">태풍의 밤, 구조 보트가 잠긴 골목 사이를 돌며 고립 주민을 실어 나른다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">台风之夜，救援艇穿过被淹街区转移受困居民。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">Through the typhoon night, a rescue boat ferries stranded residents across flooded blocks.</text></g><text x="720" y="760" font-family="Impact,Arial Black" font-size="88" fill="#8be4ff" stroke="#111" stroke-width="9" transform="rotate(-7 720 760)">SPLASH!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 10 / 26</text></svg>