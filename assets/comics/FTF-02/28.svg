<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="FTF-02 scene 28 night flood evacuation"><defs><linearGradient id="storm" x2="0" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#526d7c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#070b12"/><text x="48" y="70" fill="#fff" font-family="sans-serif" font-size="36" font-weight="900">FTF-02 · AFTER SEPTEMBER 13 · SCENE 28</text><rect x="35" y="100" width="1010" height="560" rx="22" fill="url(#storm)" stroke="#fff" stroke-width="6"/><path d="M35 470L170 390 310 455 445 355 610 440 760 365 1045 470V660H35z" fill="#263b48"/><path d="M35 545q180-55 340 0t335 0 335 0v115H35z" fill="#285c73"/><path d="M60 520q120 45 240 0t240 0 240 0 240 0" fill="none" stroke="#9fd9ea" stroke-width="8"/><g stroke="#111" stroke-width="7"><circle cx="250" cy="505" r="42" fill="#d4a17d"/><path d="M210 495q40-62 80 0" fill="#202934"/><path d="M190 548h120l45 105H145z" fill="#f0bd3f"/><circle cx="515" cy="505" r="42" fill="#ca936e"/><path d="M475 495q40-62 80 0" fill="#29242a"/><path d="M455 548h120l45 105H410z" fill="#4b819f"/></g><rect x="70" y="135" width="700" height="205" rx="24" fill="#fff" stroke="#111" stroke-width="7" filter="url(#shadow)"/><text x="98" y="190" font-family="sans-serif" font-size="31" font-weight="900">구조대장: 하천 수위가 넘었다! 지금 고지대로!</text><text x="98" y="245" font-family="sans-serif" font-size="27">救援队长：河水越过警戒线！立即去高处！</text><text x="98" y="300" font-family="sans-serif" font-size="26">Rescue chief: River breached the line—high ground now!</text><text x="790" y="410" fill="#ffe36b" font-family="sans-serif" font-size="64" font-weight="900" transform="rotate(-9 790 410)">WEE-OO!</text><rect x="35" y="690" width="490" height="540" rx="22" fill="#243747" stroke="#fff" stroke-width="6"/><path d="M70 1040l135-155 145 155v180H70z" fill="#d8d3c8" stroke="#111" stroke-width="7"/><rect x="185" y="1080" width="70" height="140" fill="#40586a"/><path d="M370 800v390" stroke="#c8dbe4" stroke-width="14"/><path d="M370 810l80 80-80 80" fill="none" stroke="#ffe36b" stroke-width="16"/><g stroke="#111" stroke-width="7"><circle cx="115" cy="1090" r="36" fill="#d6a37d"/><path d="M82 1080q33-50 66 0" fill="#34292b"/><path d="M70 1125h90l25 95H45z" fill="#efc14b"/><circle cx="315" cy="1090" r="36" fill="#c9916c"/><path d="M282 1080q33-50 66 0" fill="#1e2930"/><path d="M270 1125h90l25 95H245z" fill="#4b7e99"/></g><rect x="62" y="720" width="420" height="190" rx="22" fill="#fff" stroke="#111" stroke-width="7"/><text x="84" y="775" font-family="sans-serif" font-size="28" font-weight="900">엄마: 손 놓지 마. 훈련한 길로 가자.</text><text x="84" y="825" font-family="sans-serif" font-size="25">妈妈：别松手，走我们演练过的路线。</text><text x="84" y="875" font-family="sans-serif" font-size="24">Mom: Hold on. Take the route we practiced.</text><text x="315" y="1015" fill="#fff" font-family="sans-serif" font-size="48" font-weight="900">STEP! STEP!</text><rect x="555" y="690" width="490" height="540" rx="22" fill="#182a35" stroke="#fff" stroke-width="6"/><rect x="585" y="730" width="430" height="260" rx="16" fill="#09151d" stroke="#76b8cb" stroke-width="5"/><path d="M615 930l65-45 60 15 55-100 65 45 65-80 60 115" fill="none" stroke="#ffcf55" stroke-width="11"/><circle cx="860" cy="845" r="17" fill="#ff5d5d"/><text x="610" y="780" fill="#d9f5ff" font-family="sans-serif" font-size="25" font-weight="800">RIVER LEVEL · SLOPE · SHELTER LIVE</text><g stroke="#111" stroke-width="7"><circle cx="700" cy="1090" r="39" fill="#d1a07a"/><path d="M664 1080q36-54 72 0" fill="#252d32"/><path d="M650 1130h100l25 95H625z" fill="#397d98"/><circle cx="900" cy="1090" r="39" fill="#c98f6b"/><path d="M864 1080q36-54 72 0" fill="#30262a"/><path d="M850 1130h100l25 95H825z" fill="#d5a83f"/></g><text x="600" y="1035" fill="#ffdf69" font-family="sans-serif" font-size="46" font-weight="900">BEEP! BEEP!</text><rect x="35" y="1260" width="1010" height="610" rx="22" fill="#162b31" stroke="#fff" stroke-width="6"/><circle cx="870" cy="1410" r="100" fill="#efb85f"/><path d="M35 1640l150-100 145 55 145-115 165 95 145-80 310 145v230H35z" fill="#315849"/><path d="M110 1710h860" stroke="#d6c78a" stroke-width="24"/><g stroke="#111" stroke-width="7"><circle cx="300" cy="1585" r="46" fill="#d5a27c"/><path d="M257 1573q43-65 86 0" fill="#202a31"/><path d="M240 1635h120l40 180H200z" fill="#e7b743"/><circle cx="520" cy="1585" r="46" fill="#ca936e"/><path d="M477 1573q43-65 86 0" fill="#30262a"/><path d="M460 1635h120l40 180H420z" fill="#4c819e"/></g><rect x="70" y="1300" width="670" height="210" rx="25" fill="#fff" stroke="#111" stroke-width="7"/><text x="98" y="1360" font-family="sans-serif" font-size="31" font-weight="900">내레이션: 경보보다 먼저 움직인 것은 기억이었다.</text><text x="98" y="1415" font-family="sans-serif" font-size="27">旁白：比警报更早行动的，是记忆。</text><text x="98" y="1470" font-family="sans-serif" font-size="26">Narration: Memory moved before the warning did.</text><text x="665" y="1695" fill="#ffe16b" font-family="sans-serif" font-size="56" font-weight="900">THUMP!</text><text x="655" y="1760" fill="#fff" font-family="sans-serif" font-size="28" font-weight="900">살아남는 법은, 미리 함께 움직이는 것.</text><text x="655" y="1805" fill="#dbe8ef" font-family="sans-serif" font-size="24">生存的方法，是提前一起行动。</text><text x="655" y="1845" fill="#b9cad5" font-family="sans-serif" font-size="23">Survival means moving together before it is too late.</text></svg>