<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#172033"/><stop offset=".55" stop-color="#7a6b72"/><stop offset="1" stop-color="#d39b73"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1920" fill="#060a10"/><rect width="1080" height="1180" fill="url(#dawn)"/><circle cx="870" cy="340" r="95" fill="#ffd77a" opacity=".75" filter="url(#glow)"/><path d="M0 920l180-120 150 80 210-180 240 150 180-100 120 120v420H0z" fill="#1a2832"/><path d="M0 1080q180-70 360 0t360 0 360 0v840H0z" fill="#173040"/><g stroke="#d6e5ef" stroke-width="4" opacity=".35"><path d="M80 0l-45 300M240 0l-55 330M430 0l-60 350M650 0l-65 330M880 0l-55 300"/></g><g><path d="M95 1190q200-70 400 0l130 55-90 135H180z" fill="#e36b35" stroke="#fff" stroke-width="7"/><rect x="205" y="1170" width="260" height="70" rx="25" fill="#f4f7fa"/><text x="335" y="1217" text-anchor="middle" fill="#122536" font-size="32" font-family="sans-serif" font-weight="700">SEARCH 03</text><path d="M620 1120q160-45 310 20l80 35-65 120H700z" fill="#d8dfe5" stroke="#8ca7ba" stroke-width="7"/></g><g stroke="#111" stroke-width="8"><circle cx="280" cy="1020" r="48" fill="#ca9977"/><path d="M240 1000q42-65 85 0" fill="#222a32"/><path d="M235 1065h95l58 180H180z" fill="#f0c23b"/><circle cx="520" cy="980" r="46" fill="#d3a27e"/><path d="M482 960q40-62 80 0" fill="#1e2329"/><path d="M478 1025h86l50 170H430z" fill="#e45c50"/><circle cx="735" cy="1000" r="44" fill="#c99b78"/><path d="M698 982q39-58 75 0" fill="#21272d"/><path d="M695 1042h80l50 160H650z" fill="#5877d6"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M70 560h450q35 0 35 35v155q0 35-35 35H300l-65 75 10-75H70q-35 0-35-35V595q0-35 35-35z"/><path d="M585 540h420q35 0 35 35v155q0 35-35 35H820l-45 75-40-75H585q-35 0-35-35V575q0-35 35-35z"/></g><text x="85" y="625" font-size="33" font-family="sans-serif" font-weight="700">구조대장: 날이 밝았다. 수색 재개!</text><text x="85" y="675" font-size="29" font-family="sans-serif">天亮了，重新开始搜索！</text><text x="85" y="725" font-size="27" font-family="sans-serif">Leader: Dawn. Resume the search!</text><text x="600" y="605" font-size="33" font-family="sans-serif" font-weight="700">대원: 드론 신호 잡혔습니다!</text><text x="600" y="655" font-size="29" font-family="sans-serif">无人机发现了信号！</text><text x="600" y="705" font-size="27" font-family="sans-serif">Rescuer: Drone picked up a signal!</text><g><rect x="760" y="850" width="180" height="90" rx="18" fill="#1d2a36" stroke="#7fc8ff" stroke-width="6"/><circle cx="805" cy="895" r="18" fill="#65e686"/><path d="M840 895h65" stroke="#65e686" stroke-width="8"/><path d="M850 835l60-40M850 835l-60-40" stroke="#cbd9e3" stroke-width="8"/></g><text x="710" y="810" fill="#ffe37d" font-size="70" font-family="sans-serif" font-weight="900" transform="rotate(-6 710 810)">PING!</text><rect x="55" y="1540" width="970" height="250" rx="28" fill="#080d14e8" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1605" fill="#e9c46a" font-size="32" font-family="sans-serif" font-weight="700">상황 설명 · SCENE 19 / FTF-02</text><text x="90" y="1660" fill="#fff" font-size="34" font-family="sans-serif">비가 잦아든 새벽, 구조대는 실종자 수색을 다시 시작한다.</text><text x="90" y="1710" fill="#d9e7ef" font-size="30" font-family="sans-serif">雨势减弱的黎明，救援队重新展开失踪人员搜索。</text><text x="90" y="1760" fill="#b8c8d8" font-size="28" font-family="sans-serif">At dawn, rescue teams restart the search as the rain finally eases.</text></svg>