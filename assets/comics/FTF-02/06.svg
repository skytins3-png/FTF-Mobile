<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#060b14"/><stop offset=".6" stop-color="#142331"/><stop offset="1" stop-color="#263742"/></linearGradient><linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#294653"/><stop offset="1" stop-color="#0f2028"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#05090e"/><rect width="1080" height="1240" fill="url(#night)"/><g fill="#101922"><rect x="0" y="405" width="125" height="440"/><rect x="150" y="330" width="130" height="515"/><rect x="315" y="445" width="115" height="400"/><rect x="465" y="350" width="160" height="495"/><rect x="665" y="410" width="115" height="435"/><rect x="820" y="325" width="130" height="520"/><rect x="975" y="455" width="105" height="390"/></g><g fill="#d7ca84" opacity=".45"><rect x="45" y="470" width="22" height="30"/><rect x="200" y="400" width="22" height="30"/><rect x="515" y="420" width="22" height="30"/><rect x="870" y="395" width="22" height="30"/></g><g stroke="#728d9b" stroke-width="7" opacity=".55"><path d="M50 80 L-10 320"/><path d="M180 60 L105 340"/><path d="M335 70 L255 350"/><path d="M500 50 L420 350"/><path d="M690 65 L600 365"/><path d="M860 50 L770 360"/><path d="M1030 70 L935 385"/></g><path d="M0 760 C190 725 345 800 515 765 C700 725 875 820 1080 748 L1080 1320 L0 1320Z" fill="url(#road)"/><path d="M0 900 C190 860 345 945 525 905 C710 860 890 960 1080 890" fill="none" stroke="#7199a7" stroke-width="11" opacity=".55"/><g transform="translate(80 760)" filter="url(#sh)"><rect x="0" y="0" width="390" height="190" rx="28" fill="#e7e9eb" stroke="#111" stroke-width="9"/><rect x="35" y="30" width="118" height="75" fill="#7fa2b2"/><rect x="180" y="30" width="118" height="75" fill="#7fa2b2"/><rect x="315" y="40" width="45" height="65" fill="#7fa2b2"/><rect x="38" y="126" width="314" height="28" fill="#d84b42"/><circle cx="95" cy="190" r="40" fill="#101216"/><circle cx="300" cy="190" r="40" fill="#101216"/><ellipse cx="70" cy="5" rx="24" ry="16" fill="#ff3a3a"/><ellipse cx="135" cy="5" rx="24" ry="16" fill="#5aa9ff"/><ellipse cx="200" cy="5" rx="24" ry="16" fill="#ff3a3a"/><ellipse cx="265" cy="5" rx="24" ry="16" fill="#5aa9ff"/><path d="M105 0 L-35 -120 L55 5Z" fill="#ff4a4a" opacity=".18"/><path d="M205 0 L330 -120 L255 5Z" fill="#5aa9ff" opacity=".18"/></g><g transform="translate(530 805)"><ellipse cx="220" cy="575" rx="270" ry="62" fill="#000" opacity=".32"/><circle cx="135" cy="130" r="70" fill="#edc6a5"/><path d="M68 125 Q85 42 145 46 Q207 48 215 140 Q180 108 138 108 Q100 108 68 125" fill="#1c2025"/><path d="M65 215 Q135 165 205 215 L250 470 Q135 515 20 470Z" fill="#df5d42"/><rect x="70" y="285" width="140" height="34" fill="#f0df6d"/><path d="M40 460 L78 735 L135 735 L132 480Z" fill="#20272e"/><path d="M240 460 L205 735 L148 735 L152 480Z" fill="#20272e"/><circle cx="375" cy="190" r="58" fill="#ebc5a7"/><path d="M315 185 Q330 118 382 120 Q432 120 440 198 Q405 170 374 170 Q344 170 315 185" fill="#322722"/><path d="M318 260 Q375 225 432 260 L460 455 Q375 492 290 455Z" fill="#3a5268"/><path d="M305 448 L335 665 L375 665 L370 465Z" fill="#20272e"/><path d="M450 448 L425 665 L385 665 L390 465Z" fill="#20272e"/><path d="M206 330 Q285 350 338 310" fill="none" stroke="#edc6a5" stroke-width="30" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M60 135 Q60 65 145 65 H700 Q780 65 780 145 V355 Q780 430 700 430 H225 L150 490 L170 430 H145 Q60 430 60 355Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="115" y="165" font-family="Arial,'Malgun Gothic',sans-serif" font-size="39" font-weight="800" fill="#111">저 구조등을 따라가면 돼!</text><text x="115" y="230" font-family="Arial,sans-serif" font-size="34" fill="#333">跟着救援灯走就行！</text><text x="115" y="295" font-family="Arial,sans-serif" font-size="31" fill="#555">Follow the rescue lights!</text></g><g filter="url(#sh)"><path d="M575 1188 Q590 1115 670 1115 H980 Q1030 1115 1030 1185 V1335 Q1030 1410 950 1410 H760 L690 1465 L708 1410 Q575 1408 575 1335Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="630" y="1215" font-family="Arial,'Malgun Gothic',sans-serif" font-size="37" font-weight="800" fill="#111">끝까지 같이 가요.</text><text x="630" y="1275" font-family="Arial,sans-serif" font-size="34" fill="#333">我们一起坚持到最后。</text><text x="630" y="1335" font-family="Arial,sans-serif" font-size="31" fill="#555">We stay together to the end.</text></g><g filter="url(#sh)"><rect x="55" y="1515" width="970" height="275" rx="18" fill="#101318" stroke="#ffd65c" stroke-width="7"/><text x="92" y="1585" font-family="Arial,'Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="92" y="1648" font-family="Arial,'Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#fff">폭풍의 밤, 비에 젖은 도시 위로 구조 차량의 불빛이 움직인다.</text><text x="92" y="1707" font-family="Arial,sans-serif" font-size="31" fill="#d8e4e9">风暴之夜，救援车辆的灯光穿过被雨淋湿的城市。</text><text x="92" y="1765" font-family="Arial,sans-serif" font-size="29" fill="#b9c9d0">Through the stormy night, rescue lights sweep across the rain-soaked city.</text></g><text x="720" y="625" font-family="Impact,Arial Black,sans-serif" font-size="100" font-style="italic" fill="#ffd65c" stroke="#111" stroke-width="10" transform="rotate(-8 720 625)">WEE-OO!</text><text x="55" y="1870" font-family="Arial,sans-serif" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 06 / 26</text></svg>