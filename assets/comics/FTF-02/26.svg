<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="d" x2="0" y2="1"><stop stop-color="#30475e"/><stop offset=".62" stop-color="#d79a70"/><stop offset="1" stop-color="#ffd88b"/></linearGradient></defs><rect width="1080" height="1920" fill="#070b10"/><rect width="1080" height="1200" fill="url(#d)"/><circle cx="850" cy="250" r="92" fill="#fff0a6"/><path d="M0 780l150-75 130 50 145-115 150 95 150-80 165 95 190-80v530H0z" fill="#425663"/><g fill="#657682" stroke="#d6dee4" stroke-width="6"><rect x="60" y="650" width="255" height="430"/><rect x="350" y="590" width="310" height="490"/><rect x="700" y="680" width="310" height="400"/></g><g fill="#d8eef7"><rect x="100" y="720" width="70" height="80"/><rect x="205" y="720" width="70" height="80"/><rect x="400" y="660" width="80" height="90"/><rect x="525" y="660" width="80" height="90"/><rect x="750" y="745" width="85" height="85"/><rect x="875" y="745" width="85" height="85"/></g><path d="M0 1120h1080v340H0z" fill="#3b4349"/><path d="M0 1300h1080" stroke="#e4d382" stroke-width="14" stroke-dasharray="80 45"/><rect x="790" y="1020" width="35" height="300" fill="#30353a"/><path d="M825 1040h150v100H825z" fill="#f1e2a0" stroke="#111" stroke-width="6"/><text x="840" y="1085" font-size="25" font-family="sans-serif" font-weight="900">EVAC</text><text x="840" y="1120" font-size="25" font-family="sans-serif" font-weight="900">↑ HIGH</text><g stroke="#111" stroke-width="7"><circle cx="230" cy="1160" r="46" fill="#d2a07b"/><path d="M190 1145q42-62 82 0" fill="#2d2728"/><path d="M180 1205h100l60 190H125z" fill="#557fa1"/><circle cx="430" cy="1160" r="48" fill="#c99772"/><path d="M388 1145q44-64 86 0" fill="#1f2930"/><path d="M378 1205h105l62 195H320z" fill="#efc33f"/></g><g fill="#fff" stroke="#111" stroke-width="7"><path d="M45 230h470q35 0 35 35v170q0 35-35 35H285l-55 70 8-70H45q-35 0-35-35V265q0-35 35-35z"/><path d="M575 350h455q35 0 35 35v170q0 35-35 35H815l-45 70-38-70H575q-35 0-35-35V385q0-35 35-35z"/></g><text x="70" y="290" font-size="34" font-family="sans-serif" font-weight="800">아이: 다음엔 더 안전할 거죠?</text><text x="70" y="345" font-size="29" font-family="sans-serif">孩子：下次我们会更安全吗？</text><text x="70" y="400" font-size="27" font-family="sans-serif">Child: Will we be safer next time?</text><text x="600" y="410" font-size="33" font-family="sans-serif" font-weight="800">구조대장: 우리가 기억하고 준비한다면.</text><text x="600" y="465" font-size="29" font-family="sans-serif">救援队长：只要我们记住并做好准备。</text><text x="600" y="520" font-size="27" font-family="sans-serif">Rescue chief: If we remember and prepare.</text><text x="720" y="930" fill="#ffe178" font-size="68" font-family="sans-serif" font-weight="900">WIND… RISE</text><rect x="55" y="1490" width="970" height="325" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1555" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 26 / FTF-02 · 9월 13일 이후</text><text x="90" y="1615" fill="#fff" font-size="31" font-family="sans-serif">아침 햇빛이 복구 중인 도시를 비춘다. 주민과 구조대는 새 대피 표지판을 세운다.</text><text x="90" y="1680" fill="#dbe8f0" font-size="29" font-family="sans-serif">晨光照亮正在修复的城市，居民和救援人员竖起新的疏散标志。</text><text x="90" y="1745" fill="#b8c8d8" font-size="27" font-family="sans-serif">Morning light reaches the rebuilding city as new evacuation signs rise.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">九月十三日之后 · After September 13</text></svg>