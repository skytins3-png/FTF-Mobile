<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07101f"/><stop offset=".65" stop-color="#28475b"/><stop offset="1" stop-color="#152633"/></linearGradient><filter id="ds"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#05080d"/><rect width="1080" height="1280" fill="url(#storm)"/><path d="M0 840 H1080 V1280 H0Z" fill="#17384a"/><path d="M0 980 Q180 930 360 980 T720 970 T1080 950 V1280 H0Z" fill="#204c60"/><g stroke="#9ad9ef" stroke-width="6" opacity=".7"><line x1="40" y1="360" x2="190" y2="560"/><line x1="210" y1="300" x2="380" y2="560"/><line x1="430" y1="350" x2="610" y2="620"/><line x1="700" y1="290" x2="900" y2="600"/></g><path d="M840 170 L770 430 L875 390 L805 650" fill="none" stroke="#f5f7ff" stroke-width="22"/><g transform="translate(90 880)"><rect x="0" y="130" width="430" height="170" rx="35" fill="#263846" stroke="#111" stroke-width="9"/><rect x="65" y="65" width="210" height="95" rx="20" fill="#314f61"/><circle cx="95" cy="305" r="52" fill="#10151a"/><circle cx="350" cy="305" r="52" fill="#10151a"/><rect x="38" y="88" width="72" height="26" rx="8" fill="#ff4f4f"/><rect x="118" y="88" width="72" height="26" rx="8" fill="#5ea3ff"/></g><g transform="translate(570 850)"><circle cx="120" cy="80" r="58" fill="#e9c09a"/><path d="M62 80 Q75 20 125 22 Q175 24 180 93 Q145 62 115 64 Q85 64 62 80" fill="#25282d"/><path d="M55 155 Q120 115 185 155 L225 410 Q120 450 15 410Z" fill="#efb72e" stroke="#2a2a2a" stroke-width="8"/><rect x="78" y="215" width="95" height="80" rx="8" fill="#293a45"/><path d="M40 235 Q-35 215 -85 165" fill="none" stroke="#e9c09a" stroke-width="30" stroke-linecap="round"/></g><g filter="url(#ds)"><path d="M55 55 Q55 25 115 25 H810 Q870 25 870 95 V300 Q870 365 790 365 H260 L170 435 L195 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">바람이 더 강해진다! 구조 차량 뒤를 따라 높은 곳으로!</text><text x="105" y="192" font-family="Arial" font-size="33">风更大了！跟着救援车往高处走！</text><text x="105" y="257" font-family="Arial" font-size="30">The wind is stronger! Follow the rescue vehicle uphill!</text></g><text x="690" y="720" font-family="Impact,Arial Black" font-size="90" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-6 690 720)">WOOO!</text><g filter="url(#ds)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">강풍이 도심을 휩쓸고 구조대가 침수 도로에서 주민들을 고지대로 유도한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">强风席卷市区，救援人员引导居民从积水道路撤往高处。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">Rescuers guide residents through flooded streets toward higher ground.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 08 / 26</text></svg>