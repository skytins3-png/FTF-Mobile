<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#31485d"/><stop offset="1" stop-color="#d8a77b"/></linearGradient><linearGradient id="w" x2="1"><stop stop-color="#21445a"/><stop offset="1" stop-color="#6f8895"/></linearGradient></defs><rect width="1080" height="1920" fill="#071019"/><rect width="1080" height="1100" fill="url(#s)"/><circle cx="830" cy="190" r="78" fill="#ffd58a"/><path d="M0 720l140-90 160 55 150-130 160 110 170-90 150 110 150-70v470H0z" fill="#3c505d"/><g fill="#596c78" stroke="#d4dde5" stroke-width="6"><rect x="60" y="620" width="250" height="390"/><rect x="350" y="560" width="330" height="450"/><rect x="720" y="650" width="300" height="360"/></g><path d="M0 1000q180-35 360 0t360 0 360 0v420H0z" fill="url(#w)"/><g fill="#e7edf1" stroke="#13202b" stroke-width="8"><path d="M470 1100h360l90 55-45 100H430z"/><rect x="550" y="1040" width="170" height="80" rx="16"/></g><circle cx="525" cy="1130" r="35" fill="#c89570"/><path d="M490 1120q35-55 70 0" fill="#1f2931" stroke="#111" stroke-width="6"/><path d="M480 1170h90l55 145H425z" fill="#f2c94c" stroke="#111" stroke-width="7"/><circle cx="250" cy="1170" r="42" fill="#d1a07b"/><path d="M215 1155q36-55 72 0" fill="#382b2a" stroke="#111" stroke-width="6"/><path d="M210 1215h80l50 150H165z" fill="#5c84c6" stroke="#111" stroke-width="7"/><g fill="#fff" stroke="#111" stroke-width="7"><path d="M50 245h460q35 0 35 35v165q0 35-35 35H275l-55 70 8-70H50q-35 0-35-35V280q0-35 35-35z"/><path d="M570 355h455q35 0 35 35v170q0 35-35 35H800l-48 68-35-68H570q-35 0-35-35V390q0-35 35-35z"/></g><text x="75" y="305" font-size="34" font-family="sans-serif" font-weight="800">소방대원: 수위가 내려갑니다.</text><text x="75" y="360" font-size="29" font-family="sans-serif">消防员：水位正在下降。</text><text x="75" y="415" font-size="27" font-family="sans-serif">Firefighter: The water level is falling.</text><text x="595" y="415" font-size="33" font-family="sans-serif" font-weight="800">아이: 우리 집으로 돌아갈 수 있어요?</text><text x="595" y="470" font-size="29" font-family="sans-serif">孩子：我们能回家了吗？</text><text x="595" y="525" font-size="27" font-family="sans-serif">Child: Can we go home now?</text><text x="700" y="870" fill="#ffe178" font-size="68" font-family="sans-serif" font-weight="900" transform="rotate(-8 700 870)">SPLASH… DRIP…</text><rect x="55" y="1490" width="970" height="325" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1555" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 22 / FTF-02 · 강물이 물러나다</text><text x="90" y="1615" fill="#fff" font-size="31" font-family="sans-serif">구조보트가 마지막 침수 골목을 확인한다. 도로와 집들이 진흙 속에서 다시 드러난다.</text><text x="90" y="1680" fill="#dbe8f0" font-size="29" font-family="sans-serif">救援艇检查最后的积水街区，道路和房屋逐渐显露。</text><text x="90" y="1745" fill="#b8c8d8" font-size="27" font-family="sans-serif">Rescue boats sweep the last flooded blocks as streets and homes emerge.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">河水开始退去 · The river begins to recede</text></svg>