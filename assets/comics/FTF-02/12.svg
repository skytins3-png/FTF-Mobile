<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a1420"/><stop offset="1" stop-color="#1b2733"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#090d12"/><rect width="1080" height="1320" fill="url(#bg)"/><rect x="70" y="360" width="940" height="760" rx="30" fill="#dce7ec" stroke="#101820" stroke-width="10"/><rect x="110" y="420" width="860" height="110" rx="14" fill="#31475a"/><text x="540" y="490" text-anchor="middle" font-family="Arial,'Malgun Gothic'" font-size="43" font-weight="900" fill="#fff">EMERGENCY WARD · 응급병동 · 急诊病区</text><g fill="#9ed7ed" stroke="#162431" stroke-width="8"><rect x="140" y="600" width="270" height="260" rx="20"/><rect x="670" y="600" width="270" height="260" rx="20"/></g><g stroke="#4b6579" stroke-width="10"><path d="M545 530V1110"/><path d="M100 940H980"/></g><g transform="translate(190 675)"><circle cx="105" cy="0" r="52" fill="#d9a17e"/><path d="M56 8Q68-58 110-58Q160-56 163 16Q132-16 104-16Q78-15 56 8" fill="#2a2d32"/><path d="M20 95Q105 40 190 95V220H20Z" fill="#f4f7fa" stroke="#355165" stroke-width="7"/><path d="M78 115L78 195M40 155H115" stroke="#e35d66" stroke-width="14"/><path d="M105 118L265 72" stroke="#d9a17e" stroke-width="24" stroke-linecap="round"/></g><g transform="translate(640 700)"><circle cx="110" cy="0" r="50" fill="#deb18f"/><path d="M60 8Q70-55 112-55Q158-52 164 14Q136-16 109-15Q82-14 60 8" fill="#55453e"/><path d="M28 92Q110 40 192 92V205H28Z" fill="#4a7897"/><path d="M95 118L230 92" stroke="#deb18f" stroke-width="22" stroke-linecap="round"/></g><g transform="translate(410 845)"><rect x="0" y="120" width="310" height="110" rx="35" fill="#aac0cd" stroke="#263a49" stroke-width="8"/><circle cx="120" cy="58" r="44" fill="#dfb08d"/><path d="M80 62Q90 10 124 10Q160 12 163 67Q139 44 120 44Q102 44 80 62" fill="#37302c"/><path d="M45 140Q120 92 195 140V230H45Z" fill="#7d8e9a"/></g><g fill="#ffe26b"><rect x="115" y="555" width="18" height="300" rx="8"/><rect x="947" y="555" width="18" height="300" rx="8"/></g><path d="M80 1030Q275 990 455 1030T820 1015T1000 1045" fill="none" stroke="#62d2ff" stroke-width="18" opacity=".55"/><g filter="url(#sh)"><path d="M55 45Q55 20 115 20H875Q935 20 935 95V315Q935 377 862 377H715L650 438L658 377H115Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="112" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="900">발전기 2번 연결! 산소 장비부터 살립니다!</text><text x="92" y="180" font-family="Arial" font-size="31">接通二号发电机！先保住供氧设备！</text><text x="92" y="245" font-family="Arial" font-size="29">Generator two online! Keep the oxygen systems alive first!</text></g><g filter="url(#sh)"><rect x="55" y="1465" width="970" height="305" rx="22" fill="#10161e" stroke="#78d7ff" stroke-width="7"/><text x="90" y="1540" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="900" fill="#78d7ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1608" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">정전된 병원에서 의료진이 비상 발전기를 연결해 중환자 장비를 다시 살린다.</text><text x="90" y="1670" font-family="Arial" font-size="30" fill="#d8e4e9">停电的医院里，医护人员接通备用发电机，恢复重症设备。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">In the blacked-out hospital, staff restore critical equipment with backup power.</text></g><text x="700" y="1180" font-family="Impact,Arial Black" font-size="82" fill="#ffe86f" stroke="#111" stroke-width="9" transform="rotate(-5 700 1180)">BEEP! BEEP!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 12 / 26</text></svg>