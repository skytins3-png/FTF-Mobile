><path d="M200 1155q42-60 82 0" fill="#20262c"/><path d="M190 1215h100l58 190H135z" fill="#557f9e"/><circle cx="430" cy="1170" r="44" fill="#c99874"/><path d="M392 1155q40-60 78 0" fill="#3a2928"/><path d="M385 1215h90l54 185H330z" fill="#d7e5ee"/></g><text x="690" y="940" fill="#ffe17a" font-size="68" font-family="sans-serif" font-weight="900">CLICK— HUMMM</text><rect x="55" y="1490" width="970" height="325" rx="28" fill="#080d14ee" stroke="#e9c46a" stroke-width="6"/><text x="90" y="1555" fill="#e9c46a" font-size="31" font-family="sans-serif" font-weight="800">상황 설명 · SCENE 24 / FTF-02 · 도시의 불빛</text><text x="90" y="1615" fill="#fff" font-size="31" font-family="sans-serif">젖은 거리 위로 가로등이 한 줄씩 켜지고 병원과 아파트에 따뜻한 불빛이 돌아온다.</text><text x="90" y="1680" fill="#dbe8f0" font-size="29" font-family="sans-serif">湿漉漉的街道上路灯逐盏亮起，医院和住宅重新出现温暖灯光。</text><text x="90" y="1745" fill="#b8c8d8" font-size="27" font-family="sans-serif">Streetlights flicker on one by one, and warm light returns to the city.</text><text x="90" y="1800" fill="#8fa7ba" font-size="23" font-family="sans-serif">城市重新亮起 · The city lights return</text></svg>