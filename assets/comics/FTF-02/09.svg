32">屋顶救援组！确认最后两名居民！</text><text x="100" y="244" font-family="Arial" font-size="30">Rooftop rescue team! Two residents confirmed!</text></g><text x="700" y="780" font-family="Impact,Arial Black" font-size="92" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-8 700 780)">THOOM!</text><g filter="url(#d)"><rect x="55" y="1475" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1548" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1618" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">태풍의 눈이 지나간 틈에 구조대가 침수된 건물 옥상으로 접근한다.</text><text x="90" y="1680" font-family="Arial" font-size="30" fill="#d8e4e9">台风眼经过的短暂间隙里，救援队冲向被淹建筑的屋顶。</text><text x="90" y="1740" font-family="Arial" font-size="28" fill="#b9c9d0">During the eye's brief calm, rescuers reach a flooded rooftop.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-02 · TYPHOON ARKA · SCENE 09 / 26</text></svg>