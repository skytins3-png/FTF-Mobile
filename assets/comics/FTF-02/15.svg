<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#26384d"/><stop offset=".48" stop-color="#d88c68"/><stop offset="1" stop-color="#efd9b1"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#0a0d11"/><rect width="1080" height="1320" fill="url(#dawn)"/><circle cx="820" cy="300" r="100" fill="#ffe9a8" opacity=".85"/><path d="M0 880Q180 840 350 895T720 870T1080 910V1320H0Z" fill="#385c70"/><path d="M0 965Q170 920 350 975T730 950T1080 995" fill="none" stroke="#b6e6f1" stroke-width="18" opacity=".5"/><g fill="#3b4148" stroke="#1b2026" stroke-width="8"><path d="M90 720L300 675L335 1025H65Z"/><path d="M410 660L665 630L700 1040H380Z"/><path d="M760 735L1015 710L1040 1035H735Z"/></g><g fill="#f2d776"><rect x="130" y="765" width="54" height="64"/><rect x="215" y="750" width="54" height="64"/><rect x="462" y="710" width="55" height="65"/><rect x="553" y="698" width="55" height="65"/><rect x="817" y="780" width="55" height="65"/><rect x="910" y="768" width="55" height="65"/></g><path d="M255 1110L340 1040L425 1120" fill="none" stroke="#795945" stroke-width="28"/><path d="M820 1090L905 1015L995 1100" fill="none" stroke="#6e5949" stroke-width="24"/><g transform="translate(140 1040)"><circle cx="105" cy="0" r="52" fill="#dba47e"/><path d="M58 8Q68-58 110-58Q157-55 163 14Q133-16 104-16Q80-15 58 8" fill="#252a30"/><path d="M20 95Q105 42 190 95V245H20Z" fill="#efc54a" stroke="#17222c" stroke-width="8"/><path d="M80 120L80 203M40 160H120" stroke="#ec5f62" stroke-width="13"/><path d="M128 125L310 82" stroke="#dba47e" stroke-width="24" stroke-linecap="round"/></g><g transform="translate(600 1030)"><circle cx="108" cy="0" r="50" fill="#dfb08c"/><path d="M62 8Q72-54 111-54Q157-52 163 13Q136-14 108-14Q84-13 62 8" fill="#4d3c35"/><path d="M28 92Q108 42 188 92V240H28Z" fill="#3f6d8a"/><path d="M96 120L-55 88" stroke="#dfb08c" stroke-width="22" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 45Q55 20 115 20H875Q935 20 935 95V315Q935 377 862 377H720L655 438L662 377H115Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="112" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="900">비가 잦아든다… 이제 빠진 사람부터 찾습니다.</text><text x="92" y="180" font-family="Arial" font-size="31">雨势减弱了……现在先寻找失联的人。</text><text x="92" y="245" font-family="Arial" font-size="29">The rain is easing... now we search first for the missing.</text></g><g filter="url(#sh)"><rect x="55" y="1465" width="970" height="305" rx="22" fill="#10161e" stroke="#f0b07f" stroke-width="7"/><text x="90" y="1540" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="900" fill="#f0b07f">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1608" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">새벽빛이 비친 도시에서 구조대가 침수 흔적을 따라 실종자 수색을 시작한다.</text><text x="90" y="1670" font-family="Arial" font-size="30" fill="#d8e4e9">晨光照进受灾城市，救援队沿着积水痕迹展开失联者搜寻。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">At first light, rescue teams follow the flood marks and begin searching for the missing.</text></g><text x="710" y="1230" font-family="Impact,Arial Black" font-size="82" fill="#ffe4a2" stroke="#111" stroke-width="9" transform="rotate(-5 710 1230)">DRIP… DRIP…</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#aab6be">FTF-02 · TYPHOON ARKA · SCENE 15 / 26</text></svg>