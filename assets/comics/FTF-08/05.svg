<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#172a46"/><stop offset=".55" stop-color="#f4a261"/><stop offset="1" stop-color="#f7d794"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1d5d7a"/><stop offset="1" stop-color="#08253a"/></linearGradient><linearGradient id="coat" x2="1" y2="1"><stop stop-color="#1b2735"/><stop offset="1" stop-color="#05080d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".35"/></filter></defs><rect width="1080" height="1600" fill="#07101b"/><rect x="18" y="18" width="1044" height="1564" rx="26" fill="#f5f0e6"/><g transform="translate(34 34)"><rect width="1012" height="600" rx="18" fill="url(#sky)"/><circle cx="760" cy="218" r="62" fill="#ffe9a9"/><path d="M0 370 C180 320 330 420 510 365 C700 310 820 365 1012 330 V600H0Z" fill="url(#sea)"/><g fill="#e5eef7" opacity=".7"><path d="M50 448q80-28 160 0t160 0" fill="none" stroke="#dff6ff" stroke-width="7"/><path d="M610 475q90-30 180 0t180 0" fill="none" stroke="#dff6ff" stroke-width="6"/></g><g transform="translate(475 215)" filter="url(#shadow)"><path d="M0 190 330 118 440 155 390 235 48 250Z" fill="#405972" stroke="#102235" stroke-width="8"/><rect x="158" y="68" width="150" height="105" rx="8" fill="#32485d"/><rect x="185" y="25" width="88" height="70" fill="#405972"/><path d="M229 25V-55M205-35h48" stroke="#1a2736" stroke-width="9"/><g fill="#72d3ff"><rect x="180" y="92" width="22" height="16"/><rect x="214" y="92" width="22" height="16"/><rect x="248" y="92" width="22" height="16"/></g><text x="96" y="210" font-size="44" font-family="Arial" font-weight="900" fill="#eef7ff">FTF-08</text></g><g transform="translate(130 328) scale(.52)"><path d="M0 190 330 118 440 155 390 235 48 250Z" fill="#31495e" stroke="#102235" stroke-width="8"/><rect x="158" y="68" width="150" height="105" fill="#283d51"/></g><g transform="translate(780 370) scale(.42)"><path d="M0 190 330 118 440 155 390 235 48 250Z" fill="#31495e" stroke="#102235" stroke-width="8"/><rect x="158" y="68" width="150" height="105" fill="#283d51"/></g><rect x="30" y="30" width="360" height="150" rx="14" fill="#fff5d7" stroke="#1b1b1b" stroke-width="5"/><text x="58" y="72" font-family="Arial" font-weight="800" font-size="29"><tspan x="58" dy="0">수평선 너머, 함대가</tspan><tspan x="58" dy="38">같은 방향으로 나아간다.</tspan><tspan x="58" dy="38" font-size="24">越过地平线，舰队同行。</tspan></text><text x="820" y="520" font-family="Impact,Arial" font-size="70" fill="#ffd34e" stroke="#111" stroke-width="5" transform="rotate(-8 820 520)">RUMBLE</text></g><g transform="translate(34 660)"><rect width="1012" height="420" rx="18" fill="#11243a"/><path d="M0 330C180 290 300 355 480 305S780 260 1012 330V420H0Z" fill="#0b4563"/><g transform="translate(70 85)"><path d="M90 42q55-50 110 0l30 112-45 125H70L25 154Z" fill="url(#coat)"/><ellipse cx="145" cy="18" rx="48" ry="55" fill="#c98f68"/><path d="M99 6q12-65 96-44 30 8 38 52-52-30-134-8Z" fill="#111821"/><path d="M215 130l92-45 35 40-105 70" fill="#d29a75"/><rect x="302" y="69" width="52" height="90" rx="8" fill="#15191f"/><circle cx="327" cy="92" r="8" fill="#52d6ff"/></g><rect x="380" y="55" width="555" height="195" rx="70" fill="#fff" stroke="#111" stroke-width="6"/><path d="M405 235 342 300 430 260Z" fill="#fff" stroke="#111" stroke-width="6"/><text x="430" y="105" font-family="Arial" font-weight="900" font-size="34"><tspan x="430">대형 유지. 서로의 불빛을</tspan><tspan x="430" dy="43">놓치지 마.</tspan><tspan x="430" dy="43" font-size="27">保持队形，别丢失彼此的灯光。</tspan><tspan x="430" dy="38" font-size="24">Hold formation. Keep every light in sight.</tspan></text></g><g transform="translate(34 1106)"><rect width="1012" height="426" rx="18" fill="#0c1828"/><g opacity=".95"><path d="M70 332 250 130 430 332Z" fill="#2b4053"/><path d="M260 332 480 105 700 332Z" fill="#31495f"/><path d="M600 332 790 155 980 332Z" fill="#263b50"/></g><path d="M0 330C180 300 380 360 550 322S820 288 1012 330V426H0Z" fill="#103b56"/><g transform="translate(430 160)"><path d="M0 105 210 60 295 85 260 140 30 150Z" fill="#536b7d" stroke="#0e1a25" stroke-width="7"/><rect x="95" y="28" width="110" height="72" fill="#41566a"/></g><rect x="35" y="28" width="410" height="126" rx="12" fill="#fff3d6" stroke="#151515" stroke-width="5"/><text x="60" y="72" font-family="Arial" font-weight="800" font-size="28"><tspan x="60">우리는 멀어지는 육지를 뒤로하고</tspan><tspan x="60" dy="39">미래를 향해 간다.</tspan><tspan x="60" dy="33" font-size="22">We sail toward a wider tomorrow.</tspan></text><text x="615" y="382" font-family="Impact,Arial" font-size="54" fill="#eef7ff" transform="rotate(-4 615 382)">FTF · 05 / 26</text></g></svg>