<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1d3150"/><stop offset=".45" stop-color="#f39a62"/><stop offset="1" stop-color="#18304a"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".52"/></filter></defs><rect width="1080" height="1920" fill="#090d12"/><rect width="1080" height="1290" fill="url(#sea)"/><circle cx="780" cy="275" r="105" fill="#ffd79a" opacity=".95"/><path d="M0 760 Q190 690 390 770 T780 735 T1080 790 V1290 H0Z" fill="#245a76"/><path d="M0 900 Q180 830 360 905 T740 865 T1080 930" fill="none" stroke="#a9deea" stroke-width="18" opacity=".7"/><g transform="translate(170 530)"><path d="M70 330 L705 330 L620 500 L150 500Z" fill="#252e39" stroke="#91b4ca" stroke-width="8"/><rect x="230" y="210" width="280" height="125" fill="#354453"/><rect x="300" y="145" width="150" height="70" fill="#3d4d5b"/><path d="M377 145 V50" stroke="#b7cad8" stroke-width="12"/><path d="M377 60 L530 110 L377 155Z" fill="#f05b52"/><circle cx="208" cy="280" r="62" fill="#dfaa84"/><path d="M150 282 Q161 215 212 216 Q267 218 275 291 Q241 257 207 259 Q177 259 150 282" fill="#22252a"/><path d="M135 375 Q207 330 285 375 L307 520 H108Z" fill="#314a63"/><circle cx="535" cy="280" r="62" fill="#d8a17b"/><path d="M475 282 Q489 216 540 217 Q594 220 603 291 Q568 257 535 259 Q505 260 475 282" fill="#493831"/><path d="M460 375 Q535 330 612 375 L640 520 H432Z" fill="#63475b"/></g><g filter="url(#sh)"><path d="M55 45 Q55 20 115 20 H875 Q935 20 935 95 V315 Q935 377 862 377 H690 L625 442 L633 377 H115 Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">돌아올 길이 보이지 않아도, 우리가 갈 길은 분명해.</text><text x="92" y="182" font-family="Arial" font-size="31">就算看不见归途，我们前进的方向依然清楚。</text><text x="92" y="245" font-family="Arial" font-size="29">Even if we can't see the way back, we know exactly where we must go.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#ffd27f" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd27f">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">새벽빛을 가르며 선두 함선이 항구를 떠나고, 뒤이어 미래 함대가 수평선으로 향한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">晨光中，旗舰驶离港口，未来舰队随后向地平线进发。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">At dawn, the lead ship clears the harbor and the future fleet follows toward the horizon.</text></g><text x="710" y="765" font-family="Impact,Arial Black" font-size="88" fill="#ffe09a" stroke="#111" stroke-width="9" transform="rotate(-7 710 765)">WOOOSH!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-08 · FOR THE FUTURE — SET SAIL · SCENE 04 / 26</text></svg>