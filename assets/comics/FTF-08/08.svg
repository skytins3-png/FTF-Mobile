<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#243652"/><stop offset=".45" stop-color="#f3aa72"/><stop offset="1" stop-color="#f7d6a0"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#2f7894"/><stop offset="1" stop-color="#0a2b42"/></linearGradient></defs><rect width="1080" height="1600" fill="#07111b"/><rect x="18" y="18" width="1044" height="1564" rx="26" fill="#f0f2f4"/><g transform="translate(34 34)"><rect width="1012" height="620" rx="18" fill="url(#dawn)"/><path d="M0 385 110 320 215 350 310 285 410 350V430H0Z" fill="#47556c" opacity=".95"/><path d="M0 430Q160 390 320 445T650 432T1012 445V620H0Z" fill="url(#sea)"/><g transform="translate(570 270)"><path d="M0 150 275 88 380 120 345 190 38 205Z" fill="#51697c" stroke="#101a25" stroke-width="8"/><rect x="115" y="45" width="130" height="92" fill="#3d5569"/><path d="M180 45V-25M148 0h62" stroke="#172536" stroke-width="8"/><text x="90" y="180" font-family="Arial" font-weight="900" font-size="42" fill="#edf7ff">FTF-08</text></g><g transform="translate(160 370) scale(.5)"><path d="M0 150 275 88 380 120 345 190 38 205Z" fill="#455f74" stroke="#101a25" stroke-width="8"/><rect x="115" y="45" width="130" height="92" fill="#384e62"/></g><rect x="45" y="38" width="410" height="145" rx="14" fill="#fff4d9" stroke="#111" stroke-width="5"/><text x="72" y="82" font-family="Arial" font-weight="900" font-size="29"><tspan x="72">멀어지는 육지.</tspan><tspan x="72" dy="38">이제 출항의 의미가 실감난다.</tspan><tspan x="72" dy="36" font-size="23">海岸线渐远，航程真正开始。</tspan></text><text x="742" y="530" font-family="Impact,Arial" font-size="68" fill="#f8fbff" stroke="#111" stroke-width="4" transform="rotate(-6 742 530)">WIND</text></g><g transform="translate(34 680)"><rect width="1012" height="420" rx="18" fill="#15263a"/><g transform="translate(95 65)"><ellipse cx="142" cy="65" rx="55" ry="60" fill="#d1a17f"/><path d="M88 54q8-72 88-52 31 9 40 47-54-25-128 5Z" fill="#17181e"/><path d="M45 128q95-65 190 0l45 160H0Z" fill="#152333"/><path d="M34 186h165" stroke="#2c5e82" stroke-width="24"/><text x="77" y="195" font-family="Arial" font-weight="900" font-size="25" fill="#eef8ff">FTF</text></g><rect x="380" y="54" width="560" height="250" rx="76" fill="#fff" stroke="#111" stroke-width="6"/><path d="M402 270 328 342 425 305Z" fill="#fff" stroke="#111" stroke-width="6"/><text x="430" y="106" font-family="Arial" font-weight="900" font-size="36"><tspan x="430">이제 정말 시작됐네.</tspan><tspan x="430" dy="48" font-size="29">真的开始了。</tspan><tspan x="430" dy="46" font-size="28">Now it really begins.</tspan><tspan x="430" dy="50" font-size="25">앞으로는 돌아보는 대신,</tspan><tspan x="430" dy="36" font-size="25">같은 방향을 본다.</tspan></text></g><g transform="translate(34 1128)"><rect width="1012" height="404" rx="18" fill="#081522"/><path d="M0 285Q180 250 340 302T680 290T1012 310V404H0Z" fill="#0e405d"/><path d="M0 290 120 235 205 255 288 220 360 252V305H0Z" fill="#293c50" opacity=".65"/><g transform="translate(620 165)"><path d="M0 92 220 42 308 70 277 120 28 132Z" fill="#4c667b" stroke="#101a23" stroke-width="7"/><rect x="90" y="12" width="110" height="72" fill="#394f63"/></g><rect x="38" y="32" width="482" height="138" rx="14" fill="#fff2d2" stroke="#111" stroke-width="5"/><text x="65" y="76" font-family="Arial" font-weight="800" font-size="28"><tspan x="65">해안선은 작아졌지만</tspan><tspan x="65" dy="39">함대의 목적은 더 선명해졌다.</tspan><tspan x="65" dy="35" font-size="22">The coast fades; the mission comes into focus.</tspan></text><text x="700" y="360" font-family="Impact,Arial" font-size="56" fill="#eff9ff">FTF · 08 / 26</text></g></svg>