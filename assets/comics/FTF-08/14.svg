="stroke" font-family="Arial" font-weight="900" font-style="italic">WOOOOSH!</text><g filter="url(#d)"><path d="M66 808q0-36 38-36h508q38 0 38 38v124q0 38-38 38H235l-50 52 6-52h-87q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="825" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">모두 승선 완료. 미래를 향해 다시 출항한다.</text><text x="96" y="865" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei,sans-serif">全员登舰。再次向未来启航。</text><text x="96" y="906" font-size="19" fill="#475569" font-family="Arial">All aboard. We sail for the future again.</text></g><rect x="50" y="1040" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1080" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic,sans-serif">상황 · 구조된 사람들과 함께 함대가 붉은 새벽을 가른다.</text><text x="74" y="1117" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei,sans-serif">旁白 · 舰队带着获救的人们驶入晨光。</text><text x="74" y="1153" font-size="15" fill="#94a3b8" font-family="Arial">Narration · With the rescued aboard, the fleet returns to its mission.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 14/26</text></svg>