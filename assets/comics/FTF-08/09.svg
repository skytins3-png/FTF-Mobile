<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0e1c32"/><stop offset=".5" stop-color="#34637f"/><stop offset="1" stop-color="#e8a66e"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1a6887"/><stop offset="1" stop-color="#071f31"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1600" fill="#06101b"/><rect x="18" y="18" width="1044" height="1564" rx="26" fill="#f0f2f5"/><g transform="translate(34 34)"><rect width="1012" height="630" rx="18" fill="url(#sky)"/><path d="M0 410Q160 365 330 425T670 410T1012 430V630H0Z" fill="url(#sea)"/><g opacity=".9"><g transform="translate(70 300) scale(.62)"><path d="M0 150 275 88 380 120 345 190 38 205Z" fill="#415d73" stroke="#0d1822" stroke-width="8"/><rect x="115" y="45" width="130" height="92" fill="#334b60"/></g><g transform="translate(360 248) scale(.78)"><path d="M0 150 275 88 380 120 345 190 38 205Z" fill="#526e84" stroke="#0d1822" stroke-width="8"/><rect x="115" y="45" width="130" height="92" fill="#3c566b"/><text x="86" y="179" font-family="Arial" font-size="40" font-weight="900" fill="#eef8ff">FTF-08</text></g><g transform="translate(730 330) scale(.52)"><path d="M0 150 275 88 380 120 345 190 38 205Z" fill="#3f5b71" stroke="#0d1822" stroke-width="8"/><rect x="115" y="45" width="130" height="92" fill="#30495d"/></g></g><g stroke="#69d8ff" stroke-width="4" fill="none" opacity=".8"><path d="M250 210Q505 130 760 210"/><path d="M360 160Q505 95 650 160"/></g><circle cx="505" cy="150" r="8" fill="#7ce7ff" filter="url(#g)"/><rect x="42" y="38" width="445" height="150" rx="14" fill="#fff4d8" stroke="#111" stroke-width="5"/><text x="70" y="82" font-family="Arial" font-weight="900" font-size="29"><tspan x="70">서로 다른 함선이</tspan><tspan x="70" dy="38">하나의 좌표를 향한다.</tspan><tspan x="70" dy="36" font-size="23">不同的舰船，驶向同一个坐标。</tspan></text><text x="760" y="530" font-family="Impact,Arial" font-size="74" fill="#7ce7ff" stroke="#111" stroke-width="4">BEEP</text></g><g transform="translate(34 690)"><rect width="1012" height="420" rx="18" fill="#111f31"/><g transform="translate(70 60)"><ellipse cx="122" cy="54" rx="48" ry="54" fill="#bd835f"/><path d="M76 45q10-65 76-48 28 7 37 42-42-18-113 6Z" fill="#14171d"/><path d="M35 116q90-52 180 0l35 150H0Z" fill="#152436"/><text x="77" y="181" fill="#f0f7ff" font-family="Arial" font-size="23" font-weight="900">FTF</text></g><g transform="translate(250 78)"><ellipse cx="106" cy="46" rx="44" ry="50" fill="#ddb092"/><path d="M64 44q15-62 76-47 24 7 31 40-43-17-107 7Z" fill="#17151a"/><path d="M28 110q78-50 156 0l30 132H0Z" fill="#19293a"/></g><rect x="490" y="45" width="470" height="260" rx="78" fill="#fff" stroke="#111" stroke-width="6"/><path d="M512 280 450 345 535 308Z" fill="#fff" stroke="#111" stroke-width="6"/><text x="540" y="96" font-family="Arial" font-weight="900" font-size="35"><tspan x="540">함께라면 더 멀리 갈 수 있어.</tspan><tspan x="540" dy="47" font-size="29">只要一起，我们能走得更远。</tspan><tspan x="540" dy="44" font-size="28">Together, we can go farther.</tspan><tspan x="540" dy="48" font-size="24">좌표 확인. 대형 유지.</tspan><tspan x="540" dy="34" font-size="24">Course locked. Formation steady.</tspan></text></g><g transform="translate(34 1138)"><rect width="1012" height="394" rx="18" fill="#07121f"/><path d="M0 275Q175 240 340 292T690 278T1012 300V394H0Z" fill="#0c3e5a"/><g fill="#4b657a"><path d="M100 250 245 210 305 230 280 267 125 275Z"/><path d="M390 235 565 190 640 215 610 260 420 270Z"/><path d="M735 250 875 215 940 235 915 270 760 278Z"/></g><g fill="#85e6ff" filter="url(#g)"><circle cx="220" cy="225" r="7"/><circle cx="535" cy="205" r="7"/><circle cx="850" cy="230" r="7"/></g><rect x="40" y="32" width="485" height="140" rx="14" fill="#fff2d3" stroke="#111" stroke-width="5"/><text x="67" y="76" font-family="Arial" font-weight="800" font-size="28"><tspan x="67">세 개의 항해등이 한 선을 만든다.</tspan><tspan x="67" dy="39">이제 함대는 같은 미래를 본다.</tspan><tspan x="67" dy="35" font-size="22">Three lights, one course, one future.</tspan></text><text x="700" y="350" font-family="Impact,Arial" font-size="56" fill="#eef9ff">FTF · 09 / 26</text></g></svg>