<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#101522"/><stop offset="1" stop-color="#281747"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".6"/></filter></defs><rect width="720" height="1280" fill="#05080d"/><rect x="18" y="18" width="684" height="742" rx="24" fill="url(#g)" stroke="#94a3b8" stroke-width="4"/><rect x="42" y="40" width="470" height="112" rx="14" fill="#090d15" stroke="#c084fc" stroke-width="5"/><text x="60" y="77" font-size="18" fill="#c084fc" font-family="Arial" font-weight="700">SCENE 18 · LAST MESSAGE</text><text x="60" y="111" font-size="24" fill="white" font-family="Arial,Malgun Gothic" font-weight="800">마지막 메시지</text><text x="60" y="141" font-size="15" fill="#e9d5ff" font-family="Arial,Malgun Gothic">기록장치 속 영상이 함교의 어둠을 밝힌다.</text><rect x="92" y="202" width="536" height="330" rx="22" fill="#0b0f18" stroke="#6b21a8" stroke-width="6"/><rect x="118" y="228" width="484" height="270" rx="12" fill="#172033"/><circle cx="360" cy="330" r="55" fill="#d6a574"/><path d="M298 390q62-74 124 0v108H298z" fill="#475569"/><path d="M326 308q35-46 70 0" fill="#1f2937"/><rect x="135" y="460" width="212" height="18" rx="9" fill="#ef4444" opacity=".9"/><text x="365" y="474" font-size="15" fill="#fca5a5" font-family="Arial">RECOVERED LOG</text><g filter="url(#d)"><circle cx="170" cy="665" r="36" fill="#d5a477"/><path d="M128 708q42-48 84 0v92h-84z" fill="#24364b"/><circle cx="543" cy="663" r="36" fill="#d8aa7d"/><path d="M501 706q42-48 84 0v94h-84z" fill="#384f67"/></g><text x="480" y="570" font-size="38" fill="#c084fc" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900">STATIC…</text><g filter="url(#d)"><path d="M68 812q0-36 38-36h508q38 0 38 38v124q0 38-38 38H245l-52 52 7-52h-94q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="835" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic" font-weight="800">우리가 못 가더라도… 다음 사람은 계속 가야 합니다.</text><text x="96" y="875" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei">即使我们到不了，后来的人也要继续前进。</text><text x="96" y="916" font-size="19" fill="#475569" font-family="Arial">Even if we don't make it, the next crew must continue.</text></g><rect x="50" y="1042" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1082" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic">상황 · 사라진 선박의 마지막 기록이 미래를 향한 항해를 부탁한다.</text><text x="74" y="1119" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei">旁白 · 失踪船只的最后记录请求后来者继续航行。</text><text x="74" y="1155" font-size="15" fill="#94a3b8" font-family="Arial">Narration · The lost crew leaves one request: keep going.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 18/26</text></svg>