"M185 958 Q213 976 242 957" stroke="#744332" stroke-width="7" fill="none"/><path d="M420 1116 q100-248 228 0H420Z" fill="#51614c"/><circle cx="533" cy="906" r="73" fill="#e0b18d"/><path d="M465 897 Q533 815 608 884 Q584 831 532 826 Q487 831 463 867Z" fill="#362920"/><circle cx="507" cy="920" r="8"/><circle cx="560" cy="920" r="8"/><path d="M506 960 Q533 977 563 959" stroke="#804a38" stroke-width="7" fill="none"/><path d="M744 1118 q88-230 204 0H744Z" fill="#57493b"/><circle cx="847" cy="922" r="68" fill="#ca936d"/><path d="M783 914 Q847 838 917 902 Q895 854 846 850 Q805 854 781 886Z" fill="#211c18"/><g filter="url(#sh)"><path d="M252 714 h716 q30 0 30 30v116q0 30-30 30H651l-68 65 14-65H252q-30 0-30-30V744q0-30 30-30z" fill="#fff" stroke="#17212b" stroke-width="7"/><text x="278" y="760" fill="#111" font-size="28" font-weight="900">“도착지가 아니라 방향이 우리를 살린다.”</text><text x="278" y="798" fill="#333" font-size="23">“让我们活下去的，不是终点，而是方向。”</text><text x="278" y="833" fill="#555" font-size="21">“It isn’t the destination. It’s the direction that keeps us alive.”</text></g><text x="88" y="1160" fill="#76e8ff" font-size="45" font-weight="900">HUMMM…</text><rect x="36" y="1260" width="1008" height="618" rx="28" fill="#102435"/><path d="M36 1660 Q205 1590 390 1650 T730 1625 T1044 1612V1878H36Z" fill="#285b75"/><path d="M152 1589 L405 1496 L610 1570 L570 1618 L226 1634Z" fill="#15212a"/><path d="M290 1503 L414 1425 L438 1515Z" fill="#40576a"/><path d="M560 1618 L755 1551 L914 1607 L882 1644 L620 1656Z" fill="#121b24"/><path d="M662 1558 L762 1496 L782 1567Z" fill="#344a5c"/><path d="M760 1635 L918 1584 L1030 1620 L1007 1650 L826 1660Z" fill="#202a33"/><g filter="url(#sh)"><rect x="72" y="1288" width="838" height="132" rx="18" fill="#f5e7c5" stroke="#493625" stroke-width="6"/><text x="98" y="1334" fill="#24190f" font-size="29" font-weight="900">상황 · 지구는 아직 위험하다. 그러나 인간은 다시 움직이기 시작했다.</text><text x="98" y="1372" fill="#4b3625" font-size="23">旁白 · 地球依然危险，但人类已经重新开始前进。</text><text x="98" y="1407" fill="#66503e" font-size="21">Narration · Earth is still in danger, but humanity is moving again.</text></g><text x="98" y="1750" fill="#fff0b2" font-size="66" font-weight="1000">미래를 위하여</text><text x="98" y="1810" fill="#d7efff" font-size="34" font-weight="800">为了未来 · FOR THE FUTURE</text><text x="730" y="1810" fill="#ffd46c" font-size="42" font-weight="900">NEXT →</text><text x="54" y="1903" fill="#8aa6ba" font-size="22">FTF-08 · SCENE 26 / 26 · 미래를 위하여 — 출항</text></svg>