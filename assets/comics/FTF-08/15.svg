38 0 38 38v126q0 38-38 38H246l-52 52 8-52h-98q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="829" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic" font-weight="800">앞으로는 지도에 없는 바다야. 모두 경계 유지.</text><text x="96" y="870" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei">前方是地图上没有的海域。保持警戒。</text><text x="96" y="912" font-size="19" fill="#475569" font-family="Arial">Uncharted waters ahead. Stay alert.</text></g><rect x="50" y="1042" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1082" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic">상황 · 밤바다를 가르며 함대가 깊은 항로로 진입한다.</text><text x="74" y="1119" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei">旁白 · 舰队驶入漆黑而未知的深海航道。</text><text x="74" y="1155" font-size="15" fill="#94a3b8" font-family="Arial">Narration · The fleet enters an unknown corridor of dark ocean.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 15/26</text></svg>