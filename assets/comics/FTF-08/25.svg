" y="730" width="892" height="434" rx="20" fill="#183047"/><circle cx="280" cy="890" r="74" fill="#d29b74"/><path d="M210 881 Q280 796 355 867 Q330 813 278 809 Q234 815 208 850Z" fill="#1b252f"/><circle cx="254" cy="902" r="8"/><circle cx="306" cy="902" r="8"/><path d="M252 944 Q280 961 309 943" stroke="#754233" stroke-width="7" fill="none"/><path d="M180 1140 q100-236 226 0H180Z" fill="#3b556a"/><circle cx="685" cy="898" r="72" fill="#e0b18c"/><path d="M618 889 Q684 808 757 878 Q734 825 683 821 Q640 827 616 859Z" fill="#362920"/><circle cx="659" cy="910" r="8"/><circle cx="710" cy="910" r="8"/><path d="M658 949 Q685 966 713 948" stroke="#814a38" stroke-width="7" fill="none"/><path d="M590 1140 q96-231 218 0H590Z" fill="#50604a"/><g filter="url(#sh)"><path d="M310 710 h640 q30 0 30 30v115q0 30-30 30H645l-66 62 13-62H310q-30 0-30-30V740q0-30 30-30z" fill="#fff" stroke="#18222c" stroke-width="7"/><text x="337" y="756" fill="#111" font-size="28" font-weight="900">“전 함선 응답.” — “모두 살아 있다.”</text><text x="337" y="794" fill="#333" font-size="23">“全舰回应。” — “大家都还活着。”</text><text x="337" y="829" fill="#555" font-size="21">“All ships respond.” — “Everyone made it.”</text></g><text x="100" y="1160" fill="#ffd86f" font-size="46" font-weight="900">CLICK… STATIC…</text><rect x="36" y="1262" width="1008" height="616" rx="28" fill="#132b40"/><path d="M36 1638 Q200 1576 390 1633 T738 1608 T1044 1594V1878H36Z" fill="#1e506d"/><path d="M142 1580 L380 1498 L572 1565 L536 1607 L212 1624Z" fill="#141e27"/><path d="M272 1503 L388 1431 L412 1515Z" fill="#3b5265"/><path d="M526 1611 L710 1546 L866 1599 L835 1637 L585 1648Z" fill="#17212a"/><path d="M624 1551 L716 1494 L735 1559Z" fill="#34495b"/><path d="M785 1618 L923 1572 L1025 1608 L1000 1637 L833 1647Z" fill="#202932"/><g filter="url(#sh)"><rect x="72" y="1290" width="820" height="128" rx="18" fill="#f5e7c5" stroke="#493624" stroke-width="6"/><text x="98" y="1335" fill="#24190f" font-size="29" font-weight="900">상황 · 수평선의 첫빛과 함께 함대는 다시 한 줄로 정렬한다.</text><text x="98" y="1372" fill="#4b3625" font-size="23">旁白 · 第一缕晨光出现时，舰队再次排成一列。</text><text x="98" y="1406" fill="#66503e" font-size="21">Narration · At first light, the fleet forms up again.</text></g><text x="90" y="1822" fill="#ffd46b" font-size="46" font-weight="900">“함께 간다.” · “一起前进。” · “We move as one.”</text><text x="54" y="1903" fill="#8aa6ba" font-size="22">FTF-08 · SCENE 25 / 26 · 미래를 위하여 — 출항</text></svg>