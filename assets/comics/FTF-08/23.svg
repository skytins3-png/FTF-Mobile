<rect x="36" y="36" width="1008" height="600" rx="28" fill="url(#sun)"/><path d="M36 468 Q170 420 330 470 T620 445 T1044 432V636H36Z" fill="#254c66"/><path d="M74 460 L322 360 L530 435 L492 485 L158 503Z" fill="#18242e"/><path d="M208 365 L330 286 L358 376Z" fill="#3a5266"/><rect x="222" y="348" width="164" height="24" rx="7" fill="#91a7b7"/><path d="M600 470 L642 252 L682 470" stroke="#3f4c57" stroke-width="18" fill="none"/><path d="M633 295 L683 295 M621 350 L694 350 M611 408 L707 408" stroke="#d4dce3" stroke-width="9"/><circle cx="662" cy="238" r="27" fill="#e35d50"/><path d="M658 210 Q726 238 658 266" fill="none" stroke="#ffb68c" stroke-width="12" opacity=".7"/><path d="M658 190 Q775 238 658 286" fill="none" stroke="#ffe0af" stroke-width="8" opacity=".45"/><g filter="url(#sh)"><rect x="68" y="66" width="700" height="126" rx="18" fill="#08111ee8"/><text x="94" y="111" fill="#fff" font-size="30" font-weight="900">상황 · 함선과 마을 사이에 새 통신 비콘을 세운다</text><text x="94" y="148" fill="#d8e8f6" font-size="23">旁白 · 舰队与村庄之间架起新的通信信标</text><text x="94" y="182" fill="#aec8df" font-size="21">Narration · A new beacon links the fleet and settlement.</text></g><text x="760" y="236" fill="#fff0b2" font-size="51" font-weight="900">PING! PING!</text>
<rect x="36" y="674" width="1008" height="548" rx="28" fill="#1b2933"/><path d="M110 1085 q78-210 190 0v90H110Z" fill="#3e596d"/><circle cx="205" cy="903" r="62" fill="#d19a74"/><path d="M147 897 Q205 825 268 885 Q247 838 203 836 Q166 840 145 870Z" fill="#19232d"/><path d="M402 1100 q82-219 197 0v75H402Z" fill="#50614b"/><circle cx="500" cy="908" r="64" fill="#e2b18c"/><path d="M441 901 Q499 830 565 888 Q542 842 498 839 Q460 843 439 875Z" fill="#35281f"/><path d="M700 1095 q80-214 190 0v80H700Z" fill="#584a3d"/><circle cx="795" cy="909" r="62" fill="#c99169"/><path d="M737 902 Q794 833 856 890 Q837 846 793 843 Q756 846 736 878Z" fill="#211b18"/><path d="M286 973 H394 V1013 H286Z" fill="#8898a6"/><path d="M580 975 H696 V1015 H580Z" fill="#7d8f9e"/><g filter="url(#sh)"><path d="M260 706 h690 q30 0 30 30v114q0 30-30 30H650l-65 62 13-62H260q-30 0-30-30V736q0-30 30-30z" fill="#fff" stroke="#18222c" stroke-width="7"/><text x="286" y="752" fill="#111" font-size="28" font-weight="900">“이 신호가 끊기면 우리가 먼저 돌아오겠습니다.”</text><text x="286" y="790" fill="#333" font-size="23">“如果这个信号中断，我们会第一个回来。”</text><text x="286" y="825" fill="#555" font-size="21">“If this signal dies, we’ll be the first to return.”</text></g><text x="82" y="1161" fill="#78e7ff" font-size="45" font-weight="900">CLANK! TIK-TIK!</text>
<rect x="36" y="1260" width="1008" height="618" rx="28" fill="#142332"/><path d="M36 1640 Q200 1578 370 1638 T700 1608 T1044 1595V1878H36Z" fill="#28546e"/><path d="M80 1582 L330 1490 L536 1560 L500 1610 L152 1625Z" fill="#17232c"/><path d="M215 1498 L340 1418 L365 1510Z" fill="#3c5265"/><path d="M670 1650 L714 1404 L755 1650" stroke="#495764" stroke-width="18" fill="none"/><circle cx="735" cy="1386" r="28" fill="#f26055"/><path d="M731 1352 Q820 1385 731 1418" fill="none" stroke="#ffbe8f" stroke-width="10"/><path d="M731 1325 Q885 1385 731 1445" fill="none" stroke="#ffe4b7" stroke-width="8" opacity=".6"/><g filter="url(#sh)"><rect x="72" y="1288" width="820" height="128" rx="18" fill="#f5e7c6" stroke="#493625" stroke-width="6"/><text x="98" y="1334" fill="#241910" font-size="29" font-weight="900">상황 · 붉은 비콘이 켜지고, 함교 화면에 마을 이름이 등록된다.</text><text x="98" y="1371" fill="#4c3727" font-size="23">旁白 · 红色信标亮起，村庄名称出现在舰桥屏幕上。</text><text x="98" y="1406" fill="#665140" font-size="21">Narration · The settlement is now a permanent point on the fleet map.</text></g><text x="92" y="1822" fill="#ffd46d" font-size="46" font-weight="900">“연결 완료.” · “连接完成。” · “Link established.”</text><text x="54" y="1903" fill="#8aa6ba" font-size="22">FTF-08 · SCENE 23 / 26 · 미래를 위하여 — 출항</text></svg>