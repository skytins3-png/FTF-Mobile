<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#101827"/><stop offset=".55" stop-color="#164e63"/><stop offset="1" stop-color="#06202d"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".6"/></filter></defs><rect width="720" height="1280" fill="#05080d"/><rect x="18" y="18" width="684" height="742" rx="24" fill="url(#g)" stroke="#94a3b8" stroke-width="4"/><rect x="42" y="40" width="458" height="112" rx="14" fill="#090d15" stroke="#fb923c" stroke-width="5"/><text x="60" y="77" font-size="18" fill="#fb923c" font-family="Arial" font-weight="700">SCENE 17 · BLACK BOX</text><text x="60" y="111" font-size="24" fill="white" font-family="Arial,Malgun Gothic" font-weight="800">표류 잔해의 기록장치</text><text x="60" y="141" font-size="15" fill="#fed7aa" font-family="Arial,Malgun Gothic">잔해 사이에서 살아 있는 비상 기록장치가 발견된다.</text><path d="M0 490q120-42 240 0t240 0t240 0v270H0z" fill="#0e4961"/><path d="M108 576l220-44 245 24 72 50-52 48H163l-74-35z" fill="#cbd5e1" stroke="#0f172a" stroke-width="8"/><path d="M196 548l-42 18 28 22 48-10zM486 570l66 18-19 28-77-17zM592 642l45 12-18 32-55-22z" fill="#64748b" stroke="#1e293b" stroke-width="4"/><rect x="328" y="620" width="84" height="58" rx="8" fill="#f97316" stroke="#7c2d12" stroke-width="6"/><circle cx="389" cy="639" r="7" fill="#fde047"/><path d="M370 651h24" stroke="#111827" stroke-width="4"/><g filter="url(#d)"><circle cx="173" cy="684" r="36" fill="#d6a574"/><path d="M130 727q43-47 86 0v92h-86z" fill="#24364b"/><circle cx="530" cy="683" r="36" fill="#d9ac80"/><path d="M487 726q43-47 86 0v93h-86z" fill="#385066"/></g><text x="446" y="542" font-size="40" fill="#fb923c" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900">CLANG!</text><g filter="url(#d)"><path d="M68 812q0-36 38-36h508q38 0 38 38v124q0 38-38 38H245l-52 52 7-52h-94q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="835" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic" font-weight="800">전원은 살아 있어. 누군가 마지막까지 남긴 기록이야.</text><text x="96" y="875" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei">还有电。有人把记录保留到了最后。</text><text x="96" y="916" font-size="19" fill="#475569" font-family="Arial">It still has power. Someone saved this to the end.</text></g><rect x="50" y="1042" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1082" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic">상황 · 구조대가 바다 위 잔해에서 주황색 기록장치를 회수한다.</text><text x="74" y="1119" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei">旁白 · 救援队从海上残骸中回收橙色记录器。</text><text x="74" y="1155" font-size="15" fill="#94a3b8" font-family="Arial">Narration · A recorder is recovered from drifting wreckage.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 17/26</text></svg>