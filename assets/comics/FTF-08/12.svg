<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#020617"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".6"/></filter></defs><rect width="720" height="1280" fill="#05080d"/><rect x="18" y="18" width="684" height="744" rx="24" fill="url(#s)" stroke="#cbd5e1" stroke-width="4"/><rect y="430" width="720" height="330" fill="#061c28"/><path d="M0 530q120-58 240 0t240 0t240 0v230H0z" fill="#0c4a6e"/><rect x="420" y="350" width="240" height="155" fill="#1f2937" stroke="#64748b" stroke-width="6"/><rect x="455" y="392" width="48" height="62" fill="#fef08a" opacity=".8"/><path d="M65 368l258-49 36 36-267 58z" fill="#334155"/><path d="M120 342l54-31 40 14-48 42z" fill="#94a3b8"/><g filter="url(#d)"><circle cx="188" cy="620" r="40" fill="#d6a574"/><path d="M142 668q46-54 92 0v118h-92z" fill="#1e3a5f"/><path d="M165 588q24-26 48 0v20h-48z" fill="#111827"/><circle cx="493" cy="634" r="38" fill="#e1b382"/><path d="M451 681q42-50 84 0v112h-84z" fill="#334155"/></g><g filter="url(#d)"><rect x="38" y="42" width="455" height="118" rx="14" fill="#080b11" stroke="#38bdf8" stroke-width="5"/><text x="58" y="78" font-size="18" fill="#38bdf8" font-family="Arial,Malgun Gothic,sans-serif" font-weight="700">SCENE 12 · NIGHT LANDING</text><text x="58" y="111" font-size="23" fill="white" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">야간 상륙</text><text x="58" y="142" font-size="16" fill="#dbeafe" font-family="Arial,Malgun Gothic,sans-serif">정찰팀이 빗속의 부두에 내려 생존자를 찾는다.</text></g><text x="470" y="282" font-size="35" fill="#38bdf8" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900" font-style="italic">SPLASH—THUD</text><g filter="url(#d)"><path d="M66 808q0-36 38-36h508q38 0 38 38v124q0 38-38 38H235l-50 52 6-52h-87q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="825" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">불빛 보여! 저 창고 안이야.</text><text x="96" y="865" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei,sans-serif">看到灯光了！在那个仓库里。</text><text x="96" y="906" font-size="19" fill="#475569" font-family="Arial">I see a light! Inside that warehouse.</text></g><rect x="50" y="1040" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1080" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic,sans-serif">상황 · 빗속 부두에 보트가 닿고 정찰팀이 뛰어내린다.</text><text x="74" y="1117" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei,sans-serif">旁白 · 小艇靠上雨夜码头，侦察队迅速登陆。</text><text x="74" y="1153" font-size="15" fill="#94a3b8" font-family="Arial">Narration · The scout team lands on the flooded pier.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 12/26</text></svg>