<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071323"/><stop offset=".72" stop-color="#315b77"/><stop offset="1" stop-color="#e2935d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#05080c"/><rect width="1080" height="1280" fill="url(#sky)"/><circle cx="820" cy="205" r="105" fill="#ffc675"/><path d="M0 890 Q230 825 480 900 T1080 870 V1280 H0Z" fill="#183d53"/><g transform="translate(115 650)"><path d="M0 290 L590 290 L700 395 L90 395Z" fill="#2b4252" stroke="#0b1117" stroke-width="9"/><rect x="210" y="115" width="245" height="175" fill="#536c7a"/><rect x="265" y="60" width="130" height="55" fill="#76909e"/><line x1="330" y1="60" x2="330" y2="-110" stroke="#d5dde2" stroke-width="10"/><path d="M330 -110 L395 -50 L330 -25Z" fill="#ec5555"/><rect x="30" y="315" width="180" height="18" fill="#d9e7ed"/></g><g transform="translate(615 865)"><circle cx="95" cy="65" r="52" fill="#e8be99"/><path d="M45 66 Q58 18 100 20 Q145 22 150 80 Q122 55 94 56 Q70 56 45 66" fill="#24272d"/><path d="M42 135 Q95 105 148 135 L178 330 Q95 365 12 330Z" fill="#334b5f"/><path d="M170 205 Q235 165 300 135" fill="none" stroke="#e8be99" stroke-width="28" stroke-linecap="round"/><circle cx="360" cy="70" r="50" fill="#e4b894"/><path d="M312 70 Q323 20 365 22 Q408 24 412 80 Q385 57 357 57 Q335 57 312 70" fill="#48372f"/><path d="M310 138 Q360 108 410 138 L438 325 Q360 358 282 325Z" fill="#556678"/></g><g filter="url(#s)"><path d="M55 55 Q55 25 115 25 H790 Q850 25 850 95 V300 Q850 365 775 365 H250 L165 430 L188 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">승선 확인 완료. 마지막 계류줄을 풀겠습니다.</text><text x="105" y="192" font-family="Arial" font-size="33">登舰确认完毕。准备解开最后一根缆绳。</text><text x="105" y="257" font-family="Arial" font-size="30">Boarding confirmed. Releasing the final mooring line.</text></g><text x="735" y="735" font-family="Impact,Arial Black" font-size="82" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-6 735 735)">CLANK!</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">새벽빛 속에서 승선 점검이 끝나고 갑판 요원들이 마지막 계류줄을 풀며 출항을 준비한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">晨光中完成登舰检查，甲板人员解开最后缆绳准备启航。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">At dawn, boarding checks finish and deck crew release the final line before departure.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-08 · FOR THE FUTURE — SET SAIL · SCENE 02 / 26</text></svg>