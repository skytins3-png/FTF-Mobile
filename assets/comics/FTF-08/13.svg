t x="96" y="825" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">괜찮아. 이제 우리가 왔어.</text><text x="96" y="865" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei,sans-serif">没事了。我们来了。</text><text x="96" y="906" font-size="19" fill="#475569" font-family="Arial">You're safe. We're here now.</text></g><rect x="50" y="1040" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1080" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic,sans-serif">상황 · 구조대원이 잔해 사이로 손을 내밀고 아이가 잡는다.</text><text x="74" y="1117" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei,sans-serif">旁白 · 救援员伸出手，孩子紧紧抓住。</text><text x="74" y="1153" font-size="15" fill="#94a3b8" font-family="Arial">Narration · A rescuer reaches through the debris and the child holds on.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 13/26</text></svg>