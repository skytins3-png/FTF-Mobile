family="Arial" font-weight="900" font-style="italic">BEEP! BEEP!</text><g filter="url(#d)"><path d="M66 808q0-36 38-36h508q38 0 38 38v124q0 38-38 38H235l-50 52 6-52h-87q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="825" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">항로를 틀어. 사람들을 두고 갈 수 없어.</text><text x="96" y="865" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei,sans-serif">改变航向。我们不能把他们留下。</text><text x="96" y="906" font-size="19" fill="#475569" font-family="Arial">Change course. We don't leave them behind.</text></g><rect x="50" y="1040" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1080" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic,sans-serif">상황 · 폐허 속 붉은 구조등이 반복해서 깜빡인다.</text><text x="74" y="1117" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei,sans-serif">旁白 · 废墟中的红色求救灯不断闪烁。</text><text x="74" y="1153" font-size="15" fill="#94a3b8" font-family="Arial">Narration · A red distress beacon flashes in the ruins.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 11/26</text></svg>