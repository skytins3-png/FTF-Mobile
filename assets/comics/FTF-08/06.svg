<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600"><defs><linearGradient id="storm" x2="0" y2="1"><stop stop-color="#0a1426"/><stop offset=".45" stop-color="#283f5d"/><stop offset="1" stop-color="#7890a8"/></linearGradient><linearGradient id="wave" x2="0" y2="1"><stop stop-color="#2c89aa"/><stop offset="1" stop-color="#08293c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1600" fill="#06101b"/><rect x="18" y="18" width="1044" height="1564" rx="26" fill="#eef2f6"/><g transform="translate(34 34)"><rect width="1012" height="650" rx="18" fill="url(#storm)"/><g stroke="#bfeaff" stroke-width="5" opacity=".6"><path d="M50 20l-70 180M130 0 40 250M250 20 150 300M900 0 800 280M1000 20 900 320"/></g><path d="M0 400Q140 300 280 420T560 400T840 420T1120 390V650H0Z" fill="url(#wave)"/><path d="M0 468Q150 320 320 478T620 470T930 490T1150 455" fill="none" stroke="#d6fbff" stroke-width="30" opacity=".9"/><g transform="translate(410 210)"><path d="M0 200 330 120 470 160 420 250 42 270Z" fill="#445d73" stroke="#0b1722" stroke-width="9"/><rect x="155" y="66" width="172" height="120" rx="7" fill="#30495d"/><rect x="202" y="14" width="90" height="80" fill="#39566f"/><path d="M246 14V-60M215-35h63" stroke="#152536" stroke-width="10"/><g fill="#72d7ff" filter="url(#glow)"><rect x="178" y="96" width="28" height="18"/><rect x="218" y="96" width="28" height="18"/><rect x="258" y="96" width="28" height="18"/></g><text x="105" y="229" font-family="Arial" font-size="48" font-weight="900" fill="#f4f8fb">FTF-08</text></g><text x="64" y="110" font-family="Impact,Arial" font-size="84" fill="#fff" stroke="#111" stroke-width="5" transform="rotate(-8 64 110)">SPLASH!</text><rect x="555" y="38" width="410" height="145" rx="18" fill="#fff7dc" stroke="#111" stroke-width="5"/><text x="582" y="78" font-family="Arial" font-weight="900" font-size="29"><tspan x="582">첫 번째 거센 파도.</tspan><tspan x="582" dy="38">함대는 속도를 유지한다.</tspan><tspan x="582" dy="35" font-size="23">第一道巨浪扑来，舰队不减速。</tspan></text></g><g transform="translate(34 712)"><rect width="1012" height="380" rx="18" fill="#132238"/><rect x="30" y="28" width="952" height="324" rx="14" fill="#20344b" stroke="#7ca2c0" stroke-width="3"/><g transform="translate(80 70)"><path d="M120 40q45-45 90 0l18 80-34 120H55L25 120Z" fill="#111b29"/><ellipse cx="164" cy="25" rx="40" ry="46" fill="#c78b62"/><path d="M126 16q8-55 75-35 21 8 24 41-42-23-99-6Z" fill="#15171d"/><path d="M72 120h115" stroke="#2b5f87" stroke-width="22"/><text x="95" y="136" fill="#e6f3ff" font-family="Arial" font-size="24" font-weight="900">FTF</text></g><g transform="translate(315 55)"><circle cx="110" cy="98" r="82" fill="#0a1624" stroke="#6cc8ff" stroke-width="4"/><path d="M110 98 180 55" stroke="#76d6ff" stroke-width="5"/><circle cx="110" cy="98" r="8" fill="#76d6ff"/><path d="M45 75Q110 35 175 75M45 122Q110 162 175 122" fill="none" stroke="#24435e" stroke-width="3"/></g><rect x="520" y="55" width="420" height="210" rx="72" fill="#fff" stroke="#111" stroke-width="6"/><path d="M536 232 475 302 565 267Z" fill="#fff" stroke="#111" stroke-width="6"/><text x="565" y="102" font-family="Arial" font-weight="900" font-size="36"><tspan x="565">흔들려도 멈추지 마!</tspan><tspan x="565" dy="48" font-size="30">再摇也不要停！</tspan><tspan x="565" dy="43" font-size="26">Even if we shake,</tspan><tspan x="565" dy="34" font-size="26">we do not stop!</tspan></text></g><g transform="translate(34 1118)"><rect width="1012" height="414" rx="18" fill="#07111e"/><path d="M0 280Q170 235 330 290T650 280T1012 292V414H0Z" fill="#0d425d"/><g fill="#3e596e"><path d="M80 240 250 195 325 220 300 265 110 275Z"/><path d="M380 235 570 180 650 210 615 260 410 270Z"/><path d="M710 250 875 210 950 230 920 275 735 285Z"/></g><g fill="#90dcff"><rect x="210" y="216" width="22" height="9"/><rect x="535" y="204" width="22" height="9"/><rect x="840" y="228" width="22" height="9"/></g><rect x="40" y="38" width="470" height="135" rx="14" fill="#fff3d8" stroke="#111" stroke-width="5"/><text x="68" y="82" font-family="Arial" font-weight="800" font-size="28"><tspan x="68">파도가 지나간 뒤에도</tspan><tspan x="68" dy="38">세 개의 불빛은 여전히 함께다.</tspan><tspan x="68" dy="34" font-size="22">After the wave, the fleet still holds formation.</tspan></text><text x="650" y="360" font-family="Impact,Arial" font-size="58" fill="#eaf6ff">FTF · 06 / 26</text></g></svg>