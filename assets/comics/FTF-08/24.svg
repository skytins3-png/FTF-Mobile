<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="FTF-08 SCENE 24 farewell at sunset"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4f4f78"/><stop offset=".55" stop-color="#d6725f"/><stop offset="1" stop-color="#ffd49b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#081019"/><!-- FTF-08 SCENE 24 --><rect x="36" y="36" width="1008" height="602" rx="28" fill="url(#sky)"/><circle cx="834" cy="332" r="92" fill="#ffd88e" opacity=".92"/><path d="M36 454 Q210 394 386 447 T716 438 T1044 420V638H36Z" fill="#24485f"/><path d="M98 485 L346 392 L555 462 L515 507 L160 527Z" fill="#17232c"/><path d="M224 397 L350 318 L374 410Z" fill="#405669"/><path d="M640 500 q62-144 145 0v90H640Z" fill="#435d70"/><circle cx="712" cy="378" r="48" fill="#d09a73"/><path d="M668 371 Q711 318 760 361 Q743 325 711 323 Q682 327 667 350Z" fill="#1a232d"/><path d="M790 510 q65-150 150 0v81H790Z" fill="#5a4b3d"/><circle cx="865" cy="386" r="49" fill="#dda984"/><path d="M820 379 Q864 326 914 369 Q897 334 864 331 Q835 335 819 357Z" fill="#34271f"/><g filter="url(#sh)"><rect x="68" y="66" width="685" height="126" rx="18" fill="#07111ee8"/><text x="94" y="111" fill="#fff" font-size="30" font-weight="900">상황 · 해 질 무렵, 구조 임무를 마친 함대가 떠난다</text><text x="94" y="148" fill="#d9e8f4" font-size="23">旁白 · 黄昏时，完成救援任务的舰队再次启航</text><text x="94" y="182" fill="#afc7dc" font-size="21">Narration · At sunset, the fleet departs after completing the rescue.</text></g><text x="756" y="232" fill="#fff0c4" font-size="50" font-weight="900">HOOOOONK</text><rect x="36" y="676" width="1008" height="548" rx="28" fill="#192631"/><path d="M70 1100 q84-210 190 0v80H70Z" fill="#3c5569"/><circle cx="162" cy="917" r="61" fill="#d19a74"/><path d="M105 910 Q162 841 224 899 Q204 854 162 851 Q124 855 103 883Z" fill="#1a232c"/><path d="M325 1103 q83-212 194 0v77H325Z" fill="#54644d"/><circle cx="419" cy="921" r="62" fill="#dfaf8a"/><path d="M361 914 Q419 844 482 902 Q462 857 419 854 Q380 858 359 887Z" fill="#35281f"/><path d="M595 1108 q80-210 188 0v72H595Z" fill="#594939"/><circle cx="687" cy="925" r="61" fill="#c8916a"/><path d="M630 918 Q687 850 748 905 Q729 861 686 858 Q648 862 628 891Z" fill="#211b18"/><path d="M810 1110 q75-198 174 0v70H810Z" fill="#46596a"/><circle cx="895" cy="936" r="57" fill="#d7a27d"/><path d="M842 930 Q895 866 951 919 Q934 878 895 875 Q861 879 841 904Z" fill="#25222a"/><g filter="url(#sh)"><path d="M200 708 h735 q30 0 30 30v116q0 30-30 30H635l-70 62 15-62H200q-30 0-30-30V738q0-30 30-30z" fill="#fff" stroke="#18222b" stroke-width="7"/><text x="226" y="754" fill="#111" font-size="28" font-weight="900">“다시 올 겁니까?” — “신호가 오면 반드시.”</text><text x="226" y="792" fill="#333" font-size="23">“你们还会回来吗？” — “只要信号响起，一定会。”</text><text x="226" y="827" fill="#555" font-size="21">“Will you come back?” — “If the beacon calls, always.”</text></g><text x="85" y="1162" fill="#ffd870" font-size="44" font-weight="900">WAVE… WAVE…</text><rect x="36" y="1262" width="1008" height="616" rx="28" fill="#152838"/><path d="M36 1648 Q180 1590 340 1640 T680 1622 T1044 1608V1878H36Z" fill="#204b67"/><path d="M278 1596 L532 1508 L744 1584 L702 1632 L358 1648Z" fill="#151f28"/><path d="M414 1514 L540 1436 L565 1528Z" fill="#3c5367"/><path d="M80 1714 q66-160 150 0v108H80Z" fill="#334d60"/><circle cx="154" cy="1588" r="49" fill="#d39c76"/><path d="M108 1581 Q153 1526 202 1571 Q186 1536 153 1534 Q124 1537 107 1559Z" fill="#1c2228"/><path d="M820 1730 q63-154 146 0v92H820Z" fill="#4e6048"/><circle cx="893" cy="1605" r="48" fill="#dfaf8a"/><path d="M848 1598 Q893 1543 941 1588 Q925 1553 892 1551 Q864 1554 847 1576Z" fill="#372a21"/><g filter="url(#sh)"><rect x="72" y="1290" width="820" height="128" rx="18" fill="#f4e6c4" stroke="#493624" stroke-width="6"/><text x="98" y="1335" fill="#24190f" font-size="29" font-weight="900">상황 · 해안의 사람들은 손을 흔들고, 함선은 다시 먼 바다를 향한다.</text><text x="98" y="1372" fill="#4b3625" font-size="23">旁白 · 岸上的人挥手告别，舰队再次驶向远海。</text><text x="98" y="1406" fill="#66503e" font-size="21">Narration · The shore waves goodbye as the ships turn toward open water.</text></g><text x="92" y="1823" fill="#ffd36a" font-size="45" font-weight="900">“약속은 남겨둔다.” · “承诺会留下。” · “The promise remains.”</text><text x="54" y="1903" fill="#8ca6ba" font-size="22">FTF-08 · SCENE 24 / 26 · 미래를 위하여 — 출항</text></svg>