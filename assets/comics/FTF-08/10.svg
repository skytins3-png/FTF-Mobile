="470" y="280" font-size="37" fill="#60a5fa" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900" font-style="italic" transform="rotate(-8 470 280)">KRRR—BOOM!</text><g filter="url(#d)"><path d="M66 808q0-36 38-36h508q38 0 38 38v124q0 38-38 38H235l-50 52 6-52h-87q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="825" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic,sans-serif" font-weight="800">대형을 유지해. 우리가 함께 건넌다.</text><text x="96" y="865" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei,sans-serif">保持队形。我们一起穿过去。</text><text x="96" y="906" font-size="19" fill="#475569" font-family="Arial">Hold formation. We cross together.</text></g><rect x="50" y="1040" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1080" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic,sans-serif">상황 · 함대가 번개와 거센 파도 사이로 진입한다.</text><text x="74" y="1117" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei,sans-serif">旁白 · 舰队驶入雷电和巨浪之间。</text><text x="74" y="1153" font-size="15" fill="#94a3b8" font-family="Arial">Narration · The fleet enters the storm corridor.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 10/26</text></svg>