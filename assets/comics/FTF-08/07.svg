<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600"><defs><radialGradient id="earth"><stop stop-color="#8de3ff"/><stop offset=".45" stop-color="#1c8fd1"/><stop offset=".72" stop-color="#165f85"/><stop offset="1" stop-color="#0a2438"/></radialGradient><linearGradient id="bridge" x2="0" y2="1"><stop stop-color="#193047"/><stop offset="1" stop-color="#08131f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1600" fill="#050c14"/><rect x="18" y="18" width="1044" height="1564" rx="26" fill="#edf2f6"/><g transform="translate(34 34)"><rect width="1012" height="610" rx="18" fill="url(#bridge)"/><path d="M80 70H932V520H80Z" fill="#0d1b29" stroke="#5a84a4" stroke-width="4"/><circle cx="506" cy="265" r="168" fill="url(#earth)" filter="url(#glow)"/><path d="M420 230q60-90 140-35 60 38 25 100-40 70-148 50-55-12-17-115Z" fill="#68b96b" opacity=".9"/><path d="M535 335q45-28 98-2 32 15 18 60-25 60-110 48-38-7-6-106Z" fill="#57a85f" opacity=".9"/><path d="M185 475 355 350h302l170 125" fill="none" stroke="#2e516d" stroke-width="18"/><g fill="#112131" stroke="#57708a" stroke-width="4"><rect x="105" y="415" width="185" height="92" rx="12"/><rect x="722" y="415" width="185" height="92" rx="12"/></g><g transform="translate(130 330)"><path d="M70 65q40-45 85 0l25 95-34 130H55L20 160Z" fill="#111b27"/><ellipse cx="113" cy="36" rx="38" ry="44" fill="#c78c65"/><path d="M78 30q8-55 68-37 25 6 30 40-42-20-98-3Z" fill="#111820"/><text x="78" y="170" fill="#e9f5ff" font-family="Arial" font-weight="900" font-size="23">FTF</text></g><g transform="translate(720 320)"><path d="M65 75q43-48 90 0l28 100-38 130H48L12 175Z" fill="#172437"/><ellipse cx="110" cy="44" rx="39" ry="46" fill="#e0ae8d"/><path d="M72 43q15-58 78-43 23 7 31 39-39-15-109 4Z" fill="#17151a"/><path d="M58 95q52 27 104 0" fill="none" stroke="#2a6c92" stroke-width="8"/></g><rect x="40" y="34" width="430" height="130" rx="14" fill="#fff4d8" stroke="#111" stroke-width="5"/><text x="67" y="76" font-family="Arial" font-weight="800" font-size="28"><tspan x="67">함교의 약속.</tspan><tspan x="67" dy="38">우리가 지키려는 것은 결국 하나다.</tspan><tspan x="67" dy="34" font-size="22">舰桥上的约定：守护同一个地球。</tspan></text><text x="740" y="135" font-family="Impact,Arial" font-size="62" fill="#7de4ff" filter="url(#glow)">HUMM</text></g><g transform="translate(34 670)"><rect width="1012" height="430" rx="18" fill="#132132"/><g transform="translate(70 60)"><path d="M120 58q52-56 108 0l35 120-48 150H75L30 178Z" fill="#0e1722"/><ellipse cx="175" cy="34" rx="48" ry="54" fill="#b97f59"/><path d="M128 22q13-67 91-43 26 9 33 49-49-27-124-6Z" fill="#11151c"/><rect x="16" y="100" width="100" height="36" rx="9" fill="#243d57"/><text x="37" y="127" font-family="Arial" font-weight="900" font-size="22" fill="#eef8ff">FTF-08</text></g><rect x="365" y="44" width="570" height="255" rx="78" fill="#fff" stroke="#111" stroke-width="6"/><path d="M390 275 325 352 420 307Z" fill="#fff" stroke="#111" stroke-width="6"/><text x="415" y="100" font-family="Arial" font-weight="900" font-size="36"><tspan x="415">지구를 위해,</tspan><tspan x="415" dy="46">우리의 미래를 위해.</tspan><tspan x="415" dy="46" font-size="29">为了地球，也为了我们的未来。</tspan><tspan x="415" dy="42" font-size="27">For the Earth, for our future.</tspan></text><rect x="630" y="324" width="275" height="62" rx="12" fill="#0b1725" stroke="#58cfff" stroke-width="3"/><text x="655" y="364" font-family="Arial" font-size="24" fill="#a8ecff">MISSION LOCKED</text></g><g transform="translate(34 1126)"><rect width="1012" height="406" rx="18" fill="#08131f"/><path d="M0 310Q180 275 330 320T650 310T1012 320V406H0Z" fill="#0d3b55"/><g transform="translate(380 170)"><path d="M0 90 260 35 355 65 320 120 35 135Z" fill="#50677a" stroke="#111c25" stroke-width="7"/><rect x="105" y="7" width="120" height="72" fill="#3b5367"/><circle cx="165" cy="-28" r="9" fill="#7ce3ff"/></g><rect x="42" y="34" width="465" height="138" rx="14" fill="#fff1d2" stroke="#111" stroke-width="5"/><text x="68" y="78" font-family="Arial" font-weight="800" font-size="28"><tspan x="68">약속은 말로 끝나지 않는다.</tspan><tspan x="68" dy="39">함대는 같은 방향으로 움직인다.</tspan><tspan x="68" dy="35" font-size="22">The promise becomes a course.</tspan></text><text x="700" y="355" font-family="Impact,Arial" font-size="56" fill="#edf8ff">FTF · 07 / 26</text></g></svg>