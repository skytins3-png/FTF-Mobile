<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08121f"/><stop offset=".7" stop-color="#234a69"/><stop offset="1" stop-color="#d88a55"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#05080c"/><rect width="1080" height="1280" fill="url(#sky)"/><circle cx="850" cy="230" r="120" fill="#ffc979"/><path d="M0 900 Q220 850 450 910 T1080 890 V1280 H0Z" fill="#18394c"/><g transform="translate(120 650)"><path d="M0 250 L520 250 L650 350 L95 350Z" fill="#2d4352" stroke="#0c1217" stroke-width="9"/><rect x="180" y="90" width="220" height="160" fill="#596e7a"/><rect x="225" y="35" width="120" height="55" fill="#738a96"/><line x1="285" y1="35" x2="285" y2="-120" stroke="#d0d9de" stroke-width="10"/><path d="M285 -120 L350 -60 L285 -35Z" fill="#e84f4f"/><circle cx="60" cy="350" r="22" fill="#d8e9f0"/><circle cx="150" cy="350" r="22" fill="#d8e9f0"/></g><g transform="translate(650 860)"><circle cx="120" cy="80" r="58" fill="#e9c19e"/><path d="M65 78 Q78 18 125 20 Q176 22 180 90 Q145 62 115 62 Q88 62 65 78" fill="#23252a"/><path d="M60 155 Q120 120 180 155 L212 370 Q120 410 28 370Z" fill="#30485d"/><circle cx="310" cy="85" r="56" fill="#e7bf9e"/><path d="M258 83 Q270 25 315 27 Q363 29 366 94 Q334 67 305 67 Q280 67 258 83" fill="#3a302c"/><path d="M255 160 Q310 128 365 160 L392 365 Q310 400 228 365Z" fill="#506275"/></g><g filter="url(#s)"><path d="M55 65 Q55 30 115 30 H760 Q830 30 830 100 V295 Q830 360 760 360 H225 L145 425 L165 360 H115 Q55 360 55 295Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">모든 준비 완료. 미래를 위하여 출항한다.</text><text x="105" y="192" font-family="Arial" font-size="34">全部准备完毕。为了未来，启航。</text><text x="105" y="257" font-family="Arial" font-size="31">All systems ready. Set sail for the future.</text></g><text x="695" y="720" font-family="Impact,Arial Black" font-size="92" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 695 720)">HOOONK!</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#111419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">새벽 항구에서 함선의 불이 켜지고 마지막 출항 명령이 떨어진다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">黎明港口亮起舰船灯光，最后的启航命令下达。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">At dawn, the fleet lights up and receives the final launch order.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-08 · FOR THE FUTURE — SET SAIL · SCENE 01 / 26</text></svg>