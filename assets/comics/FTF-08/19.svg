<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f59e0b"/><stop offset=".33" stop-color="#fcd34d"/><stop offset=".34" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0e7490"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".55"/></filter></defs><rect width="720" height="1280" fill="#05080d"/><rect x="18" y="18" width="684" height="742" rx="24" fill="url(#g)" stroke="#e2e8f0" stroke-width="4"/><circle cx="552" cy="198" r="86" fill="#fff7d6" opacity=".95"/><path d="M0 500q120-40 240 0t240 0t240 0v260H0z" fill="#0c4a6e" opacity=".9"/><path d="M58 598l250-42 252 25 93 62-64 56H148l-89-43z" fill="#e2e8f0" stroke="#0f172a" stroke-width="8"/><path d="M249 538h190l55 63H215z" fill="#64748b" stroke="#0f172a" stroke-width="7"/><rect x="317" y="564" width="44" height="25" fill="#bae6fd"/><rect x="374" y="564" width="44" height="25" fill="#bae6fd"/><path d="M49 463q92-105 184 0" fill="#334155" opacity=".75"/><path d="M498 465q96-92 192 0" fill="#475569" opacity=".7"/><g filter="url(#d)"><circle cx="172" cy="687" r="37" fill="#d5a477"/><path d="M129 731q43-49 86 0v93h-86z" fill="#24364b"/><circle cx="538" cy="685" r="37" fill="#d9ac80"/><path d="M495 729q43-49 86 0v95h-86z" fill="#385066"/></g><rect x="42" y="40" width="470" height="112" rx="14" fill="#090d15" stroke="#facc15" stroke-width="5"/><text x="60" y="77" font-size="18" fill="#facc15" font-family="Arial" font-weight="700">SCENE 19 · NEW HORIZON</text><text x="60" y="111" font-size="24" fill="white" font-family="Arial,Malgun Gothic" font-weight="800">새로운 수평선</text><text x="60" y="141" font-size="15" fill="#fef3c7" font-family="Arial,Malgun Gothic">긴 밤 끝, 구름 사이로 새로운 육지가 보이기 시작한다.</text><text x="475" y="304" font-size="42" fill="#facc15" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900">WOOOOSH!</text><g filter="url(#d)"><path d="M68 812q0-36 38-36h508q38 0 38 38v124q0 38-38 38H245l-52 52 7-52h-94q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="835" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic" font-weight="800">저기다. 우리가 계속 온 이유가 저기 있어.</text><text x="96" y="875" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei">在那里。那就是我们坚持航行的理由。</text><text x="96" y="916" font-size="19" fill="#475569" font-family="Arial">There it is. That's why we kept sailing.</text></g><rect x="50" y="1042" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1082" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic">상황 · 함대 앞에 햇빛과 함께 새로운 해안선이 모습을 드러낸다.</text><text x="74" y="1119" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei">旁白 · 阳光之中，一条新的海岸线出现在舰队前方。</text><text x="74" y="1155" font-size="15" fill="#94a3b8" font-family="Arial">Narration · A new coastline emerges in the morning light.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 19/26</text></svg>