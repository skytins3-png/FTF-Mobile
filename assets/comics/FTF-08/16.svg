<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14354a"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".55"/></filter></defs><rect width="720" height="1280" fill="#05080d"/><rect x="18" y="18" width="684" height="742" rx="24" fill="url(#g)" stroke="#94a3b8" stroke-width="4"/><rect x="42" y="40" width="456" height="112" rx="14" fill="#090d15" stroke="#22d3ee" stroke-width="5"/><text x="60" y="77" font-size="18" fill="#22d3ee" font-family="Arial" font-weight="700">SCENE 16 · SENSOR ANOMALY</text><text x="60" y="111" font-size="24" fill="white" font-family="Arial,Malgun Gothic" font-weight="800">레이더의 이상 신호</text><text x="60" y="141" font-size="15" fill="#cffafe" font-family="Arial,Malgun Gothic">함교의 레이더에 정체불명의 신호가 반복된다.</text><rect x="84" y="214" width="552" height="286" rx="24" fill="#07151d" stroke="#1f8598" stroke-width="5"/><circle cx="360" cy="357" r="112" fill="none" stroke="#155e75" stroke-width="3"/><circle cx="360" cy="357" r="70" fill="none" stroke="#155e75" stroke-width="3"/><line x1="360" y1="245" x2="360" y2="469" stroke="#155e75"/><line x1="248" y1="357" x2="472" y2="357" stroke="#155e75"/><path d="M360 357L446 294A112 112 0 0 1 465 389Z" fill="#22d3ee" opacity=".18"/><circle cx="442" cy="312" r="10" fill="#facc15"/><circle cx="466" cy="336" r="7" fill="#f97316"/><text x="493" y="308" font-size="15" fill="#fde68a" font-family="Arial">UNKNOWN</text><g filter="url(#d)"><circle cx="175" cy="628" r="38" fill="#d5a477"/><path d="M131 673q44-49 88 0v101h-88z" fill="#23354d"/><circle cx="538" cy="626" r="38" fill="#dab084"/><path d="M494 671q44-49 88 0v103h-88z" fill="#334b62"/></g><text x="490" y="548" font-size="38" fill="#facc15" stroke="#020617" stroke-width="8" paint-order="stroke" font-family="Arial" font-weight="900">BEEP! BEEP!</text><g filter="url(#d)"><path d="M68 812q0-36 38-36h508q38 0 38 38v124q0 38-38 38H245l-52 52 7-52h-94q-38 0-38-38z" fill="white" stroke="#111827" stroke-width="6"/><text x="96" y="835" font-size="23" fill="#111827" font-family="Arial,Malgun Gothic" font-weight="800">같은 좌표에서 세 번 반복됐어. 우연이 아니야.</text><text x="96" y="875" font-size="20" fill="#334155" font-family="Arial,Microsoft YaHei">同一坐标重复三次。这不是偶然。</text><text x="96" y="916" font-size="19" fill="#475569" font-family="Arial">Three hits at the same coordinates. Not random.</text></g><rect x="50" y="1042" width="620" height="150" rx="12" fill="#111827" stroke="#64748b" stroke-width="4"/><text x="74" y="1082" font-size="17" fill="#cbd5e1" font-family="Arial,Malgun Gothic">상황 · 항로 전방에서 규칙적인 미확인 신호가 포착된다.</text><text x="74" y="1119" font-size="16" fill="#bfdbfe" font-family="Arial,Microsoft YaHei">旁白 · 航线前方出现规律重复的未知信号。</text><text x="74" y="1155" font-size="15" fill="#94a3b8" font-family="Arial">Narration · A repeating signal appears ahead of the fleet.</text><text x="660" y="1240" text-anchor="end" font-size="18" fill="#94a3b8" font-family="Arial">FTF-08 · 16/26</text></svg>