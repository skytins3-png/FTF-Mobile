<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ef8b58"/><stop offset=".38" stop-color="#f8c37b"/><stop offset="1" stop-color="#24536d"/></linearGradient></defs><rect width="1080" height="1920" fill="#071017"/><rect width="1080" height="1320" fill="url(#d)"/><circle cx="820" cy="280" r="120" fill="#ffe7a2"/><path d="M0 880 Q220 810 420 890 T1080 850 V1320 H0Z" fill="#2b607a"/><path d="M0 960 Q200 900 390 970 T780 950 T1080 980" fill="none" stroke="#d9f5ff" stroke-width="18" opacity=".75"/><g fill="#1d2c36" stroke="#111" stroke-width="7"><path d="M120 920 L330 850 L500 930 L450 1010 H165Z"/><rect x="250" y="780" width="90" height="110"/><path d="M540 880 L710 825 L885 900 L840 970 H580Z"/><rect x="675" y="750" width="80" height="105"/></g><g transform="translate(165 1010)"><circle cx="115" cy="86" r="66" fill="#e4b38d"/><path d="M55 90 Q67 25 117 25 Q170 25 180 99" fill="#24282d"/><path d="M42 185 Q115 140 188 185 L220 465 Q115 505 10 465Z" fill="#314c60"/><rect x="74" y="250" width="84" height="130" rx="8" fill="#e6a945"/><circle cx="500" cy="86" r="66" fill="#ddb08c"/><path d="M440 90 Q452 25 502 25 Q555 25 565 99" fill="#4a3831"/><path d="M427 185 Q500 140 573 185 L605 465 Q500 505 395 465Z" fill="#4a5361"/></g><path d="M58 45 H925 Q975 45 975 105 V300 Q975 355 915 355 H285 L190 425 L215 355 H118 Q58 355 58 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="98" y="118" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">1번 함선 출항. 전 함대, 대형을 유지하라!</text><text x="98" y="182" font-family="Arial" font-size="31">一号舰出航。全舰队保持队形！</text><text x="98" y="242" font-family="Arial" font-size="29">Ship One underway. All vessels, hold formation!</text><text x="690" y="790" font-family="Impact,Arial Black" font-size="86" fill="#ffd65c" stroke="#111" stroke-width="8">WOOOSH!</text><rect x="55" y="1470" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">일출과 함께 선두 함선이 항구를 빠져나가고 뒤이어 FTF 함대가 대형을 맞춘다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">日出时旗舰驶离港口，FTF舰队随后组成航行队形。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">At sunrise, the lead vessel clears the harbor and the FTF fleet forms up behind it.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-08 · FOR THE FUTURE — SET SAIL · SCENE 03 / 26</text></svg>