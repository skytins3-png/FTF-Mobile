<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#11131d"/><stop offset="1" stop-color="#28334a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#090a10"/><rect width="1080" height="1280" fill="url(#bg)"/><ellipse cx="540" cy="650" rx="380" ry="190" fill="#111824" stroke="#76879b" stroke-width="10"/><circle cx="540" cy="570" r="170" fill="#1f5e83" stroke="#7bd0ef" stroke-width="11"/><path d="M405 565 Q475 475 555 500 T675 560 Q620 630 555 615 T455 650 Q420 625 405 565Z" fill="#5d936a"/><g fill="#2e3949"><rect x="90" y="850" width="900" height="220" rx="30"/></g><g transform="translate(120 910)"><circle cx="80" cy="55" r="48" fill="#e8c09e"/><path d="M35 53 Q46 8 84 10 Q126 12 128 64 Q102 42 75 42 Q53 42 35 53" fill="#24252a"/><circle cx="250" cy="60" r="48" fill="#e7bf9f"/><path d="M205 58 Q216 12 254 14 Q296 16 298 68 Q272 46 245 46 Q223 46 205 58" fill="#3a302b"/><circle cx="420" cy="55" r="48" fill="#e7bf9f"/><path d="M375 53 Q386 10 424 12 Q466 14 468 64 Q442 42 415 42 Q393 42 375 53" fill="#25282e"/><circle cx="590" cy="60" r="48" fill="#e7bf9f"/><path d="M545 58 Q556 14 594 16 Q636 18 638 68 Q612 46 585 46 Q563 46 545 58" fill="#42332d"/><circle cx="760" cy="55" r="48" fill="#e7bf9f"/><path d="M715 53 Q726 10 764 12 Q806 14 808 64 Q782 42 755 42 Q733 42 715 53" fill="#23252a"/></g><g filter="url(#s)"><path d="M60 65 Q60 30 120 30 H760 Q830 30 830 100 V300 Q830 365 760 365 H220 L145 430 L165 365 H120 Q60 365 60 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="110" y="125" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">세 번째 회의는 선택이 아니라 결정을 위한 자리입니다.</text><text x="110" y="192" font-family="Arial" font-size="34">第三次会议不是讨论选择，而是作出决定。</text><text x="110" y="257" font-family="Arial" font-size="31">The third council is here to decide, not debate.</text></g><text x="720" y="760" font-family="Impact,Arial Black" font-size="88" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-4 720 760)">VOTE</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#111419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">지구미래 대책회의가 다시 열리고 각국 대표가 최종 결정을 준비한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">地球未来对策会议再次召开，各国代表准备最终决定。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">The Earth Future Council reconvenes for a final decision.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-07 · THIRD EARTH FUTURE COUNCIL · SCENE 01 / 26</text></svg>