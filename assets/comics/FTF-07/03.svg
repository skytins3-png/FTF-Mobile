<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><radialGradient id="e"><stop stop-color="#69b5d2"/><stop offset=".55" stop-color="#255b78"/><stop offset="1" stop-color="#0a1a29"/></radialGradient></defs><rect width="1080" height="1920" fill="#070b10"/><rect x="70" y="230" width="940" height="1080" rx="30" fill="#17222d" stroke="#738694" stroke-width="8"/><circle cx="540" cy="600" r="230" fill="url(#e)" stroke="#83d8f2" stroke-width="8"/><path d="M390 555 Q470 430 590 470 T720 590 Q610 700 495 660 T390 555Z" fill="#5e9a70"/><g stroke="#d6f3ff" stroke-width="4" fill="none" opacity=".8"><ellipse cx="540" cy="600" rx="165" ry="230"/><ellipse cx="540" cy="600" rx="230" ry="95"/></g><g transform="translate(130 900)"><circle cx="105" cy="72" r="55" fill="#e4b58f"/><path d="M52 76 Q64 20 108 20 Q155 20 165 84" fill="#27292c"/><path d="M42 145 Q105 112 168 145 L195 360 Q105 395 15 360Z" fill="#31475a"/><circle cx="360" cy="72" r="55" fill="#dbaa87"/><path d="M307 76 Q319 20 363 20 Q410 20 420 84" fill="#42332d"/><path d="M297 145 Q360 112 423 145 L450 360 Q360 395 270 360Z" fill="#53435b"/><circle cx="650" cy="72" r="55" fill="#e0b08d"/><path d="M597 76 Q609 20 653 20 Q700 20 710 84" fill="#2e3034"/><path d="M587 145 Q650 112 713 145 L740 360 Q650 395 560 360Z" fill="#3d5161"/></g><path d="M55 45 H930 Q980 45 980 105 V300 Q980 355 920 355 H290 L195 425 L220 355 H115 Q55 355 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="95" y="118" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">이제 질문은 하나입니다. 무엇을 지킬 것인가?</text><text x="95" y="182" font-family="Arial" font-size="31">现在只有一个问题：我们要守护什么？</text><text x="95" y="242" font-family="Arial" font-size="29">Only one question remains: what are we choosing to protect?</text><text x="760" y="820" font-family="Impact,Arial Black" font-size="76" fill="#ffd65c" stroke="#111" stroke-width="8">HUMM</text><rect x="55" y="1470" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">제3차 회의에서 지구 홀로그램을 앞에 두고 최종 우선순위를 결정하기 시작한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">第三次会议面对地球全息图，开始决定最终优先顺序。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">At the third council, leaders begin setting final priorities around a holographic Earth.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-07 · THIRD EARTH FUTURE COUNCIL · SCENE 03 / 26</text></svg>