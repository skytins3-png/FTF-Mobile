<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><radialGradient id="earth"><stop stop-color="#7fd4ff"/><stop offset=".65" stop-color="#2c7da5"/><stop offset="1" stop-color="#11344c"/></radialGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".55"/></filter></defs><rect width="1080" height="1920" fill="#080c11"/><rect x="65" y="360" width="950" height="800" rx="38" fill="#111923" stroke="#3d4f60" stroke-width="9"/><ellipse cx="540" cy="680" rx="260" ry="245" fill="url(#earth)" stroke="#8ee5ff" stroke-width="8"/><path d="M380 620 Q460 560 520 610 T700 590" fill="none" stroke="#b4f0c8" stroke-width="24"/><path d="M410 760 Q520 700 655 770" fill="none" stroke="#b4f0c8" stroke-width="20"/><g fill="#1e2a36"><rect x="110" y="860" width="250" height="170" rx="20"/><rect x="720" y="860" width="250" height="170" rx="20"/></g><text x="148" y="925" font-family="Arial" font-size="28" fill="#9ee9ff">PRIORITY A</text><text x="148" y="975" font-family="Arial" font-size="24" fill="#fff">WATER / FOOD / SHELTER</text><text x="755" y="925" font-family="Arial" font-size="28" fill="#9ee9ff">PRIORITY B</text><text x="755" y="975" font-family="Arial" font-size="24" fill="#fff">ENERGY / COMMS</text><g transform="translate(155 910)"><circle cx="150" cy="95" r="62" fill="#dfaa84"/><path d="M90 99 Q104 30 155 31 Q211 33 218 108 Q184 74 150 76 Q119 76 90 99" fill="#22252a"/><path d="M75 192 Q150 146 230 192 L252 430 Q150 475 48 430Z" fill="#354b62"/><circle cx="575" cy="95" r="62" fill="#d8a17b"/><path d="M514 99 Q528 30 578 31 Q633 33 642 108 Q608 73 575 75 Q545 76 514 99" fill="#493831"/><path d="M500 192 Q575 146 652 192 L678 430 Q575 475 470 430Z" fill="#68465a"/></g><g filter="url(#sh)"><path d="M55 45 Q55 20 115 20 H875 Q935 20 935 95 V315 Q935 377 862 377 H690 L625 442 L633 377 H115 Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">도시를 지키는 게 목표가 아닙니다. 사람이 살아남는 구조를 지켜야 합니다.</text><text x="92" y="182" font-family="Arial" font-size="31">目标不是守住城市，而是守住让人类生存的系统。</text><text x="92" y="245" font-family="Arial" font-size="29">Our goal isn't to save cities. It's to preserve the systems that keep people alive.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#8ee5ff" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#8ee5ff">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">제3차 회의에서 식수·식량·대피소를 최우선으로 두는 생존 우선순위가 확정된다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">第三次会议确定以饮水、粮食和避难所为最高优先级。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">The third council locks in water, food and shelter as the highest survival priorities.</text></g><text x="745" y="740" font-family="Impact,Arial Black" font-size="82" fill="#95e8ff" stroke="#111" stroke-width="8" transform="rotate(-6 745 740)">LOCKED</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-07 · THIRD EARTH FUTURE COUNCIL · SCENE 04 / 26</text></svg>