<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#263746"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#06090d"/><rect width="1080" height="1280" fill="url(#bg)"/><ellipse cx="540" cy="620" rx="330" ry="220" fill="#12364b" stroke="#62a7c7" stroke-width="10"/><path d="M350 620 Q445 505 555 555 T740 620 Q680 700 595 685 T445 735 Q375 710 350 620Z" fill="#4f8768"/><g fill="#2c4152" stroke="#95a8b7" stroke-width="6"><rect x="120" y="900" width="180" height="120" rx="14"/><rect x="330" y="900" width="180" height="120" rx="14"/><rect x="570" y="900" width="180" height="120" rx="14"/><rect x="780" y="900" width="180" height="120" rx="14"/></g><g transform="translate(145 1030)"><circle cx="80" cy="55" r="42" fill="#e8bf9d"/><path d="M40 55 Q50 15 84 16 Q120 18 124 65 Q100 45 78 45 Q58 45 40 55" fill="#27282d"/><path d="M38 110 Q80 86 122 110 L144 265 Q80 292 16 265Z" fill="#314a5f"/><circle cx="300" cy="55" r="42" fill="#e4b994"/><path d="M260 55 Q270 15 304 16 Q340 18 344 65 Q320 45 298 45 Q278 45 260 55" fill="#493832"/><path d="M258 110 Q300 86 342 110 L364 265 Q300 292 236 265Z" fill="#526071"/><circle cx="540" cy="55" r="42" fill="#e7bd99"/><path d="M500 55 Q510 15 544 16 Q580 18 584 65 Q560 45 538 45 Q518 45 500 55" fill="#25262b"/><path d="M498 110 Q540 86 582 110 L604 265 Q540 292 476 265Z" fill="#3f4f63"/></g><g filter="url(#s)"><path d="M55 55 Q55 25 115 25 H810 Q870 25 870 95 V300 Q870 365 790 365 H260 L170 435 L195 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">이제 국경별 대응이 아니라 하나의 지구 계획으로 움직여야 합니다.</text><text x="105" y="192" font-family="Arial" font-size="33">现在不能各自应对，必须以一个地球计划共同行动。</text><text x="105" y="257" font-family="Arial" font-size="30">No more isolated responses. We move under one Earth plan.</text></g><text x="700" y="760" font-family="Impact,Arial Black" font-size="82" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 700 760)">VOTE</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">제3차 지구미래 대책회의에서 대표들이 국가별 계획을 하나의 공동 생존 체계로 묶기 시작한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">第三次地球未来会议开始把各国方案合并为共同生存体系。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">The third council begins merging national plans into a single shared survival system.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-07 · THIRD EARTH FUTURE COUNCIL · SCENE 02 / 26</text></svg>