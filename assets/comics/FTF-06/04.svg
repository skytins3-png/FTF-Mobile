ze="36" font-weight="800">0714의 반응 시간이 또 빨라졌어. 기록을 분리 보관해.</text><text x="92" y="182" font-family="Arial" font-size="31">0714的反应时间又变快了。把记录单独保存。</text><text x="92" y="245" font-family="Arial" font-size="29">0714's response time just improved again. Isolate the record.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#ff7070" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ff7070">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">심야 관찰실. PROJECT 0714의 생체 반응 그래프가 예상치를 넘어 연구진을 긴장시킨다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">深夜观察室里，PROJECT 0714的生理反应超过预测值。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">In the late-night observation room, PROJECT 0714's biometric response exceeds the forecast.</text></g><text x="735" y="720" font-family="Impact,Arial Black" font-size="82" fill="#ff7d7d" stroke="#111" stroke-width="8" transform="rotate(-6 735 720)">BEEP-BEEP!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-06 · PROJECT 0714 · SCENE 04 / 26</text></svg>