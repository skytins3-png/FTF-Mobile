t-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">비밀 관찰실에서 두 연구원이 PROJECT 0714의 예상 밖 행동 변화를 포착한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">秘密观察室里，两名研究员捕捉到0714计划对象的异常变化。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">Two researchers detect an unexpected behavioral shift in Project 0714.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-06 · PROJECT 0714 · SCENE 03 / 26</text></svg>