ze="38" font-weight="800">0714 대상이 이동을 시작했습니다. 기록만 하고 접촉은 금지합니다.</text><text x="105" y="192" font-family="Arial" font-size="33">0714目标开始移动。只记录，禁止接触。</text><text x="105" y="257" font-family="Arial" font-size="30">Target 0714 is moving. Record only. No contact.</text></g><text x="720" y="760" font-family="Impact,Arial Black" font-size="84" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 720 760)">REC</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">비밀 관찰실의 여섯 화면에 대상의 이동 경로가 잡히고 요원들은 개입 없이 기록을 이어간다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">秘密观察室六块屏幕捕捉到目标路线，人员继续无接触记录。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">Six surveillance feeds track the target while the team keeps a strict no-contact watch.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-06 · PROJECT 0714 · SCENE 02 / 26</text></svg>