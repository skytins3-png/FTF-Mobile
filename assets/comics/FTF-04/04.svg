<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#16243a"/><stop offset=".6" stop-color="#d47b55"/><stop offset="1" stop-color="#302b34"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#090d12"/><rect width="1080" height="1290" fill="url(#dawn)"/><path d="M0 720 L210 560 L360 680 L555 505 L760 695 L900 590 L1080 730 V1290 H0Z" fill="#1b2733"/><rect x="80" y="760" width="920" height="430" rx="35" fill="#202833" stroke="#536271" stroke-width="8"/><g fill="#313d49"><rect x="145" y="825" width="240" height="230"/><rect x="420" y="825" width="240" height="230"/><rect x="695" y="825" width="240" height="230"/></g><g transform="translate(180 890)"><circle cx="150" cy="95" r="62" fill="#e0ac86"/><path d="M92 98 Q102 30 155 31 Q211 33 218 108 Q185 74 150 76 Q120 76 92 98" fill="#20232a"/><path d="M72 190 Q150 145 228 190 L252 430 Q150 470 48 430Z" fill="#2c4056"/><path d="M105 245 L8 330" stroke="#e0ac86" stroke-width="26" stroke-linecap="round"/><circle cx="560" cy="96" r="62" fill="#d9a27d"/><path d="M500 100 Q515 32 565 33 Q620 35 628 110 Q592 75 560 77 Q528 78 500 100" fill="#4a3832"/><path d="M485 190 Q560 145 638 190 L665 430 Q560 470 455 430Z" fill="#684859"/><path d="M520 245 L420 190" stroke="#d9a27d" stroke-width="26" stroke-linecap="round"/></g><g filter="url(#sh)"><path d="M55 45 Q55 20 115 20 H875 Q935 20 935 95 V315 Q935 377 862 377 H690 L625 442 L633 377 H115 Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">5년 동안 버티는 법이 아니라, 5년 뒤 지킬 사람을 만드는 거야.</text><text x="92" y="182" font-family="Arial" font-size="31">不是学会撑过五年，而是成为五年后能守护别人的人。</text><text x="92" y="245" font-family="Arial" font-size="29">This isn't about surviving five years. It's about becoming someone who can protect others.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#ffb16f" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffb16f">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">새벽 산악 훈련소에서 두 청년이 구조·통신·생존 훈련 첫 주를 마친다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">清晨的山地训练基地，两名青年完成第一周救援、通信与生存训练。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">At the mountain training base, two young recruits finish their first week of rescue, comms and survival drills.</text></g><text x="745" y="710" font-family="Impact,Arial Black" font-size="84" fill="#ffd37c" stroke="#111" stroke-width="9" transform="rotate(-7 745 710)">THUMP!</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-04 · FIVE-YEAR PLAN · SCENE 04 / 26</text></svg>