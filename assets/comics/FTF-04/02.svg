<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151728"/><stop offset="1" stop-color="#34324a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#0a0b11"/><rect width="1080" height="1280" fill="url(#bg)"/><rect x="130" y="330" width="820" height="520" rx="28" fill="#161d2a" stroke="#6f6c91" stroke-width="10"/><g stroke="#9aa6ff" fill="none" stroke-width="7"><line x1="220" y1="500" x2="850" y2="500"/><line x1="220" y1="610" x2="850" y2="610"/><line x1="220" y1="720" x2="850" y2="720"/></g><g fill="#7d8cff"><rect x="260" y="455" width="115" height="90" rx="12"/><rect x="445" y="565" width="150" height="90" rx="12"/><rect x="650" y="675" width="145" height="90" rx="12"/></g><g transform="translate(125 900)"><circle cx="110" cy="70" r="56" fill="#e8bd99"/><path d="M55 72 Q68 18 115 20 Q165 23 170 87 Q140 60 110 60 Q84 60 55 72" fill="#25252b"/><path d="M52 148 Q110 112 168 148 L202 370 Q110 408 18 370Z" fill="#303d5a"/><path d="M195 210 Q300 170 390 135" fill="none" stroke="#e8bd99" stroke-width="30" stroke-linecap="round"/><circle cx="415" cy="126" r="24" fill="#e8bd99"/><circle cx="620" cy="76" r="55" fill="#e5b994"/><path d="M568 74 Q580 20 625 22 Q670 24 675 85 Q646 60 616 60 Q592 60 568 74" fill="#4b3932"/><path d="M565 150 Q620 115 675 150 L705 365 Q620 400 535 365Z" fill="#4f536c"/></g><g filter="url(#s)"><path d="M55 55 Q55 25 115 25 H800 Q860 25 860 95 V300 Q860 365 785 365 H255 L165 432 L190 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">5년 안에 끝내야 합니다. 연구, 훈련, 이동 계획을 동시에 시작하죠.</text><text x="105" y="192" font-family="Arial" font-size="33">必须在五年内完成。研究、训练和转移计划同时启动。</text><text x="105" y="257" font-family="Arial" font-size="30">We have five years. Research, training and relocation begin together.</text></g><text x="705" y="760" font-family="Impact,Arial Black" font-size="84" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 705 760)">CLICK</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">제2차 회의에서 5년 계획의 세 축이 화면에 공개되고 책임자들이 일정을 확정한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">第二次会议公布五年计划三大轴线，各负责人确认时间表。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">At the second council, leaders lock the five-year research, training and relocation timeline.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-04 · FIVE-YEAR PLAN · SCENE 02 / 26</text></svg>