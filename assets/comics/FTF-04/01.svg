<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10131d"/><stop offset="1" stop-color="#30384b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".5"/></filter></defs><rect width="1080" height="1920" fill="#080a10"/><rect width="1080" height="1280" fill="url(#bg)"/><rect x="80" y="290" width="920" height="620" rx="28" fill="#101924" stroke="#6f7f96" stroke-width="10"/><rect x="125" y="340" width="830" height="380" rx="16" fill="#0b1118"/><polyline points="170,650 260,590 350,615 450,500 560,535 675,425 785,455 900,365" fill="none" stroke="#6fd8a6" stroke-width="12"/><g fill="#e8edf2" font-family="Arial"><text x="160" y="780" font-size="38">YEAR 1</text><text x="360" y="780" font-size="38">YEAR 3</text><text x="575" y="780" font-size="38">YEAR 5</text></g><g transform="translate(150 830)"><circle cx="130" cy="95" r="62" fill="#e9c19f"/><path d="M70 92 Q82 26 135 30 Q190 33 193 105 Q157 74 125 74 Q95 74 70 92" fill="#272a30"/><path d="M65 180 Q130 140 195 180 L230 420 Q130 465 28 420Z" fill="#31445d"/><circle cx="430" cy="110" r="60" fill="#e8c09f"/><path d="M374 108 Q385 45 435 47 Q488 49 490 118 Q455 88 425 88 Q397 88 374 108" fill="#3c2f2c"/><path d="M370 190 Q430 154 490 190 L520 420 Q430 455 340 420Z" fill="#4a5b6f"/><circle cx="710" cy="100" r="58" fill="#e7bf9e"/><path d="M655 98 Q668 38 715 40 Q765 42 768 110 Q735 82 705 82 Q679 82 655 98" fill="#24262c"/><path d="M650 180 Q710 145 770 180 L800 420 Q710 458 620 420Z" fill="#283b50"/></g><g filter="url(#s)"><path d="M55 60 Q55 25 115 25 H760 Q830 25 830 95 V290 Q830 355 760 355 H230 L150 420 L168 355 H115 Q55 355 55 290Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="120" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">우리는 5년 안에 준비를 끝내야 합니다.</text><text x="105" y="187" font-family="Arial" font-size="34">我们必须在五年内完成准备。</text><text x="105" y="252" font-family="Arial" font-size="31">We must be ready within five years.</text></g><text x="690" y="990" font-family="Impact,Arial Black" font-size="88" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-5 690 990)">PLAN</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">제2차 회의에서 생존 시설과 인력 양성을 위한 5년 계획이 공개된다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">第二次会议公布了生存设施与人才培养的五年计划。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">The second council unveils a five-year survival preparation plan.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-04 · FIVE-YEAR PLAN · SCENE 01 / 26</text></svg>