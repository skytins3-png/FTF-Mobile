<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f7d8c"/><stop offset="1" stop-color="#182b34"/></linearGradient></defs><rect width="1080" height="1920" fill="#0b1116"/><rect width="1080" height="1320" fill="url(#g)"/><rect x="80" y="500" width="920" height="580" rx="24" fill="#263943" stroke="#8da9b6" stroke-width="8"/><g fill="#162229"><rect x="120" y="560" width="250" height="430"/><rect x="415" y="560" width="250" height="430"/><rect x="710" y="560" width="250" height="430"/></g><g fill="#9ec4d2"><rect x="150" y="600" width="190" height="100"/><rect x="445" y="600" width="190" height="100"/><rect x="740" y="600" width="190" height="100"/></g><g transform="translate(170 880)"><circle cx="110" cy="80" r="60" fill="#e4b28d"/><path d="M52 84 Q64 22 112 22 Q162 22 172 92" fill="#252a2f"/><path d="M40 165 Q110 125 180 165 L210 420 Q110 460 10 420Z" fill="#314d5f"/><circle cx="500" cy="80" r="60" fill="#dfad88"/><path d="M442 84 Q454 22 502 22 Q552 22 562 92" fill="#4b3530"/><path d="M430 165 Q500 125 570 165 L600 420 Q500 460 400 420Z" fill="#513f52"/><path d="M188 245 L420 245" stroke="#e4b28d" stroke-width="28" stroke-linecap="round"/></g><path d="M60 45 H925 Q975 45 975 105 V300 Q975 355 915 355 H290 L195 425 L220 355 H120 Q60 355 60 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="100" y="118" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">오늘부터 5년 동안, 생존과 판단을 함께 훈련한다.</text><text x="100" y="182" font-family="Arial" font-size="31">从今天开始，用五年训练生存与判断。</text><text x="100" y="242" font-family="Arial" font-size="29">For five years, we train survival and judgment together.</text><text x="735" y="790" font-family="Impact,Arial Black" font-size="78" fill="#ffd65c" stroke="#111" stroke-width="8">CLACK!</text><rect x="55" y="1470" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">선발된 청소년들이 비밀 시설에서 체력·재난 대응·의사결정 훈련을 시작한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">被选中的少年在秘密设施开始体能、灾害应对和决策训练。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">Selected youths begin physical, disaster-response and decision training.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-04 · FIVE-YEAR PLAN · SCENE 03 / 26</text></svg>