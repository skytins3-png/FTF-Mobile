<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="eve" x2="0" y2="1"><stop stop-color="#25364f"/><stop offset=".58" stop-color="#ef9d75"/><stop offset="1" stop-color="#3a3445"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".48"/></filter></defs><rect width="1080" height="1920" fill="#090d12"/><rect width="1080" height="1290" fill="url(#eve)"/><circle cx="820" cy="310" r="90" fill="#ffd79a" opacity=".9"/><path d="M0 760 Q190 700 390 760 T790 745 T1080 780 V1290 H0Z" fill="#2c3a46"/><path d="M0 980 H1080 V1290 H0Z" fill="#22282f"/><path d="M0 1070 H1080" stroke="#f1d66a" stroke-width="16" stroke-dasharray="80 45"/><g transform="translate(150 780)"><circle cx="190" cy="130" r="70" fill="#e0ad87"/><path d="M126 136 Q138 55 198 57 Q258 60 265 143 Q228 106 190 108 Q154 109 126 136" fill="#20232a"/><path d="M105 245 Q190 192 275 245 L305 560 Q192 610 78 560Z" fill="#38506a"/><path d="M242 320 L390 275" stroke="#e0ad87" stroke-width="28" stroke-linecap="round"/><circle cx="560" cy="132" r="68" fill="#dca47e"/><path d="M498 136 Q510 58 565 59 Q623 61 630 142 Q595 106 559 108 Q526 109 498 136" fill="#543c36"/><path d="M485 245 Q560 195 638 245 L668 560 Q558 610 455 560Z" fill="#6d4759"/><path d="M515 322 L405 270" stroke="#dca47e" stroke-width="26" stroke-linecap="round"/><rect x="352" y="225" width="78" height="120" rx="8" fill="#f2f2ea" stroke="#222" stroke-width="6"/><path d="M365 250 Q391 230 417 250" fill="none" stroke="#d06f8d" stroke-width="8"/></g><g filter="url(#sh)"><path d="M55 45 Q55 20 115 20 H875 Q935 20 935 95 V315 Q935 377 862 377 H690 L625 442 L633 377 H115 Q55 377 55 315Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="92" y="115" font-family="Arial,'Malgun Gothic'" font-size="36" font-weight="800">훈련 끝나면… 이 길도 그냥 같이 걷고 싶어.</text><text x="92" y="182" font-family="Arial" font-size="31">等训练结束以后……我也想这样和你一起走。</text><text x="92" y="245" font-family="Arial" font-size="29">When training is over… I just want to walk roads like this with you.</text></g><g filter="url(#sh)"><rect x="55" y="1470" width="970" height="300" rx="22" fill="#10161e" stroke="#ffb4c8" stroke-width="7"/><text x="90" y="1544" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffb4c8">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">강도 높은 훈련을 마친 저녁, 두 사람은 말없이 귀가길을 나란히 걷는다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">高强度训练后的傍晚，两个人并肩走在回宿舍的路上。</text><text x="90" y="1734" font-family="Arial" font-size="28" fill="#b9c9d0">After a hard training day, the two walk back side by side in the quiet evening.</text></g><text x="742" y="725" font-family="Impact,Arial Black" font-size="82" fill="#ffd1df" stroke="#111" stroke-width="8" transform="rotate(-6 742 725)">STEP…</text><text x="55" y="1872" font-family="Arial" font-size="25" fill="#96a9b5">FTF-05 · YOUTH &amp; FIRST LOVE · SCENE 04 / 26</text></svg>