<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7db9d8"/><stop offset=".75" stop-color="#f2c18d"/><stop offset="1" stop-color="#d47d70"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#151018"/><rect width="1080" height="1280" fill="url(#sky)"/><rect x="80" y="560" width="920" height="540" rx="28" fill="#e9e0d5" stroke="#664f49" stroke-width="10"/><g fill="#9fc6dd" stroke="#5f7785" stroke-width="6"><rect x="140" y="620" width="230" height="220"/><rect x="425" y="620" width="230" height="220"/><rect x="710" y="620" width="230" height="220"/></g><path d="M80 1030 H1000" stroke="#8b6458" stroke-width="18"/><g transform="translate(185 850)"><circle cx="110" cy="70" r="56" fill="#e8bc98"/><path d="M55 73 Q66 18 115 20 Q164 23 170 87 Q139 60 110 60 Q84 60 55 73" fill="#24252a"/><path d="M52 148 Q110 112 168 148 L195 365 Q110 400 25 365Z" fill="#e7edf1" stroke="#3d4b59" stroke-width="8"/><path d="M75 165 L145 165 L155 355 L65 355Z" fill="#506b88"/><circle cx="500" cy="74" r="55" fill="#e6b995"/><path d="M447 73 Q460 18 505 20 Q551 22 558 87 Q528 60 498 60 Q474 60 447 73" fill="#45332e"/><path d="M445 150 Q500 115 555 150 L585 365 Q500 400 415 365Z" fill="#f2e7e8" stroke="#79535a" stroke-width="8"/><path d="M465 164 L535 164 L550 355 L452 355Z" fill="#8e5e72"/></g><path d="M330 1115 Q540 1030 760 1115" fill="none" stroke="#d69884" stroke-width="12" opacity=".7"/><g filter="url(#s)"><path d="M55 55 Q55 25 115 25 H780 Q840 25 840 95 V300 Q840 365 765 365 H255 L165 430 L190 365 H115 Q55 365 55 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="105" y="125" font-family="Arial,'Malgun Gothic'" font-size="38" font-weight="800">오늘도 같은 시간에 왔네. 같이 걸어갈래?</text><text x="105" y="192" font-family="Arial" font-size="33">你今天也这个时间来啊。一起走吗？</text><text x="105" y="257" font-family="Arial" font-size="30">You came at the same time again. Want to walk together?</text></g><text x="735" y="735" font-family="Impact,Arial Black" font-size="82" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-6 735 735)">DING</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">수업이 끝난 복도에서 두 학생이 우연처럼 다시 마주치고 처음으로 함께 걷기로 한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">放学后的走廊里，两人再次“偶然”相遇，第一次决定一起走。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">After class, the two meet again and decide to walk home together for the first time.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-05 · YOUTH &amp; FIRST LOVE · SCENE 02 / 26</text></svg>