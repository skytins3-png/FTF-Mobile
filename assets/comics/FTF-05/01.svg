<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ec5dd"/><stop offset="1" stop-color="#f3d2a4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".45"/></filter></defs><rect width="1080" height="1920" fill="#101014"/><rect width="1080" height="1280" fill="url(#sky)"/><rect x="0" y="630" width="1080" height="650" fill="#b9c4aa"/><rect x="90" y="380" width="900" height="520" rx="26" fill="#d9d1c2" stroke="#6f706e" stroke-width="10"/><g fill="#7896aa"><rect x="150" y="450" width="150" height="100"/><rect x="355" y="450" width="150" height="100"/><rect x="575" y="450" width="150" height="100"/><rect x="780" y="450" width="150" height="100"/></g><path d="M0 980 Q230 900 460 980 T1080 980 V1280 H0Z" fill="#6e8d63"/><g transform="translate(185 830)"><circle cx="150" cy="105" r="66" fill="#eac3a0"/><path d="M85 102 Q100 26 155 30 Q215 34 218 116 Q178 80 143 80 Q110 80 85 102" fill="#25262a"/><path d="M78 195 Q150 150 222 195 L258 460 Q150 500 42 460Z" fill="#314f7b"/><path d="M85 460 L120 725 H165 L155 478Z" fill="#2b2f36"/><path d="M220 460 L185 725 H145 L155 478Z" fill="#2b2f36"/><circle cx="490" cy="110" r="64" fill="#e7bea0"/><path d="M430 108 Q443 42 495 44 Q548 46 552 120 Q517 87 485 87 Q455 87 430 108" fill="#3a302e"/><path d="M425 200 Q490 160 555 200 L590 458 Q490 500 390 458Z" fill="#8b4f67"/><path d="M430 458 L465 720 H510 L500 475Z" fill="#2c3037"/><path d="M552 458 L530 720 H490 L500 475Z" fill="#2c3037"/><path d="M245 300 Q345 285 410 310" fill="none" stroke="#e8c09f" stroke-width="28" stroke-linecap="round"/></g><g filter="url(#s)"><path d="M70 65 Q70 30 130 30 H760 Q830 30 830 100 V290 Q830 350 760 350 H225 L145 415 L165 350 H130 Q70 350 70 290Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="120" y="125" font-family="Arial,'Malgun Gothic'" font-size="39" font-weight="800">오늘도 같이 걸어갈래?</text><text x="120" y="190" font-family="Arial" font-size="34">今天也一起走吗？</text><text x="120" y="255" font-family="Arial" font-size="31">Want to walk together again today?</text></g><text x="690" y="760" font-family="Impact,Arial Black" font-size="86" fill="#ffd65c" stroke="#111" stroke-width="9" transform="rotate(-4 690 760)">STEP</text><g filter="url(#s)"><rect x="55" y="1500" width="970" height="285" rx="20" fill="#151419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1570" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1635" font-family="Arial,'Malgun Gothic'" font-size="34" fill="#fff">훈련과 공부 사이, 두 청춘은 평범한 하굣길에서 서로를 의식한다.</text><text x="90" y="1695" font-family="Arial" font-size="31" fill="#d8e4e9">训练与学习之间，两名年轻人在放学路上开始在意彼此。</text><text x="90" y="1753" font-family="Arial" font-size="29" fill="#b9c9d0">Between training and study, two young people notice each other.</text></g><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-05 · YOUTH &amp; FIRST LOVE · SCENE 01 / 26</text></svg>