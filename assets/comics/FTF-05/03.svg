<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fb6cf"/><stop offset=".55" stop-color="#f0b48b"/><stop offset="1" stop-color="#5a5967"/></linearGradient></defs><rect width="1080" height="1920" fill="#0c0d12"/><rect width="1080" height="1320" fill="url(#s)"/><path d="M0 840 Q210 760 390 835 T760 815 T1080 850 V1320 H0Z" fill="#2f5c58"/><g fill="#384d58"><rect x="80" y="530" width="260" height="350" rx="12"/><rect x="390" y="500" width="300" height="380" rx="12"/><rect x="735" y="560" width="270" height="320" rx="12"/></g><g fill="#e9f3f8"><rect x="120" y="580" width="80" height="95"/><rect x="220" y="580" width="80" height="95"/><rect x="440" y="555" width="90" height="100"/><rect x="550" y="555" width="90" height="100"/></g><g transform="translate(180 900)"><circle cx="120" cy="88" r="68" fill="#e5b48f"/><path d="M58 92 Q70 24 123 24 Q178 24 187 102 Q150 67 117 70 Q88 70 58 92" fill="#20252a"/><path d="M42 185 Q120 140 198 185 L230 470 Q120 515 10 470Z" fill="#344d61"/><circle cx="510" cy="90" r="66" fill="#e1af89"/><path d="M450 92 Q462 26 512 26 Q565 26 574 100 Q540 69 506 70 Q478 70 450 92" fill="#49352f"/><path d="M435 185 Q510 142 585 185 L620 470 Q510 512 400 470Z" fill="#684d63"/><path d="M205 285 Q335 230 430 285" stroke="#e5b48f" stroke-width="25" fill="none" stroke-linecap="round"/></g><path d="M60 45 H920 Q970 45 970 105 V300 Q970 355 910 355 H285 L192 425 L216 355 H120 Q60 355 60 300Z" fill="#fff" stroke="#111" stroke-width="8"/><text x="100" y="118" font-family="Arial,'Malgun Gothic'" font-size="37" font-weight="800">훈련 끝나면… 바다 보러 같이 갈래?</text><text x="100" y="182" font-family="Arial" font-size="31">训练结束后……要不要一起去看海？</text><text x="100" y="242" font-family="Arial" font-size="29">After training… want to go see the sea together?</text><text x="750" y="800" font-family="Impact,Arial Black" font-size="76" fill="#ffd65c" stroke="#111" stroke-width="8">THUMP</text><rect x="55" y="1470" width="970" height="300" rx="20" fill="#101419" stroke="#ffd65c" stroke-width="7"/><text x="90" y="1542" font-family="Arial,'Malgun Gothic'" font-size="30" font-weight="800" fill="#ffd65c">SITUATION / 상황 설명 / 情况说明</text><text x="90" y="1610" font-family="Arial,'Malgun Gothic'" font-size="33" fill="#fff">긴 훈련 사이의 짧은 저녁, 두 대원은 평범한 미래와 약속을 이야기한다.</text><text x="90" y="1672" font-family="Arial" font-size="30" fill="#d8e4e9">漫长训练间隙的傍晚，两名队员谈起平凡的未来与约定。</text><text x="90" y="1732" font-family="Arial" font-size="28" fill="#b9c9d0">Between long drills, two trainees talk about an ordinary future and a promise.</text><text x="55" y="1870" font-family="Arial" font-size="25" fill="#96a9b5">FTF-05 · YOUTH &amp; FIRST LOVE · SCENE 03 / 26</text></svg>