<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1115"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>FTF 영화 프로젝트 곡 관리</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#202530;--text:#f4f6f8;--muted:#9aa4b2;--line:#303744;--accent:#5ea3ff;--danger:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif}body{padding-bottom:190px}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.wrap{padding:12px;max-width:1080px;margin:auto}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
button{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#08111c;font-weight:800;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#3b2023;color:#ffb3b3;border:1px solid #6b2e34}button.small{padding:7px 9px;font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid .full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin:2px 0 5px}.install-note{font-size:12px;color:var(--muted);line-height:1.5}
.movie-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0 6px;border-bottom:1px solid var(--line)}.movie-title{font-size:15px;font-weight:800}.movie-count{font-size:11px;color:#b9d7ff;background:#253243;padding:4px 8px;border-radius:999px}.song{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.num{font-weight:900;color:var(--accent);font-size:17px;padding-top:2px}.title{font-weight:800;font-size:15px;line-height:1.3}.meta{color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}.actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.empty{color:var(--muted);padding:14px 2px}
.player{position:fixed;left:0;right:0;bottom:73px;z-index:30;background:rgba(23,26,33,.98);border-top:1px solid var(--line);padding:10px 12px}.player-inner{max-width:1080px;margin:auto}.now{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.transport{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}.transport button{font-size:20px;padding:9px}.seekrow{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}input[type=range]{padding:0;height:28px;border:0;background:transparent}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(15,17,21,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(min-width:780px){.main{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}}
</style>
</head>
<body>
<header><h1>FTF 영화 프로젝트 곡 관리</h1><div class="sub">파일 전체 선택 → 자동 정렬 → 바로 재생</div></header>
<div class="wrap">
 <div class="toolbar"><input id="search" placeholder="영화 제목, 곡 제목, 장면 검색"/><button id="installBtn" class="secondary" hidden>앱 설치</button></div>
 <section class="card">
  <h2>파일 전체 선택 · 자동 순서 저장</h2>
  <div class="formgrid"><div class="full"><label>영화 제목</label><input id="bulkMovieTitle" value="FOR THE FUTURE"/></div><div class="full"><button id="bulkPickBtn">파일 전체 선택</button><input id="bulkFiles" type="file" multiple accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" hidden></div></div>
  <p class="install-note">선택한 음악 파일들이 이 영화의 목록이 됩니다. 번호가 있으면 번호순, 없으면 제목순으로 정렬하며 모든 곡에 ▶ 재생 버튼이 생깁니다.</p>
 </section>
 <div class="main">
  <section class="card"><h2>영화별 곡 목록 <span id="total"></span></h2><div id="list"></div></section>
  <aside class="card"><h2 id="formTitle">곡 추가 / 수정</h2><div class="formgrid">
   <div class="full"><label>영화 제목</label><input id="movieTitle"/></div><div class="full"><label>곡 제목</label><input id="songTitle"/></div>
   <div><label>언어</label><select id="language"><option>English</option><option>한국어</option><option>중국어</option><option>기타</option></select></div>
   <div><label>상태</label><select id="songStatus"><option>제작 중</option><option>가사 완성</option><option>스타일 완성</option><option>완성</option><option>보류</option></select></div>
   <div class="full"><label>장면 / 에피소드</label><input id="scene"/></div><div class="full"><label>메모</label><textarea id="notes" rows="4"></textarea></div>
   <div class="full" style="display:flex;gap:8px"><button id="saveBtn" style="flex:1">저장</button><button id="clearBtn" class="secondary" style="flex:1">새로 입력</button></div>
  </div></aside>
 </div>
</div>
<div class="player" id="playerBar">
 <div class="player-inner"><div class="now" id="nowPlaying">재생할 곡을 선택하세요</div>
 <div class="transport"><button id="prevBtn" class="secondary">⏮</button><button id="playPauseBtn">▶ 재생</button><button id="nextBtn" class="secondary">⏭</button></div>
 <div class="seekrow"><span id="curTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"/><span id="durTime">0:00</span></div></div>
</div>
<div class="bottom"><button id="addBtn">+ 새 곡</button><button id="exportBtn" class="secondary">백업</button><button id="importBtn" class="secondary">불러오기</button><input id="importFile" type="file" accept=".json" hidden></div>
<script>
const KEY='ftf_mobile_pwa_v3';
const DB_NAME='ftf_audio_db_v2', DB_STORE='files';
let editId=null,deferredPrompt=null,currentAudio=null,currentUrl=null,currentId=null;
const starter=[
 {movie:'FOR THE FUTURE',title:"Earth's Warning",language:'English',status:'가사 완성',scene:'지구 이상징후 뉴스',notes:'기후변화, 엘니뇨, 빙하, 탄소배출, 오존층, 화산'},
 {movie:'FOR THE FUTURE',title:'September 13 — Typhoon Arka',language:'English',status:'스타일 완성',scene:'9월 13일 초강력 태풍·대홍수',notes:'사이렌, 폭우, 강풍, 천둥·번개, 범람, 구조'},
 {movie:'FOR THE FUTURE',title:'Earth Survival Plan',language:'English',status:'가사 완성',scene:'제1차 지구 생존 대책 회의',notes:'각국 과학자, 공동기금, 기술 공유'},
 {movie:'FOR THE FUTURE',title:'PROJECT 0714',language:'English',status:'스타일 완성',scene:'청춘·비밀 관찰',notes:'청춘 일상, 첫사랑, 비밀 관찰'},
 {movie:'FOR THE FUTURE',title:'Third Earth Future Council',language:'English',status:'제작 중',scene:'제3차 지구미래 대책 회의',notes:'인간 존엄 vs 의학적 신체 강화'}
];
function normMovie(v){return (v||'').trim()||'미지정 영화'}
function load(){const raw=localStorage.getItem(KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}const a=starter.map((x,i)=>({...x,id:crypto.randomUUID(),order:i+1,created:Date.now()+i}));localStorage.setItem(KEY,JSON.stringify(a));return a}
let songs=load();
function save(){localStorage.setItem(KEY,JSON.stringify(songs));render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function groups(){const m=new Map();songs.forEach(s=>{s.movie=normMovie(s.movie);if(!m.has(s.movie))m.set(s.movie,[]);m.get(s.movie).push(s)});[...m.values()].forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0)||(x.created||0)-(y.created||0)));return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'))}
function sameMovieSorted(movie){return songs.filter(s=>normMovie(s.movie)===movie).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}
function normalizeOrders(movie){sameMovieSorted(movie).forEach((s,i)=>s.order=i+1)}
function titleFor(i,s){return `FTF-${String(i+1).padStart(2,'0')} ${s.title}`}
function render(){const q=search.value.trim().toLowerCase();total.textContent=`· ${songs.length}곡`;let h='';for(const [movie,arr] of groups()){const filtered=arr.filter(s=>[movie,s.title,s.scene,s.notes,s.language,s.status,s.fileName].join(' ').toLowerCase().includes(q));if(!filtered.length)continue;h+=`<div class="movie-head"><div class="movie-title">🎬 ${esc(movie)}</div><div class="movie-count">${filtered.length}곡</div></div>`;filtered.forEach(s=>{const i=arr.findIndex(x=>x.id===s.id);h+=`<div class="song"><div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="title">${esc(titleFor(i,s))}</div><div class="meta">${esc(s.scene)} · ${esc(s.language)} · ${esc(s.status)}${s.fileName?`<br>🎵 ${esc(s.fileName)}`:''}</div></div><div class="actions"><button class="small" onclick="playSong('${s.id}')">▶ 재생</button><button class="secondary small" onclick="copyTitle('${s.id}')">제목 복사</button><button class="secondary small" onclick="moveSong('${s.id}',-1)">▲</button><button class="secondary small" onclick="moveSong('${s.id}',1)">▼</button><button class="secondary small" onclick="editSong('${s.id}')">수정</button><button class="danger small" onclick="removeSong('${s.id}')">삭제</button></div></div>`})}list.innerHTML=h||'<div class="empty">검색 결과가 없습니다.</div>'}
function moveSong(id,d){const s=songs.find(x=>x.id===id);if(!s)return;const a=sameMovieSorted(normMovie(s.movie)),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];normalizeOrders(normMovie(s.movie));save()}
async function copyTitle(id){const s=songs.find(x=>x.id===id);if(!s)return;const a=sameMovieSorted(normMovie(s.movie)),i=a.findIndex(x=>x.id===id);await navigator.clipboard.writeText(titleFor(i,s))}
function editSong(id){const s=songs.find(x=>x.id===id);if(!s)return;editId=id;movieTitle.value=s.movie;songTitle.value=s.title;language.value=s.language||'기타';songStatus.value=s.status||'완성';scene.value=s.scene||'';notes.value=s.notes||'';formTitle.textContent='곡 수정';window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editId=null;movieTitle.value='FOR THE FUTURE';songTitle.value='';language.value='English';songStatus.value='제작 중';scene.value='';notes.value='';formTitle.textContent='곡 추가 / 수정'}
async function removeSong(id){const s=songs.find(x=>x.id===id);if(!s||!confirm('이 곡을 삭제할까요?'))return;await deleteStoredFile(id);songs=songs.filter(x=>x.id!==id);normalizeOrders(normMovie(s.movie));if(currentId===id)stopAudio();save()}
saveBtn.onclick=()=>{const movie=normMovie(movieTitle.value),title=songTitle.value.trim();if(!title)return alert('곡 제목을 입력해 주세요.');const data={movie,title,language:language.value,status:songStatus.value,scene:scene.value.trim(),notes:notes.value.trim()};if(editId){const old=songs.find(x=>x.id===editId),om=normMovie(old.movie);Object.assign(old,data);if(om!==movie){normalizeOrders(om);old.order=sameMovieSorted(movie).length+1}}else songs.push({...data,id:crypto.randomUUID(),created:Date.now(),order:sameMovieSorted(movie).length+1});normalizeOrders(movie);save();clearForm()};
addBtn.onclick=()=>{clearForm();movieTitle.focus()};clearBtn.onclick=clearForm;search.oninput=render;
exportBtn.onclick=()=>{const b=new Blob([JSON.stringify({version:4,songs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FTF_movie_projects_backup.json';a.click();URL.revokeObjectURL(a.href)};
importBtn.onclick=()=>importFile.click();importFile.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.songs))throw 0;if(confirm('현재 목록을 백업 내용으로 교체할까요?')){songs=d.songs.map((s,i)=>({...s,id:s.id||crypto.randomUUID(),order:s.order||i+1,created:s.created||Date.now()+i}));save()}}catch(e){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function storeFile(id,file){const db=await openDB();await new Promise((ok,no)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(file,id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}
async function getStoredFile(id){const db=await openDB();const v=await new Promise((ok,no)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});db.close();return v}
async function deleteStoredFile(id){try{const db=await openDB();await new Promise((ok,no)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch(e){}}
async function clearMovieFiles(movie){for(const s of songs.filter(x=>normMovie(x.movie)===movie))await deleteStoredFile(s.id)}
function stopAudio(){if(currentAudio){currentAudio.pause();currentAudio.src='';currentAudio=null}if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}currentId=null;nowPlaying.textContent='재생할 곡을 선택하세요';playPauseBtn.textContent='▶ 재생';seek.value=0;curTime.textContent='0:00';durTime.textContent='0:00'}
function fmt(t){if(!isFinite(t))return'0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return `${m}:${String(s).padStart(2,'0')}`}
async function playSong(id){const s=songs.find(x=>x.id===id);if(!s)return;let file;try{file=await getStoredFile(id)}catch(e){}if(!file)return alert('이 곡 파일이 아직 연결되지 않았습니다. 파일 전체 선택에서 음악 파일들을 다시 한 번 선택해 주세요.');if(currentAudio)currentAudio.pause();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(file);currentAudio=new Audio(currentUrl);currentId=id;const a=sameMovieSorted(normMovie(s.movie)),i=a.findIndex(x=>x.id===id);nowPlaying.textContent=titleFor(i,s);currentAudio.ontimeupdate=()=>{seek.value=currentAudio.duration?Math.round(currentAudio.currentTime/currentAudio.duration*1000):0;curTime.textContent=fmt(currentAudio.currentTime);durTime.textContent=fmt(currentAudio.duration)};currentAudio.onloadedmetadata=()=>durTime.textContent=fmt(currentAudio.duration);currentAudio.onplay=()=>playPauseBtn.textContent='⏸ 일시정지';currentAudio.onpause=()=>playPauseBtn.textContent='▶ 재생';currentAudio.onended=()=>nextTrack();try{await currentAudio.play()}catch(e){alert('재생할 수 없습니다. 음악 파일 형식을 확인해 주세요.')}}
function playableList(){if(!currentId)return[];const s=songs.find(x=>x.id===currentId);return s?sameMovieSorted(normMovie(s.movie)):[]}
async function stepTrack(d){if(!currentId){const first=songs.find(s=>s.fileName);if(first)return playSong(first.id);return alert('먼저 곡을 재생해 주세요.')}const a=playableList(),i=a.findIndex(x=>x.id===currentId);for(let n=1;n<=a.length;n++){const x=a[(i+d*n+a.length)%a.length];if(x.fileName)return playSong(x.id)}}
function nextTrack(){stepTrack(1)}
prevBtn.onclick=()=>stepTrack(-1);nextBtn.onclick=()=>stepTrack(1);playPauseBtn.onclick=()=>{if(!currentAudio){const first=songs.find(s=>s.fileName);return first?playSong(first.id):alert('파일 전체 선택으로 음악을 먼저 저장해 주세요.')}if(currentAudio.paused)currentAudio.play();else currentAudio.pause()};seek.oninput=()=>{if(currentAudio&&currentAudio.duration)currentAudio.currentTime=seek.value/1000*currentAudio.duration};
function explicitOrder(name){const b=name.replace(/\.[^.]+$/,'');let m=b.match(/\bFTF[-_\s]*(\d{1,3})\b/i);if(m)return +m[1];m=b.match(/^\s*(\d{1,3})\s*[-_. )\]]/);return m?+m[1]:null}
function cleanTitle(name){return name.replace(/\.[^.]+$/,'').replace(/^\s*(?:FTF[-_\s]*)?\d{1,3}\s*[-_. )\]]*\s*/i,'').replace(/_/g,' ').replace(/\s+/g,' ').trim()}
function fileCompare(a,b){const x=explicitOrder(a.name),y=explicitOrder(b.name);if(x!==null||y!==null){if(x===null)return 1;if(y===null)return-1;if(x!==y)return x-y}return a.name.localeCompare(b.name,'ko',{numeric:true,sensitivity:'base'})}
bulkPickBtn.onclick=()=>bulkFiles.click();bulkFiles.onchange=async()=>{const files=[...bulkFiles.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|flac|aac|ogg)$/i.test(f.name)).sort(fileCompare);if(!files.length)return alert('음악 파일을 선택해 주세요.');const movie=normMovie(bulkMovieTitle.value);bulkPickBtn.disabled=true;bulkPickBtn.textContent='저장 중...';try{await clearMovieFiles(movie);songs=songs.filter(s=>normMovie(s.movie)!==movie);let failed=0;for(let i=0;i<files.length;i++){const f=files[i],s={id:crypto.randomUUID(),created:Date.now()+i,order:i+1,movie,title:cleanTitle(f.name)||f.name,language:'기타',status:'완성',scene:'',notes:'',fileName:f.name,fileSize:f.size,fileModified:f.lastModified};songs.push(s);try{await storeFile(s.id,f)}catch(e){failed++;s.fileName=''}}save();alert(failed?`${files.length-failed}곡 저장 완료, ${failed}곡 저장 실패`:`${files.length}곡 저장 완료. 이제 ▶ 재생을 누르면 됩니다.`)}finally{bulkPickBtn.disabled=false;bulkPickBtn.textContent='파일 전체 선택';bulkFiles.value=''}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
clearForm();render();
</script>
</body>
</html>
