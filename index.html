<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><title>FTF 미래를 위하여</title><style>
:root{--b:#0f1115;--p:#171a21;--p2:#202530;--t:#f4f6f8;--m:#9aa4b2;--l:#303744;--a:#5ea3ff;--d:#ff6b6b}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:Arial,"Malgun Gothic",sans-serif}body{padding-bottom:205px}header{position:sticky;top:0;z-index:10;background:#0f1115f5;border-bottom:1px solid var(--l);padding:14px}h1{margin:0;font-size:20px}.sub,.note{font-size:12px;color:var(--m);line-height:1.5}.wrap{padding:12px;max-width:1080px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;margin:2px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px}textarea{resize:vertical}button{border:0;border-radius:12px;padding:10px 12px;background:var(--a);color:#08111c;font-weight:800}button.secondary{background:var(--p2);color:var(--t);border:1px solid var(--l)}button.danger{background:#3b2023;color:#ffb3b3;border:1px solid #6b2e34}button.small{padding:7px 9px;font-size:12px}.toolbar,.bulk{display:grid;grid-template-columns:1fr auto;gap:8px}.movie-head{display:flex;justify-content:space-between;align-items:center;padding:9px 0 6px;border-bottom:1px solid var(--l);font-weight:800}.count{font-size:11px;color:#b9d7ff;background:#253243;padding:4px 8px;border-radius:999px}.song{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:12px 0;border-bottom:1px solid var(--l)}.num{font-size:17px;font-weight:900;color:var(--a)}.title{font-weight:800;font-size:15px;line-height:1.35}.meta{font-size:12px;line-height:1.5;color:var(--m);margin-top:4px}.story{margin-top:8px;padding:9px;border:1px solid #344154;border-radius:11px;background:#121720;font-size:12px;line-height:1.55}.story b{color:#b9d7ff}.actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#253243;color:#b9d7ff;font-size:11px;margin:3px 4px 0 0}.player{position:fixed;left:0;right:0;bottom:73px;z-index:30;background:#171a21fa;border-top:1px solid var(--l);padding:10px 12px}.player-inner{max-width:1080px;margin:auto}.now{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.transport{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}.transport button{font-size:19px}.seekrow{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-top:7px;font-size:11px;color:var(--m)}input[type=range]{padding:0;height:26px;border:0}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#0f1115fa;border-top:1px solid var(--l);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.switch{display:flex;align-items:center;gap:8px;color:var(--t);font-size:13px}.switch input{width:auto}.empty{color:var(--m);padding:14px 2px}@media(min-width:780px){.main{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}}
</style></head><body><header><h1>미래를 위하여 · FTF</h1><div class="sub">라디오 드라마처럼 장면 설명 → 환경음·특수효과 설정 → 나레이션 → 곡 재생</div></header>
<div class="wrap"><div class="toolbar"><input id="search" placeholder="제목, 장면, 나레이션 검색"><button id="installBtn" class="secondary" hidden>앱 설치</button></div>
<section class="card"><h2>파일 전체 선택 · 영화 순서 저장</h2><div class="grid"><div class="full"><label>영화 제목</label><input id="bulkMovieTitle" value="미래를 위하여 / FOR THE FUTURE"></div><div class="full bulk"><button id="bulkPickBtn">파일 전체 선택</button><button id="deleteAllBtn" class="danger">전체 삭제</button><input id="bulkFiles" type="file" multiple accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" hidden></div></div><p class="note">FTF-01 같은 번호가 있으면 번호를 우선하고, 번호가 없으면 파일 날짜 순으로 정렬합니다. 기존 음악 파일은 그대로 재생됩니다.</p></section>
<div class="main"><section class="card"><h2>영화별 곡 목록 <span id="total"></span></h2><div id="list"></div></section>
<aside class="card"><h2 id="formTitle">곡 · 장면 · 나레이션 설정</h2><div class="grid"><div class="full"><label>영화 제목</label><input id="movieTitle"></div><div class="full"><label>곡 제목</label><input id="songTitle"></div><div><label>언어</label><select id="language"><option>한국어</option><option>English</option><option>중국어</option><option>기타</option></select></div><div><label>상태</label><select id="songStatus"><option>완성</option><option>제작 중</option><option>가사 완성</option><option>스타일 완성</option><option>보류</option></select></div><div class="full"><label>장면 / 에피소드</label><input id="scene" placeholder="예: 태풍이 도시를 덮치기 직전"></div><div class="full"><label>장면 환경</label><input id="ambience" placeholder="예: 밤, 항구, 강풍, 멀리 사이렌"></div><div class="full"><label>특수효과 / 효과음</label><input id="sfx" placeholder="예: 천둥, 경보음, 유리 흔들림, 무전기 잡음"></div><div class="full"><label>곡 앞 나레이션</label><textarea id="narration" rows="6" placeholder="라디오 드라마처럼 곡 전에 읽을 설명"></textarea></div><div class="full"><label class="switch"><input id="narrationEnabled" type="checkbox" checked> 재생 전에 나레이션 자동 읽기</label></div><div class="full"><label>나레이션 목소리</label><select id="voiceStyle"><option value="serious">중후한 다큐멘터리</option><option value="radio">차분한 라디오 DJ</option><option value="urgent">긴박한 재난 방송</option><option value="soft">잔잔한 영화 해설</option></select></div><div class="full"><label>메모</label><textarea id="notes" rows="3"></textarea></div><div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="autoSceneBtn" class="secondary">🎬 장면 자동 설정</button><button id="previewNarrBtn" class="secondary">🎙 나레이션 미리듣기</button></div><div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="saveBtn">저장</button><button id="clearBtn" class="secondary">새로 입력</button></div></div></aside></div></div>
<div class="player"><div class="player-inner"><div class="now" id="nowPlaying">재생할 곡을 선택하세요</div><div class="transport"><button id="prevBtn" class="secondary">⏮</button><button id="playPauseBtn">▶ 재생</button><button id="nextBtn" class="secondary">⏭</button></div><div class="seekrow"><span id="curTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="durTime">0:00</span></div></div></div>
<div class="bottom"><button id="addBtn">+ 새 곡</button><button id="exportBtn" class="secondary">백업</button><button id="importBtn" class="secondary">불러오기</button><input id="importFile" type="file" accept=".json" hidden></div>
<script>
const KEY='ftf_mobile_pwa_v3',DB_NAME='ftf_audio_db_v2',DB_STORE='files';let songs=load(),editId=null,currentAudio=null,currentUrl=null,currentId=null,deferredPrompt=null,speaking=false;
function E(id){return document.getElementById(id)}function normMovie(v){return(v||'').trim()||'미지정 영화'}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(songs));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function groups(){const m=new Map();songs.forEach(s=>{s.movie=normMovie(s.movie);if(!m.has(s.movie))m.set(s.movie,[]);m.get(s.movie).push(s)});[...m.values()].forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0)||(x.created||0)-(y.created||0)));return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'))}function sameMovieSorted(movie){return songs.filter(s=>normMovie(s.movie)===movie).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}function normalizeOrders(movie){sameMovieSorted(movie).forEach((s,i)=>s.order=i+1)}function titleFor(i,s){return`FTF-${String(i+1).padStart(2,'0')} ${s.title}`}
function render(){const q=E('search').value.trim().toLowerCase();E('total').textContent=`· ${songs.length}곡`;let h='';for(const[movie,arr]of groups()){const f=arr.filter(s=>[movie,s.title,s.scene,s.ambience,s.sfx,s.narration,s.notes,s.fileName].join(' ').toLowerCase().includes(q));if(!f.length)continue;h+=`<div class="movie-head"><span>🎬 ${esc(movie)}</span><span class="count">${f.length}곡</span></div>`;f.forEach(s=>{const i=arr.findIndex(x=>x.id===s.id);const story=(s.scene||s.ambience||s.sfx||s.narration)?`<div class="story">${s.scene?`<b>장면</b> ${esc(s.scene)}<br>`:''}${s.ambience?`<span class="pill">🌌 ${esc(s.ambience)}</span>`:''}${s.sfx?`<span class="pill">💥 ${esc(s.sfx)}</span>`:''}${s.narration?`<br><b>🎙 나레이션</b> ${esc(s.narration)}`:''}</div>`:'';h+=`<div class="song"><div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="title">${esc(titleFor(i,s))}</div><div class="meta">${esc(s.language||'기타')} · ${esc(s.status||'완성')}${s.fileName?`<br>🎵 ${esc(s.fileName)}`:''}</div>${story}</div><div class="actions"><button class="small" onclick="playSong('${s.id}')">▶ 영화재생</button><button class="secondary small" onclick="previewNarr('${s.id}')">🎙 나레이션</button><button class="secondary small" onclick="editSong('${s.id}')">설정</button><button class="secondary small" onclick="moveSong('${s.id}',-1)">▲</button><button class="secondary small" onclick="moveSong('${s.id}',1)">▼</button><button class="danger small" onclick="removeSong('${s.id}')">삭제</button></div></div>`})}E('list').innerHTML=h||'<div class="empty">곡이 없습니다.</div>'}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putFile(id,file){const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}async function getFile(id){const db=await openDB();const v=await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}async function delFile(id){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}async function clearFiles(){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
function stopSpeech(){if('speechSynthesis'in window){speechSynthesis.cancel();speaking=false}}function speakText(text,style='serious',done=()=>{}){if(!text||!('speechSynthesis'in window)){done();return}stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';const cfg={serious:[.86,.88],radio:[.94,1],urgent:[1.05,1.02],soft:[.82,1.08]}[style]||[.9,1];u.rate=cfg[0];u.pitch=cfg[1];const vs=speechSynthesis.getVoices(),ko=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(ko)u.voice=ko;u.onend=()=>{speaking=false;done()};u.onerror=()=>{speaking=false;done()};speaking=true;speechSynthesis.speak(u)}function buildNarr(s){let a=[];if(s.scene)a.push(`장면. ${s.scene}.`);if(s.ambience)a.push(`주변에는 ${s.ambience}.`);if(s.sfx)a.push(`들려오는 소리. ${s.sfx}.`);if(s.narration)a.push(s.narration);return a.join(' ')}function previewNarr(id){const s=songs.find(x=>x.id===id);if(s)speakText(buildNarr(s),s.voiceStyle||'serious')}E('previewNarrBtn').onclick=()=>speakText([E('scene').value&&`장면. ${E('scene').value}.`,E('ambience').value&&`주변에는 ${E('ambience').value}.`,E('sfx').value&&`들려오는 소리. ${E('sfx').value}.`,E('narration').value].filter(Boolean).join(' '),E('voiceStyle').value);
function stopAudio(){stopSpeech();if(currentAudio){currentAudio.pause();currentAudio=null}if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}currentId=null;E('nowPlaying').textContent='재생할 곡을 선택하세요';E('playPauseBtn').textContent='▶ 재생';E('curTime').textContent='0:00';E('durTime').textContent='0:00';E('seek').value=0}function fmt(t){if(!isFinite(t))return'0:00';return`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}async function startAudio(s,file){currentId=s.id;currentUrl=URL.createObjectURL(file);currentAudio=new Audio(currentUrl);E('nowPlaying').textContent=s.title;currentAudio.onloadedmetadata=()=>E('durTime').textContent=fmt(currentAudio.duration);currentAudio.ontimeupdate=()=>{E('curTime').textContent=fmt(currentAudio.currentTime);E('seek').value=currentAudio.duration?Math.round(currentAudio.currentTime/currentAudio.duration*1000):0};currentAudio.onended=()=>playRelative(1);await currentAudio.play();E('playPauseBtn').textContent='⏸ 일시정지'}async function playSong(id){const s=songs.find(x=>x.id===id);if(!s)return;const file=await getFile(id);if(!file)return alert('실제 음악 파일이 없습니다.');stopAudio();E('nowPlaying').textContent=`🎙 ${s.title} · 장면 설명`;const go=()=>startAudio(s,file).catch(()=>alert('음악을 재생할 수 없습니다.'));if(s.narrationEnabled!==false&&buildNarr(s))speakText(buildNarr(s),s.voiceStyle||'serious',go);else go()}function playRelative(d){if(!songs.length)return;let arr=currentId?sameMovieSorted(normMovie((songs.find(x=>x.id===currentId)||{}).movie)):groups()[0]?.[1]||[];if(!arr.length)return;let i=currentId?arr.findIndex(x=>x.id===currentId):-1;i=(i+d+arr.length)%arr.length;playSong(arr[i].id)}E('prevBtn').onclick=()=>playRelative(-1);E('nextBtn').onclick=()=>playRelative(1);E('playPauseBtn').onclick=()=>{if(speaking){stopSpeech();return}if(!currentAudio){if(songs.length)playSong(groups()[0][1][0].id);return}if(currentAudio.paused){currentAudio.play();E('playPauseBtn').textContent='⏸ 일시정지'}else{currentAudio.pause();E('playPauseBtn').textContent='▶ 재생'}};E('seek').oninput=()=>{if(currentAudio&&currentAudio.duration)currentAudio.currentTime=currentAudio.duration*(E('seek').value/1000)};
function moveSong(id,d){const s=songs.find(x=>x.id===id);if(!s)return;const a=sameMovieSorted(normMovie(s.movie)),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];normalizeOrders(normMovie(s.movie));save()}function editSong(id){const s=songs.find(x=>x.id===id);if(!s)return;editId=id;['movie','title','language','status','scene','ambience','sfx','narration','voiceStyle','notes'].forEach(k=>{const el=E({movie:'movieTitle',title:'songTitle',status:'songStatus'}[k]||k);if(el)el.value=s[k]||({language:'기타',status:'완성',voiceStyle:'serious'}[k]||'')});E('narrationEnabled').checked=s.narrationEnabled!==false;E('formTitle').textContent='곡 · 장면 · 나레이션 수정';window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){editId=null;E('movieTitle').value='미래를 위하여 / FOR THE FUTURE';E('songTitle').value='';E('language').value='한국어';E('songStatus').value='완성';E('scene').value='';E('ambience').value='';E('sfx').value='';E('narration').value='';E('narrationEnabled').checked=true;E('voiceStyle').value='serious';E('notes').value='';E('formTitle').textContent='곡 · 장면 · 나레이션 설정'}async function removeSong(id){const s=songs.find(x=>x.id===id);if(!s||!confirm('이 곡을 삭제할까요?'))return;await delFile(id);songs=songs.filter(x=>x.id!==id);normalizeOrders(normMovie(s.movie));if(currentId===id)stopAudio();save()}E('deleteAllBtn').onclick=async()=>{if(!songs.length)return alert('삭제할 곡이 없습니다.');if(!confirm(`${songs.length}곡을 모두 삭제할까요?`))return;if(!confirm('음악 파일까지 전부 삭제합니다. 계속할까요?'))return;stopAudio();await clearFiles();songs=[];save()};
function autoScene(title){const t=(title||'').toLowerCase();if(t.includes('warning')||t.includes('경고'))return['지구 곳곳에서 이상징후가 동시에 포착되는 뉴스 몽타주','심야 뉴스룸, 위성사진, 불안한 도시의 밤','라디오 튜닝음, 뉴스 속보음, 바람, 멀리 사이렌','지금 세계 곳곳에서 서로 다른 재난 신호가 같은 방향을 가리키고 있습니다. 아직 일상은 계속되지만, 지구는 이미 작은 경고를 보내기 시작했습니다.','serious'];if(t.includes('arka')||t.includes('태풍')||t.includes('폭풍'))return['9월 13일, 초강력 태풍이 도시를 덮치기 직전','먹구름으로 덮인 도시, 강풍과 폭우, 정전 직전의 거리','재난 사이렌, 천둥, 번개, 창문 흔들림, 무전기 잡음','9월 13일. 경보는 반복됐고 바람은 더 거세졌습니다. 사람들은 창밖을 바라보며 같은 질문을 떠올립니다. 오늘 밤, 도시는 버텨낼 수 있을까요.','urgent'];if(t.includes('survival')||t.includes('생존'))return['재난 이후 처음 열리는 비밀 지구 생존 대책회의','지하 회의실, 낮은 조명, 대형 지구 지도와 모니터','문 잠기는 소리, 낮은 전자음, 종이 넘김, 멀리 환풍기','세상은 아직 이 회의의 존재를 모릅니다. 그러나 이 방 안에서는 인류가 다음 세대를 위해 무엇을 준비해야 하는지 처음으로 논의되기 시작합니다.','serious'];if(t.includes('0714'))return['평범한 청춘의 하루를 멀리서 지켜보는 비밀 관찰 장면','학교, 버스정류장, 편의점, 저녁 거리','학생들 웃음, 버스 도착음, 휴대전화 진동, 멀리 도시 소음','그들은 아직 아무것도 모릅니다. 학교와 친구, 시험과 첫사랑. 평범해 보이는 하루 뒤에서 누군가는 조용히 그들의 선택을 기록하고 있습니다.','soft'];if(t.includes('council')||t.includes('회의'))return['제3차 지구미래 대책회의, 인간의 한계를 어디까지 바꿀 것인가','밀폐된 국제 회의실, 긴장된 침묵, 대형 홀로그램 화면','낮은 경고음, 마이크 켜지는 소리, 의자 움직임, 짧은 정적','이번 회의의 질문은 더 무겁습니다. 살아남기 위해 인간의 몸을 바꿔도 되는가. 생존과 존엄 사이에서 누구도 쉽게 답하지 못합니다.','serious'];return['다음 이야기가 시작되는 영화 장면','공간의 분위기와 시간대를 입력하세요','장면에 필요한 효과음을 입력하세요','이 장면은 다음 노래로 이어집니다. 눈앞의 풍경과 인물의 감정을 떠올리며 들어보세요.','radio']}E('autoSceneBtn').onclick=()=>{const a=autoScene(E('songTitle').value);E('scene').value=a[0];E('ambience').value=a[1];E('sfx').value=a[2];E('narration').value=a[3];E('voiceStyle').value=a[4]};E('saveBtn').onclick=()=>{const movie=normMovie(E('movieTitle').value),title=E('songTitle').value.trim();if(!title)return alert('곡 제목을 입력해 주세요.');const data={movie,title,language:E('language').value,status:E('songStatus').value,scene:E('scene').value.trim(),ambience:E('ambience').value.trim(),sfx:E('sfx').value.trim(),narration:E('narration').value.trim(),narrationEnabled:E('narrationEnabled').checked,voiceStyle:E('voiceStyle').value,notes:E('notes').value.trim()};if(editId){const old=songs.find(x=>x.id===editId),om=normMovie(old.movie);Object.assign(old,data);if(om!==movie){normalizeOrders(om);old.order=sameMovieSorted(movie).length+1}}else songs.push({...data,id:crypto.randomUUID(),created:Date.now(),order:sameMovieSorted(movie).length+1});normalizeOrders(movie);save();clearForm()};E('addBtn').onclick=()=>{clearForm();E('movieTitle').focus()};E('clearBtn').onclick=clearForm;E('search').oninput=render;
function explicitNo(name){let m=name.match(/(?:^|\b)FTF[-_\s]*(\d{1,3})\b/i);if(m)return+m[1];m=name.match(/^\s*(\d{1,3})\s*[-_. )\]]/);return m?+m[1]:null}function stripName(n){return n.replace(/\.[^.]+$/,'').replace(/^\s*(?:FTF[-_\s]*)?\d{1,3}\s*[-_. )\]]*\s*/i,'').replace(/_/g,' ').replace(/\s+/g,' ').trim()}function fileCompare(a,b){const na=explicitNo(a.name),nb=explicitNo(b.name);if(na!==null||nb!==null){if(na===null)return 1;if(nb===null)return-1;if(na!==nb)return na-nb}const da=a.lastModified||0,db=b.lastModified||0;if(da!==db)return da-db;return a.name.localeCompare(b.name,'ko',{numeric:true,sensitivity:'base'})}E('bulkPickBtn').onclick=()=>E('bulkFiles').click();E('bulkFiles').onchange=async()=>{const files=[...E('bulkFiles').files].sort(fileCompare);if(!files.length)return;const movie=normMovie(E('bulkMovieTitle').value);if(!confirm(`${files.length}곡을 ${movie} 목록으로 다시 저장할까요?`)){E('bulkFiles').value='';return}stopAudio();const old=songs.filter(s=>normMovie(s.movie)===movie);for(const s of old)await delFile(s.id);songs=songs.filter(s=>normMovie(s.movie)!==movie);for(let i=0;i<files.length;i++){const f=files[i],id=crypto.randomUUID(),title=stripName(f.name)||f.name,a=autoScene(title);songs.push({id,created:f.lastModified||Date.now()+i,order:i+1,movie,title,language:'기타',status:'완성',scene:a[0],ambience:a[1],sfx:a[2],narration:a[3],narrationEnabled:true,voiceStyle:a[4],notes:'',fileName:f.name,fileSize:f.size,fileModified:f.lastModified});await putFile(id,f)}save();E('bulkFiles').value='';alert(`${files.length}곡 저장 완료. 각 곡에 장면·환경·나레이션 기본 설정도 넣었습니다.`)};
E('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({version:7,songs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FTF_movie_projects_backup.json';a.click();URL.revokeObjectURL(a.href)};E('importBtn').onclick=()=>E('importFile').click();E('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.songs))throw 0;if(confirm('현재 목록을 백업 내용으로 교체할까요?')){songs=d.songs;save()}}catch(e){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;E('installBtn').hidden=false});E('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;E('installBtn').hidden=true};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));clearForm();render();
