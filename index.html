<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><title>FTF 미래를 위하여</title><style>
:root{--b:#0f1115;--p:#171a21;--p2:#202530;--t:#f4f6f8;--m:#9aa4b2;--l:#303744;--a:#5ea3ff;--d:#ff6b6b;--g:#65d48a}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:Arial,"Malgun Gothic",sans-serif}body{padding-bottom:210px}header{position:sticky;top:0;z-index:10;background:#0f1115f5;border-bottom:1px solid var(--l);padding:14px}h1{margin:0;font-size:20px}.sub,.note{font-size:12px;color:var(--m);line-height:1.55}.wrap{padding:12px;max-width:1080px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;margin:2px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px}textarea{resize:vertical}button{border:0;border-radius:12px;padding:10px 12px;background:var(--a);color:#08111c;font-weight:800}button.secondary{background:var(--p2);color:var(--t);border:1px solid var(--l)}button.danger{background:#3b2023;color:#ffb3b3;border:1px solid #6b2e34}button.green{background:var(--g);color:#08110c}button.small{padding:7px 9px;font-size:12px}.toolbar,.bulk{display:grid;grid-template-columns:1fr auto;gap:8px}.scriptBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scriptline{padding:9px 0;border-bottom:1px solid var(--l);font-size:12px;line-height:1.55}.scriptline:last-child{border-bottom:0}.scriptno{display:inline-block;min-width:66px;color:#b9d7ff;font-weight:900}.movie-head{display:flex;justify-content:space-between;align-items:center;padding:9px 0 6px;border-bottom:1px solid var(--l);font-weight:800}.count{font-size:11px;color:#b9d7ff;background:#253243;padding:4px 8px;border-radius:999px}.song{display:grid;grid-template-columns:58px 1fr;gap:9px;padding:12px 0;border-bottom:1px solid var(--l)}.num{font-size:17px;font-weight:900;color:var(--a)}.scriptbadge{display:block;font-size:10px;color:#b7ffcb;margin-top:5px}.title{font-weight:800;font-size:15px;line-height:1.35}.meta{font-size:12px;line-height:1.5;color:var(--m);margin-top:4px}.story{margin-top:8px;padding:9px;border:1px solid #344154;border-radius:11px;background:#121720;font-size:12px;line-height:1.55}.story b{color:#b9d7ff}.actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#253243;color:#b9d7ff;font-size:11px;margin:3px 4px 0 0}.player{position:fixed;left:0;right:0;bottom:73px;z-index:30;background:#171a21fa;border-top:1px solid var(--l);padding:10px 12px}.player-inner{max-width:1080px;margin:auto}.now{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.transport{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}.transport button{font-size:19px}.seekrow{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-top:7px;font-size:11px;color:var(--m)}input[type=range]{padding:0;height:26px;border:0}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#0f1115fa;border-top:1px solid var(--l);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.switch{display:flex;align-items:center;gap:8px;color:var(--t);font-size:13px}.switch input{width:auto}.empty{color:var(--m);padding:14px 2px}@media(min-width:780px){.main{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}}
</style></head><body><header><h1>미래를 위하여 · FTF</h1><div class="sub">대본 순서 → 장면·환경·특수효과 → 나레이션 → 곡 재생</div></header>
<div class="wrap"><div class="toolbar"><input id="search" placeholder="제목, 대본, 장면, 나레이션 검색"><button id="installBtn" class="secondary" hidden>앱 설치</button></div>
<section class="card"><h2>🎬 미래를 위하여 · 대본 순서 나레이션</h2><div id="scriptList"></div><div class="scriptBtns" style="margin-top:10px"><button id="applyScriptBtn" class="green">대본 순서 적용</button><button id="playScriptBtn">▶ 대본 전체재생</button></div><p class="note">현재 영화 목록의 앞 7곡에 대본 1~7을 순서대로 연결합니다. 곡 제목이 어떤 언어여도 대본 순서는 따로 유지됩니다.</p></section>
<section class="card"><h2>파일 전체 선택 · 영화 순서 저장</h2><div class="grid"><div class="full"><label>영화 제목</label><input id="bulkMovieTitle" value="미래를 위하여 / FOR THE FUTURE"></div><div class="full bulk"><button id="bulkPickBtn">파일 전체 선택</button><button id="deleteAllBtn" class="danger">전체 삭제</button><input id="bulkFiles" type="file" multiple accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" hidden></div></div><p class="note">FTF-01 같은 번호가 있으면 번호를 우선하고, 번호가 없으면 파일 날짜 순으로 정렬합니다. 기존 음악 파일은 그대로 재생됩니다.</p></section>
<div class="main"><section class="card"><h2>영화별 곡 목록 <span id="total"></span></h2><div id="list"></div></section>
<aside class="card"><h2 id="formTitle">곡 · 대본 · 나레이션 설정</h2><div class="grid"><div class="full"><label>영화 제목</label><input id="movieTitle"></div><div class="full"><label>곡 제목</label><input id="songTitle"></div><div><label>대본 순서</label><input id="scriptOrder" type="number" min="0" placeholder="예: 1"></div><div><label>언어</label><select id="language"><option>한국어</option><option>English</option><option>중국어</option><option>기타</option></select></div><div class="full"><label>장면 / 에피소드</label><input id="scene"></div><div class="full"><label>장면 환경</label><input id="ambience"></div><div class="full"><label>특수효과 / 효과음</label><input id="sfx"></div><div class="full"><label>곡 앞 나레이션</label><textarea id="narration" rows="7"></textarea></div><div class="full"><label class="switch"><input id="narrationEnabled" type="checkbox" checked> 재생 전에 나레이션 자동 읽기</label></div><div class="full"><label>나레이션 목소리</label><select id="voiceStyle"><option value="serious">중후한 다큐멘터리</option><option value="radio">차분한 라디오 DJ</option><option value="urgent">긴박한 재난 방송</option><option value="soft">잔잔한 영화 해설</option></select></div><div class="full"><label>메모</label><textarea id="notes" rows="3"></textarea></div><div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="autoSceneBtn" class="secondary">🎬 대본 자동 설정</button><button id="previewNarrBtn" class="secondary">🎙 나레이션 미리듣기</button></div><div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="saveBtn">저장</button><button id="clearBtn" class="secondary">새로 입력</button></div></div></aside></div></div>
<div class="player"><div class="player-inner"><div class="now" id="nowPlaying">재생할 곡을 선택하세요</div><div class="transport"><button id="prevBtn" class="secondary">⏮</button><button id="playPauseBtn">▶ 재생</button><button id="nextBtn" class="secondary">⏭</button></div><div class="seekrow"><span id="curTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="durTime">0:00</span></div></div></div>
<div class="bottom"><button id="addBtn">+ 새 곡</button><button id="exportBtn" class="secondary">백업</button><button id="importBtn" class="secondary">불러오기</button><input id="importFile" type="file" accept=".json" hidden></div>
<script>
const KEY='ftf_mobile_pwa_v3',DB_NAME='ftf_audio_db_v2',DB_STORE='files';let songs=load(),editId=null,currentAudio=null,currentUrl=null,currentId=null,deferredPrompt=null,speaking=false,scriptMode=false;
const SCRIPT=[
{n:1,name:'지구의 경고',scene:'지구 곳곳에서 이상징후가 동시에 포착되는 뉴스 몽타주',amb:'심야 뉴스룸, 위성사진, 불안한 도시의 밤',sfx:'라디오 튜닝음, 뉴스 속보음, 바람, 멀리 사이렌',nar:'우리가 당연하게 여겼던 계절이 조금씩 어긋나기 시작했습니다. 뜨거워진 바다, 녹아내리는 빙하, 거대한 산불과 갑작스러운 폭우. 서로 다른 곳에서 시작된 경고는 이제 하나의 질문으로 모입니다. 지구는 우리에게 무엇을 말하고 있는 걸까요.',voice:'serious'},
{n:2,name:'9월 13일 · 태풍 아르카',scene:'초강력 태풍 아르카가 도시를 덮치기 직전과 대홍수',amb:'먹구름으로 덮인 도시, 강풍, 폭우, 정전 직전의 거리',sfx:'재난 사이렌, 천둥, 번개, 창문 흔들림, 무전기 잡음, 급류',nar:'9월 13일. 경보는 반복됐고 바람은 더 거세졌습니다. 지붕과 창문을 때리는 빗소리 사이로 사이렌이 울립니다. 강은 제방을 넘고 도시는 빠르게 물에 잠기기 시작합니다. 이제 사람들에게 남은 것은 서로를 놓치지 않는 일뿐입니다.',voice:'urgent'},
{n:3,name:'제1차 지구 생존 대책회의',scene:'재난 이후 처음 열리는 비밀 지구 생존 대책회의',amb:'지하 회의실, 낮은 조명, 대형 지구 지도와 모니터',sfx:'보안문 잠기는 소리, 낮은 전자음, 종이 넘김, 환풍기',nar:'재난이 지나간 뒤, 세계 각지의 과학자와 전문가들이 이름 없는 장소에 모였습니다. 약 이백 명. 국적도 분야도 달랐지만 질문은 같았습니다. 다음 재난이 더 커진다면, 인류는 무엇을 준비해야 하는가. 이 회의에서 처음으로 장기 생존 계획이 논의되기 시작합니다.',voice:'serious'},
{n:4,name:'제2차 회의 · 5년 계획',scene:'선발 전 단계의 5년 관찰·평가 계획이 논의되는 두 번째 비밀회의',amb:'보안 회의실, 세계 지도, 학교와 도시의 평범한 영상 자료',sfx:'프로젝터 전환음, 낮은 전자음, 기록 장치, 짧은 정적',nar:'두 번째 회의에서는 더 긴 시간이 필요하다는 결론이 내려집니다. 세계 곳곳의 열일곱 살 청소년들이 평범한 학교생활과 일상을 이어가는 동안, 누구도 목적을 알 수 없는 관찰과 평가가 시작됩니다. 아직 군대도, 미래 부대도 존재하지 않습니다. 그들은 그저 자신의 하루를 살아갈 뿐입니다.',voice:'serious'},
{n:5,name:'청춘의 일상과 첫사랑',scene:'학교와 가족, 시험, 버스, 편의점, 친구와 첫사랑이 이어지는 평범한 하루',amb:'교실, 버스정류장, 저녁 거리, 노래방, 편의점',sfx:'학교 종소리, 학생들 웃음, 버스 도착음, 휴대전화 진동',nar:'세상의 거대한 계획과는 상관없이 아이들의 하루는 평범하게 흘러갑니다. 시험을 걱정하고, 친구와 웃고, 버스를 놓치고, 처음 누군가를 좋아하게 됩니다. 이 평범한 시간이야말로 그들이 지켜야 할 미래가 무엇인지 보여주는 장면입니다.',voice:'soft'},
{n:6,name:'PROJECT 0714 · 비밀 관찰',scene:'비밀요원이 청춘들의 일상을 멀리서 기록하며 점차 인간적인 연민을 느끼는 장면',amb:'학교 밖 차량, 카페 창가, 저녁 골목, 멀리 보이는 청춘들의 일상',sfx:'카메라 셔터, 짧은 무전, 키보드 입력, 도시의 잔잔한 소음',nar:'그들의 뒤에는 늘 기록하는 사람이 있었습니다. 개입하지 말 것. 감정을 갖지 말 것. 관찰자는 그렇게 교육받았습니다. 하지만 매일 같은 얼굴과 웃음을 지켜보는 동안 보고서의 문장은 조금씩 달라집니다. 대상이 아니라, 살아 있는 사람으로 보이기 시작한 것입니다.',voice:'soft'},
{n:7,name:'제3차 지구미래 대책회의',scene:'극한 미래 환경을 대비한 의학적 신체 강화 여부를 두고 벌어지는 제3차 회의',amb:'밀폐된 국제 회의실, 긴장된 침묵, 대형 생체 데이터 화면',sfx:'마이크 켜지는 소리, 낮은 경고음, 의자 움직임, 긴 정적',nar:'세 번째 회의의 질문은 이전보다 무겁습니다. 살아남기 위해 인간의 몸을 바꿔도 되는가. 한쪽은 생존 가능성을 말하고, 다른 쪽은 인간의 존엄과 선택권을 말합니다. 결국 원칙이 세워집니다. 비약물 훈련을 먼저 하고, 충분한 설명과 동의를 거치며, 거부와 중단의 권리를 보장한다는 것. 미래를 위한 준비가 사람을 도구로 만들어서는 안 됩니다.',voice:'serious'}];
function E(id){return document.getElementById(id)}function normMovie(v){return(v||'').trim()||'미지정 영화'}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(songs));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scriptItem(n){return SCRIPT.find(x=>x.n===Number(n))}function scriptSongs(){return songs.filter(s=>Number(s.scriptOrder)>0).sort((a,b)=>Number(a.scriptOrder)-Number(b.scriptOrder)||(a.order||0)-(b.order||0))}
function renderScript(){E('scriptList').innerHTML=SCRIPT.map(x=>`<div class="scriptline"><span class="scriptno">대본 ${String(x.n).padStart(2,'0')}</span><b>${x.name}</b><br><span class="note">${x.scene}</span></div>`).join('')}
function groups(){const m=new Map();songs.forEach(s=>{s.movie=normMovie(s.movie);if(!m.has(s.movie))m.set(s.movie,[]);m.get(s.movie).push(s)});[...m.values()].forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0)||(x.created||0)-(y.created||0)));return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'))}function sameMovieSorted(movie){return songs.filter(s=>normMovie(s.movie)===movie).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}function normalizeOrders(movie){sameMovieSorted(movie).forEach((s,i)=>s.order=i+1)}function titleFor(i,s){return`FTF-${String(i+1).padStart(2,'0')} ${s.title}`}
function render(){const q=E('search').value.trim().toLowerCase();E('total').textContent=`· ${songs.length}곡`;let h='';for(const[movie,arr]of groups()){const f=arr.filter(s=>[movie,s.title,s.scene,s.ambience,s.sfx,s.narration,s.notes,s.fileName,s.scriptOrder].join(' ').toLowerCase().includes(q));if(!f.length)continue;h+=`<div class="movie-head"><span>🎬 ${esc(movie)}</span><span class="count">${f.length}곡</span></div>`;f.forEach(s=>{const i=arr.findIndex(x=>x.id===s.id),si=scriptItem(s.scriptOrder);const story=(s.scene||s.ambience||s.sfx||s.narration)?`<div class="story">${si?`<b>📖 대본 ${String(si.n).padStart(2,'0')} · ${esc(si.name)}</b><br>`:''}${s.scene?`<b>장면</b> ${esc(s.scene)}<br>`:''}${s.ambience?`<span class="pill">🌌 ${esc(s.ambience)}</span>`:''}${s.sfx?`<span class="pill">💥 ${esc(s.sfx)}</span>`:''}${s.narration?`<br><b>🎙 나레이션</b> ${esc(s.narration)}`:''}</div>`:'';h+=`<div class="song"><div class="num">${String(i+1).padStart(2,'0')}${si?`<span class="scriptbadge">대본 ${String(si.n).padStart(2,'0')}</span>`:''}</div><div><div class="title">${esc(titleFor(i,s))}</div><div class="meta">${esc(s.language||'기타')}${s.fileName?`<br>🎵 ${esc(s.fileName)}`:''}</div>${story}</div><div class="actions"><button class="small" onclick="playSong('${s.id}')">▶ 영화재생</button><button class="secondary small" onclick="previewNarr('${s.id}')">🎙 나레이션</button><button class="secondary small" onclick="editSong('${s.id}')">설정</button><button class="secondary small" onclick="moveSong('${s.id}',-1)">▲</button><button class="secondary small" onclick="moveSong('${s.id}',1)">▼</button><button class="danger small" onclick="removeSong('${s.id}')">삭제</button></div></div>`})}E('list').innerHTML=h||'<div class="empty">곡이 없습니다.</div>'}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putFile(id,file){const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}async function getFile(id){const db=await openDB();const v=await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}async function delFile(id){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}async function clearFiles(){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
function stopSpeech(){if('speechSynthesis'in window){speechSynthesis.cancel();speaking=false}}function speakText(text,style='serious',done=()=>{}){if(!text||!('speechSynthesis'in window)){done();return}stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';const cfg={serious:[.86,.88],radio:[.94,1],urgent:[1.05,1.02],soft:[.84,1.05]}[style]||[.9,1];u.rate=cfg[0];u.pitch=cfg[1];const vs=speechSynthesis.getVoices(),ko=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(ko)u.voice=ko;u.onend=()=>{speaking=false;done()};u.onerror=()=>{speaking=false;done()};speaking=true;speechSynthesis.speak(u)}function buildNarr(s){return(s.narration||'').trim()}function previewNarr(id){const s=songs.find(x=>x.id===id);if(s)speakText(buildNarr(s),s.voiceStyle||'serious')}E('previewNarrBtn').onclick=()=>speakText(E('narration').value,E('voiceStyle').value);
function stopAudio(){stopSpeech();if(currentAudio){currentAudio.pause();currentAudio=null}if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}currentId=null;E('nowPlaying').textContent='재생할 곡을 선택하세요';E('playPauseBtn').textContent='▶ 재생';E('curTime').textContent='0:00';E('durTime').textContent='0:00';E('seek').value=0}function fmt(t){if(!isFinite(t))return'0:00';return`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}async function startAudio(s,file){currentId=s.id;currentUrl=URL.createObjectURL(file);currentAudio=new Audio(currentUrl);E('nowPlaying').textContent=s.title;currentAudio.onloadedmetadata=()=>E('durTime').textContent=fmt(currentAudio.duration);currentAudio.ontimeupdate=()=>{E('curTime').textContent=fmt(currentAudio.currentTime);E('seek').value=currentAudio.duration?Math.round(currentAudio.currentTime/currentAudio.duration*1000):0};currentAudio.onended=()=>playRelative(1);await currentAudio.play();E('playPauseBtn').textContent='⏸ 일시정지'}async function playSong(id){const s=songs.find(x=>x.id===id);if(!s)return;const file=await getFile(id);if(!file)return alert('실제 음악 파일이 없습니다.');stopAudio();E('nowPlaying').textContent=`🎙 ${s.title} · 나레이션`;const go=()=>startAudio(s,file).catch(()=>alert('음악을 재생할 수 없습니다.'));if(s.narrationEnabled!==false&&buildNarr(s))speakText(buildNarr(s),s.voiceStyle||'serious',go);else go()}function playRelative(d){let arr=scriptMode?scriptSongs():(currentId?sameMovieSorted(normMovie((songs.find(x=>x.id===currentId)||{}).movie)):groups()[0]?.[1]||[]);if(!arr.length)return;let i=currentId?arr.findIndex(x=>x.id===currentId):-1;i=(i+d+arr.length)%arr.length;playSong(arr[i].id)}E('prevBtn').onclick=()=>playRelative(-1);E('nextBtn').onclick=()=>playRelative(1);E('playPauseBtn').onclick=()=>{if(speaking){stopSpeech();return}if(!currentAudio){const a=scriptMode?scriptSongs():groups()[0]?.[1]||[];if(a.length)playSong(a[0].id);return}if(currentAudio.paused){currentAudio.play();E('playPauseBtn').textContent='⏸ 일시정지'}else{currentAudio.pause();E('playPauseBtn').textContent='▶ 재생'}};E('seek').oninput=()=>{if(currentAudio&&currentAudio.duration)currentAudio.currentTime=currentAudio.duration*(E('seek').value/1000)};
function applyScriptToSong(s,x){s.scriptOrder=x.n;s.scene=x.scene;s.ambience=x.amb;s.sfx=x.sfx;s.narration=x.nar;s.narrationEnabled=true;s.voiceStyle=x.voice}E('applyScriptBtn').onclick=()=>{const movie=normMovie(E('bulkMovieTitle').value),arr=sameMovieSorted(movie);if(!arr.length)return alert('먼저 음악 파일을 넣어 주세요.');if(!confirm(`앞 ${Math.min(SCRIPT.length,arr.length)}곡에 미래를 위하여 대본 순서를 적용할까요?`))return;arr.forEach(s=>{s.scriptOrder=0});for(let i=0;i<Math.min(SCRIPT.length,arr.length);i++)applyScriptToSong(arr[i],SCRIPT[i]);save();alert('대본 1~7 순서와 나레이션을 적용했습니다.')} ;E('playScriptBtn').onclick=()=>{const a=scriptSongs();if(!a.length)return alert('먼저 대본 순서 적용을 눌러 주세요.');scriptMode=true;stopAudio();playSong(a[0].id)};
function moveSong(id,d){const s=songs.find(x=>x.id===id);if(!s)return;const a=sameMovieSorted(normMovie(s.movie)),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];normalizeOrders(normMovie(s.movie));save()}function editSong(id){const s=songs.find(x=>x.id===id);if(!s)return;editId=id;E('movieTitle').value=s.movie;E('songTitle').value=s.title;E('scriptOrder').value=s.scriptOrder||'';E('language').value=s.language||'기타';E('scene').value=s.scene||'';E('ambience').value=s.ambience||'';E('sfx').value=s.sfx||'';E('narration').value=s.narration||'';E('narrationEnabled').checked=s.narrationEnabled!==false;E('voiceStyle').value=s.voiceStyle||'serious';E('notes').value=s.notes||'';E('formTitle').textContent='곡 · 대본 · 나레이션 수정';window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){editId=null;E('movieTitle').value='미래를 위하여 / FOR THE FUTURE';E('songTitle').value='';E('scriptOrder').value='';E('language').value='한국어';E('scene').value='';E('ambience').value='';E('sfx').value='';E('narration').value='';E('narrationEnabled').checked=true;E('voiceStyle').value='serious';E('notes').value='';E('formTitle').textContent='곡 · 대본 · 나레이션 설정'}async function removeSong(id){const s=songs.find(x=>x.id===id);if(!s||!confirm('이 곡을 삭제할까요?'))return;await delFile(id);songs=songs.filter(x=>x.id!==id);normalizeOrders(normMovie(s.movie));if(currentId===id)stopAudio();save()}E('deleteAllBtn').onclick=async()=>{if(!songs.length)return alert('삭제할 곡이 없습니다.');if(!confirm(`${songs.length}곡을 모두 삭제할까요?`))return;if(!confirm('음악 파일까지 전부 삭제합니다. 계속할까요?'))return;stopAudio();await clearFiles();songs=[];save()};
E('autoSceneBtn').onclick=()=>{const x=scriptItem(E('scriptOrder').value);if(!x)return alert('대본 순서 1~7 중 하나를 입력해 주세요.');E('scene').value=x.scene;E('ambience').value=x.amb;E('sfx').value=x.sfx;E('narration').value=x.nar;E('voiceStyle').value=x.voice};E('saveBtn').onclick=()=>{const movie=normMovie(E('movieTitle').value),title=E('songTitle').value.trim();if(!title)return alert('곡 제목을 입력해 주세요.');const data={movie,title,scriptOrder:Number(E('scriptOrder').value)||0,language:E('language').value,scene:E('scene').value.trim(),ambience:E('ambience').value.trim(),sfx:E('sfx').value.trim(),narration:E('narration').value.trim(),narrationEnabled:E('narrationEnabled').checked,voiceStyle:E('voiceStyle').value,notes:E('notes').value.trim()};if(editId){const old=songs.find(x=>x.id===editId),om=normMovie(old.movie);Object.assign(old,data);if(om!==movie){normalizeOrders(om);old.order=sameMovieSorted(movie).length+1}}else songs.push({...data,id:crypto.randomUUID(),created:Date.now(),order:sameMovieSorted(movie).length+1});normalizeOrders(movie);save();clearForm()};E('addBtn').onclick=()=>{clearForm();E('movieTitle').focus()};E('clearBtn').onclick=clearForm;E('search').oninput=render;
function explicitNo(name){let m=name.match(/(?:^|\b)FTF[-_\s]*(\d{1,3})\b/i);if(m)return+m[1];m=name.match(/^\s*(\d{1,3})\s*[-_. )\]]/);return m?+m[1]:null}function stripName(n){return n.replace(/\.[^.]+$/,'').replace(/^\s*(?:FTF[-_\s]*)?\d{1,3}\s*[-_. )\]]*\s*/i,'').replace(/_/g,' ').replace(/\s+/g,' ').trim()}function fileCompare(a,b){const na=explicitNo(a.name),nb=explicitNo(b.name);if(na!==null||nb!==null){if(na===null)return 1;if(nb===null)return-1;if(na!==nb)return na-nb}const da=a.lastModified||0,db=b.lastModified||0;if(da!==db)return da-db;return a.name.localeCompare(b.name,'ko',{numeric:true,sensitivity:'base'})}E('bulkPickBtn').onclick=()=>E('bulkFiles').click();E('bulkFiles').onchange=async()=>{const files=[...E('bulkFiles').files].sort(fileCompare);if(!files.length)return;const movie=normMovie(E('bulkMovieTitle').value);if(!confirm(`${files.length}곡을 ${movie} 목록으로 다시 저장할까요?`)){E('bulkFiles').value='';return}stopAudio();const old=songs.filter(s=>normMovie(s.movie)===movie);for(const s of old)await delFile(s.id);songs=songs.filter(s=>normMovie(s.movie)!==movie);for(let i=0;i<files.length;i++){const f=files[i],id=crypto.randomUUID();songs.push({id,created:f.lastModified||Date.now()+i,order:i+1,movie,title:stripName(f.name)||f.name,scriptOrder:0,language:'기타',scene:'',ambience:'',sfx:'',narration:'',narrationEnabled:true,voiceStyle:'serious',notes:'',fileName:f.name,fileSize:f.size,fileModified:f.lastModified});await putFile(id,f)}save();E('bulkFiles').value='';alert(`${files.length}곡 저장 완료. 다음으로 대본 순서 적용을 눌러 주세요.`)};
E('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({version:8,songs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FTF_movie_projects_backup.json';a.click();URL.revokeObjectURL(a.href)};E('importBtn').onclick=()=>E('importFile').click();E('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.songs))throw 0;if(confirm('현재 목록을 백업 내용으로 교체할까요?')){songs=d.songs;save()}}catch(e){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;E('installBtn').hidden=false});E('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;E('installBtn').hidden=true};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderScript();clearForm();render();
</script></body></html>
