<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><title>미래를 위하여 FTF</title><style>:root{--b:#0f1115;--p:#171a21;--t:#f5f7fa;--m:#9aa4b2;--l:#303744;--a:#5ea3ff;--g:#65d48a}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:Arial,"Malgun Gothic",sans-serif}body{padding-bottom:205px}header{padding:15px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:22px}.sub,.note{color:var(--m);font-size:12px;line-height:1.55}.wrap{padding:12px;max-width:1050px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 11px}.grid,.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:11px;background:var(--a);font-weight:900;color:#08111c;font:inherit}button.secondary{background:#202530;color:#fff;border:1px solid var(--l)}button.green{background:var(--g)}button.danger{background:#3b2023;color:#ffb3b3}.script,.song{border-bottom:1px solid var(--l);padding:10px 0}.sn{color:#b9d7ff;font-weight:900}.meta{font-size:12px;color:var(--m);line-height:1.55}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px;padding:8px}.player{position:fixed;left:0;right:0;bottom:73px;z-index:40;background:#171a21fa;border-top:1px solid var(--l);padding:10px 12px}.transport{display:grid;grid-template-columns:58px 1fr 58px;gap:8px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#0f1115fa;border-top:1px solid var(--l);padding:9px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden}.viewer.show{display:block}.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.vshade{position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,transparent 25%,transparent 55%,#000c 100%);pointer-events:none}.vtop{position:absolute;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between}.vtitle{font-weight:900;font-size:18px;text-shadow:0 2px 5px #000}.vstatus{position:absolute;left:14px;top:58px;background:#0009;border:1px solid #ffffff44;border-radius:999px;padding:6px 10px;font-size:12px}.subtitleWrap{position:absolute;left:3%;right:3%;bottom:4%;display:flex;justify-content:center}.subtitle{width:min(940px,100%);background:rgba(255,255,255,.95);color:#111;border:2px solid #111;border-radius:22px;padding:13px 16px;text-align:center;box-shadow:0 8px 30px #000b}.ko{font-size:clamp(18px,4.8vw,28px);font-weight:900;line-height:1.38}.zh{font-size:clamp(15px,4vw,23px);font-weight:800;line-height:1.35;margin-top:6px;color:#333}.langtag{font-size:11px;color:#666;margin-right:5px}.goal{border-left:4px solid var(--g);padding-left:10px}</style></head><body><header><h1>미래를 위하여 · FTF</h1><div class="sub">영어 나레이션 · 한국어/중국어 만화 자막 · 음악 자동재생</div></header><div class="wrap"><section class="card goal"><h2>▶ 한 번 누르면 전부 자동</h2><div class="mode"><button id="startPrimary" class="green">🎙 1차 자동 시작<br><small>영어 나레이션 + 한·중 자막 + 만화 + 음악</small></button><button id="startSecondary" class="secondary">🎬 2차 자동 시작<br><small>만화 + 음악</small></button></div><p class="note">영어 음성으로 설명하고 화면에는 한국어와 중국어 자막을 동시에 보여줍니다.</p></section><section class="card"><h2>🎬 영화 대본 7장면</h2><div id="scripts"></div><div class="grid"><button id="narrTest" class="secondary">🎙 영어 나레이션 테스트</button><button id="stopAll" class="secondary">■ 정지</button></div></section><section class="card"><h2>🎵 음악 전체 선택</h2><div class="grid"><button id="pickMusic">음악 전체 선택</button><button id="deleteMusic" class="danger">음악 전체 삭제</button><input id="musicFiles" hidden type="file" multiple accept="audio/*"></div><div id="musicCount" class="note"></div></section><section class="card"><h2>🖼 만화 전체 선택</h2><div class="grid"><button id="pickComic">만화 전체 선택</button><button id="deleteComic" class="danger">만화 전체 삭제</button><input id="comicFiles" hidden type="file" multiple accept="image/*"></div><div id="comicCount" class="note"></div></section><section class="card"><h2>📖 대본·만화 장면</h2><div id="storyList"></div></section><section class="card"><h2>🎵 영화 곡 목록</h2><div id="songList"></div></section></div><div class="player"><div id="now">재생할 장면을 선택하세요</div><div class="transport"><button id="prev" class="secondary">⏮</button><button id="pause">▶ 재생</button><button id="next" class="secondary">⏭</button></div></div><div class="bottom"><button id="openComic" class="secondary">🖼 만화</button><button id="backup" class="secondary">백업</button><button id="restore" class="secondary">불러오기</button><input id="restoreFile" hidden type="file"></div><div id="viewer" class="viewer"><img id="comicImg"><div class="vshade"></div><div class="vtop"><div id="viewerTitle" class="vtitle"></div><button id="closeViewer" class="secondary">✕</button></div><div id="viewerStatus" class="vstatus"></div><div class="subtitleWrap"><div class="subtitle"><div id="captionKo" class="ko"></div><div id="captionZh" class="zh"></div></div></div></div><script>
const KEY='ftf_mobile_pwa_v3',ADB='ftf_audio_db_v2',AST='files',CDB='ftf_comic_db_v1',CST='images',CMETA='ftf_comic_meta_v2';
const SCRIPT=[
{n:1,name:'지구의 경고',en:'The seasons we once took for granted have begun to change. The oceans are growing warmer, glaciers are melting, and enormous wildfires and sudden downpours are spreading across the world. Warnings that began in different places are now becoming one question. What is the Earth trying to tell us?',ko:'뜨거워진 바다, 녹아내리는 빙하, 거대한 산불과 갑작스러운 폭우. 지구가 우리에게 경고하고 있습니다.',zh:'变暖的海洋、融化的冰川、巨大的山火和突如其来的暴雨。地球正在向我们发出警告。'},
{n:2,name:'9월 13일 · 태풍 아르카',en:'September thirteenth. The warnings repeated as the wind grew stronger. Sirens echoed through the sound of rain striking roofs and windows. Rivers overflowed and the city began to disappear beneath the water. All that remained was to make sure no one was left behind.',ko:'9월 13일. 태풍 아르카가 도시를 덮칩니다. 사이렌이 울리고 강물이 넘치기 시작합니다.',zh:'9月13日，台风阿尔卡袭击城市。警报响起，河水开始泛滥。'},
{n:3,name:'제1차 지구 생존 대책회의',en:'After the disaster, nearly two hundred scientists and experts from around the world gathered at an unnamed location. Their question was the same. If the next disaster is greater, what must humanity prepare? A long-term survival plan was discussed for the first time.',ko:'재난 이후 약 200명의 과학자와 전문가가 비밀 장소에 모입니다. 인류의 장기 생존 계획이 시작됩니다.',zh:'灾难过后，约两百名科学家和专家秘密聚集。人类的长期生存计划由此开始。'},
{n:4,name:'제2차 회의 · 5년 계획',en:'At the second meeting, a five-year observation and evaluation plan was discussed. Seventeen-year-olds around the world continued their ordinary lives, unaware of the hidden purpose behind the program.',ko:'두 번째 회의에서 5년간의 관찰과 평가 계획이 논의됩니다. 열일곱 살 청소년들은 목적을 모른 채 평범한 삶을 이어갑니다.',zh:'第二次会议讨论了为期五年的观察与评估计划。十七岁的年轻人并不知道真正的目的，仍过着普通生活。'},
{n:5,name:'청춘의 일상과 첫사랑',en:'Far from the enormous plan, their days remained ordinary. School, family, exams, buses, friends, laughter, and the first feeling of love. These simple moments revealed the future they truly wanted to protect.',ko:'학교와 가족, 시험과 친구, 그리고 처음 찾아온 사랑. 평범한 하루가 그들이 지켜야 할 미래를 보여줍니다.',zh:'学校、家人、考试、朋友，还有第一次到来的爱情。平凡的日子让他们看见真正想守护的未来。'},
{n:6,name:'PROJECT 0714 · 비밀 관찰',en:'Someone was always watching from a distance. Do not interfere. Do not become emotionally involved. But as the observer watched the same faces and smiles each day, the subjects slowly became people instead of numbers.',ko:'누군가는 멀리서 그들을 계속 기록합니다. 그러나 관찰자는 점차 그들을 대상이 아닌 사람으로 보기 시작합니다.',zh:'有人一直在远处记录他们。但观察者渐渐不再把他们当作目标，而是当作真正的人。'},
{n:7,name:'제3차 지구미래 대책회의',en:'The third meeting asked a heavier question. Should the human body be changed in order to survive? Survival and human dignity collided. The final principle was clear: training first, informed consent, and the right to refuse or stop.',ko:'세 번째 회의에서는 생존을 위해 인간의 몸을 바꿔도 되는가를 논의합니다. 생존과 인간의 존엄이 충돌합니다.',zh:'第三次会议讨论：为了生存，是否可以改变人的身体？生存与人的尊严发生了冲突。'}];
const E=id=>document.getElementById(id);let songs=load(KEY),comics=load(CMETA),audio=null,aurl=null,current=-1,currentScene=1,currentComicPos=0,timer=null,autoMode=null,queuePos=0,objUrl=null;function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v));render()}function natural(a,b){return a.localeCompare(b,'ko',{numeric:true})}function explicitNo(n){let m=(n||'').match(/(?:FTF|S|SCENE)?[-_\s]*0?(\d{1,3})/i);return m?+m[1]:99}function songCmp(a,b){return explicitNo(a.fileName||a.title)-explicitNo(b.fileName||b.title)||natural(a.fileName||a.title,b.fileName||b.title)}function comicScene(n){let x=explicitNo(n);return x>=1&&x<=7?x:0}function assign(arr){let u=arr.filter(x=>!x.scene).sort((a,b)=>natural(a.name,b.name));u.forEach((x,i)=>x.scene=Math.min(7,Math.floor(i*7/u.length)+1));return arr.sort((a,b)=>(a.scene-b.scene)||natural(a.name,b.name))}
function dbOpen(n,s){return new Promise((ok,no)=>{let r=indexedDB.open(n,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(n,s,k,v){let d=await dbOpen(n,s);await new Promise(ok=>{let t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=ok});d.close()}async function dbGet(n,s,k){let d=await dbOpen(n,s);let v=await new Promise(ok=>{let r=d.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result)});d.close();return v}async function dbClear(n,s){let d=await dbOpen(n,s);await new Promise(ok=>{let t=d.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=ok});d.close()}
function render(){songs.sort(songCmp);E('musicCount').textContent=`현재 음악 ${songs.length}곡`;E('comicCount').textContent=`현재 만화 ${comics.length}장`;E('scripts').innerHTML=SCRIPT.map(s=>`<div class="script"><span class="sn">대본 ${String(s.n).padStart(2,'0')}</span> · <b>${s.name}</b><div class="meta">🎙 English narration · 🇰🇷 한국어 + 🇨🇳 中文</div></div>`).join('');E('storyList').innerHTML=SCRIPT.map(s=>`<div class="script"><b>${s.n}. ${s.name}</b><div class="meta">🇰🇷 ${s.ko}<br>🇨🇳 ${s.zh}</div><div class="actions"><button onclick="playScene(${s.n},'radio')">▶ 장면재생</button></div></div>`).join('');E('songList').innerHTML=songs.map((s,i)=>`<div class="song"><b>FTF-${String(i+1).padStart(2,'0')} ${s.title||s.fileName}</b><div class="meta">🎵 ${s.fileName||''}</div></div>`).join('')||'<div class="note">음악 파일을 선택해 주세요.</div>'}
function speakEnglish(text,done=()=>{}){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;u.pitch=.94;let v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;u.onend=done;u.onerror=done;speechSynthesis.speak(u)}function sceneComics(n){return comics.filter(x=>x.scene===n)}function sceneSong(n){let i=songs.findIndex(x=>explicitNo(x.fileName||x.title)===n);if(i<0)i=Math.min(songs.length-1,n-1);return i}
async function showComic(c,n){let sc=SCRIPT[n-1];E('viewer').classList.add('show');E('viewerTitle').textContent=sc.name;E('viewerStatus').textContent=`대본 ${String(n).padStart(2,'0')}`;E('captionKo').innerHTML='<span class="langtag">KR</span>'+sc.ko;E('captionZh').innerHTML='<span class="langtag">中文</span>'+sc.zh;if(!c){E('comicImg').removeAttribute('src');return}let f=await dbGet(CDB,CST,c.id);if(f){if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);E('comicImg').src=objUrl}}
function slideshow(n){clearInterval(timer);let a=sceneComics(n);if(!a.length){showComic(null,n);return}currentComicPos=0;showComic(a[0],n);timer=setInterval(()=>{currentComicPos=(currentComicPos+1)%a.length;showComic(a[currentComicPos],n)},4500)}function stopAudio(){if(audio){audio.pause();audio=null}if(aurl){URL.revokeObjectURL(aurl);aurl=null}}async function playSong(i,advance){if(i<0)return advance&&nextScene();stopAudio();current=i;let f=await dbGet(ADB,AST,songs[i].id);if(!f)return advance&&nextScene();aurl=URL.createObjectURL(f);audio=new Audio(aurl);audio.onended=()=>advance&&nextScene();audio.play();E('pause').textContent='⏸ 일시정지'}function playScene(n,mode='radio'){currentScene=n;slideshow(n);let sc=SCRIPT[n-1],i=sceneSong(n);E('now').textContent=`${sc.name} · ${mode==='radio'?'English narration':'Music'}`;if(mode==='radio')speakEnglish(sc.en,()=>playSong(i,autoMode!==null));else playSong(i,autoMode!==null)}function startAuto(mode){if(!songs.length)return alert('먼저 음악을 선택해 주세요.');autoMode=mode;queuePos=0;playScene(1,mode)}function nextScene(){queuePos++;if(queuePos>=7){autoMode=null;clearInterval(timer);E('now').textContent='전체 재생 완료';return}playScene(queuePos+1,autoMode)}
E('startPrimary').onclick=()=>startAuto('radio');E('startSecondary').onclick=()=>startAuto('movie');E('narrTest').onclick=()=>{showComic(sceneComics(1)[0],1);speakEnglish(SCRIPT[0].en)};E('stopAll').onclick=()=>{autoMode=null;speechSynthesis.cancel();stopAudio();clearInterval(timer)};E('pickMusic').onclick=()=>E('musicFiles').click();E('musicFiles').onchange=async()=>{let fs=[...E('musicFiles').files].sort((a,b)=>songCmp({fileName:a.name},{fileName:b.name}));await dbClear(ADB,AST);songs=[];for(let f of fs){let id=crypto.randomUUID();songs.push({id,title:f.name.replace(/\.[^.]+$/,''),fileName:f.name});await dbPut(ADB,AST,id,f)}save(KEY,songs)};E('pickComic').onclick=()=>E('comicFiles').click();E('comicFiles').onchange=async()=>{let fs=assign([...E('comicFiles').files].map(f=>({f,name:f.name,scene:comicScene(f.name)})));await dbClear(CDB,CST);comics=[];for(let x of fs){let id=crypto.randomUUID();comics.push({id,name:x.name,scene:x.scene});await dbPut(CDB,CST,id,x.f)}save(CMETA,comics)};E('deleteMusic').onclick=async()=>{if(confirm('음악 전체 삭제?')){await dbClear(ADB,AST);songs=[];save(KEY,songs)}};E('deleteComic').onclick=async()=>{if(confirm('만화 전체 삭제?')){await dbClear(CDB,CST);comics=[];save(CMETA,comics)}};E('prev').onclick=()=>playSong(Math.max(0,current-1),false);E('next').onclick=()=>playSong(Math.min(songs.length-1,current+1),false);E('pause').onclick=()=>{if(!audio)return;if(audio.paused){audio.play();E('pause').textContent='⏸ 일시정지'}else{audio.pause();E('pause').textContent='▶ 재생'}};E('openComic').onclick=()=>showComic(sceneComics(currentScene)[currentComicPos],currentScene);E('closeViewer').onclick=()=>E('viewer').classList.remove('show');E('backup').onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify({version:11,songs,comics},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='FTF_backup_v11.json';a.click()};E('restore').onclick=()=>E('restoreFile').click();E('restoreFile').onchange=async e=>{let d=JSON.parse(await e.target.files[0].text());songs=d.songs||[];comics=d.comics||[];save(KEY,songs);save(CMETA,comics)};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));comics=assign(comics);render();
</script></body></html>
