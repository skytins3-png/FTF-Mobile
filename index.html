ontent:space-between;gap:8px}.vtitle{font-weight:900;font-size:18px;text-shadow:0 2px 5px #000;max-width:78%}.vstatus{position:absolute;left:14px;top:60px;background:#000b;border:1px solid #ffffff44;border-radius:999px;padding:6px 10px;font-size:12px}.sfx{position:absolute;right:5%;top:18%;font-size:clamp(28px,8vw,58px);font-weight:1000;font-style:italic;color:var(--y);text-shadow:3px 3px 0 #000,-2px -2px 0 #000;transform:rotate(-8deg);letter-spacing:2px}.situation{position:absolute;left:4%;right:4%;bottom:26%;background:#000b;border-left:5px solid var(--y);padding:10px 12px;font-size:clamp(14px,3.6vw,21px);font-weight:800;line-height:1.45;text-shadow:0 2px 4px #000}.subtitleWrap{position:absolute;left:3%;right:3%;bottom:3%;display:flex;justify-content:center}.subtitle{width:min(940px,100%);background:#fffffff2;color:#111;border:3px solid #111;border-radius:20px;padding:12px 15px;text-align:center;box-shadow:0 8px 30px #000b}.ko{font-size:clamp(17px,4.5vw,27px);font-weight:900;line-height:1.34}.zh{font-size:clamp(14px,3.8vw,22px);font-weight:800;line-height:1.32;margin-top:5px;color:#333}.langtag{font-size:11px;color:#666;margin-right:5px}.goal{border-left:4px solid var(--g);padding-left:10px}.warning{color:#ffd9d9;font-size:12px}
</style></head><body><header><h1>미래를 위하여 · FTF</h1><div class="sub">라디오 드라마 + 만화책 화면 + 상황 설명 + 특수효과 + 영어 나레이션 + 한·중 자막</div></header><div class="wrap">
<section class="card goal"><h2>▶ 1차 목표 · 라디오 만화 영화</h2><div class="mode"><button id="startPrimary" class="green">🎙 자동 시작<br><small>상황설명 + 효과음 + 만화 + 나레이션 + 음악</small></button><button id="startSecondary" class="secondary">🎬 영화+음악<br><small>나레이션 최소화</small></button></div><p class="note">각 컷마다 만화책 프레임, 상황 설명, 의성어 특수효과가 바뀌고 실제 효과음도 같이 납니다.</p></section>

<section class="card"><h2>📖 장면별 상태</h2><div id="storyList"></div></section><section class="card"><h2>🎵 전체 곡 목록</h2><div id="songList"></div></section></div>

const KEY='ftf_mobile_pwa_v3',ADB='ftf_audio_db_v2',AST='files',CDB='ftf_comic_db_v1',CST='images',CMETA='ftf_comic_meta_v2',CUTS=6,CUT_MS=4700;
const SCRIPT=[
{n:1,name:'지구의 경고',keys:['earth warning','earths warning',"earth's warning",'지구의 경고','지구 경고'],en:'The familiar rhythm of the seasons is breaking apart. The ocean is warming. Ancient ice is melting. Wildfires, violent storms and floods are becoming part of everyday life. The Earth is no longer whispering. It is warning us.',ko:['계절의 리듬이 조금씩 무너지고 있습니다.','뜨거워진 바다가 더 많은 에너지를 품습니다.','수천 년 된 빙하가 빠르게 녹아내립니다.','메마른 숲에 거대한 산불이 번집니다.','갑작스러운 폭우가 도시를 집어삼킵니다.','지구는 더 이상 조용히 말하지 않습니다. 경고하고 있습니다.'],zh:['季节的节奏正在逐渐崩塌。','变暖的海洋正在积蓄更多能量。','存在数千年的冰川正在迅速融化。','巨大的山火正在干燥的森林中蔓延。','突如其来的暴雨吞没城市。','地球不再低声诉说，而是在发出警告。'],sit:['평범하던 계절이 달라지는 뉴스 화면.','해수면 위로 열기가 피어오르는 바다.','빙하 절벽이 갈라지며 무너지는 순간.','강풍을 타고 산등성이를 넘는 불길.','도로와 지하차도를 채우는 빗물.','우주에서 바라본 지구와 마지막 경고.'],sfx:['BEEP…','WHOOSH','CRACK!','FWOOSH!','DRRRR…','BOOM…']},
{n:2,name:'9월 13일 · 태풍 아르카',keys:['typhoon arka','arka','태풍 아르카'],en:'September thirteenth. Typhoon Arka closes in. The wind tears through the streets. Sirens and thunder merge with the sound of rain. Rivers overflow. People move toward higher ground as the city fights to survive the night.',ko:['9월 13일, 태풍 아르카가 접근합니다.','간판이 흔들리고 나무가 휘어집니다.','재난 사이렌과 천둥이 동시에 울립니다.','강물이 제방을 넘기 시작합니다.','사람들이 서로를 붙잡고 높은 곳으로 이동합니다.','도시는 폭풍 속에서 밤을 버팁니다.'],zh:['9月13日，台风阿尔卡正在逼近。','招牌剧烈摇晃，树木被强风压弯。','灾难警报与雷声同时响起。','河水开始漫过堤岸。','人们互相搀扶，向高处转移。','城市在风暴中熬过漫长的夜晚。'],sit:['기상 레이더에 거대한 태풍의 눈이 나타난다.','도심을 강풍이 휩쓸며 물건들이 날아간다.','정전 직전, 번개가 도시를 밝힌다.','강과 도로의 경계가 사라진다.','구조대와 주민들이 대피로를 향한다.','비에 젖은 도시 위로 구조 불빛이 움직인다.'],sfx:['WOOO…','WHAM!','WEE-OO!','RUMBLE','MOVE!','THUD…']},
{n:3,name:'제1차 지구 생존 대책회의',keys:['earth survival plan','survival plan','제1차 지구 생존','지구 생존 대책회의'],en:'After the disaster, nearly two hundred scientists and experts enter a secured underground conference room. The doors close. Maps, climate models and casualty reports fill the screens. For the first time, humanity begins to discuss a long-term survival plan.',ko:['재난 뒤, 비밀 회의장의 문이 닫힙니다.','세계 각국의 과학자와 전문가들이 도착합니다.','약 200명이 하나의 지구 지도를 바라봅니다.','피해 자료와 기후 모델이 화면을 채웁니다.','장기 생존 계획이 처음 논의됩니다.','회의 내용은 외부에 공개되지 않습니다.'],zh:['灾难之后，秘密会议室的大门关闭。','来自各国的科学家和专家陆续抵达。','约两百人注视着同一张世界地图。','灾害数据和气候模型布满屏幕。','长期生存计划第一次被正式讨论。','会议内容没有对外公开。'],sit:['지하 보안문이 잠긴다.','신분 확인을 마친 전문가들이 자리에 앉는다.','대형 홀로그램 지도가 켜진다.','피해 수치가 빠르게 갱신된다.','첫 번째 비밀 의제가 화면에 뜬다.','회의실 조명이 낮아지고 기록이 봉인된다.'],sfx:['CLACK','BEEP','HUMM','TIK-TIK','CLICK','LOCK']},
{n:4,name:'제2차 회의 · 5년 계획',keys:['five year plan','5 year plan','5년 계획','제2차 회의'],en:'The second meeting moves beyond disaster response. A five-year observation program is proposed. Seventeen-year-olds around the world continue school, family life and friendships, never knowing that someone is quietly evaluating their future potential.',ko:['두 번째 비밀회의가 시작됩니다.','계획 기간은 5년으로 정해집니다.','세계 곳곳의 열일곱 살 청소년들이 관찰 대상이 됩니다.','하지만 그들은 아무것도 알지 못합니다.','학교와 가족, 친구들과 평범한 생활을 이어갑니다.','아직 군대도 미래 부대도 존재하지 않습니다.'],zh:['第二次秘密会议开始。','计划周期被定为五年。','世界各地十七岁的年轻人成为观察对象。','但他们对此一无所知。','他们仍和家人、朋友一起过着普通生活。','此时还没有军队，也没有所谓的未来部队。'],sit:['회의 테이블 위에 5년 일정표가 펼쳐진다.','연도별 평가 단계가 표시된다.','세계 여러 도시의 학교 화면이 연결된다.','학생들은 평범하게 수업을 듣는다.','관찰 기록은 익명 코드로 저장된다.','계획의 진짜 목적은 여전히 봉인되어 있다.'],sfx:['FLIP','TICK','BEEP','DING','TYPE…','SHHH…']},
{n:5,name:'청춘의 일상과 첫사랑',keys:['first love','youth','첫사랑','청춘'],en:'Away from the secret meetings, life remains ordinary. School bells, homework, buses, friends and laughter. Then, without warning, a first love begins. A glance lasts only a second, but stays in memory far longer.',ko:['아침 종소리와 함께 평범한 하루가 시작됩니다.','시험과 숙제, 친구들의 웃음이 이어집니다.','버스를 타고 집으로 돌아가는 저녁.','누군가를 처음 좋아하게 됩니다.','짧은 눈맞춤도 오래 기억에 남습니다.','그 평범한 하루가 지켜야 할 미래입니다.'],zh:['伴随着清晨的铃声，普通的一天开始了。','考试、作业和朋友们的笑声继续着。','傍晚，他们乘公交车回家。','第一次喜欢上了某个人。','短暂的对视也会留在记忆里很久。','这样的普通生活，就是他们想守护的未来。'],sit:['등교 시간, 복도에 학생들이 몰린다.','교실에서 시험지가 넘어간다.','해 질 무렵 버스 창밖 풍경이 흐른다.','두 사람이 우연히 같은 곳을 바라본다.','짧은 눈맞춤 뒤 서로 고개를 돌린다.','평범한 도시의 불빛이 켜진다.'],sfx:['DING-DONG','FLIP','VRR…','…','THUMP','CITY…']},
{n:6,name:'PROJECT 0714 · 비밀 관찰',keys:['project 0714','0714'],en:'Someone is always watching from a distance. Do not interfere. Do not become emotionally involved. Record behavior. Score potential. But day after day, the observer begins to see not subjects, but people.',ko:['어딘가에서 그들의 하루가 기록되고 있습니다.','관찰자는 절대 개입하지 말라는 지시를 받습니다.','매일 같은 얼굴과 웃음을 지켜봅니다.','보고서에는 숫자와 평가만 남아야 합니다.','하지만 관찰자의 마음이 조금씩 흔들립니다.','그들은 더 이상 대상이 아니라 사람으로 보입니다.'],zh:['在某个地方，他们的日常一直被记录。','观察者接到命令：绝对不要干预。','每天看着同样的面孔和笑容。','报告中本应只留下数字和评估。','但观察者的内心开始动摇。','他们不再只是目标，而是真正的人。'],sit:['망원 렌즈가 멀리 있는 학생을 따라간다.','무전기에 짧은 지시가 들린다.','모니터 여러 대에 일상이 기록된다.','평가 점수가 조용히 입력된다.','관찰자가 손을 멈추고 화면을 바라본다.','코드 번호 대신 이름을 적으려다 멈춘다.'],sfx:['CLICK','KRR…','BEEP','TAP-TAP','…','SCRATCH']},
{n:7,name:'제3차 지구미래 대책회의',keys:['third earth future council','future council','제3차','3차 지구미래','지구미래 대책회의'],en:'The third meeting becomes the most difficult. Can the human body be altered for survival in extreme environments? Science, fear and ethics collide. The final line is drawn clearly: no future can be protected by treating people as tools.',ko:['세 번째 회의의 분위기는 이전보다 무겁습니다.','극한 환경에서 살아남을 방법이 논의됩니다.','인간의 몸을 바꿔도 되는가라는 질문이 등장합니다.','생존 가능성과 인간의 존엄이 충돌합니다.','동의와 거부권을 보장해야 한다는 의견이 나옵니다.','미래를 위한 준비가 사람을 도구로 만들어서는 안 됩니다.'],zh:['第三次会议的气氛比以往更加沉重。','人们开始讨论如何在极端环境中生存。','一个问题被提出：可以改变人的身体吗？','生存可能性与人的尊严发生冲突。','有人坚持必须保障知情同意和拒绝的权利。','为了未来的准备，绝不能把人变成工具。'],sit:['회의실 공기가 무겁게 가라앉는다.','극한 환경 생존 자료가 공개된다.','인체 개입 가능성이라는 문장이 화면에 뜬다.','찬성과 반대 의견이 팽팽히 맞선다.','동의와 거부권이 핵심 원칙으로 적힌다.','마지막 문장이 회의록에 남는다.'],sfx:['HUM…','BEEP','?','BAM!','WRITE','SILENCE']}
];
const E=id=>document.getElementById(id);let songs=load(KEY),comics=load(CMETA),audio=null,aurl=null,current=-1,currentScene=1,currentCut=0,timer=null,sceneEndTimer=null,autoMode=null,queuePos=0,objUrl=null,runToken=0,aCtx=null,sfxNodes=[];function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v));render()}function natural(a,b){return a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'})}function normalizeName(s){return(s||'').toLowerCase().replace(/[_.()\-]+/g,' ').replace(/\s+/g,' ').trim()}function sceneForSong(name){let t=normalizeName(name);for(let s of SCRIPT)if(s.keys.some(k=>t.includes(normalizeName(k))))return s.n;return 0}function explicitNo(n){let m=(n||'').match(/(?:FTF|S|SCENE)?[-_\s]*0?(\d{1,3})/i);return m?+m[1]:99}function songCmp(a,b){let sa=sceneForSong(a.fileName||a.title),sb=sceneForSong(b.fileName||b.title);if(sa!==sb)return(sa||99)-(sb||99);return natural(a.fileName||a.title,b.fileName||b.title)}function comicScene(n){let x=explicitNo(n);return x>=1&&x<=7?x:0}function assign(arr){let u=arr.filter(x=>!x.scene).sort((a,b)=>natural(a.name,b.name));if(u.length)u.forEach((x,i)=>x.scene=Math.min(7,Math.floor(i*7/u.length)+1));return arr.sort((a,b)=>(a.scene-b.scene)||natural(a.name,b.name))}

function audioCtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume();return aCtx}function stopSfx(){sfxNodes.forEach(x=>{try{x.stop&&x.stop()}catch(e){}try{x.disconnect&&x.disconnect()}catch(e){}});sfxNodes=[]}function playSfx(n,cut){stopSfx();let c=audioCtx(),now=c.currentTime,g=c.createGain();g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.16,now+.04);g.gain.exponentialRampToValueAtTime(.001,now+1.5);g.connect(c.destination);let o=c.createOscillator();o.connect(g);let type=(n===2&&[1,2,3].includes(cut))?'sawtooth':([3,4,6].includes(n)?'square':'sine');o.type=type;o.frequency.setValueAtTime(n===2?cut===2?620:110:n===5?440:180+cut*45,now);if(n===2&&cut===2)o.frequency.linearRampToValueAtTime(950,now+.7);o.start(now);o.stop(now+1.55);sfxNodes.push(o,g);if([1,2].includes(n)&&[1,2,3,4].includes(cut)){let len=c.sampleRate*1.3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);let src=c.createBufferSource(),ng=c.createGain();src.buffer=b;ng.gain.value=.11;src.connect(ng);ng.connect(c.destination);src.start();sfxNodes.push(src,ng)}}
