<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><title>미래를 위하여 FTF</title><style>:root{--b:#0f1115;--p:#171a21;--t:#f5f7fa;--m:#9aa4b2;--l:#303744;--a:#5ea3ff;--g:#65d48a}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:Arial,"Malgun Gothic",sans-serif}body{padding-bottom:205px}header{padding:15px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:22px}.sub,.note{color:var(--m);font-size:12px;line-height:1.55}.wrap{padding:12px;max-width:1050px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 11px}.grid,.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:11px;background:var(--a);font-weight:900;color:#08111c;font:inherit}button.secondary{background:#202530;color:#fff;border:1px solid var(--l)}button.green{background:var(--g)}button.danger{background:#3b2023;color:#ffb3b3}.script,.song{border-bottom:1px solid var(--l);padding:10px 0}.sn{color:#b9d7ff;font-weight:900}.meta{font-size:12px;color:var(--m);line-height:1.55}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px;padding:8px}.player{position:fixed;left:0;right:0;bottom:73px;z-index:40;background:#171a21fa;border-top:1px solid var(--l);padding:10px 12px}.transport{display:grid;grid-template-columns:58px 1fr 58px;gap:8px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#0f1115fa;border-top:1px solid var(--l);padding:9px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden}.viewer.show{display:block}.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vshade{position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,transparent 24%,transparent 55%,#000d 100%);pointer-events:none}.vtop{position:absolute;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between}.vtitle{font-weight:900;font-size:18px;text-shadow:0 2px 5px #000}.vstatus{position:absolute;left:14px;top:58px;background:#0009;border:1px solid #ffffff44;border-radius:999px;padding:6px 10px;font-size:12px}.subtitleWrap{position:absolute;left:3%;right:3%;bottom:4%;display:flex;justify-content:center}.subtitle{width:min(940px,100%);background:#fffffff2;color:#111;border:2px solid #111;border-radius:22px;padding:13px 16px;text-align:center}.ko{font-size:clamp(18px,4.8vw,28px);font-weight:900;line-height:1.38}.zh{font-size:clamp(15px,4vw,23px);font-weight:800;line-height:1.35;margin-top:6px;color:#333}.langtag{font-size:11px;color:#666;margin-right:5px}.goal{border-left:4px solid var(--g);padding-left:10px}</style></head><body><header><h1>미래를 위하여 · FTF</h1><div class="sub">영어 나레이션 · 한국어/중국어 자막 · 장면당 6컷 · 자동 다음 장면</div></header><div class="wrap"><section class="card goal"><h2>▶ 한 번 누르면 전부 자동</h2><div class="mode"><button id="startPrimary" class="green">🎙 1차 자동 시작<br><small>나레이션 + 6컷 + 한·중 자막 + 음악</small></button><button id="startSecondary" class="secondary">🎬 2차 자동 시작<br><small>만화 + 음악</small></button></div><p class="note">연결곡이 없어도 멈추지 않고 다음 대본으로 자동 진행합니다.</p></section><section class="card"><h2>🎬 영화 대본 7장면</h2><div id="scripts"></div><div class="grid"><button id="narrTest" class="secondary">🎙 나레이션 테스트</button><button id="stopAll" class="secondary">■ 정지</button></div></section><section class="card"><h2>🎵 음악 전체 선택</h2><div class="grid"><button id="pickMusic">음악 전체 선택</button><button id="deleteMusic" class="danger">음악 전체 삭제</button><input id="musicFiles" hidden type="file" multiple accept="audio/*"></div><div id="musicCount" class="note"></div></section><section class="card"><h2>🖼 추가 만화 선택</h2><div class="grid"><button id="pickComic">추가 만화 전체 선택</button><button id="deleteComic" class="danger">추가 만화 삭제</button><input id="comicFiles" hidden type="file" multiple accept="image/*"></div><div id="comicCount" class="note"></div></section><section class="card"><h2>📖 대본·만화 장면</h2><div id="storyList"></div></section><section class="card"><h2>🎵 영화 곡 목록</h2><div id="songList"></div></section></div><div class="player"><div id="now">재생할 장면을 선택하세요</div><div class="transport"><button id="prev" class="secondary">⏮</button><button id="pause">▶ 재생</button><button id="next" class="secondary">⏭</button></div></div><div class="bottom"><button id="openComic" class="secondary">🖼 만화</button><button id="backup" class="secondary">백업</button><button id="restore" class="secondary">불러오기</button><input id="restoreFile" hidden type="file"></div><div id="viewer" class="viewer"><img id="comicImg"><div class="vshade"></div><div class="vtop"><div id="viewerTitle" class="vtitle"></div><button id="closeViewer" class="secondary">✕</button></div><div id="viewerStatus" class="vstatus"></div><div class="subtitleWrap"><div class="subtitle"><div id="captionKo" class="ko"></div><div id="captionZh" class="zh"></div></div></div></div><script>
const KEY='ftf_mobile_pwa_v3',ADB='ftf_audio_db_v2',AST='files',CDB='ftf_comic_db_v1',CST='images',CMETA='ftf_comic_meta_v2',CUTS=6,CUT_MS=4300;
const SCRIPT=[
{n:1,name:'지구의 경고',keys:['earth warning','earths warning',"earth's warning",'지구의 경고','지구 경고'],en:'The seasons we once took for granted have begun to change. The oceans are growing warmer, glaciers are melting, and enormous wildfires and sudden downpours are spreading across the world. What is the Earth trying to tell us?',ko:['평범했던 계절이 조금씩 어긋나기 시작했습니다.','바다는 더 뜨거워지고 있습니다.','수천 년 된 빙하가 빠르게 녹아내립니다.','거대한 산불이 숲과 도시를 위협합니다.','갑작스러운 폭우와 홍수가 일상이 되어갑니다.','지구는 지금 우리에게 경고하고 있습니다.'],zh:['曾经熟悉的季节正在逐渐失去规律。','海洋正在变得越来越温暖。','存在数千年的冰川正在迅速融化。','巨大的山火正在威胁森林和城市。','突如其来的暴雨和洪水正在成为日常。','地球正在向我们发出警告。']},
{n:2,name:'9월 13일 · 태풍 아르카',keys:['typhoon arka','arka','태풍 아르카'],en:'September thirteenth. The warnings repeated as the wind grew stronger. Sirens echoed through the rain. Rivers overflowed and the city began to disappear beneath the water.',ko:['9월 13일, 태풍 아르카가 접근합니다.','하늘이 어두워지고 바람이 거세집니다.','재난 사이렌과 천둥이 도시를 뒤덮습니다.','강물이 제방을 넘기 시작합니다.','사람들은 서로를 붙잡고 높은 곳으로 이동합니다.','도시는 폭풍 속에서 버티고 있습니다.'],zh:['9月13日，台风阿尔卡正在逼近。','天空变暗，风势越来越强。','警报声和雷声笼罩整座城市。','河水开始漫过堤岸。','人们互相搀扶，向高处转移。','城市正在风暴中坚持。']},
{n:3,name:'제1차 지구 생존 대책회의',keys:['earth survival plan','survival plan','제1차 지구 생존','지구 생존 대책회의'],en:'After the disaster, nearly two hundred scientists and experts from around the world gathered at an unnamed location. A long-term survival plan was discussed for the first time.',ko:['재난이 지나간 뒤 비밀 장소의 문이 닫힙니다.','세계 각국의 과학자와 전문가들이 모입니다.','약 200명의 시선이 하나의 지구 지도를 향합니다.','다음 재난이 더 크다면 무엇을 준비해야 할까요.','처음으로 장기 생존 계획이 논의됩니다.','회의 내용은 세상에 공개되지 않습니다.'],zh:['灾难过后，一处秘密地点的大门关闭。','来自世界各国的科学家和专家聚集在一起。','约两百人的目光集中在同一张世界地图上。','如果下一场灾难更严重，人类该准备什么？','长期生存计划第一次被正式讨论。','会议内容没有向世界公开。']},
{n:4,name:'제2차 회의 · 5년 계획',keys:['five year plan','5 year plan','5년 계획','제2차 회의'],en:'At the second meeting, a five-year observation and evaluation plan was discussed. Seventeen-year-olds around the world continued their ordinary lives, unaware of the hidden purpose.',ko:['두 번째 비밀회의가 시작됩니다.','계획 기간은 5년으로 정해집니다.','세계 곳곳의 열일곱 살 청소년들이 관찰 대상이 됩니다.','하지만 그들은 아무것도 알지 못합니다.','학교와 가족, 친구들과 평범한 생활을 이어갑니다.','아직 군대도 미래 부대도 존재하지 않습니다.'],zh:['第二次秘密会议开始。','计划周期被定为五年。','世界各地十七岁的年轻人成为观察对象。','但他们对此一无所知。','他们仍和家人、朋友一起过着普通生活。','此时还没有军队，也没有所谓的未来部队。']},
{n:5,name:'청춘의 일상과 첫사랑',keys:['first love','youth','첫사랑','청춘'],en:'School, family, exams, buses, friends, laughter, and the first feeling of love. These simple moments revealed the future they truly wanted to protect.',ko:['아침 종소리와 함께 평범한 하루가 시작됩니다.','시험과 숙제, 친구들의 웃음이 이어집니다.','버스를 타고 집으로 돌아가는 저녁.','누군가를 처음 좋아하게 됩니다.','짧은 눈맞춤도 오래 기억에 남습니다.','그 평범한 하루가 지켜야 할 미래입니다.'],zh:['伴随着清晨的铃声，普通的一天开始了。','考试、作业和朋友们的笑声继续着。','傍晚，他们乘公交车回家。','第一次喜欢上了某个人。','短暂的对视也会留在记忆里很久。','这样的普通生活，就是他们想守护的未来。']},
{n:6,name:'PROJECT 0714 · 비밀 관찰',keys:['project 0714','0714'],en:'Someone was always watching from a distance. Do not interfere. Do not become emotionally involved. But the subjects slowly became people instead of numbers.',ko:['어딘가에서 그들의 하루가 기록되고 있습니다.','관찰자는 절대 개입하지 말라는 지시를 받습니다.','매일 같은 얼굴과 웃음을 지켜봅니다.','보고서에는 숫자와 평가만 남아야 합니다.','하지만 관찰자의 마음이 조금씩 흔들립니다.','그들은 더 이상 대상이 아니라 사람으로 보입니다.'],zh:['在某个地方，他们的日常一直被记录。','观察者接到命令：绝对不要干预。','每天看着同样的面孔和笑容。','报告中本应只留下数字和评估。','但观察者的内心开始动摇。','他们不再只是目标，而是真正的人。']},
{n:7,name:'제3차 지구미래 대책회의',keys:['third earth future council','future council','제3차','3차 지구미래','지구미래 대책회의'],en:'The third meeting asked a heavier question. Should the human body be changed in order to survive? Survival and human dignity collided.',ko:['세 번째 회의의 분위기는 이전보다 무겁습니다.','극한 환경에서 살아남을 방법이 논의됩니다.','인간의 몸을 바꿔도 되는가라는 질문이 등장합니다.','생존 가능성과 인간의 존엄이 충돌합니다.','동의와 거부권을 보장해야 한다는 의견이 나옵니다.','미래를 위한 준비가 사람을 도구로 만들어서는 안 됩니다.'],zh:['第三次会议的气氛比以往更加沉重。','人们开始讨论如何在极端环境中生存。','一个问题被提出：可以改变人的身体吗？','生存可能性与人的尊严发生冲突。','有人坚持必须保障知情同意和拒绝的权利。','为了未来的准备，绝不能把人变成工具。']}];
const E=id=>document.getElementById(id);let songs=load(KEY),comics=load(CMETA),audio=null,aurl=null,current=-1,currentScene=1,currentComicPos=0,timer=null,sceneEndTimer=null,autoMode=null,queuePos=0,objUrl=null,runToken=0;function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v));render()}function natural(a,b){return a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'})}function normalizeName(s){return(s||'').toLowerCase().replace(/[_.()\-]+/g,' ').replace(/\s+/g,' ').trim()}function sceneForSong(name){let t=normalizeName(name);for(let s of SCRIPT)if(s.keys.some(k=>t.includes(normalizeName(k))))return s.n;return 0}function explicitNo(n){let m=(n||'').match(/(?:FTF|S|SCENE)?[-_\s]*0?(\d{1,3})/i);return m?+m[1]:99}function songCmp(a,b){let sa=sceneForSong(a.fileName||a.title),sb=sceneForSong(b.fileName||b.title);if(sa!==sb)return(sa||99)-(sb||99);return natural(a.fileName||a.title,b.fileName||b.title)}function comicScene(n){let x=explicitNo(n);return x>=1&&x<=7?x:0}function assign(arr){let u=arr.filter(x=>!x.scene).sort((a,b)=>natural(a.name,b.name));u.forEach((x,i)=>x.scene=Math.min(7,Math.floor(i*7/u.length)+1));return arr.sort((a,b)=>(a.scene-b.scene)||natural(a.name,b.name))}
function dbOpen(n,s){return new Promise((ok,no)=>{let r=indexedDB.open(n,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbPut(n,s,k,v){let d=await dbOpen(n,s);await new Promise(ok=>{let t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=ok});d.close()}async function dbGet(n,s,k){let d=await dbOpen(n,s);let v=await new Promise(ok=>{let r=d.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)});d.close();return v}async function dbClear(n,s){let d=await dbOpen(n,s);await new Promise(ok=>{let t=d.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=ok});d.close()}
function builtInSvg(n,cut){let sc=SCRIPT[n-1],sym=[['EARTH','OCEAN','ICE','FIRE','RAIN','WARNING'],['ARKA','WIND','THUNDER','FLOOD','EVAC','CITY'],['SECRET','WORLD','200','QUESTION','PLAN','CLASSIFIED'],['MEETING II','5 YEARS','AGE 17','SCHOOL','DAILY LIFE','UNKNOWN'],['SCHOOL','FRIENDS','BUS','FIRST LOVE','GLANCE','FUTURE'],['CAMERA','WATCH','RECORD','REPORT','DOUBT','HUMAN'],['MEETING III','SURVIVE','CHANGE?','DIGNITY','CONSENT','HUMAN']][n-1][cut],pal=[['#06233e','#0b6fa4'],['#101827','#284b69'],['#141824','#3c4659'],['#17142a','#4d356e'],['#35232b','#975f6f'],['#111b22','#38505e'],['#1c162a','#5a4774']][n-1];let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600"><defs><linearGradient id="g"><stop stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="900" height="1600" fill="url(#g)"/><circle cx="450" cy="700" r="310" fill="#ffffff10" stroke="#ffffff30" stroke-width="8"/><text x="450" y="170" text-anchor="middle" fill="#fff" font-size="48" font-family="Arial" font-weight="800">${sc.name}</text><text x="450" y="250" text-anchor="middle" fill="#ccecff" font-size="30" font-family="Arial">FOR THE FUTURE</text><text x="450" y="730" text-anchor="middle" fill="#fff" font-size="95" font-family="Arial" font-weight="800">${sym}</text><text x="450" y="900" text-anchor="middle" fill="#fff" font-size="38" font-family="Arial">CUT ${String(cut+1).padStart(2,'0')} / 06</text><rect x="90" y="1080" width="720" height="230" rx="35" fill="#0008"/><text x="450" y="1180" text-anchor="middle" fill="#fff" font-size="38" font-family="Arial" font-weight="700">SCENE ${String(n).padStart(2,'0')}</text><text x="450" y="1250" text-anchor="middle" fill="#bde6ff" font-size="27" font-family="Arial">RADIO COMIC MOVIE</text></svg>`;return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function render(){songs.sort(songCmp);E('musicCount').textContent=`현재 음악 ${songs.length}곡`;E('comicCount').textContent=`기본 만화 ${SCRIPT.length*CUTS}컷 · 추가 ${comics.length}장`;E('scripts').innerHTML=SCRIPT.map(s=>`<div class="script"><span class="sn">대본 ${String(s.n).padStart(2,'0')}</span> · <b>${s.name}</b><div class="meta">6컷 · English narration · KR/中文</div></div>`).join('');E('storyList').innerHTML=SCRIPT.map(s=>{let mi=sceneSong(s.n);return`<div class="script"><b>${s.n}. ${s.name}</b><div class="meta">🎵 ${mi>=0?(songs[mi].title||songs[mi].fileName):'연결곡 없음'}</div><div class="actions"><button onclick="playScene(${s.n},'radio',false)">▶ 장면재생</button></div></div>`}).join('');E('songList').innerHTML=songs.map(s=>{let sn=sceneForSong(s.fileName||s.title);return`<div class="song"><b>${sn?`대본 ${String(sn).padStart(2,'0')} · `:'미연결 · '}${s.title||s.fileName}</b></div>`}).join('')||'<div class="note">음악 파일을 선택해 주세요.</div>'}
function sceneComics(n){return comics.filter(x=>x.scene===n).sort((a,b)=>natural(a.name,b.name))}function sceneSong(n){return songs.findIndex(x=>sceneForSong(x.fileName||x.title)===n)}async function showComic(c,n,cut){let sc=SCRIPT[n-1],ci=Math.max(0,Math.min(5,cut));E('viewer').classList.add('show');E('viewerTitle').textContent=sc.name;E('viewerStatus').textContent=`대본 ${String(n).padStart(2,'0')} · ${c?'추가 만화':`기본 만화 ${ci+1}/6`}`;E('captionKo').innerHTML='<span class="langtag">KR</span>'+sc.ko[ci];E('captionZh').innerHTML='<span class="langtag">中文</span>'+sc.zh[ci];if(!c){E('comicImg').src=builtInSvg(n,ci);return}let f=await dbGet(CDB,CST,c.id);if(f){if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);E('comicImg').src=objUrl}else E('comicImg').src=builtInSvg(n,ci)}
function clearRunTimers(){clearInterval(timer);clearTimeout(sceneEndTimer);timer=null;sceneEndTimer=null}function slideshow(n){clearInterval(timer);let a=sceneComics(n);currentComicPos=0;showComic(a[0]||null,n,0);timer=setInterval(()=>{currentComicPos=(currentComicPos+1)%CUTS;showComic(a.length?a[currentComicPos%a.length]:null,n,currentComicPos)},CUT_MS)}
function speakEnglish(text,done){let finished=false;const finish=()=>{if(finished)return;finished=true;clearTimeout(fallback);done&&done()};speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.84;u.pitch=.94;let v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('en'));if(v)u.voice=v;u.onend=finish;u.onerror=finish;let fallback=setTimeout(finish,Math.max(9000,text.length*95));try{speechSynthesis.speak(u);setTimeout(()=>{if(speechSynthesis.paused)speechSynthesis.resume()},250)}catch(e){finish()}}
function stopAudio(){if(audio){audio.pause();audio.src='';audio=null}if(aurl){URL.revokeObjectURL(aurl);aurl=null}}async function playSong(i,done){stopAudio();if(i<0)return done&&done();let f=await dbGet(ADB,AST,songs[i].id);if(!f)return done&&done();aurl=URL.createObjectURL(f);audio=new Audio(aurl);let ended=false,finish=()=>{if(ended)return;ended=true;done&&done()};audio.onended=finish;audio.onerror=finish;try{await audio.play();current=i;E('pause').textContent='⏸ 일시정지'}catch(e){finish()}}
function finishScene(token){if(token!==runToken)return;clearRunTimers();if(autoMode){queuePos++;if(queuePos<SCRIPT.length)playScene(queuePos+1,autoMode,true);else{autoMode=null;E('now').textContent='전체 재생 완료'}}}
function playScene(n,mode='radio',automatic=false){runToken++;let token=runToken;clearRunTimers();speechSynthesis.cancel();stopAudio();currentScene=n;currentComicPos=0;slideshow(n);let sc=SCRIPT[n-1],i=sceneSong(n);E('now').textContent=`${sc.name} · ${mode==='radio'?'English narration':'Music'}`;let hardLimit=()=>{sceneEndTimer=setTimeout(()=>finishScene(token),CUTS*CUT_MS+2500)};if(mode==='radio'){hardLimit();speakEnglish(sc.en,()=>{if(token!==runToken)return;if(i>=0)playSong(i,()=>finishScene(token));else{/* no matching song: slideshow timer decides scene length */}})}else{hardLimit();if(i>=0)playSong(i,()=>finishScene(token))}}
function startAuto(mode){autoMode=mode;queuePos=0;playScene(1,mode,true)}
E('startPrimary').onclick=()=>startAuto('radio');E('startSecondary').onclick=()=>startAuto('movie');E('narrTest').onclick=()=>{autoMode=null;playScene(1,'radio',false)};E('stopAll').onclick=()=>{runToken++;autoMode=null;clearRunTimers();speechSynthesis.cancel();stopAudio()};E('pickMusic').onclick=()=>E('musicFiles').click();E('musicFiles').onchange=async()=>{let fs=[...E('musicFiles').files].sort((a,b)=>songCmp({fileName:a.name},{fileName:b.name}));await dbClear(ADB,AST);songs=[];for(let f of fs){let id=crypto.randomUUID();songs.push({id,title:f.name.replace(/\.[^.]+$/,''),fileName:f.name});await dbPut(ADB,AST,id,f)}save(KEY,songs);E('musicFiles').value=''};E('pickComic').onclick=()=>E('comicFiles').click();E('comicFiles').onchange=async()=>{let fs=assign([...E('comicFiles').files].map(f=>({f,name:f.name,scene:comicScene(f.name)})));await dbClear(CDB,CST);comics=[];for(let x of fs){let id=crypto.randomUUID();comics.push({id,name:x.name,scene:x.scene});await dbPut(CDB,CST,id,x.f)}save(CMETA,comics)};E('deleteMusic').onclick=async()=>{if(confirm('음악 전체 삭제?')){await dbClear(ADB,AST);songs=[];save(KEY,songs)}};E('deleteComic').onclick=async()=>{if(confirm('추가 만화 삭제?')){await dbClear(CDB,CST);comics=[];save(CMETA,comics)}};E('prev').onclick=()=>playSong(Math.max(0,current-1));E('next').onclick=()=>playSong(Math.min(songs.length-1,current+1));E('pause').onclick=()=>{if(!audio)return;if(audio.paused){audio.play();E('pause').textContent='⏸ 일시정지'}else{audio.pause();E('pause').textContent='▶ 재생'}};E('openComic').onclick=()=>showComic(null,currentScene,currentComicPos);E('closeViewer').onclick=()=>E('viewer').classList.remove('show');E('backup').onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify({version:14,songs,comics},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='FTF_backup_v14.json';a.click()};E('restore').onclick=()=>E('restoreFile').click();E('restoreFile').onchange=async e=>{let d=JSON.parse(await e.target.files[0].text());songs=d.songs||[];comics=d.comics||[];save(KEY,songs);save(CMETA,comics)};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));comics=assign(comics);render();
</script></body></html>
